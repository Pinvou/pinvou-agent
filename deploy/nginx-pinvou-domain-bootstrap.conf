# pinvou.com 首次签发 HTTPS 证书前的 HTTP 配置。
# 安装到 /etc/nginx/sites-available/pinvou，并创建到 sites-enabled 的软链接。
# 证书签发成功后，用 nginx-pinvou-domain.conf 替换本文件。

server {
    listen 80;
    server_name pinvou.com www.pinvou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://pinvou.com$request_uri;
    }
}
