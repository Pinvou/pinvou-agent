# PINVOU A2A collaboration relay. This is independent from /pinvou3/remote,
# /pinvou3/telemetry, and /pinvou3/stats.
location = /pinvou3/collaboration {
    return 301 /pinvou3/collaboration/;
}

location ^~ /pinvou3/collaboration/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /pinvou3/collaboration/ws {
    proxy_pass http://127.0.0.1:8790/pinvou3/collaboration/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
