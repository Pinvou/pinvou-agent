# pinvou.com 正式 HTTPS 入口。
# OTA/模型文件仍复用 /var/www/pinvou3，Relay/遥测仍反向代理到
# 47.120.8.237:8787；域名迁移不复制文件、不迁移后端数据。

server {
    listen 80;
    server_name pinvou.com www.pinvou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://pinvou.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pinvou.com www.pinvou.com;

    ssl_certificate     /etc/letsencrypt/live/pinvou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinvou.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;
    access_log /var/log/nginx/pinvou.access.log;
    error_log  /var/log/nginx/pinvou.error.log;

    include /etc/nginx/snippets/pinvou3-remote-relay.conf;
    include /etc/nginx/snippets/pinvou3-telemetry-stats.conf;
    include /home/admin/pinvou3-deploy/nginx-pinvou3-updates.conf;

    # 品牌首页不在本次域名迁移范围；避免落入其他站点的默认 root。
    location / {
        return 404;
    }
}
