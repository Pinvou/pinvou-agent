# pinvou3 更新源 — 静态托管 latest.json + deb。
# include 进 pinvou.com 的 HTTPS server block。迁移期旧域名的 server block
# 也继续 include 本文件，保证旧版客户端可以完成升级。
# 前提: sudo mkdir -p /var/www/pinvou3 && sudo chown admin:admin /var/www/pinvou3
#       （release-deb.sh 以 admin 身份 rsync 直传,无需 sudo）

# 清单不缓存:客户端每次检查都要拿最新版本
location = /pinvou3/latest.json {
    alias /var/www/pinvou3/latest.json;
    add_header Cache-Control "no-cache";
}

# deb 包(文件名带版本号,内容不可变,可放心长缓存)
location /pinvou3/ {
    alias /var/www/pinvou3/;
    autoindex off;
}
