# Float on `stable`, matching pinvou3-app/src-tauri/rust-toolchain.toml
# and CodeWhale/rust-toolchain.toml: one floating rustc across the repo.
# The MSRV floor stays in Cargo.toml (rust-version = 1.89), which still
# pins the oldest supported compiler. clippy / rustfmt back the lint
# gates.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
