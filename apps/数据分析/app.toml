[app]
name = "数据分析"
description = "分析数据文件，生成可视化报告"
icon = "📊"
model_preference = "large"
granularity = "medium"
confirm_at = ["visualize"]
prompt_file = "prompt.md"
tools = ["file_read", "shell", "python", "request_user_input"]

[app.planning]
mode = "dynamic_with_static_fallback"
confirm_dynamic_plan = false
max_plan_retries = 2

[[milestones]]
id = "upload"
label = "上传数据"
prompt_hint = "引导用户提供数据文件路径"
contract_mode = "collect"
question_budget = 1
allowed_tools = ["request_user_input"]
advance_policy = "on_choice"

[[milestones]]
id = "explore"
label = "数据浏览"
prompt_hint = "对数据做初步探索，展示行数、列名、统计摘要"
contract_mode = "collect"
question_budget = 1
allowed_tools = ["file_read", "request_user_input"]
advance_policy = "on_choice"

[[milestones]]
id = "analyze"
label = "分析"
prompt_hint = "根据用户需求进行深入分析，输出表格和文字解读"
contract_mode = "freeform"
question_budget = 0
allowed_tools = ["python", "shell"]
output_requirements = ["must_contain_table", "no_open_question"]
advance_policy = "on_valid_output"

[[milestones]]
id = "visualize"
label = "可视化"
prompt_hint = "生成图表（柱状图、折线图、散点图等）"
contract_mode = "freeform"
question_budget = 0
allowed_tools = ["python", "shell"]
output_requirements = ["no_open_question"]
advance_policy = "on_valid_output"

[[milestones]]
id = "export"
label = "导出报告"
prompt_hint = "将分析结果整理为 markdown 报告或导出图片"
contract_mode = "final_output"
question_budget = 0
allowed_tools = []
output_requirements = ["no_tool_call"]
advance_policy = "on_valid_output"
