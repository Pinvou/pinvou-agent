name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  signoff:
    name: Signed-off commits
    runs-on: ubuntu-latest
    steps:
      - name: Verify DCO sign-offs
        uses: actions/github-script@v9
        with:
          script: |
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );

            const signoff = /^Signed-off-by:\s+.+\s+<[^<>@\s]+@[^<>\s]+>$/im;
            const trustedBots = new Set([
              "dependabot[bot]",
              "github-actions[bot]",
            ]);
            const unsigned = commits.filter(({ author, committer, commit }) => {
              const login = author?.login ?? committer?.login;
              return !trustedBots.has(login) && !signoff.test(commit.message);
            });

            if (unsigned.length > 0) {
              const list = unsigned
                .map(({ sha, commit }) => `- ${sha.slice(0, 12)} ${commit.message.split("\n", 1)[0]}`)
                .join("\n");
              core.setFailed(`The following commits are missing a valid Signed-off-by trailer:\n${list}`);
            }
