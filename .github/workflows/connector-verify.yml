name: connector CLI verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/connector-verify.yml"
      - "scripts/fetch-connectors.sh"
      - "pinvou3-app/src-tauri/resources/platforms/**/bundle/connectors/**"
      - "pinvou3-app/src-tauri/src/platform/paths.rs"
      - "pinvou3-app/src-tauri/src/features/connectors/connector_cli.rs"
      - "pinvou3-app/src-tauri/src/features/connectors/native_installer.rs"
      - "pinvou3-app/scripts/prepare-codex-bridge-runtime.sh"
      - "pinvou3-app/src-tauri/src/platform/os/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/connector-verify.yml"
      - "scripts/fetch-connectors.sh"
      - "pinvou3-app/src-tauri/resources/platforms/**/bundle/connectors/**"
      - "pinvou3-app/src-tauri/src/platform/paths.rs"
      - "pinvou3-app/src-tauri/src/features/connectors/connector_cli.rs"
      - "pinvou3-app/src-tauri/src/features/connectors/native_installer.rs"
      - "pinvou3-app/scripts/prepare-codex-bridge-runtime.sh"
      - "pinvou3-app/src-tauri/src/platform/os/**"

permissions:
  contents: read

# Cancel superseded runs for the same ref to avoid queueing and wasted runner
# minutes. Only PR runs may cancel each other: on main pushes github.ref is
# refs/heads/main, so an unconditional cancel would let rapid successive main
# pushes kill each other's runs (same failure class pr-check guards against).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-connectors:
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-arm64: 2026-11 起跑在免费 x86_64 ubuntu-22.04 上,qemu-user
            # + binfmt 真实执行 aarch64 CLI(can_run 保持 true,覆盖不降级);
            # 动态链接的 Go CLI(dws/lark-cli)需要 libc6:arm64 提供的
            # /lib/ld-linux-aarch64.so.1,见下方准备步骤。arm 托管 runner
            # 按分钟计费(2026-10 该腿 ~$16/月),交叉后归零。
          - platform: linux-arm64
            runs-on: ubuntu-22.04
            resources: linux/aarch64
            suffix: ""
            can_run: true
          - platform: linux-x64
            runs-on: ubuntu-22.04
            resources: linux/x86_64
            suffix: ""
            can_run: true
          - platform: darwin-arm64
            runs-on: macos-15
            resources: macos/aarch64
            suffix: ""
            can_run: true
          - platform: darwin-x64
            # macos-15-intel: the standard Intel image (still free for public
            # repos) actually executes the pinned x86_64 CLIs. On the arm64
            # image this leg could only sha256/file-check them (can_run was
            # false); Rosetta is not guaranteed on hosted images, so a real
            # Intel runner is the honest way to run them. Transition note:
            # Intel macOS images end with the macos-15 image generation
            # (~2027) — before that sunset, re-home this leg (arm64 image
            # once Rosetta is guaranteed, or fold the execution check away).
            runs-on: macos-15-intel
            resources: macos/x86_64
            suffix: ""
            can_run: true
          - platform: windows-x64
            runs-on: windows-latest
            resources: windows/x86_64
            suffix: .exe
            can_run: true
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up zram and swap
        if: runner.os == 'Linux'
        # Best effort: timeouts or failures only warn and never block (falls back to stock runner memory).
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup did not finish; continuing with stock runner memory"

      # 仅 linux-arm64 腿需要:注册 binfmt 后 aarch64 ELF 透明执行。
      # Ubuntu 主档案无 arm64 包,libc6:arm64 走 ports.ubuntu.com 的
      # [arch=arm64] 源(既有源钉回 amd64/i386,同 pinvou-agent 的 arm64
      # 交叉构建方案);wecom-cli 静态链接直接可跑,dws/lark-cli 动态链接
      # 需要 arm64 解释器与 glibc。
      - name: Set up aarch64 binfmt emulation (linux-arm64 leg only)
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          sudo sed -i -E 's|^deb ([^[[:space:]])|deb [arch=amd64,i386] \1|' /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list.d/arm64.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support libc6:arm64
          sudo update-binfmts --enable qemu-aarch64 || true
          # 冒烟:确认 aarch64 ELF 能透明执行(动态/静态各验一个)。
          file /lib/ld-linux-aarch64.so.1 2>/dev/null || ls /usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1
          /usr/bin/qemu-aarch64-static --version | head -1

      - name: Download pinned connector binaries
        # windows runner 默认 pwsh 无法直接执行 .sh,必须显式走 bash。
        shell: bash
        run: ./scripts/fetch-connectors.sh --platform ${{ matrix.platform }}

      - name: Inspect prepared binaries
        shell: bash
        run: |
          set -eux
          ./scripts/fetch-connectors.sh --platform ${{ matrix.platform }} --check
          BIN="pinvou3-app/src-tauri/resources/platforms/${{ matrix.resources }}/bundle/connectors/${{ matrix.platform }}/bin"
          ls -la "$BIN"
          file "$BIN/dws${{ matrix.suffix }}" "$BIN/lark-cli${{ matrix.suffix }}" "$BIN/wecom-cli${{ matrix.suffix }}" || true

      - name: Simulate first-use managed install
        shell: bash
        run: |
          set -eux
          SRC="pinvou3-app/src-tauri/resources/platforms/${{ matrix.resources }}/bundle/connectors/${{ matrix.platform }}/bin"
          DEST="$HOME/.pinvou3/connectors/${{ matrix.platform }}/bin"
          mkdir -p "$DEST"
          for cli in dws lark-cli wecom-cli; do
            cp "$SRC/$cli${{ matrix.suffix }}" "$DEST/"
            chmod 755 "$DEST/$cli${{ matrix.suffix }}" || true
          done

      - name: Run managed CLIs without system npm
        if: matrix.can_run
        shell: bash
        run: |
          set -eux
          BIN="$HOME/.pinvou3/connectors/${{ matrix.platform }}/bin"
          env -i HOME="$HOME" PATH="/usr/sbin:/usr/bin:/sbin:/bin" "$BIN/dws${{ matrix.suffix }}" version
          env -i HOME="$HOME" PATH="/usr/sbin:/usr/bin:/sbin:/bin" "$BIN/lark-cli${{ matrix.suffix }}" --version
          env -i HOME="$HOME" PATH="/usr/sbin:/usr/bin:/sbin:/bin" "$BIN/wecom-cli${{ matrix.suffix }}" --version
