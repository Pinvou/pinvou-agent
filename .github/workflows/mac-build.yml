name: mac-build

# macOS arm64 编译验证工作流(独立于 pr-check.yml 的秒级 fast-gate,不挤 ubuntu runner)。
# 仅在相关改动进入 main 后触发,不作为 PR 检测项。
# runner:macos-14(GitHub-hosted Apple Silicon,M Series)。
#
# 与 pr-check.yml 的 rust-test 关系:
# - rust-test 在 ubuntu 上跑完整 lib tests(含 Linux-only eip/zhidao 等),是主线 gate。
# - mac-build 在 macos-14 上只跑 cargo check + cargo test --lib + cargo build --release,
#   验证 macOS 平台目标零回归。
# - mac-build 不跑 relay e2e(那需要 remote-control-relay 的 node_modules,mac-build 不装
#   该依赖)。因此不设 PINVOU_REQUIRE_REMOTE_E2E,让 e2e 测试在缺依赖时静默跳过而非 panic。

on:
  push:
    branches: [main]
    paths:
      - 'pinvou3-app/src-tauri/**'
      - 'pinvou3-app/src/**'
      - 'pinvou3-app/package.json'
      - 'pinvou3-app/package-lock.json'
      - 'DeepSeek-TUI'
      - '.github/workflows/mac-build.yml'
      - 'scripts/run-mac-verify.sh'
      - 'scripts/release-macos.sh'

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 50
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        # 本工作流仅在 main 上运行,统一写入 main 作用域缓存。
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou3-app/src-tauri
          shared-key: mac-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # macOS 27+ 兼容:dyld 新增 LINKEDIT 字符串池 8 字节对齐校验,而 release 默认
      # strip=debuginfo 会让 proc-macro dylib dlopen 被拒 → E0463(macOS ≤26 无此校验)。
      # runner 目前是 macos-14(不受影响),但 GitHub 升级 runner 到 macOS 27+ 时若缺此
      # 注入,cargo build --release 会硬失败(该 step 无 continue-on-error)。
      # 同 release-macos.sh 的 workaround;详见该脚本「问题 A」注释。等上游修后可移除。
      - name: macOS 27+ strip workaround
        run: |
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 27 ] 2>/dev/null; then
            echo "CARGO_PROFILE_RELEASE_STRIP=none" >> "$GITHUB_ENV"
            echo "RUSTFLAGS=-C strip=none" >> "$GITHUB_ENV"
            echo "⚠️ macOS $(sw_vers -productVersion) → 注入 strip=none(绕过 dyld 对齐校验)"
          else
            echo "✓ macOS $(sw_vers -productVersion),保留默认 strip"
          fi

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # bge-m3 是 gitignored 大资源(559MB),CI 干净 checkout 没有它,
      # 而 tauri_build::build() 会校验 tauri.conf resources 路径存在。
      # 造空占位文件骗过资源校验即可(同 pr-check.yml 的 linux rust-test)。
      - name: bge-m3 占位 (骗过 tauri-build 资源校验)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      - name: Cargo check (aarch64-apple-darwin)
        working-directory: pinvou3-app/src-tauri
        run: cargo check --target aarch64-apple-darwin --lib

      - name: Cargo test (Mac native, lib)
        working-directory: pinvou3-app/src-tauri
        run: cargo test --target aarch64-apple-darwin --lib -- --test-threads=1

      - name: Cargo build release
        working-directory: pinvou3-app/src-tauri
        run: cargo build --release --target aarch64-apple-darwin --lib

      # tauri bundle smoke:验证 dmg/app 实际打包链路(Info.plist/entitlements/资源打包)。
      # 只在 main push 跑,不阻塞 PR;且 continue-on-error:
      # 产物本身在 release-macos.sh 发版时才用到,smoke 失败不应挡主线合并。
      - name: Tauri bundle smoke (验证 dmg/app 打包,仅 main push)
        if: github.ref == 'refs/heads/main'
        working-directory: pinvou3-app
        run: npx tauri build --target aarch64-apple-darwin
        continue-on-error: true

      # Verify 脚本:轻量探测(brew/connector CLI) + 核心校验(sha256/plist/bundle targets)。
      # 核心校验失败会 exit 1,挡 build(此前 continue-on-error 让 sha256/plist 失败也变绿)。
      # if: always():上游 cargo check/test/build 失败时仍跑 verify,确保 sha256/plist/bundle
      #   target/CFBundleIdentifier 核心校验不被 skip(verify 内部自带 --skip-test,不依赖上游产物)。
      # --skip-test:上游已跑 cargo check+test,verify 不重复(省 ~10min),只跑探测 + 核心校验。
      - name: Verify 脚本 (sha256/plist/bundle targets 校验)
        if: always()
        run: ./scripts/run-mac-verify.sh --skip-test
