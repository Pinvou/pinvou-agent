name: cache-janitor

# Periodic cleanup of Actions caches (10GB quota protection); the rules are
# implemented in scripts/cache-janitor.sh:
# - All caches in closed/merged PR scopes (PR caches are invisible to each
#   other; once a PR closes they are dead weight);
# - codeql-overlay keeps only the newest entry per language per scope;
#   node-cache keeps only the newest entry per platform per scope
#   (grouped by scope: keeping only the newest across refs would swap a
#   main-usable cache for a PR-scoped one main cannot read);
# - v0-rust-* keeps only the newest generation per series per scope (new in
#   2026-10: the two rust-lint-v2 generations alone held 4.2GB ≈ 42% of the
#   quota; the old "whole-series protection" became a "dedup" — under the
#   chronically over-quota state (measured 10.7/10GB) LRU kept evicting the
#   most valuable windows/macos caches).
# Daily since 2026-10: on a weekly cadence, PR npm caches + the codeql
# overlay grew 1.5-2.5GB per week — exactly enough to blow the quota between
# cleanups (measured 2026-10-01: the windows cache was evicted that day).
# Manual dispatch defaults to dry-run (print only, no deletion); disable
# dry-run to delete for real after reviewing the output.

on:
  schedule:
    - cron: '23 3 * * *'   # daily 03:23 (off the hour/half-hour peaks; was weekly)
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只打印不删除(true/false)'
        type: boolean
        default: true

permissions:
  actions: write       # gh cache delete
  contents: read
  pull-requests: read  # 查 PR 开关状态

concurrency:
  # If a manual dispatch overlaps the scheduled run, double execution only
  # re-warns on already-deleted ids (guarded, harmless), but serial queueing
  # is the simpler shape: the cleanup itself takes minutes, queueing is free.
  group: cache-janitor
  cancel-in-progress: false

jobs:
  clean:
    name: clean
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up zram and swap
        # Best effort: timeouts or failures only warn and never block (falls back to stock runner memory).
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup did not finish; continuing with stock runner memory"

      - name: 清理缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry-run }}" = "false" ]; then
            bash scripts/cache-janitor.sh
          else
            bash scripts/cache-janitor.sh --dry-run
          fi
