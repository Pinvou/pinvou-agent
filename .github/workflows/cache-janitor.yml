name: cache-janitor

# Actions 缓存定期清理(10GB 配额保护),规则实现见 scripts/cache-janitor.sh:
# - 已关闭/合并 PR 作用域的全部缓存(PR 缓存互不可见,关闭后即死重);
# - codeql-overlay 每语言每作用域只留最新 1 份;node-cache 每平台每作用域只留最新 1 份
#   (按作用域分组:跨 ref 只留最新会把 main 的可用缓存误换成 PR 作用域的);
# - v0-rust-* 每系列每作用域只留最新 1 代(2026-10 新增:单是 rust-lint-v2 的两个
#   代就占 4.2GB=38% 配额;旧的「整系列保护」改为「去重」——配额常态超额
#   (实测 10.7/10GB)下 LRU 一直在驱逐最有价值的 windows/macos 缓存)。
# 2026-10 起每日运行:周更节奏下,PR npm 缓存 + codeql overlay 每周 1.5-2.5GB
# 的增量正好在两次清理之间把配额顶爆(2026-10-01 实测当天驱逐 windows 缓存)。
# 手动触发默认 dry-run(只打印不删除),确认后可关 dry-run 实删。

on:
  schedule:
    - cron: '23 3 * * *'   # 每日 03:23(避开整点/半点高峰;原为周更)
  workflow_dispatch:
    inputs:
      dry-run:
        description: '只打印不删除(true/false)'
        type: boolean
        default: true

permissions:
  actions: write       # gh cache delete
  contents: read
  pull-requests: read  # 查 PR 开关状态

jobs:
  clean:
    name: clean
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up zram and swap
        # Best effort: timeouts or failures only warn and never block (falls back to stock runner memory).
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup did not finish; continuing with stock runner memory"

      - name: 清理缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry-run }}" = "false" ]; then
            bash scripts/cache-janitor.sh
          else
            bash scripts/cache-janitor.sh --dry-run
          fi
