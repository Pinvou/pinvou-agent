name: PR Check

# Jobs:
# - fast-gate(秒级,每 PR 都跑):fork-guard 指纹 + fork 合规联动 + Python 确定性测试。
# - changes:检测本 PR 有没有 Rust/依赖、L1 harness 或前端改动,给编译/前端 job 做 paths filter。
# - frontend-test:前端/Relay/WebUI 改动时跑 lint、构建、逻辑测试和浏览器旅程。
# - rust-test(编译类):**仅当改了 Rust/Cargo/submodule 才跑**(非 Rust PR 直接 skip,不耗
#   编译时间)。占位 bge-m3 → cargo test --lib(~240 单测;真 bge-m3/vLLM 测试已 #[ignore])。
# - required-gate:汇总所有适用检查，作为 PR 与 Merge Queue 的唯一 required check。
# - merge_group:进入 Merge Queue 后基于最新 main 跑完整检查，不要求开放 PR 反复 rebase。
# 未上:clippy/fmt(现有代码各 75/329 处不符合,要先清理才能加 -D gate)。
#
# Cache 策略(2026-07 诊断:PR cache 挂 refs/pull/N/merge 作用域互不可见 + 1.3GB/份
# 顶死 10GB 限额被 LRU 秒驱逐 → 每轮全冷编译 ~9min):
# - push main 也跑 rust-test:cache 存 main 作用域,所有 PR 都读得到(暖 cache 唯一来源)。
# - save-if 仅 main:PR 侧只读不写,不再刷爆限额挤掉暖 cache。
# - rust-cache 的 restore 有前缀回退(restoreKey 不含 lockfile hash),PR 改 Cargo.lock
#   也能从 main cache 增量编译,不再全冷。

on:
  pull_request:
    branches: [main]
    # closed 事件会进入同一个 concurrency group，及时取消已合并/关闭 PR 的旧任务。
    types: [opened, synchronize, reopened, closed]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]   # 暖 cache:见上方 Cache 策略

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter 调 API 读 PR 改了哪些文件

# 同一 PR 连续 push 或被合并/关闭时,取消上一次未跑完的检查,省 runner。
# main push 使用 refs/heads/main 分组，不会被 PR closed 事件取消，仍跑完整 Rust 验证。
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR 按路径选择检查；Merge Queue 对最新 main 组合跑完整检查。
  changes:
    name: changes
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.rust }}
      l1: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.l1 }}
      pet: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.pet }}
      frontend: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.frontend }}
      diff_viewer: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.diff_viewer }}
      relay: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.relay }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/tauri.conf.json'
              - 'pinvou3-app/src/web-access-policy.json'
              - 'DeepSeek-TUI'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/mac-build.yml'
            l1:
              - 'pinvou3-app/src-tauri/tests/l1_dialog_harness.rs'
              - 'pinvou3-app/src-tauri/src/bridge/**'
              - 'pinvou3-app/src-tauri/src/engine.rs'
              - 'pinvou3-app/src-tauri/src/harness.rs'
              - 'pinvou3-app/src-tauri/src/lib.rs'
              - 'pinvou3-app/src-tauri/Cargo.toml'
              - 'pinvou3-app/src-tauri/Cargo.lock'
              - 'DeepSeek-TUI'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/mac-build.yml'
            pet:
              - 'pinvou3-app/src/assets/pet/**'
              - 'pinvou3-app/src/features/pet/**'
              - 'pinvou3-app/src/features/chat/ChatView.jsx'
              - 'pinvou3-app/src/features/settings/SettingsView.jsx'
              - 'pinvou3-app/src/hooks/useReducedMotion.js'
              - 'pinvou3-app/src/index.html'
              - 'pinvou3-app/src/main.jsx'
              - 'pinvou3-app/src/pet-*'
              - 'pinvou3-app/scripts/validate-pet-assets.mjs'
              - 'pinvou3-app/tests/pet_*'
              - 'pinvou3-app/src/tauri-bridge.js'
              - 'pinvou3-app/src-tauri/capabilities/default.json'
              - 'pinvou3-app/src-tauri/src/bridge/prefs.rs'
              - 'pinvou3-app/src-tauri/src/lib.rs'
              - 'pinvou3-app/src-tauri/src/pet_window.rs'
              - 'pinvou3-app/src-tauri/src/selected_pet.rs'
              - 'pinvou3-app/src-tauri/tauri.conf.json'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - 'pinvou3-app/vite.config.js'
              - 'pinvou3-app/eslint.config.mjs'
              - '.github/workflows/pr-check.yml'
            frontend:
              - 'pinvou3-app/src/**'
              - 'pinvou3-app/tests/**'
              - 'remote-control-relay/**'
              - 'scripts/deploy-remote-relay.sh'
              - 'scripts/run-user-journey-tests.sh'
              - 'scripts/mcp-server-contract-smoke.py'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - 'pinvou3-app/vite.config.js'
              - 'pinvou3-app/eslint.config.mjs'
              - 'pinvou3-app/src-tauri/tauri.conf.json'
              - '.github/workflows/pr-check.yml'
            diff_viewer:
              - 'pinvou3-app/src/features/tools/tool-common.jsx'
              - 'pinvou3-app/src/features/tools/tool-renderers.jsx'
              - 'pinvou3-app/src/features/tools/unified-diff-parser.js'
              - 'pinvou3-app/tests/diff_viewer_ui_smoke.mjs'
              - 'pinvou3-app/tests/fixtures/diff_viewer_smoke.*'
              - 'pinvou3-app/tests/unified_diff_parser.test.js'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - 'pinvou3-app/vite.config.js'
              - 'pinvou3-app/eslint.config.mjs'
              - '.github/workflows/pr-check.yml'
            relay:
              - 'remote-control-relay/**'
              - 'scripts/deploy-remote-relay.sh'
              - 'scripts/deploy-remote-relay-test.sh'
              - '.github/workflows/pr-check.yml'

  fast-gate:
    name: fast-gate
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (含 submodule,fork 为 public 直接拉)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: fork-guard 指纹层 (秒级,不编译)
        run: ./scripts/fork-guard.sh --fast

      - name: fork 合规联动 (gitlink ↔ fork-modifications)
        env:
          BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.base_ref }}
        run: |
          base_ref="${BASE_REF#refs/heads/}"
          ./scripts/ci-fork-link-check.sh "origin/$base_ref"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Session replay auditor 测试
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Python MCP server 测试 (mcp-servers/*/test_*.py)
        run: |
          python3 -m pip install --quiet python-pptx python-docx
          fail=0
          for t in pinvou3-app/resources/mcp-servers/*/test_*.py; do
            [ -f "$t" ] || continue
            echo "== $t =="
            ( cd "$(dirname "$t")" && python3 "$(basename "$t")" ) || fail=1
          done
          [ "$fail" -eq 0 ]

      - name: 内置 MCP 协议与产物契约
        run: python3 scripts/mcp-server-contract-smoke.py

  frontend-test:
    name: frontend-test
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pinvou3-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            pinvou3-app/package-lock.json
            remote-control-relay/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefer-offline --no-audit

      - name: 安装 Remote relay 依赖
        run: npm --prefix ../remote-control-relay ci --prefer-offline --no-audit

      - name: ESLint
        run: npm run lint:ui

      - name: Vite build
        run: npm run build:ui

      - name: 前端逻辑测试
        run: |
          npm test
          npm run test:markdown
          npm --prefix ../remote-control-relay test

      - name: 浏览器 smoke
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node tests/ui_smoke.js
          node tests/kb_smoke.js
          node tests/tool_store_smoke.js
          npm run test:webui
          node tests/detached_boot_smoke.js
          node tests/drag_gesture_smoke.js
          node tests/update_notice_ui_smoke.js
          node tests/scheduled_tasks_smoke.js
          node tests/pet_selector_ui_smoke.js

  relay-test:
    name: relay-test
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remote-control-relay/package-lock.json

      - name: 安装 relay 依赖
        run: npm --prefix remote-control-relay ci --prefer-offline --no-audit

      - name: Relay 与部署脚本回归
        run: |
          bash -n scripts/deploy-remote-relay.sh
          bash -n scripts/deploy-remote-relay-test.sh
          npm --prefix remote-control-relay test

  diff-viewer-test:
    name: diff-viewer-test
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.diff_viewer == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pinvou3-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefer-offline --no-audit

      - name: Diff parser、Lint 与构建
        run: |
          npm run test:diff-parser
          npm run lint:ui
          npm run build:ui

      - name: Diff viewer 浏览器 smoke
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npm run test:diff-ui

  pet-frontend-test:
    name: pet-frontend-test
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.pet == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pinvou3-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefer-offline --no-audit

      - name: 桌宠逻辑测试与资源校验
        run: npm test

      - name: Vite build
        run: npm run build:ui

      - name: 宠物选择器浏览器 smoke
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node tests/pet_selector_ui_smoke.js

  rust-test:
    name: rust-test
    needs: changes
    # PR:只在改了 Rust/Cargo/submodule 时跑;push main:恒跑(暖 cache)。
    # changes 在 push 时被 skip,需 !cancelled() 才能让本 job 不被连带 skip。
    if: ${{ !cancelled() && github.event.action != 'closed' && (github.event_name == 'push' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    env:
      # 测试编译不需要完整 debug info:line-tables-only 保留 panic 行号,
      # 编译提速 ~30%、target/cache 体积大减(限额内能容纳更多份)。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # pinvou3 编译链接的系统库(本地 pkg-config 实测:gtk/webkit/soup/rsvg/openssl/
      # X11×3/appindicator)。ubuntu runner 默认没装,否则 glib-sys 等 build script 失败。
      - name: 装 Tauri + pinvou3 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            librsvg2-dev libssl-dev \
            libx11-dev libxi-dev libxtst-dev \
            libayatana-appindicator3-dev \
            build-essential pkg-config

      # bge-m3 是 gitignored 大资源(559M),CI 干净 checkout 没有它,而 tauri_build::build()
      # 会校验 tauri.conf resources 路径存在。单测用 mem()=embedder None、不加载真模型,真
      # bge-m3/vLLM 的 e2e 测试都已 #[ignore] —— 故造空占位文件骗过资源校验即可(已实测可行)。
      - name: bge-m3 占位 (骗过 tauri-build 资源校验)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # remote_control 的真实 relay 下载 e2e 需要 node + relay 依赖,缺 node_modules/ws 时
      # 该 e2e 会自动 skip —— 装上依赖让 CI 真正执行它,而不是绿灯假过。
      - name: Node.js (relay e2e)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remote-control-relay/package-lock.json

      - name: relay 依赖 (真实 relay e2e)
        run: npm --prefix remote-control-relay ci --prefer-offline --no-audit

      - name: 浏览器驱动依赖 (真实 Chrome 下载 e2e)
        run: npm --prefix pinvou3-app ci --prefer-offline --no-audit

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou3-app/src-tauri
          # 稳定 key 前缀(跨 PR/push 一致);restore 按前缀回退,lock 变了也增量。
          shared-key: rust-test
          # 只在 main 保存(暖 cache 唯一来源);PR 侧只读,不占 10GB 限额。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --test-threads=1:bridge 测试读/写全局 env,并行会竞争(qwen_preset/vllm 等 flaky)。
      - name: cargo test --lib (真 bge-m3/vLLM 测试已 #[ignore])
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export PINVOU_REQUIRE_REMOTE_E2E=1
          cargo test --manifest-path pinvou3-app/src-tauri/Cargo.toml --lib -- --test-threads=1

      - name: L1 harness 严格错误回归（不调用真模型）
        # PR 仅在 harness 相关路径变化时跑；main push 恒跑，保留合并后的完整验证。
        if: ${{ github.event_name == 'push' || needs.changes.outputs.l1 == 'true' }}
        run: >-
          cargo test --manifest-path pinvou3-app/src-tauri/Cargo.toml
          --test l1_dialog_harness strict_mode_
          -- --test-threads=1

      - name: DeepSeek-TUI 定时任务运行时回归
        # 暂时关闭；底座对应运行时已回退，父仓后续另行收敛代码与 gitlink。
        if: ${{ false }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/pinvou3-app/src-tauri/target
        run: |
          cargo test --manifest-path DeepSeek-TUI/Cargo.toml -p codewhale-tui --lib automation_manager -- --test-threads=1
          cargo test --manifest-path DeepSeek-TUI/Cargo.toml -p codewhale-tui --lib task_manager -- --test-threads=1
          cargo test --manifest-path DeepSeek-TUI/Cargo.toml -p codewhale-tui --test task_executor_contract -- --test-threads=1

  required-gate:
    name: required-gate
    needs:
      - changes
      - fast-gate
      - frontend-test
      - relay-test
      - diff-viewer-test
      - pet-frontend-test
      - rust-test
    if: ${{ always() && ((github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    steps:
      - name: 汇总所有适用检查
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FAST_GATE_RESULT: ${{ needs.fast-gate.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          RELAY_RESULT: ${{ needs.relay-test.result }}
          DIFF_VIEWER_RESULT: ${{ needs.diff-viewer-test.result }}
          PET_RESULT: ${{ needs.pet-frontend-test.result }}
          RUST_RESULT: ${{ needs.rust-test.result }}
        run: |
          if [[ "$CHANGES_RESULT" != success || "$FAST_GATE_RESULT" != success ]]; then
            echo "基础检查失败: changes=$CHANGES_RESULT fast-gate=$FAST_GATE_RESULT" >&2
            exit 1
          fi

          failed=0
          for item in \
            "frontend-test:$FRONTEND_RESULT" \
            "relay-test:$RELAY_RESULT" \
            "diff-viewer-test:$DIFF_VIEWER_RESULT" \
            "pet-frontend-test:$PET_RESULT" \
            "rust-test:$RUST_RESULT"; do
            name="${item%%:*}"
            result="${item#*:}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "$name 未通过: $result" >&2
                failed=1
                ;;
            esac
          done
          [[ "$failed" -eq 0 ]]
