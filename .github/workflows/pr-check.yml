name: PR Check

# P0/P1 秒级门(无 Rust 编译依赖)。
# - fork-guard 指纹层:抓 sync/merge 静默丢 fork patch(纯 grep submodule 文件)。
# - fork 合规联动:改了 submodule gitlink 却没更新 fork-modifications.md → fail(治 #70 漏指纹)。
# - Python MCP server 测试:跑 mcp-servers/*/test_*.py(覆盖 obsidian 改名正则那类)。
# Rust 编译类(cargo test / clippy)是后续独立 job(需 bge-m3 占位 + cache);
# clippy/fmt 现有代码各 75/329 处不符合,要先清理才能加 -D gate。

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# 同一 PR 连续 push 时,取消上一次未跑完的检查,省 runner。
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: fast-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (含 submodule,fork 为 public 直接拉)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: fork-guard 指纹层 (秒级,不编译)
        run: ./scripts/fork-guard.sh --fast

      - name: fork 合规联动 (gitlink ↔ fork-modifications)
        run: ./scripts/ci-fork-link-check.sh "origin/${{ github.base_ref }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Python MCP server 测试 (mcp-servers/*/test_*.py)
        run: |
          python3 -m pip install --quiet python-pptx   # pptx test 的唯一第三方依赖
          fail=0
          for t in pinvou3-app/resources/mcp-servers/*/test_*.py; do
            [ -f "$t" ] || continue
            echo "== $t =="
            ( cd "$(dirname "$t")" && python3 "$(basename "$t")" ) || fail=1
          done
          [ "$fail" -eq 0 ]
