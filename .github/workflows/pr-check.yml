name: PR Check

# Jobs:
# - commit-message:强制校验 PR/push 的 Git commit 信息规范。
# - version-consistency:强制校验 VERSION 单一事实来源与 SemVer 规则。
# - fast-gate(秒级,每 PR 都跑):fork-guard 指纹 + fork 合规联动 + Python 确定性测试。
# - changes:检测本 PR 有没有 Rust 代码、发布契约、L1 harness 或前端改动,给后续 job 做 paths filter。
# - frontend-test:Draft 跑 lint/build/逻辑测试；Ready PR 跑定向浏览器 smoke；
#   Merge Queue 对最新组合提交跑完整受影响前端门禁。
# - release-contract-test:发布链路改动只跑配置/脚本契约,不在 PR 构建安装包。
# - knowledge-rust:独立 pinvou-knowledge crate/部署入口改动跑 fmt/clippy/test 与 shell
#   语法检查；依赖或策略改动时追加 cargo-deny，不依赖 Tauri workspace 间接覆盖。
# - rust-test(编译类):Draft/普通 PR 默认不跑;Ready 高风险 PR 可加 ci:full-rust
#   标签提前跑；Merge Queue 对最新组合提交运行；main push 无条件累计验证并写暖
#   cache(防 concurrency pending 替换盲区)。
# - rust-lint:Draft 只跑 fmt；Ready/Queue/main 跑 clippy；cargo-deny 仅在依赖
#   或策略路径变化时追加，三项均无 continue-on-error。
#   与 rust-test 并行,各自独立 cache。clippy 规则见 Cargo.toml [lints] 表:
#   只启用实测零欠账的 lint(deny),有欠账的 lint/group 显式 allow,
#   欠账由清理 PR(#35 及后续)消化后逐个升 deny。
# - windows-rust-test:Windows 专属原语在原生 runner 执行;Ready PR/Merge Queue
#   按 Rust 路径触发;main 每次保留下来的 push 无条件累计验证(防 pending 替换盲区)。
# - windows-codex-runtime-test:相关 PR 在 Windows 原生准备 Node + ACP Bridge，并核对安装包资源。
# - required-gate:PR 阶段汇总所有适用检查，作为唯一 required check。
# - merge_group:按 base/head 的真实组合 diff 运行适用门禁，保证验证对象就是
#   最新 main + 入队 PR；因此无冲突 PR 不需要为主线日常前进反复人工 rebase。
#
# Cache 策略(2026-07 诊断:PR cache 挂 refs/pull/N/merge 作用域互不可见 + 1.3GB/份
# 顶死 10GB 限额被 LRU 秒驱逐 → 每轮全冷编译 ~9min):
# - Rust 相关 push main 跑 rust-test:cache 存 main 作用域,供 Merge Queue/显式 PR 复用。
# - save-if 仅 main:PR 侧只读不写,不再刷爆限额挤掉暖 cache。
# - rust-cache 的 restore 有前缀回退(restoreKey 不含 lockfile hash),PR 改 Cargo.lock
#   也能从 main cache 增量编译,不再全冷。
# - 曾用 sccache 按内容哈希缓存仓库内 crate 的编译产物,但 sccache 的 client-server
#   架构只会把 RUST_MIN_STACK 传给 client、到不了 server 派生的 rustc,codewhale-tui
#   codegen 仍会栈溢出(#271 已移除)。rust-cache 的 target 目录缓存保留,仓库内 crate
#   每轮重编约 5min 的成本接受;rust-lint 从不接入 sccache(见该 job 注释)。

on:
  pull_request:
    # 不限制 base 分支:堆叠 PR(base 为功能分支而非 main)同样必须跑完整
    # lint + test gate。此前 `branches: [main]` 使栈中段 PR(base=功能分支)
    # 只触发无 base 过滤的 DCO/Gitleaks/dependency-review,整条 pr-check
    # (含 lint:ui / npm test / 浏览器 smoke / required-gate)被静默跳过,
    # 导致 no-undef 与签名回归在栈中段漏检(见 #166/#168 评审)。changes
    # job 已按路径短路无关 job(rust-test 默认跳过等),不会无差别烧 CI 分钟。
    # ready/converted 事件用于切换 Draft 快检与 Ready 定向门禁；标签事件用于
    # 按需开启/关闭 ci:full-rust。
    # closed 事件会进入同一个 concurrency group，及时取消已合并/关闭 PR 的旧任务。
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, closed]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]   # 暖 cache:见上方 Cache 策略

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter 调 API 读 PR 改了哪些文件

# 同一 PR 连续 push 或被合并/关闭时取消上一次未跑完的检查,省 runner。
# main push 保留当前正在运行的暖缓存任务；GitHub 同一 concurrency group 最多保留
# 一个 running 和一个 pending，新 push 会替换旧 pending。为避免被替换的 pending
# 恰好包含 Rust 变更、而保留下来的后续 push 只看相邻非 Rust diff，main 的 Rust
# 累计验证不依赖单次 push 的 paths-filter(见 rust-test/windows-rust-test)。
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-message:
    name: commit-message
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验 commit 信息规范
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/validate-commit-msg.py --range "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            python3 scripts/validate-commit-msg.py --range "$before" "${{ github.sha }}"
          fi

  version-consistency:
    name: version-consistency
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 版本与 CI 路由脚本测试
        run: >-
          node --test
          scripts/tests/sync-version.test.mjs
          scripts/tests/select-frontend-smokes.test.mjs

      - name: 校验 VERSION 与各版本文件一致
        run: node scripts/sync-version.mjs --check

  # PR、Merge Queue 与 main push 均按实际改动路径选择检查。
  # paths-filter v4 在 merge_group 上使用事件 base/head SHA 比较队列组合提交。
  # push(main) 下 dorny/paths-filter 用 before..sha 本地 diff(需 fetch-depth:0),
  # 供其余按路径 job 使用；rust-test/windows-rust-test 的 main 累计验证为规避
  # concurrency pending 替换盲区，有意不依赖单次 push 的相邻 diff。
  changes:
    name: changes
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_code: ${{ steps.filter.outputs.rust_code }}
      rust_dependencies: ${{ steps.filter.outputs.rust_dependencies }}
      knowledge_rust: ${{ steps.filter.outputs.knowledge_rust }}
      knowledge_dependencies: ${{ steps.filter.outputs.knowledge_dependencies }}
      release_contract: ${{ steps.filter.outputs.release_contract }}
      pet: ${{ steps.filter.outputs.pet }}
      frontend: ${{ steps.filter.outputs.frontend }}
      relay: ${{ steps.filter.outputs.relay }}
      acp_runtime: ${{ steps.filter.outputs.acp_runtime }}
      windows_codex: ${{ steps.filter.outputs.windows_codex }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust_code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/build.rs'
              - 'CodeWhale'
              - '.gitmodules'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/mac-build.yml'
            rust_dependencies:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/deny.toml'
              - 'CodeWhale'
              - '.gitmodules'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/mac-build.yml'
            knowledge_rust:
              - 'pinvou-knowledge/**/*.rs'
              - 'pinvou-knowledge/Cargo.toml'
              - 'pinvou-knowledge/Cargo.lock'
              - 'pinvou-knowledge/deploy/**'
              - '.github/workflows/pr-check.yml'
            knowledge_dependencies:
              - 'pinvou-knowledge/Cargo.toml'
              - 'pinvou-knowledge/Cargo.lock'
              - 'pinvou3-app/src-tauri/deny.toml'
              - '.github/workflows/pr-check.yml'
            release_contract:
              - 'VERSION'
              - 'scripts/sync-version.mjs'
              - 'scripts/tests/sync-version.test.mjs'
              - 'scripts/tests/test_ci_gate_policy.py'
              - 'scripts/tests/test_ci_trigger_routing_policy.py'
              - 'scripts/tests/test_release_arm64_policy.py'
              - 'scripts/tests/test_release_manifest_probe.py'
              - '.github/workflows/release-packages.yml'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/mac-build.yml'
              - '.gitmodules'
              - 'private-runtimes/windows'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - 'pinvou3-app/scripts/tauri/**'
              - 'pinvou3-app/src-tauri/tauri.conf.json'
              - 'pinvou3-app/src-tauri/config/**'
              - 'pinvou3-app/src-tauri/packaging/**'
              - 'pinvou3-app/src-tauri/resources/**'
              - 'pinvou3-app/tests/knowledge_host_packaging.test.mjs'
              - 'pinvou3-app/tests/codex_acp_windows_*'
              - 'pinvou3-app/tests/windows_runtime_packaging_contract.test.js'
              - 'pinvou3-app/tests/macos_phase2_contract.test.js'
            pet:
              - 'pinvou3-app/src/assets/pet/**'
              - 'pinvou3-app/src/features/pet/**'
              - 'pinvou3-app/src/features/chat/ChatView.jsx'
              - 'pinvou3-app/src/features/settings/SettingsView.jsx'
              - 'pinvou3-app/src/hooks/useReducedMotion.js'
              - 'pinvou3-app/src/index.html'
              - 'pinvou3-app/src/app/main.jsx'
              - 'pinvou3-app/src/app/pet-main.jsx'
              - 'pinvou3-app/scripts/validate-pet-assets.mjs'
              - 'pinvou3-app/tests/pet_*'
              - 'pinvou3-app/src/platform/tauri/bridge.js'
              - 'pinvou3-app/src-tauri/capabilities/default.json'
              - 'pinvou3-app/src-tauri/src/platform/prefs.rs'
              - 'pinvou3-app/src-tauri/src/lib.rs'
              - 'pinvou3-app/src-tauri/src/features/pet/pet_window.rs'
              - 'pinvou3-app/src-tauri/src/features/pet/selected_pet.rs'
              - 'pinvou3-app/src-tauri/tauri.conf.json'
              - 'pinvou3-app/src-tauri/config/**'
              - 'pinvou3-app/src-tauri/packaging/**'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - 'pinvou3-app/vite.config.js'
              - 'pinvou3-app/eslint.config.mjs'
              - '.github/workflows/pr-check.yml'
            frontend:
              - 'pinvou3-app/src/**'
              - 'pinvou3-app/tests/**'
              - 'pinvou3-app/scripts/tauri/**'
              - 'pinvou3-app/src-tauri/config/**'
              - 'pinvou3-app/src-tauri/packaging/**'
              # bundle 技能树变更须跑 connector 契约测试(版本联动/口径 lint 经
              # node --test 自动发现),否则 bundle-only 同步 PR 会静默跳过该门禁。
              - 'pinvou3-app/src-tauri/resources/**'
              - 'remote-control-relay/**'
              - 'scripts/run-user-journey-tests.sh'
              - 'scripts/run-frontend-smokes.mjs'
              - 'scripts/select-frontend-smokes.mjs'
              - 'scripts/mcp-server-contract-smoke.py'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - 'pinvou3-app/vite.config.js'
              - 'pinvou3-app/eslint.config.mjs'
              - 'pinvou3-app/src-tauri/tauri.conf.json'
              - '.gitmodules'
              - '.github/workflows/pr-check.yml'
            relay:
              - 'remote-control-relay/**'
              - '.github/workflows/pr-check.yml'
            acp_runtime:
              - 'pinvou3-app/run-dev.sh'
              - 'pinvou3-app/scripts/codex-bridge-runtime/**'
              - 'pinvou3-app/scripts/prepare-codex-bridge-runtime.sh'
              - 'pinvou3-app/scripts/tauri/build.js'
              - 'pinvou3-app/scripts/tauri/codex-bridge.js'
              - 'pinvou3-app/scripts/tauri/effective-config.js'
              - 'pinvou3-app/src-tauri/src/features/codex_acp/**'
              - 'pinvou3-app/src-tauri/src/platform/capabilities.rs'
              - 'pinvou3-app/tests/codex_acp_*'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - '.github/workflows/pr-check.yml'
            windows_codex:
              - '.gitmodules'
              - 'private-runtimes/windows'
              - 'pinvou3-app/scripts/codex-bridge-runtime/**'
              - 'pinvou3-app/scripts/tauri/build.js'
              - 'pinvou3-app/scripts/tauri/codex-bridge.js'
              - 'pinvou3-app/scripts/tauri/effective-config.js'
              - 'pinvou3-app/scripts/tauri/windows-runtime.js'
              - 'pinvou3-app/src-tauri/config/platforms/windows/runtime/**'
              - 'pinvou3-app/src-tauri/packaging/windows/runtime/**'
              - 'pinvou3-app/src-tauri/src/features/codex_acp/**'
              - 'pinvou3-app/src-tauri/src/platform/capabilities.rs'
              - 'pinvou3-app/tests/codex_acp_*'
              - 'pinvou3-app/tests/windows_runtime_packaging_contract.test.js'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - '.github/workflows/release-packages.yml'
              - '.github/workflows/pr-check.yml'

  fast-gate:
    name: fast-gate
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (含 submodule,fork 为 public 直接拉)
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: 架构边界门禁
        run: |
          base_ref="${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.base_ref }}"
          base_ref="${base_ref#refs/heads/}"
          python3 scripts/architecture-guard.py --base-ref "origin/$base_ref"

      - name: 公开底座 gitlink 可达性
        run: ./scripts/verify-public-submodule.sh

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      - name: fork-guard 指纹层 (秒级,不编译)
        run: ./scripts/fork-guard.sh --fast

      - name: fork 合规联动 (gitlink ↔ fork-modifications)
        run: |
          base_ref="${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.base_ref }}"
          base_ref="${base_ref#refs/heads/}"
          ./scripts/ci-fork-link-check.sh "origin/$base_ref"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Session replay auditor 测试
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Python MCP server 测试 (mcp-servers/*/test_*.py)
        run: |
          python3 -m pip install --quiet python-pptx python-docx
          fail=0
          for t in pinvou3-app/resources/mcp-servers/*/test_*.py; do
            [ -f "$t" ] || continue
            echo "== $t =="
            ( cd "$(dirname "$t")" && python3 "$(basename "$t")" ) || fail=1
          done
          [ "$fail" -eq 0 ]

      - name: 内置 MCP 协议与产物契约
        run: python3 scripts/mcp-server-contract-smoke.py

  frontend-test:
    name: frontend-test
    needs: changes
    # 合并原 diff-viewer-test + pet-frontend-test:两者各自 npm ci + build:ui 纯重复,
    # pet 跑 npm test(链尾含 test:diff-parser)与 diff-viewer 的 test:diff-parser 也重复,
    # 且 pet 缺 lint:ui。统一为一个 job 后:依赖/build 各装一次、lint 全覆盖。
    # Draft 仅跑 lint/build/逻辑测试；Ready PR 按 diff 选定 browser smoke；
    # merge_group 对最新组合提交跑完整 browser smoke。
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.pet == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pinvou3-app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            pinvou3-app/package-lock.json
            remote-control-relay/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefer-offline --no-audit

      # test:webui smoke (本 job 末尾) 会 spawn remote-control-relay/server.js,
      # 其顶层 require('ws') 解析自 remote-control-relay/node_modules,故必须装 relay 依赖。
      - name: 安装 Remote relay 依赖 (供 test:webui smoke)
        if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
        run: npm --prefix ../remote-control-relay ci --prefer-offline --no-audit

      - name: ESLint (含 pet 缺失项,现已全覆盖)
        run: npm run lint:ui

      - name: Vite build
        run: npm run build:ui

      - name: 前端逻辑测试 (pet 全套 + diff parser + markdown)
        run: npm test

      - name: 准备浏览器
        if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Ready PR 定向浏览器 smoke
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | node ../scripts/select-frontend-smokes.mjs \
            > "$RUNNER_TEMP/frontend-smokes.tsv"
          while IFS="$(printf '\t')" read -r kind target; do
            case "$kind" in
              npm) npm run "$target" ;;
              node) node "$target" ;;
              *) echo "未知 smoke 类型: $kind" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/frontend-smokes.tsv"

      - name: Merge Queue 完整浏览器 smoke
        if: ${{ github.event_name == 'merge_group' }}
        run: npm run test:browser-smoke

  relay-test:
    name: relay-test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relay == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remote-control-relay/package-lock.json

      - name: 安装 relay 依赖
        run: npm --prefix remote-control-relay ci --prefer-offline --no-audit

      - name: Relay 回归
        run: npm --prefix remote-control-relay test

  release-contract-test:
    name: release-contract-test
    needs: changes
    # Ready PR/Queue/main 仅在发布链路相关路径变化时验证版本同步、
    # Tauri overlay 与各平台打包契约，不生成 deb/dmg/nsis。
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.release_contract == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        run: npm --prefix pinvou3-app ci --prefer-offline --no-audit

      # 版本一致性校验(--check)由 version-consistency job 无路径门全事件覆盖,
      # 此处不重复;仅跑 Tauri overlay、各平台打包与知识宿主契约。
      - name: Tauri 打包与发布配置契约
        run: |
          npm --prefix pinvou3-app run test:tauri-layout
          npm --prefix pinvou3-app run test:tauri-effective-config
          npm --prefix pinvou3-app run test:macos-phase2
          npm --prefix pinvou3-app run test:knowledge-host-packaging

  # pinvou-knowledge 是可单独部署的 crate，必须直接验证自己的默认 feature 图、
  # 测试与部署入口，而不只依赖 Tauri 作为 client-only path dependency 的间接编译。
  # 各项收在同一 job 复用一份缓存，避免过度分拆。
  knowledge-rust:
    name: knowledge-rust
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && (needs.changes.outputs.knowledge_rust == 'true' || needs.changes.outputs.knowledge_dependencies == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou-knowledge
          shared-key: knowledge-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --manifest-path pinvou-knowledge/Cargo.toml -- --check

      - name: cargo clippy (all targets, all features)
        run: cargo clippy --manifest-path pinvou-knowledge/Cargo.toml --all-targets --all-features --no-deps

      - name: cargo test
        run: cargo test --manifest-path pinvou-knowledge/Cargo.toml --all-features

      - name: 部署脚本 shell 语法
        run: bash -n pinvou-knowledge/deploy/install.sh

      - name: cargo-deny
        if: ${{ needs.changes.outputs.knowledge_dependencies == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # 共用现有许可证/来源策略，但审计对象显式指向独立 crate。
      - name: cargo deny check
        if: ${{ needs.changes.outputs.knowledge_dependencies == 'true' }}
        run: >-
          cargo deny
          --manifest-path pinvou-knowledge/Cargo.toml
          --config pinvou3-app/src-tauri/deny.toml
          check advisories licenses bans sources

  # clippy/fmt/deny 独立 job:与 rust-test 并行,各自独立 cache。
  # clippy 用 clippy-driver 编译,产物不能被 cargo test(rustc)复用;在同一 job 里
  # 串行跑会导致依赖图被编译两遍。拆成并行 job 后 wall-clock ≈ max(lint, test)。
  # 不接入 sccache:clippy 产物与 test 不通用,接入会使 sccache 写入量翻倍,
  # 而本 job 仅 ~2-3min、收益过小,权衡 10GB 配额压力后不接入(#47 评审结论)。
  rust-lint:
    name: rust-lint
    needs: changes
    # 纳入 rust_dependencies:只改 deny.toml 时 rust_code=false 但 rust_dependencies=true,
    # cargo-deny 子步骤(已按 rust_dependencies 门控)需本 job 启动才能运行;
    # 否则 deny.toml 策略改动会静默漏检 cargo-deny。
    if: ${{ !cancelled() && github.event.action != 'closed' && (needs.changes.outputs.rust_code == 'true' || needs.changes.outputs.rust_dependencies == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Draft 只跑无系统依赖的 fmt 快检；Ready PR、Queue 与 main 跑 clippy。
      RUN_HEAVY_RUST_CHECKS: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
      # clippy 编译依赖(codewhale-tui)时同样可能触发 rustc/LLVM 栈溢出
      # (v0.9.5 升级后 O2 同源风险,与闭源 pinvou3 pr-check 保持一致)。
      # 正式入口按平台注入 RUSTC_WRAPPER(见 config.toml 注释);必须用
      # ${{ github.workspace }} 绝对路径,避免 Cargo 按进程 cwd 双拼解析。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      # 本 step 只作 rustup 引导;实际工具链由 pinvou3-app/src-tauri/rust-toolchain.toml
      # 锁定具体版本(下方 cargo 步骤 working-directory 在 src-tauri,rustup 按该文件
      # 自动安装并使用 pinned 版本,本地与 CI 不漂移)。
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou3-app/src-tauri
          shared-key: rust-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # fmt 硬门禁:风格规则见 rustfmt.toml(只用 stable 可用选项)。
      - name: cargo fmt --check (硬门禁)
        working-directory: pinvou3-app/src-tauri
        run: cargo fmt -- --check

      # clippy 需要 Tauri/WebKit 系统库；Draft 不安装，避免每次 push 消耗 ~70s。
      - name: 装 Tauri + pinvou3 Linux 系统依赖
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            librsvg2-dev libssl-dev \
            libx11-dev libxi-dev libxtst-dev \
            libayatana-appindicator3-dev \
            build-essential pkg-config cmake

      # clippy 硬门禁(无 continue-on-error):lint 配置走 Cargo.toml [lints] 表,
      # 不用命令行 -W/-D(避免与本地行为分叉)。[lints] 只启用实测零欠账的 lint(deny),
      # deny 命中即非零退出;欠账 lint/group 显式 allow(见表内注释,清理 PR 消化后启用)。
      # --lib:只检查主库,不编译 tests/examples。--no-deps:不 lint 依赖;
      # CodeWhale 子模块(path 依赖)的告警不受本仓 [lints] 约束,属上游欠账,仅显示不挡。
      - name: cargo clippy --lib (硬门禁,[lints] deny 命中即 fail)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        working-directory: pinvou3-app/src-tauri
        run: cargo clippy --lib --no-deps

      # dump_system_prompt 由 dev-tools feature 隔离，默认的 lib/clippy/test 均不会
      # 编译它；显式检查，防止 CodeWhale Prompt API 升级再次漏适配。
      - name: cargo check --bin dump_system_prompt (dev-tools)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        working-directory: pinvou3-app/src-tauri
        run: cargo check --bin dump_system_prompt --features dev-tools

      # cargo-deny 只与 Cargo/lock/deny/gitlink 等依赖与策略路径有关。
      - name: cargo-deny (advisories/licenses/bans/sources)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' && needs.changes.outputs.rust_dependencies == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check (硬门禁)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' && needs.changes.outputs.rust_dependencies == 'true' }}
        working-directory: pinvou3-app/src-tauri
        run: cargo deny check advisories licenses bans sources

  rust-test:
    name: rust-test
    needs: changes
    # Draft/普通 PR 默认跳过；可信高风险场景按路径/标签触发；Ready 高风险 PR
    # 可用标签提前跑。main push 无条件执行累计状态验证,避免 concurrency 用后续
    # 非 Rust pending 替换含 Rust 变更的 pending 后,只看相邻 diff 而漏检。
    if: >-
      ${{
        !cancelled() &&
        github.event.action != 'closed' &&
        (
          github.event_name == 'push' ||
          (
            needs.changes.outputs.rust_code == 'true' &&
            (
              github.event_name == 'merge_group' ||
              (
                github.event_name == 'pull_request' &&
                github.event.pull_request.draft == false &&
                contains(github.event.pull_request.labels.*.name, 'ci:full-rust')
              )
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    # Tauri + fastembed + aws-lc-sys 全冷编译耗时长;设上限避免卡死 runner 占用。
    # 知识库依赖进入主测试二进制后,Merge Queue 两次在 ThinLTO 链接期令 16GB
    # hosted runner 失联。限制 backend 并行会延长链接,故同步放宽到 120min。
    timeout-minutes: 120
    env:
      # 经 rustc-stack-wrapper 直接注入 RUST_MIN_STACK=16MiB 到编译期 rustc 进程
      # (规避 codewhale-tui O2 编译的栈溢出/SIGBUS)。不链式接 sccache:sccache 的
      # client-server 架构只会把 RUST_MIN_STACK 传给 client、到不了 server 派生的
      # rustc,codegen 仍会溢出。必须用 ${{ github.workspace }} 绝对路径(Cargo 按
      # 进程 cwd 解析 RUSTC_WRAPPER 相对路径会双拼成不存在的路径)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
      # codewhale-tui 恢复依赖级 O2 后,test binary 变大,link 阶段在 ubuntu 16GB
      # runner 上内存峰值越线被 SIGTERM(merge_group run 实证,exit 143)。
      # 实测(CI 对照):thin LTO + lld 能 Finished + 全量通过;
      # lld-only(无 LTO)仍 OOM(binary 太大,lld 独立不够)。故两者都必需:
      #   - Thin LTO:跨 crate 死代码消除 → test binary 变小(rustc 给依赖 crate 传
      #     -C linker-plugin-lto,生成 LLVM bitcode,link 阶段合并——故依赖 lld)。
      #   - lld:link 阶段处理 LLVM bitcode(lld 原生支持,BFD ld 不支持)。
      #   - --thinlto-jobs=1:避免多个 ThinLTO backend 并行把 16GB runner
      #     推过内存峰值并导致 hosted runner 与 GitHub 失联。
      # 不设 codegen-units:dev 默认 256,对 test 改动最小(不影响 release 的 codegen=1)。
      CARGO_PROFILE_DEV_LTO: "thin"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--thinlto-jobs=1"
    # dev profile 的 line-tables-only 已固化进 Cargo.toml [profile.dev],不再需要
    # CARGO_PROFILE_DEV_DEBUG 环境变量。
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      # pinvou3 编译链接的系统库(本地 pkg-config 实测:gtk/webkit/soup/rsvg/openssl/
      # X11×3/appindicator)。ubuntu runner 默认没装,否则 glib-sys 等 build script 失败。
      # cmake:reqwest 0.13 的 rustls 改用 aws-lc-rs,其 build script 需 cmake + C 编译器。
      # lld:上方注入 CARGO_PROFILE_DEV_LTO=thin 后 link 阶段需支持 LLVM bitcode 的链接器。
      - name: 装 Tauri + pinvou3 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            librsvg2-dev libssl-dev \
            libx11-dev libxi-dev libxtst-dev \
            libayatana-appindicator3-dev \
            build-essential pkg-config cmake lld

      # bge-m3 是 gitignored 大资源(559M),CI 干净 checkout 没有它,而 tauri_build::build()
      # 会校验 tauri.conf resources 路径存在。单测用 mem()=embedder None、不加载真模型,真
      # bge-m3/vLLM 的 e2e 测试都已 #[ignore] —— 故造空占位文件骗过资源校验即可(已实测可行)。
      - name: bge-m3 占位 (骗过 tauri-build 资源校验)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # rust-toolchain.toml 在 src-tauri 下,对从仓库根用 --manifest-path 调用的 cargo 不生效;
      # 把该文件锁定的工具链设为 default,保证 CI 与本地同一 pinned 版本(单一真相源是文件,
      # 版本号不在 workflow 里重复硬编码,升级只改 rust-toolchain.toml)。
      - name: 对齐 rust-toolchain.toml 锁定的工具链
        working-directory: pinvou3-app/src-tauri
        run: rustup default "$(rustup show active-toolchain | awk '{print $1}')"

      # remote_control 的真实 relay 下载 e2e 需要 node + relay 依赖,缺 node_modules/ws 时
      # 该 e2e 会自动 skip —— 装上依赖让 CI 真正执行它,而不是绿灯假过。
      # push(main) 只编译不执行测试(见下方 --no-run),不需要 relay/Chrome 运行时依赖。
      - name: Node.js (relay e2e)
        if: ${{ github.event_name != 'push' }}
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remote-control-relay/package-lock.json

      - name: relay 依赖 (真实 relay e2e)
        if: ${{ github.event_name != 'push' }}
        run: npm --prefix remote-control-relay ci --prefer-offline --no-audit

      - name: 浏览器驱动依赖 (真实 Chrome 下载 e2e)
        if: ${{ github.event_name != 'push' }}
        # real-browser driver 从 pinvou3-app/node_modules 加载 puppeteer-core。
        # npm --prefix pinvou3-app install 即使指定单包也会解析并安装项目完整依赖树，
        # 因此直接用 package-lock 驱动的 npm ci，避免额外维护一份硬编码版本并保证可复现。
        run: npm --prefix pinvou3-app ci --prefer-offline --no-audit

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou3-app/src-tauri
          # 稳定 key 前缀(跨 PR/push 一致);restore 按前缀回退,lock 变了也增量。
          shared-key: rust-test
          # 只在 main 保存(暖 cache 唯一来源);PR 侧只读,不占 10GB 限额。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # MQ/PR(ci:full-rust) 跑完整 lib 测试(含真实 relay/Chrome e2e)。
      # 保留 --test-threads=1:虽已把 env 写测试收敛到 crate 级唯一锁
      # (bridge::paths::tests::ENV_LOCK),但进程级 env 对未持锁的读取者仍全局可见，
      # 多线程测试仍可能观察到其他测试的临时值。Mutex poison 后通过 into_inner()
      # 取得的仍是已加锁 guard，不会绕过互斥；根治需消除测试对进程级 env 的依赖
      # 或让所有读写都通过同一隔离层，超出本 PR 范围。
      # strict_mode 的三个确定性回归已并入 pinvou3_lib 单测，和全量 lib tests
      # 共用一次编译与链接，避免第二个 integration test 目标重复链接全依赖树。
      - name: cargo test --lib（含 strict_mode 回归；真 bge-m3/vLLM 测试已 #[ignore]）
        if: ${{ github.event_name != 'push' }}
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME="$chrome"
          export PINVOU_REQUIRE_REMOTE_E2E=1
          cargo test --manifest-path pinvou3-app/src-tauri/Cargo.toml --lib -- --test-threads=1

      # push(main) 唯一目的是暖 cache(Swatinem/rust-cache save-if main)。
      # MQ 已对同一代码跑过完整 lib 测试,squash 合并后的 push 不再重复执行测试;
      # --no-run 编译含 test harness 的全部 target 产物(与完整 test 的编译腿一致),
      # 供热 MQ restore 后增量复用,省去测试执行时间。
      # 不需要 relay/Chrome 运行时依赖(上方 setup-node/relay/浏览器 step 已按 !=push 跳过)。
      - name: cargo test --lib --no-run (push main 仅编译暖 cache)
        if: ${{ github.event_name == 'push' }}
        run: cargo test --manifest-path pinvou3-app/src-tauri/Cargo.toml --lib --no-run

      - name: CodeWhale 定时任务运行时回归
        # 暂时关闭；底座对应运行时已回退，父仓后续另行收敛代码与 gitlink。
        if: ${{ false }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/pinvou3-app/src-tauri/target
        run: |
          cargo test --manifest-path CodeWhale/Cargo.toml -p codewhale-tui --lib automation_manager -- --test-threads=1
          cargo test --manifest-path CodeWhale/Cargo.toml -p codewhale-tui --lib task_manager -- --test-threads=1
          cargo test --manifest-path CodeWhale/Cargo.toml -p codewhale-tui --test task_executor_contract -- --test-threads=1

  windows-rust-test:
    name: windows-rust-test
    needs: changes
    # Windows 专属原语必须在原生 runner 执行；Draft 保持快速反馈，Ready PR 与
    # Merge Queue 按 Rust 路径触发。main 每次保留下来的 push 都执行 Windows 原生
    # 累计验证，避免 concurrency 用后续非 Rust pending 替换含 Rust 变更的 pending
    # 后，按相邻 diff 路由导致中间提交永远未经过 Windows 编译。
    if: >-
      ${{
        !cancelled() &&
        (
          github.event_name == 'push' ||
          (
            needs.changes.outputs.rust_code == 'true' &&
            (
              github.event_name == 'merge_group' ||
              (
                github.event_name == 'pull_request' &&
                github.event.pull_request.draft == false
              )
            )
          )
        )
      }}
    runs-on: windows-latest
    # 状态机回归使用 Bash 循环；job 级固定 shell 也覆盖 merge ref 从 base
    # 带入该步骤的场景。本 job 其余 run 命令均兼容 Bash。
    defaults:
      run:
        shell: bash
    # 全量 cargo check --all-targets + lib 链接检查,无暖 cache,挂死会长时间烧 runner 分钟。
    # 移除 sccache 后冷编译更长,放宽到 90min(aws-lc-sys NASM 预生成对象冷编译更久)。
    timeout-minutes: 90
    env:
      # reqwest 0.13 → aws-lc-sys(非 FIPS)。Windows x86_64 需 NASM 汇编;runner 默认无 NASM,
      # 用预生成 NASM 对象规避(aws-lc-rs 官方支持,无需额外装 NASM)。
      AWS_LC_SYS_PREBUILT_NASM: "1"
      # Windows 经 RUSTC_WRAPPER 注入 rustc-stack-wrapper.exe(本 job 先编译)。
      # .cmd 经 cmd /C 执行,cmd.exe 命令行上限 8191 字符,windows-sys/windows 等
      # 大型 crate 的 rustc 命令行(数千个 --cfg feature=...)会超限报
      # "The command line is too long";.exe 经 CreateProcess 直启(上限 32767),
      # 只在编译期 rustc 注入 RUST_MIN_STACK=16MiB,不泄漏到 cargo test 目标进程。
      # 不链式接 sccache:sccache 的 client-server 架构只会把 RUST_MIN_STACK 传给
      # client、到不了 server 派生的 rustc,codegen 仍会溢出。必须用
      # ${{ github.workspace }} 绝对路径(避免按 cwd 双拼解析)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 同 rust-test:把 src-tauri/rust-toolchain.toml 锁定的工具链设为 default,
      # 保证从仓库根 --manifest-path 调用 cargo 时与本地同一 pinned 版本。
      - name: 对齐 rust-toolchain.toml 锁定的工具链
        working-directory: pinvou3-app/src-tauri
        shell: bash
        run: rustup default "$(rustup show active-toolchain | awk '{print $1}')"

      # 编译 Windows 专用 .exe 栈 wrapper(源码 scripts/rustc-stack-wrapper.rs)。
      # 直接调 rustc 编译、不经 cargo,故不受本 job 的 RUSTC_WRAPPER 影响,无自举依赖。
      - name: 编译 Windows 栈 wrapper(.exe)
        shell: bash
        run: rustc -O pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs -o pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端构建依赖
        run: npm --prefix pinvou3-app ci --prefer-offline --no-audit

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou3-app/src-tauri
          shared-key: windows-rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Windows Rust 全目标检查
        run: >-
          cargo check --manifest-path pinvou3-app/src-tauri/Cargo.toml
          --all-targets --features dev-tools

      - name: Windows Rust 单元测试链接检查
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $records = @(& cargo test --manifest-path pinvou3-app/src-tauri/Cargo.toml `
            --lib --no-run --message-format=json)
          $cargoExit = $LASTEXITCODE
          $records | ForEach-Object { Write-Host $_ }
          if ($cargoExit -ne 0) {
            throw "FAIL: Windows Rust 单元测试链接检查失败(exit=$cargoExit)"
          }

          $testExe = $null
          foreach ($line in $records) {
            try {
              $record = $line.ToString() | ConvertFrom-Json -ErrorAction Stop
            } catch {
              continue
            }
            if ($record.reason -eq "compiler-artifact" -and
                $record.target.name -eq "pinvou3_lib" -and
                $record.profile.test -eq $true -and
                $record.executable) {
              $testExe = $record.executable
            }
          }
          if (-not $testExe -or -not (Test-Path -LiteralPath $testExe -PathType Leaf)) {
            throw "FAIL: cargo 未报告 pinvou3_lib 测试 exe"
          }
          "PINVOU3_TEST_EXE=$testExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Windows Rust 测试 exe: $testExe"

      # 0xc0000139 根因(已由诊断定位):muda 静态导入 TaskDialogIndirect,该符号仅
      # 存在于 Common-Controls v6 side-by-side 程序集;主 exe 由 tauri-build 嵌入声明该
      # 依赖的清单,而 cargo test 的 pinvou3_lib-*.exe 没有 v6 依赖声明。
      # link.exe 已给测试 exe 嵌入默认清单,Windows 会优先使用内嵌资源而忽略同目录
      # <exe>.manifest；因此必须用 runner 自带的 Windows SDK mt.exe 更新 resource #1。
      - name: Windows 测试 exe 嵌入 Common-Controls v6 清单
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = Join-Path $env:RUNNER_TEMP "pinvou3-test-common-controls.manifest"
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls"
                  version="6.0.0.0" processorArchitecture="*"
                  publicKeyToken="6595b64144ccf1df" language="*"/>
              </dependentAssembly>
            </dependency>
          </assembly>
          '@ | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $mt = Get-ChildItem -Path (Join-Path $sdkBin "*\x64\mt.exe") -File |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $mt) {
            throw "FAIL: Windows SDK mt.exe 不存在"
          }

          if (-not $env:PINVOU3_TEST_EXE) {
            throw "FAIL: PINVOU3_TEST_EXE 未设置"
          }
          $testExe = Get-Item -LiteralPath $env:PINVOU3_TEST_EXE
          & $mt.FullName -nologo -manifest $manifestPath "-outputresource:$($testExe.FullName);#1"
          if ($LASTEXITCODE -ne 0) {
            throw "FAIL: 无法向 $($testExe.Name) 嵌入 Common-Controls v6 清单"
          }
          Write-Host "已嵌入清单的测试 exe: $($testExe.FullName)"

      # 测试 exe 曾在回归步骤启动即挂(exit code 0xc0000139,STATUS_ENTRYPOINT_NOT_FOUND),
      # Windows 不指明缺哪个 DLL/符号。此步骤静态解析 PE 导入表作对照输出,纯诊断不阻断。
      # 纯诊断不阻断:脚本异常(如解析到截断 PE)不得挂掉本 job,故 continue-on-error。
      # 必须位于「嵌入 Common-Controls v6 清单」之后:脚本读 exe 已嵌入的清单来豁免
      # SxS 程序集 DLL(如 comctl32)的缺符号假阳性,嵌入前读到的是无 v6 声明的默认清单;
      # 直接传 $PINVOU3_TEST_EXE 保证诊断对象就是刚嵌入清单、回归将运行的那个 exe。
      - name: Windows 测试二进制导入诊断
        continue-on-error: true
        shell: pwsh
        run: python scripts/ci-windows-imports-diagnose.py "$env:PINVOU3_TEST_EXE"

      - name: Windows 原子替换状态机回归
        shell: bash
        run: |
          set -euo pipefail
          # 直接运行已经由 mt.exe 修补的链接产物。这里不能再次调用 cargo test，
          # 否则 Cargo 可能重链并覆盖 exe，导致 Common-Controls v6 清单丢失。
          test_exe="$(cygpath -u "$PINVOU3_TEST_EXE")"
          [[ -f "$test_exe" ]] || {
            echo "FAIL: 测试 exe 不存在:$test_exe" >&2
            exit 1
          }
          cd pinvou3-app/src-tauri
          # 逐过滤器断言至少命中 1 个测试,避免测试改名后过滤器 0 匹配却 exit 0
          # 导致的静默空跑。
          for filter in \
            'platform::filesystem::tests::windows_' \
            'artifact_read_recovers_an_occupied_1177_layout_after_release' \
            'artifact_writes_never_expose_partial_utf8_to_concurrent_readers' \
            'artifact_public_read_' \
            'features::memory::tests::topic_migration_'; do
            "$test_exe" "$filter" --test-threads=1 2>&1 | tee /tmp/windows_regression.log
            grep -qE 'running [1-9][0-9]* tests?' /tmp/windows_regression.log || {
              echo "FAIL: 回归过滤器 '$filter' 匹配 0 个测试(疑似测试改名导致静默空跑)" >&2
              exit 1
            }
          done

  windows-codex-runtime-test:
    name: windows-codex-runtime-test
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && (needs.changes.outputs.windows_codex == 'true' || needs.changes.outputs.acp_runtime == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装构建依赖
        run: npm --prefix pinvou3-app ci --prefer-offline --no-audit

      - name: Windows Codex Runtime 原生打包冒烟
        run: |
          npm --prefix pinvou3-app run test:windows-runtime
          npm --prefix pinvou3-app run test:codex-acp-windows-runtime

  macos-codex-runtime-test:
    name: macos-codex-runtime-test
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.acp_runtime == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 准备 macOS universal ACP Bridge
        run: ./pinvou3-app/scripts/prepare-codex-bridge-runtime.sh

      - name: macOS Codex 与 Claude Runtime 原生打包冒烟
        run: npm --prefix pinvou3-app run test:codex-acp-macos-runtime

  required-gate:
    name: required-gate
    needs:
      - commit-message
      - version-consistency
      - changes
      - fast-gate
      - frontend-test
      - relay-test
      - release-contract-test
      - knowledge-rust
      - rust-lint
      - rust-test
      - macos-codex-runtime-test
      - windows-codex-runtime-test
    if: ${{ always() && ((github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总所有适用检查
        env:
          COMMIT_MESSAGE_RESULT: ${{ needs.commit-message.result }}
          VERSION_CONSISTENCY_RESULT: ${{ needs.version-consistency.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FAST_GATE_RESULT: ${{ needs.fast-gate.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          RELAY_RESULT: ${{ needs.relay-test.result }}
          RELEASE_CONTRACT_RESULT: ${{ needs.release-contract-test.result }}
          KNOWLEDGE_RUST_RESULT: ${{ needs.knowledge-rust.result }}
          RUST_LINT_RESULT: ${{ needs.rust-lint.result }}
          RUST_RESULT: ${{ needs.rust-test.result }}
          MACOS_CODEX_RESULT: ${{ needs.macos-codex-runtime-test.result }}
          WINDOWS_CODEX_RESULT: ${{ needs.windows-codex-runtime-test.result }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            # 队列提交由 GitHub 生成，不重复校验人工 commit message；
            # 其余基础与产品门禁必须验证当前组合提交。
            if [[ "$VERSION_CONSISTENCY_RESULT" != success || "$CHANGES_RESULT" != success || "$FAST_GATE_RESULT" != success ]]; then
              echo "Merge Queue 基础检查失败: version-consistency=$VERSION_CONSISTENCY_RESULT changes=$CHANGES_RESULT fast-gate=$FAST_GATE_RESULT" >&2
              exit 1
            fi
          elif [[ "$COMMIT_MESSAGE_RESULT" != success || "$VERSION_CONSISTENCY_RESULT" != success || "$CHANGES_RESULT" != success || "$FAST_GATE_RESULT" != success ]]; then
            echo "基础检查失败: commit-message=$COMMIT_MESSAGE_RESULT version-consistency=$VERSION_CONSISTENCY_RESULT changes=$CHANGES_RESULT fast-gate=$FAST_GATE_RESULT" >&2
            exit 1
          fi

          failed=0
          for item in \
            "frontend-test:$FRONTEND_RESULT" \
            "relay-test:$RELAY_RESULT" \
            "release-contract-test:$RELEASE_CONTRACT_RESULT" \
            "knowledge-rust:$KNOWLEDGE_RUST_RESULT" \
            "rust-lint:$RUST_LINT_RESULT" \
            "rust-test:$RUST_RESULT" \
            "macos-codex-runtime-test:$MACOS_CODEX_RESULT" \
            "windows-codex-runtime-test:$WINDOWS_CODEX_RESULT"; do
            name="${item%%:*}"
            result="${item#*:}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "$name 未通过: $result" >&2
                failed=1
                ;;
            esac
          done
          [[ "$failed" -eq 0 ]]
