name: PR Title Check

# Dedicated lightweight gate for the PR title. The squash-merge subject
# GitHub generates is "<PR title> (#N)", so the PR title becomes the
# main-branch commit subject verbatim, and merge-queue merges never run the
# commit-message job of pr-check.yml. This workflow validates the title at
# PR time — the last point where a violation is still fixable (e.g. #482
# landed a 53-character subject that kept failing later main pushes). The
# push leg of pr-check.yml stays the backstop for commits that bypass a PR;
# the merge_group payload does not expose the PR title, so queue-time
# validation is not implementable.
#
# Why a dedicated workflow instead of a job inside pr-check.yml: routing
# `edited` through pr-check.yml makes a body-only edit create skipped check
# runs named after the required contexts (commit-message, required-gate,
# ...), and the checks API/UI surfaces the latest check run per name, so
# those skipped runs replaced the green gate results (review finding on
# #501, run 34818389619). This workflow's job name `pr-title` is unique, so
# its runs can never shadow a required context.
#
# Routing: every subscribed event revalidates the title, including a
# body-only edit. Skipping the job on body-only edits would still create a
# check run named `pr-title` with conclusion SKIPPED, and the checks API
# surfaces the latest run per name, so it would replace the previous red or
# green result (review finding on #501) — and a skipped required check
# counts as success, which would let a body edit clear a red gate if this
# context were added to branch protection. Revalidating is a single cheap
# job, and an unchanged title yields the same verdict, so the latest
# `pr-title` result always reflects the current title.
#
# Note: this check is advisory — it is not part of required-gate or branch
# protection, so a violating title shows red here without blocking the
# merge. Add the `pr-title` context to branch protection to make it
# blocking; that stays sound because every run is a real validation and a
# skipped run can never occur.
#
# Residual race: a title edited after this run finished is not re-checked
# until the next event.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Every run is a real validation — a superset of any in-flight run (same
# head SHA, same or newer title) — so all runs of a PR share one group and
# cancel-and-replace instead of piling up repeated edits.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The title is passed through a temp file instead of a command-line
      # argument so it cannot be interpreted as an option or inject code.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          python3 scripts/validate-commit-msg.py "$RUNNER_TEMP/pr-title"
