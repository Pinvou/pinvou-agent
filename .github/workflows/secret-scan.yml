name: secret-scan

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs for the same ref to avoid queueing and wasted runner
# minutes. Only PR runs may cancel each other: on merge_group and main pushes
# github.ref is refs/heads/main, so an unconditional cancel would let
# concurrent merge-queue entries kill each other's required-check context
# (same failure class pr-check guards against).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 确认队列中的 PR 已通过密钥扫描
        if: github.event_name == 'merge_group'
        run: echo "密钥扫描已在各 PR 入队前验证"

      - uses: actions/checkout@v7
        if: github.event_name != 'merge_group'
        with:
          fetch-depth: 0

      # 在 runner 上原生运行 gitleaks。此前经 docker:// 镜像执行:容器以 root
      # 访问 runner 用户的 checkout 目录,触发 git 的 safe.directory 保护,
      # git log 直接失败,gitleaks 扫描 0 个 commit 仍以 0 退出(日志实证
      # "fatal: detected dubious ownership" → "0 commits scanned" → "no leaks
      # found"),required check 长期绿灯但从未真正扫描。改原生执行根治属主
      # 问题;下方空扫描守卫防止任何形式的静默空转回归。
      - name: Install gitleaks (pinned, checksum verified)
        if: github.event_name != 'merge_group'
        run: |
          curl --retry 3 -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan repository and history
        if: github.event_name != 'merge_group'
        run: |
          # 与 commit-message 门禁同一信任边界:只扫 LEGACY_HISTORY_CUTOFF
          # (scripts/validate-commit-msg.py)之后的提交;pre-baseline 历史不在此
          # 门禁范围内。存量命中均为测试/文档合成值,豁免按「文件 + 行内值」
          # 双重收紧,见 .gitleaks.toml 各组说明。
          set -o pipefail
          # gitleaks 的日志(含 "N commits scanned")走 stderr;缺少 2>&1 时
          # tee 落盘的是空文件,下方空扫描守卫读不到任何内容、形同虚设。
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose \
            --log-opts="deae3ca0141390c06e14aa93610645088b8966d4..HEAD" 2>&1 \
            | tee /tmp/gitleaks.log
          if grep -q "0 commits scanned" /tmp/gitleaks.log; then
            echo "::error::gitleaks scanned 0 commits — refusing to pass an empty scan"
            exit 1
          fi
