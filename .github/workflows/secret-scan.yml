name: secret-scan

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs for the same ref to avoid queueing and wasted runner
# minutes. Only PR runs may cancel each other: on merge_group and main pushes
# github.ref is refs/heads/main, so an unconditional cancel would let
# concurrent merge-queue entries kill each other's required-check context
# (same failure class pr-check guards against).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 确认队列中的 PR 已通过密钥扫描
        if: github.event_name == 'merge_group'
        run: echo "密钥扫描已在各 PR 入队前验证"

      - uses: actions/checkout@v7
        if: github.event_name != 'merge_group'
        with:
          fetch-depth: 0

      # Run gitleaks natively on the runner. The previous docker:// image ran
      # as root against the runner user's checkout, which tripped git's
      # safe.directory protection: git log failed outright and gitleaks
      # scanned 0 commits yet still exited 0 (log evidence: "fatal: detected
      # dubious ownership" -> "0 commits scanned" -> "no leaks found"), so the
      # required check stayed green without ever scanning anything. Native
      # execution removes the ownership problem at the root; the empty-scan
      # guard below prevents any silent no-op regression.
      - name: Install gitleaks (pinned, checksum verified)
        if: github.event_name != 'merge_group'
        run: |
          curl --retry 3 -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan repository and history
        if: github.event_name != 'merge_group'
        run: |
          # Same trust boundary as the commit-message gate: only commits after
          # LEGACY_HISTORY_CUTOFF (scripts/validate-commit-msg.py) are
          # scanned; pre-baseline history is out of scope for this gate.
          # Pre-existing hits are all synthetic test/doc values, and each
          # exemption is tightened on both file and in-line value — see the
          # groups in .gitleaks.toml.
          set -o pipefail
          # gitleaks logs (including "N commits scanned") go to stderr; without
          # 2>&1, tee writes an empty file, the empty-scan guard below reads
          # nothing, and the guard becomes a no-op.
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose \
            --log-opts="deae3ca0141390c06e14aa93610645088b8966d4..HEAD" 2>&1 \
            | tee /tmp/gitleaks.log
          if grep -q "0 commits scanned" /tmp/gitleaks.log; then
            echo "::error::gitleaks scanned 0 commits — refusing to pass an empty scan"
            exit 1
          fi
