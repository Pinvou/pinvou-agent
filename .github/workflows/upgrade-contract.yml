name: Upgrade V1 Contract

on:
  pull_request:
    paths:
      - 'specs/upgrade/v1/**'
      - 'tools/upgrade-platform-conformance/**'
      - 'tools/upgrade-platform-lab/**'
      - '.github/workflows/upgrade-contract.yml'
  push:
    paths:
      - 'specs/upgrade/v1/**'
      - 'tools/upgrade-platform-conformance/**'
      - 'tools/upgrade-platform-lab/**'
      - '.github/workflows/upgrade-contract.yml'
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: specs/upgrade/v1/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: specs/upgrade/v1
      - run: npm test
        working-directory: specs/upgrade/v1

  platform-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - run: node --test tools/upgrade-platform-conformance/test/*.test.mjs
