name: release-packages

# 仅正式版本或人工明确要求时构建全平台安装包,挂为 GitHub Actions artifact(保留 90 天)。
#
# 触发条件:
# - push main 且 VERSION 被修改;
# - workflow_dispatch 手动触发:无条件全量构建(用于补打/重打或显式验证)。
# 普通 PR 不进入本工作流；版本/打包脚本的轻量契约由 pr-check.yml 验证。
#
# 版本号单一事实来源 = 根目录 VERSION 文件。gate job 先跑
# scripts/sync-version.mjs --check,把该脚本登记的每个版本文件逐一与 VERSION 比对
# (打进安装包的是 pinvou3-app 的 tauri.conf.json / Cargo.toml / Cargo.lock /
# package.json / package-lock.json,以及 pinvou-knowledge 的 Cargo.toml+Cargo.lock;
# 完整清单以脚本 repoPaths() 为准,其中少数文件存在才纳入,不在此重复枚举以免漂移)。
# 构建 job 只消费已校验的版本文件,保证打进包里的任何版本号都来自 VERSION。
#
# 与其他 workflow 的分工:
# - pr-check: fast PR gating and release-contract verification (produces no
#   installers); macOS native regression is also folded into its
#   macos-rust-check push leg (2026-10; the former standalone mac-build was
#   deleted).
# - release-packages(本 workflow):VERSION bump 或人工触发时产出全平台安装包 artifact。
# - 本 workflow 只上传 CI artifact,绝不创建/推送 GitHub Release,release 由人工填写。
#
# 签名:Windows nsis 不签名(config/platforms/windows 无证书配置);macOS ad-hoc
# (signingIdentity="-",用户首次安装需 xattr -dr com.apple.quarantine)。
# Windows 正式发布仍进入 windows-release Environment。运行时仓库已公开，
# checkout 后不保留凭据，后续按锁定 gitlink 匿名拉取运行时和 Git LFS 对象。

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  # 正式产物不可被后续 push 或重复点击中途取消。
  cancel-in-progress: false

jobs:
  # ── Job 1: 发布 gate(跑 ubuntu 快) ─────────────────────────────────
  # 只有 VERSION push 或人工触发能进入本工作流，因此通过版本一致性检查后直接放行。
  check-version-bump:
    name: 校验发布版本
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.release.outputs.build_required }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # fetch-depth:0 确保 push 事件的 before commit 可用于整段 push 范围比较。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up zram and swap
        # Best effort: timeouts or failures only warn and never block (falls back to stock runner memory).
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup did not finish; continuing with stock runner memory"

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 版本同步脚本测试
        run: node --test scripts/tests/sync-version.test.mjs

      # 版本号单一事实来源 = 根目录 VERSION。各处版本文件必须已与其同步,
      # 否则包名/包内版本号可能不一致,直接 fail 提示先跑 sync-version.mjs。
      - name: 校验各处版本文件与 VERSION 一致
        run: node scripts/sync-version.mjs --check

      - name: 输出发布版本
        id: release
        run: |
          set -euo pipefail

          V=$(tr -d '[:space:]' < VERSION)
          echo "当前 VERSION: $V"
          echo "build_required=true" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  # ── Job 2: Linux x86_64 deb ─────────────────────────────────────────
  build-linux-x64:
    name: 构建 Linux x86_64 deb
    needs: check-version-bump
    if: needs.check-version-bump.outputs.build_required == 'true'
    # Linux 发布基线是 Ubuntu 22.04 (glibc 2.35)。发布二进制链接构建机的 glibc,
    # 在更新的 Ubuntu runner(当前 latest 指向 24.04/glibc 2.39)上构建会引入
    # 22.04 没有的 GLIBC_2.3x+ 符号引用,导致 22.04 用户启动即崩。runner 必须钉在
    # ubuntu-22.04,升级前先确认新基线决策(配套 glibc 下限守护步骤见构建尾部)。
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # v0.9.5 升级后 release(thin-LTO O3)编译 codewhale-tui 时 rustc/LLVM 栈溢出
      # (SIGBUS,Linux 与 macOS 同源风险)。.cargo/config.toml 不设置 rustc-wrapper
      # (全局键无法按平台条件化),由本 Linux 发布 job 显式注入 RUSTC_WRAPPER
      # 指向 sh 版(wrapper 只作用于编译期 rustc 进程,产物运行时语义不变)。
      # 必须用 ${{ github.workspace }} 绝对路径:Cargo 按自身进程 cwd 解析相对路径,
      # 构建步骤 working-directory 为 pinvou3-app,相对路径会被双拼成不存在的路径。
      # lld: BFD ld is memory-inefficient on large Rust binaries and is the
      # standalone link-OOM cause (same as arm64). The linker receives only
      # post-LTO plain objects: thin LTO's cross-crate merging completes
      # in-process in the final crate's rustc (cargo compiles dependency crates
      # with -C linker-plugin-lto), so lld is picked for object-linking time
      # and memory, not bitcode support.
      # Mechanism note (2026-10 calibration): since rustc >= 1.90,
      # x86_64-linux-gnu self-links with its bundled rust-lld by default (rustc
      # injects -B<sysroot>/.../gcc-ld into cc itself), so this flag is in
      # practice a redundant fallback under jammy gcc 11 (when gcc resolves
      # ld.lld by name, the -B directory precedes PATH). It is kept as a
      # fallback for older toolchains and local environments; do not conclude
      # from this comment that the linker is apt's ld.lld.
      # The ThinLTO backends run inside rustc's process, so no cap is needed:
      # release O3 + codegen-units=1 stays stable on 4 cores (recent releases
      # 11/11 green).
      # lld:BFD ld 处理大型 Rust binary 内存效率差,是 link OOM 独立主因(同 arm64);
      # BFD also has no --icf, so it cannot perform the identical-code folding
      # on the next line. Thin LTO itself is executed by rustc (the final unit
      # gets -C lto=thin) and is independent of the linker identity; see the
      # Cargo.toml [profile.release] comments for the mechanism.
      # --icf=safe: lld identical-code folding (merges identical code sections,
      # a size optimization). The safe tier only folds functions whose address
      # is provably never taken. The boundary between ICF and Rust function
      # address identity is a known issue (rust#160267 is one example: a
      # miscompilation occurred even under the safe tier, LLVM-side root
      # cause, still unfixed), so the conservative tier is chosen over all.
      # RUSTFLAGS is an env-level injection covering both the tauri main build
      # and the standalone knowledge-host build in this job (the latter's
      # profile lives in pinvou-knowledge/Cargo.toml).
      # --remap-path-prefix: normalizes build-machine absolute paths embedded
      # in the artifact (panic locations etc.) to /. Top-level rustc flag —
      # NOT a -C codegen option; rustc rejects `-C remap-path-prefix`.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--icf=safe --remap-path-prefix=${{ github.workspace }}=/"
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up zram and swap
        # Best effort: timeouts or failures only warn and never block (falls back to stock runner memory).
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup did not finish; continuing with stock runner memory"

      # Hosted runners are single-disk (/ and /mnt share one ext4; the x64 image boots
      # with only ~13-14G free); a cold release build (700+ crates, dep-level O2) once
      # filled the disk (ENOSPC). Remove unused preinstalled SDKs before any toolchain, cache, or dependency lands.
      - name: Prepare disk space for the release build
        run: |
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py --aggressive --min-free-gib 24
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No rust-cache here: releases are strictly read-only against the cache
      # (2026-10 quota policy, pinned by test_release_cache_policy). The
      # restore-only steps that used to live here were removed on 2026-10-15 —
      # zero release-* entries existed live (nothing has written them since the
      # save side was disabled), so every restore was a guaranteed miss and the
      # steps were dead weight. Re-adding caching to a release job needs a
      # fresh look at the quota policy first.

      # pinvou3 编译链接的系统库(gtk/webkit/soup/rsvg/openssl/X11×3/appindicator),
      # ubuntu runner 默认没装;cmake:reqwest 的 rustls 用 aws-lc-rs,其 build script
      # 需 cmake + C 编译器。清单同 pr-check.yml(含 lld,thin LTO 的 link 依赖)。
      - name: 装 Tauri + pinvou3 Linux 系统依赖
        run: |
          sudo apt-get update
          # Package list audited per-package on 2026-09-15 (single-package simulated install;
          # removable when the installed set is unchanged): the gtk/soup/x11 trio is
          # pulled in transitively by libwebkit2gtk-4.1-dev; librsvg2-dev is not needed (no rsvg crate in Cargo).
          # libssl-dev stays: hf-hub -> native-tls -> openssl-sys is not vendored; appindicator is used for the tray.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libegl-dev \
            build-essential pkg-config cmake lld
          # Reduce footprint at the source: orphan dependencies, apt cache packages, and index lists do not stay on the build disk.
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      # pipewire-rs 0.10 (computer_use Wayland capture, direct + via xcap) needs
      # SPA static inline helpers that ubuntu-22.04's libpipewire 0.3.48 headers
      # lack (libspa-sys bindgens against system headers at build time). Build
      # the upstream 1.0.7 headers+lib into /usr/local so pkg-config resolves
      # the prefix; idempotent, no runner-image drift. Mirrors the pr-check
      # rust legs — the release build compiles the identical crate graph.
      # See scripts/ci-libpipewire-build.sh for the full rationale.
      - name: Build PipeWire 1.0.7 dev prefix (jammy SPA headers too old)
        run: bash scripts/ci-libpipewire-build.sh

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache. setup-node cannot be told not to save, so keeping
          # cache: 'npm' re-mints a main-scope single-lockfile entry
          # whenever the previous one is gone — evicted, or displaced by a
          # lockfile hash change (scopes are refs: release jobs run in main
          # scope alongside pr-check's push legs; an exact hit in scope
          # skips the re-save, and the 0.10.11 macOS release leg genuinely
          # restored 294MB from exactly such an entry). What the
          # removal costs is seconds of npm ci on a rare job (cold npm ci
          # measured 10-25s in the release runs); what it saves is ~0.2-0.3GB
          # of per-release churn against the 10GB quota. Pinned by
          # test_release_cache_policy; the other three release setup-node
          # steps below carry the same policy via a pointer comment.

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # build.js 自动注入 config/platforms/linux overlay,并自动准备 codex bridge。
      # 只打 deb(config overlay 的 targets 也只列了 deb)。
      - name: 构建 deb
        working-directory: pinvou3-app
        run: node scripts/tauri/build.js build --bundles deb

      # The tauri bundler hardcodes data.tar to gzip-6 (tauri.conf exposes no
      # compression knob); repack as xz -9 to shrink the package. The content
      # is untouched and the sha256 is computed afterwards, so it covers the
      # final artifact.
      - name: Repack deb (data.tar gzip-6 → xz -9)
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: bash "$GITHUB_WORKSPACE/scripts/repack-deb-xz.sh" "pinvou3_${VERSION}_amd64.deb"

      # tauri deb 产物默认名 pinvou3_<version>_amd64.deb,重命名为统一全平台命名
      # pinvou-agent_<version>-linux-x64.deb(与制品 zip 名对齐)。
      - name: 校验产物 + 统一命名 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: |
          set -euo pipefail
          SRC=$(ls pinvou3_*_amd64.deb)
          DST="pinvou-agent_${VERSION}-linux-x64.deb"
          mv "$SRC" "$DST"
          SHA=$(sha256sum "$DST" | awk '{print $1}')
          echo "deb sha256: $SHA"
          echo "$SHA  $DST" > "$DST.sha256"
          ls -lh "$DST"

      # glibc 下限守护:解包 deb,对每个 ELF 断言 GLIBC_ 符号版本 ≤ 2.35
      # (Ubuntu 22.04 基线)。runner 被误升或依赖引入新符号时在此挡下,
      # 而不是等 22.04 用户启动崩溃。deb 内 ELF = 主二进制 + codex-bridge
      # 的 node + knowledge-host 的 pinvou-knowledge-server + ASR 引擎
      # sense-voice-main(knowledge-host 的 helper 是 shell、连接器 CLI 首用下载)。
      - name: glibc 下限守护 (Ubuntu 22.04 = glibc 2.35)
        run: ./scripts/check-linux-glibc-floor.sh "pinvou3-app/src-tauri/target/release/bundle/deb/pinvou-agent_${VERSION}-linux-x64.deb" amd64

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou-agent-${{ needs.check-version-bump.outputs.version }}-linux-x64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-linux-x64.deb
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-linux-x64.deb.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 3: Linux arm64 deb(GitHub 原生 arm64 runner,公共仓库免费) ──
  build-linux-arm64:
    name: 构建 Linux arm64 deb
    needs: check-version-bump
    if: needs.check-version-bump.outputs.build_required == 'true'
    # 与 build-linux-x64 同理:Linux 发布基线是 Ubuntu 22.04 (glibc 2.35),
    # runner 钉在 ubuntu-22.04-arm,升级前先确认新基线决策。
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # release profile 已在 Cargo.toml 设为 thin LTO(原 fat 在 ubuntu 16GB 上
      # link 内存越线被 SIGTERM),ARM 不再用 env 覆盖 profile。
      # lld kept: BFD ld is slow and memory-hungry object-linking large Rust
      # binaries (same as x64); the linker receives only post-LTO plain
      # objects, and cross-crate merging completes inside the final crate's
      # rustc process.
      # Mechanism note (2026-10 calibration): rustc 1.90's default rust-lld
      # self-linking covers x86_64-unknown-linux-gnu only; on aarch64 rustc
      # still goes through cc to BFD, so this flag is the lld selection that
      # actually takes effect (apt's ld.lld), not a fallback. The ThinLTO
      # backends run inside rustc's process, so no cap is needed (same reason
      # as x64).
      # lld is required: BFD links large binaries with poor memory efficiency
      # (proven OOM) and has no --icf, so it cannot do --icf=safe. Thin LTO
      # itself is executed by rustc and is independent of the linker identity
      # (see the Cargo.toml [profile.release] comments for the mechanism).
      # --icf=safe / remap-path-prefix: same as build-linux-x64 (see that
      # job's comments for the conservative-tier trade-off and the known
      # fn-address identity boundary rust#160267; the RUSTFLAGS env covers
      # both the tauri main build and knowledge-host).
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--icf=safe --remap-path-prefix=${{ github.workspace }}=/"
      # release 编译 codewhale-tui 的 SIGBUS 同源风险防护(同 build-linux-x64,
      # 正式入口按平台注入 RUSTC_WRAPPER,见 config.toml 注释)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up zram and swap
        # Best effort: timeouts or failures only warn and never block (falls back to stock runner memory).
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup did not finish; continuing with stock runner memory"

      # The ARM64 image has ample headroom (~34G free), so the base tier
      # already clears the 24G floor; deleting the tool cache would buy
      # little and only force setup-node to re-download Node afterwards.
      - name: Prepare disk space for the release build
        run: |
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py --min-free-gib 24
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No rust-cache here — same read-only quota policy as build-linux-x64
      # (see that job's comment; pinned by test_release_cache_policy).

      - name: 装 Tauri + pinvou3 Linux 系统依赖
        run: |
          sudo apt-get update
          # Package list audited per-package on 2026-09-15 (single-package simulated install;
          # removable when the installed set is unchanged): the gtk/soup/x11 trio is
          # pulled in transitively by libwebkit2gtk-4.1-dev; librsvg2-dev is not needed (no rsvg crate in Cargo).
          # libssl-dev stays: hf-hub -> native-tls -> openssl-sys is not vendored; appindicator is used for the tray.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libegl-dev \
            build-essential pkg-config cmake lld
          # Reduce footprint at the source: orphan dependencies, apt cache packages, and index lists do not stay on the build disk.
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      # pipewire-rs 0.10 (computer_use Wayland capture, direct + via xcap) needs
      # SPA static inline helpers that ubuntu-22.04's libpipewire 0.3.48 headers
      # lack (libspa-sys bindgens against system headers at build time). Build
      # the upstream 1.0.7 headers+lib into /usr/local so pkg-config resolves
      # the prefix; idempotent, no runner-image drift. Mirrors the pr-check
      # rust legs — the release build compiles the identical crate graph.
      # See scripts/ci-libpipewire-build.sh for the full rationale.
      - name: Build PipeWire 1.0.7 dev prefix (jammy SPA headers too old)
        run: bash scripts/ci-libpipewire-build.sh

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache — same policy and rationale as the first
          # setup-node above (dropping it stops the per-release main-scope
          # re-mint; the lost warmth is seconds of npm ci), pinned by
          # test_release_cache_policy.

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # 连接器 CLI 不在构建期下载或打入安装包；用户首次连接时，应用按
      # connectors.lock.json 在线下载、校验并安装到用户目录。
      # VERSION bump 与人工触发都产出正式 artifact，完整使用 release profile。
      - name: 构建 deb
        working-directory: pinvou3-app
        run: node scripts/tauri/build.js build --bundles deb

      # Repack deb (data.tar gzip-6 → xz -9), same as build-linux-x64.
      - name: Repack deb (data.tar gzip-6 → xz -9)
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: bash "$GITHUB_WORKSPACE/scripts/repack-deb-xz.sh" "pinvou3_${VERSION}_arm64.deb"

      # tauri deb 产物默认名 pinvou3_<version>_arm64.deb,重命名为统一全平台命名
      # pinvou-agent_<version>-linux-arm64.deb(与制品 zip 名对齐)。
      - name: 校验产物 + 统一命名 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: |
          set -euo pipefail
          SRC="pinvou3_${VERSION}_arm64.deb"
          DEB="pinvou-agent_${VERSION}-linux-arm64.deb"
          test -f "$SRC" || { echo "❌ deb 产物不存在: $SRC"; ls -la; exit 1; }
          mv "$SRC" "$DEB"
          SHA=$(sha256sum "$DEB" | awk '{print $1}')
          echo "deb sha256: $SHA"
          echo "$SHA  $DEB" > "$DEB.sha256"
          ls -lh "$DEB"

      # glibc 下限守护(同 build-linux-x64,断言全部 ELF 的 GLIBC_ 符号 ≤ 2.35)。
      - name: glibc 下限守护 (Ubuntu 22.04 = glibc 2.35)
        run: ./scripts/check-linux-glibc-floor.sh "pinvou3-app/src-tauri/target/release/bundle/deb/pinvou-agent_${VERSION}-linux-arm64.deb" arm64

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou-agent-${{ needs.check-version-bump.outputs.version }}-linux-arm64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-linux-arm64.deb
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-linux-arm64.deb.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 4: Linux loongarch64 deb(x86_64 runner 全程交叉,GitHub 无 loong64 runner) ──
  build-linux-loongarch64:
    name: 构建 Linux loongarch64 deb
    needs: check-version-bump
    if: needs.check-version-bump.outputs.build_required == 'true'
    # GitHub 托管 runner 没有 loong64,job 跑在 x86_64 ubuntu-22.04 上,由
    # scripts/ci-build-linux-loongarch64.sh 全程交叉:sha256 钉死的
    # loong64/cross-tools 20260912(stable, gcc 14.4/glibc 2.38;只有 bfd,
    # 没有 lld)+ deepin beige (glibc 2.38) sysroot。目标基线 = deepin
    # 23/25 + UOS V25 的 glibc 2.38,由工具链/sysroot 决定而非 runner 发行版
    # (与 x64/arm64 的"链接构建机 glibc"模型不同,详见 floor 守护注释)。
    # 交叉构建显著慢于原生 arm64(90min),timeout 按 ~1.5x 放大。
    runs-on: ubuntu-22.04
    timeout-minutes: 135
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # 与 x64/arm64 同源风险:release(thin-LTO O3) 编译 codewhale-tui 的
      # rustc/LLVM 栈溢出(SIGBUS)。交叉构建的 rustc 仍是 x86_64 宿主进程,
      # 同一 sh 版 wrapper 原样生效;编排脚本原样继承本 job 的环境。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
      # 交叉工具链与 sysroot 放在 cargo target 目录之外(target 归 cargo 域,
      # 钉死版本的工具链树走下面的独立 actions/cache 键)。语义注意:
      # ci-loongarch64-toolchain.sh 的 --prefix 是"接收目录"(树落在
      # <prefix>/<triple>),而本变量与 ci-loongarch64-sysroot.sh /
      # ci-build-linux-loongarch64.sh 约定的是"工具链根"(含 bin/)。
      # 缓存路径/键与 pr-check.yml 的 rust-loongarch64-check leg 逐字一致。
      PINVOU_LOONG64_CACHE_ROOT: ${{ github.workspace }}/.pinvou-loong64-cache
      PINVOU_LOONG64_TOOLCHAIN_PREFIX: ${{ github.workspace }}/.pinvou-loong64-cache/cross-tools/loongarch64-unknown-linux-gnu
      PINVOU_LOONG64_SYSROOT: ${{ github.workspace }}/.pinvou-loong64-cache/sysroot
      # Rust 旗标由编排脚本按 target 作用域导出(CARGO_TARGET_*_RUSTFLAGS:
      # remap + -C link-arg=--sysroot + -C link-arg=-B(deepin multiarch
      # startfile 目录),都只属于目标单元)。此处刻意不设
      # RUSTFLAGS:cargo 的优先级是已设 RUSTFLAGS 完全压过 target 专属变量,
      # 目标单元会静默丢掉 sysroot 链接旗标——仅此一条就足以致命(--target
      # 交叉构建下宿主 build-script 单元本就收不到任何 rustflags)。
      # arm64 的 -fuse-ld=lld / --icf=safe 同样不复制:钉死的交叉工具链
      # 只有 bfd;LTO 也不覆盖(thin LTO 在 rustc 进程内执行,与链接器无关)。
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up zram and swap
        # Best effort: timeouts or failures only warn and never block (falls back to stock runner memory).
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup did not finish; continuing with stock runner memory"

      # 同 build-linux-x64:x86_64 镜像只有 ~13-14G 空闲,交叉构建的工具链 +
      # sysroot + 两个 cargo target 目录全部落在工作区内,先腾空间。
      - name: Prepare disk space for the release build
        run: |
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py --aggressive --min-free-gib 24
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add the loongarch64 Rust target
        # 编排脚本内部会再跑一次(幂等);显式一步让 target 缺失在该步骤
        # 即红,而不是埋在十几分钟后的编排脚本里。
        run: rustup target add loongarch64-unknown-linux-gnu

      # 工具链/sysroot 缓存:restore-only。发布 job 永不写缓存(同
      # x64/arm64 rust-cache 的 save-if: false 配额策略);写入方是
      # pr-check.yml 的 rust-loongarch64-check leg(main push 保存,同
      # "main 写、其余读"约定)。发布按冷构建规划,命中只是加速;键把
      # setup 脚本内容 hash 进去,脚本(钉的 sha256/包清单)一变即换代,
      # 旧代由 scripts/cache-janitor.sh 规则 E 去重。
      - name: Restore loong64 cross toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PINVOU_LOONG64_CACHE_ROOT }}/cross-tools
          key: release-linux-loong64-jammy-toolchain-${{ hashFiles('scripts/ci-loongarch64-toolchain.sh') }}
          restore-keys: |
            release-linux-loong64-jammy-toolchain-

      - name: Restore loong64 sysroot cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PINVOU_LOONG64_CACHE_ROOT }}/sysroot
          key: release-linux-loong64-jammy-sysroot-${{ hashFiles('scripts/ci-loongarch64-sysroot.sh') }}
          restore-keys: |
            release-linux-loong64-jammy-sysroot-

      # 宿主只需要构建脚本工具(cc/cmake/pkg-config):目标侧的
      # webkit/gtk/soup/openssl/pipewire 头与库全部来自 glibc 2.38 sysroot,
      # 由 ci-loongarch64-sysroot.sh 对逐个 .pc 模块校验。lld 不装(工具链
      # 只有 bfd);pipewire 不需要宿主 1.0.7 前缀(beige 已带 libpipewire
      # 1.2.5,sysroot 头部齐全,见 ci-libpipewire-build.sh 的适用范围)。
      # libclang: libspa/pipewire 的 bindgen 构建脚本在交叉构建时会给
      # libclang 传 --target=loongarch64-...,而 LoongArch 要 LLVM >= 16
      # 才是主 target(jammy 档案里的 libclang 14/15 没有该 target,bindgen
      # 直接 panic "unknown target triple")。因此钉 apt.llvm.org 的
      # llvm-toolchain-jammy-18 套件装 libclang-18-dev,并用 LIBCLANG_PATH
      # 短路 clang-sys 的多目录探测;目标头文件由 BINDGEN_EXTRA_CLANG_ARGS
      # (编排脚本导出)指向 deepin sysroot。此 run 块与 pr-check.yml 的
      # rust-loongarch64-check leg 在注释剥离后逐字一致
      # (test_release_loongarch64_policy 按剥注释文本钉等价)。
      - name: 装 Tauri + pinvou3 Linux 系统依赖 (host 侧)
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
            --retry 3 --retry-delay 2 https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/pinvou-llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/pinvou-llvm.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/pinvou-llvm-18.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libclang-18-dev file
          # Reduce footprint at the source: orphan dependencies, apt cache packages, and index lists do not stay on the build disk.
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          # clang-sys probes several default locations; pin the discovery to
          # the LoongArch-capable libclang this step just installed.
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      # 两步均幂等:restore 命中时脚本自检(marker 含 tag/variant/host/sha;
      # manifest 含 glibc-floor/包清单)直接复用,未命中时下载 + sha256 校验
      # (工具链)或 deepin beige 索引解析 + 逐包 sha256(sysroot)。sysroot
      # 的 docker 方法需要 loong64 binfmt(本 job 未注册),脚本 auto 探测
      # 失败后自动回退 deepin 索引直连方法。dpkg arch: loong64。
      - name: Set up the pinned loong64 cross toolchain (sha256-pinned asset)
        run: bash scripts/ci-loongarch64-toolchain.sh --prefix "$PINVOU_LOONG64_CACHE_ROOT/cross-tools"

      - name: Set up the deepin glibc-2.38 loong64 sysroot
        run: bash scripts/ci-loongarch64-sysroot.sh --output "$PINVOU_LOONG64_SYSROOT" --toolchain-prefix "$PINVOU_LOONG64_TOOLCHAIN_PREFIX"

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache — same policy and rationale as the first
          # setup-node above (dropping it stops the per-release main-scope
          # re-mint; the lost warmth is seconds of npm ci), pinned by
          # test_release_cache_policy.

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # 全流程编排(scripts/ci-build-linux-loongarch64.sh,每步失败即停):
      # knowledge server 交叉 cargo build → SenseVoice 引擎交叉 cmake →
      # build.js build --target loongarch64-unknown-linux-gnu(--bundles none:
      # tauri-bundler 无 LoongArch 分支会 panic,build.js 把该请求翻译成
      # CLI 的 --no-bundle;deb 由 package-deb-loongarch64.sh 手工组装)→
      # repack xz -9 → glibc 2.38 下限守护(内部对解包树逐 ELF 跑
      # check-linux-elf-policy.sh)。工具链/sysroot 已在 job env 导出,
      # 编排脚本检测到后跳过内部安装。
      - name: Cross build + package the loong64 deb
        run: bash scripts/ci-build-linux-loongarch64.sh

      # 编排脚本产出 pinvou3_<version>_loong64.deb,重命名为统一全平台命名
      # pinvou-agent_<version>-linux-loong64.deb(与制品 zip 名对齐)。repack
      # (xz -9)已在编排脚本内完成,重命名后的 sha256 覆盖最终字节。
      - name: 校验产物 + 统一命名 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: |
          set -euo pipefail
          SRC="pinvou3_${VERSION}_loong64.deb"
          DEB="pinvou-agent_${VERSION}-linux-loong64.deb"
          test -f "$SRC" || { echo "❌ deb 产物不存在: $SRC"; ls -la; exit 1; }
          mv "$SRC" "$DEB"
          SHA=$(sha256sum "$DEB" | awk '{print $1}')
          echo "deb sha256: $SHA"
          echo "$SHA  $DEB" > "$DEB.sha256"
          ls -lh "$DEB"

      # glibc 下限守护(同 build-linux-x64/arm64 的 重命名→守护→上传 序列;
      # 断言全部 ELF 的 GLIBC_ 符号 ≤ 2.38 = deepin 23/25 + UOS V25 基线,
      # 架构参数 loongarch64 同时校验包内没有异架构 ELF)。编排脚本在重命名
      # 前对同一字节跑过一次;此处对最终命名产物再跑,失败即阻断发布。
      - name: glibc 下限守护 (deepin 23/25 + UOS V25 = glibc 2.38)
        run: ./scripts/check-linux-glibc-floor.sh "pinvou3-app/src-tauri/target/release/bundle/deb/pinvou-agent_${VERSION}-linux-loong64.deb" loongarch64

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou-agent-${{ needs.check-version-bump.outputs.version }}-linux-loong64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-linux-loong64.deb
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-linux-loong64.deb.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 5: Windows x86_64 nsis(仅受保护的 main 上下文) ─────────────
  build-windows-x64:
    name: 构建 Windows x86_64 nsis
    needs: check-version-bump
    if: github.ref == 'refs/heads/main' && needs.check-version-bump.outputs.build_required == 'true'
    runs-on: windows-latest
    # 0.10.5 的 nsis 构建耗时 ~86min,90min 上限在 post cache save 阶段被撞掉。
    timeout-minutes: 150
    environment:
      name: windows-release
    defaults:
      run:
        # 统一用 Git Bash,sha256sum/通配符逻辑三平台一致。
        shell: bash
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # reqwest 0.13 → aws-lc-sys(非 FIPS)。Windows x86_64 需 NASM 汇编;runner 默认无 NASM,
      # 用预生成 NASM 对象规避(同 pr-check.yml windows-rust-test 的结论)。
      # 当前 Windows 默认发布目标仅 x86_64。
      AWS_LC_SYS_PREBUILT_NASM: "1"
      # release 编译 codewhale-tui 的 SIGBUS 同源风险防护(三端统一注入;
      # Windows 用 .exe 版 wrapper(本 job 先编译):.cmd 经 cmd /C 受 8191 字符
      # 命令行上限限制,windows-sys 等大型 crate 的 rustc 命令行会超限)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          # 公开运行时由初始化脚本按锁文件精确拉取；不向跨仓库 submodule 传递 job token。
          submodules: false
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # [linker consistency, 2026-10-02] Select the bundled lld (lld-link) for
      # the shipped binary too, matching the windows-rust-test leg (#642).
      # rustc hands the linker only plain objects (see the Cargo.toml lto
      # note), so this swaps the object-linking step only. #642 moved the test
      # leg because link.exe thrashed the hosted runner's pagefile there
      # (silent 3-4 h runs killed at their 180/240-minute caps; runs
      # 36919362322/36940184038) while the lld-link recipe runs green; this
      # release job has itself built every completed release with link.exe
      # (0.10.6: 94m42s of a 150 cap; a cancelled 0.10.5 attempt left no OOM
      # evidence) — the swap is for cross-leg consistency on the same
      # workspace, not an OOM fix here.
      # Same probed two-step as #642: stable has no target-spanning flag to
      # pick lld. On 1.99 `-C linker-features=+lld` is unstable on every
      # target (it parses and then hard-errors; only the `-lld` opt-out is
      # stable, x86_64-linux-gnu only), so arm 2 always wins today; arm 1
      # stays so a future +lld stabilization is picked up automatically, and
      # both arms do a real link — a pass cannot be a silent no-op.
      # No /threads:1 cap here, unlike the test leg: the job is time-bound and
      # has never recorded a link-memory thrash with link.exe — capping would
      # only slow the release.
      # NOTE for the reviewer: this changes the shipped nsis binary (different
      # linker, same source). Revert = delete this step.
      - name: Probe and export the Windows lld link flags
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          echo 'fn main() {}' > "$probe/probe.rs"
          if rustc -C linker-features=+lld -o "$probe/probe.exe" "$probe/probe.rs" 2>"$probe/a.err"; then
            flags="-C linker-features=+lld"
          elif rustc -C linker=rust-lld -C linker-flavor=lld-link \
              -o "$probe/probe.exe" "$probe/probe.rs" 2>"$probe/b.err"; then
            flags="-C linker=rust-lld -C linker-flavor=lld-link"
          else
            echo "FAIL: this toolchain has no stable flag to select lld" >&2
            cat "$probe/a.err" "$probe/b.err" >&2 || true
            exit 1
          fi
          echo "probed RUSTFLAGS=$flags"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      # 编译 Windows 专用 .exe 栈 wrapper(源码 scripts/rustc-stack-wrapper.rs)。
      # 直接调 rustc 编译、不经 cargo,故不受本 job 的 RUSTC_WRAPPER 影响,无自举依赖。
      - name: 编译 Windows 栈 wrapper(.exe)
        shell: bash
        run: rustc -O pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs -o pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe

      # No rust-cache here — same read-only quota policy as build-linux-x64
      # (see that job's comment; pinned by test_release_cache_policy).

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache — same policy and rationale as the first
          # setup-node above (dropping it stops the per-release main-scope
          # re-mint; the lost warmth is seconds of npm ci), pinned by
          # test_release_cache_policy.

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      - name: 初始化 Windows 独立运行时
        working-directory: pinvou3-app
        run: npm run runtime:windows:init

      - name: 验证 Windows ONNX Runtime 可加载
        working-directory: pinvou3-app
        run: npm run runtime:windows:onnx-smoke

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      - name: 构建 nsis
        working-directory: pinvou3-app
        run: npm run build:nsis

      # tauri nsis 产物默认名 pinvou3_<version>_x64-setup.exe,重命名为统一全平台命名
      # pinvou-agent_<version>-windows-x64-setup.exe(与制品 zip 名对齐)。
      - name: 校验产物 + 统一命名 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/nsis
        run: |
          set -euo pipefail
          SRC="pinvou3_${VERSION}_x64-setup.exe"
          EXE="pinvou-agent_${VERSION}-windows-x64-setup.exe"
          test -f "$SRC" || { echo "❌ nsis 产物不存在: $SRC"; ls -la; exit 1; }
          mv "$SRC" "$EXE"
          SHA=$(sha256sum "$EXE" | awk '{print $1}')
          echo "nsis sha256: $SHA"
          echo "$SHA  $EXE" > "$EXE.sha256"
          ls -lh "$EXE"

      - name: 上传 nsis artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou-agent-${{ needs.check-version-bump.outputs.version }}-windows-x64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/nsis/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-windows-x64-setup.exe
            pinvou3-app/src-tauri/target/release/bundle/nsis/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-windows-x64-setup.exe.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 6: macOS universal dmg(沿用原 macOS 发布流程的做法) ──────────
  build-macos-universal:
    name: 构建 macOS universal dmg
    needs: check-version-bump
    if: needs.check-version-bump.outputs.build_required == 'true'
    runs-on: macos-15
    # 冷缓存双 target + thin LTO 的临界路径持续增长：0.8.3 冷缓存全程约 110 分钟，
    # 0.8.4 依赖面扩大(+72 crate)后冷缓存估算超 160 分钟，150 分钟上限在 pass2 链接
    # 阶段将构建杀掉(run 32093220066，pass1 90m13s + pass2 被杀于 pinvou3-tauri 链接)。
    # release-macos 缓存又因仓库缓存总量顶满 10GB LRU 上限基本不可能跨发布存活，
    # 每次发布都按冷缓存规划。放宽至 240 分钟覆盖依赖增长与 runner 抖动。
    # 实测仍持续增长：0.10.0-0.10.2 分别 138/219/226 分钟(run 34747563852/
    # 34877996483/35308587808)，0.10.3(run 35377723253)在 241 分钟处撞线被取消，
    # macOS dmg 因此缺席发布而其余三平台完成。放宽至 360 分钟。
    # Link-mechanism note (2026-10 calibration): thin LTO's cross-crate merging
    # completes in-process in the final crate's rustc (Apple ld links only
    # plain objects and never touches bitcode), and there is no cap knob —
    # this job's duration and memory peak are dominated by the rustc side; the
    # mitigation is splitting the universal build (needs a Tauri
    # universal-bundler change, tracked separately) rather than swapping the
    # linker.
    timeout-minutes: 360
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # Normalizes build-machine absolute paths embedded in the artifact
      # (panic locations etc.) to /. Top-level rustc flag — NOT a -C codegen
      # option. Apple ld/ld-prime has no ICF capability,
      # so macOS needs no (and cannot take an) icf flag; -dead_strip is
      # already passed by rustc by default.
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/"
      # v0.9.5 升级后 release(thin-LTO O3)编译 codewhale-tui 时 rustc/LLVM 栈溢出
      # (SIGBUS,run 31558490865 实证)。.cargo/config.toml 不设置 rustc-wrapper
      # (全局键无法按平台条件化),由本 macOS 发布 job 显式注入 RUSTC_WRAPPER
      # 指向 sh 版(wrapper 只作用于编译期 rustc 进程,产物运行时语义不变)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No rust-cache here — same read-only quota policy as build-linux-x64
      # (see that job's comment; pinned by test_release_cache_policy).

      # 实际构建工具链由 src-tauri/rust-toolchain.toml 锁定；必须在该目录下把双 target
      # 安装到 pinned toolchain。只给上面的 stable 引导工具链装 target 会导致 Tauri
      # 切换到 pinned toolchain 后找不到 x86_64 target。
      - name: 安装双 target (universal 构建)
        working-directory: pinvou3-app/src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The macOS 27+ strip=none workaround is removed: every stable toolchain
      # since 1.98 (2026-09) contains the Mach-O __LINKEDIT 8-byte alignment
      # fix (rust#157750, LLVM backport #158410) — rust-toolchain.toml floats
      # stable and can never roll back below it — so strip="symbols" is safe
      # again on every macOS version and artifacts no longer keep
      # symbol tables / debug maps. See docs/binary-size-optimization.md.

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache — same policy and rationale as the first
          # setup-node above (dropping it stops the per-release main-scope
          # re-mint; the lost warmth is seconds of npm ci), pinned by
          # test_release_cache_policy.

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      - name: 构建 dmg
        working-directory: pinvou3-app
        run: |
          set -euo pipefail
          # universal-apple-darwin 是 Tauri 合成 target(内部跑 aarch64+x86_64 两次 cargo + lipo),
          # 产出可在 Intel + Apple Silicon 通用运行的 dmg/app。
          node scripts/tauri/build.js build --target universal-apple-darwin

          DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg/pinvou3_${VERSION}_universal.dmg"
          APP_BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle/macos/pinvou3.app"

          # dmg 打包偶发失败兜底:
          # bundle_dmg.sh 调 osascript 做 Finder 图标美化,CI 无 head 交互环境下偶尔失败
          # (残留临时镜像 / Finder 进程 / osascript 自动化权限)。非 macOS 固有 bug,重跑通常就好。
          # 本 workflow 产出可用 dmg 作 artifact,不能用 continue-on-error,必须带兜底。
          if [ ! -f "$DMG" ] && [ -d "$APP_BUNDLE" ]; then
            echo "⚠️ Tauri dmg 打包未产出 dmg,重试 dmg bundling(跳过编译,只打包)"
            node scripts/tauri/build.js build --target universal-apple-darwin --bundles dmg || echo "⚠️ 重试仍失败,降级手动 hdiutil"
          fi

          # 重试后仍无 dmg:手动 hdiutil 兜底(无 Finder 图标美化,但 dmg 功能完整)。
          if [ ! -f "$DMG" ] && [ -d "$APP_BUNDLE" ]; then
            echo "⚠️ 降级手动 hdiutil 打包(无 Finder 图标美化)"
            DMG_DIR="$(dirname "$DMG")"
            rm -f "$DMG_DIR"/rw.*.dmg 2>/dev/null || true
            TMP_DMG="$DMG_DIR/rw.fallback.dmg"
            hdiutil create -ov -volname "pinvou3" -srcfolder "$APP_BUNDLE" \
              -fs HFS+ -format UDRW "$TMP_DMG" >/dev/null
            DEV=$(hdiutil attach -readwrite -noverify -noautoopen "$TMP_DMG" 2>/dev/null \
                  | grep -E '^/dev/' | sed '1q' | awk '{print $1}')
            ln -sf /Applications "/Volumes/pinvou3/Applications" 2>/dev/null || true
            hdiutil detach "$DEV" >/dev/null 2>&1
            hdiutil convert "$TMP_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG" >/dev/null
            rm -f "$TMP_DMG"
            echo "✓ 手动 dmg 打包完成(无 Finder 图标美化)"
          fi

          test -f "$DMG" || { echo "❌ dmg 产物不存在: $DMG"; exit 1; }

          # Compression upgrade: the tauri dmg (bundler's bundle_dmg) is
          # UDZO/zlib and passes no -imagekey zlib-level, so hdiutil uses its
          # default compression level 1 (speed-oriented). The shared helper
          # converts it to ULMO (LZMA, mountable since macOS 10.15+; our
          # floor is 11.0) and degrades to keeping the original dmg on
          # failure; see scripts/convert-dmg-ulmo.sh for the rationale.
          bash "$GITHUB_WORKSPACE/scripts/convert-dmg-ulmo.sh" "$DMG"

          # 校验 universal dmg 双架构完整性 + 写 checksum 文件(随 artifact 附带)
          BIN="src-tauri/target/universal-apple-darwin/release/bundle/macos/pinvou3.app/Contents/MacOS/pinvou3-tauri"
          echo "lipo 校验 universal 双切片:"
          lipo "$BIN" -info || { echo "❌ universal 二进制校验失败"; exit 1; }
          lipo "$BIN" -verify_arch x86_64 arm64 || { echo "❌ universal 缺 x86_64 或 arm64 切片"; exit 1; }
          echo "✓ universal 双切片齐全 (arm64 + x86_64)"

          # 统一全平台命名:tauri 默认名 pinvou3_<version>_universal.dmg →
          # pinvou-agent_<version>-macos-universal.dmg(与制品 zip 名对齐)。
          DMG_DIR="$(dirname "$DMG")"
          UNIFIED="pinvou-agent_${VERSION}-macos-universal.dmg"
          mv "$DMG" "$DMG_DIR/$UNIFIED"
          cd "$DMG_DIR"
          SHA=$(shasum -a 256 "$UNIFIED" | awk '{print $1}')
          echo "dmg sha256: $SHA"
          echo "$SHA  $UNIFIED" > "$UNIFIED.sha256"
          ls -lh "$UNIFIED"

      - name: 上传 dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou-agent-${{ needs.check-version-bump.outputs.version }}-macos-universal
          path: |
            pinvou3-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-macos-universal.dmg
            pinvou3-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/pinvou-agent_${{ needs.check-version-bump.outputs.version }}-macos-universal.dmg.sha256
          retention-days: 90
          if-no-files-found: error
