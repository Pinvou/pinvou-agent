name: Bug report
description: Report a reproducible problem in Pinvou Agent Community
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Pinvou Agent. Remove credentials, private data, account identifiers, and internal URLs before submitting.
        Do not report security vulnerabilities here. Use the private security link in the template chooser.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version or Git commit where the problem occurs.
      placeholder: "0.7.0 or abc1234"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux x86_64
        - Linux ARM64
        - Windows x86_64
        - macOS Apple Silicon
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start Pinvou Agent with ...
        2. Open ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Include only relevant material and remove secrets and private information.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I wrote the issue title and description in English.
          required: true
        - label: This report does not disclose an unpatched security vulnerability.
          required: true
