# pinvou3 项目级 DeepSeek-TUI 配置
#
# 用途：让 deepseek-tui CLI（exec / sessions / run-deepseek-tui.sh）
# 在 pinvou3 项目目录下自动用 vLLM + Qwen3.6 + 关 thinking。
#
# pinvou3-app（Tauri）本身不读这份文件 —— engine.rs 内 hardcode 配置，
# self-contained 避免对 DeepSeek-TUI 上游 config 加载行为的依赖。

provider           = "vllm"
default_text_model = "/model"
base_url           = "http://10.214.74.113:8000/v1"

# 关 Qwen3 thinking mode：vllm provider 在 reasoning_effort=off 时
# 发 chat_template_kwargs.enable_thinking=false（client.rs:847）。
# 否则简单 prompt 会因 reasoning 段 30-45s 才出第一个 token。
reasoning_effort   = "off"

# api_key 通过环境变量 DEEPSEEK_API_KEY 注入（见 run-deepseek-tui.sh），
# 不在这里硬编码 —— 本地 vLLM 不校验 key，但 deepseek-tui 要求非空。
