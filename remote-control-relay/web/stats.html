<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>PINVOU · 设备运营中心</title>
  <style>
    :root{--bg:#f4f6fa;--card:#fff;--ink:#172033;--muted:#718096;--line:#e8edf4;--blue:#3267e3;--blue2:#7598ee;--green:#1d9b70;--orange:#ed9153;--red:#c54848;--shadow:0 8px 24px rgba(28,39,64,.055);font-family:'PingFang SC',system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}button,input{font:inherit}.app{min-height:100vh}main{min-width:0}
    .logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#4a7cff,#2455d2);color:#fff;font-weight:800;font-size:18px;box-shadow:0 8px 20px rgba(47,101,228,.25)}
    .topbar{height:74px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:20}.top-brand{display:flex;align-items:center;gap:12px}.top-brand b{font-size:17px;letter-spacing:.5px}.top-brand small{display:block;color:#8792a6;margin-top:2px}.top-actions{display:flex;align-items:center;gap:10px}.live{display:flex;align-items:center;gap:8px;color:#66738a;padding:9px 13px;background:#f4f8f6;border-radius:10px}.live i{width:7px;height:7px;border-radius:50%;background:var(--green)}.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;color:#78849a;cursor:pointer}.icon-btn:hover{color:var(--blue);border-color:#cfdaef}.avatar{width:38px;height:38px;border-radius:11px;background:#e8eefc;color:var(--blue);display:grid;place-items:center;font-weight:700}
    .content{max-width:1600px;margin:auto;padding:24px 32px 28px}.headline{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.headline h1{font-size:26px;margin:0 0 7px;letter-spacing:-.5px}.headline p{margin:0;color:var(--muted)}.refresh{color:#8a95a8;font-size:13px}.refresh button{border:0;background:transparent;color:var(--blue);cursor:pointer;margin-left:5px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.metric:after{content:"";position:absolute;right:-26px;top:-38px;width:112px;height:112px;border-radius:50%;background:var(--tint)}.metric-head{display:flex;align-items:center;justify-content:space-between;color:#59667c;font-weight:600}.metric-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-size:17px;position:relative;z-index:1}.metric-main{display:flex;align-items:end;justify-content:space-between;margin-top:14px}.number{font-size:34px;font-weight:720;letter-spacing:-1.5px;line-height:1}.note{color:#8a95a8;font-size:12px;margin-top:8px}.trend{font-size:12px;color:var(--accent);background:var(--tint);padding:5px 8px;border-radius:8px;white-space:nowrap}
    .panels{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,.8fr);gap:16px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:19px 22px;box-shadow:var(--shadow)}.card-title{display:flex;align-items:flex-start;justify-content:space-between}.card-title h2{font-size:17px;margin:0 0 5px}.card-title p{font-size:12px;color:#8a95a8;margin:0}.seg{display:flex;background:#f3f5f8;padding:3px;border-radius:9px}.seg button{border:0;background:transparent;color:#8490a4;padding:6px 10px;border-radius:7px;font-size:12px;cursor:pointer}.seg button.active{background:#fff;color:#34415a;box-shadow:0 2px 7px rgba(25,34,52,.09)}
    .chart{height:190px;margin-top:12px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.gridline{stroke:#edf1f6;stroke-width:1}.axis{fill:#98a2b3;font-size:10px}.area{fill:url(#area)}.line{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.line2{fill:none;stroke:var(--orange);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 5}.legend{display:flex;gap:16px;font-size:12px;color:#778399}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:8px;height:8px;border-radius:3px}
    .donut-wrap{height:191px;display:flex;align-items:center;gap:25px}.donut{width:136px;height:136px;border-radius:50%;background:#e7ecf5;position:relative;flex:none}.donut:after{content:"";position:absolute;inset:24px;background:#fff;border-radius:50%}.donut-center{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center}.donut-center strong{font-size:25px}.donut-center small{color:#8b96a9;margin-top:3px}.version-list{display:grid;gap:12px;flex:1;min-width:0}.version-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;color:#69768b;font-size:12px}.version-row i{width:8px;height:8px;border-radius:3px}.version-row b{color:#34415a;font-size:13px;overflow:hidden;text-overflow:ellipsis}.empty-tip{color:#98a2b3;font-size:11px;margin-top:5px;padding-top:10px;border-top:1px solid var(--line)}
    .table-card{padding:0;overflow:hidden}.table-head{padding:17px 22px 14px;display:flex;justify-content:space-between;align-items:center}.table-title h2{font-size:17px;margin:0 0 5px}.table-title p{font-size:12px;color:#8a95a8;margin:0}.tools{display:flex;gap:8px}.search{border:1px solid var(--line);background:#f8fafc;border-radius:9px;padding:8px 11px;color:#59667c;width:190px;outline:none}.search:focus{border-color:#b7c8eb;background:#fff}.filter{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;color:#59667c;cursor:pointer}.table-wrap{max-height:238px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1080px}th{text-align:left;color:#8a95a8;font-size:12px;font-weight:550;padding:11px 18px;background:#fafbfc;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}td{padding:12px 18px;border-bottom:1px solid #eff2f6;color:#445067;white-space:nowrap}tbody tr:hover{background:#fbfcfe}.device{display:flex;align-items:center;gap:11px}.device-icon{width:34px;height:34px;border-radius:9px;background:#edf2fe;color:var(--blue);display:grid;place-items:center}.device b{display:block;color:#28344b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;max-width:230px;overflow:hidden;text-overflow:ellipsis}.device small{color:#9aa4b5}.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;background:#f0f2f5;color:#8490a4;font-size:12px}.pill i{width:6px;height:6px;background:#aab3c1;border-radius:50%}.pill.online{background:#eaf8f2;color:#18835f}.pill.online i{background:#25a878}.version{padding:5px 8px;background:#f0f4ff;color:#456ac4;border-radius:7px;font-size:12px}.region{color:#53627a}.table-empty{text-align:center;color:#98a2b3;padding:38px}.login-layer{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(17,26,46,.38);backdrop-filter:blur(10px)}.login-layer.hidden{display:none}.login-box{width:min(420px,100%);padding:30px;border:1px solid rgba(255,255,255,.72);border-radius:20px;background:#fff;box-shadow:0 24px 70px rgba(23,32,51,.18)}.login-box .logo{margin-bottom:22px}.login-box h2{margin:0;font-size:24px}.login-box p{margin:8px 0 22px;color:var(--muted);line-height:1.6}.login-box input{width:100%;height:46px;padding:0 14px;border:1px solid #d8dce4;border-radius:11px;outline:0}.login-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(50,103,227,.1)}.primary{width:100%;height:46px;margin-top:12px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.login-error{min-height:20px;margin-top:10px;color:var(--red);font-size:12px}
    @media(max-width:1000px){.panels{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.table-wrap{max-height:none}.table-card{overflow:auto}}
    @media(max-width:680px){.topbar{height:62px;padding:0 16px}.top-brand small,.live{display:none}.content{padding:21px 16px 36px}.headline{align-items:flex-start}.headline h1{font-size:23px}.refresh{display:none}.metrics{grid-template-columns:1fr}.metric:last-child{grid-column:auto}.panels{grid-template-columns:1fr}.donut-wrap{justify-content:center}.table-head{align-items:flex-start}.tools .search{display:none}}
  </style>
</head>
<body>
<div class="app">
  <main>
    <header class="topbar">
      <div class="top-brand"><div class="logo">P</div><div><b>PINVOU</b><small>设备运营中心</small></div></div>
      <div class="top-actions"><div class="live"><i></i>实时数据</div><button class="icon-btn" id="logout" title="退出登录">↪</button><div class="avatar">管</div></div>
    </header>
    <div class="content">
      <section class="headline"><div><h1>设备运营概览</h1><p>掌握设备在线情况、活跃趋势与版本健康度</p></div><div class="refresh">更新于 <span id="time">等待数据</span><button id="refreshButton">↻ 刷新</button></div></section>
      <section class="metrics">
        <article class="metric" style="--accent:#3267e3;--tint:#eef3ff"><div class="metric-head"><span>当前在线</span><span class="metric-icon">⌁</span></div><div class="metric-main"><div><div class="number" id="online">—</div><div class="note">5 分钟内收到设备心跳</div></div><span class="trend" id="onlineRate">在线率 —</span></div></article>
        <article class="metric" style="--accent:#1d9b70;--tint:#eaf8f2"><div class="metric-head"><span>今日活跃</span><span class="metric-icon">◷</span></div><div class="metric-main"><div><div class="number" id="activeToday">—</div><div class="note">今日产生有效对话</div></div><span class="trend" id="todayRate">活跃占比 —</span></div></article>
        <article class="metric" style="--accent:#ed9153;--tint:#fff3eb"><div class="metric-head"><span>近 7 日活跃</span><span class="metric-icon">↗</span></div><div class="metric-main"><div><div class="number" id="activeWeek">—</div><div class="note">过去 7 个自然日产生对话</div></div><span class="trend" id="versionCount">版本 —</span></div></article>
      </section>
      <section class="panels">
        <article class="card"><div class="card-title"><div><h2>使用趋势</h2><p>设备活跃与对话次数的相对变化</p></div><div><div class="seg"><button data-days="7">7 天</button><button class="active" data-days="30">30 天</button></div><div class="legend" style="margin-top:11px"><span><i style="background:#3267e3"></i>活跃设备</span><span><i style="background:#ed9153"></i>对话次数</span></div></div></div><div class="chart"><svg id="trendSvg" viewBox="0 0 780 220" preserveAspectRatio="none"></svg></div></article>
        <article class="card"><div class="card-title"><div><h2>版本覆盖</h2><p>近 7 日活跃设备</p></div></div><div class="donut-wrap"><div class="donut" id="versionDonut"><div class="donut-center"><strong id="versionTotal">0</strong><small>活跃设备</small></div></div><div class="version-list" id="versionList"></div></div></article>
      </section>
      <section class="card table-card" id="devices"><div class="table-head"><div class="table-title"><h2>设备明细</h2><p id="deviceSummary">等待设备数据</p></div><div class="tools"><input class="search" id="deviceSearch" placeholder="搜索设备 ID / 区域"/><button class="filter" id="statusFilter">全部状态⌄</button></div></div><div class="table-wrap"><table><thead><tr><th>设备</th><th>状态</th><th>当前版本</th><th>系统</th><th>所在区域</th><th>首次登记</th><th>最后活跃</th><th>近 7 日对话</th></tr></thead><tbody id="deviceRows"></tbody></table></div></section>
    </div>
  </main>
</div>
<div class="login-layer" id="loginLayer"><form class="login-box" id="loginForm"><div class="logo">P</div><h2>进入设备运营中心</h2><p>该页面包含内部设备使用数据，请输入管理员密码继续。</p><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" required/><button class="primary" type="submit">安全登录</button><div class="login-error" id="loginError"></div></form></div>
<script>
  const $=id=>document.getElementById(id),nf=new Intl.NumberFormat('zh-CN');
  const state={overview:null,devices:[],range:30,status:'all',query:'',timer:null};
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const platform=value=>({linux:'Linux',windows:'Windows',macos:'macOS'}[String(value||'').toLowerCase()]||value||'—');
  const dateTime=value=>value?new Date(value).toLocaleString('zh-CN',{hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
  const relativeTime=value=>{if(!value)return'—';const seconds=Math.max(0,Math.floor((Date.now()-value)/1000));if(seconds<60)return'刚刚';if(seconds<3600)return`${Math.floor(seconds/60)} 分钟前`;if(seconds<86400)return`${Math.floor(seconds/3600)} 小时前`;return dateTime(value)};
  const percent=(part,total)=>total?`${Math.round(part/total*100)}%`:'—';
  async function api(path,options={}){const response=await fetch(`/pinvou3/stats/api/${path}`,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});if(response.status===401)throw new Error('unauthorized');if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}
  function showLogin(message=''){if(state.timer)clearInterval(state.timer);state.timer=null;$('loginLayer').classList.remove('hidden');$('loginError').textContent=message;setTimeout(()=>$('password').focus(),60)}
  function linePath(values,max,left=35,right=770,top=22,bottom=184){if(!values.length)return'';return values.map((value,index)=>{const x=left+(right-left)*(values.length===1?0:index/(values.length-1));const y=bottom-(Math.max(0,value)/(max||1))*(bottom-top);return`${index?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`}).join(' ')}
  function renderTrend(){const source=state.overview?.usage_trend||[],days=source.slice(-state.range),active=days.map(row=>row.active_devices||0),turns=days.map(row=>row.turns||0),activePath=linePath(active,Math.max(1,...active)),turnPath=linePath(turns,Math.max(1,...turns));const labels=[0,Math.floor((days.length-1)/4),Math.floor((days.length-1)/2),Math.floor((days.length-1)*3/4),days.length-1].filter((value,index,array)=>value>=0&&array.indexOf(value)===index);$('trendSvg').innerHTML=`<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3267e3" stop-opacity=".18"/><stop offset="1" stop-color="#3267e3" stop-opacity="0"/></linearGradient></defs>${[22,76,130,184].map(y=>`<line class="gridline" x1="35" y1="${y}" x2="770" y2="${y}"/>`).join('')}<path class="area" d="${activePath} L770 184 L35 184 Z"/><path class="line" d="${activePath}"/><path class="line2" d="${turnPath}"/>${labels.map(index=>{const x=35+735*(days.length===1?0:index/(days.length-1));return`<text class="axis" x="${x.toFixed(1)}" y="214" text-anchor="${index===0?'start':index===days.length-1?'end':'middle'}">${days[index]?.day.slice(5)||''}</text>`}).join('')}`}
  function renderVersions(){const versions=state.overview?.active_versions||[],total=versions.reduce((sum,row)=>sum+row.count,0),colors=['#3267e3','#9bb3ed','#ed9153','#e7ecf5'];$('versionTotal').textContent=nf.format(total);$('versionCount').textContent=`版本 ${versions.length||0} 个`;if(!versions.length){$('versionDonut').style.background='#e7ecf5';$('versionList').innerHTML='<div class="empty-tip">近 7 日暂无活跃版本数据</div>';return}let cursor=0;const segments=versions.slice(0,3).map((row,index)=>{const start=cursor;cursor+=row.count/total*100;return`${colors[index]} ${start}% ${cursor}%`});if(cursor<100)segments.push(`${colors[3]} ${cursor}% 100%`);$('versionDonut').style.background=`conic-gradient(${segments.join(',')})`;const visible=versions.slice(0,3);$('versionList').innerHTML=visible.map((row,index)=>`<div class="version-row"><i style="background:${colors[index]}"></i><b>${escapeHtml(row.version)}</b><span>${nf.format(row.count)} 台 · ${percent(row.count,total)}</span></div>`).join('')+(versions.length>3?`<div class="version-row"><i style="background:${colors[3]}"></i><b>其他版本</b><span>${nf.format(versions.slice(3).reduce((sum,row)=>sum+row.count,0))} 台</span></div>`:'')}
  function renderMetrics(){const counts=state.overview?.counts||{},total=state.devices.length;$('online').textContent=nf.format(counts.online||0);$('activeToday').textContent=nf.format(counts.active_today||0);$('activeWeek').textContent=nf.format(counts.active_7d||0);$('onlineRate').textContent=`在线率 ${percent(counts.online||0,total)}`;$('todayRate').textContent=`7日内占比 ${percent(counts.active_today||0,counts.active_7d||0)}`;$('time').textContent=new Date(state.overview?.generated_at||Date.now()).toLocaleTimeString('zh-CN',{hour12:false});renderTrend();renderVersions()}
  function renderDevices(){const all=state.devices,query=state.query.toLowerCase(),rows=all.filter(device=>(!query||`${device.device_id} ${device.region||''}`.toLowerCase().includes(query))&&(state.status==='all'||(state.status==='online')===Boolean(device.online)));$('deviceSummary').textContent=`共 ${nf.format(all.length)} 台设备 · ${nf.format(all.filter(device=>device.online).length)} 台在线`;$('deviceRows').innerHTML=rows.length?rows.map(device=>`<tr><td><div class="device"><span class="device-icon">▣</span><div><b title="${escapeHtml(device.device_id)}">${escapeHtml(device.device_id)}</b><small>桌面设备</small></div></div></td><td><span class="pill ${device.online?'online':''}"><i></i>${device.online?'在线':'离线'}</span></td><td><span class="version">${escapeHtml(device.app_version||'—')}</span></td><td>${escapeHtml(platform(device.platform))}</td><td class="region">${escapeHtml(device.region||'未知')}</td><td>${dateTime(device.first_seen_at)}</td><td>${relativeTime(device.last_active_at)}</td><td>${nf.format(device.turns_7d||0)}</td></tr>`).join(''):'<tr><td class="table-empty" colspan="8">没有符合条件的设备</td></tr>'}
  async function refreshData(manual=false){try{const[overview,devices]=await Promise.all([api('overview'),api('devices')]);state.overview=overview;state.devices=devices.devices||[];$('loginLayer').classList.add('hidden');renderMetrics();renderDevices();if(manual){$('refreshButton').textContent='✓ 已更新';setTimeout(()=>$('refreshButton').textContent='↻ 刷新',1200)}}catch(error){if(error.message==='unauthorized')showLogin();else{$('time').textContent='刷新失败';if(manual)$('refreshButton').textContent='↻ 重试'}}}
  document.querySelectorAll('.seg button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.seg button').forEach(item=>item.classList.remove('active'));button.classList.add('active');state.range=Number(button.dataset.days);renderTrend()}));
  $('deviceSearch').addEventListener('input',event=>{state.query=event.target.value.trim();renderDevices()});
  $('statusFilter').addEventListener('click',()=>{state.status=state.status==='all'?'online':state.status==='online'?'offline':'all';$('statusFilter').textContent={all:'全部状态⌄',online:'仅在线⌄',offline:'仅离线⌄'}[state.status];renderDevices()});
  $('refreshButton').addEventListener('click',()=>refreshData(true));
  $('loginForm').addEventListener('submit',async event=>{event.preventDefault();$('loginError').textContent='';try{await api('login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';$('loginLayer').classList.add('hidden');await refreshData();if(!state.timer)state.timer=setInterval(refreshData,30000)}catch(error){showLogin(error.message==='unauthorized'?'密码不正确，请重试':'登录失败，请稍后重试')}});
  $('logout').addEventListener('click',async()=>{try{await api('logout',{method:'POST',body:'{}'})}catch{}showLogin()});
  refreshData().then(()=>{if($('loginLayer').classList.contains('hidden')&&!state.timer)state.timer=setInterval(refreshData,30000)});
</script>
</body>
</html>
