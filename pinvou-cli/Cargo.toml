[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
futures = "0.3"
fs4 = "1.1"
parquet = { version = "60.0", default-features = false }
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.49", default-features = false }
windows-sys = "0.61.2"
