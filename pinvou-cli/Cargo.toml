[workspace]
members = ["crates/*"]
# resolver = "3" is edition 2024's default and is MSRV-aware, like
# src-tauri/knowledge: `cargo update` here now respects rust-version = 1.90
# and cannot silently pick rustc-1.92+ crates (e.g. ort rc.14/rc.15).
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
futures = "0.3"
fs4 = "1.1"
parquet = { version = "60.0", default-features = false }
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.49", default-features = false }
windows-sys = "0.61.2"
