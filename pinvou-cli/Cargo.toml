[workspace]
members = ["crates/*"]
# Virtual workspaces default to resolver "1" regardless of member editions,
# so this explicit key is load-bearing: "3" is the MSRV-aware resolver that
# src-tauri/knowledge get from their edition-2024 package manifests —
# `cargo update` here respects rust-version = 1.90 and holds back crates
# needing a newer rustc when a compatible version exists.
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
# Cross-process lock files (benchmark-core run execution, adapter-gaia
# acquisition): try-lock, then hold the fd until the guard drops. fd-lock
# is already in the graph (transitive via codewhale-config) and wraps the
# same OS primitives fs4 did — flock(unix) / LockFileEx(windows) — so the
# swap removes a crate that had only these two call sites.
fd-lock = "4"
futures = "0.3"
parquet = { version = "60.0", default-features = false }
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.49", default-features = false }
windows-sys = "0.61.2"

# Same CJK-aware unicode-width patch the app declares (#4479): this workspace
# resolves the full app graph (product-backend -> src-tauri -> codewhale-tui ->
# ratatui) and would otherwise measure ambiguous-width characters with vanilla
# width() tables, reproducing the cell-offset glitches the patch fixes.
[patch.crates-io]
unicode-width = { path = "../CodeWhale/patches/unicode-width-0.2.2" }
