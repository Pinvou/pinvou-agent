[workspace]
members = ["crates/*"]
# Virtual workspaces default to resolver "1" regardless of member editions,
# so this explicit key is load-bearing: "3" is the MSRV-aware resolver that
# src-tauri/knowledge get from their edition-2024 package manifests —
# `cargo update` here respects rust-version = 1.90 and holds back crates
# needing a newer rustc when a compatible version exists.
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
futures = "0.3"
fs4 = "1.1"
parquet = { version = "60.0", default-features = false }
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.49", default-features = false }
windows-sys = "0.61.2"
