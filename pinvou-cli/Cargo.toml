[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
futures = "0.3"
fs4 = "1.1"
# Held at the 59.1 line: parquet 60 pulls zstd 0.14 -> zstd-sys 2.1.1, and with
# it the windows-rust-test `pinvou-cli` lib-test link loses MSVC CRT resolution
# entirely (probe/src-tauri links stay green in the same job; reproduced on two
# runs). Held until the zstd-sys 2.1.1 MSVC link regression is root-caused.
parquet = { version = "=59.1.0", default-features = false }
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.49", default-features = false }
windows-sys = "0.61.2"
