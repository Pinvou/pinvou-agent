[package]
name = "adapter-gaia"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = ["dep:arrow-array", "dep:arrow-schema", "parquet/arrow"]

[dependencies]
agent-backend-api = { path = "../agent-backend-api" }
arrow-array = { version = "60.0", optional = true }
arrow-schema = { version = "60.0", optional = true }
async-trait.workspace = true
benchmark-core = { path = "../benchmark-core" }
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
parquet = { workspace = true, features = ["snap", "flate2-rust_backend", "zstd"] }
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2.workspace = true
fs4.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
arrow-array = "60.0"
arrow-schema = "60.0"
futures.workspace = true
parquet = { workspace = true, features = ["arrow", "snap", "flate2-rust_backend", "zstd"] }

[[test]]
name = "dataset_contract"
path = "tests/dataset_contract.rs"
required-features = ["test-support"]
