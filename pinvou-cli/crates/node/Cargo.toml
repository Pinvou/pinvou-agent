[package]
name = "pinvou-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pinvou-protocol = { path = "../protocol" }
pinvou-runtime-api = { path = "../runtime-api" }
pinvou-seglog = { path = "../seglog" }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "pinvou-node"
path = "src/main.rs"
