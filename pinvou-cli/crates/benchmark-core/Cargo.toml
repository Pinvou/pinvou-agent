[package]
name = "benchmark-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agent-backend-api = { path = "../agent-backend-api" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
rand.workspace = true
sha2.workspace = true
zeroize = "1.9.0"
fs4.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
futures.workspace = true
# `test-util` powers `#[tokio::test(start_paused = true)]` in the runner
# contract tests (virtual time fires the 600 s local-phase fallback cap
# instantly); test builds only — the production feature set is unchanged.
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
