# cargo-deny 配置 —— pinvou3-app/src-tauri
# 用法:`cargo deny check`(需 `cargo install cargo-deny`)。CI 在 pr-check.yml 里调用。
# 四类检查:advisories(RUSTSEC 漏洞)、licenses(开源合规)、bans(重复 crate / 禁用 crate)、
# sources(只允许 crates.io + 本地 path 依赖)。

[graph]
# 只检查本 crate 的依赖图(含 path 依赖 CodeWhale)。
all-features = true

[advisories]
version = 2
# CI 里 `cargo deny check advisories` 命中新漏洞就 fail;下面是已评估、暂不能在本仓修复的条目。
# 真漏洞(anyhow RUSTSEC-2026-0190、crossbeam-epoch RUSTSEC-2026-0204)已通过 cargo update
# 修掉(anyhow 1.0.104 / crossbeam-epoch 0.9.20),不再命中。
ignore = [
    # RUSTSEC-2026-0194 (quick-xml quadratic complexity) and
    # RUSTSEC-2026-0195 (NsReader memory exhaustion) no longer match:
    # both advisories are fixed in quick-xml >=0.41.0, and every copy in
    # the lock resolves at or above that line (0.41.0 on the direct
    # quick-xml = "0.41"/plist path; 0.42.0 on the calamine 0.37.0 path).
    # Without an ignore entry, a future dependency downgrade below
    # 0.41 would trip the advisory and fail CI again — reassess then.
    #
    # RUSTSEC-2026-0381 (webpki-roots: distrusted emSign intermediates in
    # the bundled root list) needs no ignore: the advisory's patched range
    # is >=1.0.10 and the advisory DB marks the 0.26.11 copy unaffected —
    # the 0.26.x line is a semver compatibility shim that carries no root
    # data and re-exports the patched webpki-roots 1.0.10 store (its lock
    # entry depends on 1.0.10). The 1.x line is bumped in-lock
    # (webpki-roots/webpki-root-certs 1.0.10), and the 0.26.11 shim stays
    # pinned by BOTH tokio-tungstenite 0.30's `^0.26.0` and ureq 2.12's
    # `^0.26` requirements — no patched 0.26.x release exists (the line
    # tops out at 0.26.11), so the shim only leaves via those consumers
    # migrating to webpki-roots 1.x. Companion advisories:
    # RUSTSEC-2026-0382 (rustls-webpki 0.103.x) is closed by 0.103.16;
    # RUSTSEC-2026-0383 (webpki-root-certs) is closed by 1.0.10. If a
    # future DB revision re-flags the shim, cargo-deny fails CI and this
    # posture gets revisited — the same dead-ignore discipline as #705.
    #
    # RUSTSEC-2026-0367/0368/0369 (zip 8.x extract-family) RETIRED
    # (round-31 MAJOR 3): calamine 0.37.0 (rust_version 1.88, published
    # 2026-10-18) requires zip ^9.0, and both workspaces now pin
    # calamine = "0.37" — the graph no longer contains a vulnerable zip.
    # If a future downgrade below zip 9 re-enters the tree, these three
    # advisories trip CI again; the round-30 reachability note (no
    # .extract() call sites) remains true and is the fallback posture.
]
# unmaintained 保留 "workspace":父 crate 依赖图比子模块深
# (子模块 + Tauri GTK3/glib + fastembed),实测 unmaintained="all" 会命中 gtk-rs GTK3、
# glib VariantStrIter(unsound)、number_prefix、proc-macro-error、unic-* 等良性/上游锁定
# 的条目并 fail CI。这些非本仓可修(等 tauri/gtk-rs 升级),"workspace" 仅报 workspace crate,
# 把噪声挡在 CI 之外;真漏洞仍由上面的 ignore 显式管理 + cargo update 修复。
unmaintained = "workspace"
# Restored to "deny" (round-31 MAJOR 3): the supported non-yanked
# dependency update this block waited for HAS landed — calamine 0.37 with
# zip ^9.0.5 — so yanked releases are denied again. Reassess immediately
# if an advisory affects the pinned version.
yanked = "deny"

[licenses]
version = 2
# 允许的许可证白名单(宽松许可)。补充 MIT-0 / BSL-1.0 / NCSA / CDLA-Permissive-2.0:
# 这些是 fastembed/ort/tauri 生态里出现的宽松许可,均允许商用、无 copyleft 传染。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",       # Boost Software License(tauri 生态)
    "NCSA",          # University of Illinois/NCSA(llvm/MLIR 相关)
    "CDLA-Permissive-2.0", # Community Data License(fastembed/ort 模型元数据)
]
confidence-threshold = 0.8

[bans]
# Tauri + CodeWhale 共享图里天然有上百个多版本(reqwest 0.12/0.13、toml_edit×4 等),
# 逐个去重是长期工程,不该卡 CI,也不应让每次审计输出数十万字的已知重复图。
# 这里关闭重复版本报告;漏洞、许可证、来源和通配依赖仍按各自规则独立审计。
# 注意:[bans] 不支持 version 键(只有 [advisories]/[licenses] 支持)。
multiple-versions = "allow"
# wildcards 保留 "warn"(不能升 deny):本仓 3 个 CodeWhale 子模块依赖是
# path = "../../CodeWhale/..." 形式(AGENTS.md §2 禁止给它们加版本约束),
# cargo-deny 把无版本的 path 依赖判为 "wildcard"。升 deny 会把这 3 个**不可改**的
# 子模块依赖直接 fail CI。warn 维持可见性,真正的 `dep = "*"` 版本通配仍会被报出。
wildcards = "warn"
highlight = "all"

[sources]
# 只允许 crates.io + 本地 path 依赖。禁止任何 git/未知 registry。
# 注意:[sources] 不支持 version 键(只有 [advisories]/[licenses] 支持)。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
