# cargo-deny 配置 —— pinvou3-app/src-tauri
# 用法:`cargo deny check`(需 `cargo install cargo-deny`)。CI 在 pr-check.yml 里调用。
# 四类检查:advisories(RUSTSEC 漏洞)、licenses(开源合规)、bans(重复 crate / 禁用 crate)、
# sources(只允许 crates.io + 本地 path 依赖)。

[graph]
# 只检查本 crate 的依赖图(含 path 依赖 CodeWhale)。
all-features = true

[advisories]
version = 2
# CI 里 `cargo deny check advisories` 命中新漏洞就 fail;下面是已评估、暂不能在本仓修复的条目。
# 真漏洞(anyhow RUSTSEC-2026-0190、crossbeam-epoch RUSTSEC-2026-0204)已通过 cargo update
# 修掉(anyhow 1.0.104 / crossbeam-epoch 0.9.20),不再命中。
ignore = [
    # GTK3 的 RUSTSEC-2024-0415 ignore 已在 main 移除（#705，2026-10）：
    # advisory 不再匹配锁定的 gtk 0.18.2（cargo deny 报 advisory-not-detected），
    # 本 PR 仅保留此备注。gtk 0.18 仍是 wry 0.57 的强制版本（GTK3 hold 不变），
    # 若未来 advisory 重新覆盖锁图，advisories 检查会直接报错，届时再评估加回。
    # RUSTSEC-2026-0194 (quick-xml quadratic complexity) and
    # RUSTSEC-2026-0195 (NsReader memory exhaustion) no longer match:
    # both advisories are fixed in quick-xml >=0.41.0, and the lockfile
    # resolves 0.41.0 + 0.42.0（0.42 来自本仓直接依赖与 calamine 0.37/plist 1.10.3;
    # 残留的 0.41.0 仅在 wayland-scanner/xcb 的 Linux 构建链,同样在修复线上）。
    # Without an ignore entry, a future dependency downgrade below
    # 0.41 would trip the advisory and fail CI again — reassess then.
    #
    # RUSTSEC-2026-0367/0368/0369 (zip 8.x extract-family) RETIRED:
    # calamine 0.37 requires zip ^9, and both parent workspaces now pin
    # calamine = "0.37" — the graph converges on a single zip 9.0.5 and no
    # longer contains a vulnerable zip. The round-30 reachability note (the
    # graph never calls the wholesale `ZipArchive::extract()` /
    # stream-extract APIs — every direct zip consumer iterates `by_index`
    # with `enclosed_name()` guards) remains true and is the fallback
    # posture: if a future downgrade below zip 9 re-enters the tree, these
    # three advisories trip CI again.
    #
    # RUSTSEC-2026-0381 (webpki-roots 0.26) ignore removed (2026-10): the
    # current advisory DB no longer matches the locked graph — cargo deny
    # reports advisory-not-detected for the 0.26.11 copy (ureq 2.12.1,
    # frozen by the fastembed platform-floor hold, and tokio-tungstenite
    # 0.30). For the record: 0.26.11 was a semver compatibility shim
    # carrying no root data of its own — it re-exported `TLS_SERVER_ROOTS`
    # from webpki-roots 1.0.10, the patched line every parent lock
    # resolves; no patched 0.26.x release exists (0.26.11 is the last).
    # If a future advisory-DB revision re-covers the shim, the advisories
    # check fails CI again — re-add an ignore with that justification then,
    # or (the real cleanup) migrate those consumers to webpki-roots 1.x.
]
# unmaintained 保留 "workspace":父 crate 依赖图比子模块深
# (子模块 + Tauri GTK3/glib + fastembed),实测 unmaintained="all" 会命中 gtk-rs GTK3、
# glib VariantStrIter(unsound)、number_prefix、proc-macro-error、unic-* 等良性/上游锁定
# 的条目并 fail CI。这些非本仓可修(等 tauri/gtk-rs 升级),"workspace" 仅报 workspace crate,
# 把噪声挡在 CI 之外;真漏洞仍由上面的 ignore 显式管理 + cargo update 修复。
unmaintained = "workspace"
# Restored to "deny": the supported non-yanked dependency update this block
# waited for has landed — calamine 0.37 with a single zip 9.0.5 in the graph —
# so yanked releases are denied again. Reassess immediately if an advisory
# affects the pinned version.
yanked = "deny"

[licenses]
version = 2
# 允许的许可证白名单(宽松许可)。补充 MIT-0 / BSL-1.0 / NCSA / CDLA-Permissive-2.0:
# 这些是 fastembed/ort/tauri 生态里出现的宽松许可,均允许商用、无 copyleft 传染。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",       # Boost Software License(tauri 生态)
    "NCSA",          # University of Illinois/NCSA(llvm/MLIR 相关)
    "CDLA-Permissive-2.0", # Community Data License(fastembed/ort 模型元数据)
]
confidence-threshold = 0.8

[bans]
# Tauri + CodeWhale 共享图里天然有上百个多版本(reqwest 0.12/0.13、toml_edit×4 等),
# 逐个去重是长期工程,不该卡 CI,也不应让每次审计输出数十万字的已知重复图。
# 这里关闭重复版本报告;漏洞、许可证、来源和通配依赖仍按各自规则独立审计。
# 注意:[bans] 不支持 version 键(只有 [advisories]/[licenses] 支持)。
multiple-versions = "allow"
# wildcards 保留 "warn"(不能升 deny):本仓 3 个 CodeWhale 子模块依赖是
# path = "../../CodeWhale/..." 形式(AGENTS.md §2 禁止给它们加版本约束),
# cargo-deny 把无版本的 path 依赖判为 "wildcard"。升 deny 会把这 3 个**不可改**的
# 子模块依赖直接 fail CI。warn 维持可见性,真正的 `dep = "*"` 版本通配仍会被报出。
wildcards = "warn"
highlight = "all"

[sources]
# 只允许 crates.io + 本地 path 依赖。禁止任何 git/未知 registry。
# 注意:[sources] 不支持 version 键(只有 [advisories]/[licenses] 支持)。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
