# pinvou3-app/src-tauri 的 cargo 构建配置。
#
# 关于链接器加速(可选,不强制):
# 本文件**不**硬编码 linker/rustflags——硬编码 `linker = "clang"` + `-fuse-ld=lld` 会强制
# 每台开发/CI 机器都装 clang+lld,缺失就编译失败,跨平台维护成本高。
#
# 想在本地用更快的链接器,请把覆盖写进 `.cargo/config.local.toml`(该文件不入版本控制),
# 示例(Linux,mold/lld 任选其一):
#   [target.x86_64-unknown-linux-gnu]
#   linker = "clang"
#   rustflags = ["-C", "link-arg=-fuse-ld=lld"]   # 或 "-C", "link-arg=-fuse-ld=mold"
#
#   [target.aarch64-unknown-linux-gnu]
#   linker = "clang"
#   rustflags = ["-C", "link-arg=-fuse-ld=lld"]
#
# macOS 不换链接器:Tauri 依赖 Apple ld 处理 framework,换 lld/zld 风险高于收益。
# Windows 不换链接器:MSVC link.exe 是 WebView2/Com 的唯一稳定选项。
#
# 未来若团队统一约定要强制(如 CI 已确认装好 clang+lld),再把这些 rustflags 从
# config.local.toml 提升回这里,并同步更新 CI 镜像。

# =============================================================================
# 编译器自身栈大小 —— 修复 v0.9.5 升级引入的构建栈溢出(三端 2 MiB 默认栈)
# =============================================================================
# 背景:dev 默认对依赖开 O2 + 256 codegen-units 时,rustc/LLVM 编译
# codewhale-tui 会在 MachineLateinstrsCleanup 递归中栈溢出(崩溃为 SIGBUS,
# rustc 1.96/1.97 stable 稳定复现;std 线程默认栈三端均为 2 MiB,
# macOS 已实测触发,Linux/Windows 同源风险)。
# 处理:不降 opt-level(保证依赖正常优化),而是加大编译器自身线程栈。
# 通过 rustc-wrapper 只在编译期 rustc 进程注入 RUST_MIN_STACK=16MiB
# (wrapper 见 scripts/rustc-stack-wrapper.cmd,sh/cmd 双分支,三端可执行):
# 不经过 wrapper 的 cargo run / cargo test 目标进程不会继承该变量,
# 运行时线程栈语义不变。与 rust-lang/rust #160535(默认栈提升到 16 MiB)同方向。
[build]
rustc-wrapper = "scripts/rustc-stack-wrapper.cmd"
