[package]
name = "pinvou3-tauri"
version = "0.8.4"
description = "品悟智能助手桌面应用后端"
authors = ["pinvou"]
license = "MIT"
edition = "2021"
# MSRV:rust-version 是「能编译本 crate 的最低版本」下限;
# 实际构建工具链由 rust-toolchain.toml 锁定到具体版本(可复现),二者语义互补。
rust-version = "1.89"
# 主 binary 是 Tauri app(src/main.rs);src/bin/dump_system_prompt.rs 是 dev 工具,
# 加这个键让 `cargo run`(不带 --bin)默认跑主 app,不再因为多 bin 报错。
default-run = "pinvou3-tauri"
autobins = false

[[bin]]
name = "pinvou3-tauri"
path = "src/main.rs"

[[bin]]
name = "dump_system_prompt"
path = "src/bin/dump_system_prompt.rs"
required-features = ["dev-tools"]

[lib]
name = "pinvou3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["local-embed"]
local-embed = ["pinvou-knowledge/local-embed"]
dev-tools = []

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
pinvou-knowledge = { path = "../../pinvou-knowledge", default-features = false, features = ["client", "discovery"] }
# workflow 整目录内嵌(含二进制),include_str 撑不住
include_dir = "0.7"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
semver = "1"
toml = "1"
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-notification = "2"

# 异步 / 错误
anyhow = "1.0"
async-trait = "0.1" # impl 底座 ToolSpec(kb_search Agentic 工具)
tokio = { version = "1.49", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["compat"] }

# 外部 Agent ACP 客户端：只负责协议连接与 typed schema。Agent 本体由
# Codex/Claude/Kimi 各自的 ACP 实现提供，pinvou3 不复制其会话/工具循环。
agent-client-protocol = { version = "1.0.0", features = [
    "unstable_elicitation",
    "unstable_session_fork",
] }

# 底层 Agent —— CodeWhale 提供 LLM 调用 + 工具循环 + 流式事件。
# 上游 v0.8.45 起 rebrand：库 crate 改名 codewhale-tui。用 Cargo 的 `package`
# 重命名保留本地别名 deepseek-tui，全部 `use deepseek_tui::*` 无需改动
# （上游自己也保留 deepseek-tui bin shim 做 back-compat，做法一致）。
deepseek-tui = { path = "../../CodeWhale/crates/tui", package = "codewhale-tui" }

# 凭证存储复用底座 codewhale-secrets(DefaultKeyringStore + FileKeyringStore 文件回退),
# 不再在 app 层自建 keyring 封装;headless/无 D-Bus 服务器也能存凭证。
codewhale-secrets = { path = "../../CodeWhale/crates/secrets" }

# 复用底座 codewhale-config 的 RouteLimits 类型(填 active_route_limits.context_tokens,
# 把 vLLM 探测的窗口喂给底座压缩阈值推导)。facade(deepseek-tui)不 re-export 该类型,
# 直接引 crate;它已在依赖图内,Cargo.lock 几乎不动。
codewhale-config = { path = "../../CodeWhale/crates/config" }

# Monitor 用：vLLM HTTP probe（/v1/models + Prometheus /metrics）
# 0.13 与 CodeWhale 子模块对齐；feature `rustls`(0.13 改名,自带 aws-lc-rs)。
# aws-lc-rs 构建需 cmake,CI 已加安装步骤。
# 注意:oauth2(经 reqwest 0.12 传递)会把 rustls 0.23 的 `ring` feature 也拉进图,
# 使 rustls 同时启用 aws-lc-rs + ring。tokio-tungstenite 的无参 ClientConfig::builder()
# 在两 provider 共存时会 panic,故需在启动时显式 install_default(见 lib.rs)。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking", "stream", "query"] }
wait-timeout = "0.2"

# rustls 直依赖:仅为在启动时调 aws_lc_rs::default_provider().install_default()
# 选定进程级 CryptoProvider(见上方 panic 根因)。只声明 aws-lc-rs;ring 由传递依赖启用。
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Updater 用：sha256 校验；产物卡封面读 .pptx 里的 thumbnail。
# 0.11 与 CodeWhale 子模块对齐。digest 的 Output 不实现 LowerHex,统一用 hex_lower 编码
# (见 src/platform/encoding.rs)。
sha2 = "0.11"
# 8.x 与 calamine 传递引入的 zip 8.6.0 收敛为单一版本（消除旧 zip 2.x + 连带传递依赖）。
# 仅 deflate（读 .pptx / 写技能 zip 包），关默认 feature 去掉 bzip2/lzma/zstd 等。
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

# Session store 用：阻塞式 RwLock（sync 不需要 .await 拿读写锁）
parking_lot = "0.12"
fs2 = "0.4"

# 时间戳：SessionMetadata.updated_at 用 chrono::Utc::now()，对齐上游 schema
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# File watcher：监听 ~/.pinvou3/sessions/*/workspace/ 新文件产出，
# 自动入 session.artifacts (覆盖 write_file 之外的工具如 exec_shell pandoc 产出的 docx)
# 8.x：把 mio 收敛到 1.x、连带消除 windows-sys 0.48.0，并修 Windows
# FILE_NOTIFY_INFORMATION 未对齐 UB。
# 注意：这不解决 windows-targets 0.48.5（+ 7 个 win 二进制 crate）——那条链由
# device_query 2.1.0 → windows 0.48.0 持有，与 notify 无关，需单独处理 device_query。
# 项目仅用稳定高层 API（recommended_watcher / Watcher::watch / EventKind / RecursiveMode），
# 6→8 公开签名零变化，watcher.rs / file_watcher.rs 源码无需改动。
notify = "8"
msg_parser = "0.3.0"

# 本地知识底座 L0：全系统元数据索引 + 秒搜 + 去重（docs/本地知识底座-产品形态与架构.md）
# rusqlite bundled —— 自带 SQLite + FTS5（名/路径秒搜），不依赖系统 libsqlite，
# 对 .deb 离线分发友好（与 file_ingest 二进制依赖降 recommends 的思路一致）。
rusqlite = { version = "0.39", features = ["bundled"] }
# 全盘遍历：容错(权限不足跳过)、防 symlink 环。L0 扫描器用。
walkdir = "2"

# 本地 embedding（L1 语义检索）：fastembed-rs 进程内 ONNX 推理（CPU EP），**不依赖 vLLM**。
# 模型(bge-m3 ONNX)用户本地下载，UserDefinedEmbeddingModel 从目录加载，不走 HF 自动下载。
# 电子表格解析（file_ingest 用）：读 xlsx/xls/ods 的全部工作表。
# 0.36 拉入 quick-xml 0.41+,修 RUSTSEC-2026-0194/0195 ReDoS。
# 剩余 quick-xml 0.39.4 由 plist/tauri 传递,等上游。
calamine = "0.36"
# 文本附件编码兜底：把国内常见 GBK / GB18030 文件真正转成 UTF-8，
# 避免 `from_utf8_lossy` 把中文正文替换成一串 U+FFFD。
encoding_rs = "0.8"

# CLI 连接器(飞书/企微)扫码授权:把授权 URL 渲染成二维码(SVG data URL,前端 <img> 直显)。
# 纯 Rust,不依赖各 CLI 自带的 qrcode 子命令(wecom-cli 就没有)。关默认的 image 渲染器
# (省掉 image crate 依赖),只用 svg 渲染器。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 0.30:Message::Text 的 String→Utf8Bytes、Ping/Pong 的 Vec→Bytes,relay_client.rs 已适配。
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
rand = "0.9"
base64 = "0.22"
age = { version = "=0.12.1", default-features = false }
tempfile = "3"

# keyring 不再直接依赖 —— 凭证走底座 codewhale-secrets(它内部按平台引 keyring)。
# macOS 桌伴窗口策略补丁(pet_window.rs):
# - NSWindowCollectionBehavior 跨 Space/全屏保持可见(TAO 只设 level,没设 collectionBehavior)
# - NSStatusWindowLevel 提升桌宠浮在全屏 App 之上
# detach.rs 的撕离拖拽已改用 CoreGraphics FFI(不再依赖 objc2 NSEvent global monitor)。
# objc2 0.6.x 是 tao 0.35.2 的传递依赖,这里显式声明只是为了把 major/minor
# 提升到**直接依赖**(否则它只是传递依赖,Cargo 不会按 app 的意愿解析)。
# 注意:这些是 caret 版本(objc2 = "0.6" 允许 0.6.x 内任意 minor/patch 升级),
# **不是** ABI 严格锁——严格锁应写成 `=0.6.4`。caret 版本只保证对齐到同一 major:
# objc2 0.6.x / objc2-app-kit 0.3.x / objc2-foundation 0.3.x,与 tao 0.35.2
# 期望的 objc2 family major 一致即可。具体 patch 由 Cargo.lock 在 lockfile 阶段
# 固定(当前 0.6.4 / 0.3.2)。如未来需要绝对复现同一 ABI,改为精确锁 `=0.6.4`。
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.1", features = ["macos-private-api"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# block2: Speech framework 的 recognitionTask result handler 是 Obj-C block,
# voice_asr_speech.rs 用 block2::RcBlock 包装 Rust 闭包。版本对齐 objc2 0.6 family。
block2 = "0.6"
# macOS 系统 Speech framework 绑定,替代内嵌 SenseVoice ASR 引擎——免模型下载、
# 免 ffmpeg、零额外体积。项目构建与应用最低系统版本统一为 macOS 11。
objc2-speech = { version = "0.3", default-features = false, features = [
    "std",
    "SFSpeechRecognizer",
    "SFSpeechRecognitionTask",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTaskHint",
    "SFTranscription",
    "SFTranscriptionSegment",
    "block2",
    "objc2-avf-audio",
    "objc2-core-media",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.38.2"
windows = "0.61.3"

[target.'cfg(not(windows))'.dependencies]

# Linux webview(webkit2gtk)默认拒绝 getUserMedia → 语音输入点麦克风被拒。
# 连 permission-request 信号放行 UserMedia(麦克风)请求。版本对齐 wry 0.55 用的 2.0.x。
[target.'cfg(target_os = "linux")'.dependencies]
# Tauri 的 show/set_focus 是两条独立主循环消息；隐藏启动窗口在 release 下可能
# 尚未完成 map 就执行 present。直接在 GTK 主线程原子 show/deiconify/present。
gtk = "0.18"
webkit2gtk = "2.0"
# 多窗口撕离(detach.rs begin_detach_drag):X11 全局鼠标坐标+左键状态,
# 驱动鬼影跨屏跟随 + 松手落位。Wayland 下不可用 → 降级(后续 task)。
device_query = "2"

# =============================================================================
# Lint 门禁 —— 硬门禁设计:只启用「当前实测零欠账」的 lint(deny);
# 有欠账的 lint/group 显式 allow 并注明欠账规模,由清理 PR(#35 及后续)消化后逐个启用。
# CI(pr-check.yml rust-lint job)直接跑 `cargo clippy --lib --no-deps`(无 continue-on-error),
# deny 命中即 fail;allow 的欠账 lint 被静默,不产生告警噪声。
# 实测基线(rust 1.97.1,2026-07-28):应用 crate 的 clippy::all 组 20 处欠账
# (不含 CodeWhale),rustc 默认 lint 既有基线为 113 处。
# =============================================================================
[lints.rust]
# —— 零欠账,deny 硬门禁(实测 0 违规)——
# unsafe 代码块内部仍要求显式 unsafe 操作,避免误用:
unsafe_op_in_unsafe_fn = "deny"
# 多余的花括号 import,如 `use std::{collections::{HashMap}};`
unused_import_braces = "deny"
# 能省略的显式 lifetime 标注:
unused_lifetimes = "deny"
# 未使用的 import / 变量 / mut(本 PR 已清零 3 处,deny 防回流):
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

# —— 有欠账,显式 allow;注释给出欠账规模,清理 PR(#35 及后续)消化后升 deny ——
# unreachable_pub:1795 处欠账(全 crate pub 未收口,工程量大,单独清理)。
unreachable_pub = "allow"
# let_underscore_drop:306 处欠账(`let _ =` 吞 Drop 副作用,需逐个确认语义)。
let_underscore_drop = "allow"
# dead_code:96 处欠账(历史保留代码/平台条件编译残留,需甄别后清理)。
dead_code = "allow"
# private_interfaces:14 处欠账(pub 接口暴露私有类型,随 unreachable_pub 一起收口)。
private_interfaces = "allow"

[lints.clippy]
# —— all / pedantic 组有历史欠账,整组 allow(priority=-1 保证下方具体 lint 的 deny 生效)——
# all 组(correctness+suspicious+style+complexity+perf)应用 crate 实测 20 处欠账;
# pedantic 组欠账更多(原方案全量 warn 实测近 2000 条告警,等于无门禁)。
# 欠账由清理 PR(#35 及后续)消化后,再整组或逐 lint 升 deny。
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }

# —— 精选零欠账「防回归」lint,deny 硬门禁(实测 0 违规,新增即 fail CI)——
# dbg!/todo!/unimplemented! 会在运行时 panic 或留下调试残留:遗留即隐患。
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# 多余 unwrap(正确性,误报极低)。
unnecessary_unwrap = "deny"
# 禁 `dep = "*"` 通配版本(防未来新增不锁版本的危险依赖)。
wildcard_dependencies = "deny"
# 注:print_stdout/print_stderr 未启用——本 app 启动诊断大量用 eprintln!(早于日志
#     后端就绪),启用会刷出大量噪声;待日志链路统一后再评估。
# 注:cargo_common_metadata 未启用——本 crate 是 private bin(不发布 crates.io),
#     repository/readme/keywords/categories 无意义。

# =============================================================================
# 构建优化 Profile —— release 开启「安全范围内最大优化」
# =============================================================================
# panic="unwind"(非 abort):底座 CodeWhale 用 catch_unwind 做工具调用 panic 隔离,
# 改 abort 会破坏「单次工具 panic 不拖垮整个会话」的设计。
[profile.release]
opt-level = 3
# Thin LTO 替代 fat:fat 在 ubuntu 16GB runner 上编译 codewhale-tui + tauri 全图
# 会 link 越线被 SIGTERM(merge_group run 实证)。thin 内存峰值与耗时远低于 fat,
# 运行时优化损失可忽略(官方:大型项目 thin 常优于 fat)。
# 注:cargo 在 lto="thin" 时给依赖 crate 传 -C linker-plugin-lto(生成 LLVM bitcode,
# 把跨 crate LTO 推迟到 link 阶段),故 release 构建 link 阶段必须用支持 LLVM bitcode
# 的链接器(lld);release-packages 的 Linux 发布 job 已注入 -fuse-ld=lld。
lto = "thin"
codegen-units = 1
# macOS 27+ 发布链路会注入 CARGO_PROFILE_RELEASE_STRIP=none 绕过 dyld 对齐 bug,
# 本设置主要作用于 Linux deb / Windows MSI 产物。
strip = "symbols"
debug = "line-tables-only"
panic = "unwind"
incremental = false

# 专为 Release 测试/CI 用的轻量 profile:不 LTO、不禁 incremental,编译快但仍走 release 优化。
# mac-build.yml 的编译冒烟与 universal bundle 冒烟均用此 profile,
# 两者产物可互相复用(同 profile 同 target dir),避免 CI 里两套 profile 重复编译全图。
# 真正发版的 thin-LTO 产物由 scripts/release-macos.sh(走真 --release)产出。
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
# debug 不再重复声明:release 已是 line-tables-only,继承即同值。

# Dev profile:line-tables-only 编译提速、overflow-checks 在调试期暴露整数回绕。
[profile.dev]
debug = "line-tables-only"
opt-level = 0
overflow-checks = true
# 依赖在 dev 下也做轻量优化(否则全 debug 编译,运行太慢影响本地调试体验)。
[profile.dev.package."*"]
opt-level = 2
