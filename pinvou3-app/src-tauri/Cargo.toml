[package]
name = "pinvou3-tauri"
version = "0.1.1"
description = "pinvou3 智能助手 Tauri 后端（包装 DeepSeek-TUI EngineHandle）"
authors = ["pinvou"]
license = ""
edition = "2021"
rust-version = "1.88"
# 主 binary 是 Tauri app(src/main.rs);src/bin/dump_system_prompt.rs 是 dev 工具,
# 加这个键让 `cargo run`(不带 --bin)默认跑主 app,不再因为多 bin 报错。
default-run = "pinvou3-tauri"

[lib]
name = "pinvou3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

# 异步 / 错误
anyhow = "1.0"
tokio = { version = "1.49", features = ["full"] }

# 底层 Agent —— DeepSeek-TUI 提供 LLM 调用 + 工具循环 + 流式事件。
# 上游 v0.8.45 起 rebrand：库 crate 改名 codewhale-tui。用 Cargo 的 `package`
# 重命名保留本地别名 deepseek-tui，全部 `use deepseek_tui::*` 无需改动
# （上游自己也保留 deepseek-tui bin shim 做 back-compat，做法一致）。
deepseek-tui = { path = "../../DeepSeek-TUI/crates/tui", package = "codewhale-tui" }

# Monitor 用：vLLM HTTP probe（/v1/models + Prometheus /metrics）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Session store 用：阻塞式 RwLock（sync 不需要 .await 拿读写锁）
parking_lot = "0.12"

# 时间戳：SessionMetadata.updated_at 用 chrono::Utc::now()，对齐上游 schema
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# File watcher：监听 ~/.pinvou3/sessions/*/workspace/ 新文件产出，
# 自动入 session.artifacts (覆盖 write_file 之外的工具如 exec_shell pandoc 产出的 docx)
notify = "6"

# Bundle 内嵌：把 resources/bundle/skills/ 下的多文件 skill（h3c-ppt 含脚本 +
# 二进制图片/母板共 24 文件）整目录编译进 app，启动时解包到 ~/.pinvou3/bundle/skills/。
# include_str! 只能逐个文本文件，撑不住二进制 + 24 文件，故用 include_dir 整目录内嵌。
include_dir = "0.7"
