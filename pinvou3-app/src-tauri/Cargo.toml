[package]
name = "pinvou3-tauri"
version = "0.1.1"
description = "pinvou3 智能助手 Tauri 后端（包装 DeepSeek-TUI EngineHandle）"
authors = ["pinvou"]
license = ""
edition = "2021"
rust-version = "1.88"

[lib]
name = "pinvou3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

# 异步 / 错误
anyhow = "1.0"
tokio = { version = "1.49", features = ["full"] }

# 底层 Agent —— DeepSeek-TUI 提供 LLM 调用 + 工具循环 + 流式事件
deepseek-tui = { path = "../../DeepSeek-TUI/crates/tui" }

# Monitor 用：vLLM HTTP probe（/v1/models + Prometheus /metrics）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Session store 用：阻塞式 RwLock（sync 不需要 .await 拿读写锁）
parking_lot = "0.12"

# 时间戳：SessionMetadata.updated_at 用 chrono::Utc::now()，对齐上游 schema
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# File watcher：监听 ~/.pinvou3/sessions/*/workspace/ 新文件产出，
# 自动入 session.artifacts (覆盖 write_file 之外的工具如 exec_shell pandoc 产出的 docx)
notify = "6"
