[package]
name = "pinvou3-tauri"
version = "0.5.4"
description = "pinvou3 ???? Tauri ????? DeepSeek-TUI EngineHandle?"
authors = ["pinvou"]
license = ""
edition = "2021"
rust-version = "1.88"
# ? binary ? Tauri app(src/main.rs);src/bin/dump_system_prompt.rs ? dev ??,
# ????? `cargo run`(?? --bin)???? app,????? bin ???
default-run = "pinvou3-tauri"
autobins = false

[[bin]]
name = "pinvou3-tauri"
path = "src/main.rs"

[[bin]]
name = "dump_system_prompt"
path = "src/bin/dump_system_prompt.rs"
required-features = ["dev-tools"]

[lib]
name = "pinvou3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
dev-tools = []

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
# workflow ?????(????),include_str ???
include_dir = "0.7"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.2"

# ?? / ??
anyhow = "1.0"
async-trait = "0.1" # impl ?? ToolSpec(kb_search Agentic ??)
tokio = { version = "1.49", features = ["full"] }

# ?? Agent ?? DeepSeek-TUI ?? LLM ?? + ???? + ?????
# ?? v0.8.45 ? rebrand?? crate ?? codewhale-tui?? Cargo ? `package`
# ????????? deepseek-tui??? `use deepseek_tui::*` ????
# ???????? deepseek-tui bin shim ? back-compat???????
deepseek-tui = { path = "../../DeepSeek-TUI/crates/tui", package = "codewhale-tui" }

# Monitor ??vLLM HTTP probe?/v1/models + Prometheus /metrics?
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Updater ???? deb ? sha256 ???Windows OTA ??? zip + MD5?
# ???????? .pptx(zip)?? docProps/thumbnail.jpeg?
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
md5 = "0.7"
flate2 = "1"
tar = "0.4"

# Session store ????? RwLock?sync ??? .await ?????
parking_lot = "0.12"

# ????SessionMetadata.updated_at ? chrono::Utc::now()????? schema
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# File watcher??? ~/.pinvou3/sessions/*/workspace/ ??????
# ??? session.artifacts (?? write_file ?????? exec_shell pandoc ??? docx)
notify = "6"
msg_parser = "0.3.0"

# ?????? L0????????? + ?? + ???docs/??????-???????.md?
# rusqlite bundled ?? ?? SQLite + FTS5??/??????????? libsqlite?
# ? .deb ???????? file_ingest ?????? recommends ???????
rusqlite = { version = "0.31", features = ["bundled"] }
# ???????(??????)?? symlink ??L0 ?????
walkdir = "2"

# ?? embedding?L1 ??????fastembed-rs ??? ONNX ???CPU EP??**??? vLLM**?
# ??(bge-m3 ONNX)???????UserDefinedEmbeddingModel ???????? HF ?????
fastembed = "4"

# ???????file_ingest ???? Rust ? xlsx/xls/ods ?**?????**?
# ???? LibreOffice CSV ??????????? sheet ???? 90% ???????
# ?? 4 sheet ????? 418 ???calamine ??? reader ?????? sheet ????
calamine = "0.26"

# ?????(Phase 2):???? X11 ??????+????,????????+?????
# ?? src/detach.rs begin_detach_drag;spike example ????Wayland ???? ? ??(Task 8)?
device_query = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos"), not(target_env = "musl")))'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
webkit2gtk = "2.0"
