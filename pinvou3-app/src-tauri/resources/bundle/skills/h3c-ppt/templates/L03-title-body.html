<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>L03 · 标题 + 正文 Title-Body · 母板</title>
  <link rel="stylesheet" href="../assets/base.css" />
  <style>
    .page-title {
      position: absolute;
      top: 96px; left: 96px; right: 96px;
    }
    .page-title-eyebrow {
      font-size: var(--fs-body);
      letter-spacing: 0.22em;
      color: var(--gx-red);
      font-weight: var(--fw-bold);
      margin-bottom: 18px;
      display: flex; align-items: center; gap: 16px;
    }
    .page-title-eyebrow::after {
      content: "";
      flex: 1;
      max-width: 220px;
      height: 1px;
      background: linear-gradient(90deg, var(--gx-red), transparent);
    }
    .page-title h1 {
      font-size: var(--fs-h1);
      font-weight: var(--fw-bold);
      line-height: 1.2;
      letter-spacing: -0.005em;
      color: var(--t-1);
      margin-bottom: 14px;
    }
    .page-title h1 .gold { color: var(--gold-bright); }
    .page-title-sub {
      font-size: var(--fs-body);
      color: var(--t-2);
      line-height: 1.55;
      max-width: 1500px;
      font-weight: var(--fw-light);
    }
    .page-title-sub .em { color: var(--gold); font-weight: 500; }

    .body-region {
      position: absolute;
      top: 320px;
      left: 96px;
      right: 96px;
      bottom: 110px;
      display: flex;
      flex-direction: column;
      gap: var(--gap-lg);
    }
    .body-paragraph {
      font-size: var(--fs-body);
      color: var(--t-2);
      line-height: 1.7;
      max-width: 1500px;
    }
    .body-paragraph .em { color: var(--gold-bright); font-weight: 500; }
    .body-paragraph .red { color: var(--gx-red); font-weight: 600; }

    .punchline {
      margin-top: auto;
      padding: 24px 32px;
      background: rgba(0, 174, 239, 0.08);
      border-left: 4px solid var(--gold);
      font-size: var(--fs-h2);
      color: var(--gold-bright);
      font-weight: var(--fw-medium);
      line-height: 1.4;
      max-width: 1600px;
    }

    .page-footer {
      font-size: var(--fs-note);
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="page-header-bar"></div>
    <div class="page-eyebrow"><span class="ch">CH.03</span>章节名 · 本页主题</div>
    <div class="page-pagenum"><span class="cur">07</span> / 113</div>

    <div class="page-title">
      <div class="page-title-eyebrow">EYEBROW · 英文章节锚</div>
      <h1>页面 <span class="gold">主标题</span> · action title 是结论不是话题</h1>
      <p class="page-title-sub">
        副标 · <span class="em">关键修饰词</span>放高亮 · 受众一眼能 grok 这页讲什么
      </p>
    </div>

    <div class="body-region">
      <p class="body-paragraph">
        正文段落 1 · 把 takeaway 用一段话说清楚。<span class="em">数字 / 关键修饰</span>用金高亮,<span class="red">风险 / 强调</span>用 H3C 蓝高亮。
      </p>
      <p class="body-paragraph">
        正文段落 2(可选)· 进一步论证或举例。每段 <span class="em">≤ 28 字 / 行</span>,长则换行。
      </p>

      <!-- 金句 / punchline(可选)-->
      <div class="punchline">
        ★ 一句金句压住全页 · 客户翻完只记住这一句也够
      </div>
    </div>

    <div class="page-footer">
      <span>出品方 · 致 客户名称 · 合作交流材料 V1</span>
      <span>页脚右侧注解(可省)</span>
    </div>
  </div>
</body>
</html>
