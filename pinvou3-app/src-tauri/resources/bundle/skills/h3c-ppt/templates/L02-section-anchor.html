<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>L02 · 章节扉页 Section Anchor · 母板</title>
  <link rel="stylesheet" href="../assets/base.css" />
  <style>
    .sec-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 144px;
      gap: 56px;
    }
    .sec-num {
      font-family: "Inter", sans-serif;
      font-size: 220px;
      line-height: 0.9;
      font-weight: 200;
      letter-spacing: -0.04em;
      color: rgba(0, 174, 239, 0.18);
    }
    .sec-eyebrow {
      font-size: var(--fs-h2);
      letter-spacing: 0.18em;
      color: var(--gold);
      font-weight: 600;
    }
    .sec-main {
      font-size: var(--fs-section);
      line-height: var(--lh-tight);
      font-weight: var(--fw-bold);
      color: var(--t-1);
      letter-spacing: -0.01em;
    }
    .sec-main .em {
      color: var(--gold-bright);
    }
    .sec-rule {
      width: 320px;
      height: 1px;
      background: linear-gradient(90deg, var(--gx-red), var(--gold), transparent);
    }
    .sec-sub {
      font-size: var(--fs-h2);
      font-weight: var(--fw-light);
      color: var(--t-2);
      max-width: 1200px;
      line-height: 1.4;
    }
    /* 引文式 cite(可选)— 用 sec-cite class 满足 base.css serif scope */
    .sec-cite {
      margin-top: 32px;
      padding-left: 24px;
      border-left: 3px solid var(--gold-deep);
      font-size: var(--fs-body);
      color: var(--t-3);
      line-height: 1.6;
    }
    .sec-cite .src {
      display: block;
      margin-top: 12px;
      font-size: var(--fs-note);
      color: var(--gold);
      font-family: "Inter", sans-serif;
      letter-spacing: 0.05em;
    }
    .sec-footer {
      position: absolute;
      bottom: 48px;
      left: 144px;
      right: 240px;
      display: flex;
      justify-content: space-between;
      font-size: var(--fs-note);
      color: var(--t-4);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <!-- 用 class="slide sec" 启用 H3C 章节扉页背景 -->
  <div class="slide sec">

    <div class="sec-stage">
      <!-- 大章节号(装饰)-->
      <div class="sec-num">02</div>

      <!-- 章节眉头 -->
      <div class="sec-eyebrow">CHAPTER · 02</div>

      <!-- 章节主标 -->
      <h1 class="sec-main">章节<span class="em">主题</span> · 一句话定调</h1>

      <!-- 装饰金线 -->
      <div class="sec-rule"></div>

      <!-- 副标(可省) -->
      <p class="sec-sub">
        副标题 · 描述这一章要回答的核心问题
      </p>

      <!-- 可选:引文 -->
      <div class="sec-cite">
        "支撑本章的关键引文 · 政策原文 / 名人金句"
        <span class="src">来源 · 出处 2026</span>
      </div>
    </div>

    <div class="sec-footer">
      <span>出品方 · 致 客户名称</span>
      <span>02 / 113</span>
    </div>
  </div>
</body>
</html>
