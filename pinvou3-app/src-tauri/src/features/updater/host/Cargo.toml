[package]
name = "pinvou-upgrade-host"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
build = "build.rs"

[dependencies]
pinvou-upgrade-codec = { path = "../protocol/codec" }
pinvou-upgrade-custody = { path = "../platform/custody" }
pinvou-upgrade-native-evidence = { path = "../native-evidence" }
pinvou-upgrade-metadata-owner = { path = "../metadata-owner" }
pinvou-upgrade-ownership = { path = "../ownership" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_WinTrust", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_StationsAndDesktops", "Win32_System_Environment", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Wdk_System_Threading", "Win32_System_Kernel", "Win32_System_Services", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "pinvou-upgrade-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "pinvou-upgrade-launcher"
path = "src/bin/launcher.rs"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "=0.62.2"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"]

[build-dependencies]
find-msvc-tools = "=0.1.11"
serde_json = "=1.0.151"

[features]
default = []
native-acceptance-hooks = []
