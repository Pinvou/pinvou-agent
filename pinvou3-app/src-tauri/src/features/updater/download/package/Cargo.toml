[package]
name = "pinvou-upgrade-package-check"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"

[dependencies]
pinvou-upgrade-codec = { path = "../../protocol/codec" }
pinvou-upgrade-archive = { path = "../archive" }
pinvou-upgrade-cache-object = { path = "../cache" }
pinvou-upgrade-transfer = { path = "../transfer" }
