[package]
name = "pinvou-upgrade-codec"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"

[dependencies]
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde_jcs = "=0.2.0"

[dev-dependencies]
base64 = "0.22"
sha2 = "0.11"
# Exercise the same unified JSON behavior as the actual App/CLI graphs.
serde_json = { version = "=1.0.151", features = ["preserve_order", "raw_value"] }
indexmap = "=2.14.0"

[lints.rust]
unsafe_code = "forbid"
