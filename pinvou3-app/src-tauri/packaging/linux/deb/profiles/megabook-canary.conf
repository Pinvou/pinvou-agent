# MegaBook 32 GiB canary only. The audited deployment workflow activates this as
# pinvou3-app.service.d/50-megabook-canary.conf on MegaBook; it is not a global default.
[Service]
MemoryAccounting=yes
MemoryHigh=4G
MemoryMax=8G
MemorySwapMax=2G
OOMPolicy=kill
KillMode=control-group
TasksMax=512
Environment=PINVOU_RESOURCE_PROFILE=megabook-canary-v1
