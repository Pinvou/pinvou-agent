                      className="flex gap-6 overflow-x-auto snap-x snap-mandatory pb-6 no-scrollbar relative"
                      style={{ scrollbarWidth: 'none' }}
                    >
                      {tsFeaturedCollections.map((collection) => {
                        const featTool = tools.find(a => a.id === collection.featuredToolId);
                        return (
                          <div
                            key={collection.id}
                            onClick={() => setSelectedTool(featTool)}
                            className="relative min-w-[320px] md:min-w-[400px] h-[440px] rounded-[32px] snap-center shrink-0 overflow-hidden cursor-pointer group shadow-sm hover:shadow-xl dark:shadow-none border border-slate-200/50 dark:border-white/10 transition-all duration-500"
                          >
                            <div className={`absolute inset-0 ${collection.bg} transition-transform duration-700 group-hover:scale-105`} />
                            <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60" />

                            <div className="absolute top-0 left-0 w-full p-8 text-white z-10">
                              <span className="text-xs font-bold text-white/70 uppercase tracking-widest mb-1.5 block">{collection.label}</span>
                              <h3 className="text-[28px] font-bold tracking-tight leading-tight mb-3 text-white drop-shadow-sm">{collection.title}</h3>
                              <p className="text-white/80 text-[15px] font-medium leading-relaxed max-w-[90%] drop-shadow-sm">{collection.subtitle}</p>
                            </div>

                            {featTool && (
                              <div className="absolute bottom-6 left-6 right-6 z-10">
                                <div className="bg-white/20 dark:bg-black/40 backdrop-blur-3xl border border-white/20 dark:border-white/10 rounded-2xl p-4 flex items-center gap-4 transition-transform group-hover:-translate-y-1">
                                  <div className={`w-14 h-14 rounded-[14px] flex items-center justify-center flex-shrink-0 ${featTool.color} text-white shadow-inner`}>
                                    <featTool.icon size={26} strokeWidth={1.5} />
                                  </div>
                                  <div className="flex-1 min-w-0">
                                    <h4 className="text-base font-bold text-white truncate drop-shadow-sm">{featTool.title}</h4>
                                    <p className="text-xs text-white/70 truncate flex items-center gap-1.5">
                                      <Cpu size={12} /> {featTool.type}
                                    </p>
                                  </div>
                                  <TsActionBtn tool={featTool} busy={busyId === featTool.backendId} onAction={handleAction} />
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </section>
                )}

                {/* Category filter + tool list */}
                <section>
                  <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6 border-b border-slate-200 dark:border-white/10 pb-5">
                    <h2 className="text-2xl font-bold tracking-tight">
                      {searchQuery ? '检索结果' : '热门协议与接口'}
                    </h2>
                    <div className="flex p-1 bg-slate-100 dark:bg-[#1C1C1E] rounded-xl overflow-x-auto no-scrollbar border border-slate-200/50 dark:border-white/5">
                      {tsCategories.map((cat) => {
                        const isActive = activeCategory === cat.id;
                        return (
                          <button
                            key={cat.id}
                            onClick={() => setActiveCategory(cat.id)}
                            className={`px-5 py-1.5 rounded-lg text-[14px] font-semibold whitespace-nowrap transition-all duration-300 ${
                              isActive
                                ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm ring-1 ring-black/5 dark:ring-white/10'
                                : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
                            }`}
                          >
                            {cat.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {filteredTools.length > 0 ? (
                    <div className="grid gap-x-10 gap-y-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))' }}>
                      {filteredTools.map((tool) => (
                        <div
                          key={tool.id}
                          onClick={() => setSelectedTool(tool)}
                          className="group flex items-center gap-4 py-3 cursor-pointer hover:bg-slate-50 dark:hover:bg-[#1C1C1E]/50 rounded-2xl px-3 -mx-3 transition-colors border-b border-slate-100 dark:border-white/5 last:border-0"
                        >
                          <div className={`w-16 h-16 rounded-[16px] flex items-center justify-center flex-shrink-0 ${tool.color} text-white shadow-sm group-hover:shadow transition-shadow border border-black/5 dark:border-white/5`}>
                            <tool.icon size={30} strokeWidth={1.5} />
                          </div>
                          <div className="flex-1 min-w-0 flex flex-col justify-center py-1">
                            <h3 className="text-[17px] font-semibold text-slate-900 dark:text-white truncate tracking-tight">{tool.title}</h3>
                            <p className="text-[13px] text-slate-500 dark:text-slate-400 truncate mt-0.5 font-medium">{tool.subtitle}</p>
                            <div className="flex items-center gap-2 mt-1.5">
                              <span className="text-[10px] font-semibold text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded uppercase tracking-wide">{tool.type}</span>
                              {tool.authRequired && (
                                <span className="text-[10px] text-amber-500/80 dark:text-amber-400/80 flex items-center gap-0.5">
                                  <Zap size={10} /> 需密钥
                                </span>
                              )}
                            </div>
                          </div>
                          <div className="flex flex-col items-center justify-center gap-1 pl-2">
                            <TsActionBtn tool={tool} busy={busyId === tool.backendId} onAction={handleAction} />
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="py-24 text-center flex flex-col items-center">
                      <div className="w-16 h-16 mb-4 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400">
                        <Server size={28} />
                      </div>
                      <h3 className="text-xl font-semibold text-slate-800 dark:text-slate-200 mb-2">未检索到工具</h3>
                      <p className="text-slate-500 dark:text-slate-400">请尝试修改搜索词或查阅 API 开发文档。</p>
                    </div>
                  )}
                </section>

              </div>
            </main>
          </div>

          {/* Detail modal */}
          {selectedTool && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/40 dark:bg-black/60 backdrop-blur-md transition-all duration-300"
              onClick={() => setSelectedTool(null)}
            >
              <div
                className="ts-modal-in relative w-full max-w-2xl bg-white dark:bg-[#1C1C1E] rounded-[32px] shadow-2xl overflow-hidden flex flex-col max-h-[90vh] border border-slate-200/50 dark:border-white/10"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="absolute top-0 right-0 w-full px-6 py-5 flex items-center justify-end z-20 pointer-events-none">
                  <button
                    onClick={() => setSelectedTool(null)}
                    className="pointer-events-auto w-8 h-8 flex items-center justify-center rounded-full bg-slate-100/80 dark:bg-black/50 backdrop-blur text-slate-500 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-black transition-colors"
                  >
                    <XIcon size={18} />
                  </button>
                </div>

                <div className="overflow-y-auto p-6 sm:p-10 no-scrollbar pt-12">
                  <div className="flex flex-col sm:flex-row items-start gap-6 sm:gap-8 mb-8">
                    <div className={`w-28 h-28 sm:w-32 sm:h-32 rounded-[28px] sm:rounded-[32px] flex items-center justify-center flex-shrink-0 ${selectedTool.color} shadow-md border border-black/5 dark:border-white/5`}>
                      <selectedTool.icon size={56} strokeWidth={1.5} className="text-white" />
                    </div>
                    <div className="flex-1">
                      <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mb-2 tracking-tight">{selectedTool.title}</h2>
                      <p className="text-[17px] text-slate-500 dark:text-slate-400 mb-5 font-medium">{selectedTool.subtitle}</p>
                      <div className="flex items-center gap-4">
                        <TsActionBtn tool={selectedTool} busy={busyId === selectedTool.backendId} onAction={handleAction} size="lg" />
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between py-5 mb-8 border-y border-slate-100 dark:border-white/5 overflow-x-auto no-scrollbar gap-8">
                    <div className="flex flex-col flex-shrink-0">
                      <span className="text-[11px] text-slate-500 font-semibold uppercase tracking-wider mb-1">接口类型</span>
                      <span className="text-xl font-bold text-slate-800 dark:text-slate-200">{selectedTool.type}</span>
                      <span className="text-[12px] text-slate-400 mt-1 flex items-center gap-1"><Server size={12}/> 官方支持</span>
                    </div>
                    <div className="w-px h-12 bg-slate-200 dark:bg-slate-800 flex-shrink-0" />
                    <div className="flex flex-col flex-shrink-0">
                      <span className="text-[11px] text-slate-500 font-semibold uppercase tracking-wider mb-1">当前版本</span>
                      <span className="text-xl font-bold text-slate-800 dark:text-slate-200">{selectedTool.version}</span>
                      <span className="text-[12px] text-slate-400 mt-1">稳定版发布</span>
                    </div>
                    <div className="w-px h-12 bg-slate-200 dark:bg-slate-800 flex-shrink-0" />
                    <div className="flex flex-col flex-shrink-0 pr-4">
                      <span className="text-[11px] text-slate-500 font-semibold uppercase tracking-wider mb-1">平均延迟</span>
                      <span className="text-xl font-bold text-slate-800 dark:text-slate-200">{selectedTool.latency}</span>
                      <span className="text-[12px] text-slate-400 mt-1 flex items-center gap-1"><Globe size={12}/> 全球加速</span>
                    </div>
                  </div>

                  <div>
                    <h3 className="text-[19px] font-bold text-slate-900 dark:text-white mb-4">关于此能力</h3>
                    <div className="text-slate-600 dark:text-slate-300 leading-relaxed text-[15px] space-y-4 font-medium">
                      <p>{selectedTool.desc}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // Shared Components
    // ==========================================

    const ToolOutput = ({ item, isDark, t }) => {
      const out = item.output;
      if (item.success === false) return <OutputError text={out} isDark={isDark} />;
      if (isWeatherTool(item.name)) {
        let raw = out;
        const envelope = tryParseJson(out);
        if (envelope && Array.isArray(envelope.content)) {
          const t = envelope.content.find(c => c.type === 'text');
          if (t && t.text) raw = t.text;
        }
        const w = tryParseJson(raw);
        if (w && w.type === 'weather' && !w.error) return <WeatherCard data={w} />;
      }
      // 股票报价卡片：iwencai 返回表格数据 → 映射为卡片
      if (isStockQuoteTool(item.name)) {
        let raw = out;
        const envelope = tryParseJson(out);
        if (envelope && Array.isArray(envelope.content)) {
          const t = envelope.content.find(c => c.type === 'text');
          if (t && t.text) raw = t.text;
        }
        const w = tryParseJson(raw);
        if (w && Array.isArray(w.datas) && w.datas.length > 0) {
          const d = w.datas[0];
          const findVal = (obj, keyword) => {
            for (const k of Object.keys(obj)) {
              if (k.includes(keyword)) return parseFloat(obj[k]);
            }
            return undefined;
          };
          const mapped = {
            name: d['股票简称'] || '--',
            code: (d['股票代码'] || '').replace(/\.\w+$/, ''),
            price: parseFloat(d['最新价']),
            changePercent: findVal(d, '涨跌幅'),
            open: findVal(d, '开盘价'),
            high: findVal(d, '最高价'),
            low: findVal(d, '最低价'),
          };
          return <StockQuoteCard data={mapped} isDark={isDark} />;
        }
        if (w && w.type === 'stock_quote' && !w.error) return <StockQuoteCard data={w} isDark={isDark} />;
      }
      if (isReceipt(out)) return <ReceiptBlock text={out} isDark={isDark} t={t} />;
      if (item.name === 'list_dir') { const v = tryParseJson(out); if (Array.isArray(v)) return <ListDirView items={v} isDark={isDark} t={t} />; }
      else if (item.name === 'grep_files') { const v = tryParseJson(out); if (v && Array.isArray(v.matches)) return <GrepView data={v} isDark={isDark} t={t} />; }
      else if (item.name === 'exec_shell') {
        const v = tryParseJson(out);
        if (v && (v.stdout != null || v.exit_code != null || v.status)) return <ShellView data={v} isDark={isDark} t={t} />;
        return <ShellTextView cmd={item.args && item.args.command} text={out} isDark={isDark} />;
      }
      else if (item.name === 'edit_file' || item.name === 'write_file') { if (looksDiff(out)) return <DiffView text={out} isDark={isDark} />; }
      else if (item.name === 'append_file') {
        const m = String(out).match(/appended (\d+) bytes[\s\S]*?\((\d+) -> (\d+) bytes\)/i);
        if (m) return <div className={outBox(isDark)}>{t.appendBytes(/^Created/i.test(out), m[1], m[2], m[3])}</div>;
      }
      else if (TODO_TOOLS.indexOf(item.name) >= 0) { const v = tryTailJson(out); if (v && Array.isArray(v.items)) return <TodoView snap={v} isDark={isDark} t={t} />; }
      return <OutputPre text={out} isDark={isDark} />;
    };

    const ToolCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      // 有可视化卡片的工具(天气/股票)完成后直接展开,不折叠
      const hasCard = (isWeatherTool(item.name) || isStockQuoteTool(item.name)) && item.state === 'done';
      const [expanded, setExpanded] = useState(hasCard);
      useEffect(() => { if (hasCard) setExpanded(true); }, [hasCard]);
      const isRunning = item.state === 'running';
      const isDone = item.state === 'done';
      const isFailed = item.state === 'failed';
      const quiet = QUIET_TOOLS.has(item.name);
      const summary = toolSummary(item.name, item.args, t);

      const statusColor = isRunning
        ? (isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]')
        : isDone
          ? (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')
          : (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]');

      const statusText = isRunning ? t.toolRunning : isDone ? t.toolDone : t.toolFailed;
      const mutedColor = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';

      const detail = expanded ? (
        <div className={`px-4 pb-3 border-t ${isDark ? 'border-white/5' : 'border-black/5'}`}>
          {item.output != null
            ? <div className="mt-2"><ToolOutput item={item} isDark={isDark} t={t} /></div>
            : null}
        </div>
      ) : null;

      // 弱化类：单行灰条。完成态低调（图标灰），运行/失败态保留状态色以便察觉。
      if (quiet) {
        const iconColor = isDone ? mutedColor : statusColor;
        return (
          <div className={expanded ? `rounded-[12px] overflow-hidden border ${isDark ? 'border-white/5' : 'border-black/5'}` : ''}>
            <div
              className={`flex items-center gap-2 px-2 py-1 rounded-[8px] cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
              onClick={() => setExpanded(!expanded)}
            >
              <Wrench size={12} className={iconColor} />
              <span className={`text-[12px] ${mutedColor}`}>{item.name}</span>
              {summary
                ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
                : <span className="flex-1" />}
              {isRunning && <span className={`text-[11px] ${statusColor}`}>{t.toolRunning}</span>}
              {isFailed && <span className={`text-[11px] ${statusColor}`}>{t.toolFailed}</span>}
              <ChevronDown size={12} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${mutedColor}`} />
            </div>
            {detail}
          </div>
        );
      }

      // 有产出类：保留醒目卡片，标题行带摘要。
      return (
        <div className={`rounded-[16px] overflow-hidden border ${isDark ? 'bg-[#1E1F20] border-white/5' : 'bg-[#F0F4F9] border-black/5'}`}>
          <div
            className={`flex items-center gap-3 px-4 py-3 cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
            onClick={() => setExpanded(!expanded)}
          >
            <Wrench size={14} className={statusColor} />
            <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
              {item.name}
            </span>
            {summary
              ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
              : <span className="flex-1" />}
            <span className={`text-[12px] ${statusColor}`}>{statusText}</span>
            <ChevronDown size={14} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`} />
          </div>
          {detail}
        </div>
      );
    };

    // ==========================================
    // Plan / 待办 步骤渲染
    // ==========================================
    const STEP_SYM = { completed: '●', in_progress: '◎', pending: '○' };
    const PlanLayer = ({ label, explanation, items, field, isDark }) => {
      if (!items || items.length === 0) return null;
      return (
        <section className="mb-2">
          <div className={`text-[12px] font-semibold mb-1 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{label}</div>
          {explanation && <p className={`text-[13px] mb-1.5 leading-relaxed ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{explanation}</p>}
          <ol className="space-y-1">
            {items.map((it, i) => (
              <li key={i} className={`text-[13px] flex gap-2 leading-relaxed ${it.status === 'completed' ? 'opacity-60' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                <span className={it.status === 'in_progress' ? (isDark ? 'text-[#FDD663]' : 'text-[#E37400]') : ''}>{STEP_SYM[it.status] || '○'}</span>
                <span>{it[field] || ''}</span>
              </li>
            ))}
          </ol>
        </section>
      );
    };

    const cardBoxCls = (isDark, accent) =>
      `rounded-[16px] border p-4 my-1 ${isDark ? 'bg-[#1E1F20] border-white/10' : 'bg-[#F0F4F9] border-black/5'} ${accent || ''}`;
    const cardBtnCls = (isDark, variant) => {
      const base = 'px-3 py-1.5 rounded-full text-[13px] font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
      if (variant === 'primary') return `${base} ${isDark ? 'bg-[#A8C7FA] text-[#062E6F] hover:bg-[#C2DBFF]' : 'bg-[#0B57D0] text-white hover:bg-[#0A4BB8]'}`;
      return `${base} ${isDark ? 'bg-[#333537] text-[#E3E3E3] hover:bg-[#444746]' : 'bg-white text-[#1F1F1F] hover:bg-[#E1E5EA] border border-black/10'}`;
    };

    // ==========================================
    // PinvouSummonCard — 🧭 召唤式检阅（Boss 主动呼叫 Pinvou）
    // 自报家门人格(单主+alternates,§3.3) + trace + issues(severity 分色)。
    // ==========================================
    // 逐条裁决行(§2 + kind 分流):每条按本质给对应动作,不再一刀切判断题——
    //   recommendation(决策点/缺信息,Boss 才能定)→ 采纳建议 / 让 AI 问我;
    //   issue.needs_verify(外部事实,AI 无知识)→ 让 AI 核实 / 我确认没问题;
    //   issue 其他(产物缺陷,AI 改得动)→ 让 AI 改 / 接受现状(high 默认勾)。
    // 「交给 AI 处理」按各条动作组装定向指令走 B1。单独子组件:useState 放这避 hooks 错位。
    const PinvouRows = ({ review, theme }) => {
      const isDark = theme === 'dark';
      const body = isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]';
      const muted = isDark ? 'text-[#C4C7C5]' : 'text-[#5f6368]';
      const sevDot = (s) => s === 'high' ? '#EA4335' : s === 'medium' ? '#E37400' : '#9AA0A6';
      const rows = [
        ...(review.recommendations || []).map((x, i) => ({
          k: 'r' + i, raw: x, kind: 'rec', dot: '#7C3AED',
          head: (x.topic ? x.topic + '：' : '') + '建议 ' + x.pick, sub: x.why,
        })),
        ...(review.issues || []).map((x, i) => ({
          k: 'i' + i, raw: x, kind: x.kind === 'needs_verify' ? 'verify' : 'fix',
          dot: sevDot(x.severity), sev: x.severity, nv: x.kind === 'needs_verify',
          head: x.text, sub: x.suggestion,
        })),
        ...(review.coverage || []).map((x, i) => ({
          k: 'c' + i, raw: x, kind: 'gap', dot: x.severity === 'high' ? '#1A73E8' : '#669DF6',
          sev: x.severity, head: x.dimension + (x.text ? '：' + x.text : ''), sub: x.suggestion,
        })),
      ];
      // 每类二选一 [值,文案]:第一个=「要 AI 做」(高亮),第二个=Boss 自己消化(灰)。
      const ACT = {
        rec: [['adopt', '采纳建议'], ['ask', '让 AI 问我']],
        verify: [['verify', '让 AI 核实'], ['confirmed', '我确认没问题']],
        fix: [['modify', '让 AI 改'], ['accept', '接受现状']],
        gap: [['fill', '补上'], ['skip', '暂不补']],
      };
      const ACTIVE = { adopt: 1, ask: 1, verify: 1, modify: 1, fill: 1 }; // 需转交给 AI 的动作
      const [res, setRes] = useState(() => {
        const m = {};
        rows.forEach(it => {
          let def = null;
          if (it.sev === 'high') def = it.kind === 'fix' ? 'modify' : it.kind === 'gap' ? 'fill' : null;
          m[it.k] = it.raw.resolution || def;
        });
        return m;
      });
      const setOne = (k, v) => setRes(p => ({ ...p, [k]: p[k] === v ? null : v }));
      const activeCount = rows.filter(it => ACTIVE[res[it.k]]).length;
      const chip = (on, active) => `text-[11.5px] px-2 py-0.5 rounded-full border transition-colors ${on
        ? (active ? (isDark ? 'bg-[#D0BCFF] text-[#381E72] border-transparent' : 'bg-[#7C3AED] text-white border-transparent')
                  : (isDark ? 'bg-white/15 text-[#E3E3E3] border-transparent' : 'bg-black/10 text-[#1F1F1F] border-transparent'))
        : (isDark ? 'border-white/15 text-[#9AA0A6] hover:bg-white/5' : 'border-black/15 text-[#757575] hover:bg-black/5')}`;
      const onResolve = () => {
        if (!bridge.available) return;
        // 弹窗里 review 是 notify 深拷贝,写它的 resolution 落不到原 state;把裁决按下标传给 bridge,
        // 由 bridge 在 state.pinvouModal.review(原 state)上写、再落盘(根治 resolution 不持久化)。
        const resolutions = {
          recs: (review.recommendations || []).map((_, i) => res['r' + i] || 'pending'),
          issues: (review.issues || []).map((_, i) => res['i' + i] || 'pending'),
          coverage: (review.coverage || []).map((_, i) => res['c' + i] || 'pending'),
        };
        const actions = [];
        rows.forEach(it => {
          const a = res[it.k];
          if (a === 'modify') actions.push({ t: 'fix', text: it.head + (it.sub ? '（' + it.sub + '）' : '') });
          else if (a === 'verify') actions.push({ t: 'verify', text: it.head + (it.sub ? '（' + it.sub + '）' : '') });
          else if (a === 'adopt') actions.push({ t: 'adopt', topic: it.raw.topic || '', pick: it.raw.pick || '' });
          else if (a === 'ask') actions.push({ t: 'ask', topic: it.raw.topic || it.head });
          else if (a === 'fill') actions.push({ t: 'fill', dimension: it.raw.dimension || '', suggestion: it.raw.suggestion || '' });
        });
        bridge.resolvePinvouReview(resolutions, actions);
      };
      return (
        <div>
          <div className="space-y-2">
            {rows.map(it => {
              const decided = res[it.k];
              const passive = decided === 'accept' || decided === 'confirmed' || decided === 'skip';
              return (
                <div key={it.k} className={`rounded-lg px-2.5 py-2 transition-opacity ${passive ? 'opacity-45' : ''} ${isDark ? 'bg-white/[0.04]' : 'bg-black/[0.03]'}`}>
                  <div className="flex gap-2">
                    <span className="mt-[6px] w-[7px] h-[7px] rounded-full shrink-0" style={{ background: it.dot }} />
                    <div className="flex-1 min-w-0">
                      <div className={`text-[13px] leading-relaxed ${body}`}>
                        {it.nv && <span className={`text-[10.5px] mr-1 px-1 py-px rounded ${isDark ? 'bg-[#FDD663]/20 text-[#FDD663]' : 'bg-[#FEF7E0] text-[#B06000]'}`}>需核实</span>}
                        {it.head}
                      </div>
                      {it.sub && <div className={`text-[12px] mt-0.5 ${muted}`}>{it.sub}</div>}
                      <div className="flex gap-1.5 mt-1.5">
                        {ACT[it.kind].map(([v, label]) => (
                          <button key={v} onClick={() => setOne(it.k, v)} className={chip(decided === v, !!ACTIVE[v])}>{label}</button>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="flex items-center gap-2 mt-3">
            {activeCount > 0 && (
              <button onClick={onResolve}
                className={`px-3 py-1.5 rounded-full text-[12.5px] font-medium transition-colors ${isDark ? 'bg-[#D0BCFF] text-[#381E72] hover:bg-[#E9DDFF]' : 'bg-[#7C3AED] text-white hover:bg-[#6D28D9]'}`}>
                交给 AI 处理（{activeCount} 条）
              </button>
            )}
            <button onClick={() => bridge.available && bridge.dismissPinvouReview()} title="这次不处理,整张卡跳过"
              className={`px-3 py-1.5 rounded-full text-[12.5px] transition-colors ${isDark ? 'text-[#9AA0A6] hover:bg-white/5' : 'text-[#5f6368] hover:bg-black/5'}`}>
              跳过
            </button>
          </div>
        </div>
      );
    };

    // 检阅 loading:本地模型 5-30s,给 spinner+计时+安抚文字,别让 Boss 干等焦虑(以为卡死)。
    const PinvouLoading = ({ isWu, icon, tint, accent, muted, isDark }) => {
      const [frame, setFrame] = useState(0);
      const [secs, setSecs] = useState(0);
      useEffect(() => {
        const a = setInterval(() => setFrame(f => (f + 1) % BRAILLE.length), 90);
        const b = setInterval(() => setSecs(s => s + 1), 1000);
        return () => { clearInterval(a); clearInterval(b); };
      }, []);
      return (
        <div className={cardBoxCls(isDark, accent)}>
          <div className={`flex items-center gap-2 text-[12px] font-semibold ${tint}`}><span>{icon}</span><span>{isWu ? 'Pinvou 悟·发散补全' : 'Pinvou 品·查错检阅'}</span></div>
          <div className={`flex items-center gap-2 text-[13px] mt-2 ${muted}`}>
            <span className={`${tint} font-mono`}>{BRAILLE[frame]}</span>
            <span>{isWu ? '正在比对完整性维度、发散补点' : '正在逐条核对、揪问题'}</span>
            {secs > 0 && <span className="opacity-50 tabular-nums">{secs}s</span>}
          </div>
          <div className={`text-[12px] mt-1.5 ${muted}`} style={{ opacity: 0.7 }}>本地模型推理中，通常 5–30 秒，稍候～</div>
        </div>
      );
    };

    const PinvouSummonCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      // 品(查错)=紫;悟(发散,coverage)=蓝。
      const isWu = !!item.coverage;
      const icon = isWu ? '✨' : '📋';
      const role = isWu ? '悟' : '品';
      const accent = isWu ? (isDark ? 'border-[#8AB4F8]/30' : 'border-[#1A73E8]/25')
                          : (isDark ? 'border-[#D0BCFF]/30' : 'border-[#7C3AED]/25');
      const tint = isWu ? (isDark ? 'text-[#8AB4F8]' : 'text-[#1967D2]')
                        : (isDark ? 'text-[#D0BCFF]' : 'text-[#7C3AED]');
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const body = isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]';
      if (item.loading) return <PinvouLoading isWu={isWu} icon={icon} tint={tint} accent={accent} muted={muted} isDark={isDark} />;
      if (item.error) return (
        <div className={cardBoxCls(isDark, accent)}>
          <div className={`flex items-center gap-2 text-[12px] font-semibold ${tint}`}><span>{icon}</span><span>Pinvou {isWu ? '悟' : '品'}</span></div>
          <div className={`text-[13px] mt-2 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>失败：{item.error}</div>
        </div>
      );
      const r = item.review || {};
      if (r.dismissed) return (
        <div className={cardBoxCls(isDark, accent) + ' opacity-50'}>
          <div className={`flex items-center gap-2 text-[12px] ${muted}`}><span>{icon}</span><span>{'Pinvou · ' + role + ' · 已跳过'}</span></div>
        </div>
      );
      const personas = r.personas || [];
      const primary = personas.find(p => p && p.primary) || personas[0] || {};
      const alts = r.alternates || [];
      const hasRows = (r.recommendations || []).length > 0 || (r.issues || []).length > 0 || (r.coverage || []).length > 0;
      return (
        <div className={cardBoxCls(isDark, accent)}>
          <div className="flex items-center flex-wrap gap-x-2 gap-y-1 mb-2">
            <span className="text-[15px]">{icon}</span>
            <span className={`text-[13px] font-semibold ${tint}`}>{'Pinvou · ' + role + (primary.label ? ' (' + primary.label + '视角)' : '')}</span>
            {alts.length > 0 && <span className={`text-[12px] ${muted}`}>· 也涉及 {alts.join(' / ')}</span>}
            {r.verdict === 'pass' && <span className={`text-[11px] font-semibold px-1.5 py-0.5 rounded ${isDark ? 'bg-[#37BE5F]/20 text-[#81C995]' : 'bg-[#E6F4EA] text-[#137333]'}`}>✓ 通过，可交付</span>}
          </div>
          {r.trace && <div className={`text-[13.5px] leading-relaxed mb-2.5 ${body}`}>{r.trace}</div>}
          {(r.framework || []).length > 0 && (
            <div className={`text-[11.5px] mb-2 px-2 py-1.5 rounded-lg leading-relaxed ${isDark ? 'bg-[#1A73E8]/10 text-[#8AB4F8]' : 'bg-[#1A73E8]/5 text-[#1967D2]'}`}>
              <span className="opacity-70">完整性框架·{(r.framework || []).length}维：</span>{(r.framework || []).join(' · ')}
            </div>
          )}
          {hasRows && <PinvouRows review={r} theme={theme} />}
        </div>
      );
    };

    // ==========================================
    // PlanCard — ✨ 方案准备好
    // ==========================================
    const PlanCard = ({ item, theme, t, onPrefill }) => {
      const isDark = theme === 'dark';
      const active = item.cardState === 'active' && !item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className={`text-[14px] font-semibold mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.planReady}</div>
          {(!item.plan && !item.todos)
            ? <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.planEmpty}</div>
            : <>
                <PlanLayer label={t.planLabel} explanation={item.plan && item.plan.explanation} items={item.plan && item.plan.items} field="step" isDark={isDark} />
                <PlanLayer label={t.planTodos} items={item.todos && item.todos.items} field="content" isDark={isDark} />
              </>}
          <div className={`h-px my-3 ${isDark ? 'bg-white/10' : 'bg-black/10'}`}></div>
          {active ? (
            <div className="flex items-center gap-2 flex-wrap">
              <span className={`text-[13px] mr-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.planNext}</span>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.acceptPlan(item.id, item.planMarkdown)}>{t.planGo}</button>
              <button className={cardBtnCls(isDark)} onClick={() => onPrefill && onPrefill(t.planRevisePrefill)}>{t.planEdit}</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.discardPlan(item.id)}>{t.planDrop}</button>
            </div>
          ) : (
            <div className={`text-[13px] font-medium ${isDark ? 'text-[#93D5A6]' : 'text-[#137333]'}`}>{item.statusLabel}</div>
          )}
        </div>
      );
    };

    // ==========================================
    // PlanStuckCard — Plan 死锁 / 执行卡住 兜底
    // ==========================================
    const PlanStuckCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const isExec = item.type === 'execution_stuck';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#FDD663]/30' : 'border-[#E37400]/20')}>
          <div className={`text-[13px] leading-relaxed mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
            {isExec
              ? <>{t.stuckExec(item.tries)}</>
              : <>{t.stuckPlanPre} <code className="px-1 rounded bg-black/20">{item.toolName || '(unknown)'}</code> {t.stuckPlanPost}</>}
          </div>
          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || t.handled}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark)} onClick={() => isExec ? bridge.executionStuckReplan(item.id) : bridge.planStuckReplan(item.id)}>{t.stuckReplan}</button>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => isExec ? bridge.discardPlan(item.id) : bridge.planStuckGo(item.id)}>⚡ {isExec ? t.stuckSelf : t.stuckGo}</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // PlanFallbackCard — AI 给了方案但没用 plan 工具
    // ==========================================
    const PlanFallbackCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#FDD663]/30' : 'border-[#E37400]/20')}>
          <div className={`text-[14px] font-semibold mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.fbTitle}</div>
          <div className={`text-[13px] leading-relaxed mb-3 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.fbDesc}</div>
          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || t.handled}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.planFallbackAccept(item.id, item.text)}>{t.fbAccept}</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.planFallbackRetry(item.id)}>{t.fbRetry}</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.discardPlan(item.id)}>{t.planDrop}</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // CarefulBlockedCard — 🛑 危险操作被拦（人话化：底座英文技术原因→中文人话，技术详情折叠）
    // ==========================================
    const REASON_MAP = [
      [/root filesystem|delete all root|delete root/i, 'rsRoot'],
      [/home director/i, 'rsHome'],
      [/recursiv|rm\s+-rf/i, 'rsRecursive'],
      [/forced? deletion|\bforce\b/i, 'rsForce'],
      [/fork bomb/i, 'rsForkbomb'],
      [/overwrite|\bof=|\bdd\b/i, 'rsOverwrite'],
      [/format|mkfs/i, 'rsFormat'],
    ];
    const humanizeReason = (en, t) => {
      const s = String(en);
      for (let i = 0; i < REASON_MAP.length; i++) if (REASON_MAP[i][0].test(s)) return t[REASON_MAP[i][1]];
      return t.rsDefault;
    };
    const CarefulBlockedCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const [showTech, setShowTech] = useState(false);
      const md = item.metadata || {};
      const cmd = (item.args && (item.args.command || item.args.cmd)) || t.cbCmdUnknown;
      const rawReasons = (md.reasons && md.reasons.length) ? md.reasons : [];
      const rawSuggestions = md.suggestions || [];
      const humanReasons = [...new Set(rawReasons.map(r => humanizeReason(r, t)))];
      if (humanReasons.length === 0) humanReasons.push(t.rsDefault);
      const hasTech = rawReasons.length > 0 || rawSuggestions.length > 0;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#F28B82]/40' : 'border-[#C5221F]/30')}>
          <div className={`text-[14px] font-semibold mb-2 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>{t.cbTitle}</div>
          <div className={`text-[12px] mb-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.cbWant}</div>
          <pre className={`text-[12px] font-mono rounded-lg p-2 mb-2 overflow-x-auto ${isDark ? 'bg-[#131314] text-[#F28B82]' : 'bg-white text-[#C5221F]'}`}>{cmd}</pre>
          <div className="mb-2">
            <div className={`text-[12px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.cbWhy}</div>
            <ul className={`list-disc pl-5 text-[13px] space-y-0.5 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{humanReasons.map((r, i) => <li key={i}>{r}</li>)}</ul>
          </div>
          <div className={`text-[12px] leading-relaxed mb-1.5 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.cbNote}</div>
          {hasTech && (
            <div>
              <button onClick={() => setShowTech(!showTech)} className={`text-[11px] ${isDark ? 'text-[#8AB4F8]' : 'text-[#0B57D0]'}`}>{showTech ? t.cbTechHide : t.cbTechShow}</button>
              {showTech && (
                <div className={`mt-1 text-[11px] font-mono space-y-0.5 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>
                  {rawReasons.map((r, i) => <div key={'r' + i}>· {r}</div>)}
                  {rawSuggestions.map((s, i) => <div key={'s' + i}>→ {s}</div>)}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // UserInputCard — 🤔 AI 想问你几个问题
    // ==========================================
    const UserInputCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const questions = item.questions || [];
      const [answers, setAnswers] = useState(() => item.restoredAnswers || questions.map(() => null));
      const [otherOpen, setOtherOpen] = useState(() => questions.map(() => false));
      const [otherText, setOtherText] = useState(() => questions.map(() => ''));
      const locked = item.resolved || item.submitting;

      function pick(qi, opt) {
        if (locked) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: opt.label, value: opt.label };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function toggleOther(qi) {
        if (locked) return;
        const oo = otherOpen.slice(); oo[qi] = !oo[qi]; setOtherOpen(oo);
        if (oo[qi]) { const next = answers.slice(); next[qi] = null; setAnswers(next); }
      }
      function submitOther(qi) {
        const val = (otherText[qi] || '').trim();
        if (!val) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: '其他', value: val };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function commit(next) {
        setAnswers(next);
        if (next.every(a => a != null)) {
          bridge.submitUserInput(item.id, item.toolCallId, next, questions);
        }
      }

      const statusText = item.cardState === 'submitted' ? t.uiSubmitted
        : item.cardState === 'cancelled' ? t.uiCancelled
        : item.submitting ? t.uiSubmitting : item.error ? t.uiSubmitFailed(item.error) : '';

      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className="flex items-center justify-between mb-3">
            <div className={`text-[14px] font-semibold ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.uiqTitle}</div>
          </div>
          <div className="space-y-4">
            {questions.map((q, qi) => (
              <div key={qi}>
                <div className={`text-[12px] font-semibold ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{q.header || ('Q' + (qi + 1))}</div>
                <div className={`text-[13px] mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{q.question || ''}</div>
                <div className="flex flex-col gap-1.5">
                  {(q.options || []).map((opt, oi) => {
                    const sel = answers[qi] && answers[qi].label === opt.label && answers[qi].value === opt.label;
                    return (
                      <button key={oi} disabled={locked}
                        onClick={() => pick(qi, opt)}
                        className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                          ${sel ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                                : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                        <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{opt.label}</div>
                        {opt.description && <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{opt.description}</div>}
                      </button>
                    );
                  })}
                  <button disabled={locked} onClick={() => toggleOther(qi)}
                    className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                      ${answers[qi] && answers[qi].label === '其他' ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                        : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                    {/* label '其他' 是协议值(bridge 按它拼 "(其他) "+value),只翻显示不改存储 */}
                    <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.uiOtherTitle}</div>
                    <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.uiOtherDesc}</div>
                  </button>
                  {otherOpen[qi] && (
                    <div className="mt-1">
                      <textarea rows="2" value={otherText[qi]}
                        onChange={e => { const ot = otherText.slice(); ot[qi] = e.target.value; setOtherText(ot); }}
                        onKeyDown={e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitOther(qi); } }}
                        placeholder={t.uiOtherPh}
                        className={`w-full rounded-[10px] p-2 text-[13px] outline-none border ${isDark ? 'bg-[#131314] border-white/10 text-[#E3E3E3]' : 'bg-white border-black/10 text-[#1F1F1F]'}`} />
                      <div className="flex gap-2 mt-1 justify-end">
                        <button className={cardBtnCls(isDark)} onClick={() => toggleOther(qi)}>{t.cpCancel}</button>
                        <button className={cardBtnCls(isDark, 'primary')} onClick={() => submitOther(qi)}>{t.uiSubmit}</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
          {statusText && <div className={`mt-3 text-[13px] ${item.error ? (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]') : (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')}`}>{statusText}</div>}
        </div>
      );
    };

    // ==========================================
    // ModeHeader — Plan/YOLO 模式指示 + 灯泡切换
    // ==========================================
    const PHASE_LABEL = { planning: '讨论方案', ready: '方案就绪', executing: '执行中' };
    const ModeHeader = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const ms = (bs && bs.modeState) || { mode: 'yolo', plan_phase: 'none' };
      const isPlan = ms.mode === 'plan';
      const phaseLabel = PHASE_LABEL[ms.plan_phase] || '';
      async function toggleMode() {
        if (!bridge.available) return;
        if (ms.mode === 'plan') {
          // 已在 Plan(任何 phase)→ 退出回 YOLO(busy 先停当前 turn)
          if (bs && bs.busy) await bridge.cancelGeneration();
          await bridge.exitPlanToYolo();
        } else {
          await bridge.setPlanModeNext(); // YOLO → 进入 Plan
        }
      }
      return (
        <button
          onClick={toggleMode}
          title={isPlan ? '点击退出 Plan 回 YOLO' : '点击进入 Plan 模式'}
          className={`pointer-events-auto px-3 py-2 rounded-full text-[13px] font-medium flex items-center gap-2 transition-colors
            ${isPlan
              ? (isDark ? 'bg-[#0B57D0]/30 text-[#A8C7FA]' : 'bg-[#0B57D0]/10 text-[#0B57D0]')
              : (isDark ? 'bg-[#1E1F20] text-[#C4C7C5] hover:bg-[#333537]' : 'bg-white text-[#444746] hover:bg-[#F0F4F9] shadow-sm')}`}
        >
          <Zap size={15} /> {isPlan ? ('Plan' + (phaseLabel ? ' · ' + phaseLabel : '')) : 'YOLO'}
        </button>
      );
    };

    // ==========================================
    // ArtifactsPanel — 产物面板（右侧抽屉 + 预览）
    // ==========================================
    const ARTIFACT_ICONS = {
      md: '📄', markdown: '📄', html: '🌐', htm: '🌐',
      png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
      pdf: '📕', csv: '📊', xlsx: '📊', json: '🔢', yaml: '🔢', yml: '🔢', txt: '📝',
    };
    const artifactIcon = (name) => ARTIFACT_ICONS[(name.split('.').pop() || '').toLowerCase()] || '📎';
    const apPad2 = (x) => String(x).padStart(2, '0');
    const apFormatBytes = (n) => {
      if (n == null) return '';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    };
    const apFormatMtime = (sec) => {
      if (!sec) return '';
      const d = new Date(sec * 1000);
      return d.getFullYear() + '-' + apPad2(d.getMonth() + 1) + '-' + apPad2(d.getDate()) +
        ' ' + apPad2(d.getHours()) + ':' + apPad2(d.getMinutes());
    };
    // kind(后端分类) → 人话类型名;不在表里则回退扩展名大写。
    const apKindLabel = (t, kind, name) => {
      const m = t.apKinds && t.apKinds[kind];
      if (m) return m;
      const ext = ((name || '').split('.').pop() || '').toUpperCase();
      return ext || (kind || 'FILE');
    };
    // 注入到 office→HTML 预览 iframe 末尾:LibreOffice 导出的表格 border=0、字号 x-small,
    // 这里补网格线/字号/单元格换行,让 xlsx 读起来像表格。放在文档后 → 同特异性下后定义胜出。
    const OFFICE_HTML_STYLE = '<style>'
      + 'body{margin:14px;background:#fff;color:#1f1f1f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}'
      + 'table{border-collapse:collapse;width:auto;max-width:100%;}'
      + 'td,th{border:1px solid #d4d7dc;padding:5px 9px;font-size:13px!important;vertical-align:top;max-width:460px;overflow-wrap:anywhere;}'
      + 'tr:first-child td{background:#eef2f8;font-weight:600;}'
      + 'img{max-width:100%;height:auto;}'
      + '</style>';

    const ArtifactsPanel = ({ bs, theme, t, onClose }) => {
      const isDark = theme === 'dark';
      const artifacts = (bs && bs.artifacts) || [];
      const [tab, setTab] = useState('list');     // 'list' | 'preview'
      const [sel, setSel] = useState(null);        // 选中的 artifact { path, basename }
      const [pv, setPv] = useState({});            // 预览态
      const [infos, setInfos] = useState({});      // path → { size, kind, modified }(列表行元信息)

      // 进面板 / artifacts 变化 → 批量拉元信息(给列表行的「最后修改」+ 类型)
      const pathsKey = artifacts.map((a) => a.path).join('|');
      useEffect(() => {
        let cancelled = false;
        (async () => {
          const entries = await Promise.all(artifacts.map(async (a) => {
            try { return [a.path, await bridge.artifactInfo(a.path)]; }
            catch (_) { return [a.path, null]; }
          }));
          if (cancelled) return;
          const m = {};
          entries.forEach(([p, i]) => { if (i) m[p] = i; });
          setInfos(m);
        })();
        return () => { cancelled = true; };
      }, [pathsKey]);

      // 切 session(artifacts 整批换了)→ 选中文件已不在新列表 → 清预览、退回列表。
      // 路径含 session id,故「不在列表」可靠区分换 session vs 同 session 内新增文件。
      useEffect(() => {
        if (sel && !artifacts.some((a) => a.path === sel.path)) {
          setSel(null); setPv({}); setTab('list');
        }
      }, [pathsKey]);

      async function preview(a) {
        setSel(a);
        setTab('preview');
        setPv({ loading: true });
        try {
          const info = await bridge.artifactInfo(a.path);
          if (!info || !info.exists) { setPv({ missing: true, info }); return; }
          if (info.kind === 'md' || info.kind === 'html' || info.kind === 'text') {
            const text = await bridge.readArtifactText(a.path);
            setPv({ kind: info.kind, text, info });
          } else {
            // image / pdf / docx / xlsx / legacy_office / binary → 后端可视化转换
            const visual = await bridge.renderArtifactVisual(a.path);
            setPv({ kind: info.kind, visual, info });
          }
        } catch (e) { setPv({ error: String(e) }); }
      }

      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const tabBtn = (key, label) => {
        const active = tab === key;
        const disabled = key === 'preview' && !sel;
        return (
          <button key={key} disabled={disabled}
            onClick={() => !disabled && setTab(key)}
            className={`px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors
              ${active ? (isDark ? 'bg-[#333537] text-[#E3E3E3]' : 'bg-[#E8EDF2] text-[#1F1F1F]')
                : disabled ? (isDark ? 'text-[#5F6368]' : 'text-[#BDC1C6]') + ' cursor-not-allowed'
                : (isDark ? 'text-[#C4C7C5] hover:bg-[#282A2C]' : 'text-[#444746] hover:bg-[#F0F4F9]')}`}>
            {label}
          </button>
        );
      };

      // ── 预览内容区(按 kind / visual.mode 渲染)──
      const renderContent = () => {
        if (pv.loading) return <div className={`text-[13px] ${muted}`}>{t.apConverting}</div>;
        if (pv.missing) return <div className={`text-[13px] ${muted}`}>{t.apMissing}</div>;
        if (pv.error) return <div className={`text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>{t.apReadFail(pv.error)}</div>;
        if (pv.kind === 'md') {
          return <div className={`msg-md text-[14px] leading-relaxed ${isDark ? 'dark-code text-[#E3E3E3]' : 'light-code text-[#1F1F1F]'}`} dangerouslySetInnerHTML={{ __html: bridge.renderMarkdown(pv.text || '') }} />;
        }
        if (pv.kind === 'html') {
          // 方角 + 不裁剪:WebKitGTK 对「会内部滚动的 iframe」做任何 border-radius 裁剪
          // (含外层 overflow-hidden)都会在边缘留黑色梳齿残影。去掉圆角是唯一彻底解。
          return <iframe sandbox="allow-same-origin allow-scripts" className="w-full h-full min-h-[480px] border-0 block bg-white"
            srcDoc={"<script>document.addEventListener('contextmenu',function(e){e.preventDefault();})<\/script>" + (pv.text || '')} />;
        }
        if (pv.kind === 'text') {
          return <pre className={`text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.text}</pre>;
        }
        // 可视化结果
        const vis = pv.visual;
        if (vis && vis.mode === 'html') {
          return (
            <div className="flex flex-col gap-2 h-full">
              {vis.warning && <div className={`text-[12px] ${isDark ? 'text-[#FDD663]' : 'text-[#E37400]'}`}>⚠️ {vis.warning}</div>}
              <iframe sandbox="allow-same-origin" className="w-full flex-1 min-h-[480px] border-0 block bg-white"
                srcDoc={(vis.html || '') + OFFICE_HTML_STYLE} />
            </div>
          );
        }
        if (vis && vis.mode === 'images') {
          return (
            <div className="flex flex-col items-center gap-3">
              {vis.warning && <div className={`self-start text-[12px] ${isDark ? 'text-[#FDD663]' : 'text-[#E37400]'}`}>⚠️ {vis.warning}</div>}
              {(vis.images || []).map((src, i) => (
                <img key={i} src={src} className="max-w-full h-auto rounded-lg shadow-sm" alt={`page-${i + 1}`} />
              ))}
            </div>
          );
        }
        // 统一兜底卡(unsupported / 转换失败 / binary)
        return (
          <div className={`flex flex-col items-center justify-center text-center gap-3 py-10 ${muted}`}>
            <span className="text-[44px]">{sel ? artifactIcon(sel.basename) : '📎'}</span>
            <span className={`text-[14px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{sel && sel.basename}</span>
            <p className="text-[13px] max-w-[360px]">{(vis && vis.warning) || t.apUnsupported}</p>
            <button onClick={() => sel && bridge.openArtifactExternal(sel.path)} className={cardBtnCls(isDark, 'primary')}>
              {t.apBtnOpen}
            </button>
          </div>
        );
      };

      return (
        <div className="absolute inset-0 z-30 flex justify-end pointer-events-auto">
          <div className="absolute inset-0 bg-black/40" onClick={onClose}></div>
          <div className={`relative w-[680px] max-w-[88vw] h-full flex flex-col shadow-2xl ${isDark ? 'bg-[#1E1F20]' : 'bg-white'} animate-in slide-in-from-right duration-200`}>
            {/* header + tabs */}
            <div className={`flex items-center justify-between px-3 py-2.5 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <div className={`flex items-center gap-1 rounded-full p-0.5 ${isDark ? 'bg-[#141517]' : 'bg-[#F0F4F9]'}`}>
                {tabBtn('list', t.apTabList)}
                {tabBtn('preview', t.apTabPreview)}
              </div>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>

            {/* body */}
            <div className="flex-1 min-h-0 flex flex-col">
              {tab === 'list' ? (
                <div className="flex-1 overflow-y-auto custom-scrollbar p-2">
                  {artifacts.length === 0 ? (
                    <div className={`p-4 text-[13px] ${muted}`}>{t.apEmpty}</div>
                  ) : artifacts.map((a) => {
                    const info = infos[a.path];
                    return (
                      <div key={a.path} onClick={() => preview(a)}
                        className={`group flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer
                          ${sel && sel.path === a.path ? (isDark ? 'bg-[#333537]' : 'bg-[#E8EDF2]') : (isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#F0F4F9]')}`}>
                        <span className="text-[26px] leading-none shrink-0">{artifactIcon(a.basename)}</span>
                        <div className="flex-1 min-w-0">
                          <div className={`text-[14px] truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`} title={a.path}>{a.basename}</div>
                          <div className={`text-[12px] truncate ${muted}`}>
                            {t.apLastMod} {info ? apFormatMtime(info.modified) : '—'}
                          </div>
                        </div>
                        <button title={t.apBtnLocate} onClick={(e) => { e.stopPropagation(); bridge.openContainingFolder(a.path); }}
                          className={`opacity-0 group-hover:opacity-100 w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#1E1F20] text-[#C4C7C5]' : 'hover:bg-white text-[#444746]'}`}><FolderOpen size={16} /></button>
                      </div>
                    );
                  })}
                </div>
              ) : !sel ? (
                <div className={`flex-1 flex items-center justify-center text-[13px] ${muted}`}>{t.apPreviewHint}</div>
              ) : (
                <>
                  {/* preview content */}
                  <div className="flex-1 overflow-y-auto custom-scrollbar p-4 min-w-0">{renderContent()}</div>
                  {/* meta footer */}
                  <div className={`shrink-0 border-t px-4 py-3 ${isDark ? 'border-white/10 bg-[#1A1B1D]' : 'border-black/10 bg-[#F8FAFD]'}`}>
                    <div className={`text-[14px] font-medium truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{sel.basename}</div>
                    <div className={`mt-0.5 text-[12px] ${muted}`}>
                      {apKindLabel(t, pv.info && pv.info.kind, sel.basename)}
                      {pv.info && pv.info.size ? ' · ' + apFormatBytes(pv.info.size) : ''}
                    </div>
                    <div className={`mt-1.5 text-[12px] flex gap-2 ${muted}`}>
                      <span className="shrink-0">{t.apLocLabel}</span>
                      <span className="break-all">{sel.path}</span>
                    </div>
                    {pv.info && pv.info.modified ? (
                      <div className={`mt-0.5 text-[12px] flex gap-2 ${muted}`}>
                        <span className="shrink-0">{t.apMtimeLabel}</span>
                        <span>{apFormatMtime(pv.info.modified)}</span>
                      </div>
                    ) : null}
                    <div className="mt-3 flex items-center gap-2">
                      <button onClick={() => bridge.openArtifactExternal(sel.path)}
                        className={`flex-1 flex items-center justify-center gap-1.5 ${cardBtnCls(isDark, 'primary')}`}>
                        <ExternalLink size={15} /> {t.apBtnOpen}
                      </button>
                      <button onClick={() => bridge.openContainingFolder(sel.path)}
                        className={`flex-1 flex items-center justify-center gap-1.5 ${cardBtnCls(isDark)}`}>
                        <FolderOpen size={15} /> {t.apBtnLocate}
                      </button>
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 卡片池 (Persona / AgentPool)
    // ==========================================
    // Side B: agency-agents-zh 按"部门"组织(无档位/评分), 派生稳定的部门配色。
    const DEPT_LABELS = { academic:'学术', design:'设计', engineering:'工程', finance:'金融', 'game-development':'游戏', hr:'人力', legal:'法务', marketing:'营销', 'paid-media':'投放', product:'产品', 'project-management':'项管', sales:'销售', 'spatial-computing':'空间计算', specialized:'专项', 'supply-chain':'供应链', support:'客服', testing:'测试', tool:'工具' };
    // 部门标签按当前 UI 语言取词(t.depts),DEPT_LABELS(中文)兜底
    function deptLabelFor(t, k) { return (t && t.depts && t.depts[k]) || DEPT_LABELS[k] || k; }
    // 内置卡名称/简介按 UI 语言显示(personas-i18n.js overlay,按 id 查),中文兜底;自制卡不翻
    function personaText(c, t) {
      const L = t && t.langTag;
      if (!c || !L || L === 'zh' || c.source === 'user') return c || {};
      const tr = (typeof PERSONA_I18N !== 'undefined' && PERSONA_I18N[c.id] && PERSONA_I18N[c.id][L]) || null;
      if (!tr) return c;
      return { ...c, name: tr.name || c.name, description: tr.description || c.description };
    }
    const DEPT_ORDER = ['engineering','marketing','specialized','design','product','finance','sales','testing','project-management','paid-media','support','academic','game-development','spatial-computing','supply-chain','hr','legal','tool'];
    const DEPT_COLOR = { academic:'#8B5CF6', design:'#EC4899', engineering:'#06B6D4', finance:'#10B981', 'game-development':'#F59E0B', hr:'#F472B6', legal:'#6B7280', marketing:'#F97316', 'paid-media':'#EF4444', product:'#7C3AED', 'project-management':'#3B82F6', sales:'#14B8A6', 'spatial-computing':'#6366F1', specialized:'#64748B', 'supply-chain':'#84CC16', support:'#22D3EE', testing:'#A855F7', tool:'#7C3AED' };
    // 可在编辑器下拉选的部门(排除 tool —— 那是内置工具卡专用)
    const DEPT_OPTIONS = DEPT_ORDER.filter(function(d){ return d !== 'tool'; });
    const deptColor = (d) => DEPT_COLOR[d] || '#9aa0a6';
    const CLAMP3 = { display:'-webkit-box', WebkitLineClamp:3, WebkitBoxOrient:'vertical', overflow:'hidden' };
    const CLAMP2 = { display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden' };

    // 聊天室左上角的专家面具挂件(工牌)。常驻:有对话就挂。
    //   未加持 → 占位卡"＋ 加持专家", 整卡点击打开专家池(入口)。
    //   已加持 → 显专家, 点卡片主体=换专家, 点 ✕=摘下。
    const Lanyard = ({ persona, isDark, onRemove, onOpenPicker, t }) => {
      // 未加持: 占位入口
      if (!persona) {
        return (
          <div className="absolute top-0 left-6 z-[15]" style={{ width:148 }}>
            <div className="lanyard-wrap flex flex-col items-center">
              <div style={{ width:2, height:60, background: isDark?'linear-gradient(#4a4d50,#303234)':'linear-gradient(#cfd2d6,#aeb2b6)' }}></div>
              <div className="w-2.5 h-2.5 rounded-full -mt-1 mb-1.5" style={{ background: isDark?'#15171a':'#e8eaed', border:'2px solid '+(isDark?'#3c4043':'#bdc1c6') }}></div>
              <div onClick={onOpenPicker} title={t.cpLanyardEquipTitle}
                className="lanyard-card rounded-xl px-3 py-3.5 border border-dashed w-[140px] flex flex-col items-center gap-1 cursor-pointer transition-colors hover:border-solid"
                style={{ background: isDark?'rgba(40,42,44,.5)':'rgba(255,255,255,.6)', borderColor: isDark?'#4a4d50':'#c4c7c5' }}>
                <div className="w-8 h-8 rounded-lg flex items-center justify-center text-[18px] leading-none" style={{ background: isDark?'rgba(124,58,237,.16)':'rgba(124,58,237,.10)', color:'#9580FF' }}>＋</div>
                <div className="text-[11.5px] font-medium" style={{ color: isDark?'#9aa0a6':'#5f6368' }}>{t.cpLanyardEquip}</div>
                <div className="text-[8.5px] font-mono tracking-[0.18em]" style={{ color: isDark?'#5f6368':'#9aa0a6' }}>AI PERSONA</div>
              </div>
            </div>
          </div>
        );
      }
      // 已加持
      const tc = deptColor(persona.dept);
      const cd = personaText(persona, t);
      return (
        <div className="absolute top-0 left-6 z-[15]" style={{ width:148 }}>
          <div className="lanyard-wrap flex flex-col items-center">
            {/* 挂绳 + 扣环(留出长度让卡片落到浮动 Artifacts 按钮下方) */}
            <div style={{ width:2, height:60, background:'linear-gradient(#ff5a3c,#b3361f)' }}></div>
            <div className="w-2.5 h-2.5 rounded-full -mt-1 mb-1.5" style={{ background: isDark?'#15171a':'#e8eaed', border:'2px solid '+(isDark?'#3c4043':'#bdc1c6') }}></div>
            <div onClick={onOpenPicker} title={t.cpLanyardSwap}
              className="lanyard-card relative rounded-xl p-3 border w-[140px] cursor-pointer"
              style={{ background: isDark?'#1e2022':'#fff', borderColor:'rgba(255,180,30,.85)', boxShadow:'0 10px 30px -8px rgba(0,0,0,.5), 0 0 14px -3px rgba(255,180,30,.5)' }}>
              <button onClick={(e)=>{ e.stopPropagation(); onRemove(); }} title={t.cpLanyardRemove} className="absolute -top-2 -right-2 w-5 h-5 rounded-full flex items-center justify-center text-[11px] leading-none"
                style={{ background: isDark?'#2c2e30':'#eef0f3', color: isDark?'#9aa0a6':'#5f6368', border:'1px solid '+(isDark?'#3c4043':'#dadce0') }}>✕</button>
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-lg flex items-center justify-center text-[18px] shrink-0" style={{ background: tc+'22' }}>{persona.emoji}</div>
                <div className="min-w-0">
                  <div className={`text-[12px] font-semibold leading-tight ${isDark?'text-[#E3E3E3]':'text-[#1F1F1F]'}`} style={CLAMP2}>{cd.name}</div>
                  <span className="text-[10px] font-mono font-bold" style={{ color:tc }}>{deptLabelFor(t, persona.dept)}</span>
                </div>
              </div>
              <p className="text-[10px] leading-snug mt-1.5" style={{ ...CLAMP2, color: isDark?'#80868b':'#5f6368' }}>{cd.description}</p>
              <div className="text-[8.5px] font-mono tracking-[0.18em] text-center mt-2 pt-1.5 border-t" style={{ color:'#ffae1e', borderColor: isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)' }}>AI PERSONA</div>
            </div>
          </div>
        </div>
      );
    };

    // 双击卡片打开的详情 modal —— FLIP 转场 + 拉取并展示完整人设正文(body)。
    const PersonaDetailModal = ({ card, originRect, equipped, onClose, onEquip, isDark, t }) => {
      const panelRef = useRef(null);
      const [body, setBody] = useState(null); // null=loading
      useEffect(() => {
        const panel = panelRef.current;
        if (panel && originRect) {
          const last = panel.getBoundingClientRect();
          const dx = originRect.left - last.left, dy = originRect.top - last.top;
          const sx = Math.max(0.05, originRect.width / last.width), sy = Math.max(0.05, originRect.height / last.height);
          panel.style.transformOrigin = 'top left';
          panel.style.transform = `translate(${dx}px,${dy}px) scale(${sx},${sy})`;
          panel.style.opacity = '0.5';
          panel.getBoundingClientRect();
          panel.style.transition = 'transform .34s cubic-bezier(.2,.85,.25,1), opacity .34s';
          panel.style.transform = 'none';
          panel.style.opacity = '1';
        }
        if (bridge.available && bridge.readPersonaBody) {
          bridge.readPersonaBody(card.id).then(b=>setBody(b||'')).catch(()=>setBody(t.cpBodyLoadFailed));
        } else { setBody(''); }
      }, []);
      const tc = deptColor(card.dept);
      const cd = personaText(card, t);
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{ background:'rgba(0,0,0,.55)' }} onClick={onClose}>
          <div ref={panelRef} onClick={(e)=>e.stopPropagation()}
            className="w-full max-w-[620px] max-h-[84vh] flex flex-col rounded-2xl border"
            style={{ background: isDark?'#1e2022':'#ffffff', borderColor: isDark?'rgba(255,255,255,.10)':'rgba(0,0,0,.08)', boxShadow:'0 24px 80px -20px rgba(0,0,0,.6)' }}>
            <div className="flex items-start gap-4 p-6 pb-3 shrink-0">
              <div className="w-16 h-16 rounded-xl flex items-center justify-center text-[34px] shrink-0" style={{ background: tc+'22' }}>{card.emoji}</div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2">
                  <h2 className={`text-[20px] font-semibold ${isDark?'text-[#E3E3E3]':'text-[#1F1F1F]'}`}>{cd.name}</h2>
                  <span className="text-[11px] font-semibold px-2 py-0.5 rounded" style={{ background: tc+'22', color: tc }}>{deptLabelFor(t, card.dept)}</span>
                </div>
                <div className="text-[12.5px] mt-1" style={{ color: isDark?'#C4C7C5':'#3c4043' }}>{cd.description}</div>
              </div>
              <button onClick={onClose} className={`shrink-0 p-1 rounded-md ${isDark?'text-[#9aa0a6] hover:bg-[#2c2e30]':'text-[#5f6368] hover:bg-[#eef0f3]'}`}><X size={18}/></button>
            </div>
            {/* 完整人设正文 */}
            <div className="flex-1 overflow-y-auto custom-scrollbar px-6 py-3 min-h-0 border-t" style={{ borderColor: isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)' }}>
              <div className="text-[11px] font-semibold mb-2 font-mono tracking-wide" style={{ color: isDark?'#80868b':'#9aa0a6' }}>{t.cpFullBody}</div>
              {body===null
                ? <div className="text-[13px] py-6 text-center" style={{ color: isDark?'#80868b':'#757575' }}>{t.cpBodyLoading}</div>
                : <div className={`persona-body text-[13px] leading-relaxed ${isDark?'text-[#C4C7C5]':'text-[#3c4043]'}`} dangerouslySetInnerHTML={{ __html: bridge.renderMarkdown ? bridge.renderMarkdown(body) : body }} />}
            </div>
            <div className="p-5 pt-3 shrink-0 border-t" style={{ borderColor: isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)' }}>
              <button onClick={()=>onEquip(card)}
                className="w-full py-2.5 rounded-xl text-[14px] font-semibold transition-colors"
                style={ equipped ? { background:'rgba(255,180,30,.18)', color:'#ffae1e' } : { background:'#7C3AED', color:'#fff' } }>
                {equipped ? t.cpEquippedTap : t.cpEquip}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // 自创卡编辑器:新建 / 编辑 / ③ 草稿预填都复用它。initial.source==='user' 且有 id → 编辑(update),否则新建(create)。
    const PersonaEditorModal = ({ initial, onClose, onSaved, onDeleted, isDark, t }) => {
      const init = initial || {};
      const isEdit = !!(init.id && init.source === 'user');
      const [confirmDel, setConfirmDel] = useState(false);
      const [name, setName] = useState(init.name || '');
      const [dept, setDept] = useState(init.dept && init.dept !== 'tool' ? init.dept : 'specialized');
      const [emoji, setEmoji] = useState(init.emoji || '🃏');
      const [description, setDescription] = useState(init.description || '');
      const [body, setBody] = useState(init.body || '');
      const [saving, setSaving] = useState(false);
      const [err, setErr] = useState('');
      // 编辑已有卡时, summary 不含 body, 拉一次完整正文
      useEffect(() => {
        if (isEdit && !init.body && bridge.available && bridge.readPersonaBody) {
          bridge.readPersonaBody(init.id).then(function (b) { setBody(b || ''); }).catch(function () {});
        }
      }, []);
      const tc = deptColor(dept);
      const inputCls = "w-full px-3 py-2 rounded-lg text-[13px] outline-none border";
      const inputStyle = { background: isDark ? '#131314' : '#fff', color: isDark ? '#E3E3E3' : '#1F1F1F', borderColor: isDark ? '#3c4043' : '#dadce0' };
      async function save() {
        if (!name.trim()) { setErr(t.cpErrName); return; }
        if (!body.trim()) { setErr(t.cpErrBody); return; }
        setSaving(true); setErr('');
        var input = { name: name.trim(), dept: dept, emoji: emoji || '🃏', color: init.color || deptColor(dept), description: description.trim(), body: body };
        try {
          var sum = isEdit ? await bridge.updatePersona(init.id, input) : await bridge.createPersona(input);
          if (onSaved) onSaved(sum);
          onClose();
        } catch (e) { setErr(t.cpErrSave(e)); setSaving(false); }
      }
      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-6" style={{ background:'rgba(0,0,0,.55)' }} onClick={onClose}>
          <div onClick={(e)=>e.stopPropagation()} className="w-full max-w-[640px] max-h-[88vh] flex flex-col rounded-2xl border"
            style={{ background: isDark?'#1e2022':'#fff', borderColor: isDark?'rgba(255,255,255,.10)':'rgba(0,0,0,.08)', boxShadow:'0 24px 80px -20px rgba(0,0,0,.6)' }}>
            <div className="flex items-center justify-between px-6 pt-5 pb-3 shrink-0">
              <h2 className={`text-[18px] font-semibold ${isDark?'text-[#E3E3E3]':'text-[#1F1F1F]'}`}>{isEdit ? t.cpEditCard : t.cpNewCard} <span className="text-[12px] font-normal" style={{color:'#9580FF'}}>{t.cpBadgeUser}</span></h2>
              <button onClick={onClose} className={`p-1 rounded-md ${isDark?'text-[#9aa0a6] hover:bg-[#2c2e30]':'text-[#5f6368] hover:bg-[#eef0f3]'}`}><X size={18}/></button>
            </div>
            <div className="flex-1 overflow-y-auto custom-scrollbar px-6 py-2 min-h-0 space-y-3">
              <div className="flex gap-3">
                <div className="w-16 shrink-0">
                  <label className="text-[11px] font-medium block mb-1" style={{color: isDark?'#9aa0a6':'#5f6368'}}>emoji</label>
                  <input value={emoji} onChange={e=>setEmoji(e.target.value)} maxLength={4} className={inputCls + " text-center text-[20px]"} style={inputStyle} />
                </div>
                <div className="flex-1">
                  <label className="text-[11px] font-medium block mb-1" style={{color: isDark?'#9aa0a6':'#5f6368'}}>{t.cpFieldName} *</label>
                  <input value={name} onChange={e=>setName(e.target.value)} placeholder={t.cpNamePh} className={inputCls} style={inputStyle} />
                </div>
                <div className="w-28 shrink-0">
                  <label className="text-[11px] font-medium block mb-1" style={{color: isDark?'#9aa0a6':'#5f6368'}}>{t.cpDept}</label>
                  <select value={dept} onChange={e=>setDept(e.target.value)} className={inputCls} style={inputStyle}>
                    {DEPT_OPTIONS.map(function(d){ return <option key={d} value={d}>{deptLabelFor(t, d)}</option>; })}
                  </select>
                </div>
              </div>
              <div>
                <label className="text-[11px] font-medium block mb-1" style={{color: isDark?'#9aa0a6':'#5f6368'}}>{t.cpFieldDesc}</label>
                <input value={description} onChange={e=>setDescription(e.target.value)} placeholder={t.cpFieldDescPh} className={inputCls} style={inputStyle} />
              </div>
              <div>
                <label className="text-[11px] font-medium block mb-1" style={{color: isDark?'#9aa0a6':'#5f6368'}}>{t.cpFieldBody} * <span style={{color: isDark?'#5f6368':'#9aa0a6'}}>{t.cpFieldBodyHint}</span></label>
                <textarea value={body} onChange={e=>setBody(e.target.value)} rows={12}
                  placeholder={t.cpBodyPh}
                  className={inputCls + " resize-y font-mono leading-relaxed"} style={{...inputStyle, minHeight:220}} />
              </div>
              {err ? <div className="text-[12px] text-[#F28B82]">{err}</div> : null}
            </div>
            <div className="flex items-center justify-between gap-2 px-6 py-4 shrink-0 border-t" style={{borderColor: isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)'}}>
              <div>
                {isEdit ? (
                  confirmDel
                    ? <span className="flex items-center gap-2 text-[12.5px]"><span className="text-[#F28B82]">{t.cpConfirmDelete}</span>
                        <button onClick={()=>{ bridge.deletePersona(init.id).then(()=>{ if(onDeleted) onDeleted(init); onClose(); }); }} className="px-2 py-1 rounded-md text-[12px] text-[#F28B82] border border-[#F28B82]/50">{t.cpDelete}</button>
                        <button onClick={()=>setConfirmDel(false)} className="px-2 py-1 rounded-md text-[12px]" style={{color: isDark?'#9aa0a6':'#5f6368'}}>{t.cpCancel}</button>
                      </span>
                    : <button onClick={()=>setConfirmDel(true)} className="px-3 py-2 rounded-lg text-[12.5px] text-[#F28B82]">{t.cpDeleteThis}</button>
                ) : null}
              </div>
              <div className="flex items-center gap-2">
                <button onClick={onClose} className="px-4 py-2 rounded-lg text-[13px] border" style={{color: isDark?'#C4C7C5':'#3c4043', borderColor: isDark?'#3c4043':'#dadce0'}}>{t.cpCancel}</button>
                <button onClick={save} disabled={saving} className="px-5 py-2 rounded-lg text-[13px] font-semibold text-white" style={{background: saving ? '#9aa0a6' : '#7C3AED'}}>{saving ? t.cpSaving : (isEdit ? t.cpSaveEdit : t.cpCreate)}</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const CardPoolView = ({ theme, t, bs, onEquipped }) => {
      const isDark = theme === 'dark';
      const pool = (bs && bs.personaPool) || { loadState: 'idle' };
      // 201 张卡走模块级缓存(不进 notify 快照),loadState 变化驱动重渲染。
      const list = (bridge.available && bridge.getPersonas) ? bridge.getPersonas() : [];
      const active = (bs && bs.activePersona) || null;
      // 加持目标 = 当前对话(equipPersona 注入到 state.activeSessionId)。让用户始终知道注入到哪。
      const target = (bs && bs.sessions && bs.activeSessionId) ? bs.sessions.find(s => s.id === bs.activeSessionId) : null;
      const targetTitle = target ? (target.title || t.newChat) : null;
      const [selDept, setSelDept] = useState([]);
      const [query, setQuery] = useState('');
      const [visible, setVisible] = useState(60);
      const [detail, setDetail] = useState(null);
      const [toast, setToast] = useState(null);
      const [editor, setEditor] = useState(null); // null | { initial }
      const [myOnly, setMyOnly] = useState(false); // 「我的卡牌」facet
      const [confirmDelId, setConfirmDelId] = useState(null); // 卡上删除二次确认

      useEffect(() => { if (bridge.available) bridge.loadPersonas(); }, []);
      useEffect(() => { setVisible(60); }, [query, selDept, myOnly]);
      useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 2400); return () => clearTimeout(id); }, [toast]);

      const counts = {}; list.forEach(c => { counts[c.dept] = (counts[c.dept]||0)+1; });
      const userCount = list.filter(c => c.source === 'user').length;
      const q = query.trim().toLowerCase();
      const filtered = list.filter(c => {
        if (myOnly && c.source !== 'user') return false;
        if (selDept.length && selDept.indexOf(c.dept) < 0) return false;
        if (q) {
          // 原文 + 本地化名/简介都进搜索域,中英日关键词均可命中
          const loc = personaText(c, t);
          const hay = (c.name+' '+c.description+' '+loc.name+' '+loc.description+' '+c.dept+' '+deptLabelFor(t, c.dept)).toLowerCase();
          if (hay.indexOf(q) < 0) return false;
        }
        return true;
      });
      const shown = filtered.slice(0, visible);

      function toggle(arr, setArr, v) { setArr(arr.indexOf(v)>=0 ? arr.filter(x=>x!==v) : arr.concat([v])); }
      function resetFacets() { setSelDept([]); setQuery(''); setMyOnly(false); }
      function editCard(card, e){ if(e) e.stopPropagation(); setEditor({ initial: card }); }
      function doDelete(card, e){ if(e) e.stopPropagation(); setConfirmDelId(null);
        Promise.resolve(bridge.deletePersona(card.id)).then(function(){ setToast(t.cpToastDeleted(card.name)); }).catch(function(){ setToast(t.cpToastDelFailed); }); }
      function onMove(e){ const el=e.currentTarget; const r=el.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
        el.style.transform=`perspective(900px) rotateX(${(0.5-py)*9}deg) rotateY(${(px-0.5)*11}deg) translateY(-3px)`;
        el.style.setProperty('--mx',(px*100)+'%'); el.style.setProperty('--my',(py*100)+'%'); }
      function onLeave(e){ e.currentTarget.style.transform=''; }
      function equip(card, e){ if(e) e.stopPropagation();
        if (active && active.id===card.id) { bridge.unequipPersona(); setToast(t.cpToastUnequipped(personaText(card, t).name)); }
