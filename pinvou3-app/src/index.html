                  );
                })()}
              </div>
            </div>
            {ctxTokens && ctxTokens.input > 0 && (
              <div className={`mt-1.5 px-5 text-[11px] font-mono ${
                ctxPct >= 0.9 ? (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]')
                : ctxPct >= 0.75 ? (isDark ? 'text-[#F9AB00]' : 'text-[#B06000]')
                : (isDark ? 'text-[#5F6368]' : 'text-[#9AA0A6]')}`}>
                {t.ctxUsage} {fmtCtxTok(ctxTokens.input)} / {fmtCtxTok(ctxTokens.max)} · {Math.round(ctxPct * 100)}%
              </div>
            )}
            <div className="flex items-center justify-center mt-3">
               <p className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.disclaimer}</p>
            </div>
            </div>
          </div>
          </div>{/* /对话列 */}

          {artifactsOpen && isWide && (
            <>
              <div onMouseDown={startArtifactDrag} onDoubleClick={resetArtifactW} role="separator" aria-orientation="vertical"
                className={`shrink-0 w-1.5 h-full cursor-col-resize transition-colors ${isDark ? 'bg-white/10 hover:bg-[#A8C7FA]/60' : 'bg-black/10 hover:bg-[#0B57D0]/50'}`} />
              <div ref={artColRef} className="shrink-0 h-full relative" style={{ width: artifactW + 'px' }}>
                <ArtifactsPanel bs={bs} theme={theme} t={t} onClose={() => setArtifactsOpen(false)} isWide={true} />
              </div>
            </>
          )}
          {artifactsOpen && !isWide && <ArtifactsPanel bs={bs} theme={theme} t={t} onClose={() => setArtifactsOpen(false)} isWide={false} />}
        </div>
      );
    };

    // ==========================================
    // Chat Bubble (message rendering)
    // ==========================================
    function fallbackCopyText(tx) {
      return new Promise(function (resolve) {
        var ta = null;
        try {
          ta = document.createElement('textarea');
          ta.value = String(tx || '');
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '-9999px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          resolve(!!document.execCommand('copy'));
        } catch (e) {
          resolve(false);
        } finally {
          if (ta && ta.parentNode) ta.parentNode.removeChild(ta);
        }
      });
    }

    function copyClipboardText(tx) {
      tx = String(tx || '');
      if (!tx) return Promise.resolve(false);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(tx).then(function () { return true; }).catch(function () {
          return fallbackCopyText(tx);
        });
      }
      return fallbackCopyText(tx);
    }

    function readClipboardText() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        return navigator.clipboard.readText().catch(function () { return ''; });
      }
      return Promise.resolve('');
    }

    const SelectionCopyButton = ({ hostRef, targetRef, theme, t }) => {
      const isDark = theme === 'dark';
      const [selCopy, setSelCopy] = useState({ visible: false, copied: false, text: '', x: 0, y: 0 });
      const hideTimerRef = useRef(null);

      const hideSelectionCopy = useCallback(() => {
        if (hideTimerRef.current) {
          clearTimeout(hideTimerRef.current);
          hideTimerRef.current = null;
        }
        setSelCopy(s => s.visible ? { ...s, visible: false, copied: false } : s);
      }, []);

      const openSelectionCopyMenu = useCallback((event) => {
        const target = targetRef.current;
        const host = hostRef.current;
        if (!target || !host || !window.getSelection) return false;
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0) { hideSelectionCopy(); return false; }
        const text = selection.toString();
        if (!text || !text.trim()) { hideSelectionCopy(); return false; }
        if (!selection.anchorNode || !selection.focusNode) { hideSelectionCopy(); return false; }
        if (!target.contains(selection.anchorNode) || !target.contains(selection.focusNode)) {
          hideSelectionCopy();
          return false;
        }
        const hostRect = host.getBoundingClientRect();
        if (!hostRect) { hideSelectionCopy(); return false; }
        const minX = 4;
        const maxX = Math.max(minX, hostRect.width - 100);
        const x = Math.max(minX, Math.min(event.clientX - hostRect.left, maxX));
        const y = Math.max(4, event.clientY - hostRect.top + 8);
        setSelCopy({ visible: true, copied: false, text: text, x: x, y: y });
        return true;
      }, [hideSelectionCopy, hostRef, targetRef]);

      useEffect(() => {
        return () => {
          if (hideTimerRef.current) clearTimeout(hideTimerRef.current);
        };
      }, []);

      useEffect(() => {
        const target = targetRef.current;
        if (!target) return;
        const onContextMenu = (e) => {
          if (openSelectionCopyMenu(e)) {
            e.preventDefault();
            e.stopPropagation();
          } else {
            hideSelectionCopy();
          }
        };
        target.addEventListener('contextmenu', onContextMenu);
        return () => {
          target.removeEventListener('contextmenu', onContextMenu);
        };
      }, [hideSelectionCopy, openSelectionCopyMenu, targetRef]);

      useEffect(() => {
        if (!selCopy.visible) return;
        const onDown = (e) => {
          if (e.target && e.target.closest && e.target.closest('[data-selection-copy-button]')) return;
          hideSelectionCopy();
        };
        const onKey = (e) => { if (e.key === 'Escape') hideSelectionCopy(); };
        document.addEventListener('mousedown', onDown, true);
        document.addEventListener('keydown', onKey, true);
        return () => {
          document.removeEventListener('mousedown', onDown, true);
          document.removeEventListener('keydown', onKey, true);
        };
      }, [hideSelectionCopy, selCopy.visible]);

      const onCopy = () => {
        copyClipboardText(selCopy.text).then(function (ok) {
          if (!ok) return;
          setSelCopy(s => ({ ...s, copied: true }));
          if (hideTimerRef.current) clearTimeout(hideTimerRef.current);
          hideTimerRef.current = setTimeout(function () {
            hideTimerRef.current = null;
            hideSelectionCopy();
          }, 900);
        });
      };

      if (!selCopy.visible) return null;
      return (
        <button
          type="button"
          data-selection-copy-button="true"
          title={selCopy.copied ? t.copied : t.copyMsg}
          onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); }}
          onClick={(e) => { e.preventDefault(); e.stopPropagation(); onCopy(); }}
          className={`absolute z-30 h-9 min-w-[92px] px-3 rounded-[10px] flex items-center justify-start gap-2 text-[13px] font-medium shadow-lg backdrop-blur transition-colors ${
            isDark ? 'bg-[#2B2C2F] text-[#E3E3E3] hover:bg-[#34363A] border border-white/10' : 'bg-white text-[#1F1F1F] hover:bg-[#F8FAFF] border border-black/10'
          }`}
          style={{ left: selCopy.x + 'px', top: selCopy.y + 'px' }}
        >
          {selCopy.copied ? <Check size={13} className="text-[#34C759]" /> : <Copy size={13} />}
          <span>{selCopy.copied ? t.copied : t.copyMsg}</span>
        </button>
      );
    };

    const TextareaContextMenu = ({ inputRef, setValue, theme, t }) => {
      const isDark = theme === 'dark';
      const [menu, setMenu] = useState({ visible: false, x: 0, y: 0, canCopy: false });

      const closeMenu = useCallback(() => {
        setMenu(m => m.visible ? { ...m, visible: false } : m);
      }, []);

      const selectedText = useCallback(() => {
        const el = inputRef.current;
        if (!el) return '';
        const start = typeof el.selectionStart === 'number' ? el.selectionStart : 0;
        const end = typeof el.selectionEnd === 'number' ? el.selectionEnd : start;
        return start === end ? '' : String(el.value || '').slice(start, end);
      }, [inputRef]);

      const replaceSelection = useCallback((text) => {
        const el = inputRef.current;
        if (!el || !text) return;
        const raw = String(el.value || '');
        const start = typeof el.selectionStart === 'number' ? el.selectionStart : raw.length;
        const end = typeof el.selectionEnd === 'number' ? el.selectionEnd : start;
        const next = raw.slice(0, start) + text + raw.slice(end);
        const cursor = start + text.length;
        setValue(next);
        requestAnimationFrame(function () {
          el.focus();
          try { el.setSelectionRange(cursor, cursor); } catch (e) {}
        });
      }, [inputRef, setValue]);

      useEffect(() => {
        const el = inputRef.current;
        if (!el) return;
        const openMenu = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const start = typeof el.selectionStart === 'number' ? el.selectionStart : 0;
          const end = typeof el.selectionEnd === 'number' ? el.selectionEnd : start;
          const menuW = 136;
          const menuH = 116;
          const x = Math.max(6, Math.min(e.clientX, window.innerWidth - menuW - 6));
          const y = Math.max(6, Math.min(e.clientY, window.innerHeight - menuH - 6));
          setMenu({ visible: true, x: x, y: y, canCopy: start !== end });
        };
        const onContextMenu = (e) => openMenu(e);
        const onMouseDown = (e) => { if (e.button === 2) openMenu(e); };
        el.addEventListener('contextmenu', onContextMenu, true);
        el.addEventListener('mousedown', onMouseDown, true);
        return () => {
          el.removeEventListener('contextmenu', onContextMenu, true);
          el.removeEventListener('mousedown', onMouseDown, true);
        };
      }, [inputRef]);

      useEffect(() => {
        if (!menu.visible) return;
        const onDown = (e) => {
          if (e.target && e.target.closest && e.target.closest('[data-textarea-context-menu]')) return;
          closeMenu();
        };
        const onKey = (e) => { if (e.key === 'Escape') closeMenu(); };
        const onScrollOrResize = () => closeMenu();
        document.addEventListener('mousedown', onDown, true);
        document.addEventListener('keydown', onKey, true);
        window.addEventListener('resize', onScrollOrResize);
        window.addEventListener('scroll', onScrollOrResize, true);
        return () => {
          document.removeEventListener('mousedown', onDown, true);
          document.removeEventListener('keydown', onKey, true);
          window.removeEventListener('resize', onScrollOrResize);
          window.removeEventListener('scroll', onScrollOrResize, true);
        };
      }, [closeMenu, menu.visible]);

      const menuItemCls = (disabled) => `w-full h-9 px-3 flex items-center gap-2 text-left text-[13px] transition-colors ${
        disabled
          ? (isDark ? 'text-white/30 cursor-not-allowed' : 'text-black/30 cursor-not-allowed')
          : (isDark ? 'text-[#E3E3E3] hover:bg-white/10' : 'text-[#1F1F1F] hover:bg-black/[0.06]')
      }`;

      const selectAll = () => {
        const el = inputRef.current;
        if (!el) return;
        el.focus();
        el.select();
        closeMenu();
      };

      const copySelected = () => {
        const tx = selectedText();
        if (!tx) return;
        copyClipboardText(tx).then(function () { closeMenu(); });
      };

      const pasteText = () => {
        readClipboardText().then(function (tx) {
          replaceSelection(tx);
          closeMenu();
        });
      };

      if (!menu.visible) return null;
      return ReactDOM.createPortal((
        <div
          data-textarea-context-menu="true"
          className={`w-[136px] overflow-hidden rounded-[12px] py-1 shadow-xl backdrop-blur border ${
            isDark ? 'bg-[#2B2C2F] border-white/10' : 'bg-white border-black/10'
          }`}
          style={{ position: 'fixed', zIndex: 9999, left: menu.x + 'px', top: menu.y + 'px' }}
          onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); }}
        >
          <button type="button" className={menuItemCls(false)} onClick={selectAll}>
            <span className="w-4 text-center text-[12px]">A</span><span>{t.selectAllMsg || 'Select all'}</span>
          </button>
          <button type="button" disabled={!menu.canCopy} className={menuItemCls(!menu.canCopy)} onClick={copySelected}>
            <Copy size={14} /><span>{t.copyMsg}</span>
          </button>
          <button type="button" className={menuItemCls(false)} onClick={pasteText}>
            <ClipboardList size={14} /><span>{t.pasteMsg || 'Paste'}</span>
          </button>
        </div>
      ), document.body);
    };

    const UserBubble = ({ item, theme, editable, t }) => {
      const isDark = theme === 'dark';
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(item.text);
      const [copied, setCopied] = useState(false);
      function commit() { const tx = val.trim(); setEditing(false); if (tx && bridge.available) bridge.editLastTurn(tx); }
      function copyText() {
        const tx = item.text || '';
        copyClipboardText(tx).then(function (ok) {
          if (!ok) return;
          setCopied(true);
          setTimeout(function () { setCopied(false); }, 1200);
        });
      }
      if (editing) {
        return (
          <div className="flex justify-end">
            <div className="max-w-[85%] w-full">
              <textarea autoFocus value={val} onChange={e => setVal(e.target.value)}
                rows={Math.min(6, Math.max(1, val.split('\n').length))}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); } else if (e.key === 'Escape') { setEditing(false); setVal(item.text); } }}
                className={`w-full rounded-[16px] px-4 py-2 text-[15px] outline-none ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`} />
              <div className="flex gap-2 justify-end mt-1">
                <button className={cardBtnCls(isDark)} onClick={() => { setEditing(false); setVal(item.text); }}>{t.cpCancel}</button>
                <button className={cardBtnCls(isDark, 'primary')} onClick={commit}>{t.resend}</button>
              </div>
            </div>
          </div>
        );
      }
      if (item.pinvouTransfer) {
        const isWu = item.pinvouTransfer === '悟';
        const tint = isWu ? (isDark ? '#8AB4F8' : '#1967D2') : (isDark ? '#D0BCFF' : '#7C3AED');
        const tintBg = isWu ? (isDark ? 'bg-[#1A73E8]/10' : 'bg-[#1A73E8]/[0.06]') : (isDark ? 'bg-[#D0BCFF]/10' : 'bg-[#7C3AED]/[0.07]');
        return (
          <div className="flex justify-end">
            <div className="max-w-[85%]">
              <div className="flex items-center justify-end gap-1 mb-1 text-[11px] font-medium" style={{ color: tint }}>
                <span>{isWu ? '✨' : '📋'}</span><span>{'Pinvou · ' + item.pinvouTransfer + ' · 转交修订'}</span>
              </div>
              <div className={`px-5 py-3 rounded-[20px] text-[15px] leading-relaxed whitespace-pre-wrap ${tintBg} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{item.text}</div>
            </div>
          </div>
        );
      }
      const actBtn = isDark
        ? 'text-[#8E8E8E] hover:text-[#E3E3E3] hover:bg-white/10'
        : 'text-[#9AA0A6] hover:text-[#444746] hover:bg-black/[0.06]';
      return (
        <div className="flex justify-end group">
          <div className="flex flex-col items-end max-w-[85%]">
            <div className={`px-5 py-3 rounded-[20px] text-[15px] leading-relaxed whitespace-pre-wrap ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`}>{item.text}</div>
            {/* iOS 风操作条：hover 气泡时下方浮现。复制=所有 query；编辑重发=仅最新(editable)。 */}
            <div className="flex items-center gap-0.5 mt-1 pr-1 opacity-0 group-hover:opacity-100 transition-opacity duration-150">
              <button title={copied ? t.copied : t.copyMsg} onClick={copyText}
                className={`w-7 h-7 rounded-lg flex items-center justify-center transition-colors ${actBtn}`}>
                {copied ? <Check size={14} className="text-[#34C759]" /> : <Copy size={14} />}
              </button>
              {editable && (
                <button title={t.editResend} onClick={() => { setVal(item.text); setEditing(true); }}
                  className={`w-7 h-7 rounded-lg flex items-center justify-center transition-colors ${actBtn}`}>
                  <Edit2 size={14} />
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    // 思考指示器：Braille 转圈 + 思考中/调用工具 + 计时（每阶段切换重置）
    const BRAILLE = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
    const ThinkingBubble = ({ thinking, theme, t }) => {
      const isDark = theme === 'dark';
      const [frame, setFrame] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const phase = thinking ? thinking.phase : 'thinking';
      const toolName = thinking ? thinking.toolName : '';
      const startedAt = (thinking && thinking.startedAt) || Date.now();
      useEffect(() => {
        setFrame(0); setElapsed(0);
        const id = setInterval(() => {
          setFrame(f => (f + 1) % BRAILLE.length);
          setElapsed(Math.floor((Date.now() - startedAt) / 1000));
        }, 100);
        return () => clearInterval(id);
      }, [startedAt, phase, toolName]);
      let text;
      if (phase === 'tool' && toolName) {
        text = t.thinkingCall(toolName, elapsed);
      } else {
        const suffix = elapsed >= 120 ? ` · ${t.hintSlow120}` : elapsed >= 30 ? ` · ${t.hintSlow30}` : '';
        text = `${t.thinkingLabel}... ${elapsed}s${suffix}`;
      }
      return (
        <div className="flex justify-start">
          <div className={`text-[13px] font-mono px-3 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#A8C7FA]' : 'bg-[#F0F4F9] text-[#0B57D0]'}`}>
            {BRAILLE[frame]} {text}
          </div>
        </div>
      );
    };

    // ③ 卡牌制造专家: 从助手消息渲染后的 html 里抠出 ```persona-card 草稿块 → 解析成卡。
    function htmlUnescape(s) {
      return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
    }
    function asDraft(d) {
      if (!d || typeof d !== 'object' || !d.name || !d.body) return null;
      var dept = (d.dept && DEPT_ORDER.indexOf(d.dept) >= 0) ? d.dept : 'specialized';
      return { name: d.name, dept: dept, emoji: d.emoji || '🃏', color: d.color || '', description: d.description || '', body: d.body };
    }
    // 模型偶尔给 JSON 末尾多带一个逗号(trailing comma)等小瑕疵 → 严格 JSON.parse 会整段拒掉,
    // 导致草稿卡解析失败、不出「存入卡牌池」按钮。宽松解析:先严格,失败再去掉对象/数组结尾多余
    // 逗号重试(去尾逗号对合法 JSON 无副作用)。失败返回 null(不抛)。
    // 从第一个 { 起按括号配平截取一个完整 JSON 对象(尊重字符串/转义),容忍对象后面多余的 }
    // 或杂物(模型偶发多打一个右括号、或 ``` 块后还粘了别的字符)。截断(没闭合)则返回 null。
    function extractBalancedJson(s) {
      var i = s.indexOf('{');
      if (i < 0) return null;
      var depth = 0, inStr = false, esc = false;
      for (var j = i; j < s.length; j++) {
        var c = s.charAt(j);
        if (inStr) {
          if (esc) esc = false;
          else if (c === '\\') esc = true;
          else if (c === '"') inStr = false;
        } else if (c === '"') inStr = true;
        else if (c === '{') depth++;
        else if (c === '}') { depth--; if (depth === 0) return s.slice(i, j + 1); }
      }
      return null;
    }
    // 一条完整解析链: 严格 → 去尾逗号 → 从首个 { 括号配平截取(+去尾逗号)。失败返回 null。
    // (名字避开本文件里另一个 tryParseJson —— 那是工具结果视图用的简单版)
    function parseJsonChain(s) {
      try { return JSON.parse(s); } catch (e) {}
      try { return JSON.parse(s.replace(/,(\s*[}\]])/g, '$1')); } catch (e) {} // 去尾逗号
      var bal = extractBalancedJson(s);                                        // 容忍多余右括号/尾部杂物
      if (bal) {
        try { return JSON.parse(bal); } catch (e) {}
        try { return JSON.parse(bal.replace(/,(\s*[}\]])/g, '$1')); } catch (e) {}
      }
      return null;
    }
    function parseLooseJson(raw) {
      var v = parseJsonChain(raw);
      if (v) return v;
      // 最后手段: 模型偶尔把本该是普通 " 的地方(数组/对象边界处)打成转义 \",令整段 JSON 非法,
      // 上面的链全兜不住(实例: card-question 的 options 后两项被写成 \"...\")。去掉多余转义引号
      // 再走一遍完整链。仅对**已解析失败**的输入生效 —— 合法用了 \" 的 JSON 在 parseJsonChain(raw)
      // 第一步就成功、走不到这里,故不受影响。
      var deesc = raw.replace(/\\"/g, '"');
      return deesc !== raw ? parseJsonChain(deesc) : null;
    }
    // 扫所有 ```代码块,任何能解析成「含 name+body 的 JSON」的就当卡牌草稿。
    // 不强求 ```persona-card 标签 —— 小模型常打 ```json 或不打标签,放宽识别更鲁棒。
    // 形状校验(name+body)避免把别的 JSON 误判成草稿。明确 persona-card 标签的优先。
    // 返回 { draft, html }:html 是把那段原始 JSON 块抹掉后的版本(用户只看友好草稿卡,不看机器载荷)。
    function parsePersonaDraft(html) {
      if (!html || html.indexOf('{') < 0) return { draft: null, html: html };
      var re = /<pre[^>]*>\s*<code([^>]*)>([\s\S]*?)<\/code>\s*<\/pre>/g, m, chosen = null, chosenDraft = null;
      while ((m = re.exec(html))) {
        var raw = htmlUnescape(m[2]).trim();
        if (raw.charAt(0) !== '{') continue;
        try {
          var draft = asDraft(parseLooseJson(raw));
          if (!draft) continue;
          if (/persona-card/.test(m[1])) { chosen = m[0]; chosenDraft = draft; break; } // 明确标签优先
          if (!chosenDraft) { chosen = m[0]; chosenDraft = draft; }
        } catch (e) { /* 非 JSON 块,跳过 */ }
      }
      if (!chosenDraft) return { draft: null, html: html };
      return { draft: chosenDraft, html: html.replace(chosen, '') };
    }
    // 卡牌制造专家追问时,若问题有可选项,会输出一个 ```card-question 块 {question, options[]}。
    // 抠出来 → 渲染成可点击的 iOS 选项卡;点选项即把它作为回答发送。返回 { q, html(抹掉块) }。
    function parseCardQuestion(html) {
      if (!html || html.indexOf('card-question') < 0) return { q: null, html: html };
      var re = /<pre[^>]*>\s*<code([^>]*)>([\s\S]*?)<\/code>\s*<\/pre>/g, m;
      while ((m = re.exec(html))) {
        if (!/card-question/.test(m[1])) continue;
        var raw = htmlUnescape(m[2]).trim();
        if (raw.charAt(0) !== '{') continue;
        var d = parseLooseJson(raw);
        if (d && d.question && Array.isArray(d.options)) {
          var opts = d.options.filter(function (o) { return typeof o === 'string' && o.trim(); });
          if (opts.length) return { q: { question: String(d.question), options: opts }, html: html.replace(m[0], '') };
        }
      }
      return { q: null, html: html };
    }
    // 点选项时实际发送的回答:取"短标签 —— 说明"里的短标签;没分隔符就发整句。
    function optionAnswer(opt) {
      var s = String(opt).split(/\s*(?:——|—|::|:|：|\(|（)/)[0].trim();
      return s || String(opt).trim();
    }
    // 流式中: JSON 还没闭合无法解析,把正在生成的卡牌/选项代码块折叠成占位,避免原始 JSON 一直刷屏。
    function hideStreamingDraft(html, label) {
      if (!html) return html;
      var m = /<pre[^>]*>\s*<code[^>]*(?:persona-card|card-question)[\s\S]*$/i.exec(html); // persona-card / card-question 标签块(到末尾)
      if (!m) m = /<pre[^>]*>\s*<code[^>]*>\s*\{[\s\S]*?(?:name|&quot;name)[\s\S]*$/i.exec(html); // 兜底: 以 { 开头且含 name 的块
      if (!m) return html;
      return html.slice(0, m.index) + '<div style="margin-top:.5em;opacity:.7;font-size:13px">' + (label || '🃏 正在设计卡牌…') + '</div>';
    }

    const ChatBubble = ({ item, theme, onPrefill, onSend, editable, onOpenEditor, t, isLatestArtifact }) => {
      const isDark = theme === 'dark';
      const assistantSelectionHostRef = useRef(null);
      const assistantSelectionTargetRef = useRef(null);

      if (item.type === 'artifact_card') return <ArtifactCard item={item} theme={theme} t={t} isLatest={isLatestArtifact} />;
      if (item.type === 'plan_card') return <PlanCard item={item} theme={theme} t={t} onPrefill={onPrefill} />;
      if (item.type === 'plan_stuck') return <PlanStuckCard item={item} theme={theme} t={t} />;
      if (item.type === 'careful_blocked') return <CarefulBlockedCard item={item} theme={theme} t={t} />;
      if (item.type === 'user_input') return <UserInputCard item={item} theme={theme} t={t} />;
      if (item.type === 'user') return <UserBubble item={item} theme={theme} editable={editable} t={t} />;

      if (item.type === 'card_creator_intro') {
        return (
          <div className="flex justify-start" style={{ fontFamily:'-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif' }}>
            <div className="rounded-[14px] px-4 py-3 max-w-[440px] text-[15px] font-medium" style={{ background: isDark ? '#1C1C1E' : '#F2F2F7', color: isDark ? '#fff' : '#000' }}>{t.cpIntroTitle}</div>
          </div>
        );
      }

      if (item.type === 'assistant') {
        if (item.streaming && !item.html) return null; // 空流式气泡交给 ThinkingBubble 表示
        const html = item.html || '';
        const pd = item.streaming ? { draft: null, html: hideStreamingDraft(html, t && t.cpDesigning) } : parsePersonaDraft(html);
        const cq = item.streaming ? { q: null, html: pd.html } : parseCardQuestion(pd.html);
        // 草稿是否已存入(按名字在已加载的卡池里找同名自制卡 → 派生"已存入",免单独持久化)
        const draftSaved = pd.draft && bridge.available && bridge.getPersonas
          && bridge.getPersonas().some(function(c){ return c && c.source === 'user' && c.name === pd.draft.name; });
        return (
          <div className="flex justify-start">
            <div ref={assistantSelectionHostRef} className={`relative ${cq.q ? 'w-full' : 'max-w-[95%]'} ${isDark ? 'dark-code' : 'light-code'}`}>
              <div
                ref={assistantSelectionTargetRef}
                className={`msg-md text-[15px] leading-relaxed ${item.streaming ? 'streaming-cursor' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}
                onClick={(e) => {
                  // 聊天里的链接(如飞书授权 URL)点击 → 走系统浏览器,别导航主窗口/不可点。
                  const a = e.target && e.target.closest && e.target.closest('a[href]');
                  if (!a) return;
                  const href = a.getAttribute('href') || '';
                  if (/^https?:\/\//i.test(href)) {
                    e.preventDefault();
                    window.__TAURI__.core.invoke('open_external_url', { url: href }).catch(() => {});
                  }
                }}
                dangerouslySetInnerHTML={{ __html: cq.html || '' }}
              />
              <SelectionCopyButton hostRef={assistantSelectionHostRef} targetRef={assistantSelectionTargetRef} theme={theme} t={t} />
              {cq.q ? (
                <div className="mt-2 w-full" style={{ fontFamily:'-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif' }}>
                  <div className="text-[14px] font-medium mb-2" style={{ color: isDark ? '#fff' : '#000' }}>{cq.q.question}</div>
                  <div className="rounded-[14px] overflow-hidden" style={{ background: isDark ? '#1C1C1E' : '#fff', border: isDark ? 'none' : '0.5px solid rgba(60,60,67,.12)' }}>
                    {cq.q.options.map((opt, i) => (
                      <button key={i} onClick={()=> onSend && onSend(optionAnswer(opt))}
                        className="w-full flex items-center gap-3 px-4 py-3 text-left transition-opacity active:opacity-60 hover:opacity-90"
                        style={i ? { borderTop: '0.5px solid ' + (isDark ? 'rgba(84,84,88,.45)' : 'rgba(60,60,67,.12)') } : undefined}>
                        <span className="text-[15px] shrink-0 text-right" style={{ color: '#8E8E93', width: 15, fontVariantNumeric: 'tabular-nums' }}>{i + 1}</span>
                        <span className="text-[15px] flex-1 min-w-0" style={{ color: isDark ? '#fff' : '#000' }}>{opt}</span>
                        <ChevronRight size={16} className="shrink-0" style={{ color: '#C7C7CC' }} />
                      </button>
                    ))}
                  </div>
                </div>
              ) : null}
              {pd.draft ? (
                <div className="mt-2 rounded-[14px] p-3 flex items-center gap-3 max-w-[460px]" style={{ background: isDark ? '#1C1C1E' : '#F2F2F7' }}>
                  <AppIcon card={pd.draft} isDark={isDark} cls="w-11 h-11 rounded-[12px]" fb={22} />
                  <div className="min-w-0 flex-1">
                    <div className="text-[15px] font-semibold leading-snug truncate" style={{ color: isDark ? '#fff' : '#000' }}>{pd.draft.name}</div>
                    <div className="text-[13px] truncate" style={{ color: isDark ? 'rgba(235,235,245,.6)' : 'rgba(60,60,67,.6)' }}>{pd.draft.description || deptLabelFor(t, pd.draft.dept)}</div>
                  </div>
                  {draftSaved
                    ? <span className="shrink-0 inline-flex items-center gap-1 h-8 px-1 text-[13px] font-medium" style={{ color:'#8E8E93' }} title={t.cpDraftSavedTitle}><Check size={15} strokeWidth={2.5} style={{ color:'#34C759' }} />{t.cpDraftSaved}</span>
                    : <button onClick={()=> onOpenEditor && onOpenEditor(pd.draft)} className="shrink-0 px-4 h-8 rounded-full text-[13px] font-semibold text-white" style={{ background: isDark ? '#0A84FF' : '#007AFF' }} title={t.cpDraftViewTitle}>{t.cpDraftView}</button>}
                </div>
              ) : null}
              {item.time && !item.streaming && (
                <div className={`text-[11px] mt-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{item.time}</div>
              )}
            </div>
          </div>
        );
      }

      if (item.type === 'tool') {
        return <ToolCard item={item} theme={theme} t={t} />;
      }

      if (item.type === 'persona_equip') {
        const c = item.card || {};
        const tc = (typeof deptColor !== 'undefined' ? deptColor(c.dept) : '#ffae1e');
        const deptLabel = deptLabelFor(t, c.dept);
        const cd = personaText(c, t);
        return (
          <div className="flex flex-col gap-1.5" style={{ fontFamily:'-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif' }}>
            <div className="text-[12px] font-medium" style={{ color: '#8E8E93' }}>{t.cpEquipBubbleSys}</div>
            <div className="rounded-[14px] p-4 max-w-[560px]" style={{ background: isDark ? '#1C1C1E' : '#F2F2F7' }}>
              <div className="flex items-center gap-3 mb-3">
                <AppIcon card={c} isDark={isDark} cls="w-11 h-11 rounded-[12px]" fb={22} />
                <div className="text-[15px] font-semibold leading-snug" style={{ color: isDark ? '#fff' : '#000' }}>{t.cpEquipBubbleTitle(cd.name)}</div>
              </div>
              <div className="text-[13px] space-y-1" style={{ color: isDark ? '#C7C7CC' : '#3C3C43' }}>
                <div>{t.cpDept}: <span style={{ color: isDark ? '#0A84FF' : '#007AFF', fontWeight: 600 }}>{deptLabel}</span></div>
                <div>{t.cpDescLabel}: {cd.description}</div>
              </div>
              <div className="text-[12px] mt-2.5" style={{ color: '#8E8E93' }}>{t.cpEquipBubbleNote}</div>
            </div>
          </div>
        );
      }
      if (item.type === 'system') {
        return (
          <div className="flex justify-center">
            <div className={`text-[13px] px-4 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#8E8E8E]' : 'bg-[#F0F4F9] text-[#757575]'}`}>
              {item.text}
            </div>
          </div>
        );
      }
      if (item.type === 'memory_notice') {
        const text = item.text || '';
        const quietNotice = item.kind === 'recent_activity' || item.kind === 'recent_work';
        const meta = item.kind === 'current_focus'
          ? { label: '当前关注', hint: '后续对话会参考这个近期事项。' }
          : item.kind === 'recent_activity' || item.kind === 'recent_work'
            ? { label: '近期动态', hint: '后续对话会参考这次完成的事情。' }
          : item.kind === 'work_context'
            ? { label: '工作背景', hint: '后续对话会参考这条长期背景。' }
          : item.kind === 'profile'
            ? { label: '称呼', hint: '后续对话会按这个称呼交流。' }
            : { label: '长期偏好', hint: '后续对话会参考这条偏好。' };
        if (quietNotice) {
          return (
            <div className="flex justify-center">
              <div
                className="inline-flex items-center gap-1.5 max-w-[360px] px-3 py-1.5 rounded-full text-[12px] text-[#AEB4BC]"
                title={text}
                style={{
                  background: 'rgba(32, 34, 38, 0.54)',
                  border: '1px solid rgba(255,255,255,0.06)',
                }}
              >
                <Check size={12} className="shrink-0 text-[#30D158]" />
                <span className="font-medium text-[#D5D9DE]">已记录近期动态</span>
                <span className="truncate">可在记忆中心查看</span>
              </div>
            </div>
          );
        }
        return (
          <div className="flex justify-end">
            <div
              className="max-w-[420px] w-full rounded-[16px] px-4 py-3 text-[#F2F3F5]"
              style={{
                background: 'rgba(32, 34, 38, 0.86)',
                border: '1px solid rgba(255,255,255,0.08)',
                boxShadow: '0 14px 36px rgba(0,0,0,0.34)',
                backdropFilter: 'blur(16px)',
                WebkitBackdropFilter: 'blur(16px)',
              }}
            >
              <div className="flex items-center gap-2 min-w-0">
                <span className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 bg-[#34C759]/[0.15] text-[#30D158]">
                  <Check size={15} />
                </span>
                <div className="min-w-0">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="text-[13px] font-semibold leading-tight">{item.statusLabel || '记忆已更新'}</span>
                    <span className="text-[11px] px-2 py-0.5 rounded-full bg-white/[0.07] text-[#AEB4BC]">{meta.label}</span>
                  </div>
                  <div className="mt-1 text-[12px] leading-relaxed text-[#AEB4BC]">{meta.hint}</div>
                </div>
              </div>
              {text && (
                <div className="mt-3 ml-9 border-l-2 border-[#0A84FF]/70 pl-3 py-1 text-[13px] leading-relaxed break-words text-[#E8EAED]">
                  “{text}”
                </div>
              )}
            </div>
          </div>
        );
      }
      if (item.type === 'memory_candidate') {
        const resolved = !!item.resolved;
        if (resolved && (item.statusLabel === '已忽略' || item.statusLabel === '不再提示')) return null;
        const text = item.text || '';
        const preferenceDetail = /回答|回复|简洁|详细|风格|语气|口吻/.test(text) ? '回答风格'
          : /代码|测试|开发|实现|文档/.test(text) ? '工作方式'
          : '';
        const meta = item.kind === 'current_focus'
          ? { label: '当前关注', prompt: '我可以记住这个当前关注', hint: '以后我会用它理解你最近正在推进的工作。' }
          : item.kind === 'recent_activity' || item.kind === 'recent_work'
            ? { label: '近期动态', prompt: '我可以记住这个近期动态', hint: '以后我会用它理解你刚完成的工作。' }
          : item.kind === 'work_context'
            ? { label: '工作背景', prompt: '我可以记住这条工作背景', hint: '以后我会用它理解你的长期工作上下文。' }
          : item.kind === 'profile'
            ? { label: '称呼', prompt: '我可以记住这个称呼', hint: '以后我会按这个称呼和你交流。' }
            : { label: '偏好' + (preferenceDetail ? ' · ' + preferenceDetail : ''), prompt: '我可以记住这条偏好', hint: '以后我会按这个偏好调整回复方式。' };
        return (
          <div className="flex justify-end">
            <div
              className={`max-w-[480px] w-full rounded-[18px] px-4 py-3.5 ${isDark ? 'text-[#F2F3F5]' : 'text-[#F8FAFC]'}`}
              style={{
                background: 'rgba(32, 34, 38, 0.92)',
                border: '1px solid rgba(255,255,255,0.08)',
                boxShadow: '0 18px 50px rgba(0,0,0,0.45)',
                backdropFilter: 'blur(18px)',
                WebkitBackdropFilter: 'blur(18px)',
              }}
            >
              <div className="flex items-start justify-between gap-3">
                <div className="flex items-center gap-2 min-w-0">
                  <span className={`w-7 h-7 rounded-full flex items-center justify-center shrink-0 ${resolved ? 'bg-[#34C759]/[0.15] text-[#30D158]' : 'bg-[#0A84FF]/[0.16] text-[#7DBDFF]'}`}>
                    {resolved ? <Check size={15} /> : <Brain size={15} />}
                  </span>
                  <div className="min-w-0">
                    <div className="text-[13px] font-semibold leading-tight">{resolved ? (item.statusLabel || '已处理') : '记忆候选'}</div>
                    {!resolved && <div className="text-[12px] leading-tight mt-1 text-[#AEB4BC]">{meta.prompt}</div>}
                  </div>
                </div>
                <div className="shrink-0 flex items-center gap-2">
                  <span className="text-[11px] px-2 py-1 rounded-full bg-white/[0.07] text-[#AEB4BC]">{meta.label}</span>
                  {!resolved && (
                    <button
                      className="w-6 h-6 rounded-full flex items-center justify-center text-[#8E8E93] hover:text-[#F2F3F5] hover:bg-white/[0.08] transition-colors"
                      title="这次忽略"
                      onClick={() => window.TauriBridge && window.TauriBridge.ignoreMemoryCandidate(item.memoryId, item.id)}
                    >
                      <X size={13} />
                    </button>
                  )}
                </div>
              </div>
              <div className="mt-3 ml-9 border-l-2 border-[#0A84FF]/70 pl-3 py-1 text-[14px] leading-relaxed break-words text-[#F2F3F5]">
                “{text}”
              </div>
              {!resolved && <div className="mt-2 ml-9 text-[12px] leading-relaxed text-[#AEB4BC]">{meta.hint}</div>}
              {!resolved && (
                <div className="mt-3 ml-9 flex flex-wrap items-center gap-2">
                  <button className="inline-flex items-center gap-1.5 text-[13px] font-medium px-3.5 py-1.5 rounded-full bg-[#0A84FF] text-white hover:bg-[#1677D2] transition-colors" onClick={() => window.TauriBridge && window.TauriBridge.confirmMemoryCandidate(item.memoryId, item.id)}><Check size={14} />记住</button>
                  <button className="inline-flex items-center gap-1.5 text-[13px] px-3.5 py-1.5 rounded-full bg-white/[0.08] text-[#E8EAED] hover:bg-white/[0.12] transition-colors" onClick={() => window.TauriBridge && window.TauriBridge.ignoreMemoryCandidate(item.memoryId, item.id)}><X size={14} />这次忽略</button>
                  <button className="text-[13px] px-2 py-1.5 rounded-full text-[#AEB4BC] hover:text-[#F2F3F5] hover:bg-white/[0.08] transition-colors" onClick={() => window.TauriBridge && window.TauriBridge.neverMemoryCandidate(item.memoryId, item.id)}>不再提示</button>
                </div>
              )}
            </div>
          </div>
        );
      }

      return null;
    };

    // ==========================================
    // Artifact Card — present_artifact 成品卡（点击打开预览）
    // ==========================================
    // 产物类型 → { 角标/标签文字, tile 配色, lucide 内联 SVG 路径 }（零下载；仅无封面紧凑态显图标）。
    // 配色/字形照搬 产物卡图标预览.html（唯一权威）。
    const _ARTIFACT_FMT = {
      pptx:     { label: 'PPTX', color: '#D24726', glyph: '<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/>' },
      docx:     { label: 'DOCX', color: '#2B579A', glyph: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>' },
      xlsx:     { label: 'XLSX', color: '#217346', glyph: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M12 3v18"/>' },
      pdf:      { label: 'PDF',  color: '#E5352B', glyph: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h3"/>' },
      image:    { label: 'IMG',  color: '#8E8E93', glyph: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>' },
      html:     { label: 'HTML', color: '#22A7C2', glyph: '<path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/>' },
      markdown: { label: 'MD',   color: '#6B7280', glyph: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 16V8l3 3 3-3v8"/><path d="M18 8v6l-2-2"/><path d="m16 12 2 2 2-2"/>' },
      other:    { label: 'FILE', color: '#6B7280', glyph: '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>' },
    };
    const _artifactKind = (p) => {
      const ext = (String(p || '').split('.').pop() || '').toLowerCase();
      if (ext === 'pptx' || ext === 'ppt') return 'pptx';
      if (ext === 'docx' || ext === 'doc') return 'docx';
      if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') return 'xlsx';
      if (ext === 'pdf') return 'pdf';
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'].indexOf(ext) >= 0) return 'image';
      if (ext === 'html' || ext === 'htm') return 'html';
      if (ext === 'md' || ext === 'markdown') return 'markdown';
      return 'other';
    };
    // 文件类型图标（白色，置于配色 tile 上）。
    const AcFmtIcon = ({ kind, className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        className={className} dangerouslySetInnerHTML={{ __html: (_ARTIFACT_FMT[kind] || _ARTIFACT_FMT.other).glyph }} />
    );
    // 设计稿专用图标（逐字照搬 前端-产物卡片.txt，含其独有 strokeWidth）。
    const AcShieldCheck = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>;
    const AcSparkles = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
    const AcArrowUpRight = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>;
    const AcFolder = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>;

    const ArtifactCard = ({ item, theme, t, isLatest }) => {
      const path = item.path || '';
      const kind = _artifactKind(path);
      const fmt = _ARTIFACT_FMT[kind] || _ARTIFACT_FMT.other;
      const basename = (String(path).split(/[\\/]/).pop()) || '';
      const title = item.title || basename || t.artifactLabel;
      const open = () => { if (bridge.available && path) bridge.openArtifactExternal(path, item.sessionId); };

      // 封面缩略图：仅 pptx 异步抽取（Rust read_artifact_thumbnail 读 docProps/thumbnail.jpeg → data URL）。
      // 拿不到则 hasCover=false，走紧凑态。本地数据、无外链。
      const [coverUrl, setCoverUrl] = useState(null);
      useEffect(() => {
        let alive = true;
        setCoverUrl(null);
        if (kind === 'pptx' && bridge.available && bridge.readArtifactThumbnail && path) {
          bridge.readArtifactThumbnail(path).then((u) => { if (alive && u) setCoverUrl(u); }).catch(() => {});
        }
        return () => { alive = false; };
      }, [path, kind]);
      const hasCover = !!coverUrl;

      return (
        <div className="flex justify-start" style={{ fontFamily:'-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif' }}>
          <div className="w-full bg-white dark:bg-[#1E1E1E] rounded-[24px] shadow-[0_8px_30px_rgba(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgba(0,0,0,0.2)] border border-black/[0.04] dark:border-white/[0.06] p-3 flex flex-col transition-all duration-300">

            {/* 封面区域 */}
            {hasCover ? (
              <div className="relative group/cover cursor-pointer rounded-[16px] overflow-hidden bg-gray-100 dark:bg-[#2C2C2E] border border-black/[0.02] dark:border-white/[0.02]" onClick={open}>
                <div className="w-full aspect-[16/9] relative">
                  <img src={coverUrl} alt="Cover" className="w-full h-full object-cover transition-transform duration-500 ease-out group-hover/cover:scale-[1.02]" />
                </div>
                <div className="absolute top-3 right-3 px-2.5 py-1 rounded-[6px] bg-white/95 dark:bg-[#2C2C2E]/95 text-[#111] dark:text-[#eee] text-[11px] font-bold uppercase tracking-widest shadow-sm">
                  {fmt.label}
                </div>
              </div>
            ) : (
              <div className="px-3 pt-3 pb-2 flex items-center space-x-3">
                <div className="w-10 h-10 rounded-[8px] flex items-center justify-center shrink-0" style={{ background: fmt.color }}>
                  <AcFmtIcon kind={kind} className="w-5 h-5 text-white" />
                </div>
                <span className="text-[13px] font-semibold text-[#888] dark:text-[#999] uppercase tracking-wider">
                  {fmt.label}
                </span>
              </div>
            )}

            {/* 标题与打开按钮区 */}
            <div onClick={open} className="px-3 pt-4 pb-5 flex justify-between items-center gap-4 group/header cursor-pointer">
              <h2 className="text-[20px] font-semibold tracking-tight text-[#111] dark:text-[#eee] leading-snug truncate group-hover/header:text-[#007AFF] transition-colors">
                {title}
              </h2>
              <button onClick={(e) => { e.stopPropagation(); open(); }} className="flex-shrink-0 flex items-center justify-center w-9 h-9 rounded-full bg-gray-100 dark:bg-white/5 group-hover/header:bg-gray-200 dark:group-hover/header:bg-white/10 text-[#007AFF] dark:text-[#0A84FF] transition-colors active:scale-95" aria-label="打开">
                <AcArrowUpRight className="w-[18px] h-[18px]" />
              </button>
            </div>

            {/* 智能操作区：品 / 悟，横排单行、无副标题；仅最新产物显示 */}
            {isLatest && (
              <div className="grid grid-cols-2 gap-3 mb-4 px-3">
                <button onClick={() => bridge.available && bridge.summonPinvou(path)} title={t.pvBtnPinTitle}
                  className="flex items-center justify-center min-w-0 py-3.5 px-3 rounded-[12px] bg-[#F9F9F9] dark:bg-white/5 hover:bg-[#F0F0F0] dark:hover:bg-white/10 transition-colors active:scale-[0.98] group/btn" aria-label="智能找错">
                  <AcShieldCheck className="w-[18px] h-[18px] text-[#FF9500] dark:text-[#FF9F0A] mr-2 shrink-0" />
                  <span className="text-[14px] font-medium text-[#111] dark:text-[#eee] truncate">{t.pvBtnPinLabel}</span>
                </button>

                <button onClick={() => bridge.available && bridge.inspectPinvou(path)} title={t.pvBtnWuTitle}
                  className="flex items-center justify-center min-w-0 py-3.5 px-3 rounded-[12px] bg-[#F9F9F9] dark:bg-white/5 hover:bg-[#F0F0F0] dark:hover:bg-white/10 transition-colors active:scale-[0.98] group/btn" aria-label="深度查漏">
                  <AcSparkles className="w-[18px] h-[18px] text-[#5E5CE6] dark:text-[#5E5CE6] mr-2 shrink-0" />
                  <span className="text-[14px] font-medium text-[#111] dark:text-[#eee] truncate">{t.pvBtnWuLabel}</span>
                </button>
              </div>
            )}

            {/* 底部路径 */}
            <div className="mx-3 mt-1 mb-2 pt-3 border-t border-gray-100 dark:border-white/[0.05]">
              <div className="flex items-center gap-1.5 text-[12px] text-[#999] dark:text-[#777]">
                <AcFolder className="w-3.5 h-3.5 shrink-0" />
                <span className="truncate" title={path}>{path}</span>
              </div>
            </div>

          </div>
        </div>
      );
    };

    // ==========================================
    // Tool Card
    // ==========================================
    // 弱化类工具：渲染成单行灰条（看得见但不抢眼）；其余有产出类保留醒目卡片。
    // 含 ①只读探查 ②待办/清单的细碎进度操作（易刷屏、对用户价值低）。
    // 批量出方案的 checklist_write/todo_write/update_plan 不在此列（它们走方案卡）。
    const QUIET_TOOLS = new Set([
      'read_file', 'list_dir', 'grep_files', 'file_search', 'glob',
      'checklist_update', 'todo_update', 'checklist_add', 'todo_add', 'checklist_list', 'todo_list',
    ]);

    const toolBasename = (p) => {
      if (typeof p !== 'string' || !p) return '';
      const parts = p.replace(/\/+$/, '').split('/');
      return parts[parts.length - 1] || p;
    };

    // A 档摘要：只从结构化 args 提“动作对象”（文件名/命令/模式），稳且免费，不 parse output。
    const toolSummary = (name, args, t) => {
      if (!args || typeof args !== 'object') return '';
      switch (name) {
        case 'read_file': {
          const base = toolBasename(args.path);
          if (args.start_line || args.max_lines) {
            const s = args.start_line || 1;
            return base + ' · ' + t.tsLine + ' ' + s + (args.max_lines ? '-' + (s + args.max_lines - 1) : '+');
          }
          return base;
        }
        case 'write_file':
        case 'append_file':
        case 'edit_file':
          return toolBasename(args.path);
        case 'list_dir':
          return toolBasename(args.path || '.') || '.';
        case 'grep_files':
          return args.pattern ? '"' + args.pattern + '"' : '';
        case 'file_search':
          return args.query ? '"' + args.query + '"' : '';
        case 'exec_shell':
          return typeof args.command === 'string' ? args.command.replace(/\s+/g, ' ').trim() : '';
        case 'checklist_update':
        case 'todo_update':
          return args.status === 'completed' ? t.tsDone
            : args.status === 'in_progress' ? t.tsInProgress
            : args.status === 'pending' ? t.tsPending : '';
        default:
          return '';
      }
    };

    // 底座对超 12K 的工具输出会压成 [TOOL_OUTPUT_RECEIPT]（content-addressed 溢出），
    // 直接展示一堆 sha/handle 是噪音 —— 翻译成人话 + 保留 preview 摘要。
    const isReceipt = (text) => typeof text === 'string' && text.trim().startsWith('[TOOL_OUTPUT_RECEIPT]');
    const parseReceipt = (text) => {
      const fields = {};
      String(text).split('\n').forEach((line) => {
        const m = line.match(/^\s*([a-z_]+):\s*(.*)$/);
        if (m) fields[m[1]] = m[2];
      });
      return fields;
    };
    const ReceiptBlock = ({ text, isDark, t }) => {
      const f = parseReceipt(text);
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const body = isDark ? 'text-[#C4C7C5]' : 'text-[#444746]';
      // 输出超大被底座存档、只回传 preview。存档/压缩机制对用户无意义 ——
      // 只展示内容开头 + 一句不带术语的诚实提示（避免误以为是完整输出）。
      const pv = (f.preview && f.preview !== '(none)') ? f.preview.replace(/\\n/g, '\n') : '';
      const pvIsDiff = pv && (/(^|\n)@@/.test(pv) || (pv.indexOf('@@') >= 0 && /(^|\n)[+-]/.test(pv)));
      const note = <div className={`mt-0.5 text-[11px] ${muted}`}>{t.receiptNote}</div>;
      if (pvIsDiff) return (<div><DiffView text={pv} isDark={isDark} />{note}</div>);
      return (
        <div>
          <div className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap' }}>{pv || t.receiptEmpty}</div>
          {pv ? note : null}
        </div>
      );
    };

    // ── 每工具定制结果视图（仿 Claude Code）：解析失败一律 fallback 纯文本，永不崩 ──
    const tryParseJson = (text) => { try { return JSON.parse(text); } catch (_) { return null; } };
    // checklist/plan 输出是「摘要行\n{json}」，切首个换行后 parse
    const tryTailJson = (text) => {
      if (typeof text !== 'string') return null;
      const i = text.indexOf('\n');
      if (i < 0) return null;
      try { return JSON.parse(text.slice(i + 1)); } catch (_) { return null; }
    };
    const looksDiff = (text) => typeof text === 'string'
      && /(^|\n)--- /.test(text) && /(^|\n)\+\+\+ /.test(text);
    const outBox = (isDark) => `tool-card-output custom-scrollbar rounded-lg p-2 text-[12px] ${isDark ? 'bg-[#131314] text-[#C4C7C5]' : 'bg-white text-[#444746]'}`;
    const TODO_SYM = { completed: '☑', in_progress: '◐', pending: '☐' };
    const TODO_TOOLS = ['checklist_write', 'checklist_update', 'checklist_add', 'checklist_list', 'todo_write', 'todo_update', 'todo_add', 'todo_list', 'update_plan'];

    const OutputPre = ({ text, isDark }) => (
      <pre className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap' }}>
        {typeof text === 'string' ? text : JSON.stringify(text, null, 2)}
      </pre>
    );
    const OutputError = ({ text, isDark }) => (
      <pre className={`tool-card-output custom-scrollbar rounded-lg p-2 text-[12px] ${isDark ? 'bg-[#131314] text-[#F28B82]' : 'bg-white text-[#C5221F]'}`} style={{ whiteSpace: 'pre-wrap' }}>
        {typeof text === 'string' ? text : JSON.stringify(text, null, 2)}
      </pre>

    // ── 飞书连接流程 · 跨视图持久 store ──
    // ToolStoreView 随左栏切换会卸载；连接是长流程（装 CLI ~40s + 扫码），进度/监听/秒表
    // 若放组件 useState，一离开工具商店就全丢 → 回来按钮又变“连接”。故挂在模块级单例，
    // 活在组件生命周期之外；组件只订阅它做镜像渲染。
    const feishuConn = {
      flow: null,
      tick: null,
      listenersReady: false,
      subs: new Set(),
      subscribe(fn) { this.subs.add(fn); return () => { this.subs.delete(fn); }; },
      setFlow(u) { this.flow = (typeof u === 'function') ? u(this.flow) : u; this.subs.forEach(fn => { try { fn(this.flow); } catch (_) {} }); },
      startTick() {
        this.stopTick();
        this.tick = setInterval(() => this.setFlow(f => {
          if (!f || f.phase !== 'running') return f;
          const nf = { ...f, sec: (f.sec || 0) + 1 };
          if (f.active === 'cli') nf.pct = Math.min(90, (f.pct || 0) + (90 - (f.pct || 0)) * 0.06 + 1);
          return nf;
        }), 1000);
      },
      stopTick() { if (this.tick) { clearInterval(this.tick); this.tick = null; } },
    };
    // 后端连接事件只注册一次（幂等，跨 ToolStoreView 多次挂载不重复注册）。
    function ensureFeishuListeners() {
      if (feishuConn.listenersReady) return;
      const ev = window.__TAURI__ && window.__TAURI__.event;
      if (!ev) return;
      feishuConn.listenersReady = true;
      ev.listen('feishu:progress', (e) => {
        const p = e.payload || {};
        feishuConn.setFlow(f => {
          const nf = f ? { ...f, steps: { ...(f.steps || {}) } } : { phase: 'running', steps: {}, active: null, pct: 0, sec: 0, log: '' };
          if (p.step) { nf.active = p.step; nf.steps[p.step] = p.status === 'done' ? 'done' : 'active'; }
          if (typeof p.pct === 'number') nf.pct = p.pct;
          if (p.log) nf.log = p.log;
          if (nf.phase !== 'error') nf.phase = 'running';
          return nf;
        });
      });
      ev.listen('feishu:qr', (e) => {
        const p = e.payload || {};
        feishuConn.stopTick();
        feishuConn.setFlow(f => {
          const prev = (f && f.steps) || {};
          return {
            ...(f || {}), phase: 'qr', active: 'qr',
            steps: { ...prev, runtime: prev.runtime || 'done', cli: prev.cli === 'active' ? 'done' : (prev.cli || 'done'), connect: 'done', qr: 'active' },
            qr: p.qr_data_url, qrUrl: p.url, qrPhase: p.phase,
          };
        });
      });
      ev.listen('feishu:connected', () => {
        feishuConn.stopTick();
        feishuConn.setFlow(f => ({ ...(f || {}), phase: 'done', steps: { ...((f && f.steps) || {}), qr: 'done' } }));
        // 连上 → 按规则写技能（默认启用）+ 广播刷新；跟视图无关，放全局做。
        window.__TAURI__.core.invoke('feishu_apply_skills').catch(() => {});
        // 稍后自动收起流程卡（详情里的“已连接”态改由 feishuConnected 驱动）
        setTimeout(() => feishuConn.setFlow(null), 1800);
      });
      ev.listen('feishu:error', (e) => {
        const p = e.payload || {};
        feishuConn.stopTick();
        feishuConn.setFlow(f => {
          const step = (f && f.active) || 'cli';
          return { ...(f || { steps: {} }), phase: 'error', err: String(p.message || '连接失败'), errStep: step, steps: { ...((f && f.steps) || {}), [step]: 'error' } };
        });
      });
    }

      startTick() {

        this.tick = setInterval(() => this.setFlow(f => {
          if (!f || f.phase !== 'running') return f;
          const nf = { ...f, sec: (f.sec || 0) + 1 };
          if (f.active === 'cli') nf.pct = Math.min(90, (f.pct || 0) + (90 - (f.pct || 0)) * 0.06 + 1);

        if (!ev) return;
        const unlisten = [];
        ev.listen('wecom:qr', (e) => {
          const p = e.payload || {};
          // 二维码到了 → 清掉一直显示的"正在生成…"loading,再弹出二维码弹窗。
          setAlert(a => ({ ...a, visible: false, loading: false }));
          setWecomQr({ qr: p.qr_data_url, url: p.url, phase: p.phase });
        }).then(u => unlisten.push(u));
        ev.listen('wecom:connected', () => {
          setWecomQr(null); setWecomConnected(true); setBusyId(null);
          // 连上 → 按规则写技能(默认启用),企微技能即刻对模型可见。
          window.__TAURI__.core.invoke('wecom_apply_skills').catch(() => {});
          setAlert({ visible: true, loading: false, title: '已连接企业微信', subtitle: '', isInstall: true, isError: false, toolId: 'wecom' });
          notifyComposerToolsChanged();
        }).then(u => unlisten.push(u));
        ev.listen('wecom:error', (e) => {
          const p = e.payload || {};
          setWecomQr(null); setBusyId(null);
          setAlert({ visible: true, loading: false, title: '企业微信连接失败', subtitle: String(p.message || '').slice(0, 240), isError: true });
        }).then(u => unlisten.push(u));
        ev.listen('eip:sso', (e) => {
          const p = e.payload || {};
          setEipSso({ url: p.url, qr: p.qr_data_url });
        }).then(u => unlisten.push(u));
        ev.listen('eip:connected', () => {
          setEipSso(null); setEipConnected(true); setBusyId(null);
          setAlert({ visible: true, loading: false, title: '已连接员工门户（EIP）', subtitle: '', isInstall: true, isError: false, toolId: 'eip' });
          notifyComposerToolsChanged();
        }).then(u => unlisten.push(u));
        ev.listen('eip:error', (e) => {
          const p = e.payload || {};
          setEipSso(null); setBusyId(null);
          setAlert({ visible: true, loading: false, title: 'EIP 连接失败', subtitle: String(p.message || '').slice(0, 240), isError: true });
        }).then(u => unlisten.push(u));
        ev.listen('zhidao:sso', (e) => {
          const p = e.payload || {};
          setZhidaoSso({ url: p.url, qr: p.qr_data_url });
        }).then(u => unlisten.push(u));
        ev.listen('zhidao:connected', () => {
          setZhidaoSso(null); setZhidaoConnected(true); setBusyId(null);
          setAlert({ visible: true, loading: false, title: '已连接知道知识库', subtitle: '', isInstall: true, isError: false, toolId: 'zhidao' });
          notifyComposerToolsChanged();
        }).then(u => unlisten.push(u));
        ev.listen('zhidao:error', (e) => {
          const p = e.payload || {};
          setZhidaoSso(null); setBusyId(null);
          setAlert({ visible: true, loading: false, title: '知道连接失败', subtitle: String(p.message || '').slice(0, 240), isError: true });
        }).then(u => unlisten.push(u));
        return () => { unlisten.forEach(u => { try { u(); } catch (_) {} }); };
      }, []);

      // 合并后端安装状态到 mock 数据(飞书/企微/EIP/知道 的 installed = 已连接)
      // 新分类映射(按工具 id):沟通协作 / 文档知识 / 研发 / 金融数据 / 生活实用 / H3C 内部
      const CAT_BY_ID = { 1: 'life', 2: 'finance', 3: 'collab', 4: 'docs', 5: 'docs', 6: 'docs', 7: 'collab', 8: 'collab', 9: 'collab', 10: 'collab', 11: 'dev', 12: 'dev', 13: 'finance', 14: 'docs', 17: 'h3c', 18: 'h3c', 99: 'collab' };
      const tools = tsToolsData.map(t => ({
        ...t,
        category: CAT_BY_ID[t.id] || t.category,
        installed: t.feishuCli
          ? feishuConnected
          : t.wecomCli
          ? wecomConnected
          : t.eipCli
          ? eipConnected
          : t.zhidaoCli
          ? zhidaoConnected
          : (t.backendId ? (toolStates[t.backendId] || false) : false),
      }));

      // 技能卡 = 预置(合并安装状态) + 用户上传(后端动态返回,默认图标)
      const presetSkills = tsSkillsData.map(s => {
        if (s.builtin) return { ...s, installed: true };
        // 有配套 MCP 的技能(公文=gongwen,manifest companion_skills 声明)→ 跟随该 MCP 工具态;
        // 同名工具的展示别名(PPT=pptx)同样跟工具态;都不命中才读独立 skill 后端(纯技能/上传)。
        const mcpId = skillToMcp[s.backendId]
          || (tsToolsData.some(t => t.backendId === s.backendId) ? s.backendId : null);
        if (mcpId) return { ...s, installed: !!toolStates[mcpId] };
        const be = skillBackend.find(x => x.id === s.backendId);
        return { ...s, installed: be ? be.installed : false };
      });
      const uploadedSkills = skillBackend.filter(x => x.user_uploaded).map(x => ({
        id: 'up-' + x.id, backendId: x.id, title: x.title, subtitle: x.subtitle || '用户上传的技能',
        category: 'skill', type: 'Skill', version: '—', latency: '本地', desc: x.description || '',
        icon: Package, color: 'bg-gradient-to-b from-slate-400 to-slate-600', installed: true, userUploaded: true,
      }));
      const skillCards = [...presetSkills, ...uploadedSkills];

      const connectorTools = tools.filter(t => !LOCAL_TOOLS.includes(t.backendId));
      const listItems = [...connectorTools, ...skillCards]; // 列表视图:连接器 + 技能全放一起
      // 独家技能:公文写作 / PPT 生成 / 视觉设计(按此序;视觉无 backendId,PIN 后自然排末)
      const FEATURED_SKILL = s => ['government-writing', 'pptx'].includes(s.backendId) || s.id === 's5';
      // 搜索全局:有搜索词时跨「连接器 + 全部技能」检索,不受卡片视图/分类限制(「我的工具」内搜索仍限已安装)
      const searching = searchQuery.trim() !== '';
      const sourceItems = (searching && !installedOnly) ? listItems : (isCard ? skillCards.filter(FEATURED_SKILL) : listItems);
      const PIN = ['government-writing', 'pptx'];
      const filteredTools = sourceItems.filter(tool => {
        const q = searchQuery.toLowerCase();
        const matchesSearch = tool.title.toLowerCase().includes(q) || (tool.desc || '').toLowerCase().includes(q);
        if (installedOnly && !isCard) return matchesSearch && tool.installed;
        const matchesCategory = searching || isCard || activeCategory === 'all' || (activeCategory === 'h3c' ? (tool.category === 'h3c' || !!tool.internal) : tool.category === activeCategory);
        return matchesSearch && matchesCategory;
      }).sort((a, b) => {
        if (isCard && !searching) { const r = x => { const i = PIN.indexOf(x.backendId); return i === -1 ? 99 : i; }; if (r(a) !== r(b)) return r(a) - r(b); }
        // 已上线(有 backendId 或内置)排在未上线(即将上线)之前
        const onA = !!a.backendId || !!a.builtin, onB = !!b.backendId || !!b.builtin;
        if (onA !== onB) return onA ? -1 : 1;
        if (a.installed && !b.installed) return -1;
        if (!a.installed && b.installed) return 1;
        return 0;
      });

      // 从后端加载已安装状态
      const loadBackendState = async () => {
        try {
          const list = await window.__TAURI__.core.invoke('list_marketplace_tools');
          const states = {};
          const s2m = {}; // 配套技能 → 所属 MCP(manifest companion_skills 反建,单一真源)
          list.forEach(t => {
            states[t.id] = t.installed;
            (t.companion_skills || []).forEach(sid => { s2m[sid] = t.id; });
          });
          setToolStates(states);
          setSkillToMcp(s2m);
        } catch (e) {
          console.error('list_marketplace_tools failed:', e);
        }
        try {
          const skills = await window.__TAURI__.core.invoke('list_marketplace_skills');
          setSkillBackend(Array.isArray(skills) ? skills : []);
        } catch (e) {
          console.error('list_marketplace_skills failed:', e);
        }
      };

      useEffect(() => { loadBackendState(); }, []);

      // 执行安装（已拿到 config 或无需 config）
      const doInstall = async (backendId, userConfig) => {
        const t = tsToolsData.find(x => x.backendId === backendId);
        const name = t ? t.title : backendId;
        const hasPipDeps = !t?.configFields || t.configFields.length === 0; // 无 config 的本地工具可能有 pip deps
        setBusyId(backendId);
        if (hasPipDeps) {
          setAlert({ loading: true, visible: false, title: `正在安装「${name}」`, subtitle: '首次安装需下载依赖，请耐心等待…', isInstall: true, isError: false });
        }
        try {
          const args = { toolId: backendId };
          if (userConfig && Object.keys(userConfig).length > 0) {
            args.config = userConfig;
          }
          await window.__TAURI__.core.invoke('install_marketplace_tool', args);
          await loadBackendState();
          setAlert({ visible: true, loading: false, title: `已安装「${name}」`, isInstall: true, isError: false, toolId: backendId });
          if (selectedTool && selectedTool.backendId === backendId) {
            setSelectedTool(prev => ({ ...prev, installed: true }));
          }
          notifyComposerToolsChanged();
        } catch (e) {
          console.error('install failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isInstall: false, isError: true });
        } finally {
          setBusyId(null);
        }
      };

      // 技能安装/卸载(无 configFields,直接装/卸)
      const handleSkillAction = async (backendId, isInstalled) => {
        const t = skillCards.find(x => x.backendId === backendId);
        const name = t ? t.title : backendId;
        setBusyId(backendId);
        try {
          const cmd = isInstalled ? 'uninstall_marketplace_skill' : 'install_marketplace_skill';
          await window.__TAURI__.core.invoke(cmd, { skillId: backendId });
          await loadBackendState();
          setAlert({ visible: true, loading: false, title: `${isInstalled ? '已卸载' : '已安装'}「${name}」`, isInstall: !isInstalled, isError: false });
          if (selectedTool && selectedTool.backendId === backendId) {
            setSelectedTool(prev => ({ ...prev, installed: !isInstalled }));
          }
          notifyComposerToolsChanged();
        } catch (e) {
          console.error('skill action failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败：' + e, isInstall: false, isError: true });
        } finally {
          setBusyId(null);
        }
      };

      // 上传 zip 技能包(Rust 端弹 dialog 选文件)
      const handleUploadSkill = async () => {
        setBusyId('__upload__');
        setAlert({ loading: true, visible: false, title: '正在导入技能包…', subtitle: '校验并解压中', isInstall: true, isError: false });
        try {
          const ok = await window.__TAURI__.core.invoke('import_skill_package');
          if (ok) {
            await loadBackendState();
            setAlert({ visible: true, loading: false, title: '技能包已导入', isInstall: true, isError: false });
          } else {
            setAlert({ visible: false, loading: false, title: '', isInstall: false, isError: false }); // 用户取消
          }
        } catch (e) {
          console.error('import skill failed:', e);
          setAlert({ visible: true, loading: false, title: '导入失败：' + e, isInstall: false, isError: true });
        } finally {
          setBusyId(null);
        }
      };

      // 连接飞书(config init --new 自建 app,两段扫码):事件驱动。
      // 进度走后端事件 feishu:qr / feishu:phase / feishu:connected / feishu:error
      //(监听见下方 useEffect);这里只 ensure cli + 触发 begin。busyId 在事件里清。
      const connectFeishu = async () => {
        setBusyId('feishu');
        ensureFeishuListeners();
        // 开流程卡（无阻塞弹窗）：先起“准备运行时”步。写进跨视图 store，切走不丢。
        feishuConn.setFlow({ phase: 'running', steps: { runtime: 'active' }, active: 'runtime', pct: 0, sec: 0, log: '' });
        // 客户端秒表 + 爬行条：后端 feishu:progress 有真实 pct 时会覆盖；没有也不至于像卡死。
        feishuConn.startTick();
        try {
          // ① 确保 CLI（B 方案下可能联网安装 ~40s，会 emit feishu:progress step=cli）
          feishuConn.setFlow(f => ({ ...(f || {}), active: 'cli', pct: 0, log: 'npm: starting…', steps: { ...((f && f.steps) || {}), runtime: 'done', cli: 'active' } }));
          await window.__TAURI__.core.invoke('feishu_ensure_cli');
          feishuConn.setFlow(f => ({ ...(f || {}), active: 'connect', pct: 100, steps: { ...((f && f.steps) || {}), cli: 'done', connect: 'active' } }));
          // ② 连接编排（后端 emit feishu:qr / connected / error）
          await window.__TAURI__.core.invoke('feishu_connect_begin');
        } catch (e) {
          console.error('feishu connect failed:', e);
          feishuConn.stopTick();
          setBusyId(null);
          feishuConn.setFlow(f => {
            const step = (f && f.active) || 'cli';
            return { ...(f || { steps: {} }), phase: 'error', err: String(e).slice(0, 300), errStep: step, steps: { ...((f && f.steps) || {}), [step]: 'error' } };
          });
        }
      };
      // 取消/关闭流程卡：置取消 + kill 子进程 + 清状态。
      const feishuResetFlow = () => {
        feishuConn.stopTick();
        window.__TAURI__.core.invoke('feishu_cancel').catch(() => {});
        feishuConn.setFlow(null); setBusyId(null);
      };
      // 重试：ensure_cli 幂等，直接重跑整个连接流程。
      const feishuRetry = () => { connectFeishu(); };
      const disconnectFeishu = async () => {
        setBusyId('feishu');
        try {
          await window.__TAURI__.core.invoke('feishu_logout');
          // 断开 → 撤掉技能(should_show 变 false)+ 广播刷新。
          await window.__TAURI__.core.invoke('feishu_apply_skills').catch(() => {});
          setFeishuConnected(false);
          setAlert({ visible: true, loading: false, title: '已断开飞书', isInstall: false, isError: false });
          notifyComposerToolsChanged();
        } catch (e) {
          console.error('feishu logout failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isError: true });
        } finally {
          setBusyId(null);
        }
      };

      // 连接企业微信(单段扫码):流程卡驱动(镜像飞书),进度走 wecom:* 事件。
      const connectWecom = async () => {
        setBusyId('wecom');
        ensureWecomListeners();
        // 开流程卡(无阻塞弹窗):先起"准备运行时"步,写进跨视图 store,切走不丢。
        wecomConn.setFlow({ phase: 'running', steps: { runtime: 'active' }, active: 'runtime', pct: 0, sec: 0, log: '' });
        wecomConn.startTick();
        try {
          // ① 确保 CLI(首次联网装 wecom-cli ~40s)
          wecomConn.setFlow(f => ({ ...(f || {}), active: 'cli', pct: 0, log: 'npm: starting…', steps: { ...((f && f.steps) || {}), runtime: 'done', cli: 'active' } }));
          await window.__TAURI__.core.invoke('wecom_ensure_cli');
          wecomConn.setFlow(f => ({ ...(f || {}), pct: 100, steps: { ...((f && f.steps) || {}), cli: 'done' } }));
          // ② 连接编排(后端 emit wecom:qr / connected / error)
          await window.__TAURI__.core.invoke('wecom_connect_begin');
        } catch (e) {
          console.error('wecom connect failed:', e);
          wecomConn.stopTick();
          setBusyId(null);
          wecomConn.setFlow(f => {
            const step = (f && f.active) || 'cli';
            return { ...(f || { steps: {} }), phase: 'error', err: String(e).slice(0, 300), errStep: step, steps: { ...((f && f.steps) || {}), [step]: 'error' } };
          });
        }
      };
      const wecomResetFlow = () => {
        wecomConn.stopTick();
        window.__TAURI__.core.invoke('wecom_cancel').catch(() => {});
        wecomConn.setFlow(null); setBusyId(null);
      };
      const wecomRetry = () => { connectWecom(); };
      const disconnectWecom = async () => {
        setBusyId('wecom');
        try {
          await window.__TAURI__.core.invoke('wecom_logout');
          // 断开 → 撤掉技能(should_show 变 false)。
          await window.__TAURI__.core.invoke('wecom_apply_skills').catch(() => {});
          setWecomConnected(false);
          setAlert({ visible: true, loading: false, title: '已断开企业微信', isInstall: false, isError: false });
          notifyComposerToolsChanged();
        } catch (e) {
          console.error('wecom logout failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isError: true });
        } finally {
          setBusyId(null);
        }
      };

      // 连接 EIP(SSO 轮询自动收):事件驱动。二进制内置,无需 ensure_cli/扫码。
      const connectEip = async () => {
        setBusyId('eip');
        try {
          await window.__TAURI__.core.invoke('eip_connect_begin');
          // 后续:eip:sso 出登录地址 → 用户浏览器 SSO 登录 → eip:connected 收尾。
        } catch (e) {
          console.error('eip connect failed:', e);
          setEipSso(null); setBusyId(null);
          setAlert({ visible: true, loading: false, title: 'EIP 连接失败', subtitle: String(e).slice(0, 240), isError: true });
        }
      };
      const disconnectEip = async () => {
        setBusyId('eip');
        try {
          await window.__TAURI__.core.invoke('eip_logout');
          setEipConnected(false);
          setAlert({ visible: true, loading: false, title: '已断开员工门户（EIP）', isInstall: false, isError: false });
          notifyComposerToolsChanged();
        } catch (e) {
          console.error('eip logout failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isError: true });
        } finally {
          setBusyId(null);
        }
      };

      // 连接知道知识库(SSO 轮询自动收):事件驱动。二进制内置,无需手工粘贴 token。
      const connectZhidao = async () => {
        setBusyId('zhidao');
        try {
          await window.__TAURI__.core.invoke('zhidao_connect_begin');
        } catch (e) {
          console.error('zhidao connect failed:', e);
          setZhidaoSso(null); setBusyId(null);
          setAlert({ visible: true, loading: false, title: '知道连接失败', subtitle: String(e).slice(0, 240), isError: true });
        }
      };
      const disconnectZhidao = async () => {
        setBusyId('zhidao');
        try {
          await window.__TAURI__.core.invoke('zhidao_logout');
          setZhidaoConnected(false);
          setAlert({ visible: true, loading: false, title: '已断开知道知识库', isInstall: false, isError: false });
          notifyComposerToolsChanged();
        } catch (e) {
          console.error('zhidao logout failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isError: true });
        } finally {
          setBusyId(null);
        }
      };

      // 安装/卸载入口
      const handleAction = async (backendId, isInstalled) => {
        // 有配套 MCP 的技能(公文=gongwen)→ 改走该 MCP 装卸,skill 作为 companion 随 MCP 联动(两卡同步);
        // 纯技能(无配套 MCP、无同名工具:如上传技能)才走 handleSkillAction。PPT=pptx 有同名工具,落下方正常工具流。
        if (skillToMcp[backendId]) backendId = skillToMcp[backendId];
        else if (tsSkillsData.some(s => s.backendId === backendId) && !tsToolsData.some(t => t.backendId === backendId)) return handleSkillAction(backendId, isInstalled);
        // 飞书走 CLI 连接流程,不走 marketplace install
        if (backendId === 'feishu') {
          if (isInstalled) return disconnectFeishu();
          // 未连接 → 弹详情弹窗（里面有进度卡）+ 触发 config init --new(浏览器自动建 app + 两段扫码,不收表单)
          const ft = tools.find(x => x.feishuCli) || tsToolsData.find(x => x.backendId === 'feishu');
          if (ft) setSelectedTool(ft);
          return connectFeishu();
        }
        // 企微同走 CLI 连接流程(单段扫码)
        if (backendId === 'wecom') {
          if (isInstalled) return disconnectWecom();
          // 打开详情弹窗(里面有流程卡)+ 触发连接
          const wt = tools.find(x => x.wecomCli) || tsToolsData.find(x => x.backendId === 'wecom');
          if (wt) setSelectedTool(wt);
          return connectWecom();
        }
        // EIP 走 CLI 连接流程(浏览器 SSO 一键登录),不走 marketplace install
        if (backendId === 'eip') {
          if (isInstalled) return disconnectEip();
          return connectEip();
        }
        // 知道知识库走 CLI + SSO 自动轮询流程,不走 marketplace install
        if (backendId === 'zhidao') {
          if (isInstalled) return disconnectZhidao();
          return connectZhidao();
        }
        const t = tsToolsData.find(x => x.backendId === backendId);
        const name = t ? t.title : backendId;

        // 安装：有 configFields 的工具先弹配置弹窗
        if (!isInstalled) {
          // Obsidian：连接前先探测本机状态——没装/没库就引导，不默默装个用不了的连接器
          if (backendId === 'obsidian') {
            let st = null;
            try { st = await window.__TAURI__.core.invoke('detect_obsidian'); } catch (e) {}
            if (st && st.state && st.state !== 'ok') { setObsidianGuide({ backendId, name, ...st }); return; }
            return doInstall(backendId, {});
          }
          if (t?.configFields && t.configFields.length > 0) {
            setConfigDialog({ backendId, name, fields: t.configFields });
            return;
          }
          return doInstall(backendId, {});
        }

        // 卸载
        setBusyId(backendId);
        try {
          await window.__TAURI__.core.invoke('uninstall_marketplace_tool', { toolId: backendId });
          await loadBackendState();
          setAlert({ visible: true, loading: false, title: `已卸载「${name}」`, isInstall: false, isError: false });
          if (selectedTool && selectedTool.backendId === backendId) {
            setSelectedTool(prev => ({ ...prev, installed: false }));
          }
          notifyComposerToolsChanged();
        } catch (e) {
          console.error('uninstall failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isInstall: false, isError: true });
        } finally {
          setBusyId(null);
        }
