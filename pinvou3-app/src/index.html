    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.3); border-radius: 10px; }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.5); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Chat message styles */
    .msg-md h1,.msg-md h2,.msg-md h3,.msg-md h4 { font-weight:600; margin:0.6em 0 0.3em; }
    .msg-md h1 { font-size:1.4em; } .msg-md h2 { font-size:1.2em; } .msg-md h3 { font-size:1.05em; }
    .msg-md p { margin:0.4em 0; line-height:1.7; }
    .msg-md ul,.msg-md ol { padding-left:1.5em; margin:0.4em 0; }
    .msg-md li { margin:0.2em 0; line-height:1.6; }
    .msg-md code { font-family:"JetBrains Mono","SF Mono",Consolas,monospace; font-size:0.88em; padding:0.15em 0.4em; border-radius:6px; }
    .msg-md pre { margin:0.6em 0; padding:1em; border-radius:12px; overflow-x:auto; font-size:0.88em; line-height:1.5; }
    .msg-md pre code { padding:0; background:none; }
    .msg-md blockquote { border-left:3px solid rgba(128,128,128,0.4); padding-left:1em; margin:0.5em 0; opacity:0.85; }
    .msg-md a { text-decoration:underline; }
    .msg-md table { border-collapse:collapse; margin:0.5em 0; font-size:0.92em; }
    .msg-md th,.msg-md td { border:1px solid rgba(128,128,128,0.3); padding:0.4em 0.8em; }

    /* Dark theme code blocks */
    .dark-code .msg-md code { background:rgba(255,255,255,0.08); color:#E3E3E3; }
    .dark-code .msg-md pre { background:rgba(0,0,0,0.3); color:#E3E3E3; }
    /* Light theme code blocks */
    .light-code .msg-md code { background:rgba(0,0,0,0.06); color:#1F1F1F; }
    .light-code .msg-md pre { background:rgba(0,0,0,0.04); color:#1F1F1F; }

    /* Tool card styles */
    .tool-card-output { max-height:200px; overflow-y:auto; font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-all; }

    /* Streaming cursor */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .streaming-cursor::after { content:"▊"; animation:blink 1s step-end infinite; margin-left:2px; }

    /* Thinking animation */
    @keyframes spin-braille { 0%{content:"⠋"} 10%{content:"⠙"} 20%{content:"⠹"} 30%{content:"⠸"} 40%{content:"⠼"} 50%{content:"⠴"} 60%{content:"⠦"} 70%{content:"⠧"} 80%{content:"⠇"} 90%{content:"⠏"} }

    /* ===== 卡片池: tilt / spotlight / borderglow / 挂件 ===== */
    .ap-card { transform-style: preserve-3d; transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s; will-change: transform; position: relative; }
    /* 鼠标跟随高光(--mx/--my 由 JS 注入) */
    .ap-card::before {
      content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0;
      transition:opacity .25s; z-index:1;
      background: radial-gradient(380px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.10), transparent 42%);
    }
    .ap-card:hover::before { opacity:1; }
    .ap-card > * { position:relative; z-index:2; }
    /* A 档金色 spotlight 额外柔光 */
    .ap-card.tier-A:hover { box-shadow: 0 0 0 1px rgba(255,191,0,.35), 0 14px 40px -12px rgba(255,191,0,.30); }
    /* 已加持: 金色流转边框 */
    @keyframes ap-borderglow { 0%{box-shadow:0 0 0 1px rgba(255,170,0,.9),0 0 18px -2px rgba(255,170,0,.55)} 50%{box-shadow:0 0 0 1px rgba(255,210,80,1),0 0 26px 0 rgba(255,190,40,.75)} 100%{box-shadow:0 0 0 1px rgba(255,170,0,.9),0 0 18px -2px rgba(255,170,0,.55)} }
    .ap-card.equipped { border-color: rgba(255,180,30,.95) !important; animation: ap-borderglow 2.4s ease-in-out infinite; }
    /* 挂件(lanyard) 入场 + 悬挂摆动 */
    @keyframes lanyard-drop { 0%{ transform: translateY(-120%) rotate(-3deg); opacity:0 } 60%{ transform: translateY(6%) rotate(1.5deg) } 100%{ transform: translateY(0) rotate(0); opacity:1 } }
    @keyframes lanyard-sway { 0%,100%{ transform: rotate(-1.3deg) } 50%{ transform: rotate(1.3deg) } }
    .lanyard-wrap { animation: lanyard-drop .55s cubic-bezier(.2,.9,.3,1.2) both; transform-origin: top center; }
    .lanyard-card { animation: lanyard-sway 4.5s ease-in-out infinite; transform-origin: top center; }
    /* 详情 modal 里的完整人设正文(markdown) prose 排版 */
    .persona-body h1, .persona-body h2, .persona-body h3 { font-weight:600; margin:.9em 0 .35em; line-height:1.3; }
    .persona-body h1 { font-size:1.15em; } .persona-body h2 { font-size:1.06em; } .persona-body h3 { font-size:1em; }
    .persona-body p { margin:.45em 0; }
    .persona-body ul, .persona-body ol { margin:.4em 0; padding-left:1.4em; }
    .persona-body li { margin:.18em 0; }
    .persona-body code { font-size:.88em; padding:.08em .35em; border-radius:4px; background:rgba(128,128,128,.18); }
    .persona-body pre { padding:.7em; border-radius:8px; background:rgba(128,128,128,.14); overflow-x:auto; margin:.5em 0; }
    .persona-body pre code { background:none; padding:0; }
    .persona-body strong { font-weight:600; }
    .persona-body hr { border:none; border-top:1px solid rgba(128,128,128,.25); margin:.8em 0; }
  </style>

        if (!bs) return;

          modelConfigInitRef.current = true;

      }, [bs]);

      // 草稿 vs 已保存基线 → 模型卡是否显示「保存并重启」操作条
      const savedModel = savedModelConfigRef.current;
      const modelConfigDirty = !!savedModel && (
        modelPreset !== savedModel.preset ||
        customModelName !== savedModel.name ||
        customBaseUrl !== savedModel.baseUrl ||
        customApiKey !== savedModel.apiKey
      );
      function normalizedSearchApiKeyValue(value) {
        const trimmed = (value || '').trim();
        return trimmed ? trimmed : null;
      }
      // 搜索配置也影响 EngineConfig,需保存后重启进程才生效。
      const savedSearch = savedSearchConfigRef.current;
      const searchNeedsRestart = !!savedSearch && (
        searchProvider !== savedSearch.provider ||
        normalizedSearchApiKeyValue(searchApiKey) !== normalizedSearchApiKeyValue(savedSearch.apiKey)
      );

      // Build chat history from sessions
      const skillBindings = (bs && bs.workflow && bs.workflow.bindings) || {};
      const sessionBusy = (bs && bs.sessionBusy) || {};
      const chatHistory = bs && bs.sessions ? bs.sessions.map(s => ({
        id: s.id,
        // 后端默认标题是字面 "新对话"/"New chat"(bridge 以此判断是否自动改名)——显示层映射成当前语言
        title: (!s.title || s.title === '新对话' || s.title === 'New chat') ? t.newChat : s.title,
        date: formatSessionDate(s.updated_at || s.created_at, language),
        skill: skillBindings[s.id] || null,
        working: !!sessionBusy[s.id], // 多 session 并发:该 session 是否正在后台生成
      })) : [];

      function handleNewChat() {
        if (bridge.available) bridge.createNewSession();
        setCurrentView('chat');
      }

      function handleSwitchSession(id) {
        if (bridge.available) bridge.switchToSession(id);
        setActiveChat(id);
        setCurrentView('chat');
      }

      function handleDeleteSession(id) {
        if (bridge.available) bridge.deleteSession(id);
      }

      function handleRenameSession(id, title) {
        if (bridge.available) bridge.renameSession(id, title);
      }

      function handleToggleSuperPerm() {
        if (bridge.available) bridge.toggleSuperPerm();
        else setSuperPerm(!superPerm);
      }

      // 构造完整 UserPrefs 对象写盘。spread bs.settings 保留 search/advanced 等
      // 其他字段——之前漏 spread 会让后端 serde default 把它们重置(bug fix)。
      function buildFullSettings(overrides) {
        const base = (bs && bs.settings) ? bs.settings : {};
        return {
          ...base,
          theme: activeTheme === 'dark' ? 'genesis' : 'light',
          language: LANG_TO_TAG[language] || 'zh-Hans',
          search: {
            provider: searchProvider,
            api_key: normalizedSearchApiKeyValue(searchApiKey),
          },
          advanced: {
            ...buildAdvancedOverrides({}),
            ...(overrides && overrides.advanced ? overrides.advanced : {}),
          },
          ...overrides,
        };
      }

      function handleSetTheme(th) {
        setActiveTheme(th);
        if (bridge.available) {
          bridge.saveSettings(buildFullSettings({ theme: th === 'dark' ? 'genesis' : 'light' }));
        }
      }

      function handleSetSearchProvider(p) {
        setSearchProvider(p);
      }

      function handleSetSearchApiKey(k) {
        setSearchApiKey(k);
      }

      function handleConfirmSearchConfig() {
        if (bridge.available) {
          bridge.saveSettingsAndRestart(buildFullSettings({
            search: { provider: searchProvider, api_key: normalizedSearchApiKeyValue(searchApiKey) },
          }));
        }
      }

      function handleSetLanguage(lang) {
        setLanguage(lang);
        if (bridge.available) {
          bridge.saveSettings(buildFullSettings({ language: LANG_TO_TAG[lang] || 'zh-Hans' }));
        }
      }

      function buildAdvancedOverrides(overrides) {
        return {
          model_preset: overrides.model_preset !== undefined ? overrides.model_preset : modelPreset,
          custom_model_name: overrides.custom_model_name !== undefined ? (overrides.custom_model_name || null) : (customModelName || null),
          custom_base_url: overrides.custom_base_url !== undefined ? (overrides.custom_base_url || null) : (customBaseUrl || null),
          custom_api_key: overrides.custom_api_key !== undefined ? (overrides.custom_api_key || null) : (customApiKey || null),

      // 模型配置改为草稿模式：只更新 state，点击确认后统一保存并重启

          setCustomBaseUrl(saved.baseUrl);
          setCustomApiKey(saved.apiKey);

        setCustomModelName(defs.model);
        setCustomApiKey(''); // 切换 provider 清空 api_key，避免跨厂商 key 混用

      function handleSetCustomModelName(v) {

            {/* Recents — 独立 flex-1 + overflow-y-auto,只在展开态显示。

            {isSidebarOpen && (

            {/* Footer Profile */}

              {!isSidebarOpen && (
                <button
                  onClick={() => setCurrentView('settings')}
                  title={t.settings}
                  className={`relative w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${activeTheme === 'dark' ? 'text-[#E3E3E3] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#E1E5EA]'}`}
                >
                  <Settings size={18} />
                  {hasUpdate && <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-[#EA4335]" />}

              <div className={`flex items-center ${isSidebarOpen ? 'px-2 gap-3' : 'justify-center'}`}>
                <div title={t.localEnv} className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-[12px] font-bold ${activeTheme === 'dark' ? 'bg-[#9580FF] text-white' : 'bg-[#7C3AED] text-white'}`}>
                  GB
                </div>
                {isSidebarOpen && (
                  <div className="flex flex-col whitespace-nowrap overflow-hidden">
                    <span className="text-[14px] font-medium leading-none mb-1">{t.localEnv}</span>
                    <span className={`text-[12px] ${activeTheme === 'dark' ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>GB10 Node</span>
                  </div>

              </div>
              {isSidebarOpen && (
                <button
                  onClick={() => setCurrentView('settings')}
                  title={t.settings}
                  className={`relative w-9 h-9 shrink-0 rounded-full flex items-center justify-center transition-colors ${activeTheme === 'dark' ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#E1E5EA]'}`}

                  <Settings size={18} />
                  {hasUpdate && <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-[#EA4335]" />}

            </div>
          </div>

          {/* ================= Main Content ================= */}
          <div className="flex-1 flex flex-col relative min-w-0 overflow-hidden">

            {/* Gemini Style Background Glow */}
            {currentView === 'chat' && (
              activeTheme === 'light' ? (
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[1200px] h-[800px] bg-[radial-gradient(ellipse_at_center,_rgba(232,240,254,0.8)_0%,_transparent_60%)] pointer-events-none z-0"></div>
              ) : (
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[40%] w-[1400px] h-[900px] bg-[radial-gradient(ellipse_at_center,_rgba(168,199,250,0.25)_0%,_transparent_60%)] pointer-events-none z-0"></div>
              )
            )}

            {currentView === 'monitor' && <MonitorView theme={activeTheme} t={t} bs={bs} />}
            {currentView === 'settings' && (
              <SettingsView
                activeTheme={activeTheme} setActiveTheme={handleSetTheme}
                language={language} setLanguage={handleSetLanguage}
                superPerm={superPerm} setSuperPerm={handleToggleSuperPerm}
                searchProvider={searchProvider} setSearchProvider={handleSetSearchProvider}
                searchApiKey={searchApiKey} setSearchApiKey={handleSetSearchApiKey}
                modelPreset={modelPreset} onChangeModelPreset={handleChangeModelPreset}
                customModelName={customModelName} setCustomModelName={handleSetCustomModelName}
                customBaseUrl={customBaseUrl} setCustomBaseUrl={handleSetCustomBaseUrl}
                customApiKey={customApiKey} setCustomApiKey={handleSetCustomApiKey}
                savedModel={savedModel}
                onConfirmModelConfig={handleConfirmModelConfig}
                onConfirmSearchConfig={handleConfirmSearchConfig}
                modelConfigDirty={modelConfigDirty}
                searchNeedsRestart={searchNeedsRestart}
                bs={bs}
                t={t}
              />
            )}
            {currentView === 'cardpool' && <CardPoolView theme={activeTheme} t={t} bs={bs} onEquipped={() => setCurrentView('chat')} />}
            {currentView === 'chat' && <ChatView theme={activeTheme} t={t} bs={bs} prefill={chatPrefill} onPrefillConsumed={() => setChatPrefill('')} onOpenEditor={(initial) => setPersonaEditor({ initial })} />}
            {/* 草稿态(无 session)也渲染挂件,但强制空态——让欢迎页保留「＋加持卡牌」入口。
                点它跳卡牌池,选卡时 equipPersona 会先物化 session(lazy session)。 */}
            {currentView === 'chat' && bs && (
              <Lanyard persona={bs.activeSessionId ? (bs.activePersona || null) : null} isDark={activeTheme === 'dark'} t={t}
                onRemove={() => bridge.available && bridge.unequipPersona()}
                onOpenPicker={() => setCurrentView('cardpool')} />
            )}
            {currentView === 'search' && <SearchView theme={activeTheme} history={chatHistory} t={t} onSelect={handleSwitchSession} />}

            {/* App 级自创卡编辑器: 聊天里「存入卡牌池」草稿走这条 */}
            {personaEditor && (
              <PersonaEditorModal initial={personaEditor.initial} isDark={activeTheme === 'dark'} t={t}
                onClose={() => setPersonaEditor(null)}
                onSaved={() => setPersonaEditor(null)}
                onDeleted={() => setPersonaEditor(null)} />
            )}

          </div>
          </div>
        </div>
      );
    };

    /* ==========================================
       Helpers
       ========================================== */
    function formatSessionDate(ts, language) {
      if (!ts) return '';
      const d = new Date(typeof ts === 'number' ? ts : ts);
      const now = new Date();
      const diff = now - d;
      const L = {
        zh: { yesterday: '昨天', daysAgo: n => `${n} 天前`, locale: 'zh-CN' },
        ja: { yesterday: '昨日', daysAgo: n => `${n} 日前`, locale: 'ja-JP' },
        en: { yesterday: 'Yesterday', daysAgo: n => `${n}d ago`, locale: 'en-US' },
      }[language] || { yesterday: 'Yesterday', daysAgo: n => `${n}d ago`, locale: 'en-US' };
      // 今天的会话显示具体时间——同日多条全写「今天」毫无区分度
      if (diff < 86400000 && d.getDate() === now.getDate()) return d.toLocaleTimeString(L.locale, { hour: '2-digit', minute: '2-digit', hour12: false });
      if (diff < 172800000) return L.yesterday;
      // 7 天内显示「X 天前」/「X days ago」,更早显示日期
      const days = Math.floor(diff / 86400000);
      if (days < 7) return L.daysAgo(days);
      return d.toLocaleDateString(L.locale, { month: 'short', day: 'numeric' });
    }

      const ramUsedGiB = fmt ? fmt.ramUsedGiB : '—';

      const ramTotal = fmt ? fmt.ramTotal : '—';
      const swapPct = fmt ? fmt.swapPct : 0;

      const vllmConfiguredModel = fmt ? fmt.vllmConfiguredModel : null;

                      <div className="flex items-center gap-2">
                        <span className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.power}</span>
                        <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{gpuPower || '—'}</span>
                      </div>
                    </div>
                  ) : null}
                  <ProgressBar label={t.core} value={gpuAvailable ? gpuUtil : '—'} percentage={gpuAvailable ? gpuUtilPct : 0} theme={theme} />
                </div>
              </WidgetCard>

              <WidgetCard title={t.ram} theme={theme}>
                 <div className="mb-10 flex items-baseline gap-2">
                  <h3 className="text-[48px] font-normal leading-none tracking-tight">{ramUsedGiB}</h3>
                  <span className={`text-[16px] font-medium ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>GB {t.used}</span>
                </div>
                <div className="space-y-6 mt-auto">
                  <ProgressBar label={t.physical} value={ramPct + '%'} subValue={ramTotal + ' ' + t.total} percentage={ramPct} theme={theme} color="#0B57D0" />
                  <ProgressBar label={t.swap} value={swapPct + '%'} subValue={swapTotal} percentage={swapPct} theme={theme} color="#188038" />
                </div>
              </WidgetCard>

              <WidgetCard title={t.vllm} theme={theme}>
                 <div className="flex items-start justify-between mb-8">
                  <div className="min-w-0">
                    <h3 className="text-[22px] font-medium mb-1">{vllmModel}</h3>
                    {vllmModelMismatch && vllmConfiguredModel && (
                      <p className={`text-[12px] truncate ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>
                        配置: {vllmConfiguredModel}
                      </p>
                    )}
                    <p className={`text-[13px] font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{vllmUpstream}</p>
                  </div>
                  <div className={`px-3 py-1 rounded-full flex items-center gap-2 ${
                    vllmStatus === 'MISMATCH'
                      ? (isDark ? 'bg-[#5C3A1E] text-[#F9AB00]' : 'bg-[#FEF3E8] text-[#B06000]')
                      : vllmOnline
                        ? (isDark ? 'bg-[#0F5223] text-[#93D5A6]' : 'bg-[#E6F4EA] text-[#137333]')
                        : (isDark ? 'bg-[#5C2020] text-[#F28B82]' : 'bg-[#FCE8E6] text-[#C5221F]')
                  }`}>
                    {vllmStatus === 'MISMATCH' ? <AlertTriangle size={12} /> : <CheckCircle2 size={12} />}
                    <span className="text-[11px] font-bold tracking-wider">{vllmStatus}</span>
                  </div>
                </div>
                <div className={`rounded-[16px] p-2 mt-auto ${isDark ? 'bg-[#131314]' : 'bg-[#F8F9FA]'}`}>
                  <ListRow label={t.ctx} value={String(vllmMaxLen)} theme={theme} />
                  <ListRow label={t.queue} value={vllmQueue} theme={theme} />
                  <ListRow label={t.kv} value={vllmKv} border={false} theme={theme} />
                </div>
              </WidgetCard>

              <WidgetCard title={t.app} theme={theme}>
                <div className="mb-8">
                  <h3 className="text-[22px] font-medium mb-1">pinvou3-app</h3>
                  <p className={`text-[14px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.appRunning}</p>
                </div>
                <div className={`rounded-[16px] p-2 mt-auto ${isDark ? 'bg-[#131314]' : 'bg-[#F8F9FA]'}`}>
                  <ListRow label={t.curVer} value={appVersion} theme={theme} />
                  <ListRow label={t.uiVer} value={dtVersion} theme={theme} />
                  <ListRow label={t.uptime} value={uptime} border={false} theme={theme} />
                </div>
              </WidgetCard>

            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // Settings View (Material 3 Style)
    // ==========================================
    // 统一排版原语：卡片 / 行(label 左 + 控件右) / 纵向输入字段 / 分段选择 / 改动操作条
    const SCard = ({ isDark, title, children }) => (
      <section className={`rounded-[24px] p-6 ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
        <h2 className="text-[18px] font-medium mb-6">{title}</h2>
        {children}
      </section>
    );

    const SRow = ({ isDark, label, desc, children }) => (
      <div className="flex items-center justify-between gap-8">
        <div className="min-w-0">
          <span className="text-[16px] block mb-1">{label}</span>
          {desc && <span className={`text-[13px] block ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{desc}</span>}
        </div>
        <div className="shrink-0">{children}</div>
      </div>
    );

    const SField = ({ isDark, label, ...inputProps }) => (
      <div>
        <span className={`text-[14px] block mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{label}</span>
        <input
          {...inputProps}
          className={`w-full px-4 py-2 rounded-lg text-[14px] outline-none transition-colors ${
            isDark ? 'bg-[#131314] text-[#E3E3E3] border border-[#444746] focus:border-[#A8C7FA]'
                   : 'bg-white text-[#1F1F1F] border border-[#C4C7C5] focus:border-[#0B57D0]'
          }`}
        />
      </div>
    );

    const SSegmented = ({ isDark, options, value, onChange }) => (
      <div className={`p-1 rounded-full flex ${isDark ? 'bg-[#131314]' : 'bg-[#E1E5EA]'}`}>
        {options.map(o => (
          <button
            key={o.key}
            onClick={() => onChange(o.key)}
            className={`px-5 py-2 rounded-full text-[14px] font-medium transition-colors ${
              value === o.key ? (isDark ? 'bg-[#A8C7FA] text-[#041E49]' : 'bg-white text-[#0B57D0] shadow-sm') : ''
            }`}
          >{o.label}</button>
        ))}
      </div>
    );

    // 「需重启」统一表达：改动后才出现，一句说明 + 一个动作，替代常驻大按钮和斜体小字
    const SActionBar = ({ isDark, message, actionLabel, onAction }) => (
      <div className={`flex items-center justify-between gap-4 px-4 py-3 rounded-xl ${isDark ? 'bg-[#131314]' : 'bg-white'}`}>
        <span className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{message}</span>
        <button
          onClick={onAction}
          className={`text-[13px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${
            isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
                   : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
          }`}
        >{actionLabel}</button>
      </div>
    );

    const SettingsView = ({ activeTheme, setActiveTheme, language, setLanguage, superPerm, setSuperPerm, searchProvider, setSearchProvider, searchApiKey, setSearchApiKey, modelPreset, onChangeModelPreset, customModelName, setCustomModelName, customBaseUrl, setCustomBaseUrl, customApiKey, setCustomApiKey, savedModel, onConfirmModelConfig, onConfirmSearchConfig, modelConfigDirty, searchNeedsRestart, bs, t }) => {
      const isDark = activeTheme === 'dark';
      const [vllmDiscovery, setVllmDiscovery] = useState(null);
      const [vllmDiscovering, setVllmDiscovering] = useState(false);
      const presetOptions = [
        { key: 'local_vllm',  label: t.modelPresetLocalVllm },
        { key: 'deepseek',    label: t.modelPresetDeepseek },
        { key: 'kimi',        label: t.modelPresetKimi },
        { key: 'openai_compatible', label: t.modelPresetOpenaiCompatible },
        { key: 'qwen',        label: t.modelPresetQwen },
        { key: 'doubao',      label: t.modelPresetDoubao },
        { key: 'minimax',     label: t.modelPresetMinimax },
        { key: 'glm',         label: t.modelPresetGlm },
        { key: 'mimo',        label: t.modelPresetMimo },
      ];
      const vllmOnlineCandidates = vllmDiscovery && vllmDiscovery.candidates
        ? vllmDiscovery.candidates.filter(c => c.status !== 'offline')
        : [];
      async function handleDetectLocalVllm() {
        if (!bridge.available || vllmDiscovering) return;
        setVllmDiscovering(true);
        setVllmDiscovery(null);
        try {
          const result = await bridge.discoverLocalVllm({
            currentBaseUrl: customBaseUrl,
            savedBaseUrl: savedModel && savedModel.baseUrl,
          });
          setVllmDiscovery({ candidates: (result && result.candidates) || [] });
        } catch (e) {
          setVllmDiscovery({ error: String(e) });
        } finally {
          setVllmDiscovering(false);
        }
      }
      function handleUseVllmCandidate(candidate) {
        if (!candidate) return;
        if (candidate.base_url) setCustomBaseUrl(candidate.base_url);
        if (candidate.model) setCustomModelName(candidate.model);
        setCustomApiKey('');
      }
      function vllmStatusLabel(status) {
        if (status === 'busy') return t.vllmDetectBusy;
        if (status === 'ready') return t.vllmDetectReady;
        if (status === 'mismatch') return t.vllmDetectMismatch;
        return t.vllmDetectOffline;
      }
      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">

          {/* 标题随内容一起滚动：固定标题 + 硬裁切的滚动边界在视觉上打架 */}
          <div className="flex-1 overflow-y-auto px-16 pb-20 custom-scrollbar">
            <div className="max-w-[800px]">
              <h1 className="text-[32px] font-normal tracking-tight pt-12 pb-8">{t.settings}</h1>
              <div className="space-y-8">

              <SCard isDark={isDark} title={t.modelBackend}>
                <div className="space-y-6">
                  <SRow isDark={isDark} label={t.modelPreset} desc={t.modelBackendDesc}>
                    <div className="relative">
                      <select
                        value={modelPreset}
                        onChange={e => onChangeModelPreset(e.target.value)}
                        className={`appearance-none px-4 py-2 pr-10 rounded-lg text-[14px] font-medium outline-none transition-colors cursor-pointer ${
                          isDark ? 'bg-[#131314] text-[#E3E3E3] border border-[#444746] focus:border-[#A8C7FA]'
                                 : 'bg-white text-[#1F1F1F] border border-[#C4C7C5] focus:border-[#0B57D0]'
                        }`}
                      >
                        {presetOptions.map(opt => (
                          <option key={opt.key} value={opt.key}>{opt.label}</option>
                        ))}
                      </select>
                      <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                        <ChevronDown size={16} className={isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'} />
                      </div>
                    </div>
                  </SRow>

                  {/* 输入框直接显示当前生效值（App 初始化时已用 PRESET_DEFAULTS 填充），不靠 placeholder 冒充 */}
                  <div className="space-y-4">
                    <SField isDark={isDark} label={t.customModelName} type="text"
                      value={customModelName} onChange={e => setCustomModelName(e.target.value)} />
                    <SField isDark={isDark} label={t.customBaseUrl} type="text"
                      value={customBaseUrl} onChange={e => setCustomBaseUrl(e.target.value)} />
	                    <SField isDark={isDark} label={t.customApiKey} type="password"
	                      value={customApiKey} onChange={e => setCustomApiKey(e.target.value)}
	                      placeholder={modelPreset === 'local_vllm' ? 'local-no-auth' : 'sk-...'} />
	                    {modelPreset === 'local_vllm' && (
	                      <div className={`rounded-xl border p-3 space-y-3 ${isDark ? 'border-[#333537] bg-[#131314]' : 'border-[#E0E3E7] bg-white'}`}>
	                        <div className="flex items-center justify-between gap-3">
	                          <span className={`text-[12px] ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>{t.vllmDetectHint}</span>
	                          <button
	                            onClick={handleDetectLocalVllm}
	                            disabled={vllmDiscovering || !bridge.available}
	                            className={`shrink-0 text-[13px] font-medium px-4 py-2 rounded-full transition-colors disabled:opacity-60 ${
	                              isDark ? 'bg-[#2B2C2F] text-[#E3E3E3] hover:bg-[#333537]'
	                                     : 'bg-[#F0F4F9] text-[#1F1F1F] hover:bg-[#E8EAED]'
	                            }`}
	                          >{vllmDiscovering ? t.detectingLocalVllm : t.detectLocalVllm}</button>
	                        </div>
	                        {vllmDiscovery && vllmDiscovery.error && (
	                          <div className={`text-[12px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>
	                            {t.vllmDetectError(vllmDiscovery.error)}
	                          </div>
	                        )}
	                        {vllmDiscovery && !vllmDiscovery.error && (
	                          <div className="space-y-2">
	                            <div className={`text-[12px] ${vllmOnlineCandidates.length ? (isDark ? 'text-[#93D5A6]' : 'text-[#137333]') : (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]')}`}>
	                              {vllmOnlineCandidates.length ? t.vllmDetectFound(vllmOnlineCandidates.length) : t.vllmDetectNone}
	                            </div>
	                            {vllmOnlineCandidates.map(candidate => {
	                              return (
	                                <div key={candidate.base_url} className={`flex items-center justify-between gap-3 rounded-lg px-3 py-2 ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F8FAFD]'}`}>
	                                  <div className="min-w-0">
	                                    <div className="flex items-center gap-2">
	                                      <span className="w-2 h-2 rounded-full bg-[#34A853]"></span>
	                                      <span className={`text-[13px] font-medium truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{candidate.base_url}</span>
	                                      <span className={`text-[11px] uppercase ${isDark ? 'text-[#93D5A6]' : 'text-[#137333]'}`}>{vllmStatusLabel(candidate.status)}</span>
	                                    </div>
	                                    <div className={`mt-1 text-[12px] truncate ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
	                                      {t.vllmDetectedModel}: {candidate.model || '—'} · {t.vllmDetectedContext}: {candidate.max_model_len || '—'}
	                                    </div>
	                                  </div>
	                                  <button
	                                    onClick={() => handleUseVllmCandidate(candidate)}
	                                    className={`shrink-0 text-[12px] font-medium px-3 py-1.5 rounded-full transition-colors ${
	                                      isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
	                                             : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
	                                    }`}
	                                  >{t.useVllmConfig}</button>
	                                </div>
	                              );
	                            })}
	                          </div>
	                        )}
	                      </div>
	                    )}
	                  </div>

                  {modelConfigDirty && (
                    <SActionBar isDark={isDark} message={t.modelDirtyHint}
                      actionLabel={t.confirmAndRestart} onAction={onConfirmModelConfig} />
                  )}
                </div>
              </SCard>

              <SCard isDark={isDark} title={t.searchBackend}>
                <div className="space-y-6">
                  <SRow isDark={isDark} label={t.searchSource} desc={t.searchBackendDesc}>
                    <SSegmented isDark={isDark} value={searchProvider} onChange={setSearchProvider}
                      options={[{ key: 'bing', label: 'Bing' }, { key: 'metaso', label: 'Metaso' }, { key: 'bocha', label: 'Bocha' }, { key: 'baidu', label: 'Baidu' }]} />
                  </SRow>

                  {searchProvider === 'bing' ? (
                    <span className={`text-[13px] block ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
                      {t.searchKeyHintBing}
                    </span>
                  ) : (
                    <div>
                      <SField isDark={isDark} label={t.searchKey} type="password"
                        value={searchApiKey} onChange={e => setSearchApiKey(e.target.value)}
                        placeholder={t.searchKeyPlaceholder} />
                      <span className={`text-[12px] mt-2 block ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
                        {searchProvider === 'metaso' ? t.searchKeyHintMetaso : searchProvider === 'baidu' ? t.searchKeyHintBaidu : t.searchKeyHintBocha}
                      </span>

                      <div className={`mt-3 px-3 py-2 rounded-lg flex items-center justify-between gap-3 ${isDark ? 'bg-[#131314]' : 'bg-white'}`}>
                        <span className={`text-[12px] ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
                          {searchProvider === 'metaso' ? t.searchGetKeyMetasoSteps : searchProvider === 'baidu' ? t.searchGetKeyBaiduSteps : t.searchGetKeyBochaSteps}
                        </span>
                        <button
                          onClick={() => {
                            const url = searchProvider === 'metaso'
                              ? 'https://metaso.cn/search-api/api-keys'
                              : searchProvider === 'baidu'
                              ? 'https://console.bce.baidu.com/iam/#/iam/apikey/list'
                              : 'https://open.bochaai.com/';
                            if (bridge.available) bridge.openExternalUrl(url);
                          }}
                          className={`text-[12px] font-medium px-3 py-1 rounded-full whitespace-nowrap transition-colors ${
                            isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
                                   : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
                          }`}
                        >{t.searchGetKey} ↗</button>
                      </div>
                    </div>
                  )}

                  {searchNeedsRestart && (
                    <SActionBar isDark={isDark} message={t.searchRestartHint}
                      actionLabel={t.confirmAndRestart} onAction={onConfirmSearchConfig} />
                  )}
                </div>
              </SCard>

              <SCard isDark={isDark} title={t.sysPerm}>
                <SRow isDark={isDark} label={t.sudo} desc={t.sudoDesc}>
                  <button
                    onClick={setSuperPerm}
                    className={`w-[52px] h-[32px] rounded-full p-[2px] transition-colors duration-300 relative ${superPerm ? (isDark ? 'bg-[#A8C7FA]' : 'bg-[#0B57D0]') : (isDark ? 'bg-[#444746]' : 'bg-[#747775]')}`}
                  >
                    {/* off 态 thumb 暗色下用浅灰——原深蓝在深灰轨道上几乎不可见 */}
                    <div className={`w-[28px] h-[28px] rounded-full shadow-sm transform transition-transform duration-300 ${superPerm ? (isDark ? 'bg-[#041E49]' : 'bg-white') : (isDark ? 'bg-[#C4C7C5]' : 'bg-white')} ${superPerm ? 'translate-x-[20px]' : 'translate-x-0'}`} />
                  </button>
                </SRow>
              </SCard>

              <SCard isDark={isDark} title={t.appearance}>
                <div className="space-y-8">
                  <SRow isDark={isDark} label={t.lang} desc={t.langDesc}>
                    <SSegmented isDark={isDark} value={language} onChange={setLanguage}
                      options={[{ key: 'zh', label: '中文' }, { key: 'en', label: 'English' }, { key: 'ja', label: '日本語' }]} />
                  </SRow>
                  <SRow isDark={isDark} label={t.theme} desc={t.themeDesc}>
                    <SSegmented isDark={isDark} value={activeTheme} onChange={setActiveTheme}
                      options={[{ key: 'light', label: t.light }, { key: 'dark', label: t.dark }]} />
                  </SRow>
                </div>
              </SCard>

              {/* 版本与更新: 链路 检查 → 下载(进度) → pkexec 安装 → 重启 */}
              <SCard isDark={isDark} title={t.versionUpdate}>
                {(() => {
                  const upd = bs && bs.updateInfo;
                  const checking = !!(bs && bs.updateChecking);
                  const downloading = !!(bs && bs.updateDownloading);
                  const ready = !!(bs && bs.updateReady);
                  const progress = (bs && bs.updateProgress) || 0;
                  const subText = isDark ? 'text-[#C4C7C5]' : 'text-[#444746]';
                  return (
                    <div>
                      <div className="flex items-center justify-between">
                        <div className="pr-8">
                          <span className="text-[16px] block mb-1">
                            {t.curVer} v{(upd && upd.current_version) || '—'}
                          </span>
                          <span className={`text-[14px] leading-relaxed block ${subText}`}>
                            {checking ? t.checking
                              : (bs && bs.updateCheckError === 'latest') ? t.upToDate
                              : (bs && bs.updateCheckError) ? (t.updateCheckFailed + ': ' + bs.updateCheckError)
                              : (upd && upd.available) ? (t.newVersionFound + ': v' + upd.latest_version)
                              : ''}
                          </span>
                        </div>
                        <button
                          onClick={() => bridge.available && !checking && bridge.checkForUpdate()}
                          disabled={checking}
                          className={`text-[12px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${
                            isDark ? 'bg-[#333537] text-[#E3E3E3] hover:bg-[#444746]'
                                   : 'bg-[#E1E5EA] text-[#1F1F1F] hover:bg-[#D3D9E0]'
                          } ${checking ? 'opacity-50' : ''}`}
                        >{t.checkUpdate}</button>
                      </div>

                      {upd && upd.available && (
                        <div className={`mt-5 pt-5 border-t ${isDark ? 'border-[#333537]' : 'border-[#DDE3EA]'}`}>
                          {upd.notes && (
                            <div className="mb-4">
                              <span className={`text-[12px] block mb-1 ${subText}`}>{t.updateNotes}</span>
                              <span className="text-[14px] leading-relaxed whitespace-pre-wrap block">{upd.notes}</span>
                            </div>
                          )}

                          {ready ? (
                            <div className="flex items-center justify-between">
                              <span className="text-[14px]">✅ {t.updateComplete}</span>
                              <button
                                onClick={() => bridge.available && bridge.restartApp()}
                                className={`text-[12px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${
                                  isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
                                         : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
                                }`}
                              >{t.restartNow}</button>
                            </div>
                          ) : downloading ? (
                            <div>
                              <div className="flex items-center justify-between mb-2">
                                <span className={`text-[12px] ${subText}`}>{progress >= 100 ? t.installing : t.downloading}</span>
                                <span className={`text-[12px] ${subText}`}>{progress}%</span>
                              </div>
                              <div className={`h-[6px] rounded-full overflow-hidden ${isDark ? 'bg-[#333537]' : 'bg-[#DDE3EA]'}`}>
                                <div className="h-full rounded-full transition-all duration-200" style={{ width: progress + '%', backgroundColor: '#0B57D0' }} />
                              </div>
                            </div>
                          ) : (
                            <button
                              onClick={() => bridge.available && bridge.downloadAndInstallUpdate()}
                              className={`text-[12px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${
                                isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
                                       : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
                              }`}
                            >{t.downloadInstall} (v{upd.latest_version})</button>
                          )}

                          {bs && bs.updateError && (
                            <span className="text-[13px] mt-3 block text-[#EA4335]">⚠️ {bs.updateError}</span>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })()}
              </SCard>

              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // Chat View (Gemini Centered Style + Messages)
    // ==========================================
    const ChatView = ({ theme, t, bs, prefill, onPrefillConsumed, onOpenEditor }) => {
      const isDark = theme === 'dark';
      const [inputText, setInputText] = useState('');
      const [artifactsOpen, setArtifactsOpen] = useState(false);
      const scrollRef = useRef(null);
      const chatItems = bs ? bs.chatItems : [];
      const busy = bs ? bs.busy : false;
      const hasMessages = chatItems.length > 0;
      const attachments = (bs && bs.attachments) || [];
      const queued = (bs && bs.queued) || []; // 排队待发消息（当前 session 生成中时积压）
      const artifactCount = (bs && bs.artifacts) ? bs.artifacts.length : 0;
      const hasSkill = !!(bs && bs.workflow && bs.workflow.activeSkillName);
      let lastUserId = null;
      for (let i = chatItems.length - 1; i >= 0; i--) { if (chatItems[i].type === 'user') { lastUserId = chatItems[i].id; break; } }

      // 工作流启用时预填输入框
      useEffect(() => {
        if (prefill) { setInputText(prefill); if (onPrefillConsumed) onPrefillConsumed(); }
      }, [prefill]);

      // Auto-scroll：直接滚内部容器到底（绝不动外层窗口，避免内容被顶到看不见/拉不动）
      useEffect(() => {
        const el = scrollRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, [chatItems.length, chatItems[chatItems.length - 1]?.html]);

      function handleSend() {
        // 不再因 busy 拦截:bridge.sendMessage 在生成中会把这句排队(本轮跑完自动发)。
        const hasReady = attachments.some(a => a.status === 'ready');
        if (!inputText.trim() && !hasReady) return;
        if (bridge.available) bridge.sendMessage(inputText.trim());
        setInputText('');
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      }

      function handleCancel() {
        if (bridge.available) bridge.cancelGeneration();
      }

      function handlePaste(e) {
        const items = (e.clipboardData && e.clipboardData.items) || [];
        for (const it of items) {
          if (it.type && it.type.indexOf('image/') === 0) {
            const file = it.getAsFile();
            if (!file) continue;
            e.preventDefault();
            const reader = new FileReader();
            reader.onload = () => {
              const bytes = Array.from(new Uint8Array(reader.result));
              const ext = (file.type.split('/')[1] || 'png');
              if (bridge.available) bridge.addPasteImage(`paste-${Date.now()}.${ext}`, bytes);
            };
            reader.readAsArrayBuffer(file);
          }
        }
      }

      return (
        <div className="flex-1 flex flex-col w-full h-full min-h-0 relative z-10 animate-in fade-in duration-300">
          {artifactsOpen && <ArtifactsPanel bs={bs} theme={theme} t={t} onClose={() => setArtifactsOpen(false)} />}

          {/* Top Header (浮动) */}
          <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-20 pointer-events-none">
            <div className="flex items-center gap-2">
              {/* [plan/yolo 收敛] Plan 模式入口已下线：全局 Yolo 单模式。
                  ModeHeader 组件及 bridge 逻辑保留，取消注释即恢复，待重评是否彻底移除。
                  (品悟开关已彻底移除——v2 评审方案被推翻,等新方案。) */}
              {/* <ModeHeader bs={bs} theme={theme} /> */}
            </div>
            <button
              onClick={() => setArtifactsOpen(true)}
              className={`pointer-events-auto px-4 py-2 rounded-full text-[14px] font-medium flex items-center gap-2 ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3] hover:bg-[#333537]' : 'bg-white text-[#1F1F1F] hover:bg-[#F0F4F9] shadow-sm'}`}>
              <Package size={16} /> {t.artifacts}
              {artifactCount > 0 && <span className={`text-[11px] px-1.5 rounded-full ${isDark ? 'bg-[#A8C7FA] text-[#062E6F]' : 'bg-[#0B57D0] text-white'}`}>{artifactCount}</span>}
            </button>
          </div>


          {/* Main Chat Area */}
          <div ref={scrollRef} className={`flex-1 min-h-0 overflow-y-auto px-4 md:px-20 lg:px-40 pb-40 custom-scrollbar flex flex-col ${hasSkill ? 'pt-3' : 'pt-20'} ${hasMessages ? 'justify-start' : 'items-center justify-center'}`}>

            {!hasMessages && (
              /* Gemini Style Centered Empty State */
              <div className="text-center mb-12 animate-in slide-in-from-bottom-4 duration-500">
                <h1 className={`text-[44px] font-normal mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                  {t.chatGreeting}
                </h1>
              </div>
            )}

            {hasMessages && (
              <div className="max-w-[800px] w-full mx-auto space-y-4">
                {chatItems.map((item) => (
                  <ChatBubble key={item.id} item={item} theme={theme} t={t} onPrefill={(txt) => setInputText(txt)} editable={!busy && item.id === lastUserId} onOpenEditor={onOpenEditor} />
                ))}
                {busy && <ThinkingBubble thinking={bs && bs.thinking} theme={theme} t={t} />}
              </div>
            )}

          </div>

          {/* Floating Input Area */}
          <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-full max-w-[800px] px-4 z-20">
            {/* 排队待发消息 chips（生成中继续输入会积压到这里，本轮跑完自动发） */}
            {queued.length > 0 && (
              <div className="flex flex-col gap-1 mb-2 px-2">
                {queued.map((q) => (
                  <div key={q.id} className={`flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full text-[12px] self-start max-w-full ${isDark ? 'bg-[#2A2B2D] text-[#C4C7C5]' : 'bg-[#EAEDF1] text-[#444746]'}`}>
                    <span className="opacity-60">{t.queuedTag}</span>
                    <span className="max-w-[480px] truncate">{q.displayText}</span>
                    <button onClick={() => bridge.removeQueued(q.id)} title={t.queuedCancel} className={`w-5 h-5 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537]' : 'hover:bg-[#F0F4F9]'}`}>×</button>
                  </div>
                ))}
              </div>
            )}
            {/* 附件 chips */}
            {attachments.length > 0 && (
              <div className="flex flex-wrap gap-2 mb-2 px-2">
                {attachments.map((a) => (
                  <div key={a.id} className={`flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full text-[12px] ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3]' : 'bg-white text-[#1F1F1F] shadow-sm'}`}>
                    <span>📎</span>
                    <span className="max-w-[160px] truncate">{a.basename}</span>
                    <span className={a.status === 'error' ? 'text-[#F28B82]' : a.status === 'parsing' ? 'opacity-60' : 'text-[#93D5A6]'}>
                      {a.status === 'parsing' ? t.attachParsing : a.status === 'error' ? t.attachFailed : '✓'}
                    </span>
                    <button onClick={() => bridge.removeAttachment(a.id)} className={`w-5 h-5 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537]' : 'hover:bg-[#F0F4F9]'}`}>×</button>
                  </div>
                ))}
              </div>
            )}
            <div className={`flex items-center gap-3 p-2 rounded-full shadow-lg ${isDark ? 'bg-[#1E1F20]' : 'bg-white'}`}>

              <button onClick={() => bridge.available && bridge.pickAndAttach()} title={t.attachAdd}
                className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}>
                <Paperclip size={20} />
              </button>

              <input
                type="text"
                placeholder={t.placeholder}
                value={inputText}
                onChange={e => setInputText(e.target.value)}
                onKeyDown={handleKeyDown}
                onPaste={handlePaste}
                className={`flex-1 bg-transparent border-none outline-none text-[16px] py-3 ${isDark ? 'placeholder:text-[#C4C7C5]' : 'placeholder:text-gray-400'}`}
              />

              {busy ? (
                <button
                  onClick={handleCancel}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#F28B82] hover:bg-[#333537]' : 'text-[#C5221F] hover:bg-[#F0F4F9]'}`}
                >
                  <StopCircle size={20} />
                </button>
              ) : (
                <button
                  onClick={handleSend}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}
                >
                  {(inputText.trim() || attachments.some(a => a.status === 'ready')) ? <Send size={18} /> : <Mic size={20} />}
                </button>
              )}
            </div>
            <div className="flex items-center justify-center mt-3">
               <p className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.disclaimer}</p>
            </div>
          </div>

        </div>
      );
    };

    // ==========================================
    // Chat Bubble (message rendering)
    // ==========================================
    const UserBubble = ({ item, theme, editable, t }) => {
      const isDark = theme === 'dark';
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(item.text);
      function commit() { const tx = val.trim(); setEditing(false); if (tx && bridge.available) bridge.editLastTurn(tx); }
      if (editing) {
        return (
          <div className="flex justify-end">
            <div className="max-w-[85%] w-full">
              <textarea autoFocus value={val} onChange={e => setVal(e.target.value)}
                rows={Math.min(6, Math.max(1, val.split('\n').length))}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); } else if (e.key === 'Escape') { setEditing(false); setVal(item.text); } }}
                className={`w-full rounded-[16px] px-4 py-2 text-[15px] outline-none ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`} />
              <div className="flex gap-2 justify-end mt-1">
                <button className={cardBtnCls(isDark)} onClick={() => { setEditing(false); setVal(item.text); }}>{t.cpCancel}</button>
                <button className={cardBtnCls(isDark, 'primary')} onClick={commit}>{t.resend}</button>
              </div>
            </div>
          </div>
        );
      }
      return (
        <div className="flex justify-end group">
          <div className="flex items-center gap-2 max-w-[85%]">
            {editable && <button title={t.editResend} onClick={() => { setVal(item.text); setEditing(true); }} className={`opacity-0 group-hover:opacity-100 text-[13px] shrink-0 ${isDark ? 'text-[#8E8E8E] hover:text-[#C4C7C5]' : 'text-[#9AA0A6] hover:text-[#444746]'}`}>✏️</button>}
            <div className={`px-5 py-3 rounded-[20px] text-[15px] leading-relaxed whitespace-pre-wrap ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`}>{item.text}</div>
          </div>
        </div>
      );
    };

    // 思考指示器：Braille 转圈 + 思考中/调用工具 + 计时（每阶段切换重置）
    const BRAILLE = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
    const ThinkingBubble = ({ thinking, theme, t }) => {
      const isDark = theme === 'dark';
      const [frame, setFrame] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const phase = thinking ? thinking.phase : 'thinking';
      const toolName = thinking ? thinking.toolName : '';
      const startedAt = (thinking && thinking.startedAt) || Date.now();
      useEffect(() => {
        setFrame(0); setElapsed(0);
        const id = setInterval(() => {
          setFrame(f => (f + 1) % BRAILLE.length);
          setElapsed(Math.floor((Date.now() - startedAt) / 1000));
        }, 100);
        return () => clearInterval(id);
      }, [startedAt, phase, toolName]);
      let text;
      if (phase === 'tool' && toolName) {
        text = t.thinkingCall(toolName, elapsed);
      } else {
        const suffix = elapsed >= 120 ? ` · ${t.hintSlow120}` : elapsed >= 30 ? ` · ${t.hintSlow30}` : '';
        text = `${t.thinkingLabel}... ${elapsed}s${suffix}`;
      }
      return (
        <div className="flex justify-start">
          <div className={`text-[13px] font-mono px-3 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#A8C7FA]' : 'bg-[#F0F4F9] text-[#0B57D0]'}`}>
            {BRAILLE[frame]} {text}
          </div>
        </div>
      );
    };

    // ③ 卡牌制造专家: 从助手消息渲染后的 html 里抠出 ```persona-card 草稿块 → 解析成卡。
    function htmlUnescape(s) {
      return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
    }
    function asDraft(d) {
      if (!d || typeof d !== 'object' || !d.name || !d.body) return null;
      return { name: d.name, dept: d.dept || 'specialized', emoji: d.emoji || '🃏', color: d.color || '', description: d.description || '', body: d.body };
    }
    // 扫所有 ```代码块,任何能解析成「含 name+body 的 JSON」的就当卡牌草稿。
    // 不强求 ```persona-card 标签 —— 小模型常打 ```json 或不打标签,放宽识别更鲁棒。
    // 形状校验(name+body)避免把别的 JSON 误判成草稿。明确 persona-card 标签的优先。
    // 返回 { draft, html }:html 是把那段原始 JSON 块抹掉后的版本(用户只看友好草稿卡,不看机器载荷)。
    function parsePersonaDraft(html) {
      if (!html || html.indexOf('{') < 0) return { draft: null, html: html };
      var re = /<pre[^>]*>\s*<code([^>]*)>([\s\S]*?)<\/code>\s*<\/pre>/g, m, chosen = null, chosenDraft = null;
      while ((m = re.exec(html))) {
        var raw = htmlUnescape(m[2]).trim();
        if (raw.charAt(0) !== '{') continue;
        try {
          var draft = asDraft(JSON.parse(raw));
          if (!draft) continue;
          if (/persona-card/.test(m[1])) { chosen = m[0]; chosenDraft = draft; break; } // 明确标签优先
          if (!chosenDraft) { chosen = m[0]; chosenDraft = draft; }
        } catch (e) { /* 非 JSON 块,跳过 */ }
      }
      if (!chosenDraft) return { draft: null, html: html };
      return { draft: chosenDraft, html: html.replace(chosen, '') };
    }
    // 流式中: JSON 还没闭合无法解析,把正在生成的卡牌代码块折叠成占位,避免原始 JSON 一直刷屏。
    function hideStreamingDraft(html, label) {
      if (!html) return html;
      var m = /<pre[^>]*>\s*<code[^>]*persona-card[\s\S]*$/i.exec(html); // persona-card 标签块(到末尾)
      if (!m) m = /<pre[^>]*>\s*<code[^>]*>\s*\{[\s\S]*?(?:name|&quot;name)[\s\S]*$/i.exec(html); // 兜底: 以 { 开头且含 name 的块
      if (!m) return html;
      return html.slice(0, m.index) + '<div style="margin-top:.5em;opacity:.7;font-size:13px">' + (label || '🃏 正在设计卡牌…') + '</div>';
    }

    const ChatBubble = ({ item, theme, onPrefill, editable, onOpenEditor, t }) => {
      const isDark = theme === 'dark';

      if (item.type === 'artifact_card') return <ArtifactCard item={item} theme={theme} t={t} />;
      if (item.type === 'plan_card') return <PlanCard item={item} theme={theme} t={t} onPrefill={onPrefill} />;
      if (item.type === 'plan_stuck' || item.type === 'execution_stuck') return <PlanStuckCard item={item} theme={theme} t={t} />;
      if (item.type === 'plan_text_fallback') return <PlanFallbackCard item={item} theme={theme} t={t} />;
      if (item.type === 'careful_blocked') return <CarefulBlockedCard item={item} theme={theme} t={t} />;
      if (item.type === 'user_input') return <UserInputCard item={item} theme={theme} t={t} />;
      if (item.type === 'user') return <UserBubble item={item} theme={theme} editable={editable} t={t} />;

      if (item.type === 'assistant') {
        if (item.streaming && !item.html) return null; // 空流式气泡交给 ThinkingBubble 表示
        const html = item.html || '';
        const pd = item.streaming ? { draft: null, html: hideStreamingDraft(html, t && t.cpDesigning) } : parsePersonaDraft(html);
        // 草稿是否已存入(按名字在已加载的卡池里找同名自制卡 → 派生"已存入",免单独持久化)
        const draftSaved = pd.draft && bridge.available && bridge.getPersonas
          && bridge.getPersonas().some(function(c){ return c && c.source === 'user' && c.name === pd.draft.name; });
        return (
          <div className="flex justify-start">
            <div className={`max-w-[95%] ${isDark ? 'dark-code' : 'light-code'}`}>
              <div
                className={`msg-md text-[15px] leading-relaxed ${item.streaming ? 'streaming-cursor' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}
                dangerouslySetInnerHTML={{ __html: pd.html || '' }}
              />
              {pd.draft ? (
                <div className="mt-2 rounded-xl border p-3 flex items-center gap-3 max-w-[460px]" style={{ background: isDark?'rgba(124,58,237,.10)':'rgba(124,58,237,.06)', borderColor:'rgba(149,128,255,.45)' }}>
                  <div className="w-9 h-9 rounded-lg flex items-center justify-center text-[18px] shrink-0" style={{ background:'rgba(149,128,255,.2)' }}>{pd.draft.emoji}</div>
                  <div className="min-w-0 flex-1">
                    <div className={`text-[13px] font-semibold ${isDark?'text-[#E3E3E3]':'text-[#1F1F1F]'}`}>🃏 {t.cpDraftLabel}: {pd.draft.name}</div>
                    <div className="text-[11px] truncate" style={{ color: isDark?'#9aa0a6':'#5f6368' }}>{pd.draft.description || deptLabelFor(t, pd.draft.dept)}</div>
                  </div>
                  {draftSaved
                    ? <span className="shrink-0 px-3 py-1.5 rounded-lg text-[12px] font-semibold" style={{ background:'rgba(52,168,83,.16)', color:'#34A853' }} title={t.cpDraftSavedTitle}>{t.cpDraftSaved}</span>
                    : <button onClick={()=> onOpenEditor && onOpenEditor(pd.draft)} className="shrink-0 px-3 py-1.5 rounded-lg text-[12px] font-semibold text-white" style={{ background:'#7C3AED' }} title={t.cpDraftViewTitle}>{t.cpDraftView}</button>}
                </div>
              ) : null}
              {item.time && !item.streaming && (
                <div className={`text-[11px] mt-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{item.time}</div>
              )}
            </div>
          </div>
        );
      }

      if (item.type === 'tool') {
        return <ToolCard item={item} theme={theme} t={t} />;
      }

      if (item.type === 'persona_equip') {
        const c = item.card || {};
        const tc = (typeof deptColor !== 'undefined' ? deptColor(c.dept) : '#ffae1e');
        const deptLabel = deptLabelFor(t, c.dept);
        const cd = personaText(c, t);
        return (
          <div className="flex flex-col gap-1">
            <div className="text-[12px] font-semibold" style={{ color: isDark ? '#9aa0a6' : '#5f6368' }}>{t.cpEquipBubbleSys}</div>
            <div className="rounded-xl border p-4 max-w-[640px]" style={{ background: isDark ? 'rgba(255,180,30,.06)' : 'rgba(255,180,30,.08)', borderColor: 'rgba(255,180,30,.35)' }}>
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-lg flex items-center justify-center text-[18px] shrink-0" style={{ background: tc + '22' }}>{c.emoji}</div>
                <div className={`text-[14px] font-semibold ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.cpEquipBubbleTitle(cd.name)}</div>
              </div>
              <div className="text-[12.5px] mt-2 space-y-0.5" style={{ color: isDark ? '#C4C7C5' : '#3c4043' }}>
                <div>{t.cpDept}: <span style={{ color: tc, fontWeight: 700 }}>{deptLabel}</span></div>
                <div>{t.cpDescLabel}: {cd.description}</div>
              </div>
              <div className="text-[11.5px] mt-2" style={{ color: isDark ? '#80868b' : '#757575' }}>
                {t.cpEquipBubbleNote}
              </div>
            </div>
          </div>
        );
      }
      if (item.type === 'system') {
        return (
          <div className="flex justify-center">
            <div className={`text-[13px] px-4 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#8E8E8E]' : 'bg-[#F0F4F9] text-[#757575]'}`}>
              {item.text}
            </div>
          </div>
        );
      }

      return null;
    };

    // ==========================================
    // Artifact Card — present_artifact 成品卡（点击打开预览）
    // ==========================================
    const _ARTIFACT_ICON = { html: '🌐', markdown: '📄', image: '🖼️', other: '📎' };
    const _artifactKind = (p) => {
      const ext = (String(p || '').split('.').pop() || '').toLowerCase();
      if (ext === 'html' || ext === 'htm') return 'html';
      if (ext === 'md' || ext === 'markdown') return 'markdown';
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'].indexOf(ext) >= 0) return 'image';
      return 'other';
    };
    const ArtifactCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const path = item.path || '';
      const kind = _artifactKind(path);
      const icon = _ARTIFACT_ICON[kind] || '📎';
      const basename = (String(path).split('/').pop()) || '';
      const open = () => { if (bridge.available && path) bridge.openArtifactExternal(path); };
      return (
        <div className="flex justify-start">
          <div onClick={open}
            className={`max-w-[95%] w-full rounded-[16px] border p-3 cursor-pointer transition-all ${isDark ? 'bg-[#7C3AED]/10 border-[#D0BCFF]/30 hover:border-[#D0BCFF]/60' : 'bg-[#7C3AED]/5 border-[#7C3AED]/20 hover:border-[#7C3AED]/50'}`}>
            <div className="flex items-start gap-3">
              <div className="text-[26px] leading-none flex-shrink-0">{icon}</div>
              <div className="flex-1 min-w-0">
                <div className={`text-[11px] font-mono uppercase tracking-wider mb-0.5 ${isDark ? 'text-[#D0BCFF]' : 'text-[#7C3AED]'}`}>{t.artifactLabel} · {kind}</div>
                <div className={`text-[15px] font-semibold truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{item.title || t.artifactLabel}</div>
                {item.description && (
                  <div className={`text-[13px] mt-0.5 line-clamp-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.description}</div>
                )}
                <div className={`flex items-center justify-between mt-2 pt-2 border-t ${isDark ? 'border-[#D0BCFF]/15' : 'border-[#7C3AED]/15'}`}>
                  <span className={`text-[11px] font-mono truncate ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`} title={basename}>{basename}</span>
                  <span className={`text-[12px] flex-shrink-0 ml-2 ${isDark ? 'text-[#D0BCFF]' : 'text-[#7C3AED]'}`}>{t.clickToOpen}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // Tool Card
    // ==========================================
    // 弱化类工具：渲染成单行灰条（看得见但不抢眼）；其余有产出类保留醒目卡片。
    // 含 ①只读探查 ②待办/清单的细碎进度操作（易刷屏、对用户价值低）。
    // 批量出方案的 checklist_write/todo_write/update_plan 不在此列（它们走方案卡）。
    const QUIET_TOOLS = new Set([
      'read_file', 'list_dir', 'grep_files', 'file_search', 'glob',
      'checklist_update', 'todo_update', 'checklist_add', 'todo_add', 'checklist_list', 'todo_list',
    ]);

    const toolBasename = (p) => {
      if (typeof p !== 'string' || !p) return '';
      const parts = p.replace(/\/+$/, '').split('/');
      return parts[parts.length - 1] || p;
    };

    // A 档摘要：只从结构化 args 提“动作对象”（文件名/命令/模式），稳且免费，不 parse output。
    const toolSummary = (name, args, t) => {
      if (!args || typeof args !== 'object') return '';
      switch (name) {
        case 'read_file': {
          const base = toolBasename(args.path);
          if (args.start_line || args.max_lines) {
            const s = args.start_line || 1;
            return base + ' · ' + t.tsLine + ' ' + s + (args.max_lines ? '-' + (s + args.max_lines - 1) : '+');
          }
          return base;
        }
        case 'write_file':
        case 'append_file':
        case 'edit_file':
          return toolBasename(args.path);
        case 'list_dir':
          return toolBasename(args.path || '.') || '.';
        case 'grep_files':
          return args.pattern ? '"' + args.pattern + '"' : '';
        case 'file_search':
          return args.query ? '"' + args.query + '"' : '';
        case 'exec_shell':
          return typeof args.command === 'string' ? args.command.replace(/\s+/g, ' ').trim() : '';
        case 'checklist_update':
        case 'todo_update':
          return args.status === 'completed' ? t.tsDone
            : args.status === 'in_progress' ? t.tsInProgress
            : args.status === 'pending' ? t.tsPending : '';
        default:
          return '';
      }
    };

    // 底座对超 12K 的工具输出会压成 [TOOL_OUTPUT_RECEIPT]（content-addressed 溢出），
    // 直接展示一堆 sha/handle 是噪音 —— 翻译成人话 + 保留 preview 摘要。
    const isReceipt = (text) => typeof text === 'string' && text.trim().startsWith('[TOOL_OUTPUT_RECEIPT]');
    const parseReceipt = (text) => {
      const fields = {};
      String(text).split('\n').forEach((line) => {
        const m = line.match(/^\s*([a-z_]+):\s*(.*)$/);
        if (m) fields[m[1]] = m[2];
      });
      return fields;
    };
    const ReceiptBlock = ({ text, isDark, t }) => {
      const f = parseReceipt(text);
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const body = isDark ? 'text-[#C4C7C5]' : 'text-[#444746]';
      // 输出超大被底座存档、只回传 preview。存档/压缩机制对用户无意义 ——
      // 只展示内容开头 + 一句不带术语的诚实提示（避免误以为是完整输出）。
      const pv = (f.preview && f.preview !== '(none)') ? f.preview.replace(/\\n/g, '\n') : '';
      const pvIsDiff = pv && (/(^|\n)@@/.test(pv) || (pv.indexOf('@@') >= 0 && /(^|\n)[+-]/.test(pv)));
      const note = <div className={`mt-0.5 text-[11px] ${muted}`}>{t.receiptNote}</div>;
      if (pvIsDiff) return (<div><DiffView text={pv} isDark={isDark} />{note}</div>);
      return (
        <div>
          <div className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap' }}>{pv || t.receiptEmpty}</div>
          {pv ? note : null}
        </div>
      );
    };

    // ── 每工具定制结果视图（仿 Claude Code）：解析失败一律 fallback 纯文本，永不崩 ──
    const tryParseJson = (text) => { try { return JSON.parse(text); } catch (_) { return null; } };
    // checklist/plan 输出是「摘要行\n{json}」，切首个换行后 parse
    const tryTailJson = (text) => {
      if (typeof text !== 'string') return null;
      const i = text.indexOf('\n');
      if (i < 0) return null;
      try { return JSON.parse(text.slice(i + 1)); } catch (_) { return null; }
    };
    const looksDiff = (text) => typeof text === 'string'
      && /(^|\n)--- /.test(text) && /(^|\n)\+\+\+ /.test(text);
    const outBox = (isDark) => `tool-card-output custom-scrollbar rounded-lg p-2 text-[12px] ${isDark ? 'bg-[#131314] text-[#C4C7C5]' : 'bg-white text-[#444746]'}`;
    const TODO_SYM = { completed: '☑', in_progress: '◐', pending: '☐' };
    const TODO_TOOLS = ['checklist_write', 'checklist_update', 'checklist_add', 'checklist_list', 'todo_write', 'todo_update', 'todo_add', 'todo_list', 'update_plan'];

    const OutputPre = ({ text, isDark }) => (
      <pre className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap' }}>
        {typeof text === 'string' ? text : JSON.stringify(text, null, 2)}
      </pre>
    );
    const OutputError = ({ text, isDark }) => (
      <pre className={`tool-card-output custom-scrollbar rounded-lg p-2 text-[12px] ${isDark ? 'bg-[#131314] text-[#F28B82]' : 'bg-white text-[#C5221F]'}`} style={{ whiteSpace: 'pre-wrap' }}>
        {typeof text === 'string' ? text : JSON.stringify(text, null, 2)}
      </pre>
    );
    const ListDirView = ({ items, isDark, t }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const sorted = items.slice().sort((a, b) => ((b.is_dir ? 1 : 0) - (a.is_dir ? 1 : 0)) || String(a.name).localeCompare(String(b.name)));
      return (
        <div className={outBox(isDark)} style={{ fontFamily: 'monospace' }}>
          <div className={`mb-1 ${muted}`} style={{ fontFamily: 'inherit' }}>{t.listDirCount(items.length)}</div>
          {sorted.map((it, i) => <div key={i}>{it.is_dir ? '📁' : '📄'} {it.name}{it.is_dir ? '/' : ''}</div>)}
        </div>
      );
    };
    const GrepView = ({ data, isDark, t }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const matches = Array.isArray(data.matches) ? data.matches : [];
      return (
        <div className={outBox(isDark)}>
          <div className={`mb-1 ${muted}`}>
            {t.grepHits(data.total_matches != null ? data.total_matches : matches.length)}
            {data.files_searched != null ? t.grepFiles(data.files_searched) : ''}
            {data.truncated ? t.grepTruncated : ''}
          </div>
          {matches.map((m, i) => (
            <div key={i} className="mt-1">
              <span className={muted}>{m.file}:{m.line_number}</span>
              <pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'monospace' }}>{m.line}</pre>
            </div>
          ))}
        </div>
      );
    };
    const DiffView = ({ text, isDark }) => {
      const lines = String(text).split('\n');
      const add = isDark ? 'text-[#93D5A6]' : 'text-[#137333]';
      const del = isDark ? 'text-[#F28B82]' : 'text-[#C5221F]';
      const hunk = isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]';
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const color = (l) => /^(\+\+\+|---)/.test(l) ? muted : l.startsWith('+') ? add : l.startsWith('-') ? del : l.startsWith('@@') ? hunk : '';
      return (
        <pre className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap', fontFamily: 'monospace' }}>
          {lines.map((l, i) => <div key={i} className={color(l)}>{l || ' '}</div>)}
        </pre>
      );
    };
    const ShellView = ({ data, isDark, t }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const del = isDark ? 'text-[#F28B82]' : 'text-[#C5221F]';
      return (
        <div className={outBox(isDark)}>
          <div className={`mb-1 ${muted}`}>
            {data.status || ''}{data.exit_code != null ? ` · exit ${data.exit_code}` : ''}
            {data.duration_ms != null ? ` · ${data.duration_ms}ms` : ''}
            {data.stdout_truncated ? t.shellStdoutTrunc : ''}
          </div>
          {data.stdout != null && data.stdout !== '' && <pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'monospace' }}>{data.stdout}</pre>}
          {data.stderr ? <pre className={del} style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'monospace' }}>{data.stderr}</pre> : null}
        </div>
      );
    };
    // exec_shell 的 content 其实是纯 stdout 文本（结构化字段在 metadata，前端没拿）→ 给终端样式
    const ShellTextView = ({ cmd, text, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      return (
        <div className={outBox(isDark)} style={{ fontFamily: 'monospace' }}>
          {cmd && <div className={muted} style={{ whiteSpace: 'pre-wrap' }}>$ {cmd}</div>}
          <pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'inherit' }}>{typeof text === 'string' ? text : JSON.stringify(text)}</pre>
        </div>
      );
    };
    const TodoView = ({ snap, isDark, t }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const items = Array.isArray(snap.items) ? snap.items : [];
      return (
        <div className={outBox(isDark)}>
          {snap.completion_pct != null && <div className={`mb-1 ${muted}`}>{t.todoProgress(snap.completion_pct)}</div>}
          {snap.explanation && <div className="mb-1">{snap.explanation}</div>}
          {items.map((it, i) => (
            <div key={i} className={it.status === 'completed' ? muted : ''}>
              <span className={it.status === 'in_progress' ? (isDark ? 'text-[#FDD663]' : 'text-[#E37400]') : ''}>{TODO_SYM[it.status] || '☐'}</span> {it.content || it.step || ''}
            </div>
          ))}
        </div>
      );
    };
    // 输出渲染分发：失败→红字；大输出→receipt；高频工具→定制视图；其余→纯文本
    const ToolOutput = ({ item, isDark, t }) => {
      const out = item.output;
      if (item.success === false) return <OutputError text={out} isDark={isDark} />;
      if (isReceipt(out)) return <ReceiptBlock text={out} isDark={isDark} t={t} />;
      if (item.name === 'list_dir') { const v = tryParseJson(out); if (Array.isArray(v)) return <ListDirView items={v} isDark={isDark} t={t} />; }
      else if (item.name === 'grep_files') { const v = tryParseJson(out); if (v && Array.isArray(v.matches)) return <GrepView data={v} isDark={isDark} t={t} />; }
      else if (item.name === 'exec_shell') {
        const v = tryParseJson(out);
        if (v && (v.stdout != null || v.exit_code != null || v.status)) return <ShellView data={v} isDark={isDark} t={t} />;
        return <ShellTextView cmd={item.args && item.args.command} text={out} isDark={isDark} />;
      }
      else if (item.name === 'edit_file' || item.name === 'write_file') { if (looksDiff(out)) return <DiffView text={out} isDark={isDark} />; }
      else if (item.name === 'append_file') {
        const m = String(out).match(/appended (\d+) bytes[\s\S]*?\((\d+) -> (\d+) bytes\)/i);
        if (m) return <div className={outBox(isDark)}>{t.appendBytes(/^Created/i.test(out), m[1], m[2], m[3])}</div>;
      }
      else if (TODO_TOOLS.indexOf(item.name) >= 0) { const v = tryTailJson(out); if (v && Array.isArray(v.items)) return <TodoView snap={v} isDark={isDark} t={t} />; }
      return <OutputPre text={out} isDark={isDark} />;
    };

    const ToolCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const [expanded, setExpanded] = useState(false);
      const isRunning = item.state === 'running';
      const isDone = item.state === 'done';
      const isFailed = item.state === 'failed';
      const quiet = QUIET_TOOLS.has(item.name);
      const summary = toolSummary(item.name, item.args, t);

      const statusColor = isRunning
        ? (isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]')
        : isDone
          ? (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')
          : (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]');

      const statusText = isRunning ? t.toolRunning : isDone ? t.toolDone : t.toolFailed;
      const mutedColor = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';

      const detail = expanded ? (
        <div className={`px-4 pb-3 border-t ${isDark ? 'border-white/5' : 'border-black/5'}`}>
          {item.output != null
            ? <div className="mt-2"><ToolOutput item={item} isDark={isDark} t={t} /></div>
            : null}
        </div>
      ) : null;

      // 弱化类：单行灰条。完成态低调（图标灰），运行/失败态保留状态色以便察觉。
      if (quiet) {
        const iconColor = isDone ? mutedColor : statusColor;
        return (
          <div className={expanded ? `rounded-[12px] overflow-hidden border ${isDark ? 'border-white/5' : 'border-black/5'}` : ''}>
            <div
              className={`flex items-center gap-2 px-2 py-1 rounded-[8px] cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
              onClick={() => setExpanded(!expanded)}
            >
              <Wrench size={12} className={iconColor} />
              <span className={`text-[12px] ${mutedColor}`}>{item.name}</span>
              {summary
                ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
                : <span className="flex-1" />}
              {isRunning && <span className={`text-[11px] ${statusColor}`}>{t.toolRunning}</span>}
              {isFailed && <span className={`text-[11px] ${statusColor}`}>{t.toolFailed}</span>}
              <ChevronDown size={12} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${mutedColor}`} />
            </div>
            {detail}
          </div>
        );
      }

      // 有产出类：保留醒目卡片，标题行带摘要。
      return (
        <div className={`rounded-[16px] overflow-hidden border ${isDark ? 'bg-[#1E1F20] border-white/5' : 'bg-[#F0F4F9] border-black/5'}`}>
          <div
            className={`flex items-center gap-3 px-4 py-3 cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
            onClick={() => setExpanded(!expanded)}
          >
            <Wrench size={14} className={statusColor} />
            <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
              {item.name}
            </span>
            {summary
              ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
              : <span className="flex-1" />}
            <span className={`text-[12px] ${statusColor}`}>{statusText}</span>
            <ChevronDown size={14} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`} />
          </div>
          {detail}
        </div>
      );
    };

    // ==========================================
    // Plan / 待办 步骤渲染
    // ==========================================
    const STEP_SYM = { completed: '●', in_progress: '◎', pending: '○' };
    const PlanLayer = ({ label, explanation, items, field, isDark }) => {
      if (!items || items.length === 0) return null;
      return (
        <section className="mb-2">
          <div className={`text-[12px] font-semibold mb-1 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{label}</div>
          {explanation && <p className={`text-[13px] mb-1.5 leading-relaxed ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{explanation}</p>}
          <ol className="space-y-1">
