            <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.pinvouAcceptOverride(item.id, item.planMarkdown, item.report)}>✅ 确认继续执行</button>
            <button className={cardBtnCls(isDark)} onClick={() => bridge.pinvouRevisePlan(item.id, item.planMarkdown, item.report)}>↻ 让 AI 改方案</button>
            <button className={cardBtnCls(isDark)} onClick={() => setCommenting(true)}>⊕ 我加一句</button>
          </div>
        </div>
      );
    };

    // ==========================================
    // ArtifactsPanel — 产物面板（右侧抽屉 + 预览）
    // ==========================================
    const ARTIFACT_ICONS = {
      md: '📄', markdown: '📄', html: '🌐', htm: '🌐',
      png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
      pdf: '📕', csv: '📊', xlsx: '📊', json: '🔢', yaml: '🔢', yml: '🔢', txt: '📝',
    };
    const artifactIcon = (name) => ARTIFACT_ICONS[(name.split('.').pop() || '').toLowerCase()] || '📎';

    const ArtifactsPanel = ({ bs, theme, t, onClose }) => {
      const isDark = theme === 'dark';
      const artifacts = (bs && bs.artifacts) || [];
      const [sel, setSel] = useState(null);
      const [pv, setPv] = useState({ loading: false });

      async function preview(a) {
        setSel(a.path);
        setPv({ loading: true });
        try {
          const info = await bridge.artifactInfo(a.path);
          if (!info || !info.exists) { setPv({ loading: false, missing: true }); return; }
          if (info.kind === 'md' || info.kind === 'html' || info.kind === 'text') {
            const text = await bridge.readArtifactText(a.path);
            setPv({ loading: false, kind: info.kind, text });
          } else {
            setPv({ loading: false, kind: info.kind || 'other' });
          }
        } catch (e) { setPv({ loading: false, error: String(e) }); }
      }

      return (
        <div className="absolute inset-0 z-30 flex justify-end pointer-events-auto">
          <div className="absolute inset-0 bg-black/40" onClick={onClose}></div>
          <div className={`relative w-[680px] max-w-[88vw] h-full flex flex-col shadow-2xl ${isDark ? 'bg-[#1E1F20]' : 'bg-white'} animate-in slide-in-from-right duration-200`}>
            <div className={`flex items-center justify-between px-4 py-3 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <span className={`text-[15px] font-medium flex items-center gap-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}><Package size={16} /> {t.artifacts}</span>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>
            <div className="flex-1 flex min-h-0">
              {/* list */}
              <div className={`w-[240px] shrink-0 overflow-y-auto custom-scrollbar border-r ${isDark ? 'border-white/10' : 'border-black/10'}`}>
                {artifacts.length === 0 ? (
                  <div className={`p-4 text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>暂无产物</div>
                ) : artifacts.map((a) => (
                  <div key={a.path} onClick={() => preview(a)}
                    className={`group flex items-center gap-2 px-3 py-2.5 cursor-pointer text-[13px]
                      ${sel === a.path ? (isDark ? 'bg-[#333537]' : 'bg-[#E8EDF2]') : (isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#F0F4F9]')}`}>
                    <span>{artifactIcon(a.basename)}</span>
                    <span className={`flex-1 truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`} title={a.path}>{a.basename}</span>
                    <button title="打开所在目录" onClick={(e) => { e.stopPropagation(); bridge.openContainingFolder(a.path); }} className="opacity-0 group-hover:opacity-100 text-[13px]">📂</button>
                    <button title="外部打开" onClick={(e) => { e.stopPropagation(); bridge.openArtifactExternal(a.path); }} className="opacity-0 group-hover:opacity-100 text-[13px]">↗</button>
                  </div>
                ))}
              </div>
              {/* preview */}
              <div className="flex-1 overflow-y-auto custom-scrollbar p-4 min-w-0">
                {!sel ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>选择左侧产物预览</div>
                ) : pv.loading ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载中...</div>
                ) : pv.missing ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>文件不存在或已被删除</div>
                ) : pv.error ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>读取失败: {pv.error}</div>
                ) : pv.kind === 'md' ? (
                  <div className={`msg-md text-[14px] leading-relaxed ${isDark ? 'dark-code text-[#E3E3E3]' : 'light-code text-[#1F1F1F]'}`} dangerouslySetInnerHTML={{ __html: bridge.renderMarkdown(pv.text || '') }} />
                ) : pv.kind === 'html' ? (
                  <iframe sandbox="allow-same-origin allow-scripts" className="w-full h-full min-h-[480px] rounded-lg bg-white"
                    srcDoc={"<script>document.addEventListener('contextmenu',function(e){e.preventDefault();})<\/script>" + (pv.text || '')} />
                ) : pv.kind === 'text' ? (
                  <pre className={`text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.text}</pre>
                ) : (
                  <div>
                    <p className={`text-[13px] mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.kind === 'image' ? '图片预览暂不支持嵌入' : '此类型暂不支持预览'}</p>
                    <button onClick={() => bridge.openArtifactExternal(sel)} className={cardBtnCls(isDark, 'primary')}>↗ 外部打开</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 工作流：PhaseChips / WorkflowView / SkillCard / DemoModal
    // ==========================================
    const convertFileSrc = (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.convertFileSrc)
      ? window.__TAURI__.core.convertFileSrc
      : ((p) => p);

    // 聊天室顶部 phase pipeline（仅当前 session 绑定了 skill 时显示）
    const PhaseChips = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const wf = (bs && bs.workflow) || {};
      if (!wf.activeSkillName || !wf.phases || !wf.phases.length) return null;
      const reached = new Set(wf.reachedPhaseIds || []);
      const total = wf.phases.length;
      const curIdx = wf.phases.findIndex(p => p.id === wf.currentPhaseId);
      const cur = curIdx >= 0 ? wf.phases[curIdx] : null;
      return (
        <div className={`rounded-xl px-3 py-2 ${isDark ? 'bg-[#1E1F20]/90' : 'bg-[#F0F4F9]'}`}>
          {/* 头部：skill 名 + 当前阶段标题 */}
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <span className={`flex items-center gap-1 text-[12px] font-medium px-2 py-0.5 rounded-full ${isDark ? 'bg-[#0B57D0]/30 text-[#A8C7FA]' : 'bg-[#0B57D0]/10 text-[#0B57D0]'}`}>
              🧭 {wf.activeSkillName}
              <button title="退出工作流" onClick={() => bridge.deactivateSkill()} className="ml-1 hover:text-[#F28B82]">✕</button>
            </span>
            {cur && (
              <span className={`text-[12px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>
                当前 {curIdx + 1}/{total}：<span className="font-medium">{cur.title}</span>{cur.loop ? ' ↻' : ''}
              </span>
            )}
          </div>
          {/* 单行横向滚动：每个 phase 显示 编号 + 标题 */}
          <div className="flex items-center gap-1 overflow-x-auto custom-scrollbar pb-1">
            {wf.phases.map((p, i) => {
              const isCur = p.id === wf.currentPhaseId;
              const done = reached.has(p.id) && !isCur;
              const cls = isCur
                ? (isDark ? 'bg-[#A8C7FA] text-[#062E6F]' : 'bg-[#0B57D0] text-white')
                : done
                  ? (isDark ? 'bg-[#1E3A2A] text-[#93D5A6]' : 'bg-[#E6F4EA] text-[#137333]')
                  : (isDark ? 'bg-[#282A2C] text-[#9AA0A6]' : 'bg-white text-[#5F6368]');
              return (
                <div key={p.id} className="flex items-center shrink-0">
                  {i > 0 && <span className={`mx-0.5 ${isDark ? 'text-[#5F6368]' : 'text-[#BDC1C6]'}`}>›</span>}
                  <div title={p.id + ' · ' + p.title} className={`flex items-center gap-1 px-2 py-1 rounded-full ${cls}`}>
                    {isCur ? <span className="text-[10px]">▶</span> : done ? <span className="text-[10px]">✓</span> : null}
                    <span className="font-mono text-[10px] opacity-70">{p.id}</span>
                    <span className="text-[12px] whitespace-nowrap">{p.title}{p.loop ? ' ↻' : ''}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const SkillCard = ({ s, theme, active, onActivate }) => {
      const isDark = theme === 'dark';
      const phasesCount = (s.phases && s.phases.length) || 0;
      const hasDemo = s.demo && (s.demo.has_file || s.demo.has_preview);
      return (
        <div className={`flex flex-col rounded-[16px] border p-4 ${isDark ? 'bg-[#1E1F20] border-white/10 hover:border-white/20' : 'bg-white border-black/10 hover:shadow-md'} transition-all`}>
          <div className="flex items-start justify-between gap-2 mb-1">
            <h3 className={`text-[14px] font-semibold ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{s.name}</h3>
            <span className={`text-[11px] px-1.5 py-0.5 rounded shrink-0 ${isDark ? 'bg-[#333537] text-[#C4C7C5]' : 'bg-[#F0F4F9] text-[#444746]'}`}>{s.source}</span>
          </div>
          <p className={`text-[12px] leading-relaxed mb-2 line-clamp-3 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{(s.description || '').slice(0, 220)}</p>
          {phasesCount > 0 ? (
            <div className={`text-[12px] font-mono mb-2 ${isDark ? 'text-[#8E8E8E]' : 'text-[#5F6368]'}`}>
              {phasesCount} 个 phase · {s.phases.slice(0, 8).map(p => p.id + (p.loop ? '↻' : '')).join(' → ')}{phasesCount > 8 ? ' → …' : ''}
            </div>
          ) : (
            <div className={`text-[12px] mb-2 ${isDark ? 'text-[#5F6368]' : 'text-[#9AA0A6]'}`}>普通 skill (未声明 phases)</div>
          )}
          {s.demo && s.demo.duration && <div className={`text-[12px] mb-2 ${isDark ? 'text-[#8E8E8E]' : 'text-[#5F6368]'}`}>⏱ {s.demo.duration}</div>}
          <div className="flex items-center gap-2 mt-auto pt-2">
            {phasesCount > 0 ? (
              <button onClick={() => onActivate(s.name)} className={cardBtnCls(isDark, 'primary')}>{active ? '✓ 使用中' : '启用'}</button>
            ) : (
              <button disabled className={cardBtnCls(isDark)}>仅查看</button>
            )}
            {hasDemo && <button onClick={() => bridge.openDemo(s.name)} className={cardBtnCls(isDark)}>看 demo</button>}
          </div>
        </div>
      );
    };

    const DemoModal = ({ demo, theme, onClose }) => {
      const isDark = theme === 'dark';
      if (!demo || !demo.open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" >
          <div className="absolute inset-0 bg-black/60" onClick={onClose}></div>
          <div className={`relative w-[1100px] max-w-[92vw] max-h-[82vh] flex flex-col rounded-[16px] overflow-hidden shadow-2xl ${isDark ? 'bg-[#1E1F20]' : 'bg-white'}`}>
            <div className={`flex items-center justify-between px-4 py-3 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <span className={`text-[14px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{demo.name} · demo 预览</span>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>
            <div className="flex-1 overflow-auto min-h-[300px] flex flex-col">
              {demo.loading ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载 demo …</div>
              ) : demo.error ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>读取失败: {demo.error}</div>
              ) : (demo.kind === 'none' || !demo.path) && demo.kind !== 'text' ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>该 skill 未声明 demo 文件。</div>
              ) : demo.kind === 'html' ? (
                <iframe className="w-full flex-1 min-h-[480px] border-0 bg-white" src={convertFileSrc(demo.path)} sandbox="allow-same-origin allow-scripts" />
              ) : demo.kind === 'image' ? (
                <img className="max-w-full max-h-[72vh] object-contain m-auto" src={convertFileSrc(demo.path)} alt={demo.name + ' demo'} />
              ) : demo.kind === 'text' ? (
                <pre className={`p-4 text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{demo.content || ''}</pre>
              ) : (
                <div className="m-auto text-center">
                  <p className={`text-[13px] mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>未识别的文件类型</p>
                  <button onClick={() => bridge.openInSystem(demo.path)} className={cardBtnCls(isDark, 'primary')}>用系统应用打开</button>
                </div>
              )}
            </div>
            {(demo.description || demo.duration) && (
              <div className={`px-4 py-2 border-t text-[12px] ${isDark ? 'border-white/10 text-[#C4C7C5]' : 'border-black/10 text-[#444746]'}`}>
                {demo.description ? '📝 ' + demo.description : ''}{demo.description && demo.duration ? ' · ' : ''}{demo.duration ? '⏱ ' + demo.duration : ''}
              </div>
            )}
          </div>
        </div>
      );
    };

    const WorkflowView = ({ theme, t }) => {
      const isDark = theme === 'dark';
      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 overflow-hidden animate-in fade-in duration-300">
          <div className="px-6 md:px-10 pt-8 pb-4">
            <h1 className={`text-[28px] font-normal ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.workflow}</h1>
          </div>
          <div className="flex-1 flex flex-col items-center justify-center px-6 text-center gap-3">
            <div className={`w-16 h-16 rounded-full flex items-center justify-center ${isDark ? 'bg-[#282A2C] text-[#8E8E8E]' : 'bg-[#F0F4F9] text-[#757575]'}`}>
              <ClipboardList size={28} />
            </div>
            <div className={`text-[16px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>开发中</div>
            <div className={`text-[13px] max-w-[360px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>
              工作流编排功能正在重新设计，敬请期待。
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 卡片池 (Persona / AgentPool)
    // ==========================================
    // Side B: agency-agents-zh 按"部门"组织(无档位/评分), 派生稳定的部门配色。
    const DEPT_LABELS = { academic:'学术', design:'设计', engineering:'工程', finance:'金融', 'game-development':'游戏', hr:'人力', legal:'法务', marketing:'营销', 'paid-media':'投放', product:'产品', 'project-management':'项管', sales:'销售', 'spatial-computing':'空间计算', specialized:'专项', 'supply-chain':'供应链', support:'客服', testing:'测试' };
    const DEPT_ORDER = ['engineering','marketing','specialized','design','product','finance','sales','testing','project-management','paid-media','support','academic','game-development','spatial-computing','supply-chain','hr','legal'];
    const DEPT_COLOR = { academic:'#8B5CF6', design:'#EC4899', engineering:'#06B6D4', finance:'#10B981', 'game-development':'#F59E0B', hr:'#F472B6', legal:'#6B7280', marketing:'#F97316', 'paid-media':'#EF4444', product:'#7C3AED', 'project-management':'#3B82F6', sales:'#14B8A6', 'spatial-computing':'#6366F1', specialized:'#64748B', 'supply-chain':'#84CC16', support:'#22D3EE', testing:'#A855F7' };
    const deptColor = (d) => DEPT_COLOR[d] || '#9aa0a6';
    const CLAMP3 = { display:'-webkit-box', WebkitLineClamp:3, WebkitBoxOrient:'vertical', overflow:'hidden' };
    const CLAMP2 = { display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden' };

    // 聊天室左上角的专家面具挂件(工牌)。常驻:有对话就挂。
    //   未加持 → 占位卡"＋ 加持专家", 整卡点击打开专家池(入口)。
    //   已加持 → 显专家, 点卡片主体=换专家, 点 ✕=摘下。
    const Lanyard = ({ persona, isDark, onRemove, onOpenPicker }) => {
      // 未加持: 占位入口
      if (!persona) {
        return (
          <div className="absolute top-0 left-6 z-[15]" style={{ width:148 }}>
            <div className="lanyard-wrap flex flex-col items-center">
              <div style={{ width:2, height:60, background: isDark?'linear-gradient(#4a4d50,#303234)':'linear-gradient(#cfd2d6,#aeb2b6)' }}></div>
              <div className="w-2.5 h-2.5 rounded-full -mt-1 mb-1.5" style={{ background: isDark?'#15171a':'#e8eaed', border:'2px solid '+(isDark?'#3c4043':'#bdc1c6') }}></div>
              <div onClick={onOpenPicker} title="加持一张卡牌"
                className="lanyard-card rounded-xl px-3 py-3.5 border border-dashed w-[140px] flex flex-col items-center gap-1 cursor-pointer transition-colors hover:border-solid"
                style={{ background: isDark?'rgba(40,42,44,.5)':'rgba(255,255,255,.6)', borderColor: isDark?'#4a4d50':'#c4c7c5' }}>
                <div className="w-8 h-8 rounded-lg flex items-center justify-center text-[18px] leading-none" style={{ background: isDark?'rgba(124,58,237,.16)':'rgba(124,58,237,.10)', color:'#9580FF' }}>＋</div>
                <div className="text-[11.5px] font-medium" style={{ color: isDark?'#9aa0a6':'#5f6368' }}>加持卡牌</div>
                <div className="text-[8.5px] font-mono tracking-[0.18em]" style={{ color: isDark?'#5f6368':'#9aa0a6' }}>AI PERSONA</div>
              </div>
            </div>
          </div>
        );
      }
      // 已加持
      const tc = deptColor(persona.dept);
      return (
        <div className="absolute top-0 left-6 z-[15]" style={{ width:148 }}>
          <div className="lanyard-wrap flex flex-col items-center">
            {/* 挂绳 + 扣环(留出长度让卡片落到浮动 Artifacts 按钮下方) */}
            <div style={{ width:2, height:60, background:'linear-gradient(#ff5a3c,#b3361f)' }}></div>
            <div className="w-2.5 h-2.5 rounded-full -mt-1 mb-1.5" style={{ background: isDark?'#15171a':'#e8eaed', border:'2px solid '+(isDark?'#3c4043':'#bdc1c6') }}></div>
            <div onClick={onOpenPicker} title="点击换专家"
              className="lanyard-card relative rounded-xl p-3 border w-[140px] cursor-pointer"
              style={{ background: isDark?'#1e2022':'#fff', borderColor:'rgba(255,180,30,.85)', boxShadow:'0 10px 30px -8px rgba(0,0,0,.5), 0 0 14px -3px rgba(255,180,30,.5)' }}>
              <button onClick={(e)=>{ e.stopPropagation(); onRemove(); }} title="摘下面具" className="absolute -top-2 -right-2 w-5 h-5 rounded-full flex items-center justify-center text-[11px] leading-none"
                style={{ background: isDark?'#2c2e30':'#eef0f3', color: isDark?'#9aa0a6':'#5f6368', border:'1px solid '+(isDark?'#3c4043':'#dadce0') }}>✕</button>
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-lg flex items-center justify-center text-[18px] shrink-0" style={{ background: tc+'22' }}>{persona.emoji}</div>
                <div className="min-w-0">
                  <div className={`text-[12px] font-semibold leading-tight ${isDark?'text-[#E3E3E3]':'text-[#1F1F1F]'}`} style={CLAMP2}>{persona.name}</div>
                  <span className="text-[10px] font-mono font-bold" style={{ color:tc }}>{DEPT_LABELS[persona.dept]||persona.dept}</span>
                </div>
              </div>
              <p className="text-[10px] leading-snug mt-1.5" style={{ ...CLAMP2, color: isDark?'#80868b':'#5f6368' }}>{persona.description}</p>
              <div className="text-[8.5px] font-mono tracking-[0.18em] text-center mt-2 pt-1.5 border-t" style={{ color:'#ffae1e', borderColor: isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)' }}>AI PERSONA</div>
            </div>
          </div>
        </div>
      );
    };

    // 双击卡片打开的详情 modal —— FLIP 转场 + 拉取并展示完整人设正文(body)。
    const PersonaDetailModal = ({ card, originRect, equipped, onClose, onEquip, isDark }) => {
      const panelRef = useRef(null);
      const [body, setBody] = useState(null); // null=loading
      useEffect(() => {
        const panel = panelRef.current;
        if (panel && originRect) {
          const last = panel.getBoundingClientRect();
          const dx = originRect.left - last.left, dy = originRect.top - last.top;
          const sx = Math.max(0.05, originRect.width / last.width), sy = Math.max(0.05, originRect.height / last.height);
          panel.style.transformOrigin = 'top left';
          panel.style.transform = `translate(${dx}px,${dy}px) scale(${sx},${sy})`;
          panel.style.opacity = '0.5';
          panel.getBoundingClientRect();
          panel.style.transition = 'transform .34s cubic-bezier(.2,.85,.25,1), opacity .34s';
          panel.style.transform = 'none';
          panel.style.opacity = '1';
        }
        if (bridge.available && bridge.readPersonaBody) {
          bridge.readPersonaBody(card.id).then(b=>setBody(b||'')).catch(()=>setBody('（正文加载失败）'));
        } else { setBody(''); }
      }, []);
      const tc = deptColor(card.dept);
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{ background:'rgba(0,0,0,.55)' }} onClick={onClose}>
          <div ref={panelRef} onClick={(e)=>e.stopPropagation()}
            className="w-full max-w-[620px] max-h-[84vh] flex flex-col rounded-2xl border"
            style={{ background: isDark?'#1e2022':'#ffffff', borderColor: isDark?'rgba(255,255,255,.10)':'rgba(0,0,0,.08)', boxShadow:'0 24px 80px -20px rgba(0,0,0,.6)' }}>
            <div className="flex items-start gap-4 p-6 pb-3 shrink-0">
              <div className="w-16 h-16 rounded-xl flex items-center justify-center text-[34px] shrink-0" style={{ background: tc+'22' }}>{card.emoji}</div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2">
                  <h2 className={`text-[20px] font-semibold ${isDark?'text-[#E3E3E3]':'text-[#1F1F1F]'}`}>{card.name}</h2>
                  <span className="text-[11px] font-semibold px-2 py-0.5 rounded" style={{ background: tc+'22', color: tc }}>{DEPT_LABELS[card.dept]||card.dept}</span>
                </div>
                <div className="text-[12.5px] mt-1" style={{ color: isDark?'#C4C7C5':'#3c4043' }}>{card.description}</div>
              </div>
              <button onClick={onClose} className={`shrink-0 p-1 rounded-md ${isDark?'text-[#9aa0a6] hover:bg-[#2c2e30]':'text-[#5f6368] hover:bg-[#eef0f3]'}`}><X size={18}/></button>
            </div>
            {/* 完整人设正文 */}
            <div className="flex-1 overflow-y-auto custom-scrollbar px-6 py-3 min-h-0 border-t" style={{ borderColor: isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)' }}>
              <div className="text-[11px] font-semibold mb-2 font-mono tracking-wide" style={{ color: isDark?'#80868b':'#9aa0a6' }}>完整人设 (加持时一次性注入)</div>
              {body===null
                ? <div className="text-[13px] py-6 text-center" style={{ color: isDark?'#80868b':'#757575' }}>加载人设正文…</div>
                : <div className={`persona-body text-[13px] leading-relaxed ${isDark?'text-[#C4C7C5]':'text-[#3c4043]'}`} dangerouslySetInnerHTML={{ __html: bridge.renderMarkdown ? bridge.renderMarkdown(body) : body }} />}
            </div>
            <div className="p-5 pt-3 shrink-0 border-t" style={{ borderColor: isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)' }}>
              <button onClick={()=>onEquip(card)}
                className="w-full py-2.5 rounded-xl text-[14px] font-semibold transition-colors"
                style={ equipped ? { background:'rgba(255,180,30,.18)', color:'#ffae1e' } : { background:'#7C3AED', color:'#fff' } }>
                {equipped ? '🎴 已加持 · 点击摘下' : '加持给 AI'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    const CardPoolView = ({ theme, t, bs, onEquipped }) => {
      const isDark = theme === 'dark';
      const pool = (bs && bs.personaPool) || { loadState: 'idle' };
      // 201 张卡走模块级缓存(不进 notify 快照),loadState 变化驱动重渲染。
      const list = (bridge.available && bridge.getPersonas) ? bridge.getPersonas() : [];
      const active = (bs && bs.activePersona) || null;
      // 加持目标 = 当前对话(equipPersona 注入到 state.activeSessionId)。让用户始终知道注入到哪。
      const target = (bs && bs.sessions && bs.activeSessionId) ? bs.sessions.find(s => s.id === bs.activeSessionId) : null;
      const targetTitle = target ? (target.title || '新对话') : null;
      const [selDept, setSelDept] = useState([]);
      const [query, setQuery] = useState('');
      const [visible, setVisible] = useState(60);
      const [detail, setDetail] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => { if (bridge.available) bridge.loadPersonas(); }, []);
      useEffect(() => { setVisible(60); }, [query, selDept]);
      useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 2400); return () => clearTimeout(id); }, [toast]);

      const counts = {}; list.forEach(c => { counts[c.dept] = (counts[c.dept]||0)+1; });
      const q = query.trim().toLowerCase();
      const filtered = list.filter(c => {
        if (selDept.length && selDept.indexOf(c.dept) < 0) return false;
        if (q) {
          const hay = (c.name+' '+c.description+' '+c.dept+' '+(DEPT_LABELS[c.dept]||'')).toLowerCase();
          if (hay.indexOf(q) < 0) return false;
        }
        return true;
      });
      const shown = filtered.slice(0, visible);

      function toggle(arr, setArr, v) { setArr(arr.indexOf(v)>=0 ? arr.filter(x=>x!==v) : arr.concat([v])); }
      function resetFacets() { setSelDept([]); setQuery(''); }
      function onMove(e){ const el=e.currentTarget; const r=el.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
        el.style.transform=`perspective(900px) rotateX(${(0.5-py)*9}deg) rotateY(${(px-0.5)*11}deg) translateY(-3px)`;
        el.style.setProperty('--mx',(px*100)+'%'); el.style.setProperty('--my',(py*100)+'%'); }
      function onLeave(e){ e.currentTarget.style.transform=''; }
      function equip(card, e){ if(e) e.stopPropagation();
        if (active && active.id===card.id) { bridge.unequipPersona(); setToast('已摘下: ' + card.name); }
        else { Promise.resolve(bridge.equipPersona(card.id)).then(s => { if (s) setToast('已加持给「' + (targetTitle || '当前对话') + '」: ' + s.name); }); } }
      function openDetail(card, e){ const r=e.currentTarget.getBoundingClientRect();
        setDetail({ card, rect:{ left:r.left, top:r.top, width:r.width, height:r.height } }); }

      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 overflow-hidden animate-in fade-in duration-300">
          {/* Header */}
          <div className="px-6 md:px-8 pt-6 pb-3 flex items-end justify-between gap-4 shrink-0">
            <div className="min-w-0">
              <h1 className={`text-[24px] font-normal tracking-wide ${isDark?'text-[#E3E3E3]':'text-[#1F1F1F]'}`}>
                <span style={{ color:'#7C3AED', fontWeight:600 }}>卡牌池</span> <span style={{ color: isDark?'#80868b':'#9aa0a6' }}>/ 专家能力卡组</span>
              </h1>
              <div className="text-[12px] mt-1" style={{ color: isDark?'#80868b':'#757575' }}>为 AI 加持一张专家卡牌 —— 将该领域专家的方法论、工作流与交付规范注入当前对话,使其以专家级标准承接后续任务。</div>
              {/* 加持目标: 醒目横幅, 让用户一眼看清注入到哪个对话 */}
              <div className="mt-2.5 inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border text-[12.5px]"
                style={ targetTitle
                  ? { background: isDark?'rgba(124,58,237,.20)':'rgba(124,58,237,.10)', borderColor: isDark?'rgba(149,128,255,.6)':'rgba(124,58,237,.42)' }
                  : { background: isDark?'rgba(242,139,130,.16)':'rgba(242,139,130,.10)', borderColor:'rgba(242,139,130,.55)' } }>
                <span className="font-semibold whitespace-nowrap" style={{ color: targetTitle ? '#9580FF' : '#F28B82' }}>🎯 加持目标</span>
                {targetTitle
                  ? <>
                      <span className="font-semibold truncate max-w-[240px]" style={{ color: isDark?'#E3E3E3':'#1F1F1F' }} title={targetTitle}>「{targetTitle}」</span>
                      {active
                        ? <span className="whitespace-nowrap" style={{ color: isDark?'#9aa0a6':'#757575' }}>· 已加持 <span style={{ color:'#ffae1e', fontWeight:600 }}>{active.name}</span></span>
                        : <span className="whitespace-nowrap" style={{ color: isDark?'#80868b':'#9aa0a6' }}>· 未加持</span>}
                    </>
                  : <span className="font-medium whitespace-nowrap" style={{ color:'#F28B82' }}>无当前对话，请先新建 / 打开一个</span>}
              </div>
            </div>
            <div className="text-[12px] font-mono shrink-0" style={{ color: isDark?'#80868b':'#757575' }}>{filtered.length} / {list.length}</div>
          </div>

          {pool.loadState==='loading' ? (
            <div className="flex-1 flex items-center justify-center text-[13px]" style={{ color: isDark?'#80868b':'#757575' }}>正在加载卡牌池…</div>
          ) : pool.loadState==='error' ? (
            <div className="flex-1 flex items-center justify-center text-[13px] text-[#F28B82]">卡牌池加载失败</div>
          ) : (
          <div className="flex-1 flex min-h-0">
            {/* Facet 侧栏: 部门 */}
            <aside className="w-[200px] shrink-0 overflow-y-auto custom-scrollbar px-5 py-2 hidden md:block">
              <div className="text-[12px] font-semibold mb-2" style={{ color: isDark?'#9aa0a6':'#5f6368' }}>部门</div>
              <div className="space-y-1 mb-5">
                {DEPT_ORDER.filter(k=>counts[k]).map(k=>{
                  const on = selDept.indexOf(k)>=0; const tc=deptColor(k);
                  return (
                    <div key={k} onClick={()=>toggle(selDept,setSelDept,k)} className="flex items-center justify-between cursor-pointer text-[12.5px] py-0.5 group">
                      <span className="flex items-center gap-2">
                        <span className="w-3.5 h-3.5 rounded-sm border flex items-center justify-center" style={{ borderColor: on?tc:(isDark?'#5f6368':'#bdc1c6'), background: on?tc:'transparent' }}>{on?<span className="text-white text-[9px] leading-none">✓</span>:null}</span>
                        <span style={{ color: isDark?'#C4C7C5':'#3c4043' }}>{DEPT_LABELS[k]||k}</span>
                      </span>
                      <span className="font-mono text-[11px]" style={{ color: isDark?'#5f6368':'#9aa0a6' }}>{counts[k]}</span>
                    </div>
                  );
                })}
              </div>
              <button onClick={resetFacets} className="w-full py-2 rounded-lg text-[12.5px] border transition-colors" style={{ color: isDark?'#C4C7C5':'#3c4043', borderColor: isDark?'#3c4043':'#dadce0' }}>重置筛选</button>
            </aside>

            {/* 卡片网格 */}
            <div className="flex-1 min-w-0 flex flex-col">
              <div className="flex-1 overflow-y-auto custom-scrollbar px-5 pb-4">
                {shown.length===0 ? (
                  <div className="h-full flex items-center justify-center text-[13px]" style={{ color: isDark?'#80868b':'#757575' }}>没有匹配的专家，试试放宽筛选</div>
                ) : (
                  <div className="grid gap-3" style={{ gridTemplateColumns:'repeat(auto-fill, minmax(248px, 1fr))' }}>
                    {shown.map(c=>{ const eq = active && active.id===c.id; const tc=deptColor(c.dept);
                      return (
                        <div key={c.id}
                          className={`ap-card ${eq?'equipped':''} rounded-xl p-3.5 flex flex-col gap-2 cursor-pointer border`}
                          style={{ borderColor: isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.08)', background: isDark?'rgba(40,42,44,.55)':'rgba(255,255,255,.72)' }}
                          onMouseMove={onMove} onMouseLeave={onLeave} onDoubleClick={(e)=>openDetail(c,e)}>
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                              <div className="w-10 h-10 rounded-lg flex items-center justify-center text-[20px] shrink-0" style={{ background: tc+'22' }}>{c.emoji}</div>
                              <div className={`font-semibold text-[14.5px] truncate ${isDark?'text-[#E3E3E3]':'text-[#1F1F1F]'}`}>{c.name}</div>
                            </div>
                            {eq
                              ? <span className="shrink-0 text-[10.5px] font-semibold px-2 py-0.5 rounded-md whitespace-nowrap" style={{ background:'#ffae1e', color:'#3a2500' }}>🎴 已加持</span>
                              : <span className="shrink-0 text-[10.5px] font-semibold px-1.5 py-0.5 rounded whitespace-nowrap" style={{ background: tc+'22', color: tc }}>{DEPT_LABELS[c.dept]||c.dept}</span>}
                          </div>
                          <p className="text-[11.5px] leading-snug flex-1" style={{ ...CLAMP3, color: isDark?'#9aa0a6':'#5f6368' }} title={c.description}>{c.description||'(无简介)'}</p>
                          <div className="flex items-center justify-end text-[10.5px] font-mono gap-2">
                            <button onClick={(e)=>equip(c,e)} className="shrink-0 px-2.5 py-1 rounded-md text-[11px] font-medium transition-colors"
                              style={ eq ? { background:'rgba(255,180,30,.16)', color:'#ffae1e' } : { background: isDark?'rgba(124,58,237,.18)':'rgba(124,58,237,.10)', color:'#9580FF' } }>
                              {eq ? '取消' : '加持给 AI'}
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
                {filtered.length > visible ? (
                  <div className="flex justify-center mt-4">
                    <button onClick={()=>setVisible(visible+60)} className="px-4 py-2 rounded-lg text-[12.5px] border transition-colors" style={{ color: isDark?'#C4C7C5':'#3c4043', borderColor: isDark?'#3c4043':'#dadce0' }}>显示更多 ({filtered.length - visible})</button>
                  </div>
                ) : null}
              </div>

              {/* 搜索框 (前端关键词过滤) */}
              <div className="shrink-0 px-5 py-3 border-t flex items-center gap-3" style={{ borderColor: isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)' }}>
                <Search size={16} className={isDark?'text-[#80868b]':'text-[#9aa0a6]'} />
                <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="搜专家:名称 / 描述 / 部门 (如 前端 / 增长 / 测试)"
                  className="flex-1 bg-transparent outline-none text-[13px]" style={{ color: isDark?'#E3E3E3':'#1F1F1F' }} />
                {query ? <button onClick={()=>setQuery('')} className={isDark?'text-[#80868b] hover:text-[#E3E3E3]':'text-[#9aa0a6] hover:text-[#1F1F1F]'}><X size={14}/></button> : null}
              </div>
            </div>
          </div>
          )}

          {detail ? (
            <PersonaDetailModal card={detail.card} originRect={detail.rect} equipped={active && active.id===detail.card.id}
              isDark={isDark} onClose={()=>setDetail(null)}
              onEquip={(card)=>{ equip(card); }} />
          ) : null}

          {/* 加持反馈 toast */}
          {toast ? (
            <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-40 px-4 py-2.5 rounded-xl text-[13px] font-medium animate-in fade-in slide-in-from-bottom-2 duration-200"
              style={{ background: isDark?'#2c2e30':'#1F1F1F', color:'#fff', boxShadow:'0 10px 30px -8px rgba(0,0,0,.5)' }}>
              🎴 {toast}
            </div>
          ) : null}
        </div>
      );
    };

    // ==========================================
    // Shared Components
    // ==========================================

    const NavItem = ({ icon, label, active, theme, isSidebarOpen = true, onClick }) => {
      const isDark = theme === 'dark';
      return (
        <div
          onClick={onClick}
          title={!isSidebarOpen ? label : ""}
          className={`flex items-center cursor-pointer text-[15px] font-medium transition-colors overflow-hidden
          ${isSidebarOpen ? 'px-4 py-3 rounded-full w-full' : 'w-10 h-10 justify-center rounded-full mx-auto shrink-0'}
          ${active
            ? (isDark ? 'bg-[#A8C7FA] text-[#041E49]' : 'bg-[#D3E3FD] text-[#041E49]')
            : (isDark ? 'text-[#E3E3E3] hover:bg-[#282A2C]' : 'text-[#1F1F1F] hover:bg-[#E1E5EA]')}`}
        >
          <div className={`${isSidebarOpen ? 'mr-4' : ''} shrink-0 ${active ? (isDark ? 'text-[#041E49]' : 'text-[#0B57D0]') : ''}`}>
            {icon}
          </div>
          {isSidebarOpen && <span className="whitespace-nowrap">{label}</span>}
        </div>
      );
    };

    // 近期会话项：支持重命名(内联编辑) + 删除(内联二次确认)
    const RecentItem = ({ chat, active, personaTarget, theme, onSelect, onRename, onDelete }) => {
      const isDark = theme === 'dark';
      const [editing, setEditing] = useState(false);
      const [confirming, setConfirming] = useState(false);
      const [val, setVal] = useState(chat.title);
      function save() { const tx = val.trim(); setEditing(false); if (tx && tx !== chat.title) onRename(chat.id, tx); }
      if (editing) {
        return (
          <div className="px-1.5 py-0.5">
            <input autoFocus value={val}
              onChange={e => setVal(e.target.value)}
              onClick={e => e.stopPropagation()}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); save(); } else if (e.key === 'Escape') { setEditing(false); setVal(chat.title); } }}
              onBlur={save}
              className={`w-full px-3 py-1 rounded-full text-[14px] outline-none ${isDark ? 'bg-[#131314] text-[#E3E3E3] ring-1 ring-[#A8C7FA]' : 'bg-white text-[#1F1F1F] ring-1 ring-[#0B57D0]'}`} />
          </div>
        );
      }
      return (
        <div onClick={() => onSelect(chat.id)}
          title={personaTarget ? '加持目标 · 在卡牌池选的专家会注入到这个对话' : undefined}
          style={ personaTarget ? { background: isDark?'rgba(124,58,237,.22)':'rgba(124,58,237,.12)', boxShadow:'inset 0 0 0 1px '+(isDark?'rgba(149,128,255,.6)':'rgba(124,58,237,.42)'), color: isDark?'#fff':'#1F1F1F' } : undefined }
          className={`group flex items-center px-4 py-1.5 rounded-full cursor-pointer text-[13px] transition-all
            ${personaTarget ? ''
              : active ? (isDark ? 'bg-[#333537] text-white' : 'bg-[#E1E5EA] text-[#1F1F1F]')
                     : (isDark ? 'text-[#BDC1C6] hover:bg-[#282A2C] hover:text-[#E3E3E3]' : 'text-[#5F6368] hover:bg-[#E1E5EA] hover:text-[#1F1F1F]')}`}>
          {personaTarget && <span className="shrink-0 mr-1.5 text-[12px]" title="加持目标">🎴</span>}
          <span className="truncate pr-2 leading-relaxed whitespace-nowrap flex-1">{chat.title}</span>
          {chat.working && <span className="shrink-0 mr-1 inline-block w-2 h-2 rounded-full bg-current opacity-70 animate-pulse" title="正在生成中"></span>}
          {chat.skill && <span className="text-[11px] shrink-0 opacity-70 mr-1" title={chat.skill}>🧭</span>}
          {confirming ? (
            <div className="flex items-center gap-0.5 shrink-0" onClick={e => e.stopPropagation()}>
              <span className={`text-[11px] mr-0.5 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>删除?</span>
              <button title="确认删除" onClick={(e) => { e.stopPropagation(); onDelete(chat.id); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center text-[12px] ${isDark ? 'text-[#F28B82] hover:bg-[#5c2b29]' : 'text-[#C5221F] hover:bg-[#FAD2CF]'}`}>✓</button>
              <button title="取消" onClick={(e) => { e.stopPropagation(); setConfirming(false); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center text-[12px] ${isDark ? 'hover:bg-[#444746]' : 'hover:bg-[#D3D7DB]'}`}>✗</button>
            </div>
          ) : (
            <>
              {/* 默认: 显示日期(辨识每条会话什么时候发生);hover/active 时换成编辑/删除按钮 */}
              {chat.date && (
                <span className={`text-[11px] shrink-0 opacity-60 whitespace-nowrap group-hover:hidden ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
                  {chat.date}
                </span>
              )}
              <div className="hidden group-hover:flex items-center gap-0.5 shrink-0">
                <button title="重命名" onClick={(e) => { e.stopPropagation(); setVal(chat.title); setEditing(true); }}
                  className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] ${isDark ? 'hover:bg-[#444746]' : 'hover:bg-[#D3D7DB]'}`}>✏️</button>
                <button title="删除" onClick={(e) => { e.stopPropagation(); setConfirming(true); }}
                  className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] ${isDark ? 'hover:bg-[#5c2b29]' : 'hover:bg-[#FAD2CF]'}`}>🗑</button>
              </div>
            </>
          )}
        </div>
      );
    };

    const WidgetCard = ({ title, children, theme }) => {
      const isDark = theme === 'dark';
      return (
        <div className={`rounded-[24px] p-8 flex flex-col transition-shadow hover:shadow-md ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
          <div className={`text-[14px] font-medium tracking-wide mb-6 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>
            {title}
          </div>
          <div className="flex-1 flex flex-col">
            {children}
          </div>
        </div>
      );
    };

    const ProgressBar = ({ label, value, subValue, percentage, theme, color = "#0B57D0" }) => {
      const isDark = theme === 'dark';
      return (
        <div>
          <div className="flex justify-between items-end mb-2">
            <span className={`text-[14px] ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{label}</span>
            <div className="text-right">
              <span className={`text-[16px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{value}</span>
              {subValue && <span className={`text-[13px] ml-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{subValue}</span>}
            </div>
          </div>
          <div className={`h-2 w-full rounded-full overflow-hidden ${isDark ? 'bg-[#333537]' : 'bg-[#E1E5EA]'}`}>
            <div
              className="h-full rounded-full transition-all duration-1000 ease-out"
              style={{ width: `${percentage > 0 ? percentage : 100}%`, backgroundColor: percentage > 0 ? color : (isDark ? '#444746' : '#C4C7C5') }}
            ></div>
          </div>
        </div>
      );
    };

    const ListRow = ({ label, value, border = true, theme }) => {
      const isDark = theme === 'dark';
      return (
        <div className="flex justify-between items-center px-4 py-3 relative">
          <span className={`text-[14px] ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{label}</span>
          <span className={`text-[14px] font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{value}</span>
          {border && <div className={`absolute bottom-0 right-4 left-4 h-[1px] ${isDark ? 'bg-white/5' : 'bg-black/5'}`}></div>}
        </div>
      );
    };

    // ==========================================
    // Render
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
