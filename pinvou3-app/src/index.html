    .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.5); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Chat message styles */
    .msg-md h1,.msg-md h2,.msg-md h3,.msg-md h4 { font-weight:600; margin:0.6em 0 0.3em; }
    .msg-md h1 { font-size:1.4em; } .msg-md h2 { font-size:1.2em; } .msg-md h3 { font-size:1.05em; }

    .msg-md ul,.msg-md ol { padding-left:1.5em; margin:0.4em 0; }
    .msg-md li { margin:0.2em 0; line-height:1.6; }
    .msg-md code { font-family:"JetBrains Mono","SF Mono",Consolas,monospace; font-size:0.88em; padding:0.15em 0.4em; border-radius:6px; }
    .msg-md pre { margin:0.6em 0; padding:1em; border-radius:12px; overflow-x:auto; font-size:0.88em; line-height:1.5; }
    .msg-md pre code { padding:0; background:none; }
    .msg-md blockquote { border-left:3px solid rgba(128,128,128,0.4); padding-left:1em; margin:0.5em 0; opacity:0.85; }
    .msg-md a { text-decoration:underline; }
    .msg-md table { border-collapse:collapse; margin:0.5em 0; font-size:0.92em; }
    .msg-md th,.msg-md td { border:1px solid rgba(128,128,128,0.3); padding:0.4em 0.8em; }

    /* Dark theme code blocks */
    .dark-code .msg-md code { background:rgba(255,255,255,0.08); color:#E3E3E3; }
    .dark-code .msg-md pre { background:rgba(0,0,0,0.3); color:#E3E3E3; }
    /* Light theme code blocks */
    .light-code .msg-md code { background:rgba(0,0,0,0.06); color:#1F1F1F; }
    .light-code .msg-md pre { background:rgba(0,0,0,0.04); color:#1F1F1F; }

    /* Tool card styles */
    .tool-card-output { max-height:200px; overflow-y:auto; font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-all; }

    /* Streaming cursor */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .streaming-cursor::after { content:"▊"; animation:blink 1s step-end infinite; margin-left:2px; }

    /* Thinking animation */
    @keyframes spin-braille { 0%{content:"⠋"} 10%{content:"⠙"} 20%{content:"⠹"} 30%{content:"⠸"} 40%{content:"⠼"} 50%{content:"⠴"} 60%{content:"⠦"} 70%{content:"⠧"} 80%{content:"⠇"} 90%{content:"⠏"} }
    /* Tool Store */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes tsModalIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
    .ts-modal-in { animation: tsModalIn 0.2s ease-out; }
    @keyframes tsAlertIn { from { opacity:0; transform:scale(1.05); } to { opacity:1; transform:scale(1); } }
    @keyframes tsSpinner { to { transform: rotate(360deg); } }

    /* ===== 卡片池: tilt / spotlight / borderglow / 挂件 ===== */
    .ap-card { transform-style: preserve-3d; transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s; will-change: transform; position: relative; }
    /* 鼠标跟随高光(--mx/--my 由 JS 注入) */
    .ap-card::before {
      content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0;
      transition:opacity .25s; z-index:1;
      background: radial-gradient(380px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.10), transparent 42%);
    }
    .ap-card:hover::before { opacity:1; }
    .ap-card > * { position:relative; z-index:2; }
    /* A 档金色 spotlight 额外柔光 */
    .ap-card.tier-A:hover { box-shadow: 0 0 0 1px rgba(255,191,0,.35), 0 14px 40px -12px rgba(255,191,0,.30); }
    /* 已加持: 金色流转边框 */

    @keyframes lanyard-sway { 0%,100%{ transform: rotate(-1.3deg) } 50%{ transform: rotate(1.3deg) } }
    /* 🏛️ 奏折卷轴:纸面从中线向上下展开(clip-path),两根轴杆从中间滚向边缘;收卷反向 */
    @keyframes memorial-fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes memorial-paper-open { from { clip-path: inset(50% 0 50% 0) } to { clip-path: inset(0 0 0 0) } }
    @keyframes memorial-paper-close { from { clip-path: inset(0 0 0 0) } to { clip-path: inset(50% 0 50% 0) } }
    @keyframes memorial-roller-top-open { from { top: calc(50% - 9px) } to { top: -9px } }
    @keyframes memorial-roller-top-close { from { top: -9px } to { top: calc(50% - 9px) } }
    @keyframes memorial-roller-bottom-open { from { bottom: calc(50% - 9px) } to { bottom: -9px } }
    @keyframes memorial-roller-bottom-close { from { bottom: -9px } to { bottom: calc(50% - 9px) } }
    @keyframes memorial-stamp { from { opacity: 0; transform: rotate(-14deg) scale(1.8) } 70% { opacity: .9; transform: rotate(-14deg) scale(.94) } to { opacity: .82; transform: rotate(-14deg) scale(1) } }

    .lanyard-wrap { animation: lanyard-drop .55s cubic-bezier(.2,.9,.3,1.2) both; transform-origin: top center; }

        apConverting: 'プレビューを生成中…', apConvertFail: 'プレビュー生成に失敗', apUnsupported: 'この形式は埋め込みプレビュー非対応。下の「開く」をご利用ください',
        apKinds: { md:'Markdown', html:'HTML 文書', image:'画像', pdf:'PDF 文書', docx:'Office 文書', xlsx:'スプレッドシート', legacy_office:'Office 文書', text:'テキスト', binary:'ファイル' },
        depts: { academic:'学術', design:'デザイン', engineering:'エンジニアリング', finance:'金融', 'game-development':'ゲーム開発', hr:'人事', legal:'法務', marketing:'マーケティング', 'paid-media':'広告運用', product:'プロダクト', 'project-management':'プロジェクト管理', sales:'営業', 'spatial-computing':'空間コンピューティング', specialized:'専門', 'supply-chain':'サプライチェーン', support:'サポート', testing:'テスト', tool:'ツール' }
      }
    };
    // ja 漏翻的 key 回落英文，避免新增文案后显示 undefined
    dict.ja = { ...dict.en, ...dict.ja };

    // UI 语言 ↔ 后端 UserPrefs language(BCP 47 tag)映射。加语言时三处同步:
    // 这里 / dict / Rust prefs.rs Language 枚举
    const LANG_TO_TAG = { zh: 'zh-Hans', en: 'en', ja: 'ja' };
    const TAG_TO_LANG = { 'zh-Hans': 'zh', 'en': 'en', 'ja': 'ja' };

    /* ==========================================
       TauriBridge hook
       ========================================== */
    const bridge = window.TauriBridge || { available: false };

    function useBridge() {
      const [bs, setBs] = useState(() => bridge.available ? bridge.getState() : null);
      useEffect(() => {
        if (!bridge.available) return;
        return bridge.subscribe(setBs);
      }, []);
      return bs;
    }

    /* ==========================================

    const appWindow = (window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow)

      : null;
    const TitleBar = ({ theme, t }) => {

    /* ==========================================
       App — 1:1 matching 前端.html structure
       ========================================== */
    const App = () => {
      const bs = useBridge();
      const [activeChat, setActiveChat] = useState(null);
      const [currentView, setCurrentView] = useState('chat');
      const [activeTheme, setActiveTheme] = useState('dark');

      const [superPerm, setSuperPerm] = useState(false);
      // search 后端配置:provider 默认 bing(对齐 bridge prefs::SearchProvider::default());

      // 模型配置（动态适配）——草稿模式，确认后才保存

      const [personaEditor, setPersonaEditor] = useState(null); // 聊天里"存入卡牌池"草稿 → App 级编辑器

      const t = dict[language];
      // 有可用新版 → 侧边栏设置图标亮红点（不弹窗不打断）
      const hasUpdate = !!(bs && bs.updateInfo && bs.updateInfo.available);

      function handleActivateSkill(name) {
        setChatPrefill(t.skillPrefill(name));
        setCurrentView('chat');

      // Sync from bridge state
      useEffect(() => {
        if (!bs) return;
        // activeChat 始终跟随 bridge(含 null:草稿态清掉近期列表高亮)。仅在物化成
        // 真实 session(非 null)时才强制切回 chat 视图——草稿态/删会话不该把用户从

            setCurrentView('chat');

        if (bs.superPermEnabled !== superPerm) setSuperPerm(bs.superPermEnabled);
        // UI 语言/主题:启动时从落盘 settings 恢复一次(此前只写不读,重启即回中文+深色)
        if (!uiPrefsInitRef.current && bs.settings) {
          const lang = TAG_TO_LANG[bs.settings.language];
          if (lang && lang !== language) setLanguage(lang);
          // 后端 Theme 枚举(prefs.rs)只认 genesis/liquid-light/liquid-dark;深色=genesis,浅色=liquid-light
          const th = bs.settings.theme === 'liquid-light' ? 'light' : 'dark';
          if (th !== activeTheme) setActiveTheme(th);
          uiPrefsInitRef.current = true;

        // 搜索配置：只在第一次从后端加载初始值，后续走草稿模式（确认后才保存并重启）。
        if (!searchConfigInitRef.current && bs.settings) {
          const search = bs.settings.search || {};
          const saved = {
            provider: search.provider || 'bing',
            apiKey: search.api_key || '',

          setSearchProvider(saved.provider);
          setSearchApiKey(saved.apiKey);
          savedSearchConfigRef.current = saved;
          searchConfigInitRef.current = true;

        // 模型配置：只在第一次从后端加载初始值，后续走草稿模式（确认后才保存），
        // 避免 useEffect 把未保存的本地修改覆盖回 disk 旧值。
        // custom_* 为 null 时用 PRESET_DEFAULTS 填成真实值——输入框显示当前生效配置，
        // 而不是灰色 placeholder 冒充。
        if (!modelConfigInitRef.current && bs.settings) {
          const adv = bs.settings.advanced || {};
          const effective = bs.effectiveModelConfig || {};
          const preset = effective.preset || adv.model_preset || 'local_vllm';
          const defs = PRESET_DEFAULTS[preset] || PRESET_DEFAULTS.local_vllm;
          const saved = {
            preset,
            name: effective.model || adv.custom_model_name || defs.model,
            baseUrl: effective.base_url || adv.custom_base_url || defs.baseUrl,
            apiKey: effective.api_key || adv.custom_api_key || '',
          };
          setModelPreset(saved.preset);
          setCustomModelName(saved.name);
          setCustomBaseUrl(saved.baseUrl);
          setCustomApiKey(saved.apiKey);
          savedModelConfigRef.current = saved;
          modelConfigInitRef.current = true;
        }
      }, [bs]);

      // 草稿 vs 已保存基线 → 模型卡是否显示「保存并重启」操作条
      const savedModel = savedModelConfigRef.current;
      const modelConfigDirty = !!savedModel && (
        modelPreset !== savedModel.preset ||
        customModelName !== savedModel.name ||
        customBaseUrl !== savedModel.baseUrl ||
        customApiKey !== savedModel.apiKey
      );
      function normalizedSearchApiKeyValue(value) {
        const trimmed = (value || '').trim();
        return trimmed ? trimmed : null;
      }
      // 搜索配置也影响 EngineConfig,需保存后重启进程才生效。
      const savedSearch = savedSearchConfigRef.current;
      const searchNeedsRestart = !!savedSearch && (
        searchProvider !== savedSearch.provider ||
        normalizedSearchApiKeyValue(searchApiKey) !== normalizedSearchApiKeyValue(savedSearch.apiKey)
      );

      // Build chat history from sessions
      const skillBindings = (bs && bs.workflow && bs.workflow.bindings) || {};
      const sessionBusy = (bs && bs.sessionBusy) || {};
      const chatHistory = bs && bs.sessions ? bs.sessions.map(s => ({
        id: s.id,
        // 后端默认标题是字面 "新对话"/"New chat"(bridge 以此判断是否自动改名)——显示层映射成当前语言
        title: (!s.title || s.title === '新对话' || s.title === 'New chat') ? t.newChat : s.title,
        date: formatSessionDate(s.updated_at || s.created_at, language),
        skill: skillBindings[s.id] || null,

      })) : [];

      const [justInstalledTool, setJustInstalledTool] = useState(null);

      function handleNewChat(installedToolId) {
        if (bridge.available) bridge.createNewSession();
        setCurrentView('chat');

        }

      function handleSwitchSession(id) {
        if (bridge.available) bridge.switchToSession(id);
        setActiveChat(id);
        setCurrentView('chat');
      }

      function handleDeleteSession(id) {
        if (bridge.available) bridge.deleteSession(id);
      }

      function handleRenameSession(id, title) {
        if (bridge.available) bridge.renameSession(id, title);
      }

      function handleToggleSuperPerm() {
        if (bridge.available) bridge.toggleSuperPerm();
        else setSuperPerm(!superPerm);
      }

      // 构造完整 UserPrefs 对象写盘。spread bs.settings 保留 search/advanced 等
      // 其他字段——之前漏 spread 会让后端 serde default 把它们重置(bug fix)。
      function buildFullSettings(overrides) {
        const base = (bs && bs.settings) ? bs.settings : {};
        return {
          ...base,
          theme: activeTheme === 'dark' ? 'genesis' : 'liquid-light',
          language: LANG_TO_TAG[language] || 'zh-Hans',
          search: {
            provider: searchProvider,
            api_key: normalizedSearchApiKeyValue(searchApiKey),
          },
          advanced: {
            ...buildAdvancedOverrides({}),
            ...(overrides && overrides.advanced ? overrides.advanced : {}),
          },
          ...overrides,
        };
      }

      function handleSetTheme(th) {
        setActiveTheme(th);
        if (bridge.available) {
          bridge.saveSettings(buildFullSettings({ theme: th === 'dark' ? 'genesis' : 'liquid-light' }));

      function handleSetSearchProvider(p) {
        setSearchProvider(p);

      function handleSetSearchApiKey(k) {
        setSearchApiKey(k);

      function handleSetLanguage(lang) {
        setLanguage(lang);

      function handleChangeModelPreset(p) {
        const saved = savedModelConfigRef.current;
        if (saved && p === saved.preset) {

          setModelPreset(saved.preset);

          setCustomBaseUrl(saved.baseUrl);
          setCustomApiKey(saved.apiKey);

        const defs = PRESET_DEFAULTS[p] || PRESET_DEFAULTS.local_vllm;

        setCustomBaseUrl(defs.baseUrl);
        setCustomModelName(defs.model);
        setCustomApiKey(''); // 切换 provider 清空 api_key，避免跨厂商 key 混用
      }
      function handleSetCustomModelName(v) {
        setCustomModelName(v);
      }
      function handleSetCustomBaseUrl(v) {
        setCustomBaseUrl(v);
      }
      function handleSetCustomApiKey(v) {
        setCustomApiKey(v);
      }
      function handleConfirmModelConfig() {
        if (bridge.available) {
          bridge.saveSettingsAndRestart(buildFullSettings({
            advanced: {
              model_preset: modelPreset,
              custom_model_name: customModelName || null,
              custom_base_url: customBaseUrl || null,
              custom_api_key: customApiKey || null,
            },
          }));
        }
      }

      return (
        <div className={`flex flex-col h-screen font-sans overflow-hidden antialiased transition-colors duration-300 ${activeTheme === 'dark' ? 'bg-[#131314] text-[#E3E3E3]' : 'bg-white text-[#1F1F1F]'}`}>

          <div className={`${isSidebarOpen ? 'w-[280px] bg-[#1E1F20]' : 'w-[68px] bg-[#131314]'} shrink-0 flex flex-col z-40 transition-all duration-300 ${activeTheme === 'light' ? 'bg-[#F0F4F9]' : ''}`}>

            {/* Navigation — shrink-0 固定不滚动,list 再多也不挤压 nav */}
            <div className={`shrink-0 flex flex-col gap-1 mt-3 ${isSidebarOpen ? 'px-3' : 'px-2 items-center'}`}>
              <NavItem
                icon={<Edit2 size={18} />} label={t.newChat}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={handleNewChat}
              />
              <NavItem
                icon={<Search size={18} />} label={t.searchChats}
                active={currentView === 'search'}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={() => setCurrentView('search')}
              />
              <NavItem
                icon={<BarChart2 size={18} />} label={t.monitor}
                active={currentView === 'monitor'}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={() => setCurrentView('monitor')}
              />
              <NavItem
                icon={<Layers size={18} />} label={t.cardPool}
                active={currentView === 'cardpool'}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={() => setCurrentView('cardpool')}
              />
              <NavItem
                icon={<ClipboardList size={18} />} label={t.workflow}

    function formatSessionDate(ts, language) {
      if (!ts) return '';
      const d = new Date(typeof ts === 'number' ? ts : ts);
      const now = new Date();
      const diff = now - d;
      const L = {
        zh: { yesterday: '昨天', daysAgo: n => `${n} 天前`, locale: 'zh-CN' },
        ja: { yesterday: '昨日', daysAgo: n => `${n} 日前`, locale: 'ja-JP' },
        en: { yesterday: 'Yesterday', daysAgo: n => `${n}d ago`, locale: 'en-US' },
      }[language] || { yesterday: 'Yesterday', daysAgo: n => `${n}d ago`, locale: 'en-US' };
      // 今天的会话显示具体时间——同日多条全写「今天」毫无区分度
      if (diff < 86400000 && d.getDate() === now.getDate()) return d.toLocaleTimeString(L.locale, { hour: '2-digit', minute: '2-digit', hour12: false });
      if (diff < 172800000) return L.yesterday;
      // 7 天内显示「X 天前」/「X days ago」,更早显示日期
      const days = Math.floor(diff / 86400000);
      if (days < 7) return L.daysAgo(days);
      return d.toLocaleDateString(L.locale, { month: 'short', day: 'numeric' });
    }

      </div>
    );

    const SettingsView = ({ activeTheme, setActiveTheme, language, setLanguage, superPerm, setSuperPerm, searchProvider, setSearchProvider, searchApiKey, setSearchApiKey, modelPreset, onChangeModelPreset, customModelName, setCustomModelName, customBaseUrl, setCustomBaseUrl, customApiKey, setCustomApiKey, savedModel, onConfirmModelConfig, onConfirmSearchConfig, modelConfigDirty, searchNeedsRestart, bs, t }) => {
      const isDark = activeTheme === 'dark';
      const [vllmDiscovery, setVllmDiscovery] = useState(null);
      const [vllmDiscovering, setVllmDiscovering] = useState(false);
      // 进设置页自动体检一次可选依赖装齐没; 之后用户可手动「重新检测」
      useEffect(() => {
        if (bridge.available && !(bs && bs.deps) && !(bs && bs.depsChecking)) bridge.checkDependencies();
      }, []);
      const presetOptions = [
        { key: 'local_vllm',  label: t.modelPresetLocalVllm },
        { key: 'deepseek',    label: t.modelPresetDeepseek },
        { key: 'kimi',        label: t.modelPresetKimi },
        { key: 'openai_compatible', label: t.modelPresetOpenaiCompatible },
        { key: 'qwen',        label: t.modelPresetQwen },
        { key: 'doubao',      label: t.modelPresetDoubao },
        { key: 'minimax',     label: t.modelPresetMinimax },
        { key: 'glm',         label: t.modelPresetGlm },
        { key: 'mimo',        label: t.modelPresetMimo },
      ];
      const vllmOnlineCandidates = vllmDiscovery && vllmDiscovery.candidates
        ? vllmDiscovery.candidates.filter(c => c.status !== 'offline')
        : [];
      async function handleDetectLocalVllm() {
        if (!bridge.available || vllmDiscovering) return;
        setVllmDiscovering(true);
        setVllmDiscovery(null);
        try {
          const result = await bridge.discoverLocalVllm({
            currentBaseUrl: customBaseUrl,
            savedBaseUrl: savedModel && savedModel.baseUrl,
          });
          setVllmDiscovery({ candidates: (result && result.candidates) || [] });
        } catch (e) {
          setVllmDiscovery({ error: String(e) });
        } finally {
          setVllmDiscovering(false);
        }
      }
      function handleUseVllmCandidate(candidate) {
        if (!candidate) return;
        if (candidate.base_url) setCustomBaseUrl(candidate.base_url);
        if (candidate.model) setCustomModelName(candidate.model);
        setCustomApiKey('');
      }
      function vllmStatusLabel(status) {
        if (status === 'busy') return t.vllmDetectBusy;
        if (status === 'ready') return t.vllmDetectReady;
        if (status === 'mismatch') return t.vllmDetectMismatch;
        return t.vllmDetectOffline;
      }
      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">

          {/* 标题随内容一起滚动：固定标题 + 硬裁切的滚动边界在视觉上打架 */}
          <div className="flex-1 overflow-y-auto px-16 pb-20 custom-scrollbar">
            <div className="max-w-[800px]">
              <h1 className="text-[32px] font-normal tracking-tight pt-12 pb-8">{t.settings}</h1>
              <div className="space-y-8">

              <SCard isDark={isDark} title={t.modelBackend}>
                <div className="space-y-6">
                  <SRow isDark={isDark} label={t.modelPreset} desc={t.modelBackendDesc}>
                    <div className="relative">
                      <select
                        value={modelPreset}
                        onChange={e => onChangeModelPreset(e.target.value)}
                        className={`appearance-none px-4 py-2 pr-10 rounded-lg text-[14px] font-medium outline-none transition-colors cursor-pointer ${
                          isDark ? 'bg-[#131314] text-[#E3E3E3] border border-[#444746] focus:border-[#A8C7FA]'
                                 : 'bg-white text-[#1F1F1F] border border-[#C4C7C5] focus:border-[#0B57D0]'
                        }`}
                      >
                        {presetOptions.map(opt => (
                          <option key={opt.key} value={opt.key}>{opt.label}</option>
                        ))}
                      </select>
                      <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
                        <ChevronDown size={16} className={isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'} />
                      </div>
                    </div>
                  </SRow>

                  {/* 输入框直接显示当前生效值（App 初始化时已用 PRESET_DEFAULTS 填充），不靠 placeholder 冒充 */}
                  <div className="space-y-4">
                    <SField isDark={isDark} label={t.customModelName} type="text"
                      value={customModelName} onChange={e => setCustomModelName(e.target.value)} />
                    <SField isDark={isDark} label={t.customBaseUrl} type="text"
                      value={customBaseUrl} onChange={e => setCustomBaseUrl(e.target.value)} />
	                    <SField isDark={isDark} label={t.customApiKey} type="password"
	                      value={customApiKey} onChange={e => setCustomApiKey(e.target.value)}
	                      placeholder={modelPreset === 'local_vllm' ? 'local-no-auth' : 'sk-...'} />
	                    {modelPreset === 'local_vllm' && (
	                      <div className={`rounded-xl border p-3 space-y-3 ${isDark ? 'border-[#333537] bg-[#131314]' : 'border-[#E0E3E7] bg-white'}`}>
	                        <div className="flex items-center justify-between gap-3">
	                          <span className={`text-[12px] ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>{t.vllmDetectHint}</span>
	                          <button
	                            onClick={handleDetectLocalVllm}
	                            disabled={vllmDiscovering || !bridge.available}
	                            className={`shrink-0 text-[13px] font-medium px-4 py-2 rounded-full transition-colors disabled:opacity-60 ${
	                              isDark ? 'bg-[#2B2C2F] text-[#E3E3E3] hover:bg-[#333537]'
	                                     : 'bg-[#F0F4F9] text-[#1F1F1F] hover:bg-[#E8EAED]'
	                            }`}
	                          >{vllmDiscovering ? t.detectingLocalVllm : t.detectLocalVllm}</button>
	                        </div>
	                        {vllmDiscovery && vllmDiscovery.error && (
	                          <div className={`text-[12px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>
	                            {t.vllmDetectError(vllmDiscovery.error)}
	                          </div>
	                        )}
	                        {vllmDiscovery && !vllmDiscovery.error && (
	                          <div className="space-y-2">
	                            <div className={`text-[12px] ${vllmOnlineCandidates.length ? (isDark ? 'text-[#93D5A6]' : 'text-[#137333]') : (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]')}`}>
	                              {vllmOnlineCandidates.length ? t.vllmDetectFound(vllmOnlineCandidates.length) : t.vllmDetectNone}
	                            </div>
	                            {vllmOnlineCandidates.map(candidate => {
	                              return (
	                                <div key={candidate.base_url} className={`flex items-center justify-between gap-3 rounded-lg px-3 py-2 ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F8FAFD]'}`}>
	                                  <div className="min-w-0">
	                                    <div className="flex items-center gap-2">
	                                      <span className="w-2 h-2 rounded-full bg-[#34A853]"></span>
	                                      <span className={`text-[13px] font-medium truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{candidate.base_url}</span>
	                                      <span className={`text-[11px] uppercase ${isDark ? 'text-[#93D5A6]' : 'text-[#137333]'}`}>{vllmStatusLabel(candidate.status)}</span>
	                                    </div>
	                                    <div className={`mt-1 text-[12px] truncate ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
	                                      {t.vllmDetectedModel}: {candidate.model || '—'} · {t.vllmDetectedContext}: {candidate.max_model_len || '—'}
	                                    </div>
	                                  </div>
	                                  <button
	                                    onClick={() => handleUseVllmCandidate(candidate)}
	                                    className={`shrink-0 text-[12px] font-medium px-3 py-1.5 rounded-full transition-colors ${
	                                      isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
	                                             : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
	                                    }`}
	                                  >{t.useVllmConfig}</button>
	                                </div>
	                              );
	                            })}
	                          </div>
	                        )}
	                      </div>
	                    )}
	                  </div>

                  {modelConfigDirty && (
                    <SActionBar isDark={isDark} message={t.modelDirtyHint}
                      actionLabel={t.confirmAndRestart} onAction={onConfirmModelConfig} />
                  )}
                </div>
              </SCard>

              <SCard isDark={isDark} title={t.searchBackend}>
                <div className="space-y-6">
                  <SRow isDark={isDark} label={t.searchSource} desc={t.searchBackendDesc}>
                    <SSegmented isDark={isDark} value={searchProvider} onChange={setSearchProvider}
                      options={[{ key: 'bing', label: 'Bing' }, { key: 'metaso', label: 'Metaso' }, { key: 'bocha', label: 'Bocha' }, { key: 'baidu', label: 'Baidu' }, { key: 'tavily', label: 'Tavily' }]} />
                  </SRow>

                  {searchProvider === 'bing' ? (
                    <span className={`text-[13px] block ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
                      {t.searchKeyHintBing}
                    </span>
                  ) : (
                    <div>
                      <SField isDark={isDark} label={t.searchKey} type="password"
                        value={searchApiKey} onChange={e => setSearchApiKey(e.target.value)}
                        placeholder={t.searchKeyPlaceholder} />
                      <span className={`text-[12px] mt-2 block ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
                        {searchProvider === 'metaso' ? t.searchKeyHintMetaso : searchProvider === 'baidu' ? t.searchKeyHintBaidu : searchProvider === 'tavily' ? t.searchKeyHintTavily : t.searchKeyHintBocha}
                      </span>

                      <div className={`mt-3 px-3 py-2 rounded-lg flex items-center justify-between gap-3 ${isDark ? 'bg-[#131314]' : 'bg-white'}`}>
                        <span className={`text-[12px] ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
                          {searchProvider === 'metaso' ? t.searchGetKeyMetasoSteps : searchProvider === 'baidu' ? t.searchGetKeyBaiduSteps : searchProvider === 'tavily' ? t.searchGetKeyTavilySteps : t.searchGetKeyBochaSteps}
                        </span>
                        <button
                          onClick={() => {
                            const url = searchProvider === 'metaso'
                              ? 'https://metaso.cn/search-api/api-keys'
                              : searchProvider === 'baidu'
                              ? 'https://console.bce.baidu.com/iam/#/iam/apikey/list'
                              : searchProvider === 'tavily'
                              ? 'https://app.tavily.com/'
                              : 'https://open.bochaai.com/';
                            if (bridge.available) bridge.openExternalUrl(url);
                          }}
                          className={`text-[12px] font-medium px-3 py-1 rounded-full whitespace-nowrap transition-colors ${
                            isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
                                   : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
                          }`}
                        >{t.searchGetKey} ↗</button>
                      </div>
                    </div>
                  )}

                  {searchNeedsRestart && (
                    <SActionBar isDark={isDark} message={t.searchRestartHint}
                      actionLabel={t.confirmAndRestart} onAction={onConfirmSearchConfig} />
                  )}
                </div>
              </SCard>

              <SCard isDark={isDark} title={t.sysPerm}>
                <SRow isDark={isDark} label={t.sudo} desc={t.sudoDesc}>
                  <button
                    onClick={setSuperPerm}
                    className={`w-[52px] h-[32px] rounded-full p-[2px] transition-colors duration-300 relative ${superPerm ? (isDark ? 'bg-[#A8C7FA]' : 'bg-[#0B57D0]') : (isDark ? 'bg-[#444746]' : 'bg-[#747775]')}`}
                  >
                    {/* off 态 thumb 暗色下用浅灰——原深蓝在深灰轨道上几乎不可见 */}
                    <div className={`w-[28px] h-[28px] rounded-full shadow-sm transform transition-transform duration-300 ${superPerm ? (isDark ? 'bg-[#041E49]' : 'bg-white') : (isDark ? 'bg-[#C4C7C5]' : 'bg-white')} ${superPerm ? 'translate-x-[20px]' : 'translate-x-0'}`} />
                  </button>
                </SRow>
              </SCard>

              <SCard isDark={isDark} title={t.appearance}>
                <div className="space-y-8">
                  <SRow isDark={isDark} label={t.lang} desc={t.langDesc}>
                    <SSegmented isDark={isDark} value={language} onChange={setLanguage}
                      options={[{ key: 'zh', label: '中文' }, { key: 'en', label: 'English' }, { key: 'ja', label: '日本語' }]} />
                  </SRow>
                  <SRow isDark={isDark} label={t.theme} desc={t.themeDesc}>
                    <SSegmented isDark={isDark} value={activeTheme} onChange={setActiveTheme}
                      options={[{ key: 'light', label: t.light }, { key: 'dark', label: t.dark }]} />
                  </SRow>
                </div>
              </SCard>

              {/* 版本与更新: 链路 检查 → 下载(进度) → pkexec 安装 → 重启 */}
              <SCard isDark={isDark} title={t.versionUpdate}>
                {(() => {
                  const upd = bs && bs.updateInfo;
                  const checking = !!(bs && bs.updateChecking);
                  const downloading = !!(bs && bs.updateDownloading);
                  const ready = !!(bs && bs.updateReady);
                  const progress = (bs && bs.updateProgress) || 0;
                  const subText = isDark ? 'text-[#C4C7C5]' : 'text-[#444746]';
                  return (
                    <div>
                      <div className="flex items-center justify-between">
                        <div className="pr-8">
                          <span className="text-[16px] block mb-1">
                            {t.curVer} v{(upd && upd.current_version) || '—'}
                          </span>
                          <span className={`text-[14px] leading-relaxed block ${subText}`}>
                            {checking ? t.checking
                              : (bs && bs.updateCheckError === 'latest') ? t.upToDate
                              : (bs && bs.updateCheckError) ? (t.updateCheckFailed + ': ' + bs.updateCheckError)
                              : (upd && upd.available) ? (t.newVersionFound + ': v' + upd.latest_version)
                              : ''}
                          </span>
                        </div>
                        <button
                          onClick={() => bridge.available && !checking && bridge.checkForUpdate()}
                          disabled={checking}
                          className={`text-[12px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${
                            isDark ? 'bg-[#333537] text-[#E3E3E3] hover:bg-[#444746]'
                                   : 'bg-[#E1E5EA] text-[#1F1F1F] hover:bg-[#D3D9E0]'
                          } ${checking ? 'opacity-50' : ''}`}
                        >{t.checkUpdate}</button>
                      </div>

                      {upd && upd.available && (
                        <div className={`mt-5 pt-5 border-t ${isDark ? 'border-[#333537]' : 'border-[#DDE3EA]'}`}>
                          {upd.notes && (
                            <div className="mb-4">
                              <span className={`text-[12px] block mb-1 ${subText}`}>{t.updateNotes}</span>
                              <span className="text-[14px] leading-relaxed whitespace-pre-wrap block">{upd.notes}</span>
                            </div>
                          )}

                          {ready ? (
                            <div className="flex items-center justify-between">
                              <span className="text-[14px]">✅ {t.updateComplete}</span>
                              <button
                                onClick={() => bridge.available && bridge.restartApp()}
                                className={`text-[12px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${
                                  isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
                                         : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
                                }`}
                              >{t.restartNow}</button>
                            </div>
                          ) : downloading ? (
                            <div>
                              <div className="flex items-center justify-between mb-2">
                                <span className={`text-[12px] ${subText}`}>{progress >= 100 ? t.installing : t.downloading}</span>
                                <span className={`text-[12px] ${subText}`}>{progress}%</span>
                              </div>
                              <div className={`h-[6px] rounded-full overflow-hidden ${isDark ? 'bg-[#333537]' : 'bg-[#DDE3EA]'}`}>
                                <div className="h-full rounded-full transition-all duration-200" style={{ width: progress + '%', backgroundColor: '#0B57D0' }} />
                              </div>
                              {/* 取消仅下载阶段可用; 进 install(pkexec/apt)后系统接管不可中断 */}
                              {progress < 100 && (
                                <div className="flex justify-end mt-3">
                                  <button
                                    onClick={() => bridge.available && bridge.cancelUpdate()}
                                    disabled={!!(bs && bs.updateCancelling)}
                                    className={`text-[12px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${
                                      isDark ? 'bg-[#333537] text-[#E3E3E3] hover:bg-[#444746]'
                                             : 'bg-[#E1E5EA] text-[#1F1F1F] hover:bg-[#D3D9E0]'
                                    } ${(bs && bs.updateCancelling) ? 'opacity-50' : ''}`}
                                  >{(bs && bs.updateCancelling) ? t.cancelling : t.cancel}</button>
                                </div>
                              )}
                            </div>
                          ) : (
                            <button
                              onClick={() => bridge.available && bridge.downloadAndInstallUpdate()}
                              className={`text-[12px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${
                                isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
                                       : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
                              }`}
                            >{t.downloadInstall} (v{upd.latest_version})</button>
                          )}

                          {bs && bs.updateError && (
                            <span className="text-[13px] mt-3 block text-[#EA4335]">⚠️ {bs.updateError}</span>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })()}
              </SCard>

              {/* 依赖体检: 进页自动检测,只报缺失项 + 一键(pkexec apt)安装,成功/失败提示 */}
              <SCard isDark={isDark} title={t.depCheckTitle}>
                {(() => {
                  const deps = (bs && bs.deps) || [];
                  const checking = !!(bs && bs.depsChecking);
                  const installing = !!(bs && bs.depsInstalling);
                  const installErr = bs && bs.depsInstallError;
                  const subText = isDark ? 'text-[#C4C7C5]' : 'text-[#444746]';
                  const checked = deps.length > 0;
                  const missing = deps.filter(d => !d.installed);
                  const busy = checking || installing;
                  const btnGhost = isDark ? 'bg-[#333537] text-[#E3E3E3] hover:bg-[#444746]' : 'bg-[#E1E5EA] text-[#1F1F1F] hover:bg-[#D3D9E0]';
                  const btnPrimary = isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]' : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]';
                  return (
                    <div>
                      <div className="flex items-center justify-between">
                        <span className={`text-[14px] leading-relaxed pr-4 ${subText}`}>
                          {checking ? t.depChecking
                            : installing ? t.depInstalling
                            : !checked ? t.depChecking
                            : missing.length === 0 ? ('✅ ' + t.depAllOk)
                            : ('⚠️ ' + missing.length + t.depMissingSuffix)}
                        </span>
                        <button
                          onClick={() => bridge.available && !busy && bridge.checkDependencies()}
                          disabled={busy}
                          className={`text-[12px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${btnGhost} ${busy ? 'opacity-50' : ''}`}
                        >{t.depRecheck}</button>
                      </div>

                      {checked && missing.length > 0 && (
                        <div className={`mt-4 pt-4 border-t ${isDark ? 'border-[#333537]' : 'border-[#DDE3EA]'}`}>
                          <div className="space-y-2 mb-4">
                            {missing.map(d => (
                              <div key={d.key} className="flex items-center justify-between text-[14px]">
                                <span>⚠️ {(t['dep_' + d.key] || d.key)}</span>
                                <span className={`text-[12px] ${subText}`}>{d.apt}</span>
                              </div>
                            ))}
                          </div>
                          <div className="flex items-center justify-between gap-3">
                            <span className={`text-[12px] ${subText}`}>{t.depInstallNote}</span>
                            <button
                              onClick={() => bridge.available && !busy && bridge.installDependencies()}
                              disabled={busy}
                              className={`text-[12px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${btnPrimary} ${busy ? 'opacity-50' : ''}`}
                            >{installing ? t.depInstalling : t.depInstallBtn}</button>
                          </div>
                          {installErr && <span className="text-[13px] mt-3 block text-[#EA4335]">❌ {installErr}</span>}
                        </div>
                      )}
                    </div>
                  );
                })()}
              </SCard>

              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // Chat View (Gemini Centered Style + Messages)
    // ==========================================
    // 安装工具后新建会话弹出的介绍卡片（纯前端，不发 LLM query，点 chip 才发消息）
    const ToolWelcomeCard = ({ toolId, theme, onSend }) => {
      const isDark = theme === 'dark';
      const [hovered, setHovered] = useState(null);
      const tool = tsToolsData.find(t => t.backendId === toolId);
      if (!tool || !tool.welcomeQueries) return null;
      const ToolIcon = tool.icon || Sparkles;
      return (
        <div className="flex justify-start">
          <div className={`max-w-[800px] w-full rounded-[2rem] overflow-hidden border transition-all ${
            isDark ? 'bg-[#1E1F20] border-[#3A3A3C]/60' : 'bg-white border-slate-100 shadow-lg shadow-slate-200/30'
          }`}>
            <div className={`relative p-5 border-b flex items-center gap-3.5 ${
              isDark ? 'bg-[#1E1F20] border-[#3A3A3C]/60' : 'bg-gradient-to-b from-blue-50/80 to-white border-slate-100'
            }`}>
              <div className="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                <ToolIcon size={22} className="text-white" />
              </div>
              <div>
                <div className={`text-[1.05rem] font-bold tracking-tight ${isDark ? 'text-slate-100' : 'text-slate-800'}`}>{tool.title}</div>
                <div className={`flex items-center text-xs mt-0.5 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                  <span className="relative flex h-2 w-2 mr-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                  </span>
                  系统已就绪
                </div>
              </div>
            </div>
            <div className="p-5">
              <p className={`leading-relaxed text-[15px] ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                {tool.desc.split('。')[0]}。自然语言提问即可。
              </p>
              <div className="flex items-center my-5">
                <div className={`flex-grow h-px ${isDark ? 'bg-gradient-to-r from-transparent via-[#3A3A3C] to-transparent' : 'bg-gradient-to-r from-transparent via-slate-200 to-transparent'}`}></div>
                <span className={`px-4 text-[11px] uppercase tracking-wider font-semibold flex items-center gap-1.5 ${isDark ? 'text-slate-500' : 'text-slate-400'}`}>
                  <Sparkles size={13} />
                  <span>试试问我</span>
                </span>
                <div className={`flex-grow h-px ${isDark ? 'bg-gradient-to-r from-transparent via-[#3A3A3C] to-transparent' : 'bg-gradient-to-r from-transparent via-slate-200 to-transparent'}`}></div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                {tool.welcomeQueries.map((q, i) => (
                  <button
                    key={i}
                    onMouseEnter={() => setHovered(i)}
                    onMouseLeave={() => setHovered(null)}
                    onClick={() => onSend && onSend(q)}
                    className={`group relative flex items-center justify-between p-3 rounded-2xl border text-left transition-all duration-200 ${
                      hovered === i
                        ? (isDark ? 'border-blue-500/30 bg-blue-500/10 shadow-sm' : 'border-blue-200/80 bg-blue-50/50 shadow-sm')
                        : (isDark ? 'border-[#3A3A3C]/50 bg-[#2A2B2D]/30 hover:border-[#555]' : 'border-slate-200/60 bg-slate-50/30 hover:border-blue-200')
                    }`}
                  >
                    <span className={`text-sm font-medium transition-colors ${
                      hovered === i ? (isDark ? 'text-blue-300' : 'text-blue-700') : (isDark ? 'text-slate-300' : 'text-slate-700')
                    }`}>{q}</span>
                    <ChevronRight size={15} className={`transition-all duration-200 ${
                      hovered === i ? (isDark ? 'text-blue-400 opacity-100' : 'text-blue-500 opacity-100') : 'opacity-0 -translate-x-2'
                    }`} />
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const ChatView = ({ theme, t, bs, prefill, onPrefillConsumed, onOpenEditor, justInstalledTool, setJustInstalledTool }) => {
      const isDark = theme === 'dark';
      const [inputText, setInputText] = useState('');
      const [artifactsOpen, setArtifactsOpen] = useState(false);
      const scrollRef = useRef(null);
      const chatItems = bs ? bs.chatItems : [];
      const busy = bs ? bs.busy : false;
      const hasMessages = chatItems.length > 0;
      const attachments = (bs && bs.attachments) || [];
      const queued = (bs && bs.queued) || []; // 排队待发消息（当前 session 生成中时积压）
      const ctxTokens = (bs && bs.tokens) || null; // {input, max}，chat:usage 每轮更新
      const ctxPct = ctxTokens && ctxTokens.max > 0 ? ctxTokens.input / ctxTokens.max : 0;
      const fmtCtxTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
      const artifactCount = (bs && bs.artifacts) ? bs.artifacts.length : 0;
      const hasSkill = !!(bs && bs.workflow && bs.workflow.activeSkillName);
      let lastUserId = null;
      for (let i = chatItems.length - 1; i >= 0; i--) { if (chatItems[i].type === 'user') { lastUserId = chatItems[i].id; break; } }

      // 工作流启用时预填输入框
      useEffect(() => {
        if (prefill) { setInputText(prefill); if (onPrefillConsumed) onPrefillConsumed(); }
      }, [prefill]);

      // Auto-scroll：直接滚内部容器到底（绝不动外层窗口，避免内容被顶到看不见/拉不动）
      useEffect(() => {
        const el = scrollRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, [chatItems.length, chatItems[chatItems.length - 1]?.html]);

      // 安装工具后新建会话 → 本地显示欢迎卡片（不发 LLM query，不浪费 token）
      const [welcomeToolId, setWelcomeToolId] = useState(null);
      useEffect(() => {
        if (justInstalledTool) {
          setWelcomeToolId(justInstalledTool);
          if (setJustInstalledTool) setJustInstalledTool(null);
        }
      }, [justInstalledTool]);

      function handleSend() {
        // 不再因 busy 拦截:bridge.sendMessage 在生成中会把这句排队(本轮跑完自动发)。
        const hasReady = attachments.some(a => a.status === 'ready');
        if (!inputText.trim() && !hasReady) return;
        if (bridge.available) bridge.sendMessage(inputText.trim());
        setInputText('');
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      }

      function handleCancel() {
        if (bridge.available) bridge.cancelGeneration();
      }

      function handlePaste(e) {
        const items = (e.clipboardData && e.clipboardData.items) || [];
        for (const it of items) {
          if (it.type && it.type.indexOf('image/') === 0) {
            const file = it.getAsFile();
            if (!file) continue;
            e.preventDefault();
            const reader = new FileReader();
            reader.onload = () => {
              const bytes = Array.from(new Uint8Array(reader.result));
              const ext = (file.type.split('/')[1] || 'png');
              if (bridge.available) bridge.addPasteImage(`paste-${Date.now()}.${ext}`, bytes);
            };
            reader.readAsArrayBuffer(file);
          }
        }
      }

      return (
        <div className="flex-1 flex flex-col w-full h-full min-h-0 relative z-10 animate-in fade-in duration-300">
          {artifactsOpen && <ArtifactsPanel bs={bs} theme={theme} t={t} onClose={() => setArtifactsOpen(false)} />}

          {/* Top Header (浮动) */}
          <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-20 pointer-events-none">
            <div className="flex items-center gap-2">
              {/* [plan/yolo 收敛] Plan 模式入口已下线：全局 Yolo 单模式。
                  ModeHeader 组件及 bridge 逻辑保留，取消注释即恢复，待重评是否彻底移除。
                  (品悟开关已彻底移除——v2 评审方案被推翻,等新方案。) */}
              {/* <ModeHeader bs={bs} theme={theme} /> */}
            </div>
            <button
              onClick={() => setArtifactsOpen(true)}
              className={`pointer-events-auto px-4 py-2 rounded-full text-[14px] font-medium flex items-center gap-2 ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3] hover:bg-[#333537]' : 'bg-white text-[#1F1F1F] hover:bg-[#F0F4F9] shadow-sm'}`}>
              <Package size={16} /> {t.artifacts}
              {artifactCount > 0 && <span className={`text-[11px] px-1.5 rounded-full ${isDark ? 'bg-[#A8C7FA] text-[#062E6F]' : 'bg-[#0B57D0] text-white'}`}>{artifactCount}</span>}
            </button>
          </div>


          {/* Main Chat Area */}
          <div ref={scrollRef} className={`flex-1 min-h-0 overflow-y-auto px-4 md:px-20 lg:px-40 pb-40 custom-scrollbar flex flex-col ${hasSkill ? 'pt-3' : 'pt-20'} ${hasMessages ? 'justify-start' : 'items-center justify-center'}`}>

            {!hasMessages && !welcomeToolId && (
              /* Gemini Style Centered Empty State */
              <div className="text-center mb-12 animate-in slide-in-from-bottom-4 duration-500">
                <h1 className={`text-[44px] font-normal mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                  {t.chatGreeting}
                </h1>
              </div>
            )}

            {!hasMessages && welcomeToolId && (
              <div className="max-w-[800px] w-full mx-auto mt-8">
                <ToolWelcomeCard
                  toolId={welcomeToolId}
                  theme={theme}
                  onSend={(q) => {
                    setWelcomeToolId(null);
                    if (bridge.available) bridge.sendMessage(q);
                  }}
                />
              </div>
            )}

            {hasMessages && (
              <div className="max-w-[800px] w-full mx-auto space-y-4">
                {(() => {
                  let lastArtId = null; // 只最新成品卡有品悟入口:历史卡召唤会审到最新文件、造成误导
                  for (let ci = chatItems.length - 1; ci >= 0; ci--) { if (chatItems[ci].type === 'artifact_card') { lastArtId = chatItems[ci].id; break; } }
                  return chatItems.map((item) => (
                    <ChatBubble key={item.id} item={item} theme={theme} t={t} onPrefill={(txt) => setInputText(txt)} editable={!busy && item.id === lastUserId} onOpenEditor={onOpenEditor} isLatestArtifact={item.id === lastArtId} />
                  ));
                })()}
                {busy && <ThinkingBubble thinking={bs && bs.thinking} theme={theme} t={t} />}
              </div>
            )}

          </div>

          {/* Floating Input Area */}
          <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-full max-w-[800px] px-4 z-20">
            {/* 排队待发消息 chips（生成中继续输入会积压到这里，本轮跑完自动发） */}
            {queued.length > 0 && (
              <div className="flex flex-col gap-1 mb-2 px-2">
                {queued.map((q) => (
                  <div key={q.id} className={`flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full text-[12px] self-start max-w-full ${isDark ? 'bg-[#2A2B2D] text-[#C4C7C5]' : 'bg-[#EAEDF1] text-[#444746]'}`}>
                    <span className="opacity-60">{t.queuedTag}</span>
                    <span className="max-w-[480px] truncate">{q.displayText}</span>
                    <button onClick={() => bridge.removeQueued(q.id)} title={t.queuedCancel} className={`w-5 h-5 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537]' : 'hover:bg-[#F0F4F9]'}`}>×</button>
                  </div>
                ))}
              </div>
            )}
            {/* 附件 chips */}
            {attachments.length > 0 && (
              <div className="flex flex-wrap gap-2 mb-2 px-2">
                {attachments.map((a) => (
                  <div key={a.id} className={`flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full text-[12px] ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3]' : 'bg-white text-[#1F1F1F] shadow-sm'}`}>
                    <span>📎</span>
                    <span className="max-w-[160px] truncate">{a.basename}</span>
                    <span className={a.status === 'error' ? 'text-[#F28B82]' : a.status === 'parsing' ? 'opacity-60' : 'text-[#93D5A6]'}>
                      {a.status === 'parsing' ? t.attachParsing : a.status === 'error' ? t.attachFailed : '✓'}
                    </span>
                    <button onClick={() => bridge.removeAttachment(a.id)} className={`w-5 h-5 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537]' : 'hover:bg-[#F0F4F9]'}`}>×</button>
                  </div>
                ))}
              </div>
            )}
            <div className={`flex items-center gap-3 p-2 rounded-full shadow-lg ${isDark ? 'bg-[#1E1F20]' : 'bg-white'}`}>

              <button onClick={() => bridge.available && bridge.pickAndAttach()} title={t.attachAdd}
                className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}>
                <Paperclip size={20} />
              </button>

              <input
                type="text"
                placeholder={t.placeholder}
                value={inputText}
                onChange={e => setInputText(e.target.value)}
                onKeyDown={handleKeyDown}
                onPaste={handlePaste}
                className={`flex-1 bg-transparent border-none outline-none text-[16px] py-3 ${isDark ? 'placeholder:text-[#C4C7C5]' : 'placeholder:text-gray-400'}`}
              />

              {busy ? (
                <button
                  onClick={handleCancel}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#F28B82] hover:bg-[#333537]' : 'text-[#C5221F] hover:bg-[#F0F4F9]'}`}
                >
                  <StopCircle size={20} />
                </button>
              ) : (
                <button
                  onClick={handleSend}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}
                >
                  {(inputText.trim() || attachments.some(a => a.status === 'ready')) ? <Send size={18} /> : <Mic size={20} />}
                </button>
              )}
            </div>
            {ctxTokens && ctxTokens.input > 0 && (
              <div className={`mt-1.5 px-5 text-[11px] font-mono ${
                ctxPct >= 0.9 ? (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]')
                : ctxPct >= 0.75 ? (isDark ? 'text-[#F9AB00]' : 'text-[#B06000]')
                : (isDark ? 'text-[#5F6368]' : 'text-[#9AA0A6]')}`}>
                {t.ctxUsage} {fmtCtxTok(ctxTokens.input)} / {fmtCtxTok(ctxTokens.max)} · {Math.round(ctxPct * 100)}%
              </div>
            )}
            <div className="flex items-center justify-center mt-3">
               <p className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.disclaimer}</p>
            </div>
          </div>

        </div>
      );
    };

    // ==========================================
    // Chat Bubble (message rendering)
    // ==========================================
    const UserBubble = ({ item, theme, editable, t }) => {
      const isDark = theme === 'dark';
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(item.text);
      function commit() { const tx = val.trim(); setEditing(false); if (tx && bridge.available) bridge.editLastTurn(tx); }
      if (editing) {
        return (
          <div className="flex justify-end">
            <div className="max-w-[85%] w-full">
              <textarea autoFocus value={val} onChange={e => setVal(e.target.value)}
                rows={Math.min(6, Math.max(1, val.split('\n').length))}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); } else if (e.key === 'Escape') { setEditing(false); setVal(item.text); } }}
                className={`w-full rounded-[16px] px-4 py-2 text-[15px] outline-none ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`} />
              <div className="flex gap-2 justify-end mt-1">
                <button className={cardBtnCls(isDark)} onClick={() => { setEditing(false); setVal(item.text); }}>{t.cpCancel}</button>
                <button className={cardBtnCls(isDark, 'primary')} onClick={commit}>{t.resend}</button>
              </div>
            </div>
          </div>
        );
      }
      if (item.pinvouTransfer) {
        const isWu = item.pinvouTransfer === '悟';
        const tint = isWu ? (isDark ? '#8AB4F8' : '#1967D2') : (isDark ? '#D0BCFF' : '#7C3AED');
        const tintBg = isWu ? (isDark ? 'bg-[#1A73E8]/10' : 'bg-[#1A73E8]/[0.06]') : (isDark ? 'bg-[#D0BCFF]/10' : 'bg-[#7C3AED]/[0.07]');
        return (
          <div className="flex justify-end">
            <div className="max-w-[85%]">
              <div className="flex items-center justify-end gap-1 mb-1 text-[11px] font-medium" style={{ color: tint }}>
                <span>{isWu ? '✨' : '📋'}</span><span>{'Pinvou · ' + item.pinvouTransfer + ' · 转交修订'}</span>
              </div>
              <div className={`px-5 py-3 rounded-[20px] text-[15px] leading-relaxed whitespace-pre-wrap ${tintBg} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{item.text}</div>
            </div>
          </div>
        );
      }
      return (
        <div className="flex justify-end group">
          <div className="flex items-center gap-2 max-w-[85%]">
            {editable && <button title={t.editResend} onClick={() => { setVal(item.text); setEditing(true); }} className={`opacity-0 group-hover:opacity-100 text-[13px] shrink-0 ${isDark ? 'text-[#8E8E8E] hover:text-[#C4C7C5]' : 'text-[#9AA0A6] hover:text-[#444746]'}`}>✏️</button>}
            <div className={`px-5 py-3 rounded-[20px] text-[15px] leading-relaxed whitespace-pre-wrap ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`}>{item.text}</div>
          </div>
        </div>
      );
    };

    // 思考指示器：Braille 转圈 + 思考中/调用工具 + 计时（每阶段切换重置）
    const BRAILLE = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
    const ThinkingBubble = ({ thinking, theme, t }) => {
      const isDark = theme === 'dark';
      const [frame, setFrame] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const phase = thinking ? thinking.phase : 'thinking';
      const toolName = thinking ? thinking.toolName : '';
      const startedAt = (thinking && thinking.startedAt) || Date.now();
      useEffect(() => {
        setFrame(0); setElapsed(0);
        const id = setInterval(() => {
          setFrame(f => (f + 1) % BRAILLE.length);
          setElapsed(Math.floor((Date.now() - startedAt) / 1000));
        }, 100);
        return () => clearInterval(id);
      }, [startedAt, phase, toolName]);
      let text;
      if (phase === 'tool' && toolName) {
        text = t.thinkingCall(toolName, elapsed);
      } else {
        const suffix = elapsed >= 120 ? ` · ${t.hintSlow120}` : elapsed >= 30 ? ` · ${t.hintSlow30}` : '';
        text = `${t.thinkingLabel}... ${elapsed}s${suffix}`;
      }
      return (
        <div className="flex justify-start">
          <div className={`text-[13px] font-mono px-3 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#A8C7FA]' : 'bg-[#F0F4F9] text-[#0B57D0]'}`}>
            {BRAILLE[frame]} {text}
          </div>
        </div>
      );
    };

    // ③ 卡牌制造专家: 从助手消息渲染后的 html 里抠出 ```persona-card 草稿块 → 解析成卡。
    function htmlUnescape(s) {
      return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
    }
    function asDraft(d) {
      if (!d || typeof d !== 'object' || !d.name || !d.body) return null;
      return { name: d.name, dept: d.dept || 'specialized', emoji: d.emoji || '🃏', color: d.color || '', description: d.description || '', body: d.body };
    }
    // 扫所有 ```代码块,任何能解析成「含 name+body 的 JSON」的就当卡牌草稿。
    // 不强求 ```persona-card 标签 —— 小模型常打 ```json 或不打标签,放宽识别更鲁棒。
    // 形状校验(name+body)避免把别的 JSON 误判成草稿。明确 persona-card 标签的优先。
    // 返回 { draft, html }:html 是把那段原始 JSON 块抹掉后的版本(用户只看友好草稿卡,不看机器载荷)。
    function parsePersonaDraft(html) {
      if (!html || html.indexOf('{') < 0) return { draft: null, html: html };
      var re = /<pre[^>]*>\s*<code([^>]*)>([\s\S]*?)<\/code>\s*<\/pre>/g, m, chosen = null, chosenDraft = null;
      while ((m = re.exec(html))) {
        var raw = htmlUnescape(m[2]).trim();
        if (raw.charAt(0) !== '{') continue;
        try {
          var draft = asDraft(JSON.parse(raw));
          if (!draft) continue;
          if (/persona-card/.test(m[1])) { chosen = m[0]; chosenDraft = draft; break; } // 明确标签优先
          if (!chosenDraft) { chosen = m[0]; chosenDraft = draft; }
        } catch (e) { /* 非 JSON 块,跳过 */ }
      }
      if (!chosenDraft) return { draft: null, html: html };
      return { draft: chosenDraft, html: html.replace(chosen, '') };
    }
    // 流式中: JSON 还没闭合无法解析,把正在生成的卡牌代码块折叠成占位,避免原始 JSON 一直刷屏。
    function hideStreamingDraft(html, label) {
      if (!html) return html;
      var m = /<pre[^>]*>\s*<code[^>]*persona-card[\s\S]*$/i.exec(html); // persona-card 标签块(到末尾)
      if (!m) m = /<pre[^>]*>\s*<code[^>]*>\s*\{[\s\S]*?(?:name|&quot;name)[\s\S]*$/i.exec(html); // 兜底: 以 { 开头且含 name 的块
      if (!m) return html;
      return html.slice(0, m.index) + '<div style="margin-top:.5em;opacity:.7;font-size:13px">' + (label || '🃏 正在设计卡牌…') + '</div>';
    }

    const ChatBubble = ({ item, theme, onPrefill, editable, onOpenEditor, t, isLatestArtifact }) => {
      const isDark = theme === 'dark';

      if (item.type === 'artifact_card') return <ArtifactCard item={item} theme={theme} t={t} isLatest={isLatestArtifact} />;
      if (item.type === 'plan_card') return <PlanCard item={item} theme={theme} t={t} onPrefill={onPrefill} />;
      if (item.type === 'plan_stuck' || item.type === 'execution_stuck') return <PlanStuckCard item={item} theme={theme} t={t} />;
      if (item.type === 'plan_text_fallback') return <PlanFallbackCard item={item} theme={theme} t={t} />;
      if (item.type === 'careful_blocked') return <CarefulBlockedCard item={item} theme={theme} t={t} />;
      if (item.type === 'user_input') return <UserInputCard item={item} theme={theme} t={t} />;
      if (item.type === 'user') return <UserBubble item={item} theme={theme} editable={editable} t={t} />;

      if (item.type === 'assistant') {
        if (item.streaming && !item.html) return null; // 空流式气泡交给 ThinkingBubble 表示
        const html = item.html || '';
        const pd = item.streaming ? { draft: null, html: hideStreamingDraft(html, t && t.cpDesigning) } : parsePersonaDraft(html);
        // 草稿是否已存入(按名字在已加载的卡池里找同名自制卡 → 派生"已存入",免单独持久化)
        const draftSaved = pd.draft && bridge.available && bridge.getPersonas
          && bridge.getPersonas().some(function(c){ return c && c.source === 'user' && c.name === pd.draft.name; });
        return (
          <div className="flex justify-start">
            <div className={`max-w-[95%] ${isDark ? 'dark-code' : 'light-code'}`}>
              <div
                className={`msg-md text-[15px] leading-relaxed ${item.streaming ? 'streaming-cursor' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}
                dangerouslySetInnerHTML={{ __html: pd.html || '' }}
              />
              {pd.draft ? (
                <div className="mt-2 rounded-xl border p-3 flex items-center gap-3 max-w-[460px]" style={{ background: isDark?'rgba(124,58,237,.10)':'rgba(124,58,237,.06)', borderColor:'rgba(149,128,255,.45)' }}>
                  <div className="w-9 h-9 rounded-lg flex items-center justify-center text-[18px] shrink-0" style={{ background:'rgba(149,128,255,.2)' }}>{pd.draft.emoji}</div>
                  <div className="min-w-0 flex-1">

            const s = args.start_line || 1;
            return base + ' · ' + t.tsLine + ' ' + s + (args.max_lines ? '-' + (s + args.max_lines - 1) : '+');
          }
          return base;
        }
        case 'write_file':
        case 'append_file':
        case 'edit_file':
          return toolBasename(args.path);
        case 'list_dir':
          return toolBasename(args.path || '.') || '.';
        case 'grep_files':
          return args.pattern ? '"' + args.pattern + '"' : '';
        case 'file_search':
          return args.query ? '"' + args.query + '"' : '';

    const isReceipt = (text) => typeof text === 'string' && text.trim().startsWith('[TOOL_OUTPUT_RECEIPT]');

      const fields = {};
      String(text).split('\n').forEach((line) => {

                      className={`w-full py-3 text-[17px] font-semibold text-center transition-colors ${
                        isDark ? 'text-[#0A84FF] active:bg-white/5' : 'text-[#007AFF] active:bg-slate-100'
                      }`}
                    >
                      新建会话
                    </button>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    };

    // API Key 配置弹窗（需要 config_fields 的工具安装前弹出）
    const TsConfigDialog = ({ config, theme, onConfirm, onCancel }) => {
      const isDark = theme === 'dark';
      if (!config) return null;
      const [values, setValues] = useState({});
      const field = config.fields[0]; // v1 只支持单个配置字段
      const canSubmit = field ? (values[field.key] || '').trim().length > 0 : false;
      return (
        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/40 backdrop-blur-sm">
          <div
            className={`w-[280px] rounded-[20px] overflow-hidden shadow-2xl ${isDark ? 'bg-[#2C2C2E]' : 'bg-white/95 backdrop-blur-xl'}`}
            style={{ animation: 'tsAlertIn .2s ease-out' }}
          >
            <div className="px-6 pt-6 pb-4 text-center">
              <div className={`text-[17px] font-semibold mb-4 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                配置「{config.name}」
              </div>
              {field && (
                <div className="text-left mb-3">
                  <label className={`text-[13px] font-medium mb-1.5 block ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                    {field.label}
                  </label>
                  <input
                    type="text"
                    placeholder={field.placeholder || "sk-..."}
                    value={values[field.key] || ''}
                    onChange={e => setValues(v => ({ ...v, [field.key]: e.target.value }))}
                    className={`w-full px-3 py-2 rounded-lg text-[14px] outline-none transition-colors ${
                      isDark
                        ? 'bg-[#1C1C1E] border border-[#3A3A3C] text-white placeholder-slate-500 focus:border-[#0A84FF]'
                        : 'bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:border-[#007AFF]'
                    }`}
                  />
                </div>
              )}
              {field && field.helpUrl && (
                <button
                  onClick={() => window.__TAURI__.core.invoke('open_external_url', { url: field.helpUrl })}
                  className={`text-[13px] ${isDark ? 'text-[#0A84FF]' : 'text-[#007AFF]'} hover:underline`}
                >
                  免费获取 →
                </button>
              )}
              {field && field.helpText && (
                <div className={`text-[12px] mt-1 leading-relaxed ${isDark ? 'text-slate-500' : 'text-slate-400'}`}>
                  {field.helpText}
                </div>
              )}
            </div>
            <div className={`border-t ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
              <button
                onClick={onCancel}
                className={`w-full py-3 text-[17px] font-normal text-center transition-colors ${isDark ? 'text-[#0A84FF] active:bg-white/5' : 'text-[#007AFF] active:bg-slate-100'}`}
              >
                取消
              </button>
            </div>
            <div className={`border-t ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
              <button
                onClick={() => canSubmit && onConfirm(values)}
                disabled={!canSubmit}
                className={`w-full py-3 text-[17px] font-semibold text-center transition-colors ${
                  canSubmit
                    ? (isDark ? 'text-[#0A84FF] active:bg-white/5' : 'text-[#007AFF] active:bg-slate-100')
                    : (isDark ? 'text-slate-600' : 'text-slate-300')
                }`}
              >
                安装
              </button>
            </div>
          </div>
        </div>
      );
    };

    const ToolStoreView = ({ theme, onNewChat }) => {
      const isDark = theme === 'dark';
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('all');
      const [selectedTool, setSelectedTool] = useState(null);
      const featuredScrollRef = useRef(null);
      const [isFeaturedHovered, setIsFeaturedHovered] = useState(false);
      const [toolStates, setToolStates] = useState({});
      const [busyId, setBusyId] = useState(null);
      const [alert, setAlert] = useState({ visible: false, loading: false, title: '', subtitle: '', isInstall: false, isError: false });
      const [configDialog, setConfigDialog] = useState(null); // { backendId, name, fields }

      // 合并后端安装状态到 mock 数据
      const tools = tsToolsData.map(t => ({
        ...t,
        installed: t.backendId ? (toolStates[t.backendId] || false) : false,
      }));

      const filteredTools = tools.filter(tool => {
        const matchesSearch = tool.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              tool.desc.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCategory = activeCategory === 'all' || tool.category === activeCategory;
        return matchesSearch && matchesCategory;
      }).sort((a, b) => {
        if (a.backendId && !b.backendId) return -1;
        if (!a.backendId && b.backendId) return 1;
        if (a.installed && !b.installed) return -1;
        if (!a.installed && b.installed) return 1;
        return 0;
      });

      // 从后端加载已安装状态
      const loadBackendState = async () => {
        try {
          const list = await window.__TAURI__.core.invoke('list_marketplace_tools');
          const states = {};
          list.forEach(t => { states[t.id] = t.installed; });
          setToolStates(states);
        } catch (e) {
          console.error('list_marketplace_tools failed:', e);
        }
      };

      useEffect(() => { loadBackendState(); }, []);

      // 执行安装（已拿到 config 或无需 config）
      const doInstall = async (backendId, userConfig) => {
        const t = tsToolsData.find(x => x.backendId === backendId);
        const name = t ? t.title : backendId;
        const hasPipDeps = !t?.configFields || t.configFields.length === 0; // 无 config 的本地工具可能有 pip deps
        setBusyId(backendId);
        if (hasPipDeps) {
          setAlert({ loading: true, visible: false, title: `正在安装「${name}」`, subtitle: '首次安装需下载依赖，请耐心等待…', isInstall: true, isError: false });
        }
        try {
          const args = { toolId: backendId };
          if (userConfig && Object.keys(userConfig).length > 0) {
            args.config = userConfig;
          }
          await window.__TAURI__.core.invoke('install_marketplace_tool', args);
          await loadBackendState();
          setAlert({ visible: true, loading: false, title: `已安装「${name}」`, isInstall: true, isError: false, toolId: backendId });
          if (selectedTool && selectedTool.backendId === backendId) {
            setSelectedTool(prev => ({ ...prev, installed: true }));
          }
        } catch (e) {
          console.error('install failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isInstall: false, isError: true });
        } finally {
          setBusyId(null);
        }
      };

      // 安装/卸载入口
      const handleAction = async (backendId, isInstalled) => {
        const t = tsToolsData.find(x => x.backendId === backendId);
        const name = t ? t.title : backendId;

        // 安装：有 configFields 的工具先弹配置弹窗
        if (!isInstalled) {
          if (t?.configFields && t.configFields.length > 0) {
            setConfigDialog({ backendId, name, fields: t.configFields });
            return;
          }
          return doInstall(backendId, {});
        }

        // 卸载
        setBusyId(backendId);
        try {
          await window.__TAURI__.core.invoke('uninstall_marketplace_tool', { toolId: backendId });
          await loadBackendState();
          setAlert({ visible: true, loading: false, title: `已卸载「${name}」`, isInstall: false, isError: false });
          if (selectedTool && selectedTool.backendId === backendId) {
            setSelectedTool(prev => ({ ...prev, installed: false }));
          }
        } catch (e) {
          console.error('uninstall failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isInstall: false, isError: true });
        } finally {
          setBusyId(null);
        }
      };

      useEffect(() => {
        if (selectedTool) document.body.style.overflow = 'hidden';
        else document.body.style.overflow = 'unset';
        return () => { document.body.style.overflow = 'unset'; };
      }, [selectedTool]);

      useEffect(() => {
        if (isFeaturedHovered || searchQuery !== '' || activeCategory !== 'all') return;
        const interval = setInterval(() => {
          if (featuredScrollRef.current) {
            const { scrollLeft, scrollWidth, clientWidth } = featuredScrollRef.current;
            if (scrollLeft + clientWidth >= scrollWidth - 50) {
              featuredScrollRef.current.scrollTo({ left: 0, behavior: 'smooth' });
            } else {
              featuredScrollRef.current.scrollBy({ left: 424, behavior: 'smooth' });
            }
          }
        }, 4000);
        return () => clearInterval(interval);
      }, [isFeaturedHovered, searchQuery, activeCategory]);

      const handleScrollFeatured = (direction) => {
        if (featuredScrollRef.current) {
          featuredScrollRef.current.scrollBy({
            left: direction === 'left' ? -424 : 424,
            behavior: 'smooth'
          });
        }
      };

      return (
        <div className={`${isDark ? 'dark' : ''} flex-1 flex flex-col w-full h-full relative z-10 overflow-hidden antialiased selection:bg-blue-200 dark:selection:bg-blue-900`}>
          <TsAlert alert={alert} theme={theme} onDismiss={() => setAlert(a => ({ ...a, visible: false }))} onNewChat={() => { const tid = alert.toolId; setAlert(a => ({ ...a, visible: false })); if (onNewChat) onNewChat(tid); }} />
          <TsConfigDialog
            config={configDialog}
            theme={theme}
            onCancel={() => setConfigDialog(null)}
            onConfirm={(values) => { setConfigDialog(null); doInstall(configDialog.backendId, values); }}
          />
          <div className="flex-1 flex flex-col bg-white dark:bg-black text-slate-900 dark:text-white transition-colors duration-300 font-sans overflow-hidden">

            {/* Header */}
            <header className="shrink-0 bg-white/80 dark:bg-black/80 backdrop-blur-2xl border-b border-slate-200/50 dark:border-white/10 pt-6 pb-4 px-6 md:px-10 transition-colors">
              <div className="max-w-7xl mx-auto flex flex-col gap-5">
                <div className="flex items-center gap-3">
                  <Puzzle className="text-blue-600 dark:text-blue-500" size={32} strokeWidth={2.5} />
                  <h1 className="text-3xl font-extrabold tracking-tight">探索工具</h1>
                </div>
                <div className="relative group">
                  <Search className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors" size={20} />
                  <input
                    type="text"
                    placeholder="搜索 MCP、API 或工作流工具"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-11 pr-4 py-3 bg-slate-100 dark:bg-[#1C1C1E] border-none rounded-2xl text-[17px] focus:ring-2 focus:ring-blue-500/50 outline-none transition-all placeholder:text-slate-500 text-slate-900 dark:text-white"
                  />
                </div>
              </div>
            </header>

            {/* Main scrollable area */}
            <main className="flex-1 overflow-y-auto custom-scrollbar">
              <div className="max-w-7xl mx-auto px-6 md:px-10 py-8 space-y-12">

                {/* Featured carousel */}
                {searchQuery === '' && activeCategory === 'all' && (
                  <section
                    className="relative group/featured"
                    onMouseEnter={() => setIsFeaturedHovered(true)}
                    onMouseLeave={() => setIsFeaturedHovered(false)}
                  >
                    <div className="flex items-end justify-between mb-5">
                      <h2 className="text-2xl font-bold tracking-tight">精选能力推荐</h2>
                    </div>

                    <button
                      onClick={(e) => { e.stopPropagation(); handleScrollFeatured('left'); }}
                      className="absolute -left-5 top-[55%] -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md shadow-[0_4px_20px_rgba(0,0,0,0.15)] dark:shadow-[0_4px_20px_rgba(0,0,0,0.5)] flex items-center justify-center text-slate-800 dark:text-slate-200 opacity-0 group-hover/featured:opacity-100 hover:scale-110 transition-all border border-slate-200 dark:border-slate-700 hidden md:flex"
                    >
                      <ChevronLeft size={26} />
                    </button>
                    <button
                      onClick={(e) => { e.stopPropagation(); handleScrollFeatured('right'); }}
                      className="absolute -right-5 top-[55%] -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md shadow-[0_4px_20px_rgba(0,0,0,0.15)] dark:shadow-[0_4px_20px_rgba(0,0,0,0.5)] flex items-center justify-center text-slate-800 dark:text-slate-200 opacity-0 group-hover/featured:opacity-100 hover:scale-110 transition-all border border-slate-200 dark:border-slate-700 hidden md:flex"
                    >
                      <ChevronRight size={26} />
                    </button>

                    <div
                      ref={featuredScrollRef}
