  <title>PINVOU 智能助手（内测版）</title>
  <script>
    // Collect startup timing before any vendor or application module loads.
    // Batches are forwarded to Rust so release builds retain the timeline.
    (function () {
      var entries = [];
      var sent = 0;
      var flushInFlight = false;
      var flushTimer = null;
      var longTaskCount = 0;

      function mark(stage, detail) {
        var entry = {
          stage: String(stage),
          detail: detail == null ? "" : String(detail),
          since_navigation_ms: performance.now(),
        };
        entries.push(entry);
        console.info("[startup] +" + entry.since_navigation_ms.toFixed(3) + "ms " + entry.stage, entry.detail);
        scheduleFlush(0);
      }

      function scheduleFlush(delay) {
        if (flushTimer != null) return;
        flushTimer = setTimeout(function () {
          flushTimer = null;
          flush();
        }, delay || 0);
      }

      function flush() {
        var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
        if (!invoke || flushInFlight || sent >= entries.length) return;
        var batch = entries.slice(sent);
        flushInFlight = true;
        invoke("report_frontend_startup", { entries: batch }).then(function () {
          sent += batch.length;
          flushInFlight = false;
          if (sent < entries.length) scheduleFlush(0);
        }).catch(function () {
          flushInFlight = false;
          scheduleFlush(250);
        });
      }

      window.__PINVOU_STARTUP__ = { mark: mark, flush: flush, entries: entries };
      mark("html:head_start");
      document.addEventListener("DOMContentLoaded", function () {
        mark("dom:content_loaded_listener_begin", "listener registered before application modules");
      });
      window.addEventListener("load", function () { mark("window:load"); });
      window.addEventListener("error", function (event) {
        mark("window:error", event && event.message ? event.message : "unknown error");
      });
      window.addEventListener("unhandledrejection", function (event) {
        mark("window:unhandled_rejection", String(event && event.reason || "unknown rejection"));
      });
      if (window.PerformanceObserver) {
        try {
          new PerformanceObserver(function (list) {
            list.getEntries().forEach(function (entry) {
              if (longTaskCount++ < 20) {
                mark("browser:long_task", "start_ms=" + entry.startTime.toFixed(1) + " duration_ms=" + entry.duration.toFixed(1));
              }
            });
          }).observe({ type: "longtask", buffered: true });
        } catch (_) {}
      }
    })();
  </script>
  <!-- Tailwind 仍使用本地离线 runtime；后续单独迁移预编译样式。 -->

        });

    });
