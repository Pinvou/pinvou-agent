    // ==========================================
    // Shared Components
    // ==========================================

    const ToolOutput = ({ item, isDark, t }) => {
      const out = item.output;
      if (item.success === false) return <OutputError text={out} isDark={isDark} />;
      if (isWeatherTool(item.name)) {
        let raw = out;
        const envelope = tryParseJson(out);
        if (envelope && Array.isArray(envelope.content)) {
          const t = envelope.content.find(c => c.type === 'text');
          if (t && t.text) raw = t.text;
        }
        const w = tryParseJson(raw);
        if (w && w.type === 'weather' && !w.error) return <WeatherCard data={w} />;
      }
      // 股票报价卡片：iwencai 返回表格数据 → 映射为卡片
      if (isStockQuoteTool(item.name)) {
        let raw = out;
        const envelope = tryParseJson(out);
        if (envelope && Array.isArray(envelope.content)) {
          const t = envelope.content.find(c => c.type === 'text');
          if (t && t.text) raw = t.text;
        }
        const w = tryParseJson(raw);
        if (w && Array.isArray(w.datas) && w.datas.length > 0) {
          const d = w.datas[0];
          const findVal = (obj, keyword) => {
            for (const k of Object.keys(obj)) {
              if (k.includes(keyword)) return parseFloat(obj[k]);
            }
            return undefined;
          };
          const mapped = {
            name: d['股票简称'] || '--',
            code: (d['股票代码'] || '').replace(/\.\w+$/, ''),
            price: parseFloat(d['最新价']),
            changePercent: findVal(d, '涨跌幅'),
            open: findVal(d, '开盘价'),
            high: findVal(d, '最高价'),
            low: findVal(d, '最低价'),
          };
          return <StockQuoteCard data={mapped} isDark={isDark} />;
        }
        if (w && w.type === 'stock_quote' && !w.error) return <StockQuoteCard data={w} isDark={isDark} />;
      }
      if (isReceipt(out)) return <ReceiptBlock text={out} isDark={isDark} t={t} />;
      if (item.name === 'list_dir') { const v = tryParseJson(out); if (Array.isArray(v)) return <ListDirView items={v} isDark={isDark} t={t} />; }
      else if (item.name === 'grep_files') { const v = tryParseJson(out); if (v && Array.isArray(v.matches)) return <GrepView data={v} isDark={isDark} t={t} />; }
      else if (item.name === 'exec_shell') {
        const v = tryParseJson(out);
        if (v && (v.stdout != null || v.exit_code != null || v.status)) return <ShellView data={v} isDark={isDark} t={t} />;
        return <ShellTextView cmd={item.args && item.args.command} text={out} isDark={isDark} />;
      }
      else if (item.name === 'edit_file' || item.name === 'write_file') { if (looksDiff(out)) return <DiffView text={out} isDark={isDark} />; }
      else if (item.name === 'append_file') {
        const m = String(out).match(/appended (\d+) bytes[\s\S]*?\((\d+) -> (\d+) bytes\)/i);
        if (m) return <div className={outBox(isDark)}>{t.appendBytes(/^Created/i.test(out), m[1], m[2], m[3])}</div>;
      }
      else if (TODO_TOOLS.indexOf(item.name) >= 0) { const v = tryTailJson(out); if (v && Array.isArray(v.items)) return <TodoView snap={v} isDark={isDark} t={t} />; }
      return <OutputPre text={out} isDark={isDark} />;
    };

    const ToolCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      // 有可视化卡片的工具(天气/股票)完成后直接展开,不折叠
      const hasCard = (isWeatherTool(item.name) || isStockQuoteTool(item.name)) && item.state === 'done';
      const [expanded, setExpanded] = useState(hasCard);
      useEffect(() => { if (hasCard) setExpanded(true); }, [hasCard]);
      const isRunning = item.state === 'running';
      const isDone = item.state === 'done';
      const isFailed = item.state === 'failed';
      const quiet = QUIET_TOOLS.has(item.name);
      const summary = toolSummary(item.name, item.args, t);

      const statusColor = isRunning
        ? (isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]')
        : isDone
          ? (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')
          : (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]');

      const statusText = isRunning ? t.toolRunning : isDone ? t.toolDone : t.toolFailed;
      const mutedColor = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';

      const detail = expanded ? (
        <div className={`px-4 pb-3 border-t ${isDark ? 'border-white/5' : 'border-black/5'}`}>
          {item.output != null
            ? <div className="mt-2"><ToolOutput item={item} isDark={isDark} t={t} /></div>
            : null}
        </div>
      ) : null;

      // 弱化类：单行灰条。完成态低调（图标灰），运行/失败态保留状态色以便察觉。
      if (quiet) {
        const iconColor = isDone ? mutedColor : statusColor;
        return (
          <div className={expanded ? `rounded-[12px] overflow-hidden border ${isDark ? 'border-white/5' : 'border-black/5'}` : ''}>
            <div
              className={`flex items-center gap-2 px-2 py-1 rounded-[8px] cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
              onClick={() => setExpanded(!expanded)}
            >
              <Wrench size={12} className={iconColor} />
              <span className={`text-[12px] ${mutedColor}`}>{item.name}</span>
              {summary
                ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
                : <span className="flex-1" />}
              {isRunning && <span className={`text-[11px] ${statusColor}`}>{t.toolRunning}</span>}
              {isFailed && <span className={`text-[11px] ${statusColor}`}>{t.toolFailed}</span>}
              <ChevronDown size={12} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${mutedColor}`} />
            </div>
            {detail}
          </div>
        );
      }

      // 有产出类：保留醒目卡片，标题行带摘要。
      return (
        <div className={`rounded-[16px] overflow-hidden border ${isDark ? 'bg-[#1E1F20] border-white/5' : 'bg-[#F0F4F9] border-black/5'}`}>
          <div
            className={`flex items-center gap-3 px-4 py-3 cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
            onClick={() => setExpanded(!expanded)}
          >
            <Wrench size={14} className={statusColor} />
            <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
              {item.name}
            </span>
            {summary
              ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
              : <span className="flex-1" />}
            <span className={`text-[12px] ${statusColor}`}>{statusText}</span>
            <ChevronDown size={14} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`} />
          </div>
          {detail}
        </div>
      );
    };

    // ==========================================
    // Plan / 待办 步骤渲染
    // ==========================================
    const STEP_SYM = { completed: '●', in_progress: '◎', pending: '○' };
    const PlanLayer = ({ label, explanation, items, field, isDark }) => {
      if (!items || items.length === 0) return null;
      return (
        <section className="mb-2">
          <div className={`text-[12px] font-semibold mb-1 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{label}</div>
          {explanation && <p className={`text-[13px] mb-1.5 leading-relaxed ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{explanation}</p>}
          <ol className="space-y-1">
            {items.map((it, i) => (
              <li key={i} className={`text-[13px] flex gap-2 leading-relaxed ${it.status === 'completed' ? 'opacity-60' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                <span className={it.status === 'in_progress' ? (isDark ? 'text-[#FDD663]' : 'text-[#E37400]') : ''}>{STEP_SYM[it.status] || '○'}</span>
                <span>{it[field] || ''}</span>
              </li>
            ))}
          </ol>
        </section>
      );
    };

    const cardBoxCls = (isDark, accent) =>
      `rounded-[16px] border p-4 my-1 ${isDark ? 'bg-[#1E1F20] border-white/10' : 'bg-[#F0F4F9] border-black/5'} ${accent || ''}`;
    const cardBtnCls = (isDark, variant) => {
      const base = 'px-3 py-1.5 rounded-full text-[13px] font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
      if (variant === 'primary') return `${base} ${isDark ? 'bg-[#A8C7FA] text-[#062E6F] hover:bg-[#C2DBFF]' : 'bg-[#0B57D0] text-white hover:bg-[#0A4BB8]'}`;
      return `${base} ${isDark ? 'bg-[#333537] text-[#E3E3E3] hover:bg-[#444746]' : 'bg-white text-[#1F1F1F] hover:bg-[#E1E5EA] border border-black/10'}`;
    };

    // 品悟角色配色（与产物卡一致）：品=盾·橙 #FF9500/#FF9F0A，悟=闪光·紫 #5E5CE6。
    // 返回 { name, accentHex, text(类), softBg(类), Icon }。
    const pvRole = (isWu, isDark) => isWu
      ? { name: '悟', accentHex: '#5E5CE6', text: 'text-[#5E5CE6]',
          softBg: isDark ? 'bg-[#5E5CE6]/15' : 'bg-[#5E5CE6]/[0.10]', Icon: AcSparkles }
      : { name: '品', accentHex: isDark ? '#FF9F0A' : '#FF9500', text: isDark ? 'text-[#FF9F0A]' : 'text-[#FF9500]',
          softBg: isDark ? 'bg-[#FF9F0A]/15' : 'bg-[#FF9500]/[0.10]', Icon: AcShieldCheck };

    // ==========================================
    // PinvouSummonCard — 🧭 召唤式检阅（Boss 主动呼叫 Pinvou）
    // 自报家门人格(单主+alternates,§3.3) + trace + issues(severity 分色)。
    // ==========================================
    // 逐条裁决行(§2 + kind 分流):每条按本质给对应动作,不再一刀切判断题——
    //   recommendation(决策点/缺信息,Boss 才能定)→ 采纳建议 / 让 AI 问我;
    //   issue.needs_verify(外部事实,AI 无知识)→ 让 AI 核实 / 我确认没问题;
    //   issue 其他(产物缺陷,AI 改得动)→ 让 AI 改 / 接受现状(high 默认勾)。
    // 「交给 AI 处理」按各条动作组装定向指令走 B1。单独子组件:useState 放这避 hooks 错位。
    const PinvouRows = ({ review, theme, t, role }) => {
      const isDark = theme === 'dark';
      role = role || pvRole(false, isDark);
      const body = isDark ? 'text-[#fff]' : 'text-[#000]';
      const muted = isDark ? 'text-[#EBEBF5]/60' : 'text-[#3C3C43]/60';
      // iOS 语义色：high 红 / medium 橙 / low 灰
      const sevDot = (s) => s === 'high' ? '#FF3B30' : s === 'medium' ? '#FF9500' : '#C7C7CC';
      const rows = [
        ...(review.recommendations || []).map((x, i) => ({
          k: 'r' + i, raw: x, kind: 'rec', dot: '#FF9500',
          head: (x.topic ? x.topic + '：' : '') + t.pvSuggest + x.pick, sub: x.why,
        })),
        ...(review.issues || []).map((x, i) => ({
          k: 'i' + i, raw: x, kind: x.kind === 'needs_verify' ? 'verify' : 'fix',
          dot: sevDot(x.severity), sev: x.severity, nv: x.kind === 'needs_verify',
          head: x.text, sub: x.suggestion,
        })),
        ...(review.coverage || []).map((x, i) => ({
          k: 'c' + i, raw: x, kind: 'gap', dot: '#5E5CE6',
          sev: x.severity, head: x.dimension + (x.text ? '：' + x.text : ''), sub: x.suggestion,
        })),
      ];
      // 每类二选一 [值,文案]:第一个=「要 AI 做」(高亮),第二个=Boss 自己消化(灰)。
      const ACT = {
        rec: [['adopt', t.pvActAdopt], ['ask', t.pvActAsk]],
        verify: [['verify', t.pvActVerify], ['confirmed', t.pvActConfirmed]],
        fix: [['modify', t.pvActModify], ['accept', t.pvActAccept]],
        gap: [['fill', t.pvActFill], ['skip', t.pvActSkip]],
      };
      const ACTIVE = { adopt: 1, ask: 1, verify: 1, modify: 1, fill: 1 }; // 需转交给 AI 的动作
      const [res, setRes] = useState(() => {
        const m = {};
        rows.forEach(it => {
          let def = null;
          if (it.sev === 'high') def = it.kind === 'fix' ? 'modify' : it.kind === 'gap' ? 'fill' : null;
          m[it.k] = it.raw.resolution || def;
        });
        return m;
      });
      const setOne = (k, v) => setRes(p => ({ ...p, [k]: p[k] === v ? null : v }));
      const activeCount = rows.filter(it => ACTIVE[res[it.k]]).length;
      // iOS 分段按钮风：选中且需转交 AI=填充角色色(背景走 style)；选中但自行消化=灰填充；未选=描边。
      const chip = (on, active) => `text-[12px] px-2.5 py-1 rounded-full font-medium transition-all active:scale-[0.96] ${on
        ? (active ? 'text-white border border-transparent'
                  : (isDark ? 'bg-white/15 text-[#fff] border border-transparent' : 'bg-black/[0.08] text-[#000] border border-transparent'))
        : (isDark ? 'border border-white/15 text-[#EBEBF5]/70 hover:bg-white/5' : 'border border-black/[0.12] text-[#3C3C43]/80 hover:bg-black/5')}`;
      const onResolve = () => {
        if (!bridge.available) return;
        // 弹窗里 review 是 notify 深拷贝,写它的 resolution 落不到原 state;把裁决按下标传给 bridge,
        // 由 bridge 在 state.pinvouModal.review(原 state)上写、再落盘(根治 resolution 不持久化)。
        const resolutions = {
          recs: (review.recommendations || []).map((_, i) => res['r' + i] || 'pending'),
          issues: (review.issues || []).map((_, i) => res['i' + i] || 'pending'),
          coverage: (review.coverage || []).map((_, i) => res['c' + i] || 'pending'),
        };
        const actions = [];
        rows.forEach(it => {
          const a = res[it.k];
          if (a === 'modify') actions.push({ t: 'fix', text: it.head + (it.sub ? '（' + it.sub + '）' : '') });
          else if (a === 'verify') actions.push({ t: 'verify', text: it.head + (it.sub ? '（' + it.sub + '）' : '') });
          else if (a === 'adopt') actions.push({ t: 'adopt', topic: it.raw.topic || '', pick: it.raw.pick || '' });
          else if (a === 'ask') actions.push({ t: 'ask', topic: it.raw.topic || it.head });
          else if (a === 'fill') actions.push({ t: 'fill', dimension: it.raw.dimension || '', suggestion: it.raw.suggestion || '' });
        });
        bridge.resolvePinvouReview(resolutions, actions);
      };
      return (
        <div>
          <div className="space-y-2">
            {rows.map(it => {
              const decided = res[it.k];
              const passive = decided === 'accept' || decided === 'confirmed' || decided === 'skip';
              return (
                <div key={it.k} className={`rounded-[12px] px-3 py-2.5 transition-opacity ${passive ? 'opacity-40' : ''} ${isDark ? 'bg-white/[0.06]' : 'bg-[#F2F2F7]'}`}>
                  <div className="flex gap-2.5">
                    <span className="mt-[7px] w-[7px] h-[7px] rounded-full shrink-0" style={{ background: it.dot }} />
                    <div className="flex-1 min-w-0">
                      <div className={`text-[14px] leading-relaxed ${body}`}>
                        {it.nv && <span className={`text-[10.5px] font-medium mr-1.5 px-1.5 py-px rounded-full align-[1px] ${isDark ? 'bg-[#FFD60A]/20 text-[#FFD60A]' : 'bg-[#FFF8E1] text-[#B25000]'}`}>{t.pvNeedsVerify}</span>}
                        {it.head}
                      </div>
                      {it.sub && <div className={`text-[13px] mt-0.5 ${muted}`}>{it.sub}</div>}
                      <div className="flex gap-2 mt-2">
                        {ACT[it.kind].map(([v, label]) => (
                          <button key={v} onClick={() => setOne(it.k, v)} className={chip(decided === v, !!ACTIVE[v])}
                            style={decided === v && ACTIVE[v] ? { background: role.accentHex } : undefined}>{label}</button>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="flex items-center gap-2 mt-4 pt-1">
            {activeCount > 0 && (
              <button onClick={onResolve}
                className="px-4 py-2 rounded-full text-[14px] font-semibold text-white active:scale-[0.97] transition-transform"
                style={{ background: role.accentHex }}>
                {t.pvHandToAi(activeCount)}
              </button>
            )}
            <button onClick={() => bridge.available && bridge.dismissPinvouReview()} title={t.pvSkipTitle}
              className={`px-4 py-2 rounded-full text-[14px] font-medium transition-colors ${isDark ? 'text-[#EBEBF5]/70 hover:bg-white/5' : 'text-[#3C3C43]/70 hover:bg-black/5'}`}>
              {t.pvSkip}
            </button>
          </div>
        </div>
      );
    };

    // 检阅 loading:本地模型 5-30s,iOS 旋转菊花 spinner + 计时 + 安抚文字,别让 Boss 干等焦虑。
    const PinvouLoading = ({ isWu, isDark, t }) => {
      const [secs, setSecs] = useState(0);
      useEffect(() => {
        const b = setInterval(() => setSecs(s => s + 1), 1000);
        return () => clearInterval(b);
      }, []);
      const role = pvRole(isWu, isDark);
      const muted = isDark ? 'text-[#EBEBF5]/60' : 'text-[#3C3C43]/60';
      return (
        <div className="py-8 flex flex-col items-center text-center">
          {/* iOS activity spinner：底环 + 角色色弧，匀速旋转 */}
          <svg className="w-9 h-9" viewBox="0 0 24 24" fill="none" style={{ animation: 'tsSpinner 0.8s linear infinite' }}>
            <circle cx="12" cy="12" r="9" stroke={isDark ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.08)'} strokeWidth="3" />
            <path d="M12 3a9 9 0 0 1 9 9" stroke={role.accentHex} strokeWidth="3" strokeLinecap="round" />
          </svg>
          <div className={`flex items-center gap-1.5 mt-4 text-[15px] font-semibold ${role.text}`}>
            <role.Icon className="w-[18px] h-[18px]" />
            <span>{isWu ? t.pvLoadingWu : t.pvLoadingPin}</span>
          </div>
          <div className={`text-[13px] mt-1.5 ${muted}`}>
            {isWu ? t.pvLoadingWuSub : t.pvLoadingPinSub}
            {secs > 0 && <span className="ml-1.5 tabular-nums opacity-70">{secs}s</span>}
          </div>
          <div className={`text-[12px] mt-1 ${muted}`} style={{ opacity: 0.6 }}>{t.pvLoadingHint}</div>
        </div>
      );
    };

    // 检阅结果卡（在底部 sheet 内渲染，无外层卡框；品=橙 / 悟=紫，与产物卡一致）。
    const PinvouSummonCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const isWu = !!item.coverage; // 悟=发散(coverage)；品=查错
      const role = pvRole(isWu, isDark);
      const muted = isDark ? 'text-[#EBEBF5]/60' : 'text-[#3C3C43]/60';
      const body = isDark ? 'text-[#fff]' : 'text-[#000]';
      if (item.loading) return <PinvouLoading isWu={isWu} isDark={isDark} t={t} />;
      if (item.error) return (
        <div className="py-2">
          <div className={`flex items-center gap-1.5 text-[15px] font-semibold ${role.text}`}><role.Icon className="w-[18px] h-[18px]" /><span>Pinvou {role.name}</span></div>
          <div className={`text-[14px] mt-2 ${isDark ? 'text-[#FF453A]' : 'text-[#FF3B30]'}`}>{t.pvFail}{item.error}</div>
        </div>
      );
      const r = item.review || {};
      if (r.dismissed) return (
        <div className={`py-2 flex items-center gap-1.5 text-[14px] ${muted}`}><role.Icon className="w-4 h-4" /><span>{'Pinvou · ' + role.name + ' · ' + t.pvSkipped}</span></div>
      );
      const personas = r.personas || [];
      const primary = personas.find(p => p && p.primary) || personas[0] || {};
      const alts = r.alternates || [];
      const hasRows = (r.recommendations || []).length > 0 || (r.issues || []).length > 0 || (r.coverage || []).length > 0;
      return (
        <div>
          <div className="flex items-center flex-wrap gap-x-2 gap-y-1 mb-2.5">
            <span className={`inline-flex items-center justify-center w-7 h-7 rounded-full ${role.softBg}`}>
              <role.Icon className={`w-[17px] h-[17px] ${role.text}`} />
            </span>
            <span className={`text-[16px] font-semibold ${body}`}>
              {'Pinvou · ' + role.name}
              {primary.label && <span className={`text-[14px] font-normal ${muted}`}> · {primary.label + t.pvPerspective}</span>}
            </span>
            {r.verdict === 'pass' && <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${isDark ? 'bg-[#30D158]/20 text-[#30D158]' : 'bg-[#34C759]/15 text-[#248A3D]'}`}>{t.pvVerdictPass}</span>}
          </div>
          {alts.length > 0 && <div className={`text-[12px] -mt-1 mb-2 ${muted}`}>{t.pvAlsoInvolves} {alts.join(' / ')}</div>}
          {r.trace && <div className={`text-[14px] leading-relaxed mb-3 ${body}`}>{r.trace}</div>}
          {(r.framework || []).length > 0 && (
            <div className={`text-[12px] mb-3 px-3 py-2 rounded-[12px] leading-relaxed ${role.softBg} ${role.text}`}>
              <span className="opacity-70">{t.pvFramework} · {(r.framework || []).length}{t.pvDims}: </span>{(r.framework || []).join(' · ')}
            </div>
          )}
          {hasRows && <PinvouRows review={r} theme={theme} t={t} role={role} />}
        </div>
      );
    };

    // ==========================================
    // PlanCard — ✨ 方案准备好
    // ==========================================
    const PlanCard = ({ item, theme, t, onPrefill }) => {
      const isDark = theme === 'dark';
      const active = item.cardState === 'active' && !item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className={`text-[14px] font-semibold mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.planReady}</div>
          {(!item.plan && !item.todos)
            ? <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.planEmpty}</div>
            : <>
                <PlanLayer label={t.planLabel} explanation={item.plan && item.plan.explanation} items={item.plan && item.plan.items} field="step" isDark={isDark} />
                <PlanLayer label={t.planTodos} items={item.todos && item.todos.items} field="content" isDark={isDark} />
              </>}
          <div className={`h-px my-3 ${isDark ? 'bg-white/10' : 'bg-black/10'}`}></div>
          {active ? (
            <div className="flex items-center gap-2 flex-wrap">
              <span className={`text-[13px] mr-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.planNext}</span>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.acceptPlan(item.id, item.planMarkdown)}>{t.planGo}</button>
              <button className={cardBtnCls(isDark)} onClick={() => onPrefill && onPrefill(t.planRevisePrefill)}>{t.planEdit}</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.discardPlan(item.id)}>{t.planDrop}</button>
            </div>
          ) : (
            <div className={`text-[13px] font-medium ${isDark ? 'text-[#93D5A6]' : 'text-[#137333]'}`}>{item.statusLabel}</div>
          )}
        </div>
      );
    };

    // ==========================================
    // PlanStuckCard — Plan 模式 AI 撞只读保护(白名单/sandbox)的兜底卡
    // ==========================================
    const PlanStuckCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#FDD663]/30' : 'border-[#E37400]/20')}>
          <div className={`text-[13px] leading-relaxed mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
            {t.stuckPlanPre} <code className="px-1 rounded bg-black/20">{item.toolName || '(unknown)'}</code> {t.stuckPlanPost}
          </div>
          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || t.handled}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark)} onClick={() => bridge.planStuckReplan(item.id)}>{t.stuckReplan}</button>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.planStuckGo(item.id)}>⚡ {t.stuckGo}</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // CarefulBlockedCard — 🛑 危险操作被拦（人话化：底座英文技术原因→中文人话，技术详情折叠）
    // ==========================================
    const REASON_MAP = [
      [/root filesystem|delete all root|delete root/i, 'rsRoot'],
      [/home director/i, 'rsHome'],
      [/recursiv|rm\s+-rf/i, 'rsRecursive'],
      [/forced? deletion|\bforce\b/i, 'rsForce'],
      [/fork bomb/i, 'rsForkbomb'],
      [/overwrite|\bof=|\bdd\b/i, 'rsOverwrite'],
      [/format|mkfs/i, 'rsFormat'],
    ];
    const humanizeReason = (en, t) => {
      const s = String(en);
      for (let i = 0; i < REASON_MAP.length; i++) if (REASON_MAP[i][0].test(s)) return t[REASON_MAP[i][1]];
      return t.rsDefault;
    };
    const CarefulBlockedCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const [showTech, setShowTech] = useState(false);
      const md = item.metadata || {};
      const cmd = (item.args && (item.args.command || item.args.cmd)) || t.cbCmdUnknown;
      const rawReasons = (md.reasons && md.reasons.length) ? md.reasons : [];
      const rawSuggestions = md.suggestions || [];
      const humanReasons = [...new Set(rawReasons.map(r => humanizeReason(r, t)))];
      if (humanReasons.length === 0) humanReasons.push(t.rsDefault);
      const hasTech = rawReasons.length > 0 || rawSuggestions.length > 0;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#F28B82]/40' : 'border-[#C5221F]/30')}>
          <div className={`text-[14px] font-semibold mb-2 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>{t.cbTitle}</div>
          <div className={`text-[12px] mb-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.cbWant}</div>
          <pre className={`text-[12px] font-mono rounded-lg p-2 mb-2 overflow-x-auto ${isDark ? 'bg-[#131314] text-[#F28B82]' : 'bg-white text-[#C5221F]'}`}>{cmd}</pre>
          <div className="mb-2">
            <div className={`text-[12px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.cbWhy}</div>
            <ul className={`list-disc pl-5 text-[13px] space-y-0.5 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{humanReasons.map((r, i) => <li key={i}>{r}</li>)}</ul>
          </div>
          <div className={`text-[12px] leading-relaxed mb-1.5 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.cbNote}</div>
          {hasTech && (
            <div>
              <button onClick={() => setShowTech(!showTech)} className={`text-[11px] ${isDark ? 'text-[#8AB4F8]' : 'text-[#0B57D0]'}`}>{showTech ? t.cbTechHide : t.cbTechShow}</button>
              {showTech && (
                <div className={`mt-1 text-[11px] font-mono space-y-0.5 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>
                  {rawReasons.map((r, i) => <div key={'r' + i}>· {r}</div>)}
                  {rawSuggestions.map((s, i) => <div key={'s' + i}>→ {s}</div>)}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // UserInputCard — 🤔 AI 想问你几个问题
    // ==========================================
    const UserInputCard = ({ item, theme, t }) => {
      const isDark = theme === 'dark';
      const questions = item.questions || [];
      const [answers, setAnswers] = useState(() => item.restoredAnswers || questions.map(() => null));
      const [otherOpen, setOtherOpen] = useState(() => questions.map(() => false));
      const [otherText, setOtherText] = useState(() => questions.map(() => ''));
      const locked = item.resolved || item.submitting;

      function pick(qi, opt) {
        if (locked) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: opt.label, value: opt.label };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function toggleOther(qi) {
        if (locked) return;
        const oo = otherOpen.slice(); oo[qi] = !oo[qi]; setOtherOpen(oo);
        if (oo[qi]) { const next = answers.slice(); next[qi] = null; setAnswers(next); }
      }
      function submitOther(qi) {
        const val = (otherText[qi] || '').trim();
        if (!val) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: '其他', value: val };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function commit(next) {
        setAnswers(next);
        if (next.every(a => a != null)) {
          bridge.submitUserInput(item.id, item.toolCallId, next, questions);
        }
      }

      const statusText = item.cardState === 'submitted' ? t.uiSubmitted
        : item.cardState === 'cancelled' ? t.uiCancelled
        : item.submitting ? t.uiSubmitting : item.error ? t.uiSubmitFailed(item.error) : '';

      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className="flex items-center justify-between mb-3">
            <div className={`text-[14px] font-semibold ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.uiqTitle}</div>
          </div>
          <div className="space-y-4">
            {questions.map((q, qi) => (
              <div key={qi}>
                <div className={`text-[12px] font-semibold ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{q.header || ('Q' + (qi + 1))}</div>
                <div className={`text-[13px] mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{q.question || ''}</div>
                <div className="flex flex-col gap-1.5">
                  {(q.options || []).map((opt, oi) => {
                    const sel = answers[qi] && answers[qi].label === opt.label && answers[qi].value === opt.label;
                    return (
                      <button key={oi} disabled={locked}
                        onClick={() => pick(qi, opt)}
                        className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                          ${sel ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                                : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                        <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{opt.label}</div>
                        {opt.description && <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{opt.description}</div>}
                      </button>
                    );
                  })}
                  <button disabled={locked} onClick={() => toggleOther(qi)}
                    className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                      ${answers[qi] && answers[qi].label === '其他' ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                        : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                    {/* label '其他' 是协议值(bridge 按它拼 "(其他) "+value),只翻显示不改存储 */}
                    <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.uiOtherTitle}</div>
                    <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.uiOtherDesc}</div>
                  </button>
                  {otherOpen[qi] && (
                    <div className="mt-1">
                      <textarea rows="2" value={otherText[qi]}
                        onChange={e => { const ot = otherText.slice(); ot[qi] = e.target.value; setOtherText(ot); }}
                        onKeyDown={e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitOther(qi); } }}
                        placeholder={t.uiOtherPh}
                        className={`w-full rounded-[10px] p-2 text-[13px] outline-none border ${isDark ? 'bg-[#131314] border-white/10 text-[#E3E3E3]' : 'bg-white border-black/10 text-[#1F1F1F]'}`} />
                      <div className="flex gap-2 mt-1 justify-end">
                        <button className={cardBtnCls(isDark)} onClick={() => toggleOther(qi)}>{t.cpCancel}</button>
                        <button className={cardBtnCls(isDark, 'primary')} onClick={() => submitOther(qi)}>{t.uiSubmit}</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
          {statusText && <div className={`mt-3 text-[13px] ${item.error ? (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]') : (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')}`}>{statusText}</div>}
        </div>
      );
    };

    // ==========================================
    // ArtifactsPanel — 产物面板（右侧抽屉 + 预览）
    // ==========================================
    // 产物列表/预览的 iOS 风类型图标:配色圆角 tile + 白色字形。
    // 复用成品卡那套 _ARTIFACT_FMT / _artifactKind / AcFmtIcon(line 3048+),列表与卡片视觉统一。
    const ArtifactTileIcon = ({ name, tileCls = 'w-9 h-9 rounded-[10px]', glyphCls = 'w-5 h-5' }) => {
      const kind = _artifactKind(name);
      const fmt = _ARTIFACT_FMT[kind] || _ARTIFACT_FMT.other;
      return (
        <span className={`shrink-0 inline-flex items-center justify-center ${tileCls}`} style={{ background: fmt.color }}>
          <AcFmtIcon kind={kind} className={`${glyphCls} text-white`} />
        </span>
      );
    };
    const apPad2 = (x) => String(x).padStart(2, '0');
    const apFormatBytes = (n) => {
      if (n == null) return '';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    };
    const apFormatMtime = (sec) => {
      if (!sec) return '';
      const d = new Date(sec * 1000);
      return d.getFullYear() + '-' + apPad2(d.getMonth() + 1) + '-' + apPad2(d.getDate()) +
        ' ' + apPad2(d.getHours()) + ':' + apPad2(d.getMinutes());
    };
    // kind(后端分类) → 人话类型名;不在表里则回退扩展名大写。
    const apKindLabel = (t, kind, name) => {
      const m = t.apKinds && t.apKinds[kind];
      if (m) return m;
      const ext = ((name || '').split('.').pop() || '').toUpperCase();
      return ext || (kind || 'FILE');
    };
    // 注入到 office→HTML 预览 iframe 末尾:LibreOffice 导出的表格 border=0、字号 x-small,
    // 这里补网格线/字号/单元格换行,让 xlsx 读起来像表格。放在文档后 → 同特异性下后定义胜出。
    const OFFICE_HTML_STYLE = '<style>'
      + 'body{margin:14px;background:#fff;color:#1f1f1f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}'
      + 'table{border-collapse:collapse;width:auto;max-width:100%;}'
      + 'td,th{border:1px solid #d4d7dc;padding:5px 9px;font-size:13px!important;vertical-align:top;max-width:460px;overflow-wrap:anywhere;}'
      + 'tr:first-child td{background:#eef2f8;font-weight:600;}'
      + 'img{max-width:100%;height:auto;}'
      + '</style>';

    const ArtifactsPanel = ({ bs, theme, t, onClose, isWide }) => {
      const isDark = theme === 'dark';
      const artifacts = (bs && bs.artifacts) || [];
      const [tab, setTab] = useState('list');     // 'list' | 'preview'
      const [sel, setSel] = useState(null);        // 选中的 artifact { path, basename }
      const [pv, setPv] = useState({});            // 预览态
      const [infos, setInfos] = useState({});      // path → { size, kind, modified }(列表行元信息)

      // 进面板 / artifacts 变化 → 批量拉元信息(给列表行的「最后修改」+ 类型)
      const pathsKey = artifacts.map((a) => a.path).join('|');
      useEffect(() => {
        let cancelled = false;
        (async () => {
          const entries = await Promise.all(artifacts.map(async (a) => {
            try { return [a.path, await bridge.artifactInfo(a.path)]; }
            catch (_) { return [a.path, null]; }
          }));
          if (cancelled) return;
          const m = {};
          entries.forEach(([p, i]) => { if (i) m[p] = i; });
          setInfos(m);
        })();
        return () => { cancelled = true; };
      }, [pathsKey]);

      // 切 session(artifacts 整批换了)→ 选中文件已不在新列表 → 清预览、退回列表。
      // 路径含 session id,故「不在列表」可靠区分换 session vs 同 session 内新增文件。
      useEffect(() => {
        if (sel && !artifacts.some((a) => a.path === sel.path)) {
          setSel(null); setPv({}); setTab('list');
        }
      }, [pathsKey]);

      async function preview(a) {
        setSel(a);
        setTab('preview');
        setPv({ loading: true });
        try {
          const info = await bridge.artifactInfo(a.path);
          if (!info || !info.exists) { setPv({ missing: true, info }); return; }
          if (info.kind === 'md' || info.kind === 'html' || info.kind === 'text') {
            const text = await bridge.readArtifactText(a.path);
            setPv({ kind: info.kind, text, info });
          } else {
            // image / pdf / docx / xlsx / legacy_office / binary → 后端可视化转换
            const visual = await bridge.renderArtifactVisual(a.path);
            setPv({ kind: info.kind, visual, info });
          }
        } catch (e) { setPv({ error: String(e) }); }
      }

      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const tabBtn = (key, label) => {
        const active = tab === key;
        const disabled = key === 'preview' && !sel;
        return (
          <button key={key} disabled={disabled}
            onClick={() => !disabled && setTab(key)}
            className={`px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors
              ${active ? (isDark ? 'bg-[#333537] text-[#E3E3E3]' : 'bg-[#E8EDF2] text-[#1F1F1F]')
                : disabled ? (isDark ? 'text-[#5F6368]' : 'text-[#BDC1C6]') + ' cursor-not-allowed'
                : (isDark ? 'text-[#C4C7C5] hover:bg-[#282A2C]' : 'text-[#444746] hover:bg-[#F0F4F9]')}`}>
            {label}
          </button>
        );
      };

      // ── 预览内容区(按 kind / visual.mode 渲染)──
      const renderContent = () => {
        if (pv.loading) return <div className={`text-[13px] ${muted}`}>{t.apConverting}</div>;
        if (pv.missing) return <div className={`text-[13px] ${muted}`}>{t.apMissing}</div>;
        if (pv.error) return <div className={`text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>{t.apReadFail(pv.error)}</div>;
        if (pv.kind === 'md') {
          return <div className={`msg-md text-[14px] leading-relaxed ${isDark ? 'dark-code text-[#E3E3E3]' : 'light-code text-[#1F1F1F]'}`} dangerouslySetInnerHTML={{ __html: bridge.renderMarkdown(pv.text || '') }} />;
        }
        if (pv.kind === 'html') {
          // 方角 + 不裁剪:WebKitGTK 对「会内部滚动的 iframe」做任何 border-radius 裁剪
          // (含外层 overflow-hidden)都会在边缘留黑色梳齿残影。去掉圆角是唯一彻底解。
          return <ScaledHtmlPreview html={pv.text || ''} />;
        }
        if (pv.kind === 'text') {
          return <pre className={`text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.text}</pre>;
        }
        // 可视化结果
        const vis = pv.visual;
        if (vis && vis.mode === 'html') {
          return (
            <div className="flex flex-col gap-2 h-full">
              {vis.warning && <div className={`text-[12px] ${isDark ? 'text-[#FDD663]' : 'text-[#E37400]'}`}>⚠️ {vis.warning}</div>}
              <iframe sandbox="allow-same-origin" className="w-full flex-1 min-h-[480px] border-0 block bg-white"
                srcDoc={(vis.html || '') + OFFICE_HTML_STYLE} />
            </div>
          );
        }
        if (vis && vis.mode === 'images') {
          return (
            <div className="flex flex-col items-center gap-3">
              {vis.warning && <div className={`self-start text-[12px] ${isDark ? 'text-[#FDD663]' : 'text-[#E37400]'}`}>⚠️ {vis.warning}</div>}
              {(vis.images || []).map((src, i) => (
                <img key={i} src={src} className="max-w-full h-auto rounded-lg shadow-sm" alt={`page-${i + 1}`} />
              ))}
            </div>
          );
        }
        // 统一兜底卡(unsupported / 转换失败 / binary)
        return (
          <div className={`flex flex-col items-center justify-center text-center gap-3 py-10 ${muted}`}>
            {sel ? <ArtifactTileIcon name={sel.basename} tileCls="w-14 h-14 rounded-[16px]" glyphCls="w-7 h-7" /> : <span className="text-[44px]">📎</span>}
            <span className={`text-[14px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{sel && sel.basename}</span>
            <p className="text-[13px] max-w-[360px]">{(vis && vis.warning) || t.apUnsupported}</p>
            <button onClick={() => sel && bridge.openArtifactExternal(sel.path)} className={cardBtnCls(isDark, 'primary')}>
              {t.apBtnOpen}
            </button>
          </div>
        );
      };

      return (
        <div className={isWide ? "relative w-full h-full" : "absolute inset-0 z-30 flex justify-end pointer-events-auto"}>
          {!isWide && <div className="absolute inset-0 bg-black/40" onClick={onClose}></div>}
          <div className={`relative h-full flex flex-col ${isDark ? 'bg-[#1E1F20]' : 'bg-white'} ${isWide ? 'w-full border-l ' + (isDark ? 'border-white/10' : 'border-black/10') : 'w-[680px] max-w-[88vw] shadow-2xl animate-in slide-in-from-right duration-200'}`}>
            {/* header + tabs */}
            <div className={`flex items-center justify-between px-3 py-2.5 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <div className={`flex items-center gap-1 rounded-full p-0.5 ${isDark ? 'bg-[#141517]' : 'bg-[#F0F4F9]'}`}>
                {tabBtn('list', t.apTabList)}
                {tabBtn('preview', t.apTabPreview)}
              </div>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>

            {/* body */}
            <div className="flex-1 min-h-0 flex flex-col">
              {tab === 'list' ? (
                <div className="flex-1 overflow-y-auto custom-scrollbar p-2">
                  {artifacts.length === 0 ? (
                    <div className={`p-4 text-[13px] ${muted}`}>{t.apEmpty}</div>
                  ) : artifacts.map((a) => {
                    const info = infos[a.path];
                    return (
                      <div key={a.path} onClick={() => preview(a)}
                        className={`group flex items-center gap-3 px-3 py-2.5 rounded-xl cursor-pointer
                          ${sel && sel.path === a.path ? (isDark ? 'bg-[#333537]' : 'bg-[#E8EDF2]') : (isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#F0F4F9]')}`}>
                        <ArtifactTileIcon name={a.basename} />
                        <div className="flex-1 min-w-0">
                          <div className={`text-[14px] truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`} title={a.path}>{a.basename}</div>
                          <div className={`text-[12px] truncate ${muted}`}>
                            {t.apLastMod} {info ? apFormatMtime(info.modified) : '—'}
                          </div>
                        </div>
                        <button title={t.apBtnLocate} onClick={(e) => { e.stopPropagation(); bridge.openContainingFolder(a.path); }}
                          className={`opacity-0 group-hover:opacity-100 w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#1E1F20] text-[#C4C7C5]' : 'hover:bg-white text-[#444746]'}`}><FolderOpen size={16} /></button>
                      </div>
                    );
                  })}
                </div>
              ) : !sel ? (
                <div className={`flex-1 flex items-center justify-center text-[13px] ${muted}`}>{t.apPreviewHint}</div>
              ) : (
                <>
                  {/* preview content */}
                  <div className="flex-1 overflow-y-auto custom-scrollbar p-4 min-w-0">{renderContent()}</div>
                  {/* meta footer */}
                  <div className={`shrink-0 border-t px-4 py-3 ${isDark ? 'border-white/10 bg-[#1A1B1D]' : 'border-black/10 bg-[#F8FAFD]'}`}>
                    <div className={`text-[14px] font-medium truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{sel.basename}</div>
                    <div className={`mt-0.5 text-[12px] ${muted}`}>
                      {apKindLabel(t, pv.info && pv.info.kind, sel.basename)}
                      {pv.info && pv.info.size ? ' · ' + apFormatBytes(pv.info.size) : ''}
                    </div>
                    <div className={`mt-1.5 text-[12px] flex gap-2 ${muted}`}>
                      <span className="shrink-0">{t.apLocLabel}</span>
                      <span className="break-all">{sel.path}</span>
                    </div>
                    {pv.info && pv.info.modified ? (
                      <div className={`mt-0.5 text-[12px] flex gap-2 ${muted}`}>
                        <span className="shrink-0">{t.apMtimeLabel}</span>
                        <span>{apFormatMtime(pv.info.modified)}</span>
                      </div>
                    ) : null}
                    <div className="mt-3 flex items-center gap-2">
                      <button onClick={() => bridge.openArtifactExternal(sel.path)}
                        className={`flex-1 flex items-center justify-center gap-1.5 ${cardBtnCls(isDark, 'primary')}`}>
                        <ExternalLink size={15} /> {t.apBtnOpen}
                      </button>
                      <button onClick={() => bridge.openContainingFolder(sel.path)}
                        className={`flex-1 flex items-center justify-center gap-1.5 ${cardBtnCls(isDark)}`}>
                        <FolderOpen size={15} /> {t.apBtnLocate}
                      </button>
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 卡片池 (Persona / AgentPool)
    // ==========================================
    // Side B: agency-agents-zh 按"部门"组织(无档位/评分), 派生稳定的部门配色。
    const DEPT_LABELS = { academic:'学术', design:'设计', engineering:'工程', finance:'金融', 'game-development':'游戏', hr:'人力', legal:'法务', marketing:'营销', 'paid-media':'投放', product:'产品', 'project-management':'项管', sales:'销售', 'spatial-computing':'空间计算', specialized:'专项', 'supply-chain':'供应链', support:'客服', testing:'测试', tool:'工具' };
    // 部门标签按当前 UI 语言取词(t.depts),DEPT_LABELS(中文)兜底
    function deptLabelFor(t, k) { return (t && t.depts && t.depts[k]) || DEPT_LABELS[k] || k; }
    // 内置卡名称/简介按 UI 语言显示(personas-i18n.js overlay,按 id 查),中文兜底;自制卡不翻
    function personaText(c, t) {
      const L = t && t.langTag;
      if (!c || !L || L === 'zh' || c.source === 'user') return c || {};
      const tr = (typeof PERSONA_I18N !== 'undefined' && PERSONA_I18N[c.id] && PERSONA_I18N[c.id][L]) || null;
      if (!tr) return c;
      return { ...c, name: tr.name || c.name, description: tr.description || c.description };
    }
    const DEPT_ORDER = ['engineering','marketing','specialized','design','product','finance','sales','testing','project-management','paid-media','support','academic','game-development','spatial-computing','supply-chain','hr','legal','tool'];
    const ALL_DEPT = '__all__'; // 分类「全部」哨兵(语言中立,显示走 t.cpAll)
    const DEPT_COLOR = { academic:'#8B5CF6', design:'#EC4899', engineering:'#06B6D4', finance:'#10B981', 'game-development':'#F59E0B', hr:'#F472B6', legal:'#6B7280', marketing:'#F97316', 'paid-media':'#EF4444', product:'#7C3AED', 'project-management':'#3B82F6', sales:'#14B8A6', 'spatial-computing':'#6366F1', specialized:'#64748B', 'supply-chain':'#84CC16', support:'#22D3EE', testing:'#A855F7', tool:'#7C3AED' };
    // 可在编辑器下拉选的部门(排除 tool —— 那是内置工具卡专用)
    const DEPT_OPTIONS = DEPT_ORDER.filter(function(d){ return d !== 'tool'; });
    const deptColor = (d) => DEPT_COLOR[d] || '#9aa0a6';
    // 本地内置头像(50 张 Micah,src/avatars/),按卡 id 哈希固定分配
    const AVATAR_N = 50;
    function avatarSrc(id) {
      let h = 0; const s = String(id || '');
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      const n = (h % AVATAR_N) + 1;
      return 'avatars/avatar-' + (n < 10 ? '0' + n : n) + '.svg';
    }
    // 头像加载失败时按部门降级到本地图标
    const DEPT_ICON = { engineering: Terminal, design: Palette, product: AppWindow, marketing: TrendingUp, finance: Briefcase, sales: TrendingUp, testing: Cpu, 'project-management': Briefcase, 'paid-media': Radio, support: User, academic: Award, 'game-development': Cpu, 'spatial-computing': Globe, 'supply-chain': Briefcase, hr: User, legal: Award, specialized: Feather, tool: Cpu };
    // App Store 风头像块:本地头像图,失败降级图标(绝不显示文字)
    const AppIcon = ({ card, isDark, cls = 'w-14 h-14 rounded-[14px]', fb = 26 }) => {
      const [err, setErr] = useState(false);
      const Fallback = DEPT_ICON[(card && card.dept)] || User;

    const CardPoolView = ({ theme, t, bs, onEquipped, onAICreate, initialMyOnly }) => {

      const targetTitle = target ? (target.title || t.newChat) : null;
      const [activeDept, setActiveDept] = useState(ALL_DEPT);
      const [query, setQuery] = useState('');
      const [visible, setVisible] = useState(60);
      const [detail, setDetail] = useState(null);

      const [editor, setEditor] = useState(null); // null | { initial }
      const [chooser, setChooser] = useState(false); // 造卡方式选择(AI/手动)
      const [myOnly, setMyOnly] = useState(!!initialMyOnly); // 「我的卡牌」facet(从存入确认窗"去查看"进来则默认开)
      const [confirmDelId, setConfirmDelId] = useState(null); // 卡上删除二次确认

      useEffect(() => { if (bridge.available) bridge.loadPersonas(); }, []);
      useEffect(() => { setVisible(60); }, [query, activeDept, myOnly]);
      useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 2400); return () => clearTimeout(id); }, [toast]);

      const counts = {}; list.forEach(c => { counts[c.dept] = (counts[c.dept]||0)+1; });
      const userCount = list.filter(c => c.source === 'user').length;
      const q = query.trim().toLowerCase();
      const filtered = list.filter(c => {
        if (myOnly && c.source !== 'user') return false;
        if (activeDept !== ALL_DEPT && c.dept !== activeDept) return false;
        if (q) {
          // 原文 + 本地化名/简介都进搜索域,中英日关键词均可命中
          const loc = personaText(c, t);
          const hay = (c.name+' '+c.description+' '+loc.name+' '+loc.description+' '+c.dept+' '+deptLabelFor(t, c.dept)).toLowerCase();
          if (hay.indexOf(q) < 0) return false;
        }
        return true;
      });
      const shown = filtered.slice(0, visible);

      function resetFacets() { setActiveDept(ALL_DEPT); setQuery(''); setMyOnly(false); }
      function editCard(card, e){ if(e) e.stopPropagation(); setEditor({ initial: card }); }
      function doDelete(card, e){ if(e) e.stopPropagation(); setConfirmDelId(null);
        Promise.resolve(bridge.deletePersona(card.id)).then(function(){ setToast(t.cpToastDeleted(card.name)); }).catch(function(){ setToast(t.cpToastDelFailed); }); }
      function onMove(e){ const el=e.currentTarget; const r=el.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
        el.style.transform=`perspective(900px) rotateX(${(0.5-py)*9}deg) rotateY(${(px-0.5)*11}deg) translateY(-3px)`;
        el.style.setProperty('--mx',(px*100)+'%'); el.style.setProperty('--my',(py*100)+'%'); }
      function onLeave(e){ e.currentTarget.style.transform=''; }
      function equip(card, e){ if(e) e.stopPropagation();
        if (active && active.id===card.id) { bridge.unequipPersona(); setToast(t.cpToastUnequipped(personaText(card, t).name)); }
        else { Promise.resolve(bridge.equipPersona(card.id)).then(s => { if (s) setToast(t.cpToastEquipped(targetTitle || t.cpCurrentChat, personaText(s, t).name)); }); } }
      function openDetail(card, e){ const r=e.currentTarget.getBoundingClientRect();
        setDetail({ card, rect:{ left:r.left, top:r.top, width:r.width, height:r.height } }); }

      // 分类横向滚动箭头(PC 鼠标无左滑)
      const scrollRef = useRef(null);
      const [showL, setShowL] = useState(false);
      const [showR, setShowR] = useState(false);
      const checkScroll = () => { const el = scrollRef.current; if (!el) return; setShowL(el.scrollLeft > 2); setShowR(el.scrollLeft < el.scrollWidth - el.clientWidth - 2); };
      useEffect(() => { const el = scrollRef.current; if (!el) return; checkScroll(); el.addEventListener('scroll', checkScroll); window.addEventListener('resize', checkScroll); return () => { el.removeEventListener('scroll', checkScroll); window.removeEventListener('resize', checkScroll); }; }, [list.length]);
      const scrollPills = (dx) => { if (scrollRef.current) scrollRef.current.scrollBy({ left: dx, behavior: 'smooth' }); };
      // 右键上下文菜单(自制卡 编辑/删除,macOS 风);点别处/滚动关闭
      const [ctx, setCtx] = useState(null); // { card, x, y }
      useEffect(() => { if (!ctx) return; const close = () => setCtx(null); window.addEventListener('click', close); window.addEventListener('scroll', close, true); return () => { window.removeEventListener('click', close); window.removeEventListener('scroll', close, true); }; }, [ctx]);
      function openCtx(card, e){ if (card.source !== 'user') return; e.preventDefault(); e.stopPropagation(); setCtx({ card, x: e.clientX, y: e.clientY }); }

      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 overflow-hidden animate-in fade-in duration-300"
          style={{ fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif', background: isDark ? '#131314' : '#fff' }}>
          <div className="relative z-10 flex-1 min-h-0 overflow-y-auto custom-scrollbar">
            <div className="max-w-7xl mx-auto">

              {/* 头部:标题 + 加持目标小提示 / 我的专家 + 新建（无暗色toggle，用全局主题） */}
              <div className="px-6 md:px-10 pt-8 pb-1 flex items-start justify-between gap-4">
                <div className="min-w-0">
                  <h1 className="text-[32px] font-normal tracking-tight" style={{ color: isDark ? '#fff' : '#000' }}>专家卡牌池</h1>
                  <div className="text-[13px] mt-1.5 truncate" style={{ color: isDark ? 'rgba(235,235,245,.6)' : 'rgba(60,60,67,.6)' }}>
                    {active
                      ? <span style={{ color: isDark ? '#0A84FF' : '#007AFF', fontWeight: 500 }}>✓ 已加持「{personaText(active, t).name}」</span>
                      : t.cpTagline}
                  </div>
                </div>
                <div className="flex items-center gap-3 pt-2 shrink-0">
                  <button onClick={() => setMyOnly(!myOnly)} className="px-4 h-9 rounded-full text-[14px] font-medium transition-colors whitespace-nowrap"
                    style={ myOnly ? { background: isDark ? '#0A84FF' : '#007AFF', color: '#fff' } : { background: isDark ? '#2C2C2E' : '#F2F2F7', color: isDark ? '#0A84FF' : '#007AFF' } }>
                    {t.cpMyCards}
                  </button>
                  <button onClick={() => setChooser(true)} title={t.cpNewCardTitle} className="w-9 h-9 rounded-full flex items-center justify-center transition-colors"
                    style={{ background: isDark ? '#2C2C2E' : '#F2F2F7', color: isDark ? '#0A84FF' : '#007AFF' }}>
                    <Plus size={20} />
                  </button>
                </div>
              </div>

              {/* 搜索 */}
              <div className="px-6 md:px-10 py-3">
                <div className="relative">
                  <Search size={18} className="absolute left-2.5 top-1/2 -translate-y-1/2" style={{ color: '#8E8E93' }} />
                  <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t.cpSearchPh}
                    className="w-full rounded-[10px] pl-9 pr-9 py-2 text-[16px] outline-none"
                    style={{ background: isDark ? 'rgba(118,118,128,.24)' : 'rgba(118,118,128,.12)', color: isDark ? '#fff' : '#000' }} />
                  {query ? <button onClick={() => setQuery('')} className="absolute right-2.5 top-1/2 -translate-y-1/2" style={{ color: '#8E8E93' }}><X size={16} /></button> : null}
                </div>
              </div>

              {/* AI 造卡推广 banner(搜索框下方,一直显示) */}
              <div className="px-6 md:px-10 pt-3 pb-4">
                <AICardBanner onStart={onAICreate} isDark={isDark} t={t} />
              </div>

              {/* 分类药丸 + 左右滚动箭头 */}
              <div className="relative px-6 md:px-10 pt-2 pb-4 group">
                {showL ? <button onClick={() => scrollPills(-220)} className="absolute left-4 top-1/2 -translate-y-1/2 z-10 w-8 h-8 rounded-full flex items-center justify-center border opacity-0 group-hover:opacity-100 transition shadow-sm" style={{ background: isDark ? '#2C2C2E' : '#fff', color: isDark ? '#fff' : '#000', borderColor: isDark ? '#38383A' : 'rgba(198,198,200,.6)' }}><ChevronLeft size={18} /></button> : null}
                <div ref={scrollRef} className="flex overflow-x-auto gap-2 no-scrollbar scroll-smooth">
                  {[ALL_DEPT].concat(DEPT_ORDER.filter(k => counts[k])).map(k => {
                    const isAll = k === ALL_DEPT; const on = isAll ? activeDept === ALL_DEPT : activeDept === k;
                    return (
                      <button key={k} onClick={() => setActiveDept(k)} className="whitespace-nowrap shrink-0 text-[15px] px-4 py-1.5 rounded-full font-medium transition-colors"
                        style={ on ? { background: isDark ? '#fff' : '#3A3A3C', color: isDark ? '#000' : '#fff' } : { background: isDark ? '#2C2C2E' : '#F2F2F7', color: isDark ? '#fff' : '#000' } }>
                        {isAll ? t.cpAll : deptLabelFor(t, k)}
                      </button>
                    );
                  })}
                </div>
                {showR ? <button onClick={() => scrollPills(220)} className="absolute right-4 top-1/2 -translate-y-1/2 z-10 w-8 h-8 rounded-full flex items-center justify-center border opacity-0 group-hover:opacity-100 transition shadow-sm" style={{ background: isDark ? '#2C2C2E' : '#fff', color: isDark ? '#fff' : '#000', borderColor: isDark ? '#38383A' : 'rgba(198,198,200,.6)' }}><ChevronRight size={18} /></button> : null}
              </div>

              {/* 列表 */}
              <div className="px-6 md:px-10 pb-12">
                {pool.loadState === 'loading' ? (
                  <div className="py-24 text-center text-[15px]" style={{ color: '#8E8E93' }}>{t.cpLoading}</div>
                ) : pool.loadState === 'error' ? (
                  <div className="py-24 text-center text-[15px] text-[#FF3B30]">{t.cpLoadError}</div>
                ) : shown.length > 0 ? (
                  <div className="grid gap-x-8 gap-y-0" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))' }}>
                    {shown.map(c => { const isEmpowered = active && active.id === c.id; const isUser = c.source === 'user'; const cd = personaText(c, t);
                      return (
                        <div key={c.id} onClick={(e) => openDetail(c, e)} onContextMenu={(e) => openCtx(c, e)}
                          className="group py-4 flex flex-col gap-2.5 border-b cursor-pointer" style={{ borderColor: isDark ? '#38383A' : 'rgba(198,198,200,.5)' }}>
                          <div className="flex items-center gap-4">
                            <AppIcon card={c} isDark={isDark} />
                            <div className="flex-1 min-w-0">
                              <h2 className="text-[17px] font-semibold tracking-tight truncate mb-0.5" style={{ color: isDark ? '#fff' : '#000' }}>{cd.name}</h2>
                              <p className="text-[13px] truncate" style={{ color: isDark ? 'rgba(235,235,245,.6)' : 'rgba(60,60,67,.6)' }}>{deptLabelFor(t, c.dept)}{isUser ? ' · ' + t.cpBadgeUser : ''}</p>
                            </div>
                            {isUser ? <button onClick={(e) => openCtx(c, e)} title={t.cpEdit} className="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-[18px] opacity-0 group-hover:opacity-100 transition-opacity" style={{ color: '#8E8E93' }}>⋯</button> : null}
                            <button onClick={(e) => equip(c, e)} className="shrink-0 text-[15px] font-bold px-5 py-1.5 rounded-full transition active:opacity-70"
                              style={ isEmpowered ? { background: isDark ? '#2C2C2E' : '#F2F2F7', color: '#8E8E93' } : { background: isDark ? '#2C2C2E' : '#F2F2F7', color: isDark ? '#0A84FF' : '#007AFF' } }>
                              {isEmpowered ? t.cpUnequip : t.cpEquipShort}
                            </button>
                          </div>
                          <p className="text-[13px] leading-snug line-clamp-2" style={{ color: '#8E8E93' }}>{cd.description || t.cpNoDesc}</p>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="py-24 text-center">
                    <p className="text-[17px] font-semibold" style={{ color: isDark ? '#fff' : '#000' }}>{t.cpNoMatch}</p>
                    <p className="text-[15px] mt-1" style={{ color: '#8E8E93' }}>{t.cpEmptyHint}</p>
                  </div>
                )}
                {filtered.length > visible ? (
                  <div className="flex justify-center mt-6">
                    <button onClick={() => setVisible(visible + 60)} className="text-[15px] px-5 py-2" style={{ color: isDark ? '#0A84FF' : '#007AFF' }}>{t.cpShowMore(filtered.length - visible)}</button>
                  </div>
                ) : null}
              </div>

            </div>
          </div>

          {/* 右键菜单（自制卡 编辑/删除，macOS 风） */}
          {ctx ? (
            <div className="fixed z-[100] min-w-[128px] rounded-[10px] overflow-hidden border text-[14px]"
              style={{ left: Math.min(ctx.x, (typeof window !== 'undefined' ? window.innerWidth : 9999) - 150), top: Math.min(ctx.y, (typeof window !== 'undefined' ? window.innerHeight : 9999) - 100), background: isDark ? '#2C2C2E' : '#fff', borderColor: isDark ? '#38383A' : 'rgba(0,0,0,.08)', boxShadow: '0 10px 40px rgba(0,0,0,.25)' }}
              onClick={(e) => e.stopPropagation()}>
              <button onClick={() => { editCard(ctx.card); setCtx(null); }} className="w-full text-left px-4 py-2.5" style={{ color: isDark ? '#fff' : '#000' }}>{t.cpMenuEdit}</button>
              <div style={{ height: 1, background: isDark ? '#38383A' : 'rgba(0,0,0,.06)' }} />
              <button onClick={() => { doDelete(ctx.card); setCtx(null); }} className="w-full text-left px-4 py-2.5" style={{ color: '#FF3B30' }}>{t.cpDelete}</button>
            </div>
          ) : null}

          {detail ? ReactDOM.createPortal((
            <PersonaDetailModal card={detail.card} originRect={detail.rect} equipped={active && active.id===detail.card.id}
              isDark={isDark} t={t} onClose={()=>setDetail(null)}
              onEquip={(card)=>{ equip(card); }} />
          ), document.body) : null}

          {/* 自创卡编辑器(新建/编辑) —— portal 到 body,蒙层盖住侧边栏 */}
          {editor ? ReactDOM.createPortal((
            <PersonaEditorModal initial={editor.initial} isDark={isDark} t={t}
              onClose={()=>setEditor(null)}
              onSaved={(sum)=>setToast((editor.initial && editor.initial.id ? t.cpToastSaved : t.cpToastCreated)(sum.name))}
              onDeleted={(card)=>setToast(t.cpToastDeleted(card.name))} />
          ), document.body) : null}

          {/* 造卡方式选择(iOS action sheet) —— portal 到 body,跳出卡池 z-10 上下文,蒙层才能盖住侧边栏 */}
          {chooser ? ReactDOM.createPortal((
            <div className="fixed inset-0 z-[70] flex items-end md:items-center justify-center md:p-4" style={{ background:'rgba(0,0,0,.6)', backdropFilter:'blur(2px)', WebkitBackdropFilter:'blur(2px)' }} onClick={()=>setChooser(false)}>
              <div onClick={(e)=>e.stopPropagation()} className="w-full md:max-w-sm flex flex-col gap-2 p-3 md:p-0">
                <div className="rounded-[14px] overflow-hidden" style={{ background: isDark?'#1C1C1E':'#fff' }}>
                  <button onClick={()=>{ setChooser(false); if (onAICreate) onAICreate(); }} className="w-full flex items-center gap-3 px-4 py-4 text-left border-b" style={{ borderColor: isDark?'#38383A':'rgba(198,198,200,.5)' }}>
                    <div className="w-10 h-10 rounded-[12px] flex items-center justify-center shrink-0" style={{ background: isDark?'#0A84FF':'#007AFF' }}><Sparkles size={20} style={{ color:'#fff' }} /></div>
                    <div className="min-w-0">
                      <div className="text-[16px] font-semibold flex items-center gap-2" style={{ color: isDark?'#fff':'#000' }}>{t.cpAICreate} <span className="text-[10px] px-1.5 py-0.5 rounded" style={{ background: isDark?'rgba(10,132,255,.2)':'rgba(0,122,255,.12)', color: isDark?'#0A84FF':'#007AFF' }}>{t.chooserRecommend}</span></div>
                      <div className="text-[13px] mt-0.5" style={{ color: isDark?'rgba(235,235,245,.6)':'rgba(60,60,67,.6)' }}>{t.chooserAIDesc}</div>
                    </div>
                  </button>
                  <button onClick={()=>{ setChooser(false); setEditor({ initial: null }); }} className="w-full flex items-center gap-3 px-4 py-4 text-left">
                    <div className="w-10 h-10 rounded-[12px] flex items-center justify-center shrink-0" style={{ background: isDark?'#2C2C2E':'#F2F2F7', color: isDark?'#0A84FF':'#007AFF' }}><Plus size={20} /></div>
                    <div className="min-w-0">
                      <div className="text-[16px] font-semibold" style={{ color: isDark?'#fff':'#000' }}>{t.chooserManualTitle}</div>
                      <div className="text-[13px] mt-0.5" style={{ color: isDark?'rgba(235,235,245,.6)':'rgba(60,60,67,.6)' }}>{t.chooserManualDesc}</div>
                    </div>
                  </button>
                </div>
                <button onClick={()=>setChooser(false)} className="w-full rounded-[14px] py-3.5 text-[17px] font-semibold" style={{ background: isDark?'#2C2C2E':'#fff', color: isDark?'#0A84FF':'#007AFF' }}>{t.cpCancel}</button>
              </div>
            </div>
          ), document.body) : null}

          {/* iOS 风 toast */}
          {toast ? (
            <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-[90] px-5 py-2.5 rounded-full text-[14px] font-medium animate-in fade-in slide-in-from-bottom-2 duration-200"
              style={{ background: isDark ? 'rgba(44,44,46,.96)' : 'rgba(0,0,0,.85)', color: '#fff', boxShadow: '0 8px 30px rgba(0,0,0,.3)' }}>
              {toast}
            </div>
          ) : null}
        </div>
      );
    };

    // ==========================================
    // Shared Components
    // ==========================================

    const NavItem = ({ icon, label, active, theme, isSidebarOpen = true, onClick, dragKind, dragging, onPickUp }) => {
      const isDark = theme === 'dark';
      const drag = useLongPressDrag(dragKind, onPickUp);
      const dragProps = dragKind ? drag.handlers : {};
      const clickH = dragKind ? drag.guardClick(onClick) : onClick;
      return (
        <div
          onClick={clickH}
          {...dragProps}
          data-nav={dragKind || undefined}
          title={!isSidebarOpen ? label : ""}
          style={dragging ? { opacity: 0.4 } : undefined}
          className={`group flex items-center cursor-pointer text-[15px] font-medium transition-all overflow-hidden select-none
          ${isSidebarOpen ? 'px-4 py-3 rounded-full w-full' : 'w-10 h-10 justify-center rounded-full mx-auto shrink-0'}
          ${active
            ? (isDark ? 'bg-[#A8C7FA] text-[#041E49]' : 'bg-[#D3E3FD] text-[#041E49]')
            : (isDark ? 'text-[#E3E3E3] hover:bg-[#282A2C]' : 'text-[#1F1F1F] hover:bg-[#E1E5EA]')}`}
        >
          <div className={`${isSidebarOpen ? 'mr-4' : ''} shrink-0 ${active ? (isDark ? 'text-[#041E49]' : 'text-[#0B57D0]') : ''}`}>
            {icon}
          </div>
          {isSidebarOpen && <span className="whitespace-nowrap">{label}</span>}
        </div>
      );
    };

    const ArchiveConfirmDialog = ({ theme, t, onCancel, onConfirm }) => {
      const isDark = theme === 'dark';
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'Escape') onCancel();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onCancel]);
      return (
        <div
          role="presentation"
          className="fixed inset-0 z-[200] flex items-center justify-center p-4"
          style={{
            background: 'rgba(0,0,0,.34)',
            backdropFilter: 'blur(14px) saturate(140%)',
            WebkitBackdropFilter: 'blur(14px) saturate(140%)',
            fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif'
          }}
          onClick={onCancel}
        >
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby="archive-confirm-title"
            className="w-[320px] max-w-[calc(100vw-48px)] overflow-hidden rounded-[16px] shadow-2xl"
            style={{
              background: isDark ? 'rgba(44,44,46,.96)' : 'rgba(250,250,250,.96)',
              color: isDark ? '#F2F2F7' : '#000',
              boxShadow: isDark ? '0 24px 60px rgba(0,0,0,.55)' : '0 24px 60px rgba(0,0,0,.22)'
            }}
            onClick={e => e.stopPropagation()}
          >
            <div className="px-6 pt-6 pb-5 text-center">
              <div id="archive-confirm-title" className="text-[20px] font-semibold leading-[26px]">{t.archiveConfirmTitle}</div>
              <div className="mt-2.5 text-[15px] leading-[22px]" style={{ color: isDark ? 'rgba(235,235,245,.72)' : 'rgba(60,60,67,.72)' }}>
                <div>{t.archiveConfirmMessage}</div>
                {t.archiveConfirmDetail && <div className="mt-1">{t.archiveConfirmDetail}</div>}
              </div>
            </div>
            <div className="h-px" style={{ background: isDark ? 'rgba(84,84,88,.65)' : 'rgba(60,60,67,.24)' }} />
            <div className="grid grid-cols-2">
              <button
                type="button"
                onClick={onCancel}
                className="h-[50px] text-[17px] active:opacity-70"
                style={{ color: isDark ? '#0A84FF' : '#007AFF' }}
              >
                {t.cpCancel}
              </button>
              <button
                type="button"
                onClick={onConfirm}
                className="h-[50px] text-[17px] font-semibold active:opacity-70"
                style={{
                  color: isDark ? '#0A84FF' : '#007AFF',
                  borderLeft: `1px solid ${isDark ? 'rgba(84,84,88,.65)' : 'rgba(60,60,67,.24)'}`
                }}
              >
                {t.archiveConfirmAction}
              </button>
            </div>
          </div>
        </div>
      );
    };

    const ArchivedDeleteConfirmDialog = ({ theme, t, onCancel, onConfirm }) => {
      const isDark = theme === 'dark';
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'Escape') onCancel();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onCancel]);
      return (
        <div
          role="presentation"
          className="fixed inset-0 z-[200] flex items-center justify-center p-4"
          style={{
            background: 'rgba(0,0,0,.34)',
            backdropFilter: 'blur(14px) saturate(140%)',
            WebkitBackdropFilter: 'blur(14px) saturate(140%)',
            fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif'
          }}
          onClick={onCancel}
        >
          <div
            role="alertdialog"
            aria-modal="true"
            aria-labelledby="archived-delete-confirm-title"
            className="w-[320px] max-w-[calc(100vw-48px)] overflow-hidden rounded-[16px] shadow-2xl"
            style={{
              background: isDark ? 'rgba(44,44,46,.96)' : 'rgba(250,250,250,.96)',
              color: isDark ? '#F2F2F7' : '#000',
              boxShadow: isDark ? '0 24px 60px rgba(0,0,0,.55)' : '0 24px 60px rgba(0,0,0,.22)'
            }}
            onClick={e => e.stopPropagation()}
          >
            <div className="px-6 pt-6 pb-5 text-center">
              <div id="archived-delete-confirm-title" className="text-[20px] font-semibold leading-[26px]">{t.archivedDeleteTitle}</div>
              <div className="mt-2.5 text-[15px] leading-[22px]" style={{ color: isDark ? 'rgba(235,235,245,.72)' : 'rgba(60,60,67,.72)' }}>
                {t.archivedDeleteMessage}
              </div>
            </div>
            <div className="h-px" style={{ background: isDark ? 'rgba(84,84,88,.65)' : 'rgba(60,60,67,.24)' }} />
            <div className="grid grid-cols-2">
              <button
                type="button"
                onClick={onCancel}
                className="h-[50px] text-[17px] active:opacity-70"
                style={{ color: isDark ? '#0A84FF' : '#007AFF' }}
              >
                {t.cpCancel}
              </button>
              <button
                type="button"
                onClick={onConfirm}
                className="h-[50px] text-[17px] font-semibold active:opacity-70"
                style={{
                  color: '#FF3B30',
                  borderLeft: `1px solid ${isDark ? 'rgba(84,84,88,.65)' : 'rgba(60,60,67,.24)'}`
                }}
              >
                {t.archivedDeleteAction}
              </button>
            </div>
          </div>
        </div>
      );
    };

    const ArchiveToast = ({ theme, t, onClose, onView }) => {
      const isDark = theme === 'dark';
      return (
        <div
          className="fixed left-1/2 top-6 z-[210] -translate-x-1/2 px-2 py-2 rounded-[18px] flex items-center gap-1 shadow-2xl"
          style={{
            background: isDark ? 'rgba(44,44,46,.94)' : 'rgba(250,250,250,.94)',
            color: isDark ? '#F2F2F7' : '#1C1C1E',
            border: `1px solid ${isDark ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.08)'}`,
            backdropFilter: 'blur(18px) saturate(150%)',
            WebkitBackdropFilter: 'blur(18px) saturate(150%)',
            fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif'

        >
          <div className="pl-3 pr-2 text-[14px] leading-5 whitespace-nowrap">{t.archiveSuccess}</div>
          <button
            type="button"

            style={{ color: isDark ? '#0A84FF' : '#007AFF', background: isDark ? 'rgba(10,132,255,.12)' : 'rgba(0,122,255,.10)' }}
          >
            {t.archiveSuccessView}
          </button>
          <button
            type="button"
            onClick={onClose}
            className="w-8 h-8 rounded-full text-[18px] leading-none active:opacity-70"
            style={{ color: isDark ? 'rgba(235,235,245,.62)' : 'rgba(60,60,67,.62)' }}
            aria-label={t.cpCancel}
          >
            ×
          </button>
        </div>
      );
    };

    // 近期会话项：支持重命名(内联编辑) + 删除(内联二次确认)
    const RecentItem = ({ chat, active, personaTarget, theme, t, onSelect, onRename, onDelete, onTogglePinned, onOpenFolder, onArchive, dragging, onPickUp }) => {
      const isDark = theme === 'dark';
      const [editing, setEditing] = useState(false);
      const [confirming, setConfirming] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [menuUp, setMenuUp] = useState(false);
      const [val, setVal] = useState(chat.title);
      const drag = useLongPressDrag('session', onPickUp);
      function save() { const tx = val.trim(); setEditing(false); if (tx && tx !== chat.title) onRename(chat.id, tx); }
      const closeMenu = () => setMenuOpen(false);
      const toggleMenu = (e) => {
        e.stopPropagation();
        const rect = e.currentTarget.getBoundingClientRect();
        setMenuUp(window.innerHeight - rect.bottom < 120);
        setMenuOpen(v => !v);
      };
      const menuItemCls = `w-full h-9 px-3 flex items-center gap-2 text-left text-[14px] whitespace-nowrap transition-colors ${isDark ? 'text-[#E3E3E3] hover:bg-[#303134]' : 'text-[#1F1F1F] hover:bg-[#F1F3F4]'}`;
      if (editing) {
        return (
          <div className="px-1.5 py-0.5">
            <input autoFocus value={val}
              onChange={e => setVal(e.target.value)}
              onClick={e => e.stopPropagation()}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); save(); } else if (e.key === 'Escape') { setEditing(false); setVal(chat.title); } }}
              onBlur={save}
              className={`w-full px-3 py-1 rounded-full text-[15px] outline-none ${isDark ? 'bg-[#131314] text-[#E3E3E3] ring-1 ring-[#A8C7FA]' : 'bg-white text-[#1F1F1F] ring-1 ring-[#0B57D0]'}`} />
          </div>
        );
      }
      return (
        <div onClick={drag.guardClick(() => onSelect(chat.id))}
          {...drag.handlers}
          title={personaTarget ? t.cpTargetMarkTitle : undefined}
          style={ dragging ? { opacity: 0.4 } : (personaTarget ? { background: isDark?'rgba(10,132,255,.20)':'rgba(0,122,255,.12)', boxShadow:'inset 0 0 0 1px '+(isDark?'rgba(10,132,255,.6)':'rgba(0,122,255,.45)'), color: isDark?'#fff':'#1F1F1F' } : undefined) }
          className={`group flex items-center px-4 py-1.5 rounded-full cursor-pointer text-[15px] transition-all
            ${personaTarget ? ''
              : active ? (isDark ? 'bg-[#333537] text-white' : 'bg-[#E1E5EA] text-[#1F1F1F]')
                     : (isDark ? 'text-[#E3E3E3] hover:bg-[#282A2C]' : 'text-[#1F1F1F] hover:bg-[#E1E5EA]')}`}>
          {personaTarget && <Sparkles size={13} className="shrink-0 mr-1.5" style={{ color: isDark?'#0A84FF':'#007AFF' }} />}
          <span className="truncate pr-2 leading-relaxed whitespace-nowrap flex-1">{chat.title}</span>
          {chat.working && <span className="shrink-0 mr-1 inline-block w-2 h-2 rounded-full bg-current opacity-70 animate-pulse" title={t.riGenerating}></span>}
          {chat.skill && <span className="text-[11px] shrink-0 opacity-70 mr-1" title={chat.skill}>🧭</span>}
          {confirming ? (
            <div className="flex items-center gap-0.5 shrink-0" onClick={e => e.stopPropagation()}>
              <span className={`text-[11px] mr-0.5 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>{t.riDelQ}</span>
              <button title={t.riDelConfirm} onClick={(e) => { e.stopPropagation(); onDelete(chat.id); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center ${isDark ? 'text-[#F28B82] hover:bg-[#5c2b29]' : 'text-[#C5221F] hover:bg-[#FAD2CF]'}`}><Check size={14} /></button>
              <button title={t.cpCancel} onClick={(e) => { e.stopPropagation(); setConfirming(false); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center ${isDark ? 'text-[#C4C7C5] hover:bg-[#444746]' : 'text-[#5F6368] hover:bg-[#D3D7DB]'}`}><X size={13} /></button>
            </div>
          ) : (
            <>
              {/* 默认: 显示日期(辨识每条会话什么时候发生);hover/active 时换成编辑/删除按钮 */}
              {chat.date && (
                <span className={`text-[11px] shrink-0 opacity-60 whitespace-nowrap group-hover:hidden ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
                  {chat.date}
                </span>
              )}
              <div className="hidden group-hover:flex items-center gap-0.5 shrink-0">
                <button title={chat.pinned ? t.riUnpin : t.riPin} onClick={(e) => { e.stopPropagation(); onTogglePinned && onTogglePinned(chat.id, !chat.pinned); }}
                  className={`w-6 h-6 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#444746]' : 'text-[#5F6368] hover:bg-[#D3D7DB]'}`}>
                  {chat.pinned ? <PinOffIcon size={13} /> : <PinIcon size={13} />}
                </button>
                <button title={t.riRename} onClick={(e) => { e.stopPropagation(); setVal(chat.title); setEditing(true); }}
