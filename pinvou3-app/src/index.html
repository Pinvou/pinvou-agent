                  <button
                    onClick={setSuperPerm}
                    className={`w-[52px] h-[32px] rounded-full p-[2px] transition-colors duration-300 relative ${superPerm ? (isDark ? 'bg-[#A8C7FA]' : 'bg-[#0B57D0]') : (isDark ? 'bg-[#444746]' : 'bg-[#747775]')}`}
                  >
                    <div className={`w-[28px] h-[28px] rounded-full shadow-sm transform transition-transform duration-300 ${isDark ? 'bg-[#041E49]' : 'bg-white'} ${superPerm ? 'translate-x-[20px]' : 'translate-x-0'}`} />
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // Chat View (Gemini Centered Style + Messages)
    // ==========================================
    const ChatView = ({ theme, t, bs, prefill, onPrefillConsumed }) => {
      const isDark = theme === 'dark';
      const [inputText, setInputText] = useState('');
      const [artifactsOpen, setArtifactsOpen] = useState(false);
      const scrollRef = useRef(null);
      const chatItems = bs ? bs.chatItems : [];
      const busy = bs ? bs.busy : false;
      const hasMessages = chatItems.length > 0;
      const attachments = (bs && bs.attachments) || [];
      const artifactCount = (bs && bs.artifacts) ? bs.artifacts.length : 0;
      const hasSkill = !!(bs && bs.workflow && bs.workflow.activeSkillName);
      let lastUserId = null;
      for (let i = chatItems.length - 1; i >= 0; i--) { if (chatItems[i].type === 'user') { lastUserId = chatItems[i].id; break; } }

      // 工作流启用时预填输入框
      useEffect(() => {
        if (prefill) { setInputText(prefill); if (onPrefillConsumed) onPrefillConsumed(); }
      }, [prefill]);

      // Auto-scroll：直接滚内部容器到底（绝不动外层窗口，避免内容被顶到看不见/拉不动）
      useEffect(() => {
        const el = scrollRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, [chatItems.length, chatItems[chatItems.length - 1]?.html]);

      function handleSend() {
        if (busy) return;
        const hasReady = attachments.some(a => a.status === 'ready');
        if (!inputText.trim() && !hasReady) return;
        if (bridge.available) bridge.sendMessage(inputText.trim());
        setInputText('');
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      }

      function handleCancel() {
        if (bridge.available) bridge.cancelGeneration();
      }

      function handlePaste(e) {
        const items = (e.clipboardData && e.clipboardData.items) || [];
        for (const it of items) {
          if (it.type && it.type.indexOf('image/') === 0) {
            const file = it.getAsFile();
            if (!file) continue;
            e.preventDefault();
            const reader = new FileReader();
            reader.onload = () => {
              const bytes = Array.from(new Uint8Array(reader.result));
              const ext = (file.type.split('/')[1] || 'png');
              if (bridge.available) bridge.addPasteImage(`paste-${Date.now()}.${ext}`, bytes);
            };
            reader.readAsArrayBuffer(file);
          }
        }
      }

      return (
        <div className="flex-1 flex flex-col w-full h-full min-h-0 relative z-10 animate-in fade-in duration-300">
          {artifactsOpen && <ArtifactsPanel bs={bs} theme={theme} t={t} onClose={() => setArtifactsOpen(false)} />}

          {/* Top Header (浮动) */}
          <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-20 pointer-events-none">
            <div className="flex items-center gap-2">
              <ModeHeader bs={bs} theme={theme} />
              <PinvouToggle bs={bs} theme={theme} />
            </div>
            <button
              onClick={() => setArtifactsOpen(true)}
              className={`pointer-events-auto px-4 py-2 rounded-full text-[14px] font-medium flex items-center gap-2 ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3] hover:bg-[#333537]' : 'bg-white text-[#1F1F1F] hover:bg-[#F0F4F9] shadow-sm'}`}>
              <Package size={16} /> {t.artifacts}
              {artifactCount > 0 && <span className={`text-[11px] px-1.5 rounded-full ${isDark ? 'bg-[#A8C7FA] text-[#062E6F]' : 'bg-[#0B57D0] text-white'}`}>{artifactCount}</span>}
            </button>
          </div>

          {/* 工作流 phase pipeline —— 固定在顶部(清浮动顶栏)，绑定 skill 才显示 */}
          {hasSkill && (
            <div className="shrink-0 pt-16 px-4 md:px-20 lg:px-40">
              <div className="max-w-[800px] w-full mx-auto"><PhaseChips bs={bs} theme={theme} /></div>
            </div>
          )}

          {/* Main Chat Area */}
          <div ref={scrollRef} className={`flex-1 min-h-0 overflow-y-auto px-4 md:px-20 lg:px-40 pb-40 custom-scrollbar flex flex-col ${hasSkill ? 'pt-3' : 'pt-20'} ${hasMessages ? 'justify-start' : 'items-center justify-center'}`}>

            {!hasMessages && (
              /* Gemini Style Centered Empty State */
              <div className="text-center mb-12 animate-in slide-in-from-bottom-4 duration-500">
                <h1 className={`text-[44px] font-normal mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                  {t.chatGreeting}
                </h1>
              </div>
            )}

            {hasMessages && (
              <div className="max-w-[800px] w-full mx-auto space-y-4">
                {chatItems.map((item) => (
                  <ChatBubble key={item.id} item={item} theme={theme} onPrefill={(txt) => setInputText(txt)} editable={!busy && item.id === lastUserId} />
                ))}
                {busy && <ThinkingBubble thinking={bs && bs.thinking} theme={theme} />}
              </div>
            )}

          </div>

          {/* Floating Input Area */}
          <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-full max-w-[800px] px-4 z-20">
            {/* 附件 chips */}
            {attachments.length > 0 && (
              <div className="flex flex-wrap gap-2 mb-2 px-2">
                {attachments.map((a) => (
                  <div key={a.id} className={`flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full text-[12px] ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3]' : 'bg-white text-[#1F1F1F] shadow-sm'}`}>
                    <span>📎</span>
                    <span className="max-w-[160px] truncate">{a.basename}</span>
                    <span className={a.status === 'error' ? 'text-[#F28B82]' : a.status === 'parsing' ? 'opacity-60' : 'text-[#93D5A6]'}>
                      {a.status === 'parsing' ? '解析中…' : a.status === 'error' ? '失败' : '✓'}
                    </span>
                    <button onClick={() => bridge.removeAttachment(a.id)} className={`w-5 h-5 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537]' : 'hover:bg-[#F0F4F9]'}`}>×</button>
                  </div>
                ))}
              </div>
            )}
            <div className={`flex items-center gap-3 p-2 rounded-full shadow-lg ${isDark ? 'bg-[#1E1F20]' : 'bg-white'}`}>

              <button onClick={() => bridge.available && bridge.pickAndAttach()} title="添加附件"
                className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}>
                <Paperclip size={20} />
              </button>

              <input
                type="text"
                placeholder={t.placeholder}
                value={inputText}
                onChange={e => setInputText(e.target.value)}
                onKeyDown={handleKeyDown}
                onPaste={handlePaste}
                className={`flex-1 bg-transparent border-none outline-none text-[16px] py-3 ${isDark ? 'placeholder:text-[#C4C7C5]' : 'placeholder:text-gray-400'}`}
              />

              {busy ? (
                <button
                  onClick={handleCancel}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#F28B82] hover:bg-[#333537]' : 'text-[#C5221F] hover:bg-[#F0F4F9]'}`}
                >
                  <StopCircle size={20} />
                </button>
              ) : (
                <button
                  onClick={handleSend}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}
                >
                  {(inputText.trim() || attachments.some(a => a.status === 'ready')) ? <Send size={18} /> : <Mic size={20} />}
                </button>
              )}
            </div>
            <div className="flex items-center justify-center mt-3">
               <p className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.disclaimer}</p>
            </div>
          </div>

        </div>
      );
    };

    // ==========================================
    // Chat Bubble (message rendering)
    // ==========================================
    const UserBubble = ({ item, theme, editable }) => {
      const isDark = theme === 'dark';
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(item.text);
      function commit() { const tx = val.trim(); setEditing(false); if (tx && bridge.available) bridge.editLastTurn(tx); }
      if (editing) {
        return (
          <div className="flex justify-end">
            <div className="max-w-[85%] w-full">
              <textarea autoFocus value={val} onChange={e => setVal(e.target.value)}
                rows={Math.min(6, Math.max(1, val.split('\n').length))}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); } else if (e.key === 'Escape') { setEditing(false); setVal(item.text); } }}
                className={`w-full rounded-[16px] px-4 py-2 text-[15px] outline-none ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`} />
              <div className="flex gap-2 justify-end mt-1">
                <button className={cardBtnCls(isDark)} onClick={() => { setEditing(false); setVal(item.text); }}>取消</button>
                <button className={cardBtnCls(isDark, 'primary')} onClick={commit}>重新发送</button>
              </div>
            </div>
          </div>
        );
      }
      return (
        <div className="flex justify-end group">
          <div className="flex items-center gap-2 max-w-[85%]">
            {editable && <button title="编辑并重发" onClick={() => { setVal(item.text); setEditing(true); }} className={`opacity-0 group-hover:opacity-100 text-[13px] shrink-0 ${isDark ? 'text-[#8E8E8E] hover:text-[#C4C7C5]' : 'text-[#9AA0A6] hover:text-[#444746]'}`}>✏️</button>}
            <div className={`px-5 py-3 rounded-[20px] text-[15px] leading-relaxed whitespace-pre-wrap ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`}>{item.text}</div>
          </div>
        </div>
      );
    };

    // 思考指示器：Braille 转圈 + 思考中/调用工具 + 计时（每阶段切换重置）
    const BRAILLE = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
    const ThinkingBubble = ({ thinking, theme }) => {
      const isDark = theme === 'dark';
      const [frame, setFrame] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const phase = thinking ? thinking.phase : 'thinking';
      const toolName = thinking ? thinking.toolName : '';
      const startedAt = (thinking && thinking.startedAt) || Date.now();
      useEffect(() => {
        setFrame(0); setElapsed(0);
        const id = setInterval(() => {
          setFrame(f => (f + 1) % BRAILLE.length);
          setElapsed(Math.floor((Date.now() - startedAt) / 1000));
        }, 100);
        return () => clearInterval(id);
      }, [startedAt, phase, toolName]);
      let text;
      if (phase === 'tool' && toolName) {
        text = `调用 ${toolName}... ${elapsed}s`;
      } else {
        const suffix = elapsed >= 120 ? ' · 本地模型在生成长内容,请耐心等' : elapsed >= 30 ? ' · 本地模型生成中' : '';
        text = `思考中... ${elapsed}s${suffix}`;
      }
      return (
        <div className="flex justify-start">
          <div className={`text-[13px] font-mono px-3 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#A8C7FA]' : 'bg-[#F0F4F9] text-[#0B57D0]'}`}>
            {BRAILLE[frame]} {text}
          </div>
        </div>
      );
    };

    // 品悟报告里的 CRITICAL/RAISED 等是 GATE/override 协议字段（前端正则放行 + 后端 GATE 依赖），
    // 不能改 skill 输出；只在显示层把它们翻译成人话，协议链路全程保持英文。
    const prettyPinvouReport = (html) => (html || '')
      .replace(/>Finding</g, '>问题<')
      .replace(/>Severity</g, '>程度<')
      .replace(/>Status</g, '>状态<')
      .replace(/>User Decision</g, '>你的决定<')
      .replace(/CRITICAL/g, '需要改')
      .replace(/INFORMATIONAL/g, '可改可不改')
      .replace(/OVERRIDDEN_BY_USER/g, '已同意继续')
      .replace(/RAISED/g, '待定')
      .replace(/\bcritical\b/gi, '需改项');

    const ChatBubble = ({ item, theme, onPrefill, editable }) => {
      const isDark = theme === 'dark';

      if (item.type === 'plan_card') return <PlanCard item={item} theme={theme} onPrefill={onPrefill} />;
      if (item.type === 'plan_stuck' || item.type === 'execution_stuck') return <PlanStuckCard item={item} theme={theme} />;
      if (item.type === 'plan_text_fallback') return <PlanFallbackCard item={item} theme={theme} />;
      if (item.type === 'careful_blocked') return <CarefulBlockedCard item={item} theme={theme} />;
      if (item.type === 'user_input') return <UserInputCard item={item} theme={theme} />;
      if (item.type === 'pinvou_actions') return <PinvouActionsCard item={item} theme={theme} onPrefill={onPrefill} />;
      if (item.type === 'user') return <UserBubble item={item} theme={theme} editable={editable} />;

      if (item.type === 'assistant') {
        if (item.streaming && !item.html) return null; // 空流式气泡交给 ThinkingBubble 表示
        // persona 兜底：品悟报告（FINAL/REVIEW）即使没带 persona（自发输出/重载/persona 丢失）
        // 也按内容标记识别，统一渲染成紫色品悟气泡
        const html = item.html || '';
        const persona = item.persona
          || (html.indexOf('PINVOU FINAL REPORT') >= 0 ? 'pinvou-final'
            : html.indexOf('PINVOU REVIEW REPORT') >= 0 ? 'pinvou-plan' : null);
        const isPinvou = persona === 'pinvou-plan' || persona === 'pinvou-final';
        if (isPinvou) {
          return (
            <div className="flex justify-start">
              <div className={`max-w-[95%] w-full rounded-[16px] border p-3 ${isDark ? 'bg-[#7C3AED]/10 border-[#D0BCFF]/30' : 'bg-[#7C3AED]/5 border-[#7C3AED]/20'} ${isDark ? 'dark-code' : 'light-code'}`}>
                <div className={`text-[12px] font-semibold mb-1.5 ${isDark ? 'text-[#D0BCFF]' : 'text-[#7C3AED]'}`}>🟣 品悟{persona === 'pinvou-final' ? '（验收）' : '（审方案）'}</div>
                <div className={`msg-md text-[15px] leading-relaxed ${item.streaming ? 'streaming-cursor' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}
                  dangerouslySetInnerHTML={{ __html: prettyPinvouReport(html) }} />
              </div>
            </div>
          );
        }
        return (
          <div className="flex justify-start">
            <div className={`max-w-[95%] ${isDark ? 'dark-code' : 'light-code'}`}>
              <div
                className={`msg-md text-[15px] leading-relaxed ${item.streaming ? 'streaming-cursor' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}
                dangerouslySetInnerHTML={{ __html: item.html || '' }}
              />
              {item.time && !item.streaming && (
                <div className={`text-[11px] mt-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{item.time}</div>
              )}
            </div>
          </div>
        );
      }

      if (item.type === 'tool') {
        return <ToolCard item={item} theme={theme} />;
      }

      if (item.type === 'system') {
        return (
          <div className="flex justify-center">
            <div className={`text-[13px] px-4 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#8E8E8E]' : 'bg-[#F0F4F9] text-[#757575]'}`}>
              {item.text}
            </div>
          </div>
        );
      }

      return null;
    };

    // ==========================================
    // Tool Card
    // ==========================================
    // 弱化类工具：渲染成单行灰条（看得见但不抢眼）；其余有产出类保留醒目卡片。
    // 含 ①只读探查 ②待办/清单的细碎进度操作（易刷屏、对用户价值低）。
    // 批量出方案的 checklist_write/todo_write/update_plan 不在此列（它们走方案卡）。
    const QUIET_TOOLS = new Set([
      'read_file', 'list_dir', 'grep_files', 'file_search', 'glob',
      'checklist_update', 'todo_update', 'checklist_add', 'todo_add', 'checklist_list', 'todo_list',
    ]);

    const toolBasename = (p) => {
      if (typeof p !== 'string' || !p) return '';
      const parts = p.replace(/\/+$/, '').split('/');
      return parts[parts.length - 1] || p;
    };

    // A 档摘要：只从结构化 args 提“动作对象”（文件名/命令/模式），稳且免费，不 parse output。
    const toolSummary = (name, args) => {
      if (!args || typeof args !== 'object') return '';
      switch (name) {
        case 'read_file': {
          const base = toolBasename(args.path);
          if (args.start_line || args.max_lines) {
            const s = args.start_line || 1;
            return base + ' · 行 ' + s + (args.max_lines ? '-' + (s + args.max_lines - 1) : '+');
          }
          return base;
        }
        case 'write_file':
        case 'append_file':
        case 'edit_file':
          return toolBasename(args.path);
        case 'list_dir':
          return toolBasename(args.path || '.') || '.';
        case 'grep_files':
          return args.pattern ? '"' + args.pattern + '"' : '';
        case 'file_search':
          return args.query ? '"' + args.query + '"' : '';
        case 'exec_shell':
          return typeof args.command === 'string' ? args.command.replace(/\s+/g, ' ').trim() : '';
        case 'checklist_update':
        case 'todo_update':
          return args.status === 'completed' ? '已完成'
            : args.status === 'in_progress' ? '进行中'
            : args.status === 'pending' ? '待办' : '';
        default:
          return '';
      }
    };

    // 底座对超 12K 的工具输出会压成 [TOOL_OUTPUT_RECEIPT]（content-addressed 溢出），
    // 直接展示一堆 sha/handle 是噪音 —— 翻译成人话 + 保留 preview 摘要。
    const isReceipt = (text) => typeof text === 'string' && text.trim().startsWith('[TOOL_OUTPUT_RECEIPT]');
    const parseReceipt = (text) => {
      const fields = {};
      String(text).split('\n').forEach((line) => {
        const m = line.match(/^\s*([a-z_]+):\s*(.*)$/);
        if (m) fields[m[1]] = m[2];
      });
      return fields;
    };
    const ReceiptBlock = ({ text, isDark }) => {
      const f = parseReceipt(text);
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const body = isDark ? 'text-[#C4C7C5]' : 'text-[#444746]';
      // 输出超大被底座存档、只回传 preview。存档/压缩机制对用户无意义 ——
      // 只展示内容开头 + 一句不带术语的诚实提示（避免误以为是完整输出）。
      const pv = (f.preview && f.preview !== '(none)') ? f.preview.replace(/\\n/g, '\n') : '';
      const pvIsDiff = pv && (/(^|\n)@@/.test(pv) || (pv.indexOf('@@') >= 0 && /(^|\n)[+-]/.test(pv)));
      const note = <div className={`mt-0.5 text-[11px] ${muted}`}>⋯ 输出较长，仅显示开头</div>;
      if (pvIsDiff) return (<div><DiffView text={pv} isDark={isDark} />{note}</div>);
      return (
        <div>
          <div className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap' }}>{pv || '（输出较长，未展开）'}</div>
          {pv ? note : null}
        </div>
      );
    };

    // ── 每工具定制结果视图（仿 Claude Code）：解析失败一律 fallback 纯文本，永不崩 ──
    const tryParseJson = (text) => { try { return JSON.parse(text); } catch (_) { return null; } };
    // checklist/plan 输出是「摘要行\n{json}」，切首个换行后 parse
    const tryTailJson = (text) => {
      if (typeof text !== 'string') return null;
      const i = text.indexOf('\n');
      if (i < 0) return null;
      try { return JSON.parse(text.slice(i + 1)); } catch (_) { return null; }
    };
    const looksDiff = (text) => typeof text === 'string'
      && /(^|\n)--- /.test(text) && /(^|\n)\+\+\+ /.test(text);
    const outBox = (isDark) => `tool-card-output custom-scrollbar rounded-lg p-2 text-[12px] ${isDark ? 'bg-[#131314] text-[#C4C7C5]' : 'bg-white text-[#444746]'}`;
    const TODO_SYM = { completed: '☑', in_progress: '◐', pending: '☐' };
    const TODO_TOOLS = ['checklist_write', 'checklist_update', 'checklist_add', 'checklist_list', 'todo_write', 'todo_update', 'todo_add', 'todo_list', 'update_plan'];

    const OutputPre = ({ text, isDark }) => (
      <pre className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap' }}>
        {typeof text === 'string' ? text : JSON.stringify(text, null, 2)}
      </pre>
    );
    const OutputError = ({ text, isDark }) => (
      <pre className={`tool-card-output custom-scrollbar rounded-lg p-2 text-[12px] ${isDark ? 'bg-[#131314] text-[#F28B82]' : 'bg-white text-[#C5221F]'}`} style={{ whiteSpace: 'pre-wrap' }}>
        {typeof text === 'string' ? text : JSON.stringify(text, null, 2)}
      </pre>
    );
    const ListDirView = ({ items, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const sorted = items.slice().sort((a, b) => ((b.is_dir ? 1 : 0) - (a.is_dir ? 1 : 0)) || String(a.name).localeCompare(String(b.name)));
      return (
        <div className={outBox(isDark)} style={{ fontFamily: 'monospace' }}>
          <div className={`mb-1 ${muted}`} style={{ fontFamily: 'inherit' }}>{items.length} 个条目</div>
          {sorted.map((it, i) => <div key={i}>{it.is_dir ? '📁' : '📄'} {it.name}{it.is_dir ? '/' : ''}</div>)}
        </div>
      );
    };
    const GrepView = ({ data, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const matches = Array.isArray(data.matches) ? data.matches : [];
      return (
        <div className={outBox(isDark)}>
          <div className={`mb-1 ${muted}`}>
            命中 {data.total_matches != null ? data.total_matches : matches.length} 处
            {data.files_searched != null ? ` · 搜索 ${data.files_searched} 文件` : ''}
            {data.truncated ? ' · 已截断' : ''}
          </div>
          {matches.map((m, i) => (
            <div key={i} className="mt-1">
              <span className={muted}>{m.file}:{m.line_number}</span>
              <pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'monospace' }}>{m.line}</pre>
            </div>
          ))}
        </div>
      );
    };
    const DiffView = ({ text, isDark }) => {
      const lines = String(text).split('\n');
      const add = isDark ? 'text-[#93D5A6]' : 'text-[#137333]';
      const del = isDark ? 'text-[#F28B82]' : 'text-[#C5221F]';
      const hunk = isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]';
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const color = (l) => /^(\+\+\+|---)/.test(l) ? muted : l.startsWith('+') ? add : l.startsWith('-') ? del : l.startsWith('@@') ? hunk : '';
      return (
        <pre className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap', fontFamily: 'monospace' }}>
          {lines.map((l, i) => <div key={i} className={color(l)}>{l || ' '}</div>)}
        </pre>
      );
    };
    const ShellView = ({ data, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const del = isDark ? 'text-[#F28B82]' : 'text-[#C5221F]';
      return (
        <div className={outBox(isDark)}>
          <div className={`mb-1 ${muted}`}>
            {data.status || ''}{data.exit_code != null ? ` · exit ${data.exit_code}` : ''}
            {data.duration_ms != null ? ` · ${data.duration_ms}ms` : ''}
            {data.stdout_truncated ? ' · stdout 截断' : ''}
          </div>
          {data.stdout != null && data.stdout !== '' && <pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'monospace' }}>{data.stdout}</pre>}
          {data.stderr ? <pre className={del} style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'monospace' }}>{data.stderr}</pre> : null}
        </div>
      );
    };
    // exec_shell 的 content 其实是纯 stdout 文本（结构化字段在 metadata，前端没拿）→ 给终端样式
    const ShellTextView = ({ cmd, text, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      return (
        <div className={outBox(isDark)} style={{ fontFamily: 'monospace' }}>
          {cmd && <div className={muted} style={{ whiteSpace: 'pre-wrap' }}>$ {cmd}</div>}
          <pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'inherit' }}>{typeof text === 'string' ? text : JSON.stringify(text)}</pre>
        </div>
      );
    };
    const TodoView = ({ snap, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const items = Array.isArray(snap.items) ? snap.items : [];
      return (
        <div className={outBox(isDark)}>
          {snap.completion_pct != null && <div className={`mb-1 ${muted}`}>进度 {snap.completion_pct}%</div>}
          {snap.explanation && <div className="mb-1">{snap.explanation}</div>}
          {items.map((it, i) => (
            <div key={i} className={it.status === 'completed' ? muted : ''}>
              <span className={it.status === 'in_progress' ? (isDark ? 'text-[#FDD663]' : 'text-[#E37400]') : ''}>{TODO_SYM[it.status] || '☐'}</span> {it.content || it.step || ''}
            </div>
          ))}
        </div>
      );
    };
    // 输出渲染分发：失败→红字；大输出→receipt；高频工具→定制视图；其余→纯文本
    const ToolOutput = ({ item, isDark }) => {
      const out = item.output;
      if (item.success === false) return <OutputError text={out} isDark={isDark} />;
      if (isReceipt(out)) return <ReceiptBlock text={out} isDark={isDark} />;
      if (item.name === 'list_dir') { const v = tryParseJson(out); if (Array.isArray(v)) return <ListDirView items={v} isDark={isDark} />; }
      else if (item.name === 'grep_files') { const v = tryParseJson(out); if (v && Array.isArray(v.matches)) return <GrepView data={v} isDark={isDark} />; }
      else if (item.name === 'exec_shell') {
        const v = tryParseJson(out);
        if (v && (v.stdout != null || v.exit_code != null || v.status)) return <ShellView data={v} isDark={isDark} />;
        return <ShellTextView cmd={item.args && item.args.command} text={out} isDark={isDark} />;
      }
      else if (item.name === 'edit_file' || item.name === 'write_file') { if (looksDiff(out)) return <DiffView text={out} isDark={isDark} />; }
      else if (item.name === 'append_file') {
        const m = String(out).match(/appended (\d+) bytes[\s\S]*?\((\d+) -> (\d+) bytes\)/i);
        if (m) return <div className={outBox(isDark)}>{/^Created/i.test(out) ? '新建并追加 ' : '追加 '}{m[1]} 字节 · {m[2]} → {m[3]} 字节</div>;
      }
      else if (TODO_TOOLS.indexOf(item.name) >= 0) { const v = tryTailJson(out); if (v && Array.isArray(v.items)) return <TodoView snap={v} isDark={isDark} />; }
      return <OutputPre text={out} isDark={isDark} />;
    };

    const ToolCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const [expanded, setExpanded] = useState(false);
      const isRunning = item.state === 'running';
      const isDone = item.state === 'done';
      const isFailed = item.state === 'failed';
      const quiet = QUIET_TOOLS.has(item.name);
      const summary = toolSummary(item.name, item.args);

      const statusColor = isRunning
        ? (isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]')
        : isDone
          ? (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')
          : (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]');

      const statusText = isRunning ? '运行中...' : isDone ? '完成' : '失败';
      const mutedColor = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';

      const detail = expanded ? (
        <div className={`px-4 pb-3 border-t ${isDark ? 'border-white/5' : 'border-black/5'}`}>
          {item.output != null
            ? <div className="mt-2"><ToolOutput item={item} isDark={isDark} /></div>
            : null}
        </div>
      ) : null;

      // 弱化类：单行灰条。完成态低调（图标灰），运行/失败态保留状态色以便察觉。
      if (quiet) {
        const iconColor = isDone ? mutedColor : statusColor;
        return (
          <div className={expanded ? `rounded-[12px] overflow-hidden border ${isDark ? 'border-white/5' : 'border-black/5'}` : ''}>
            <div
              className={`flex items-center gap-2 px-2 py-1 rounded-[8px] cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
              onClick={() => setExpanded(!expanded)}
            >
              <Wrench size={12} className={iconColor} />
              <span className={`text-[12px] ${mutedColor}`}>{item.name}</span>
              {summary
                ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
                : <span className="flex-1" />}
              {isRunning && <span className={`text-[11px] ${statusColor}`}>运行中...</span>}
              {isFailed && <span className={`text-[11px] ${statusColor}`}>失败</span>}
              <ChevronDown size={12} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${mutedColor}`} />
            </div>
            {detail}
          </div>
        );
      }

      // 有产出类：保留醒目卡片，标题行带摘要。
      return (
        <div className={`rounded-[16px] overflow-hidden border ${isDark ? 'bg-[#1E1F20] border-white/5' : 'bg-[#F0F4F9] border-black/5'}`}>
          <div
            className={`flex items-center gap-3 px-4 py-3 cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
            onClick={() => setExpanded(!expanded)}
          >
            <Wrench size={14} className={statusColor} />
            <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
              {item.name}
            </span>
            {summary
              ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
              : <span className="flex-1" />}
            <span className={`text-[12px] ${statusColor}`}>{statusText}</span>
            <ChevronDown size={14} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`} />
          </div>
          {detail}
        </div>
      );
    };

    // ==========================================
    // Plan / 待办 步骤渲染
    // ==========================================
    const STEP_SYM = { completed: '●', in_progress: '◎', pending: '○' };
    const PlanLayer = ({ label, explanation, items, field, isDark }) => {
      if (!items || items.length === 0) return null;
      return (
        <section className="mb-2">
          <div className={`text-[12px] font-semibold mb-1 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{label}</div>
          {explanation && <p className={`text-[13px] mb-1.5 leading-relaxed ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{explanation}</p>}
          <ol className="space-y-1">
            {items.map((it, i) => (
              <li key={i} className={`text-[13px] flex gap-2 leading-relaxed ${it.status === 'completed' ? 'opacity-60' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                <span className={it.status === 'in_progress' ? (isDark ? 'text-[#FDD663]' : 'text-[#E37400]') : ''}>{STEP_SYM[it.status] || '○'}</span>
                <span>{it[field] || ''}</span>
              </li>
            ))}
          </ol>
        </section>
      );
    };

    const cardBoxCls = (isDark, accent) =>
      `rounded-[16px] border p-4 my-1 ${isDark ? 'bg-[#1E1F20] border-white/10' : 'bg-[#F0F4F9] border-black/5'} ${accent || ''}`;
    const cardBtnCls = (isDark, variant) => {
      const base = 'px-3 py-1.5 rounded-full text-[13px] font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
      if (variant === 'primary') return `${base} ${isDark ? 'bg-[#A8C7FA] text-[#062E6F] hover:bg-[#C2DBFF]' : 'bg-[#0B57D0] text-white hover:bg-[#0A4BB8]'}`;
      return `${base} ${isDark ? 'bg-[#333537] text-[#E3E3E3] hover:bg-[#444746]' : 'bg-white text-[#1F1F1F] hover:bg-[#E1E5EA] border border-black/10'}`;
    };

    // ==========================================
    // PlanCard — ✨ 方案准备好
    // ==========================================
    const PlanCard = ({ item, theme, onPrefill }) => {
      const isDark = theme === 'dark';
      const active = item.cardState === 'active' && !item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className={`text-[14px] font-semibold mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>✨ 方案准备好</div>
          {(!item.plan && !item.todos)
            ? <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>（plan 为空）</div>
            : <>
                <PlanLayer label="📋 方案" explanation={item.plan && item.plan.explanation} items={item.plan && item.plan.items} field="step" isDark={isDark} />
                <PlanLayer label="✅ 细分待办" items={item.todos && item.todos.items} field="content" isDark={isDark} />
              </>}
          <div className={`h-px my-3 ${isDark ? 'bg-white/10' : 'bg-black/10'}`}></div>
          {active ? (
            <div className="flex items-center gap-2 flex-wrap">
              <span className={`text-[13px] mr-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>下一步：</span>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.acceptPlan(item.id, item.planMarkdown)}>✅ 就这么干</button>
              <button className={cardBtnCls(isDark)} onClick={() => onPrefill && onPrefill('修订方案:')}>✏️ 改改</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.discardPlan(item.id)}>🚪 算了</button>
            </div>
          ) : (
            <div className={`text-[13px] font-medium ${isDark ? 'text-[#93D5A6]' : 'text-[#137333]'}`}>{item.statusLabel}</div>
          )}
        </div>
      );
    };

    // ==========================================
    // PlanStuckCard — Plan 死锁 / 执行卡住 兜底
    // ==========================================
    const PlanStuckCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const isExec = item.type === 'execution_stuck';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#FDD663]/30' : 'border-[#E37400]/20')}>
          <div className={`text-[13px] leading-relaxed mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
            {isExec
              ? <>🛑 AI 执行卡住了 (已自动尝试 {item.tries} 次仍未真正产出文件)。你可以:</>
              : <>⚠️ AI 在 Plan 模式调用了 <code className="px-1 rounded bg-black/20">{item.toolName || '(unknown)'}</code> 但被白名单挡掉。Plan 模式只能讨论方案,不能动手。给你两个出路:</>}
          </div>
          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || '已处理'}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark)} onClick={() => isExec ? bridge.executionStuckReplan(item.id) : bridge.planStuckReplan(item.id)}>📋 让 AI 重出方案</button>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => isExec ? bridge.discardPlan(item.id) : bridge.planStuckGo(item.id)}>⚡ {isExec ? '我自己来' : '直接动手(跳过方案)'}</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // PlanFallbackCard — AI 给了方案但没用 plan 工具
    // ==========================================
    const PlanFallbackCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#FDD663]/30' : 'border-[#E37400]/20')}>
          <div className={`text-[14px] font-semibold mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>📝 AI 给了方案但没用 plan 工具</div>
          <div className={`text-[13px] leading-relaxed mb-3 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>AI 在文本里描述了方案,但没调 update_plan 工具,所以没出方案卡片。你想怎么处理?</div>
          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || '已处理'}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.planFallbackAccept(item.id, item.text)}>✅ 直接采纳这段</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.planFallbackRetry(item.id)}>📋 让 AI 用工具重出</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.discardPlan(item.id)}>🚪 算了</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // CarefulBlockedCard — 🛑 破坏性命令拦截
    // ==========================================
    const CarefulBlockedCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const md = item.metadata || {};
      const cmd = (item.args && (item.args.command || item.args.cmd)) || '(命令未知)';
      const reasons = (md.reasons && md.reasons.length) ? md.reasons : ['命中破坏性 pattern'];
      const suggestions = md.suggestions || [];
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#F28B82]/40' : 'border-[#C5221F]/30')}>
          <div className={`text-[14px] font-semibold mb-2 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>🛑 Careful Hook 拦截了一条破坏性命令</div>
          <pre className={`text-[12px] font-mono rounded-lg p-2 mb-2 overflow-x-auto ${isDark ? 'bg-[#131314] text-[#F28B82]' : 'bg-white text-[#C5221F]'}`}>{cmd}</pre>
          <div className="mb-2">
            <div className={`text-[12px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>为什么拦?</div>
            <ul className={`list-disc pl-5 text-[13px] space-y-0.5 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{reasons.map((r, i) => <li key={i}>{r}</li>)}</ul>
          </div>
          {suggestions.length > 0 && (
            <div className="mb-2">
              <div className={`text-[12px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>建议</div>
              <ul className={`list-disc pl-5 text-[13px] space-y-0.5 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{suggestions.map((s, i) => <li key={i}>{s}</li>)}</ul>
            </div>
          )}
          <div className={`text-[12px] leading-relaxed ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>这个 hook 在所有模式默认开启,与 Plan/YOLO/品悟开关无关。如果你确认要跑,自己在终端执行 —— LLM 不会被允许跑破坏性命令。</div>
        </div>
      );
    };

    // ==========================================
    // UserInputCard — 🤔 AI 想问你几个问题
    // ==========================================
    const UserInputCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const questions = item.questions || [];
      const [answers, setAnswers] = useState(() => item.restoredAnswers || questions.map(() => null));
      const [otherOpen, setOtherOpen] = useState(() => questions.map(() => false));
      const [otherText, setOtherText] = useState(() => questions.map(() => ''));
      const locked = item.resolved || item.submitting;

      function pick(qi, opt) {
        if (locked) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: opt.label, value: opt.label };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function toggleOther(qi) {
        if (locked) return;
        const oo = otherOpen.slice(); oo[qi] = !oo[qi]; setOtherOpen(oo);
        if (oo[qi]) { const next = answers.slice(); next[qi] = null; setAnswers(next); }
      }
      function submitOther(qi) {
        const val = (otherText[qi] || '').trim();
        if (!val) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: '其他', value: val };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function commit(next) {
        setAnswers(next);
        if (next.every(a => a != null)) {
          bridge.submitUserInput(item.id, item.toolCallId, next, questions);
        }
      }

      const statusText = item.cardState === 'submitted' ? '✓ 已提交'
        : item.cardState === 'cancelled' ? '✕ 已取消'
        : item.submitting ? '提交中…' : item.error ? ('⚠️ 提交失败: ' + item.error) : '';

      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className={`text-[14px] font-semibold mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>🤔 AI 想问你几个问题</div>
          <div className="space-y-4">
            {questions.map((q, qi) => (
              <div key={qi}>
                <div className={`text-[12px] font-semibold ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{q.header || ('Q' + (qi + 1))}</div>
                <div className={`text-[13px] mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{q.question || ''}</div>
                <div className="flex flex-col gap-1.5">
                  {(q.options || []).map((opt, oi) => {
                    const sel = answers[qi] && answers[qi].label === opt.label && answers[qi].value === opt.label;
                    return (
                      <button key={oi} disabled={locked}
                        onClick={() => pick(qi, opt)}
                        className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                          ${sel ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                                : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                        <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{opt.label}</div>
                        {opt.description && <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{opt.description}</div>}
                      </button>
                    );
                  })}
                  <button disabled={locked} onClick={() => toggleOther(qi)}
                    className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                      ${answers[qi] && answers[qi].label === '其他' ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                        : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                    <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>💬 其他(自己写)</div>
                    <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>如果上面选项不合适,自己说一下</div>
                  </button>
                  {otherOpen[qi] && (
                    <div className="mt-1">
                      <textarea rows="2" value={otherText[qi]}
                        onChange={e => { const ot = otherText.slice(); ot[qi] = e.target.value; setOtherText(ot); }}
                        onKeyDown={e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitOther(qi); } }}
                        placeholder="写下你想说的..."
                        className={`w-full rounded-[10px] p-2 text-[13px] outline-none border ${isDark ? 'bg-[#131314] border-white/10 text-[#E3E3E3]' : 'bg-white border-black/10 text-[#1F1F1F]'}`} />
                      <div className="flex gap-2 mt-1 justify-end">
                        <button className={cardBtnCls(isDark)} onClick={() => toggleOther(qi)}>取消</button>
                        <button className={cardBtnCls(isDark, 'primary')} onClick={() => submitOther(qi)}>提交</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
          {statusText && <div className={`mt-3 text-[13px] ${item.error ? (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]') : (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')}`}>{statusText}</div>}
        </div>
      );
    };

    // ==========================================
    // ModeHeader — Plan/YOLO 模式指示 + 灯泡切换
    // ==========================================
    const PHASE_LABEL = { planning: '讨论方案', ready: '方案就绪', executing: '执行中' };
    const ModeHeader = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const ms = (bs && bs.modeState) || { mode: 'yolo', plan_phase: 'none' };
      const isPlan = ms.mode === 'plan';
      const phaseLabel = PHASE_LABEL[ms.plan_phase] || '';
      async function toggleMode() {
        if (!bridge.available) return;
        if (ms.mode === 'plan') {
          // 已在 Plan(任何 phase)→ 退出回 YOLO(busy 先停当前 turn)
          if (bs && bs.busy) await bridge.cancelGeneration();
          await bridge.exitPlanToYolo();
        } else {
          await bridge.setPlanModeNext(); // YOLO → 进入 Plan
        }
      }
      return (
        <button
          onClick={toggleMode}
          title={isPlan ? '点击退出 Plan 回 YOLO' : '点击进入 Plan 模式'}
          className={`pointer-events-auto px-3 py-2 rounded-full text-[13px] font-medium flex items-center gap-2 transition-colors
            ${isPlan
              ? (isDark ? 'bg-[#0B57D0]/30 text-[#A8C7FA]' : 'bg-[#0B57D0]/10 text-[#0B57D0]')
              : (isDark ? 'bg-[#1E1F20] text-[#C4C7C5] hover:bg-[#333537]' : 'bg-white text-[#444746] hover:bg-[#F0F4F9] shadow-sm')}`}
        >
          <Zap size={15} /> {isPlan ? ('Plan' + (phaseLabel ? ' · ' + phaseLabel : '')) : 'YOLO'}
        </button>
      );
    };

    // 品悟审批 toggle（与 Plan/YOLO 正交）
    const PinvouToggle = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const on = !!(bs && bs.modeState && bs.modeState.pinvou_review_enabled);
      return (
        <button onClick={() => bridge.available && bridge.togglePinvouReview()}
          title={on ? '品悟 review: 开（关键阶段让品悟把关）' : '品悟 review: 关（点击开启）'}
          className={`pointer-events-auto px-3 py-2 rounded-full text-[13px] font-medium flex items-center gap-1.5 transition-colors
            ${on ? (isDark ? 'bg-[#7C3AED]/40 text-[#D0BCFF]' : 'bg-[#7C3AED]/10 text-[#7C3AED]')
                 : (isDark ? 'bg-[#1E1F20] text-[#8E8E8E] hover:bg-[#333537]' : 'bg-white text-[#9AA0A6] hover:bg-[#F0F4F9] shadow-sm')}`}>
          🟣 品悟{on ? ' 开' : ''}
        </button>
      );
    };

    // 品悟审完后的 3 按钮卡
    const PinvouActionsCard = ({ item, theme, onPrefill }) => {
      const isDark = theme === 'dark';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#D0BCFF]/40' : 'border-[#7C3AED]/30')}>
          <div className={`text-[13px] font-medium mb-3 ${isDark ? 'text-[#D0BCFF]' : 'text-[#7C3AED]'}`}>🟣 品悟审完了 —— 你的决定：</div>
          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || '已处理'}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.pinvouAcceptOverride(item.id, item.planMarkdown, item.report)}>✅ 直接执行</button>
              <button className={cardBtnCls(isDark)} onClick={() => { onPrefill && onPrefill('修订方案: 按 Pinvou 上面提的关键问题改一下方案。'); bridge.markResolved(item.id, '↻ 让 AI 改方案...'); }}>↻ AI 改方案</button>
              <button className={cardBtnCls(isDark)} onClick={() => { onPrefill && onPrefill('我也担心: '); bridge.markResolved(item.id, '⊕ 把你的话补进 plan...'); }}>⊕ 我加一句</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // ArtifactsPanel — 产物面板（右侧抽屉 + 预览）
    // ==========================================
    const ARTIFACT_ICONS = {
      md: '📄', markdown: '📄', html: '🌐', htm: '🌐',
      png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
      pdf: '📕', csv: '📊', xlsx: '📊', json: '🔢', yaml: '🔢', yml: '🔢', txt: '📝',
    };
    const artifactIcon = (name) => ARTIFACT_ICONS[(name.split('.').pop() || '').toLowerCase()] || '📎';

    const ArtifactsPanel = ({ bs, theme, t, onClose }) => {
      const isDark = theme === 'dark';
      const artifacts = (bs && bs.artifacts) || [];
      const [sel, setSel] = useState(null);
      const [pv, setPv] = useState({ loading: false });

      async function preview(a) {
        setSel(a.path);
        setPv({ loading: true });
        try {
          const info = await bridge.artifactInfo(a.path);
          if (!info || !info.exists) { setPv({ loading: false, missing: true }); return; }
          if (info.kind === 'md' || info.kind === 'html' || info.kind === 'text') {
            const text = await bridge.readArtifactText(a.path);
            setPv({ loading: false, kind: info.kind, text });
          } else {
            setPv({ loading: false, kind: info.kind || 'other' });
          }
        } catch (e) { setPv({ loading: false, error: String(e) }); }
      }

      return (
        <div className="absolute inset-0 z-30 flex justify-end pointer-events-auto">
          <div className="absolute inset-0 bg-black/40" onClick={onClose}></div>
          <div className={`relative w-[680px] max-w-[88vw] h-full flex flex-col shadow-2xl ${isDark ? 'bg-[#1E1F20]' : 'bg-white'} animate-in slide-in-from-right duration-200`}>
            <div className={`flex items-center justify-between px-4 py-3 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <span className={`text-[15px] font-medium flex items-center gap-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}><Package size={16} /> {t.artifacts}</span>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>
            <div className="flex-1 flex min-h-0">
              {/* list */}
              <div className={`w-[240px] shrink-0 overflow-y-auto custom-scrollbar border-r ${isDark ? 'border-white/10' : 'border-black/10'}`}>
                {artifacts.length === 0 ? (
                  <div className={`p-4 text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>暂无产物</div>
                ) : artifacts.map((a) => (
                  <div key={a.path} onClick={() => preview(a)}
                    className={`group flex items-center gap-2 px-3 py-2.5 cursor-pointer text-[13px]
                      ${sel === a.path ? (isDark ? 'bg-[#333537]' : 'bg-[#E8EDF2]') : (isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#F0F4F9]')}`}>
                    <span>{artifactIcon(a.basename)}</span>
                    <span className={`flex-1 truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`} title={a.path}>{a.basename}</span>
                    <button title="打开所在目录" onClick={(e) => { e.stopPropagation(); bridge.openContainingFolder(a.path); }} className="opacity-0 group-hover:opacity-100 text-[13px]">📂</button>
                    <button title="外部打开" onClick={(e) => { e.stopPropagation(); bridge.openArtifactExternal(a.path); }} className="opacity-0 group-hover:opacity-100 text-[13px]">↗</button>
                  </div>
                ))}
              </div>
              {/* preview */}
              <div className="flex-1 overflow-y-auto custom-scrollbar p-4 min-w-0">
                {!sel ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>选择左侧产物预览</div>
                ) : pv.loading ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载中...</div>
                ) : pv.missing ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>文件不存在或已被删除</div>
                ) : pv.error ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>读取失败: {pv.error}</div>
                ) : pv.kind === 'md' ? (
                  <div className={`msg-md text-[14px] leading-relaxed ${isDark ? 'dark-code text-[#E3E3E3]' : 'light-code text-[#1F1F1F]'}`} dangerouslySetInnerHTML={{ __html: bridge.renderMarkdown(pv.text || '') }} />
                ) : pv.kind === 'html' ? (
                  <iframe sandbox="allow-same-origin allow-scripts" className="w-full h-full min-h-[480px] rounded-lg bg-white"
                    srcDoc={"<script>document.addEventListener('contextmenu',function(e){e.preventDefault();})<\/script>" + (pv.text || '')} />
                ) : pv.kind === 'text' ? (
                  <pre className={`text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.text}</pre>
                ) : (
                  <div>
                    <p className={`text-[13px] mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.kind === 'image' ? '图片预览暂不支持嵌入' : '此类型暂不支持预览'}</p>
                    <button onClick={() => bridge.openArtifactExternal(sel)} className={cardBtnCls(isDark, 'primary')}>↗ 外部打开</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 工作流：PhaseChips / WorkflowView / SkillCard / DemoModal
    // ==========================================
    const convertFileSrc = (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.convertFileSrc)
      ? window.__TAURI__.core.convertFileSrc
      : ((p) => p);

    // 聊天室顶部 phase pipeline（仅当前 session 绑定了 skill 时显示）
    const PhaseChips = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const wf = (bs && bs.workflow) || {};
      if (!wf.activeSkillName || !wf.phases || !wf.phases.length) return null;
      const reached = new Set(wf.reachedPhaseIds || []);
      const total = wf.phases.length;
      const curIdx = wf.phases.findIndex(p => p.id === wf.currentPhaseId);
      const cur = curIdx >= 0 ? wf.phases[curIdx] : null;
      return (
        <div className={`rounded-xl px-3 py-2 ${isDark ? 'bg-[#1E1F20]/90' : 'bg-[#F0F4F9]'}`}>
          {/* 头部：skill 名 + 当前阶段标题 */}
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <span className={`flex items-center gap-1 text-[12px] font-medium px-2 py-0.5 rounded-full ${isDark ? 'bg-[#0B57D0]/30 text-[#A8C7FA]' : 'bg-[#0B57D0]/10 text-[#0B57D0]'}`}>
              🧭 {wf.activeSkillName}
              <button title="退出工作流" onClick={() => bridge.deactivateSkill()} className="ml-1 hover:text-[#F28B82]">✕</button>
            </span>
            {cur && (
              <span className={`text-[12px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>
                当前 {curIdx + 1}/{total}：<span className="font-medium">{cur.title}</span>{cur.loop ? ' ↻' : ''}
              </span>
            )}
          </div>
          {/* 单行横向滚动：每个 phase 显示 编号 + 标题 */}
          <div className="flex items-center gap-1 overflow-x-auto custom-scrollbar pb-1">
            {wf.phases.map((p, i) => {
              const isCur = p.id === wf.currentPhaseId;
              const done = reached.has(p.id) && !isCur;
              const cls = isCur
                ? (isDark ? 'bg-[#A8C7FA] text-[#062E6F]' : 'bg-[#0B57D0] text-white')
                : done
                  ? (isDark ? 'bg-[#1E3A2A] text-[#93D5A6]' : 'bg-[#E6F4EA] text-[#137333]')
                  : (isDark ? 'bg-[#282A2C] text-[#9AA0A6]' : 'bg-white text-[#5F6368]');
              return (
                <div key={p.id} className="flex items-center shrink-0">
                  {i > 0 && <span className={`mx-0.5 ${isDark ? 'text-[#5F6368]' : 'text-[#BDC1C6]'}`}>›</span>}
                  <div title={p.id + ' · ' + p.title} className={`flex items-center gap-1 px-2 py-1 rounded-full ${cls}`}>
                    {isCur ? <span className="text-[10px]">▶</span> : done ? <span className="text-[10px]">✓</span> : null}
                    <span className="font-mono text-[10px] opacity-70">{p.id}</span>
                    <span className="text-[12px] whitespace-nowrap">{p.title}{p.loop ? ' ↻' : ''}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const SkillCard = ({ s, theme, active, onActivate }) => {
      const isDark = theme === 'dark';
      const phasesCount = (s.phases && s.phases.length) || 0;
      const hasDemo = s.demo && (s.demo.has_file || s.demo.has_preview);
      return (
        <div className={`flex flex-col rounded-[16px] border p-4 ${isDark ? 'bg-[#1E1F20] border-white/10 hover:border-white/20' : 'bg-white border-black/10 hover:shadow-md'} transition-all`}>
          <div className="flex items-start justify-between gap-2 mb-1">
            <h3 className={`text-[14px] font-semibold ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{s.name}</h3>
            <span className={`text-[11px] px-1.5 py-0.5 rounded shrink-0 ${isDark ? 'bg-[#333537] text-[#C4C7C5]' : 'bg-[#F0F4F9] text-[#444746]'}`}>{s.source}</span>
          </div>
          <p className={`text-[12px] leading-relaxed mb-2 line-clamp-3 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{(s.description || '').slice(0, 220)}</p>
          {phasesCount > 0 ? (
            <div className={`text-[12px] font-mono mb-2 ${isDark ? 'text-[#8E8E8E]' : 'text-[#5F6368]'}`}>
              {phasesCount} 个 phase · {s.phases.slice(0, 8).map(p => p.id + (p.loop ? '↻' : '')).join(' → ')}{phasesCount > 8 ? ' → …' : ''}
            </div>
          ) : (
            <div className={`text-[12px] mb-2 ${isDark ? 'text-[#5F6368]' : 'text-[#9AA0A6]'}`}>普通 skill (未声明 phases)</div>
          )}
          {s.demo && s.demo.duration && <div className={`text-[12px] mb-2 ${isDark ? 'text-[#8E8E8E]' : 'text-[#5F6368]'}`}>⏱ {s.demo.duration}</div>}
          <div className="flex items-center gap-2 mt-auto pt-2">
            {phasesCount > 0 ? (
              <button onClick={() => onActivate(s.name)} className={cardBtnCls(isDark, 'primary')}>{active ? '✓ 使用中' : '启用'}</button>
            ) : (
              <button disabled className={cardBtnCls(isDark)}>仅查看</button>
            )}
            {hasDemo && <button onClick={() => bridge.openDemo(s.name)} className={cardBtnCls(isDark)}>看 demo</button>}
          </div>
        </div>
      );
    };

    const DemoModal = ({ demo, theme, onClose }) => {
      const isDark = theme === 'dark';
      if (!demo || !demo.open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" >
          <div className="absolute inset-0 bg-black/60" onClick={onClose}></div>
          <div className={`relative w-[1100px] max-w-[92vw] max-h-[82vh] flex flex-col rounded-[16px] overflow-hidden shadow-2xl ${isDark ? 'bg-[#1E1F20]' : 'bg-white'}`}>
            <div className={`flex items-center justify-between px-4 py-3 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <span className={`text-[14px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{demo.name} · demo 预览</span>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>
            <div className="flex-1 overflow-auto min-h-[300px] flex flex-col">
              {demo.loading ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载 demo …</div>
              ) : demo.error ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>读取失败: {demo.error}</div>
              ) : (demo.kind === 'none' || !demo.path) && demo.kind !== 'text' ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>该 skill 未声明 demo 文件。</div>
              ) : demo.kind === 'html' ? (
                <iframe className="w-full flex-1 min-h-[480px] border-0 bg-white" src={convertFileSrc(demo.path)} sandbox="allow-same-origin allow-scripts" />
              ) : demo.kind === 'image' ? (
                <img className="max-w-full max-h-[72vh] object-contain m-auto" src={convertFileSrc(demo.path)} alt={demo.name + ' demo'} />
              ) : demo.kind === 'text' ? (
                <pre className={`p-4 text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{demo.content || ''}</pre>
              ) : (
                <div className="m-auto text-center">
                  <p className={`text-[13px] mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>未识别的文件类型</p>
                  <button onClick={() => bridge.openInSystem(demo.path)} className={cardBtnCls(isDark, 'primary')}>用系统应用打开</button>
                </div>
              )}
            </div>
            {(demo.description || demo.duration) && (
              <div className={`px-4 py-2 border-t text-[12px] ${isDark ? 'border-white/10 text-[#C4C7C5]' : 'border-black/10 text-[#444746]'}`}>
                {demo.description ? '📝 ' + demo.description : ''}{demo.description && demo.duration ? ' · ' : ''}{demo.duration ? '⏱ ' + demo.duration : ''}
              </div>
            )}
          </div>
        </div>
      );
    };

    const WorkflowView = ({ bs, theme, t, onActivate }) => {
      const isDark = theme === 'dark';
      const wf = (bs && bs.workflow) || {};
      useEffect(() => { if (bridge.available) bridge.loadSkills(); }, []);
      const skills = wf.skills || [];
      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 overflow-hidden animate-in fade-in duration-300">
          <div className="flex items-center justify-between px-6 md:px-10 pt-8 pb-4">
            <div>
              <h1 className={`text-[28px] font-normal ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.workflow}</h1>
              <p className={`text-[13px] mt-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>任务拆解 · 进度可视化</p>
            </div>
            <button onClick={() => bridge.loadSkills()} title="重新扫描 skill"
              className={`w-10 h-10 rounded-full flex items-center justify-center ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}>
              <RefreshCw size={18} />
            </button>
          </div>
          <div className="flex-1 overflow-y-auto custom-scrollbar px-6 md:px-10 pb-10">
            {wf.loadState === 'loading' ? (
              <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载 skill 列表 …</div>
            ) : wf.loadState === 'error' ? (
              <div className={`text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>加载失败，点右上角重试</div>
            ) : skills.length === 0 ? (
              <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>未发现 skill</div>
            ) : (
              <div className="grid gap-4" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))' }}>
                {skills.map((s) => (
                  <SkillCard key={s.name} s={s} theme={theme} active={wf.activeSkillName === s.name} onActivate={onActivate} />
                ))}
              </div>
            )}
          </div>
          <DemoModal demo={wf.demo} theme={theme} onClose={() => bridge.closeDemo()} />
        </div>
      );
    };

    // ==========================================
    // Shared Components
    // ==========================================

    const NavItem = ({ icon, label, active, theme, isSidebarOpen = true, onClick }) => {
      const isDark = theme === 'dark';
      return (
        <div
          onClick={onClick}
          title={!isSidebarOpen ? label : ""}
          className={`flex items-center cursor-pointer text-[14px] font-medium transition-colors overflow-hidden
          ${isSidebarOpen ? 'px-4 py-2.5 rounded-full w-full' : 'w-10 h-10 justify-center rounded-full mx-auto shrink-0'}
          ${active
            ? (isDark ? 'bg-[#333537] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#041E49]')
            : (isDark ? 'text-[#E3E3E3] hover:bg-[#282A2C]' : 'text-[#1F1F1F] hover:bg-[#E1E5EA]')}`}
        >
          <div className={`${isSidebarOpen ? 'mr-4' : ''} shrink-0 ${active ? (isDark ? 'text-[#E3E3E3]' : 'text-[#0B57D0]') : ''}`}>
            {icon}
          </div>
          {isSidebarOpen && <span className="whitespace-nowrap">{label}</span>}
        </div>
      );
    };

    // 近期会话项：支持重命名(内联编辑) + 删除(内联二次确认)
    const RecentItem = ({ chat, active, theme, onSelect, onRename, onDelete }) => {
      const isDark = theme === 'dark';
      const [editing, setEditing] = useState(false);
      const [confirming, setConfirming] = useState(false);
      const [val, setVal] = useState(chat.title);
      function save() { const tx = val.trim(); setEditing(false); if (tx && tx !== chat.title) onRename(chat.id, tx); }
      if (editing) {
        return (
          <div className="px-1.5 py-0.5">
            <input autoFocus value={val}
              onChange={e => setVal(e.target.value)}
              onClick={e => e.stopPropagation()}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); save(); } else if (e.key === 'Escape') { setEditing(false); setVal(chat.title); } }}
              onBlur={save}
              className={`w-full px-3 py-1 rounded-full text-[14px] outline-none ${isDark ? 'bg-[#131314] text-[#E3E3E3] ring-1 ring-[#A8C7FA]' : 'bg-white text-[#1F1F1F] ring-1 ring-[#0B57D0]'}`} />
          </div>
        );
      }
      return (
        <div onClick={() => onSelect(chat.id)}
          className={`group flex items-center px-4 py-1.5 rounded-full cursor-pointer text-[14px] transition-all
            ${active ? (isDark ? 'bg-[#333537] text-white' : 'bg-[#E1E5EA] text-[#1F1F1F]')
                     : (isDark ? 'text-[#E3E3E3] hover:bg-[#282A2C]' : 'text-[#444746] hover:bg-[#E1E5EA]')}`}>
          <span className="truncate pr-2 leading-relaxed whitespace-nowrap flex-1">{chat.title}</span>
          {chat.working && <span className="shrink-0 mr-1 inline-block w-2 h-2 rounded-full bg-current opacity-70 animate-pulse" title="正在生成中"></span>}
          {chat.skill && <span className="text-[11px] shrink-0 opacity-70 mr-1" title={chat.skill}>🧭</span>}
          {confirming ? (
            <div className="flex items-center gap-0.5 shrink-0" onClick={e => e.stopPropagation()}>
              <span className={`text-[11px] mr-0.5 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>删除?</span>
              <button title="确认删除" onClick={(e) => { e.stopPropagation(); onDelete(chat.id); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center text-[12px] ${isDark ? 'text-[#F28B82] hover:bg-[#5c2b29]' : 'text-[#C5221F] hover:bg-[#FAD2CF]'}`}>✓</button>
              <button title="取消" onClick={(e) => { e.stopPropagation(); setConfirming(false); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center text-[12px] ${isDark ? 'hover:bg-[#444746]' : 'hover:bg-[#D3D7DB]'}`}>✗</button>
            </div>
          ) : (
            <div className="hidden group-hover:flex items-center gap-0.5 shrink-0">
              <button title="重命名" onClick={(e) => { e.stopPropagation(); setVal(chat.title); setEditing(true); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] ${isDark ? 'hover:bg-[#444746]' : 'hover:bg-[#D3D7DB]'}`}>✏️</button>
              <button title="删除" onClick={(e) => { e.stopPropagation(); setConfirming(true); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] ${isDark ? 'hover:bg-[#5c2b29]' : 'hover:bg-[#FAD2CF]'}`}>🗑</button>
            </div>
          )}
        </div>
      );
    };

    const WidgetCard = ({ title, children, theme }) => {
      const isDark = theme === 'dark';
      return (
        <div className={`rounded-[24px] p-8 flex flex-col transition-shadow hover:shadow-md ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
          <div className={`text-[14px] font-medium tracking-wide mb-6 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>
            {title}
          </div>
          <div className="flex-1 flex flex-col">
            {children}
          </div>
        </div>
      );
    };

    const ProgressBar = ({ label, value, subValue, percentage, theme, color = "#0B57D0" }) => {
      const isDark = theme === 'dark';
      return (
        <div>
          <div className="flex justify-between items-end mb-2">
            <span className={`text-[14px] ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{label}</span>
            <div className="text-right">
              <span className={`text-[16px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{value}</span>
              {subValue && <span className={`text-[13px] ml-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{subValue}</span>}
            </div>
          </div>
          <div className={`h-2 w-full rounded-full overflow-hidden ${isDark ? 'bg-[#333537]' : 'bg-[#E1E5EA]'}`}>
            <div
              className="h-full rounded-full transition-all duration-1000 ease-out"
              style={{ width: `${percentage > 0 ? percentage : 100}%`, backgroundColor: percentage > 0 ? color : (isDark ? '#444746' : '#C4C7C5') }}
            ></div>
          </div>
        </div>
      );
    };

    const ListRow = ({ label, value, border = true, theme }) => {
      const isDark = theme === 'dark';
      return (
        <div className="flex justify-between items-center px-4 py-3 relative">
          <span className={`text-[14px] ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{label}</span>
          <span className={`text-[14px] font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{value}</span>
          {border && <div className={`absolute bottom-0 right-4 left-4 h-[1px] ${isDark ? 'bg-white/5' : 'bg-black/5'}`}></div>}
        </div>
      );
    };

    // ==========================================
    // Render
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
