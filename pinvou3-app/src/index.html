    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .msg-md pre { margin:0.6em 0; padding:1em; border-radius:12px; overflow-x:auto; font-size:0.88em; line-height:1.5; }
    .msg-md pre code { padding:0; background:none; }
    .msg-md blockquote { border-left:3px solid rgba(128,128,128,0.4); padding-left:1em; margin:0.5em 0; opacity:0.85; }
    .msg-md a { text-decoration:underline; }
    .msg-md table { border-collapse:collapse; margin:0.5em 0; font-size:0.92em; }
    .msg-md th,.msg-md td { border:1px solid rgba(128,128,128,0.3); padding:0.4em 0.8em; }

    .dark-code .msg-md code { background:rgba(255,255,255,0.08); color:#E3E3E3; }
    .dark-code .msg-md pre { background:rgba(0,0,0,0.3); color:#E3E3E3; }

    .light-code .msg-md code { background:rgba(0,0,0,0.06); color:#1F1F1F; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .streaming-cursor::after { content:"▊"; animation:blink 1s step-end infinite; margin-left:2px; }

    .ap-card { transform-style: preserve-3d; transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s; will-change: transform; position: relative; }
    /* 鼠标跟随高光(--mx/--my 由 JS 注入) */
    .ap-card::before {
      content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0;
      transition:opacity .25s; z-index:1;
      background: radial-gradient(380px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.10), transparent 42%);

    .ap-card:hover::before { opacity:1; }
    .ap-card > * { position:relative; z-index:2; }
    /* A 档金色 spotlight 额外柔光 */
    .ap-card.tier-A:hover { box-shadow: 0 0 0 1px rgba(255,191,0,.35), 0 14px 40px -12px rgba(255,191,0,.30); }

    @keyframes lanyard-sway { 0%,100%{ transform: rotate(-1.3deg) } 50%{ transform: rotate(1.3deg) } }

    @keyframes memorial-roller-top-open { from { top: calc(50% - 9px) } to { top: -9px } }

    @keyframes memorial-roller-bottom-open { from { bottom: calc(50% - 9px) } to { bottom: -9px } }

    const bridge = window.TauriBridge || { available: false };

    function useBridge() {

        setDragAvatar({

      function handleSetTheme(th) {
        setActiveTheme(th);
        if (bridge.available) {
          bridge.saveSettings(buildFullSettings({ theme: th === 'dark' ? 'genesis' : 'liquid-light' }));
        }
      }

      function handleSetSearchProvider(p) {
        if (p === searchProvider) return;
        setSearchProvider(p);
        setSearchApiKey(searchKeyDrafts[p] || '');
      }

      function handleSetSearchApiKey(k) {
        setSearchApiKey(k);
        setSearchKeyDrafts(prev => ({ ...prev, [searchProvider]: k }));
        setSearchKeyActions(prev => ({ ...prev, [searchProvider]: k.trim() ? 'replace' : 'keep_existing' }));
      }

      function handleKeepSearchApiKey() {
        setSearchApiKey('');
        setSearchKeyDrafts(prev => ({ ...prev, [searchProvider]: '' }));
        setSearchKeyActions(prev => ({ ...prev, [searchProvider]: 'keep_existing' }));
      }

      function handleReplaceSearchApiKey() {
        setSearchKeyActions(prev => ({ ...prev, [searchProvider]: 'replace' }));
      }

      function handleDeleteSearchApiKey() {
        setSearchApiKey('');
        setSearchKeyDrafts(prev => ({ ...prev, [searchProvider]: '' }));
        setSearchKeyActions(prev => ({ ...prev, [searchProvider]: 'delete' }));
      }

      function handleConfirmSearchConfig() {
        if (bridge.available) {
          bridge.saveSettingsAndRestart(buildFullSettings({
            search: buildSearchSettingsPayload(),
          }));
        }
      }

      function handleSetLanguage(lang) {
        setLanguage(lang);
        if (bridge.available) {
          const nextLanguage = LANG_TO_TAG[lang] || 'zh-Hans';
          bridge.saveSettings(buildFullSettings({ language: nextLanguage }));
        }
      }

      function handleSetMemoryEnabled(enabled) {
        if (bridge.available) {
          const memoryAvailable = (LANG_TO_TAG[language] || 'zh-Hans') === 'zh-Hans';
          bridge.saveSettings(buildFullSettings({ memory_enabled: memoryAvailable && !!enabled }));
        }
      }

      async function handleSetTaskCompletedNotif(enabled) {
        const nextEnabled = !!enabled;
        const previousEnabled = taskCompletedNotif;
        setTaskCompletedNotif(nextEnabled);
        if (bridge.available) {
          const saved = await bridge.saveSettings(buildFullSettings({
            notifications: { enabled: nextEnabled, task_completed: nextEnabled },
          }));
          if (saved === false) {
            setTaskCompletedNotif(previousEnabled);
          }
        }
      }

      function buildAdvancedOverrides(overrides) {
        const baseAdvanced = (bs && bs.settings && bs.settings.advanced) ? bs.settings.advanced : {};
        const nextPreset = overrides.model_preset !== undefined ? overrides.model_preset : modelPreset;
        const nextModelName = overrides.custom_model_name !== undefined ? overrides.custom_model_name : customModelName;
        const nextBaseUrl = overrides.custom_base_url !== undefined ? overrides.custom_base_url : customBaseUrl;
        const nextApiKey = overrides.custom_api_key !== undefined ? overrides.custom_api_key : customApiKey;
        const nextProfiles = {
          ...(baseAdvanced.model_profiles || {}),
          ...(modelProfiles || {}),
          [nextPreset]: normalizedModelProfile(nextModelName, nextBaseUrl, nextApiKey),
        };
        return {
          ...baseAdvanced,
          ...overrides,
          model_preset: nextPreset,
          custom_model_name: nextModelName || null,
          custom_base_url: nextBaseUrl || null,
          custom_api_key: nextApiKey || null,
          model_profiles: nextProfiles,
        };

      // 模型配置改为草稿模式：只更新 state，点击确认后统一保存并重启
      function handleChangeModelPreset(p) {
        const nextProfiles = mergeModelDraft(modelProfiles, modelPreset, customModelName, customBaseUrl, customApiKey);
        const saved = savedModelConfigRef.current;
        if (saved && p === saved.preset) {
          // 切回已保存的来源 → 还原已保存值（而非厂商默认），dirty 自然归零
          setModelProfiles(nextProfiles);
          setModelPreset(saved.preset);
          setCustomModelName(saved.name);
          setCustomBaseUrl(saved.baseUrl);
          setCustomApiKey(saved.apiKey);
          return;
        }
        const draft = modelDraftForPreset(p, nextProfiles);
        setModelProfiles(nextProfiles);
        setModelPreset(p);
        setCustomBaseUrl(draft.baseUrl);
        setCustomModelName(draft.name);
        setCustomApiKey(draft.apiKey);
      }
      function handleSetCustomModelName(v) {
        setCustomModelName(v);
      }
      function handleSetCustomBaseUrl(v) {
        setCustomBaseUrl(v);
      }
      function handleSetCustomApiKey(v) {
        setCustomApiKey(v);

    function formatSessionDate(ts, language) {
      if (!ts) return '';
      const d = new Date(typeof ts === 'number' ? ts : ts);
      const now = new Date();
      let diff = now - d;
      if (diff < 0) diff = 0; // 时钟漂移/未来时间戳 → 当「刚刚」,不出现负数
      const L = {
        zh: { justNow: '刚刚', minsAgo: n => `${n} 分钟前`, hoursAgo: n => `${n} 小时前`, yesterday: '昨天', daysAgo: n => `${n} 天前`, locale: 'zh-CN' },
        ja: { justNow: 'たった今', minsAgo: n => `${n} 分前`, hoursAgo: n => `${n} 時間前`, yesterday: '昨日', daysAgo: n => `${n} 日前`, locale: 'ja-JP' },
        en: { justNow: 'Just now', minsAgo: n => `${n}m ago`, hoursAgo: n => `${n}h ago`, yesterday: 'Yesterday', daysAgo: n => `${n}d ago`, locale: 'en-US' },
      }[language] || { justNow: 'Just now', minsAgo: n => `${n}m ago`, hoursAgo: n => `${n}h ago`, yesterday: 'Yesterday', daysAgo: n => `${n}d ago`, locale: 'en-US' };
      // 今天之内:相对时间(刚刚 / X分钟前 / X小时前)——比绝对钟点更直观传达「多近」,
      // 且不同时间天然有区分度(不会同日多条都一样)。
      if (diff < 60000) return L.justNow;                                  // < 60 秒
      if (diff < 3600000) return L.minsAgo(Math.floor(diff / 60000));      // < 60 分钟
      if (diff < 86400000) return L.hoursAgo(Math.floor(diff / 3600000));  // < 24 小时
      if (diff < 172800000) return L.yesterday;                           // 24~47 小时
      const days = Math.floor(diff / 86400000);
      if (days < 7) return L.daysAgo(days);                               // 2~6 天
      // ≥7 天:日期;跨年带年份(只写月日会有歧义)
      const opts = d.getFullYear() === now.getFullYear()
        ? { month: 'short', day: 'numeric' }
        : { year: 'numeric', month: 'short', day: 'numeric' };
      return d.toLocaleDateString(L.locale, opts);
    }

      // ================= 文件管理 (L0) =================
      const [scan, setScan] = useState(kbCache.scan);

      const CATS = [

      }, [scan ? scan.running : false, cat, query]);

      const runSearch = async (catKey, text) => {

      useEffect(() => {
        if (scan && !scan.running && scan.phase === 'done') { refreshL0(); runSearch(cat, query); }

      const scanning = !!(scan && scan.running);
      const total = stats ? stats.totalFiles : 0;

      const neverScanned = loaded && !scanning && total === 0;

      const AUTOSCAN_COOLDOWN = 300; // 秒:5 分钟内反复切回文件页不重复扫,用缓存即可。
      useEffect(() => {

        const last = scan && scan.finishedAt ? scan.finishedAt : 0;
        if (Math.floor(Date.now() / 1000) - last > AUTOSCAN_COOLDOWN) startScan();
      }, [loaded, sub]);

      // ================= 知识库 (L1) =================
      const [colls, setColls] = useState(kbCache.colls);
      const [activeColl, setActiveColl] = useState(null);
      const [docs, setDocs] = useState([]);
      const [allDocs, setAllDocs] = useState(kbCache.allDocs);
      const [idx, setIdx] = useState(null);
      const [newColl, setNewColl] = useState(null);
      const [delColl, setDelColl] = useState(null); // 待删除知识集(二次确认),null=无
      const [confirmDoc, setConfirmDoc] = useState(null); // 行内二次确认中的文档 id,null=无
      const [embedInfo, setEmbedInfo] = useState(kbCache.embedInfo);
      const [kbModel, setKbModel] = useState(kbCache.model); // embedding 模型部署状态(null=未知)
      const [kbCat, setKbCat] = useState('all'); // 知识库分类筛选 tab

      const loadDocs = async (cid) => { try { setDocs(await inv('kb_documents', { collectionId: cid, limit: 0 }) || []); } catch (e) {} };
      const loadColls = useCallback(async () => {
        try { const c = await inv('kb_collection_list') || []; setColls(c); kbCache.colls = c; } catch (e) {}
        try { const d = await inv('kb_documents', { collectionId: 0, limit: 0 }) || []; setAllDocs(d); kbCache.allDocs = d; } catch (e) {}
        try { const ei = await inv('kb_embed_info'); setEmbedInfo(ei); kbCache.embedInfo = ei; } catch (e) {}
        try { const m = await inv('kb_model_status'); setKbModel(m); kbCache.model = m; } catch (e) {}
      }, []);
      useEffect(() => { loadColls(); }, []); // 挂载即加载,文件管理「加入知识库」浮层也要用
      useEffect(() => { if (sub === 'kb') loadColls(); }, [sub]);

      // ── embedding 模型 gate(未装则知识库页显下载引导,装好热加载免重启)──
      const modelInstalled = kbModel == null ? true : !!kbModel.installed; // 未知时不闪 gate(mock/旧后端)
      const kbm = (bs && bs.kbModelSetup) || {};
      const dlProg = kbm.progress || null;
      const downloading = !!kbm.downloading;
      const mb = (n) => Math.round((n || 0) / 1048576);
      // 进度百分比:download 阶段用真实 downloaded/total(占 0~95%),校验/解压/完成递进到 100。
      const dlPct = (() => {
        if (!dlProg) return 0;
        if (dlProg.stage === 'download') return dlProg.total > 0 ? Math.min(95, Math.floor(dlProg.downloaded / dlProg.total * 95)) : 0;
        if (dlProg.stage === 'verify') return 96;
        if (dlProg.stage === 'extract') return 98;
        if (dlProg.stage === 'done') return 100;
        return 0;
      })();
      const dlStageLabel = !dlProg ? t.kbModelStageDownload
        : dlProg.stage === 'verify' ? t.kbModelStageVerify
        : dlProg.stage === 'extract' ? t.kbModelStageExtract
        : dlProg.stage === 'done' ? t.kbModelStageDone
        : t.kbModelStageDownload;
      const startModelDownload = async () => {
        try {
          const st = await bridge.downloadKbModel();
          if (st) { setKbModel(st); kbCache.model = st; }
          loadColls(); // 模型就绪后刷新语义徽标/列表
        } catch (e) {}
      };

      const indexing = !!(idx && idx.running);
      useEffect(() => {
        if (!indexing) return;
        const id = setInterval(async () => {
          try {
            const s = await inv('kb_index_status'); setIdx(s);
            if (!s.running) { loadColls(); if (activeColl) loadDocs(activeColl.id); }
          } catch (e) {}
        }, 1000);
        return () => clearInterval(id);
      }, [indexing]);

      // newColl 带 id=编辑(改名/改分类),否则新建。编辑时透传原 description(后端 UPDATE 会覆盖该列)。
      const createColl = async () => {
        if (!newColl || !newColl.name.trim()) return;
        const name = newColl.name.trim(), category = (newColl.category || '').trim() || null;
        try {
          if (newColl.id) {
            await inv('kb_collection_update', { id: newColl.id, name, category, description: newColl.description ?? null });
            if (activeColl && activeColl.id === newColl.id) setActiveColl({ ...activeColl, name, category });
          } else {
            await inv('kb_collection_create', { name, category, description: null });
          }
        } catch (e) {}
        setNewColl(null); loadColls();
      };
      const deleteColl = async (id) => {
        try { await inv('kb_collection_delete', { id }); } catch (e) {}
        if (activeColl && activeColl.id === id) setActiveColl(null);
        loadColls();
      };
      // 点知识库卡片=就地聚焦该集(再点同卡/「全部」取消),下方文件表随之切换。不再跳二级详情页。
      const openColl = (c) => { if (activeColl && activeColl.id === c.id) setActiveColl(null); else { setActiveColl(c); loadDocs(c.id); } };
      const addSources = async (cid) => {
        let paths = [];
        try { paths = (bridge && bridge.pickFiles) ? await bridge.pickFiles() : []; } catch (e) { paths = []; }
        if (!paths || !paths.length) return;
        try { setIdx(await inv('kb_collection_add_sources', { collectionId: cid, paths })); } catch (e) {}
      };
      // 知识库页底部入口：选文件 → 单知识集直接加；多个/无则走「加入知识库」浮层选择。
      const dzPick = async () => {
        let paths = [];
        try { paths = (bridge && bridge.pickFiles) ? await bridge.pickFiles() : []; } catch (e) { paths = []; }
        if (!paths || !paths.length) return;
        if (colls.length === 1) { try { setIdx(await inv('kb_collection_add_sources', { collectionId: colls[0].id, paths })); } catch (e) {} }
        else { setAddToKb(paths); }
      };
      const StatusPill = ({ s }) => {
        const map = { ready: ['●', t.kbStReady, isDark ? 'text-[#7DD3A8]' : 'text-[#18a957]'], indexing: ['◐', t.kbStIndexing, isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'], pending: ['○', t.kbStPending, isDark ? 'text-[#E8C468]' : 'text-[#c98a00]'] };
        const v = map[s] || map.ready;
        return <span className={`text-[12px] font-medium ${v[2]}`}>{v[0]} {v[1]}</span>;
      };
      const docStatusLabel = (d) => d.parseStatus === 'parsed' ? `${d.nChunks} ${t.kbBlocks}` : (d.parseStatus === 'skipped' ? t.kbSkipped : (d.parseStatus === 'pending' ? t.kbStPending : d.parseStatus));

      const SubTab = ({ k, label, count }) => (
        <button onClick={() => setSub(k)}
          className={`flex items-center gap-2 px-1 pb-3 text-[15px] font-bold border-b-2 -mb-[1px] transition-colors ${sub === k ? (isDark ? 'border-[#A8C7FA] ' + ink : 'border-[#0B57D0] ' + ink) : `border-transparent ${muted}`}`}>
          {label}{count != null && <span className={`text-[11px] px-2 py-0.5 rounded-md ${sub === k ? accent : card}`}>{count}</span>}
        </button>
      );

      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">
          {/* Header */}
          <div className="w-full max-w-7xl mx-auto px-6 md:px-10 pt-12 pb-3">
            <h1 className="text-[32px] font-normal tracking-tight mb-1.5">{t.kbPageTitle}</h1>
            <p className={`text-[14px] ${muted}`}>{sub === 'files' ? t.kbFilesSub : sub === 'kb' ? t.kbKbSub : t.kbOutSub}</p>
          </div>
          {/* Sub-tabs */}
          <div className="w-full max-w-7xl mx-auto px-6 md:px-10 flex items-center gap-7 border-b border-gray-400/15">
            <SubTab k="output" label={t.kbSubOutput} count={outputs.length || null} />
            <SubTab k="files" label={t.kbSubFiles} count={total ? total.toLocaleString() : null} />
            <SubTab k="kb" label={t.kbSubKb} count={modelInstalled ? (colls.length || null) : null} />
          </div>

          <div className="flex-1 overflow-y-auto custom-scrollbar py-6">

            {/* ============ 文件管理 ============ */}
            {sub === 'files' && (
              <div className="max-w-7xl mx-auto px-6 md:px-10">
                {!loaded ? (
                  // 加载骨架:页面壳即时呈现(搜索栏+真实类型卡,数字/文件用灰条占位),数据 async 填,
                  // 避免整页空白死等 refreshL0(大库冷读时尤其明显)。loaded 后切真实数据,结构一致很平滑。
                  <div>
                    <div className="flex items-center gap-3 mb-5">
                      <div className={`flex-1 flex items-center gap-3 px-5 py-3 rounded-full ${card}`}>
                        <Search size={18} className={muted} />
                        <span className={`text-[15px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.kbSearchPlaceholder}</span>
                      </div>
                    </div>
                    <div className={`text-[15px] font-bold mb-3 ${ink}`}>{t.kbBrowseByType}</div>
                    <div className="grid grid-cols-4 lg:grid-cols-7 gap-3 mb-7">
                      {CATS.map((c) => { const col = CAT_COLOR[c.key] || '#8a8a9a'; const CatI = CAT_ICON[c.key] || FileText; return (
                        <div key={c.key} className={`flex items-center gap-3 p-3 rounded-xl ${panel}`} style={panelShadow}>
                          <div className="w-9 h-9 rounded-xl grid place-items-center shrink-0" style={{ background: col + (isDark ? '33' : '1f'), color: col }}><CatI size={17} /></div>
                          <div className="min-w-0">
                            <div className={`text-[13px] font-bold truncate ${ink}`}>{c.label}</div>
                            <div className={`h-3 w-10 rounded mt-1.5 animate-pulse ${isDark ? 'bg-white/10' : 'bg-black/[0.07]'}`} />
                          </div>
                        </div>
                      );})}
                    </div>
                    <div className={`text-[15px] font-bold mb-3 ${ink}`}>{t.kbAllFiles}</div>
                    <div className={`rounded-2xl overflow-hidden ${panel}`} style={panelShadow}>
                      {Array.from({ length: 6 }).map((_, i) => (
                        <div key={i} className="flex items-center gap-3 px-5 py-3 border-b border-gray-400/10 last:border-0">
                          <div className={`w-7 h-7 rounded-lg shrink-0 animate-pulse ${isDark ? 'bg-white/10' : 'bg-black/[0.07]'}`} />
                          <div className={`flex-1 h-3 rounded animate-pulse ${isDark ? 'bg-white/10' : 'bg-black/[0.07]'}`} style={{ maxWidth: `${60 - i * 6}%` }} />
                        </div>
                      ))}
                    </div>
                  </div>
                ) : neverScanned ? (
                  <div className={`text-center py-20 ${muted}`}>
                    <p className="text-[15px] mb-4">{t.kbEmptyHint}</p>
                    <button onClick={startScan} className={`px-5 py-2.5 rounded-full text-[14px] font-medium ${accent}`}>{t.kbScanNow}</button>
                  </div>
                ) : (
                  <div>
                    <div className="flex items-center gap-3 mb-5">
                      <div className={`flex-1 flex items-center gap-3 px-5 py-3 rounded-full ${card}`}>
                        <Search size={18} className={muted} />
                        <input type="text" value={query} placeholder={t.kbSearchPlaceholder}
                          onChange={(e) => setQuery(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') runSearch(cat, query); }}
                          className={`flex-1 bg-transparent border-none outline-none text-[15px] ${isDark ? 'placeholder:text-[#C4C7C5]' : 'placeholder:text-[#444746]'}`} />
                      </div>
                      {/* 自动维护(档3)已让库自保最新,重扫退化成兜底图标钮:闲时干净贴设计稿,
                          扫描中自动展开显示进度。 */}
                      <button onClick={startScan} disabled={scanning} title={t.kbRescan}
                        className={`shrink-0 flex items-center gap-2 rounded-full transition-colors ${scanning ? 'px-4 py-2.5 cursor-default' : 'p-2.5'} ${soft}`}>
                        <RefreshCw size={16} className={scanning ? 'animate-spin' : ''} />
                        {scanning && <span className="text-[12px] font-medium">{t.kbScanning} {(scan.scanned || 0).toLocaleString()}</span>}
                      </button>
                    </div>

                    <div>
                        {/* 按类型浏览 — 彩色类型卡(每类独立图标 + 白卡) */}
                        <div className="flex items-baseline justify-between mb-3">
                          <div className={`text-[15px] font-bold ${ink}`}>{t.kbBrowseByType}</div>
                          <div className={`text-[12px] ${muted}`}>{t.kbMonitored}{scan && scan.roots && scan.roots.length ? ` · ${t.kbMonitoredDirs.replace('{n}', scan.roots.length)}` : ''}</div>
                        </div>
                        <div className="grid grid-cols-4 lg:grid-cols-7 gap-3 mb-7">
                          {CATS.map((c) => {
                            const col = CAT_COLOR[c.key] || '#8a8a9a';
                            const on = cat === c.key;
                            const CatI = CAT_ICON[c.key] || FileText;
                            return (
                            <button key={c.key} onClick={() => setCat(c.key)}
                              className={`flex items-center gap-3 p-3 rounded-xl text-left transition-all ${panel} ${panelHover}`}
                              style={on ? { borderColor: col, boxShadow: `${isDark ? '' : '0 1px 2px rgba(24,24,40,.04), '}0 0 0 3px ${col}1f` } : panelShadow}>
                              <div className="w-9 h-9 rounded-xl grid place-items-center shrink-0" style={{ background: col + (isDark ? '33' : '1f'), color: col }}><CatI size={17} /></div>
                              <div className="min-w-0">
                                <div className={`text-[13px] font-bold truncate ${ink}`}>{c.label}</div>
                                <div className={`text-[11px] ${muted}`}>{catCount(c).toLocaleString()}{t.kbItemUnit}</div>
                              </div>
                            </button>
                          );})}
                        </div>

                        {/* 最近文件 — 卡片(L0 无打开次数,用最近修改的前 4 个) */}
                        {!query && results.length > 0 && (
                          <div className="mb-7">
                            <div className={`text-[15px] font-bold mb-3 ${ink}`}>{t.kbRecentFiles}</div>
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                              {results.slice(0, 4).map((f) => { const e = extOf(f); const col = extColor(e); return (
                                <div key={f.path} className={`p-3 rounded-2xl ${panel} ${panelHover} transition-all`} style={panelShadow}>
                                  <LocalFilePreview f={f} onOpen={() => setOutputPreviewPath(f.path)} />
                                  <div className={`text-[13px] font-bold truncate ${ink}`} title={f.name}>{f.name}</div>
                                  <div className={`text-[11px] truncate mt-1 ${muted}`}>{f.path}</div>
                                  <div className="flex items-center justify-between mt-3 pt-3 border-t border-gray-400/10">
                                    <span className={`text-[11px] ${muted}`}>{fmtDate(f.mtime)}</span>
                                    <button onClick={() => openFile(f.path)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${soft}`}>{t.kbOpen}</button>
                                  </div>
                                </div>
                              );})}
                            </div>
                          </div>
                        )}

                        {/* 全部文件 — 标准表格 */}
                        <div className="flex items-baseline justify-between mb-3">
                          <div className={`text-[15px] font-bold ${ink}`}>{query ? `${t.kbResults} · ${results.length}` : t.kbAllFiles}</div>
                          <div className={`text-[12px] ${muted}`}>{t.kbSortByModified}</div>
                        </div>
                        {searched && results.length === 0 ? (
                          <div className={`text-center py-16 ${muted} text-[14px]`}>{scanning ? `${t.kbScanningHint} ${(scan.scanned || 0).toLocaleString()}` : t.kbNoResults}</div>
                        ) : (
                          <div className={`rounded-2xl overflow-hidden ${panel}`} style={panelShadow}>
                            <div className={`flex items-center gap-3 px-5 py-3 text-[11.5px] font-semibold ${muted} border-b border-gray-400/15 ${isDark ? 'bg-white/5' : 'bg-[#fbfbfd]'}`}>
                              <span className="flex-1 min-w-0">{t.kbColName}</span>
                              <span className="w-[26%] hidden lg:block">{t.kbColLoc}</span>
                              <span className="w-20 text-right">{t.kbColSize}</span>
                              <span className="w-28 text-right">{t.kbColTime}</span>
                              <span className="w-24"></span>
                            </div>
                            {results.map((f) => { const e = extOf(f); const col = extColor(e); return (
                              <div key={f.path} className={`group flex items-center gap-3 px-5 py-2.5 border-b border-gray-400/10 last:border-0 ${cardHover} transition-colors`}>
                                <div className="flex-1 min-w-0 flex items-center gap-3">
                                  <span className="w-7 h-7 rounded-lg grid place-items-center text-[8.5px] font-extrabold text-white shrink-0" style={{ background: col }}>{extLabel(e)}</span>
                                  <span className={`text-[13px] truncate ${ink}`} title={f.name}>{f.name}</span>
                                </div>
                                <span className={`w-[26%] truncate text-[12px] hidden lg:block ${muted}`} title={f.path}>{f.path}</span>
                                <span className={`w-20 text-right text-[12px] ${muted}`}>{fmtSize(f.size)}</span>
                                <span className={`w-28 text-right text-[12px] ${muted}`}>{fmtDate(f.mtime)}</span>
                                <div className="w-24 flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                  <button title={t.kbAddToKb} onClick={() => setAddToKb(f.path)} className={`p-1.5 rounded-full ${iconHover}`}><Plus size={15} /></button>
                                  <button title={t.kbOpen} onClick={() => openFile(f.path)} className={`p-1.5 rounded-full ${iconHover}`}><ExternalLink size={15} /></button>
                                  <button title={t.kbOpenFolder} onClick={() => openFolder(f.path)} className={`p-1.5 rounded-full ${iconHover}`}><BookOpen size={15} /></button>
                                </div>
                              </div>
                            );})}
                          </div>
                        )}
                      </div>
                  </div>
                )}
              </div>
            )}

            {/* ============ 产出物 ============ */}
            {sub === 'output' && (
              <div className="max-w-7xl mx-auto px-6 md:px-10">
                <div className="flex flex-col lg:flex-row lg:items-center gap-3 mb-5">
                  <div className={`flex-1 flex items-center gap-3 px-5 py-3 rounded-[16px] ${isDark ? 'bg-[#1f2124] border border-white/[0.06]' : 'bg-white border border-[#ececf1]'}`} style={panelShadow}>
                    <Search size={18} className={muted} />
                    <input type="text" value={outQuery} placeholder={t.kbOutSearchList}
                      onChange={(e) => setOutQuery(e.target.value)}
                      className={`flex-1 bg-transparent border-none outline-none text-[15px] ${isDark ? 'placeholder:text-[#C4C7C5]' : 'placeholder:text-[#444746]'}`} />
                  </div>
                  <div className={`h-[52px] inline-flex items-center gap-1 p-1 rounded-[16px] border ${isDark ? 'bg-[#1f2124] border-white/[0.06]' : 'bg-white border-[#ececf1]'}`} style={panelShadow}>
                    <button title={t.kbOutGallery} onClick={() => setOutView('grid')}
                      className={`w-10 h-10 rounded-xl grid place-items-center transition-colors ${outView === 'grid' ? (isDark ? 'bg-[#2a3952] text-[#79aaff]' : 'bg-[#e9f1ff] text-[#2f6beb]') : muted}`}>
                      <GridIcon size={18} />
                    </button>
                    <button title={t.kbOutList} onClick={() => setOutView('list')}
                      className={`w-10 h-10 rounded-xl grid place-items-center transition-colors ${outView === 'list' ? (isDark ? 'bg-[#2a3952] text-[#79aaff]' : 'bg-[#e9f1ff] text-[#2f6beb]') : muted}`}>
                      <IconList size={18} />
                    </button>
                  </div>
                </div>

                {!outputsLoaded ? (
                  <div className={`rounded-2xl overflow-hidden ${panel}`} style={panelShadow}>
                    {Array.from({ length: 6 }).map((_, i) => (
                      <div key={i} className="flex items-center gap-3 px-5 py-3 border-b border-gray-400/10 last:border-0">
                        <div className={`w-8 h-8 rounded-lg shrink-0 animate-pulse ${isDark ? 'bg-white/10' : 'bg-black/[0.07]'}`} />
                        <div className={`flex-1 h-3 rounded animate-pulse ${isDark ? 'bg-white/10' : 'bg-black/[0.07]'}`} style={{ maxWidth: `${70 - i * 7}%` }} />
                      </div>
                    ))}
                  </div>
                ) : outputs.length === 0 ? (
                  <div className={`text-center py-20 ${muted}`}>
                    <div className={`w-14 h-14 mx-auto rounded-2xl grid place-items-center mb-4 ${card}`}><Archive size={24} /></div>
                    <p className={`text-[15px] font-bold mb-1 ${ink}`}>{t.kbOutEmpty}</p>
                    <p className="text-[13px]">{t.kbOutEmptyHint}</p>
                  </div>
                ) : (() => {

                    <div className={`text-center py-20 ${muted}`}>
                      <div className={`w-14 h-14 mx-auto rounded-2xl grid place-items-center mb-4 ${card}`}><Archive size={24} /></div>
                      <p className={`text-[15px] font-bold mb-1 ${ink}`}>{t.kbOutEmpty}</p>
                      <p className="text-[13px]">{t.kbOutEmptyHint}</p>

                  );
                  const sections = groupOutputs(activeOutputs).filter((x) => x.rows.length > 0);
                  const OutputActions = ({ o, compact }) => (

                      <button onClick={() => newOutputProject(o)} className={`h-8 px-3 rounded-full text-[12.5px] font-bold ${isDark ? 'bg-white/[0.075] text-[#dfe3e9]' : 'bg-[#f2f4f8] text-[#444746]'}`}>{t.kbOutNewProject}</button>

    // ==========================================
    // 长按确认清除按钮（hold-to-confirm，防误触）：按住 850ms 进度填满才执行，
    // 松手 / 移开 / 失焦即取消；执行时图标转一圈、变绿「已清除」，900ms 后复位。
    // 鼠标 / 触摸 / 键盘(空格·回车)均支持。数字归零动画由父级 onClear 负责。
    const ClearStatsHold = ({ theme, t, onClear }) => {
      const isDark = theme === 'dark';
      const HOLD_MS = 850;
      const [fillPct, setFillPct] = useState(0);
      const [phase, setPhase] = useState('idle');  // idle | holding | done
      const rafRef = useRef(0);
      const holdStartRef = useRef(0);
      const committedRef = useRef(false);
      const activeRef = useRef(false);
      const resetTimerRef = useRef(0);

      const commit = () => {
        if (committedRef.current) return;
        committedRef.current = true;
        activeRef.current = false;
        cancelAnimationFrame(rafRef.current);
        setFillPct(100);
        setPhase('done');
        onClear && onClear();
        resetTimerRef.current = setTimeout(() => {
          setFillPct(0);
          setPhase('idle');
          committedRef.current = false;
        }, 900);
      };
      const tick = (now) => {
        const p = Math.min((now - holdStartRef.current) / HOLD_MS, 1);
        setFillPct(p * 100);
        if (p >= 1) { commit(); return; }
        rafRef.current = requestAnimationFrame(tick);
      };
      const begin = () => {
        if (activeRef.current || committedRef.current) return;
        activeRef.current = true;
        setPhase('holding');
        holdStartRef.current = performance.now();
        rafRef.current = requestAnimationFrame(tick);
      };
      const cancel = () => {
        if (!activeRef.current || committedRef.current) return;
        activeRef.current = false;
        cancelAnimationFrame(rafRef.current);
        setPhase('idle');
        setFillPct(0);
      };
      useEffect(() => () => { cancelAnimationFrame(rafRef.current); clearTimeout(resetTimerRef.current); }, []);

      const label = phase === 'done' ? t.clearDone : phase === 'holding' ? t.clearHolding : t.clearHold;
      const fillColor = isDark ? 'rgba(220,47,68,0.24)' : '#fce7ea';
      const toneClass = phase === 'done'
        ? (isDark ? 'text-[#93D5A6] border-[#2c5234]' : 'text-[#1f9d51] border-[#bfe7cc]')
        : phase === 'holding'
          ? (isDark ? 'text-[#F28B82] border-[#7a3b3b]' : 'text-[#dc2f44] border-[#f1c4cb]')
          : (isDark ? 'text-[#C4C7C5] border-[#3c4043] hover:bg-[#2a2b2d]' : 'text-[#5b6473] border-[#e3e7ec] hover:bg-[#fafbfc]');
      return (
        <button
          type="button"
          aria-label={t.clearHold}
          onMouseDown={(e) => { e.preventDefault(); begin(); }}
          onMouseUp={cancel}
          onMouseLeave={cancel}
          onTouchStart={(e) => { e.preventDefault(); begin(); }}
          onTouchEnd={(e) => { e.preventDefault(); cancel(); }}
          onTouchCancel={cancel}
          onKeyDown={(e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); begin(); } }}
          onKeyUp={(e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); cancel(); } }}
          onBlur={cancel}
          className={`relative overflow-hidden flex-shrink-0 inline-flex items-center text-[13px] font-medium px-4 py-2 rounded-[9px] border select-none transition-colors ${toneClass} ${isDark ? 'bg-[#1a1b1c]' : 'bg-white'}`}
        >
          <span
            className="absolute left-0 top-0 bottom-0 z-0"
            style={{ width: fillPct + '%', background: fillColor, transition: activeRef.current ? 'none' : 'width .22s ease' }}
          ></span>
          <span className="relative z-[1] inline-flex items-center gap-1.5">
            <RotateCcw size={15} style={{ animation: phase === 'done' ? 'tsSpinner .5s ease' : 'none' }} />
            {label}
          </span>
        </button>
      );
    };

      const vllmTps = fmt ? fmt.vllmTps : loadingValue;
      const vllmTokTotal = fmt ? fmt.vllmTokTotal : loadingValue;
      const vllmStatsCleared = fmt ? fmt.vllmStatsCleared : false;
      const vllmClearedAt = fmt ? fmt.vllmClearedAt : null;
      const vllmRaw = fmt ? fmt.vllmRaw : null;
      const appVersion = fmt ? fmt.appVersion : loadingValue;
      const dtVersion = fmt ? fmt.dtVersion : '—';
      const uptime = fmt ? fmt.uptime : loadingValue;

      // 长按清除：先放数字归零插值动画（覆盖显示），动画跑完才真正设基准点清除，
      // 之后下一次 poll 接管显示「自此刻起」的区间值（KV/TTFT/TPS → 0，tokens → 0/0）。
      const [clearOverride, setClearOverride] = useState(null);
      const clearRafRef = useRef(0);
      const reduceMotionRef = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      useEffect(() => () => cancelAnimationFrame(clearRafRef.current), []);
      const fmtTokLocal = (n) => {
        if (n == null) return '—';
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
        return String(Math.round(n));
      };
      const doClear = useCallback(() => {
        const reallyClear = () => { if (bridge.available && bridge.clearMonitorStats) bridge.clearMonitorStats(); };
        const raw = vllmRaw;
        if (!raw || reduceMotionRef.current) { reallyClear(); return; }
        const from = { kv: raw.kvPct, ttftS: raw.ttftS, tps: raw.tps, gen: raw.gen || 0, prompt: raw.prompt || 0 };
        const startT = performance.now(), dur = 480;
        cancelAnimationFrame(clearRafRef.current);
        const step = (now) => {
          const p = Math.min((now - startT) / dur, 1);
          const k = Math.pow(1 - p, 3);  // easeOutCubic 的剩余比例：1 → 0
          setClearOverride({
            kv: from.kv != null ? (from.kv * k).toFixed(1) + '%' : '0%',
            ttft: from.ttftS != null ? (from.ttftS * k).toFixed(2) + ' s' : '0 s',
            tps: from.tps != null ? (from.tps * k).toFixed(1) + ' tok/s' : '0 tok/s',
            tokTotal: fmtTokLocal(Math.round(from.gen * k)) + ' / ' + fmtTokLocal(Math.round(from.prompt * k)),
          });
          if (p >= 1) { reallyClear(); setClearOverride(null); return; }
          clearRafRef.current = requestAnimationFrame(step);
        };
        clearRafRef.current = requestAnimationFrame(step);
      }, [vllmRaw]);
      const pad2 = (n) => (n < 10 ? '0' + n : '' + n);
      let vllmStatusText = t.statsLifetime;
      if (vllmStatsCleared && vllmClearedAt) {
        const d = new Date(vllmClearedAt);
        const hhmm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
        const mins = Math.max(0, Math.round((Date.now() - vllmClearedAt) / 60000));
        vllmStatusText = t.statsSince.replace('%t', hhmm) + (mins === 0 ? t.statsJustReset : t.statsAge.replace('%m', mins));
      }

      const [history, setHistory] = useState(cloneMonitorHistory);
      const [clockNow, setClockNow] = useState(new Date());
      const [isModelClearing, setIsModelClearing] = useState(false);
      const modelClearTimerRef = useRef(null);
      useEffect(() => {
        const readNum = (value) => {
          if (typeof value === 'number') return value;
          const m = String(value || '').match(/-?\d+(\.\d+)?/);
          return m ? Number(m[0]) : null;
        };
        setHistory(prev => {
          const push = (arr, value) => value == null ? arr : [...arr, value].slice(-20);
          const next = {
            ctx: push(prev.ctx, readNum(vllmMaxLen)),
            queue: push(prev.queue, readNum(vllmQueue)),
            ttft: push(prev.ttft, readNum(clearOverride ? clearOverride.ttft : vllmTtft)),
            tps: push(prev.tps, readNum(clearOverride ? clearOverride.tps : vllmTps)),
            kv: push(prev.kv, (clearOverride || (fmt && fmt.vllmKvHasData)) ? readNum(clearOverride ? clearOverride.kv : vllmKv) : null),
          };
          Object.assign(getMonitorHistoryStore(), next);
          return next;
        });
      }, [vllmMaxLen, vllmQueue, vllmTtft, vllmTps, vllmKv, clearOverride]);
      useEffect(() => {
        const timer = setInterval(() => setClockNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);
      const handleModelClearStart = () => {
        setIsModelClearing(true);
        if (modelClearTimerRef.current) clearTimeout(modelClearTimerRef.current);
        modelClearTimerRef.current = setTimeout(() => {
          doClear();
          setIsModelClearing(false);
          modelClearTimerRef.current = null;
        }, 1200);
      };
      const handleModelClearEnd = () => {
        setIsModelClearing(false);
        if (modelClearTimerRef.current) {
          clearTimeout(modelClearTimerRef.current);
          modelClearTimerRef.current = null;
        }
      };
      useEffect(() => () => {
        if (modelClearTimerRef.current) clearTimeout(modelClearTimerRef.current);
      }, []);

      const monitorColors = {
        blue: isDark ? '#0A84FF' : '#007AFF',
        green: isDark ? '#30D158' : '#34C759',
        orange: isDark ? '#FF9F0A' : '#FF9500',
        red: isDark ? '#FF453A' : '#FF3B30',
        gray: isDark ? '#98989D' : '#8E8E93',
      };
      const processorUtilPct = fmt && fmt.processorUtilPct != null ? fmt.processorUtilPct : 0;
      const gpuSharedMemory = fmt && fmt.gpuSharedMemory ? fmt.gpuSharedMemory : loadingValue;
      const isLocalProcessor = /intel/i.test(gpuName) || processorUtilPct > 0;
      const isUnifiedGpu = gpuAvailable && !gpuHasVram && !isLocalProcessor;
      const unifiedMemoryPct = isUnifiedGpu ? ramPct : gpuVramPct;
      const computeDeviceName = isLocalProcessor ? monitorShortProcessorName(gpuName) : gpuName;
      const processorIcon = monitorProcessorIcon(gpuName);
      const modelIcon = monitorModelIcon(vllmModel);
      const tokenPair = monitorTokenPair(clearOverride ? clearOverride.tokTotal : vllmTokTotal);
      const ctxNum = typeof vllmMaxLen === 'number' ? vllmMaxLen : parseFloat(String(vllmMaxLen || '').replace(/[^\d.]/g, ''));
      const ctxValue = Number.isFinite(ctxNum) ? Math.round(ctxNum / 1024) : String(vllmMaxLen || '—');
      const ctxUnit = Number.isFinite(ctxNum) ? 'K' : '';
      const queueText = String(vllmQueue || '—').replace(/\s+/g, '');
      const ttftText = String(clearOverride ? clearOverride.ttft : vllmTtft).replace(/\s*s$/i, '');
      const tpsText = String(clearOverride ? clearOverride.tps : vllmTps).replace(/\s*tok\/s$/i, '');
      const kvText = String(clearOverride ? clearOverride.kv : vllmKv).replace('%', '');
      const statusText = vllmOnline ? t.available
        : (vllmHealthStatus === 'missing_api_key' ? '未验证'
          : (vllmHealthStatus === 'auth_failed' ? '鉴权失败'
            : (vllmHealthStatus === 'unverified' ? '未验证' : t.unavailable)));

                      <span className={`relative h-2 w-2 rounded-full ${vllmOnline ? 'bg-[#34C759] dark:bg-[#30D158]' : 'bg-[#8E8E93]'}`} />

                    <span className="text-[11px] font-bold tracking-[0.15em] uppercase text-black/50 dark:text-white/50">{!monitorBridgeReady ? '监控桥接未就绪：请确认打开的是 Tauri 应用窗口' : (monitorError ? `监控读取失败：${monitorError}` : t.sysDesc)}</span>
                  </div>
                </div>

                <div className="flex items-center gap-1.5 bg-white/60 dark:bg-[#1C1C1E] backdrop-blur-[40px] rounded-full p-1.5 shadow-[0_4px_20px_rgb(0,0,0,0.04)] dark:shadow-[0_18px_46px_rgba(0,0,0,0.5)] ring-1 ring-black/[0.03] dark:ring-white/[0.055]">
                  <div className="flex items-center gap-2 px-4 text-[14px] font-semibold font-mono tracking-wider text-black/70 dark:text-white/70">

                    <div className="space-y-8 pt-8">
                      <MonitorSegmentedBar label={t.runningMemory} used={ramUsedGiB} total={ramTotal} percentage={ramPct} color={monitorColors.blue} />

                    </div>
                    <div className="mt-8 rounded-2xl bg-white/55 dark:bg-[#2C2C2E] border border-black/[0.045] dark:border-white/[0.055] px-4 py-3 flex justify-between items-center text-[12px] font-semibold shadow-[0_8px_22px_rgba(15,23,42,0.05)] dark:shadow-[0_16px_34px_rgba(0,0,0,0.34)]">
                      <span className="text-black/45 dark:text-white/45">{t.memoryPressure}</span>
                      <span className="inline-flex items-center gap-1.5 text-black dark:text-white"><span className="w-1.5 h-1.5 rounded-full bg-[#34C759] dark:bg-[#30D158]" />{t.normal}</span>
                    </div>
                  </div>
                </MonitorCard>

                <MonitorCard className="md:col-span-6 lg:col-span-4">
                  <MonitorComputeHeader
                    icon={Cpu}

                  <div className="flex-1 flex flex-col justify-end mt-4">
                    <div className="flex items-center justify-center gap-10 mb-7">
                      <MonitorRing label={isLocalProcessor ? t.processorLoad : t.core} percent={isLocalProcessor ? processorUtilPct : gpuUtilPct} color={monitorColors.blue} />
                      <MonitorRing label={isLocalProcessor ? t.graphicsLoad : (isUnifiedGpu ? t.unifiedMem : t.vram)} percent={isLocalProcessor ? gpuUtilPct : unifiedMemoryPct} color={monitorColors.orange} />
                    </div>
                    <div className="pt-4 border-t border-black/5 dark:border-white/5 space-y-3 text-[12px] font-semibold">

                      </div>
                      <div className="flex justify-between items-center text-black/40 dark:text-white/40">

                  </div>
                </MonitorCard>

                <MonitorCard className="md:col-span-12 lg:col-span-4 flex flex-col">
                  <MonitorSectionHeader icon={Server} title={t.app} />
                  <div className="flex-1 flex flex-col justify-between">
                    <div className="mb-6">
                      <div className="flex items-center gap-2 mb-2">
                        <img src="./brand-blue.png" alt="" className="w-7 h-7 rounded-lg object-cover shadow-[0_2px_8px_rgba(0,0,0,0.12)]" />
                        <h2 className="text-xl font-bold">pinvou3-app</h2>
                      </div>
                    </div>
                    <div className="space-y-3 mb-6">
                      <div className="flex items-center justify-between rounded-2xl bg-white/65 dark:bg-[#2C2C2E] px-4 py-3 border border-black/[0.055] dark:border-white/[0.055] shadow-[0_8px_22px_rgba(15,23,42,0.06)] dark:shadow-[0_18px_44px_rgba(0,0,0,0.46),0_6px_16px_rgba(0,0,0,0.34)] transition-all duration-300 hover:-translate-y-0.5 hover:bg-white/90 hover:shadow-[0_12px_30px_rgba(15,23,42,0.09)] dark:hover:!bg-[#3A3A3C] dark:hover:shadow-[0_14px_34px_rgba(0,0,0,0.34)]">
                        <span className="text-[11px] font-bold tracking-[0.04em] text-black/45 dark:text-white/45">{t.curVer}</span>
                        <span className="text-[13px] font-bold font-mono text-black/70 dark:text-white/70">{appVersion}</span>
                      </div>
                      <div className="flex items-center justify-between rounded-2xl bg-white/65 dark:bg-[#2C2C2E] px-4 py-3 border border-black/[0.055] dark:border-white/[0.055] shadow-[0_8px_22px_rgba(15,23,42,0.06)] dark:shadow-[0_18px_44px_rgba(0,0,0,0.46),0_6px_16px_rgba(0,0,0,0.34)] transition-all duration-300 hover:-translate-y-0.5 hover:bg-white/90 hover:shadow-[0_12px_30px_rgba(15,23,42,0.09)] dark:hover:!bg-[#3A3A3C] dark:hover:shadow-[0_14px_34px_rgba(0,0,0,0.34)]">
                        <span className="text-[11px] font-bold tracking-[0.04em] text-black/45 dark:text-white/45">{t.uptime}</span>
                        <span className="text-[13px] font-bold font-mono text-black/70 dark:text-white/70">{uptime}</span>
                      </div>
                    </div>
                    <div className="mt-auto bg-white/55 dark:bg-[#2C2C2E] rounded-3xl p-4 border border-black/[0.055] dark:border-white/[0.055] shadow-[0_10px_28px_rgba(15,23,42,0.06)] dark:shadow-[0_20px_48px_rgba(0,0,0,0.48),0_7px_18px_rgba(0,0,0,0.36)] transition-all duration-300 hover:-translate-y-0.5 hover:bg-white/80 dark:hover:!bg-[#3A3A3C]">
                      <span className="text-[10px] font-bold tracking-[0.04em] text-black/50 dark:text-white/50 block mb-3 px-2">运行活动</span>
                      <MonitorActivityBars color={monitorColors.blue} />
                    </div>
                  </div>
                </MonitorCard>

                <MonitorCard className="md:col-span-12" highlight>
                  <MonitorSectionHeader icon={BrainCircuit} title={t.currentModel} />
                  <div className="flex justify-between items-start mb-6">
                    <div>
                      <div className="flex items-center gap-3 mb-2">
                        {modelIcon && <MonitorBrandIcon src={modelIcon} className="w-9 h-9" />}
                        <h2 className="text-2xl font-bold tracking-tight">{vllmModel}</h2>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="px-3.5 py-2 rounded-full bg-black/[0.04] dark:bg-[#2C2C2E] text-[12px] font-bold tracking-[0.04em] text-black/55 dark:text-white/60 border border-black/[0.04] dark:border-white/[0.055]">{runModeText}</span>
                      <button className="bg-black/5 dark:bg-[#2C2C2E] hover:bg-black/10 dark:hover:bg-[#3A3A3C] px-4 py-2 rounded-full text-[12px] font-bold tracking-[0.04em] transition-colors">{statusText}</button>
                      <button
                        onMouseDown={handleModelClearStart}
                        onMouseUp={handleModelClearEnd}
                        onMouseLeave={handleModelClearEnd}
                        onTouchStart={handleModelClearStart}
                        onTouchEnd={handleModelClearEnd}
                        className="relative group flex items-center gap-2 px-4 py-2 rounded-full bg-black/5 dark:bg-white/10 overflow-hidden active:scale-95 transition-transform"
                      >
                        <div
                          className="absolute inset-0 bg-[#FF3B30]/20 z-0"
                          style={{ width: isModelClearing ? '100%' : '0%', transition: isModelClearing ? 'width 1.2s ease' : 'width 0.3s' }}
                        />
                        <RotateCcw size={14} className={`relative z-10 ${isModelClearing ? 'text-[#FF3B30] animate-spin' : 'text-black/60 dark:text-white/70'}`} />
                        <span className={`relative z-10 text-[12px] font-bold tracking-[0.04em] ${isModelClearing ? 'text-[#FF3B30]' : 'text-black/70 dark:text-white/80'}`}>{t.resetCount}</span>
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 xl:grid-cols-5 gap-6 mb-6">
                    <MonitorMetricCard label={t.ctx} value={ctxValue} unit={ctxUnit} hint={t.contextHint} color={monitorColors.orange} data={history.ctx} />
                    <MonitorMetricCard label={t.queue} value={queueText} unit="" hint={t.queueHint} color={monitorColors.green} data={history.queue} />
                    <MonitorMetricCard label={t.ttft} value={ttftText} unit="s" hint={t.ttftHint} color={monitorColors.orange} data={history.ttft} />
                    <MonitorMetricCard label={t.tps} value={tpsText} unit="tok/s" hint={t.tpsHint} color={monitorColors.blue} data={history.tps} />
                    <MonitorMetricCard label={t.historyReuse} value={kvText} unit="%" hint={t.reuseHint} color={monitorColors.green} data={history.kv} />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="rounded-3xl bg-white/62 dark:bg-[#2C2C2E] px-5 py-5 border border-black/[0.055] dark:border-white/[0.055] shadow-[0_8px_24px_rgba(15,23,42,0.06)] dark:shadow-[0_18px_44px_rgba(0,0,0,0.46),0_6px_16px_rgba(0,0,0,0.34)] transition-all duration-300 hover:-translate-y-0.5 hover:bg-white/90 hover:shadow-[0_12px_32px_rgba(15,23,42,0.09)] dark:hover:!bg-[#3A3A3C] dark:hover:shadow-[0_14px_34px_rgba(0,0,0,0.34)]">
                        <div className="flex items-start justify-between gap-4">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-[#007AFF] dark:bg-[#0A84FF]" />
                              <div className="text-[14px] font-bold tracking-[0.02em] text-black/62 dark:text-white/68">{t.modelReadAmount}</div>
                            </div>
                            <div className="text-[12px] leading-snug font-semibold text-black/45 dark:text-white/45 mt-2">{t.modelReadHint}</div>
                          </div>
                          <div className="text-[30px] leading-none font-bold tracking-[-0.03em]">{tokenPair.input}</div>
                        </div>
                      </div>
                      <div className="rounded-3xl bg-white/62 dark:bg-[#2C2C2E] px-5 py-5 border border-black/[0.055] dark:border-white/[0.055] shadow-[0_8px_24px_rgba(15,23,42,0.06)] dark:shadow-[0_18px_44px_rgba(0,0,0,0.46),0_6px_16px_rgba(0,0,0,0.34)] transition-all duration-300 hover:-translate-y-0.5 hover:bg-white/90 hover:shadow-[0_12px_32px_rgba(15,23,42,0.09)] dark:hover:!bg-[#3A3A3C] dark:hover:shadow-[0_14px_34px_rgba(0,0,0,0.34)]">
                        <div className="flex items-start justify-between gap-4">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="w-2 h-2 rounded-full bg-[#34C759] dark:bg-[#30D158]" />
                              <div className="text-[14px] font-bold tracking-[0.02em] text-black/62 dark:text-white/68">{t.modelOutputAmount}</div>
                            </div>
                            <div className="text-[12px] leading-snug font-semibold text-black/45 dark:text-white/45 mt-2">{t.modelOutputHint}</div>
                          </div>

                        </div>

                </MonitorCard>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">

          <div className="w-full max-w-7xl mx-auto px-6 md:px-10 pt-12 pb-6 flex items-end justify-between">
            <div>
              <h1 className="text-[32px] font-normal tracking-tight mb-2">{t.sysStatus}</h1>
              <p className={`text-[15px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.sysDesc}</p>
            </div>
            <div className={`flex items-center gap-3 px-5 py-2.5 rounded-full ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
              <div className={`w-2 h-2 rounded-full ${vllmIsRemote ? 'bg-[#9aa1ac]' : (vllmOnline ? 'bg-[#188038] animate-pulse' : 'bg-[#EA4335]')}`}></div>
              <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{updatedAt}</span>
              <div className="w-[1px] h-4 bg-gray-400/30 mx-2"></div>
              <button
                onClick={() => { if (bridge.available) bridge.startMonitorPolling(); }}
                className={`hover:rotate-180 transition-transform duration-500 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}

          <div className="flex-1 overflow-y-auto py-8 custom-scrollbar">

                      <div className="flex items-center gap-2">
                        <span className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.power}</span>
                        <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{gpuPower || '—'}</span>
                      </div>
                    </div>
                  ) : null}
                  <ProgressBar label={t.core} value={gpuAvailable ? gpuUtil : '—'} percentage={gpuAvailable ? gpuUtilPct : 0} theme={theme} />
                </div>
              </WidgetCard>

              <WidgetCard title={t.ram} theme={theme}>
                 <div className="mb-10 flex items-baseline gap-2">
                  <h3 className="text-[48px] font-normal leading-none tracking-tight">{ramUsedGiB}</h3>
                  <span className={`text-[16px] font-medium ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>GB {t.used}</span>
                </div>
                <div className="space-y-6 mt-auto">
                  <ProgressBar label={t.physical} value={ramPct + '%'} subValue={ramTotal + ' ' + t.total} percentage={ramPct} theme={theme} color="#0B57D0" />
                  <ProgressBar label={t.swap} value={swapPct + '%'} subValue={swapTotal} percentage={swapPct} theme={theme} color="#188038" />
                </div>
              </WidgetCard>

              <WidgetCard title={t.vllm} theme={theme}>
                 <div className="flex items-start justify-between mb-8">
                  <div className="min-w-0">
                    <h3 className="text-[22px] font-medium mb-1">{vllmModel}</h3>
                    {vllmModelMismatch && vllmConfiguredModel && (
                      <p className={`text-[12px] truncate ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>
                        配置: {vllmConfiguredModel}
                      </p>
                    )}
                    <p className={`text-[13px] font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{vllmUpstream}</p>
                    <p className={`text-[12px] mt-1 ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>{vllmTargetKind}</p>
                    {vllmDiagnostic && (
                      <p className={`text-[12px] mt-1 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>{vllmDiagnostic}</p>
                    )}
                    {!vllmDiagnostic && vllmMetricDiagnostic && (
                      <p className={`text-[12px] mt-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#5F6368]'}`}>{vllmMetricDiagnostic}</p>
                    )}
                  </div>
                  {/* 云端(remote)不做健康探测 → 非在线时不显示徽章(不误报 OFFLINE);
                      本地仍显示 READY/BUSY/OFFLINE/MISMATCH。 */}
                  {(!vllmIsRemote || vllmOnline) && (
                  <div className={`px-3 py-1 rounded-full flex items-center gap-2 ${
                    vllmStatus === 'MISMATCH' || vllmStatus === 'UNKNOWN'
                      ? (isDark ? 'bg-[#5C3A1E] text-[#F9AB00]' : 'bg-[#FEF3E8] text-[#B06000]')
                      : vllmOnline
                        ? (isDark ? 'bg-[#0F5223] text-[#93D5A6]' : 'bg-[#E6F4EA] text-[#137333]')
                        : (isDark ? 'bg-[#5C2020] text-[#F28B82]' : 'bg-[#FCE8E6] text-[#C5221F]')
                  }`}>
                    {vllmStatus === 'MISMATCH' || vllmStatus === 'UNKNOWN' || !vllmOnline ? <AlertTriangle size={12} /> : <CheckCircle2 size={12} />}
                    <span className="text-[11px] font-bold tracking-wider">{vllmStatus}</span>
                  </div>
                  )}
                </div>
                <div className={`rounded-[16px] p-2 mt-auto ${isDark ? 'bg-[#131314]' : 'bg-[#F8F9FA]'}`}>
                  <ListRow label={t.ctx} value={String(vllmMaxLen)} theme={theme} />
                  {vllmCtxWarn && (
                    <div className={`flex items-start gap-1 px-1 pt-1 pb-1 text-[10px] leading-snug ${isDark ? 'text-amber-400' : 'text-amber-600'}`}>
                      <AlertTriangle size={11} className="shrink-0 mt-[1px]" />
                      <span>{t.ctxWarn.replace('%s', Math.round(vllmCtxWarn / 1024) + 'k')}</span>
                    </div>
                  )}
                  <ListRow label={t.queue} value={vllmQueue} theme={theme} />
                  <ListRow label={t.kv} value={clearOverride ? clearOverride.kv : vllmKv} theme={theme} />
                  <ListRow label={t.ttft} value={clearOverride ? clearOverride.ttft : vllmTtft} theme={theme} />
                  <ListRow label={t.tps} value={clearOverride ? clearOverride.tps : vllmTps} theme={theme} />
                  <ListRow label={t.tokTotal} value={clearOverride ? clearOverride.tokTotal : vllmTokTotal} border={false} theme={theme} />
                </div>
                <div className="flex items-center justify-between gap-3 mt-3 px-1 min-h-[30px]">
                  <span className={`text-[12px] flex items-center gap-1.5 min-w-0 ${isDark ? 'text-[#9aa1ac]' : 'text-[#80868B]'}`}>
                    <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${vllmOnline ? 'bg-[#188038]' : 'bg-[#9aa1ac]'}`}></span>
                    <span className="truncate">{vllmStatusText}</span>
                  </span>
                  <ClearStatsHold theme={theme} t={t} onClear={doClear} />
                </div>
                <p className={`text-center text-[11px] mt-3 ${isDark ? 'text-[#7a7d7b]' : 'text-[#9aa1ac]'}`}>{t.clearHint}</p>
              </WidgetCard>

              <WidgetCard title={t.app} theme={theme}>
                <div className="mb-8">
                  <h3 className="text-[22px] font-medium mb-1">pinvou3-app</h3>
                  <p className={`text-[14px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.appRunning}</p>
                </div>
                {/* 不用 mt-auto：右卡内容少，让版本表格紧跟标题，与左卡表格顶部对齐而非沉底 */}
                <div className={`rounded-[16px] p-2 ${isDark ? 'bg-[#131314]' : 'bg-[#F8F9FA]'}`}>
                  <ListRow label={t.curVer} value={appVersion} theme={theme} />
                  <ListRow label={t.uiVer} value={dtVersion} theme={theme} />
                  <ListRow label={t.uptime} value={uptime} border={false} theme={theme} />
                </div>
              </WidgetCard>

            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // Settings View (Material 3 Style)
    // ==========================================
    // 统一排版原语：卡片 / 行(label 左 + 控件右) / 纵向输入字段 / 分段选择 / 改动操作条
    const SCard = React.forwardRef(({ isDark, title, titleAdornment, children, id, style }, ref) => (
      <section ref={ref} id={id} style={style} className={`rounded-[24px] p-6 ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
        <h2 className="text-[18px] font-medium mb-6 flex items-center gap-2">
          <span>{title}</span>
          {titleAdornment}
        </h2>
        {children}
      </section>
    ));

    const SRow = ({ isDark, label, desc, children }) => (
      <div className="flex items-center justify-between gap-8">
        <div className="min-w-0">
          <span className="text-[16px] block mb-1">{label}</span>
          {desc && <span className={`text-[13px] block ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{desc}</span>}
        </div>
        <div className="shrink-0">{children}</div>
      </div>
    );

    const SField = ({ isDark, label, ...inputProps }) => (
      <div>
        <span className={`text-[14px] block mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{label}</span>
        <input
          {...inputProps}
          className={`w-full px-4 py-2 rounded-lg text-[14px] outline-none transition-colors ${
            isDark ? 'bg-[#131314] text-[#E3E3E3] border border-[#444746] focus:border-[#A8C7FA]'
                   : 'bg-white text-[#1F1F1F] border border-[#C4C7C5] focus:border-[#0B57D0]'
          }`}
        />
      </div>
    );

    const SSegmented = ({ isDark, options, value, onChange }) => (
      <div className={`p-1 rounded-full flex ${isDark ? 'bg-[#131314]' : 'bg-[#E1E5EA]'}`}>
        {options.map(o => (
          <button
            key={o.key}
            onClick={() => onChange(o.key)}
            className={`px-5 py-2 rounded-full text-[14px] font-medium transition-colors ${
              value === o.key ? (isDark ? 'bg-[#A8C7FA] text-[#041E49]' : 'bg-white text-[#0B57D0] shadow-sm') : ''
            }`}
          >{o.label}</button>
        ))}
      </div>
    );

    // 「需重启」统一表达：改动后才出现，一句说明 + 一个动作，替代常驻大按钮和斜体小字
    const SActionBar = ({ isDark, message, actionLabel, onAction }) => (
      <div className={`flex items-center justify-between gap-4 px-4 py-3 rounded-xl ${isDark ? 'bg-[#131314]' : 'bg-white'}`}>
        <span className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{message}</span>
        <button
          onClick={onAction}
          className={`text-[13px] font-medium px-4 py-2 rounded-full whitespace-nowrap transition-colors ${
            isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]'
                   : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]'
          }`}
        >{actionLabel}</button>
      </div>
    );

    const MemorySettingsCard = ({ isDark, bs, memoryEnabled, onMemoryEnabledChange }) => {
      const memory = (bs && bs.memory) || {};
      const profile = memory.profile || {};
      const identity = profile.identity || {};
      const preferences = memory.preferences || [];
      const workContext = memory.work_context || [];
      const currentFocus = (memory.current_focus || []).filter(item => item.status === 'active');
      const recentActivity = (memory.recent_activity || []).filter(item => item.status === 'active');
      const [open, setOpen] = useState(false);
      const [tab, setTab] = useState('long_term');
      const [query, setQuery] = useState('');
      const [menuFor, setMenuFor] = useState(null);
      const [draft, setDraft] = useState({
        call_name: identity.call_name || '',
        assistant_alias: identity.assistant_alias || '',
      });
      const [editing, setEditing] = useState(null);
      const [saving, setSaving] = useState(false);
      const subText = isDark ? 'text-[#C4C7C5]' : 'text-[#444746]';
      const faintText = isDark ? 'text-[#8F969E]' : 'text-[#6B7280]';
      const border = isDark ? 'border-[#333537]' : 'border-[#DDE3EA]';
      const itemBg = isDark ? 'bg-[#131314]' : 'bg-white';
      const cardBg = isDark ? 'bg-[#17191D] border-white/[0.08]' : 'bg-white border-[#DDE3EA]';
      const panelBg = isDark ? 'bg-[#1F2023] text-[#E8EAED]' : 'bg-[#F8FAFD] text-[#1F1F1F]';
      const inputBg = isDark ? 'bg-[#131314] border-[#3C4043] text-[#E8EAED] placeholder:text-[#777D86]' : 'bg-white border-[#DDE3EA] text-[#1F1F1F] placeholder:text-[#8A9099]';
      const ghostBtn = isDark ? 'bg-white/[0.07] text-[#E3E3E3] hover:bg-white/[0.11]' : 'bg-[#E1E5EA] text-[#1F1F1F] hover:bg-[#D3D9E0]';
      const dangerBtn = isDark ? 'text-[#F28B82] hover:bg-[#3A2425]' : 'text-[#C5221F] hover:bg-[#FCE8E6]';
      const primaryBtn = isDark ? 'bg-[#A8C7FA] text-[#041E49] hover:bg-[#C2D7FB]' : 'bg-[#0B57D0] text-white hover:bg-[#1967D2]';
      const selectedTab = isDark
        ? 'bg-[rgba(43,119,255,0.16)] border-[rgba(70,145,255,0.35)] text-[#D8E8FF]'
        : 'bg-[#E8F0FE] border-[#B8D1FF] text-[#0B57D0]';
      const profileCount = (identity.call_name ? 1 : 0) + (identity.assistant_alias ? 1 : 0);
      const profileSummary = [
        identity.call_name ? `称呼：${identity.call_name}` : '',
        identity.assistant_alias ? `助手昵称：${identity.assistant_alias}` : '',
      ].filter(Boolean).join(' · ');
      const total = preferences.length + workContext.length + currentFocus.length + recentActivity.length;
      const longTermItems = [
        ...preferences.map(item => ({ ...item, kind: 'preference' })),
        ...workContext.map(item => ({ ...item, kind: 'work_context' })),
      ];
      const recentItems = [
        ...currentFocus.map(item => ({ ...item, kind: 'current_focus' })),
        ...recentActivity.map(item => ({ ...item, kind: 'recent_activity' })),
      ];
      const longTermCount = profileCount + longTermItems.length;
      const recentCount = recentItems.length;
      const tabs = [
        { key: 'long_term', label: '长期记忆', count: longTermCount, icon: Database },
        { key: 'recent', label: '近期记忆', count: recentCount, icon: RefreshCw },
      ];
      const tabMeta = tabs.find(x => x.key === tab) || tabs[0];
      const memoryTypeLabel = kind => kind === 'current_focus' ? '当前关注'
        : kind === 'recent_activity' ? '近期动态'
        : kind === 'work_context' ? '工作背景'
        : '长期偏好';
      const memoryTypeIcon = kind => kind === 'current_focus' ? Lightbulb
        : kind === 'recent_activity' ? RefreshCw
        : kind === 'work_context' ? Briefcase
        : kind === 'profile' ? User
        : Sparkles;
      const memoryTypeTone = kind => kind === 'work_context' ? 'text-[#8AB4F8] bg-[#1A73E8]/[0.13]'
        : kind === 'current_focus' ? 'text-[#FDD663] bg-[#FDD663]/[0.12]'
        : kind === 'recent_activity' ? 'text-[#81C995] bg-[#34A853]/[0.12]'
        : kind === 'profile' ? 'text-[#C58AF9] bg-[#A142F4]/[0.12]'
        : 'text-[#A8C7FA] bg-[#A8C7FA]/[0.12]';
      const normalizedQuery = query.trim().toLowerCase();
      const searchMatch = text => !normalizedQuery || String(text || '').toLowerCase().includes(normalizedQuery);

      useEffect(() => {
        if (!bridge.available || !bridge.loadMemoryOverview) return;
        bridge.loadMemoryOverview();
      }, [bs && bs.activeSessionId]);
      useEffect(() => {
        setDraft({
          call_name: identity.call_name || '',
          assistant_alias: identity.assistant_alias || '',
        });
      }, [identity.call_name, identity.assistant_alias]);
      useEffect(() => {
        setMenuFor(null);
        setQuery('');
      }, [tab, open]);

      const reload = () => bridge.available && bridge.loadMemoryOverview && bridge.loadMemoryOverview();
      const saveProfile = async () => {
        if (!bridge.available || !bridge.saveMemoryProfilePatch) return;
        setSaving(true);
        try {
          await bridge.saveMemoryProfilePatch({
            call_name: draft.call_name,
            assistant_alias: draft.assistant_alias,
          });
        } finally {
          setSaving(false);
        }
      };
      const startEdit = item => {
        setMenuFor(null);
        setEditing({
          kind: item.kind,
          id: item.id,
          text: item.text || item.content || '',
        });
      };
      const saveEdit = async () => {
        if (!editing || !bridge.updateMemoryItem) return;
        setSaving(true);
        try {
          await bridge.updateMemoryItem(editing.kind, editing.id, {
            text: editing.text,
          });
          setEditing(null);
        } finally {
          setSaving(false);
        }
      };
      const deleteItem = async item => {
        setMenuFor(null);
        if (!item || !bridge.deleteMemoryItem) return;
        if (!window.confirm('删除后这条记忆不会再被使用，确定删除吗？')) return;
        await bridge.deleteMemoryItem(item.kind, item.id);
      };
      const archiveItem = async item => {
        setMenuFor(null);
        if (!item || !bridge.archiveRecentWorkMemory) return;
        await bridge.archiveRecentWorkMemory(item.id);
      };
      const activeList = tab === 'recent' ? recentItems : longTermItems;
      const filteredList = activeList.filter(item => searchMatch(item.text || item.content));

      const formatMemoryTime = item => {
        const raw = item.updated_at || item.created_at || item.last_seen_at || item.last_used_at;
        if (!raw) return '已记住';
        const date = new Date(raw);
        if (Number.isNaN(date.getTime())) return '已记住';
        const diff = Date.now() - date.getTime();
        const day = 24 * 60 * 60 * 1000;
        if (diff >= 0 && diff < day) return '今天更新';
        if (diff >= day && diff < 7 * day) return `${Math.floor(diff / day)} 天前更新`;
        return `${date.getMonth() + 1}月${date.getDate()}日更新`;
      };
      const confidenceText = item => {
        const n = Number(item.confidence);
        if (!Number.isFinite(n)) return '自动整理';
        if (n >= 0.85) return '置信度高';
        if (n >= 0.65) return '置信度中';
        return '置信度低';
      };

      const MemoryRow = ({ item }) => {
        const Icon = memoryTypeIcon(item.kind);
        const rowKey = `${item.kind}:${item.id}`;
        return (
          <div className={`group relative rounded-2xl border px-4 py-4 ${cardBg} shadow-[0_12px_34px_rgba(0,0,0,0.16)]`}>
            <div className="flex items-start justify-between gap-4">
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 mb-3">
                  <span className={`w-7 h-7 rounded-full flex items-center justify-center ${memoryTypeTone(item.kind)}`}><Icon size={14} /></span>
                  <span className="text-[13px] font-medium">{memoryTypeLabel(item.kind)}</span>
                  <span className={`ml-auto text-[11px] ${faintText}`}>{formatMemoryTime(item)}</span>
                </div>
                <div className="text-[14px] leading-relaxed break-words">{item.text}</div>
                <div className={`mt-3 text-[12px] ${faintText}`}>
                  来源：对话识别 · {confidenceText(item)}
                </div>
              </div>
              <button
                title="更多操作"
                onClick={(e) => {
                  e.stopPropagation();
                  setMenuFor(menuFor === rowKey ? null : rowKey);
                }}
                className={`shrink-0 w-8 h-8 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#AEB4BC] hover:bg-white/[0.08] hover:text-[#F2F3F5]' : 'text-[#5F6368] hover:bg-black/[0.06]'}`}
              >
                <MoreHorizontal size={17} />
              </button>
            </div>
            {menuFor === rowKey && (
              <div onClick={(e) => e.stopPropagation()} className={`absolute right-4 top-12 z-10 min-w-[118px] rounded-xl border ${border} ${isDark ? 'bg-[#24262B] text-[#E8EAED]' : 'bg-white text-[#1F1F1F]'} shadow-2xl overflow-hidden`}>
                <button onClick={() => startEdit(item)} className={`w-full flex items-center gap-2 px-3 py-2 text-left text-[13px] ${isDark ? 'hover:bg-white/[0.07]' : 'hover:bg-black/[0.04]'}`}><Edit2 size={14} />编辑</button>
                {(item.kind === 'current_focus' || item.kind === 'recent_activity') && (
                  <button onClick={() => archiveItem(item)} className={`w-full flex items-center gap-2 px-3 py-2 text-left text-[13px] ${isDark ? 'hover:bg-white/[0.07]' : 'hover:bg-black/[0.04]'}`}><Archive size={14} />归档</button>
                )}
                <button onClick={() => deleteItem(item)} className={`w-full flex items-center gap-2 px-3 py-2 text-left text-[13px] ${dangerBtn}`}><Trash2 size={14} />删除</button>
              </div>
            )}
          </div>
        );
      };

      return (
        <>
          <SCard isDark={isDark} title="记忆">
            <div className="flex items-center justify-between gap-4">
              <div className="min-w-0">
                <div className={`text-[14px] font-medium ${isDark ? 'text-[#E8EAED]' : 'text-[#1F1F1F]'}`}>
                  {memoryEnabled ? '已启用' : '已关闭'}
                </div>
                <div className={`mt-1 text-[13px] leading-relaxed ${subText}`}>
                  {memoryEnabled
                    ? (memory.loading ? '正在读取记忆' : (profileSummary ? `${profileSummary} · ${total} 条有效记忆。` : `PINVOU 会记住你的偏好、工作背景和近期事项，让后续对话更容易接上上下文。已记录 ${total} 条有效记忆。`))
                    : '开启后，PINVOU 可以记住你的称呼、稳定偏好、工作背景和近期事项，减少重复说明。'}
                </div>
                {memory.error && <div className="mt-2 text-[13px] text-[#EA4335]">{memory.error}</div>}
              </div>
              <div className="shrink-0 flex items-center gap-2">
                <button
                  onClick={() => onMemoryEnabledChange && onMemoryEnabledChange(!memoryEnabled)}
                  role="switch"
                  aria-checked={!!memoryEnabled}
                  title={memoryEnabled ? '关闭记忆' : '开启记忆'}
                  className={`w-12 h-7 rounded-full p-1 flex items-center transition-colors ${memoryEnabled ? 'justify-end bg-[#0B57D0]' : `justify-start ${isDark ? 'bg-[#3C4043]' : 'bg-[#DADCE0]'}`}`}
                >
                  <span className="block w-5 h-5 rounded-full bg-white shadow" />
                </button>
                {memoryEnabled && (
                  <button onClick={() => { setOpen(true); reload(); }} className={`text-[13px] font-medium px-4 py-2 rounded-full transition-colors ${primaryBtn}`}>
                    查看和管理
                  </button>
                )}
              </div>
            </div>
          </SCard>

          {open && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center px-4 py-6">
              <div className="absolute inset-0 bg-black/55" onClick={() => setOpen(false)} />
              <div className={`relative w-full max-w-[980px] max-h-[88vh] overflow-hidden rounded-[22px] border ${border} ${panelBg} shadow-2xl`}>
                <div className={`flex items-center justify-between gap-4 px-6 py-4 border-b ${border}`}>
                  <div>
                    <div className="text-[19px] font-semibold">记忆中心</div>
                    <div className={`text-[12px] mt-1 ${subText}`}>记忆由 AI 自动整理，非必要无需手动管理。</div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={reload} disabled={!!memory.loading} className={`inline-flex items-center gap-1.5 text-[12px] px-3 py-1.5 rounded-full ${ghostBtn}`}><RefreshCw size={13} className={memory.loading ? 'animate-spin' : ''} />{memory.loading ? '同步中' : '同步记忆'}</button>
                    <button onClick={() => setOpen(false)} className={`w-8 h-8 rounded-full flex items-center justify-center ${ghostBtn}`}><X size={15} /></button>
                  </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-[190px_1fr] min-h-[420px] max-h-[calc(88vh-73px)]">
                  <div className={`border-b md:border-b-0 md:border-r ${border} p-3 overflow-auto`}>
                    <div className="space-y-1">
                      {tabs.map(({ key, label, count, icon: TabIcon }) => (
                        <button
                          key={key}
                          onClick={() => setTab(key)}
                          className={`w-full flex items-center gap-2 text-left px-3 py-2 rounded-full border text-[13px] transition-colors ${tab === key ? selectedTab : `border-transparent ${isDark ? 'hover:bg-white/[0.06]' : 'hover:bg-black/[0.04]'}`}`}
                        >
                          <TabIcon size={15} className="shrink-0" />
                          <span className="min-w-0 flex-1 truncate">{label}</span>
                          <span className="text-[11px] opacity-75">{count}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                <button onClick={() => { setOpen(false); if (onGotoSettings) onGotoSettings(); }}

    const RemoteControlModal = ({ theme, bs, onClose }) => {

      useEffect(() => {
