<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pinvou3 智能助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Markdown rendering -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.3); border-radius: 10px; }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.5); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Chat message styles */
    .msg-md h1,.msg-md h2,.msg-md h3,.msg-md h4 { font-weight:600; margin:0.6em 0 0.3em; }
    .msg-md h1 { font-size:1.4em; } .msg-md h2 { font-size:1.2em; } .msg-md h3 { font-size:1.05em; }
    .msg-md p { margin:0.4em 0; line-height:1.7; }
    .msg-md ul,.msg-md ol { padding-left:1.5em; margin:0.4em 0; }
    .msg-md li { margin:0.2em 0; line-height:1.6; }
    .msg-md code { font-family:"JetBrains Mono","SF Mono",Consolas,monospace; font-size:0.88em; padding:0.15em 0.4em; border-radius:6px; }
    .msg-md pre { margin:0.6em 0; padding:1em; border-radius:12px; overflow-x:auto; font-size:0.88em; line-height:1.5; }
    .msg-md pre code { padding:0; background:none; }
    .msg-md blockquote { border-left:3px solid rgba(128,128,128,0.4); padding-left:1em; margin:0.5em 0; opacity:0.85; }
    .msg-md a { text-decoration:underline; }
    .msg-md table { border-collapse:collapse; margin:0.5em 0; font-size:0.92em; }
    .msg-md th,.msg-md td { border:1px solid rgba(128,128,128,0.3); padding:0.4em 0.8em; }

    /* Dark theme code blocks */
    .dark-code .msg-md code { background:rgba(255,255,255,0.08); color:#E3E3E3; }
    .dark-code .msg-md pre { background:rgba(0,0,0,0.3); color:#E3E3E3; }
    /* Light theme code blocks */
    .light-code .msg-md code { background:rgba(0,0,0,0.06); color:#1F1F1F; }
    .light-code .msg-md pre { background:rgba(0,0,0,0.04); color:#1F1F1F; }

    /* Tool card styles */
    .tool-card-output { max-height:200px; overflow-y:auto; font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-all; }

    /* Streaming cursor */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .streaming-cursor::after { content:"▊"; animation:blink 1s step-end infinite; margin-left:2px; }

    /* Thinking animation */
    @keyframes spin-braille { 0%{content:"⠋"} 10%{content:"⠙"} 20%{content:"⠹"} 30%{content:"⠸"} 40%{content:"⠼"} 50%{content:"⠴"} 60%{content:"⠦"} 70%{content:"⠧"} 80%{content:"⠇"} 90%{content:"⠏"} }
  </style>
</head>
<body class="m-0 p-0">
  <div id="root"></div>

  <!-- TauriBridge must load before React -->
  <script src="tauri-bridge.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ==========================================
       Lucide icon replacements (inline SVG)
       ========================================== */
    const I = ({size=24,className='',children}) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        className={className}>{children}</svg>
    );
    const Plus = (p) => <I {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></I>;
    const Edit2 = (p) => <I {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></I>;
    const Trash2 = (p) => <I {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></I>;
    const ClipboardList = (p) => <I {...p}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></I>;
    const BarChart2 = (p) => <I {...p}><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></I>;
    const Settings = (p) => <I {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></I>;
    const Monitor = (p) => <I {...p}><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></I>;
    const Brain = (p) => <I {...p}><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/></I>;
    const Zap = (p) => <I {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></I>;
    const Package = (p) => <I {...p}><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></I>;
    const RefreshCw = (p) => <I {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></I>;
    const Search = (p) => <I {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></I>;
    const Paperclip = (p) => <I {...p}><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></I>;
    const Mic = (p) => <I {...p}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></I>;
    const Send = (p) => <I {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></I>;
    const Terminal = (p) => <I {...p}><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></I>;
    const ChevronDown = (p) => <I {...p}><path d="m6 9 6 6 6-6"/></I>;
    const ChevronRight = (p) => <I {...p}><path d="m9 18 6-6-6-6"/></I>;
    const Copy = (p) => <I {...p}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></I>;
    const CheckCircle2 = (p) => <I {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></I>;
    const Menu = (p) => <I {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></I>;
    const Sparkles = (p) => <I {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></I>;
    const StopCircle = (p) => <I {...p}><circle cx="12" cy="12" r="10"/><rect width="6" height="6" x="9" y="9"/></I>;
    const XCircle = (p) => <I {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></I>;
    const Wrench = (p) => <I {...p}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/></I>;
    const User = (p) => <I {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></I>;

    /* ==========================================
       i18n dictionary — 1:1 from 前端.html
       ========================================== */

    const dict = {
      zh: {
        newChat: '新对话', searchChats: '搜索对话', monitor: '系统监控', workflow: '工作流', recent: '近期', settings: '设置', localEnv: '本地环境',
        sysStatus: '系统状态', sysDesc: '实时性能与资源指标', gpu: '图形处理器 (GPU)', gpuUnavail: '状态不可用', noSmi: '未检测到 nvidia-smi',
        vram: '显存占用', core: '计算核心', ram: '系统内存 (RAM)', used: '已用', physical: '物理内存', total: '总计', swap: '交换空间',
        vllm: 'VLLM 推理引擎', ctx: '上下文长度', queue: '队列情况', kv: 'KV 命中率', app: '应用服务', appRunning: '核心守护进程运行中',
        curVer: '当前版本', uiVer: 'UI 版本', uptime: '运行时长',
        appearance: '外观与语言', lang: '界面语言', langDesc: '切换应用的显示语言', theme: '主题模式', themeDesc: '选择适合你的色彩风格',
        light: '浅色', dark: '深色', sysPerm: '系统权限', sudo: '高级执行权限 (Sudo)', sudoDesc: '允许助手执行环境配置等高级指令。',
        chatGreeting: '你好，今天想聊点什么？', artifacts: '产物与代码', placeholder: '询问 PINVOU 或输入指令', disclaimer: 'PINVOU 可能会生成不准确的信息，请仔细核实。',
        searchPlaceholder: 'Search chats'
      },
      en: {
        newChat: 'New chat', searchChats: 'Search chats', monitor: 'Monitor', workflow: 'Workflow', recent: 'Recent', settings: 'Settings', localEnv: 'Local Env',
        sysStatus: 'System Status', sysDesc: 'Real-time performance metrics', gpu: 'GPU', gpuUnavail: 'Unavailable', noSmi: 'nvidia-smi not found',
        vram: 'VRAM Usage', core: 'Core Usage', ram: 'System RAM', used: 'Used', physical: 'Physical RAM', total: 'Total', swap: 'Swap Space',
        vllm: 'VLLM Engine', ctx: 'Context Length', queue: 'Queue (Run/Wait)', kv: 'KV Hit Rate', app: 'App Service', appRunning: 'Core daemon running',
        curVer: 'App Version', uiVer: 'UI Version', uptime: 'Uptime',
        appearance: 'Appearance & Language', lang: 'Language', langDesc: 'Switch application display language', theme: 'Theme', themeDesc: 'Choose your color style',
        light: 'Light', dark: 'Dark', sysPerm: 'System Permissions', sudo: 'Sudo Access', sudoDesc: 'Allow assistant to run high-privilege commands.',
        chatGreeting: "Hi, what's good?", artifacts: 'Artifacts', placeholder: 'Ask PINVOU or enter a command', disclaimer: 'PINVOU may display inaccurate info, so double-check.',
        searchPlaceholder: 'Search chats'
      }
    };

    /* ==========================================
       TauriBridge hook
       ========================================== */
    const bridge = window.TauriBridge || { available: false };

    function useBridge() {
      const [bs, setBs] = useState(() => bridge.available ? bridge.getState() : null);
      useEffect(() => {
        if (!bridge.available) return;
        return bridge.subscribe(setBs);
      }, []);
      return bs;
    }

    /* ==========================================
       App — 1:1 matching 前端.html structure
       ========================================== */
    const App = () => {
      const bs = useBridge();
      const [activeChat, setActiveChat] = useState(null);
      const [currentView, setCurrentView] = useState('chat');
      const [activeTheme, setActiveTheme] = useState('dark');
      const [language, setLanguage] = useState('zh');
      const [superPerm, setSuperPerm] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [chatPrefill, setChatPrefill] = useState('');

      const t = dict[language];

      function handleActivateSkill(name) {
        if (bridge.available) bridge.activateSkill(name);
        setChatPrefill('我要用 ' + name + ' 完成: ');
        setCurrentView('chat');
      }

      // Sync from bridge state
      useEffect(() => {
        if (!bs) return;
        if (bs.activeSessionId && bs.activeSessionId !== activeChat) {
          setActiveChat(bs.activeSessionId);
          if (currentView !== 'monitor' && currentView !== 'settings' && currentView !== 'search') {
            setCurrentView('chat');
          }
        }
        if (bs.superPermEnabled !== superPerm) setSuperPerm(bs.superPermEnabled);
      }, [bs]);

      // Build chat history from sessions
      const skillBindings = (bs && bs.workflow && bs.workflow.bindings) || {};
      const chatHistory = bs && bs.sessions ? bs.sessions.map(s => ({
        id: s.id,
        title: s.title || '新对话',
        date: formatSessionDate(s.updated_at || s.created_at),
        skill: skillBindings[s.id] || null,
      })) : [];

      function handleNewChat() {
        if (bridge.available) bridge.createNewSession();
        setCurrentView('chat');
      }

      function handleSwitchSession(id) {
        if (bridge.available) bridge.switchToSession(id);
        setActiveChat(id);
        setCurrentView('chat');
      }

      function handleDeleteSession(id) {
        if (bridge.available) bridge.deleteSession(id);
      }

      function handleToggleSuperPerm() {
        if (bridge.available) bridge.toggleSuperPerm();
        else setSuperPerm(!superPerm);
      }

      function handleSetTheme(th) {
        setActiveTheme(th);
        if (bridge.available) {
          bridge.saveSettings({ theme: th === 'dark' ? 'genesis' : 'light', language: language === 'zh' ? 'zh-Hans' : 'en' });
        }
      }

      function handleSetLanguage(lang) {
        setLanguage(lang);
        if (bridge.available) {
          bridge.saveSettings({ theme: activeTheme === 'dark' ? 'genesis' : 'light', language: lang === 'zh' ? 'zh-Hans' : 'en' });
        }
      }

      return (
        <div className={`flex h-screen font-sans overflow-hidden antialiased transition-colors duration-300 ${activeTheme === 'dark' ? 'bg-[#131314] text-[#E3E3E3]' : 'bg-white text-[#1F1F1F]'}`}>

          {/* ================= Sidebar (Gemini Style) ================= */}
          <div className={`${isSidebarOpen ? 'w-[280px] bg-[#1E1F20]' : 'w-[68px] bg-[#131314]'} shrink-0 flex flex-col z-40 transition-all duration-300 ${activeTheme === 'light' ? 'bg-[#F0F4F9]' : ''}`}>

            {/* Header / Logo */}
            <div className={`px-4 py-4 flex items-center ${isSidebarOpen ? 'gap-3' : 'justify-center'} overflow-hidden`}>
              <button
                onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                title={isSidebarOpen ? "收起侧边栏" : "展开侧边栏"}
                className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${activeTheme === 'dark' ? 'hover:bg-[#333537]' : 'hover:bg-[#E1E5EA]'}`}
              >
                <Menu size={20} className={activeTheme === 'dark' ? 'text-[#E3E3E3]' : 'text-[#444746]'} />
              </button>
              <span className={`text-[18px] font-medium tracking-wide flex items-center gap-2 whitespace-nowrap transition-opacity duration-200 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 w-0'}`}>
                <Sparkles size={20} className={activeTheme === 'dark' ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'} />
                PINVOU
              </span>
            </div>

            {/* Navigation / Recents */}
            <div className={`flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-1 mt-2 ${isSidebarOpen ? 'px-3' : 'px-2 items-center'}`}>

              <NavItem
                icon={<Edit2 size={18} />} label={t.newChat}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={handleNewChat}
              />
              <NavItem
                icon={<Search size={18} />} label={t.searchChats}
                active={currentView === 'search'}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={() => setCurrentView('search')}
              />

              <div className={`mb-2 flex flex-col gap-1 ${!isSidebarOpen ? 'w-full items-center' : ''}`}>
                <NavItem
                  icon={<BarChart2 size={18} />} label={t.monitor}
                  active={currentView === 'monitor'}
                  theme={activeTheme}
                  isSidebarOpen={isSidebarOpen}
                  onClick={() => setCurrentView('monitor')}
                />
                <NavItem
                  icon={<ClipboardList size={18} />} label={t.workflow}
                  active={currentView === 'workflow'}
                  theme={activeTheme}
                  isSidebarOpen={isSidebarOpen}
                  onClick={() => setCurrentView('workflow')}
                />
              </div>

              {isSidebarOpen && (
                <>
                  <div className="text-[13px] font-medium px-4 py-2 mt-2 mb-1 whitespace-nowrap" style={{ color: activeTheme === 'dark' ? '#C4C7C5' : '#444746' }}>
                    {t.recent}
                  </div>

                  <div className="space-y-[2px]">
                    {chatHistory.map((chat) => (
                      <div
                        key={chat.id}
                        onClick={() => handleSwitchSession(chat.id)}
                        className={`group flex items-center justify-between px-4 py-2.5 rounded-full cursor-pointer text-[14px] transition-all
                          ${(activeChat === chat.id && currentView === 'chat')
                            ? (activeTheme === 'dark' ? 'bg-[#333537] text-white' : 'bg-[#E1E5EA] text-[#1F1F1F]')
                            : (activeTheme === 'dark' ? 'text-[#E3E3E3] hover:bg-[#282A2C]' : 'text-[#444746] hover:bg-[#E1E5EA]')
                          }`}
                      >
                        <span className="truncate pr-2 leading-relaxed whitespace-nowrap flex-1">{chat.title}</span>
                        {chat.skill && <span className="text-[11px] shrink-0 opacity-70" title={chat.skill}>🧭</span>}
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>

            {/* Footer Profile */}
            <div className={`p-3 flex ${isSidebarOpen ? 'flex-row items-center justify-between' : 'flex-col items-center gap-3 pb-6'}`}>
              {!isSidebarOpen && (
                <button
                  onClick={() => setCurrentView('settings')}
                  title={t.settings}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${activeTheme === 'dark' ? 'text-[#E3E3E3] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#E1E5EA]'}`}
                >
                  <Settings size={18} />
                </button>
              )}
              <div className={`flex items-center ${isSidebarOpen ? 'px-2 gap-3' : 'justify-center'}`}>
                <div title={t.localEnv} className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-[12px] font-bold ${activeTheme === 'dark' ? 'bg-[#9580FF] text-white' : 'bg-[#7C3AED] text-white'}`}>
                  GB
                </div>
                {isSidebarOpen && (
                  <div className="flex flex-col whitespace-nowrap overflow-hidden">
                    <span className="text-[14px] font-medium leading-none mb-1">{t.localEnv}</span>
                    <span className={`text-[12px] ${activeTheme === 'dark' ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>GB10 Node</span>
                  </div>
                )}
              </div>
              {isSidebarOpen && (
                <button
                  onClick={() => setCurrentView('settings')}
                  title={t.settings}
                  className={`w-9 h-9 shrink-0 rounded-full flex items-center justify-center transition-colors ${activeTheme === 'dark' ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#E1E5EA]'}`}
                >
                  <Settings size={18} />
                </button>
              )}
            </div>
          </div>

          {/* ================= Main Content ================= */}
          <div className="flex-1 flex flex-col relative min-w-0 overflow-hidden">

            {/* Gemini Style Background Glow */}
            {currentView === 'chat' && (
              activeTheme === 'light' ? (
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[1200px] h-[800px] bg-[radial-gradient(ellipse_at_center,_rgba(232,240,254,0.8)_0%,_transparent_60%)] pointer-events-none z-0"></div>
              ) : (
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[40%] w-[1400px] h-[900px] bg-[radial-gradient(ellipse_at_center,_rgba(168,199,250,0.25)_0%,_transparent_60%)] pointer-events-none z-0"></div>
              )
            )}

            {currentView === 'monitor' && <MonitorView theme={activeTheme} t={t} bs={bs} />}
            {currentView === 'settings' && (
              <SettingsView
                activeTheme={activeTheme} setActiveTheme={handleSetTheme}
                language={language} setLanguage={handleSetLanguage}
                superPerm={superPerm} setSuperPerm={handleToggleSuperPerm}
                t={t}
              />
            )}
            {currentView === 'workflow' && <WorkflowView theme={activeTheme} t={t} bs={bs} onActivate={handleActivateSkill} />}
            {currentView === 'chat' && <ChatView theme={activeTheme} t={t} bs={bs} prefill={chatPrefill} onPrefillConsumed={() => setChatPrefill('')} />}
            {currentView === 'search' && <SearchView theme={activeTheme} history={chatHistory} t={t} onSelect={handleSwitchSession} />}

          </div>
        </div>
      );
    };

    /* ==========================================
       Helpers
       ========================================== */
    function formatSessionDate(ts) {
      if (!ts) return '';
      const d = new Date(typeof ts === 'number' ? ts : ts);
      const now = new Date();
      const diff = now - d;
      if (diff < 86400000 && d.getDate() === now.getDate()) return 'Today';
      if (diff < 172800000) return 'Yesterday';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // ==========================================
    // Search View (Gemini Style)
    // ==========================================
    const SearchView = ({ theme, history, t, onSelect }) => {
      const isDark = theme === 'dark';
      const [query, setQuery] = useState('');
      const filtered = query
        ? history.filter(h => h.title.toLowerCase().includes(query.toLowerCase()))
        : history;

      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">
          <div className="flex-1 overflow-y-auto custom-scrollbar px-6 pt-16 pb-20">
            <div className="max-w-[768px] mx-auto flex flex-col">

              {/* Centered Search Bar */}
              <div className={`flex items-center gap-3 px-6 py-4 rounded-full mb-10 transition-colors ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3]' : 'bg-[#F0F4F9] text-[#1F1F1F]'}`}>
                <Search size={22} className={isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'} />
                <input
                  type="text"
                  placeholder={t.searchPlaceholder}
                  value={query}
                  onChange={e => setQuery(e.target.value)}
                  className={`flex-1 bg-transparent border-none outline-none text-[16px] placeholder:text-[16px] ${isDark ? 'placeholder:text-[#C4C7C5]' : 'placeholder:text-[#444746]'}`}
                />
              </div>

              {/* List Section */}
              <div className={`text-[14px] font-medium mb-3 px-4 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>
                {t.recent}
              </div>

              <div className="flex flex-col">
                {filtered.map(chat => (
                  <div
                    key={chat.id}
                    onClick={() => onSelect && onSelect(chat.id)}
                    className={`flex justify-between items-center px-4 py-[14px] cursor-pointer rounded-[16px] transition-colors ${isDark ? 'hover:bg-[#1E1F20]' : 'hover:bg-[#F0F4F9]'}`}
                  >
                    <span className={`text-[15px] truncate pr-4 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                      {chat.title}
                    </span>
                    <span className={`text-[13px] shrink-0 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>
                      {chat.date}
                    </span>
                  </div>
                ))}
              </div>

            </div>
          </div>
        </div>
      );
    };


    // ==========================================
    // Monitor View (Material 3 Style)
    // ==========================================
    const MonitorView = ({ theme, t, bs }) => {
      const isDark = theme === 'dark';
      const fmt = bs && bs.monitor && bs.monitor._fmt;

      // Start/stop polling when view mounts/unmounts
      useEffect(() => {
        if (bridge.available) bridge.startMonitorPolling();
        return () => { if (bridge.available) bridge.stopMonitorPolling(); };
      }, []);

      const updatedAt = fmt ? fmt.updatedAt : '—';
      const gpuName = fmt ? fmt.gpuName : t.gpuUnavail;
      const gpuHasVram = fmt ? fmt.gpuHasVram : false;
      const gpuVram = fmt ? fmt.gpuVram : '—';
      const gpuVramPct = fmt ? fmt.gpuVramPct : 0;
      const gpuUtil = fmt ? fmt.gpuUtil : '—';
      const gpuUtilPct = fmt ? fmt.gpuUtilPct : 0;
      const ramUsedGiB = fmt ? fmt.ramUsedGiB : '—';
      const ramPct = fmt ? fmt.ramPct : 0;
      const ramTotal = fmt ? fmt.ramTotal : '—';
      const swapPct = fmt ? fmt.swapPct : 0;
      const swapTotal = fmt ? fmt.swapTotal : '—';
      const vllmModel = fmt ? fmt.vllmModel : '—';
      const vllmStatus = fmt ? fmt.vllmStatus : 'OFFLINE';
      const vllmOnline = fmt ? fmt.vllmOnline : false;
      const vllmUpstream = fmt ? fmt.vllmUpstream : '—';
      const vllmMaxLen = fmt ? fmt.vllmMaxLen : '—';
      const vllmQueue = fmt ? fmt.vllmQueue : '— / —';
      const vllmKv = fmt ? fmt.vllmKv : '—';
      const appVersion = fmt ? fmt.appVersion : '—';
      const dtVersion = fmt ? fmt.dtVersion : '—';
      const uptime = fmt ? fmt.uptime : '—';

      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">

          <div className="px-16 pt-12 pb-6 flex items-end justify-between">
            <div>
              <h1 className="text-[32px] font-normal tracking-tight mb-2">{t.sysStatus}</h1>
              <p className={`text-[15px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.sysDesc}</p>
            </div>
            <div className={`flex items-center gap-3 px-5 py-2.5 rounded-full ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
              <div className={`w-2 h-2 rounded-full ${vllmOnline ? 'bg-[#188038] animate-pulse' : 'bg-[#EA4335]'}`}></div>
              <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{updatedAt}</span>
              <div className="w-[1px] h-4 bg-gray-400/30 mx-2"></div>
              <button
                onClick={() => { if (bridge.available) bridge.startMonitorPolling(); }}
                className={`hover:rotate-180 transition-transform duration-500 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}
              >
                <RefreshCw size={16} />
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto px-16 py-8 custom-scrollbar">
            <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 max-w-[1200px]">

              <WidgetCard title={t.gpu} theme={theme}>
                <div className="mb-10">
                  <h3 className="text-[28px] font-medium">{gpuHasVram ? gpuName : t.gpuUnavail}</h3>
                  <p className={`text-[14px] mt-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{gpuHasVram ? '' : t.noSmi}</p>
                </div>
                <div className="space-y-6 mt-auto">
                  <ProgressBar label={t.vram} value={gpuHasVram ? gpuVram : '—'} percentage={gpuVramPct} theme={theme} />
                  <ProgressBar label={t.core} value={gpuHasVram ? gpuUtil : '—'} percentage={gpuUtilPct} theme={theme} />
                </div>
              </WidgetCard>

              <WidgetCard title={t.ram} theme={theme}>
                 <div className="mb-10 flex items-baseline gap-2">
                  <h3 className="text-[48px] font-normal leading-none tracking-tight">{ramUsedGiB}</h3>
                  <span className={`text-[16px] font-medium ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>GB {t.used}</span>
                </div>
                <div className="space-y-6 mt-auto">
                  <ProgressBar label={t.physical} value={ramPct + '%'} subValue={ramTotal + ' ' + t.total} percentage={ramPct} theme={theme} color="#0B57D0" />
                  <ProgressBar label={t.swap} value={swapPct + '%'} subValue={swapTotal} percentage={swapPct} theme={theme} color="#188038" />
                </div>
              </WidgetCard>

              <WidgetCard title={t.vllm} theme={theme}>
                 <div className="flex items-start justify-between mb-8">
                  <div>
                    <h3 className="text-[22px] font-medium mb-1">{vllmModel}</h3>
                    <p className={`text-[13px] font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{vllmUpstream}</p>
                  </div>
                  <div className={`px-3 py-1 rounded-full flex items-center gap-2 ${vllmOnline ? (isDark ? 'bg-[#0F5223] text-[#93D5A6]' : 'bg-[#E6F4EA] text-[#137333]') : (isDark ? 'bg-[#5C2020] text-[#F28B82]' : 'bg-[#FCE8E6] text-[#C5221F]')}`}>
                    <CheckCircle2 size={12} />
                    <span className="text-[11px] font-bold tracking-wider">{vllmStatus}</span>
                  </div>
                </div>
                <div className={`rounded-[16px] p-2 mt-auto ${isDark ? 'bg-[#131314]' : 'bg-[#F8F9FA]'}`}>
                  <ListRow label={t.ctx} value={String(vllmMaxLen)} theme={theme} />
                  <ListRow label={t.queue} value={vllmQueue} theme={theme} />
                  <ListRow label={t.kv} value={vllmKv} border={false} theme={theme} />
                </div>
              </WidgetCard>

              <WidgetCard title={t.app} theme={theme}>
                <div className="mb-8">
                  <h3 className="text-[22px] font-medium mb-1">pinvou3-app</h3>
                  <p className={`text-[14px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.appRunning}</p>
                </div>
                <div className={`rounded-[16px] p-2 mt-auto ${isDark ? 'bg-[#131314]' : 'bg-[#F8F9FA]'}`}>
                  <ListRow label={t.curVer} value={appVersion} theme={theme} />
                  <ListRow label={t.uiVer} value={dtVersion} theme={theme} />
                  <ListRow label={t.uptime} value={uptime} border={false} theme={theme} />
                </div>
              </WidgetCard>

            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // Settings View (Material 3 Style)
    // ==========================================
    const SettingsView = ({ activeTheme, setActiveTheme, language, setLanguage, superPerm, setSuperPerm, t }) => {
      const isDark = activeTheme === 'dark';
      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">

          <div className="px-16 pt-12 pb-6">
            <h1 className="text-[32px] font-normal tracking-tight mb-2">{t.settings}</h1>
          </div>

          <div className="flex-1 overflow-y-auto px-16 pt-4 pb-20 custom-scrollbar">
            <div className="max-w-[800px] space-y-8">

              <div className={`rounded-[24px] p-6 ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
                <h2 className="text-[18px] font-medium mb-6">{t.appearance}</h2>

                <div className="space-y-8">
                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-[16px] block mb-1">{t.lang}</span>
                      <span className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.langDesc}</span>
                    </div>
                    <div className={`p-1 rounded-full flex ${isDark ? 'bg-[#131314]' : 'bg-[#E1E5EA]'}`}>
                      <button onClick={() => setLanguage('zh')} className={`px-6 py-2 rounded-full text-[14px] font-medium transition-colors ${language === 'zh' ? (isDark ? 'bg-[#A8C7FA] text-[#041E49]' : 'bg-white text-[#0B57D0] shadow-sm') : ''}`}>中文</button>
                      <button onClick={() => setLanguage('en')} className={`px-6 py-2 rounded-full text-[14px] font-medium transition-colors ${language === 'en' ? (isDark ? 'bg-[#A8C7FA] text-[#041E49]' : 'bg-white text-[#0B57D0] shadow-sm') : ''}`}>English</button>
                    </div>
                  </div>

                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-[16px] block mb-1">{t.theme}</span>
                      <span className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.themeDesc}</span>
                    </div>
                    <div className={`p-1 rounded-full flex ${isDark ? 'bg-[#131314]' : 'bg-[#E1E5EA]'}`}>
                      <button onClick={() => setActiveTheme('light')} className={`px-6 py-2 rounded-full text-[14px] font-medium transition-colors ${activeTheme === 'light' ? 'bg-white text-[#0B57D0] shadow-sm' : ''}`}>{t.light}</button>
                      <button onClick={() => setActiveTheme('dark')} className={`px-6 py-2 rounded-full text-[14px] font-medium transition-colors ${activeTheme === 'dark' ? 'bg-[#A8C7FA] text-[#041E49]' : ''}`}>{t.dark}</button>
                    </div>
                  </div>
                </div>
              </div>

              <div className={`rounded-[24px] p-6 ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
                <h2 className="text-[18px] font-medium mb-6">{t.sysPerm}</h2>

                <div className="flex items-center justify-between">
                  <div className="pr-8">
                    <span className="text-[16px] block mb-1">{t.sudo}</span>
                    <span className={`text-[14px] leading-relaxed block ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>
                      {t.sudoDesc}
                    </span>
                  </div>

                  <button
                    onClick={setSuperPerm}
                    className={`w-[52px] h-[32px] rounded-full p-[2px] transition-colors duration-300 relative ${superPerm ? (isDark ? 'bg-[#A8C7FA]' : 'bg-[#0B57D0]') : (isDark ? 'bg-[#444746]' : 'bg-[#747775]')}`}
                  >
                    <div className={`w-[28px] h-[28px] rounded-full shadow-sm transform transition-transform duration-300 ${isDark ? 'bg-[#041E49]' : 'bg-white'} ${superPerm ? 'translate-x-[20px]' : 'translate-x-0'}`} />
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // Chat View (Gemini Centered Style + Messages)
    // ==========================================
    const ChatView = ({ theme, t, bs, prefill, onPrefillConsumed }) => {
      const isDark = theme === 'dark';
      const [inputText, setInputText] = useState('');
      const [artifactsOpen, setArtifactsOpen] = useState(false);
      const chatEndRef = useRef(null);
      const chatItems = bs ? bs.chatItems : [];
      const busy = bs ? bs.busy : false;
      const hasMessages = chatItems.length > 0;
      const attachments = (bs && bs.attachments) || [];
      const artifactCount = (bs && bs.artifacts) ? bs.artifacts.length : 0;

      // 工作流启用时预填输入框
      useEffect(() => {
        if (prefill) { setInputText(prefill); if (onPrefillConsumed) onPrefillConsumed(); }
      }, [prefill]);

      // Auto-scroll on new messages
      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatItems.length, chatItems[chatItems.length - 1]?.html]);

      function handleSend() {
        if (busy) return;
        const hasReady = attachments.some(a => a.status === 'ready');
        if (!inputText.trim() && !hasReady) return;
        if (bridge.available) bridge.sendMessage(inputText.trim());
        setInputText('');
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      }

      function handleCancel() {
        if (bridge.available) bridge.cancelGeneration();
      }

      function handlePaste(e) {
        const items = (e.clipboardData && e.clipboardData.items) || [];
        for (const it of items) {
          if (it.type && it.type.indexOf('image/') === 0) {
            const file = it.getAsFile();
            if (!file) continue;
            e.preventDefault();
            const reader = new FileReader();
            reader.onload = () => {
              const bytes = Array.from(new Uint8Array(reader.result));
              const ext = (file.type.split('/')[1] || 'png');
              if (bridge.available) bridge.addPasteImage(`paste-${Date.now()}.${ext}`, bytes);
            };
            reader.readAsArrayBuffer(file);
          }
        }
      }

      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">
          {artifactsOpen && <ArtifactsPanel bs={bs} theme={theme} t={t} onClose={() => setArtifactsOpen(false)} />}

          {/* Top Header */}
          <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-20 pointer-events-none">
            <ModeHeader bs={bs} theme={theme} />
            <button
              onClick={() => setArtifactsOpen(true)}
              className={`pointer-events-auto px-4 py-2 rounded-full text-[14px] font-medium flex items-center gap-2 ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3] hover:bg-[#333537]' : 'bg-white text-[#1F1F1F] hover:bg-[#F0F4F9] shadow-sm'}`}>
              <Package size={16} /> {t.artifacts}
              {artifactCount > 0 && <span className={`text-[11px] px-1.5 rounded-full ${isDark ? 'bg-[#A8C7FA] text-[#062E6F]' : 'bg-[#0B57D0] text-white'}`}>{artifactCount}</span>}
            </button>
          </div>

          {/* Main Chat Area */}
          <div className={`flex-1 overflow-y-auto px-4 md:px-20 lg:px-40 pt-20 pb-40 custom-scrollbar flex flex-col ${hasMessages ? 'justify-start' : 'items-center justify-center'}`}>

            <div className="sticky top-0 z-10 max-w-[800px] w-full mx-auto"><PhaseChips bs={bs} theme={theme} /></div>

            {!hasMessages && (
              /* Gemini Style Centered Empty State */
              <div className="text-center mb-12 animate-in slide-in-from-bottom-4 duration-500">
                <h1 className={`text-[44px] font-normal mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                  {t.chatGreeting}
                </h1>
              </div>
            )}

            {hasMessages && (
              <div className="max-w-[800px] w-full mx-auto space-y-4">
                {chatItems.map((item) => (
                  <ChatBubble key={item.id} item={item} theme={theme} onPrefill={(txt) => setInputText(txt)} />
                ))}
                <div ref={chatEndRef} />
              </div>
            )}

          </div>

          {/* Floating Input Area */}
          <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-full max-w-[800px] px-4 z-20">
            {/* 附件 chips */}
            {attachments.length > 0 && (
              <div className="flex flex-wrap gap-2 mb-2 px-2">
                {attachments.map((a) => (
                  <div key={a.id} className={`flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full text-[12px] ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3]' : 'bg-white text-[#1F1F1F] shadow-sm'}`}>
                    <span>📎</span>
                    <span className="max-w-[160px] truncate">{a.basename}</span>
                    <span className={a.status === 'error' ? 'text-[#F28B82]' : a.status === 'parsing' ? 'opacity-60' : 'text-[#93D5A6]'}>
                      {a.status === 'parsing' ? '解析中…' : a.status === 'error' ? '失败' : '✓'}
                    </span>
                    <button onClick={() => bridge.removeAttachment(a.id)} className={`w-5 h-5 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537]' : 'hover:bg-[#F0F4F9]'}`}>×</button>
                  </div>
                ))}
              </div>
            )}
            <div className={`flex items-center gap-3 p-2 rounded-full shadow-lg ${isDark ? 'bg-[#1E1F20]' : 'bg-white'}`}>

              <button onClick={() => bridge.available && bridge.pickAndAttach()} title="添加附件"
                className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}>
                <Paperclip size={20} />
              </button>

              <input
                type="text"
                placeholder={t.placeholder}
                value={inputText}
                onChange={e => setInputText(e.target.value)}
                onKeyDown={handleKeyDown}
                onPaste={handlePaste}
                className={`flex-1 bg-transparent border-none outline-none text-[16px] py-3 ${isDark ? 'placeholder:text-[#C4C7C5]' : 'placeholder:text-gray-400'}`}
              />

              {busy ? (
                <button
                  onClick={handleCancel}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#F28B82] hover:bg-[#333537]' : 'text-[#C5221F] hover:bg-[#F0F4F9]'}`}
                >
                  <StopCircle size={20} />
                </button>
              ) : (
                <button
                  onClick={handleSend}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}
                >
                  {(inputText.trim() || attachments.some(a => a.status === 'ready')) ? <Send size={18} /> : <Mic size={20} />}
                </button>
              )}
            </div>
            <div className="flex items-center justify-center gap-3 mt-3">
               <p className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.disclaimer}</p>
               <button onClick={() => bridge.available && bridge.compactNow()} title="手动压缩上下文"
                 className={`text-[12px] flex items-center gap-1 ${isDark ? 'text-[#8E8E8E] hover:text-[#C4C7C5]' : 'text-[#757575] hover:text-[#444746]'}`}>🗜 压缩</button>
            </div>
          </div>

        </div>
      );
    };

    // ==========================================
    // Chat Bubble (message rendering)
    // ==========================================
    const ChatBubble = ({ item, theme, onPrefill }) => {
      const isDark = theme === 'dark';

      if (item.type === 'plan_card') return <PlanCard item={item} theme={theme} onPrefill={onPrefill} />;
      if (item.type === 'plan_stuck' || item.type === 'execution_stuck') return <PlanStuckCard item={item} theme={theme} />;
      if (item.type === 'plan_text_fallback') return <PlanFallbackCard item={item} theme={theme} />;
      if (item.type === 'careful_blocked') return <CarefulBlockedCard item={item} theme={theme} />;
      if (item.type === 'user_input') return <UserInputCard item={item} theme={theme} />;

      if (item.type === 'user') {
        return (
          <div className="flex justify-end">
            <div className={`max-w-[85%] px-5 py-3 rounded-[20px] text-[15px] leading-relaxed ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`}>
              {item.text}
            </div>
          </div>
        );
      }

      if (item.type === 'assistant') {
        return (
          <div className="flex justify-start">
            <div className={`max-w-[95%] ${isDark ? 'dark-code' : 'light-code'}`}>
              <div
                className={`msg-md text-[15px] leading-relaxed ${item.streaming ? 'streaming-cursor' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}
                dangerouslySetInnerHTML={{ __html: item.html || '' }}
              />
              {item.time && !item.streaming && (
                <div className={`text-[11px] mt-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{item.time}</div>
              )}
            </div>
          </div>
        );
      }

      if (item.type === 'tool') {
        return <ToolCard item={item} theme={theme} />;
      }

      if (item.type === 'system') {
        return (
          <div className="flex justify-center">
            <div className={`text-[13px] px-4 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#8E8E8E]' : 'bg-[#F0F4F9] text-[#757575]'}`}>
              {item.text}
            </div>
          </div>
        );
      }

      return null;
    };

    // ==========================================
    // Tool Card
    // ==========================================
    const ToolCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const [expanded, setExpanded] = useState(false);
      const isRunning = item.state === 'running';
      const isDone = item.state === 'done';
      const isFailed = item.state === 'failed';

      const statusColor = isRunning
        ? (isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]')
        : isDone
          ? (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')
          : (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]');

      const statusText = isRunning ? '运行中...' : isDone ? '完成' : '失败';

      return (
        <div className={`rounded-[16px] overflow-hidden border ${isDark ? 'bg-[#1E1F20] border-white/5' : 'bg-[#F0F4F9] border-black/5'}`}>
          <div
            className={`flex items-center gap-3 px-4 py-3 cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
            onClick={() => setExpanded(!expanded)}
          >
            <Wrench size={14} className={statusColor} />
            <span className={`text-[13px] font-medium flex-1 truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
              {item.name}
            </span>
            <span className={`text-[12px] ${statusColor}`}>{statusText}</span>
            <ChevronDown size={14} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`} />
          </div>
          {expanded && (
            <div className={`px-4 pb-3 border-t ${isDark ? 'border-white/5' : 'border-black/5'}`}>
              {item.args && (
                <div className="mt-2">
                  <div className={`text-[11px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>输入</div>
                  <pre className={`tool-card-output custom-scrollbar rounded-lg p-2 ${isDark ? 'bg-[#131314] text-[#C4C7C5]' : 'bg-white text-[#444746]'}`}>
                    {typeof item.args === 'string' ? item.args : JSON.stringify(item.args, null, 2)}
                  </pre>
                </div>
              )}
              {item.output != null && (
                <div className="mt-2">
                  <div className={`text-[11px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>输出</div>
                  <pre className={`tool-card-output custom-scrollbar rounded-lg p-2 ${isDark ? 'bg-[#131314] text-[#C4C7C5]' : 'bg-white text-[#444746]'}`}>
                    {typeof item.output === 'string' ? item.output : JSON.stringify(item.output, null, 2)}
                  </pre>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // Plan / 待办 步骤渲染
    // ==========================================
    const STEP_SYM = { completed: '●', in_progress: '◎', pending: '○' };
    const PlanLayer = ({ label, explanation, items, field, isDark }) => {
      if (!items || items.length === 0) return null;
      return (
        <section className="mb-2">
          <div className={`text-[12px] font-semibold mb-1 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{label}</div>
          {explanation && <p className={`text-[13px] mb-1.5 leading-relaxed ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{explanation}</p>}
          <ol className="space-y-1">
            {items.map((it, i) => (
              <li key={i} className={`text-[13px] flex gap-2 leading-relaxed ${it.status === 'completed' ? 'opacity-60' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                <span className={it.status === 'in_progress' ? (isDark ? 'text-[#FDD663]' : 'text-[#E37400]') : ''}>{STEP_SYM[it.status] || '○'}</span>
                <span>{it[field] || ''}</span>
              </li>
            ))}
          </ol>
        </section>
      );
    };

    const cardBoxCls = (isDark, accent) =>
      `rounded-[16px] border p-4 my-1 ${isDark ? 'bg-[#1E1F20] border-white/10' : 'bg-[#F0F4F9] border-black/5'} ${accent || ''}`;
    const cardBtnCls = (isDark, variant) => {
      const base = 'px-3 py-1.5 rounded-full text-[13px] font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
      if (variant === 'primary') return `${base} ${isDark ? 'bg-[#A8C7FA] text-[#062E6F] hover:bg-[#C2DBFF]' : 'bg-[#0B57D0] text-white hover:bg-[#0A4BB8]'}`;
      return `${base} ${isDark ? 'bg-[#333537] text-[#E3E3E3] hover:bg-[#444746]' : 'bg-white text-[#1F1F1F] hover:bg-[#E1E5EA] border border-black/10'}`;
    };

    // ==========================================
    // PlanCard — ✨ 方案准备好
    // ==========================================
    const PlanCard = ({ item, theme, onPrefill }) => {
      const isDark = theme === 'dark';
      const active = item.cardState === 'active' && !item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className={`text-[14px] font-semibold mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>✨ 方案准备好</div>
          {(!item.plan && !item.todos)
            ? <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>（plan 为空）</div>
            : <>
                <PlanLayer label="📋 方案" explanation={item.plan && item.plan.explanation} items={item.plan && item.plan.items} field="step" isDark={isDark} />
                <PlanLayer label="✅ 细分待办" items={item.todos && item.todos.items} field="content" isDark={isDark} />
              </>}
          <div className={`h-px my-3 ${isDark ? 'bg-white/10' : 'bg-black/10'}`}></div>
          {active ? (
            <div className="flex items-center gap-2 flex-wrap">
              <span className={`text-[13px] mr-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>下一步：</span>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.acceptPlan(item.id, item.planMarkdown)}>✅ 就这么干</button>
              <button className={cardBtnCls(isDark)} onClick={() => onPrefill && onPrefill('修订方案:')}>✏️ 改改</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.discardPlan(item.id)}>🚪 算了</button>
            </div>
          ) : (
            <div className={`text-[13px] font-medium ${isDark ? 'text-[#93D5A6]' : 'text-[#137333]'}`}>{item.statusLabel}</div>
          )}
        </div>
      );
    };

    // ==========================================
    // PlanStuckCard — Plan 死锁 / 执行卡住 兜底
    // ==========================================
    const PlanStuckCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const isExec = item.type === 'execution_stuck';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#FDD663]/30' : 'border-[#E37400]/20')}>
          <div className={`text-[13px] leading-relaxed mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
            {isExec
              ? <>🛑 AI 执行卡住了 (已自动尝试 {item.tries} 次仍未真正产出文件)。你可以:</>
              : <>⚠️ AI 在 Plan 模式调用了 <code className="px-1 rounded bg-black/20">{item.toolName || '(unknown)'}</code> 但被白名单挡掉。Plan 模式只能讨论方案,不能动手。给你两个出路:</>}
          </div>
          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || '已处理'}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark)} onClick={() => isExec ? bridge.executionStuckReplan(item.id) : bridge.planStuckReplan(item.id)}>📋 让 AI 重出方案</button>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => isExec ? bridge.discardPlan(item.id) : bridge.planStuckGo(item.id)}>⚡ {isExec ? '我自己来' : '直接动手(跳过方案)'}</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // PlanFallbackCard — AI 给了方案但没用 plan 工具
    // ==========================================
    const PlanFallbackCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#FDD663]/30' : 'border-[#E37400]/20')}>
          <div className={`text-[14px] font-semibold mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>📝 AI 给了方案但没用 plan 工具</div>
          <div className={`text-[13px] leading-relaxed mb-3 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>AI 在文本里描述了方案,但没调 update_plan 工具,所以没出方案卡片。你想怎么处理?</div>
          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || '已处理'}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.planFallbackAccept(item.id, item.text)}>✅ 直接采纳这段</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.planFallbackRetry(item.id)}>📋 让 AI 用工具重出</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.discardPlan(item.id)}>🚪 算了</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // CarefulBlockedCard — 🛑 破坏性命令拦截
    // ==========================================
    const CarefulBlockedCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const md = item.metadata || {};
      const cmd = (item.args && (item.args.command || item.args.cmd)) || '(命令未知)';
      const reasons = (md.reasons && md.reasons.length) ? md.reasons : ['命中破坏性 pattern'];
      const suggestions = md.suggestions || [];
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#F28B82]/40' : 'border-[#C5221F]/30')}>
          <div className={`text-[14px] font-semibold mb-2 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>🛑 Careful Hook 拦截了一条破坏性命令</div>
          <pre className={`text-[12px] font-mono rounded-lg p-2 mb-2 overflow-x-auto ${isDark ? 'bg-[#131314] text-[#F28B82]' : 'bg-white text-[#C5221F]'}`}>{cmd}</pre>
          <div className="mb-2">
            <div className={`text-[12px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>为什么拦?</div>
            <ul className={`list-disc pl-5 text-[13px] space-y-0.5 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{reasons.map((r, i) => <li key={i}>{r}</li>)}</ul>
          </div>
          {suggestions.length > 0 && (
            <div className="mb-2">
              <div className={`text-[12px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>建议</div>
              <ul className={`list-disc pl-5 text-[13px] space-y-0.5 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{suggestions.map((s, i) => <li key={i}>{s}</li>)}</ul>
            </div>
          )}
          <div className={`text-[12px] leading-relaxed ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>这个 hook 在所有模式默认开启,与 Plan/YOLO/品悟开关无关。如果你确认要跑,自己在终端执行 —— LLM 不会被允许跑破坏性命令。</div>
        </div>
      );
    };

    // ==========================================
    // UserInputCard — 🤔 AI 想问你几个问题
    // ==========================================
    const UserInputCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const questions = item.questions || [];
      const [answers, setAnswers] = useState(() => questions.map(() => null));
      const [otherOpen, setOtherOpen] = useState(() => questions.map(() => false));
      const [otherText, setOtherText] = useState(() => questions.map(() => ''));
      const locked = item.resolved || item.submitting;

      function pick(qi, opt) {
        if (locked) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: opt.label, value: opt.label };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function toggleOther(qi) {
        if (locked) return;
        const oo = otherOpen.slice(); oo[qi] = !oo[qi]; setOtherOpen(oo);
        if (oo[qi]) { const next = answers.slice(); next[qi] = null; setAnswers(next); }
      }
      function submitOther(qi) {
        const val = (otherText[qi] || '').trim();
        if (!val) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: '其他', value: val };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function commit(next) {
        setAnswers(next);
        if (next.every(a => a != null)) {
          bridge.submitUserInput(item.id, item.toolCallId, next, questions);
        }
      }

      const statusText = item.cardState === 'submitted' ? '✓ 已提交'
        : item.cardState === 'cancelled' ? '✕ 已取消'
        : item.submitting ? '提交中…' : item.error ? ('⚠️ 提交失败: ' + item.error) : '';

      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className={`text-[14px] font-semibold mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>🤔 AI 想问你几个问题</div>
          <div className="space-y-4">
            {questions.map((q, qi) => (
              <div key={qi}>
                <div className={`text-[12px] font-semibold ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{q.header || ('Q' + (qi + 1))}</div>
                <div className={`text-[13px] mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{q.question || ''}</div>
                <div className="flex flex-col gap-1.5">
                  {(q.options || []).map((opt, oi) => {
                    const sel = answers[qi] && answers[qi].label === opt.label && answers[qi].value === opt.label;
                    return (
                      <button key={oi} disabled={locked}
                        onClick={() => pick(qi, opt)}
                        className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                          ${sel ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                                : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                        <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{opt.label}</div>
                        {opt.description && <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{opt.description}</div>}
                      </button>
                    );
                  })}
                  <button disabled={locked} onClick={() => toggleOther(qi)}
                    className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                      ${answers[qi] && answers[qi].label === '其他' ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                        : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                    <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>💬 其他(自己写)</div>
                    <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>如果上面选项不合适,自己说一下</div>
                  </button>
                  {otherOpen[qi] && (
                    <div className="mt-1">
                      <textarea rows="2" value={otherText[qi]}
                        onChange={e => { const ot = otherText.slice(); ot[qi] = e.target.value; setOtherText(ot); }}
                        onKeyDown={e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitOther(qi); } }}
                        placeholder="写下你想说的..."
                        className={`w-full rounded-[10px] p-2 text-[13px] outline-none border ${isDark ? 'bg-[#131314] border-white/10 text-[#E3E3E3]' : 'bg-white border-black/10 text-[#1F1F1F]'}`} />
                      <div className="flex gap-2 mt-1 justify-end">
                        <button className={cardBtnCls(isDark)} onClick={() => toggleOther(qi)}>取消</button>
                        <button className={cardBtnCls(isDark, 'primary')} onClick={() => submitOther(qi)}>提交</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
          {statusText && <div className={`mt-3 text-[13px] ${item.error ? (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]') : (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')}`}>{statusText}</div>}
        </div>
      );
    };

    // ==========================================
    // ModeHeader — Plan/YOLO 模式指示 + 灯泡切换
    // ==========================================
    const PHASE_LABEL = { planning: '讨论方案', ready: '方案就绪', executing: '执行中' };
    const ModeHeader = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const ms = (bs && bs.modeState) || { mode: 'yolo', plan_phase: 'none' };
      const isPlan = ms.mode === 'plan';
      const phaseLabel = PHASE_LABEL[ms.plan_phase] || '';
      return (
        <button
          onClick={() => bridge.available && bridge.setPlanModeNext()}
          title="切换 Plan / YOLO 模式"
          className={`pointer-events-auto px-3 py-2 rounded-full text-[13px] font-medium flex items-center gap-2 transition-colors
            ${isPlan
              ? (isDark ? 'bg-[#0B57D0]/30 text-[#A8C7FA]' : 'bg-[#0B57D0]/10 text-[#0B57D0]')
              : (isDark ? 'bg-[#1E1F20] text-[#C4C7C5] hover:bg-[#333537]' : 'bg-white text-[#444746] hover:bg-[#F0F4F9] shadow-sm')}`}
        >
          <Zap size={15} /> {isPlan ? ('Plan' + (phaseLabel ? ' · ' + phaseLabel : '')) : 'YOLO'}
        </button>
      );
    };

    // ==========================================
    // ArtifactsPanel — 产物面板（右侧抽屉 + 预览）
    // ==========================================
    const ARTIFACT_ICONS = {
      md: '📄', markdown: '📄', html: '🌐', htm: '🌐',
      png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
      pdf: '📕', csv: '📊', xlsx: '📊', json: '🔢', yaml: '🔢', yml: '🔢', txt: '📝',
    };
    const artifactIcon = (name) => ARTIFACT_ICONS[(name.split('.').pop() || '').toLowerCase()] || '📎';

    const ArtifactsPanel = ({ bs, theme, t, onClose }) => {
      const isDark = theme === 'dark';
      const artifacts = (bs && bs.artifacts) || [];
      const [sel, setSel] = useState(null);
      const [pv, setPv] = useState({ loading: false });

      async function preview(a) {
        setSel(a.path);
        setPv({ loading: true });
        try {
          const info = await bridge.artifactInfo(a.path);
          if (!info || !info.exists) { setPv({ loading: false, missing: true }); return; }
          if (info.kind === 'md' || info.kind === 'html' || info.kind === 'text') {
            const text = await bridge.readArtifactText(a.path);
            setPv({ loading: false, kind: info.kind, text });
          } else {
            setPv({ loading: false, kind: info.kind || 'other' });
          }
        } catch (e) { setPv({ loading: false, error: String(e) }); }
      }

      return (
        <div className="absolute inset-0 z-30 flex justify-end pointer-events-auto">
          <div className="absolute inset-0 bg-black/40" onClick={onClose}></div>
          <div className={`relative w-[680px] max-w-[88vw] h-full flex flex-col shadow-2xl ${isDark ? 'bg-[#1E1F20]' : 'bg-white'} animate-in slide-in-from-right duration-200`}>
            <div className={`flex items-center justify-between px-4 py-3 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <span className={`text-[15px] font-medium flex items-center gap-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}><Package size={16} /> {t.artifacts}</span>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>
            <div className="flex-1 flex min-h-0">
              {/* list */}
              <div className={`w-[240px] shrink-0 overflow-y-auto custom-scrollbar border-r ${isDark ? 'border-white/10' : 'border-black/10'}`}>
                {artifacts.length === 0 ? (
                  <div className={`p-4 text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>暂无产物</div>
                ) : artifacts.map((a) => (
                  <div key={a.path} onClick={() => preview(a)}
                    className={`group flex items-center gap-2 px-3 py-2.5 cursor-pointer text-[13px]
                      ${sel === a.path ? (isDark ? 'bg-[#333537]' : 'bg-[#E8EDF2]') : (isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#F0F4F9]')}`}>
                    <span>{artifactIcon(a.basename)}</span>
                    <span className={`flex-1 truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`} title={a.path}>{a.basename}</span>
                    <button title="打开所在目录" onClick={(e) => { e.stopPropagation(); bridge.openContainingFolder(a.path); }} className="opacity-0 group-hover:opacity-100 text-[13px]">📂</button>
                    <button title="外部打开" onClick={(e) => { e.stopPropagation(); bridge.openArtifactExternal(a.path); }} className="opacity-0 group-hover:opacity-100 text-[13px]">↗</button>
                  </div>
                ))}
              </div>
              {/* preview */}
              <div className="flex-1 overflow-y-auto custom-scrollbar p-4 min-w-0">
                {!sel ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>选择左侧产物预览</div>
                ) : pv.loading ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载中...</div>
                ) : pv.missing ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>文件不存在或已被删除</div>
                ) : pv.error ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>读取失败: {pv.error}</div>
                ) : pv.kind === 'md' ? (
                  <div className={`msg-md text-[14px] leading-relaxed ${isDark ? 'dark-code text-[#E3E3E3]' : 'light-code text-[#1F1F1F]'}`} dangerouslySetInnerHTML={{ __html: bridge.renderMarkdown(pv.text || '') }} />
                ) : pv.kind === 'html' ? (
                  <iframe sandbox="allow-same-origin allow-scripts" className="w-full h-full min-h-[480px] rounded-lg bg-white"
                    srcDoc={"<script>document.addEventListener('contextmenu',function(e){e.preventDefault();})<\/script>" + (pv.text || '')} />
                ) : pv.kind === 'text' ? (
                  <pre className={`text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.text}</pre>
                ) : (
                  <div>
                    <p className={`text-[13px] mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.kind === 'image' ? '图片预览暂不支持嵌入' : '此类型暂不支持预览'}</p>
                    <button onClick={() => bridge.openArtifactExternal(sel)} className={cardBtnCls(isDark, 'primary')}>↗ 外部打开</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 工作流：PhaseChips / WorkflowView / SkillCard / DemoModal
    // ==========================================
    const convertFileSrc = (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.convertFileSrc)
      ? window.__TAURI__.core.convertFileSrc
      : ((p) => p);

    // 聊天室顶部 phase pipeline（仅当前 session 绑定了 skill 时显示）
    const PhaseChips = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const wf = (bs && bs.workflow) || {};
      const [previewId, setPreviewId] = useState(null);
      if (!wf.activeSkillName || !wf.phases || !wf.phases.length) return null;
      const reached = new Set(wf.reachedPhaseIds || []);
      const total = wf.phases.length;
      const pIdx = previewId ? wf.phases.findIndex(p => p.id === previewId) : -1;
      const pp = pIdx >= 0 ? wf.phases[pIdx] : null;
      const ppCurrent = pp && pp.id === wf.currentPhaseId;
      const ppReached = pp && reached.has(pp.id);
      return (
        <div className={`pointer-events-auto rounded-[14px] border px-3 py-2 mb-2 ${isDark ? 'bg-[#1E1F20] border-white/10' : 'bg-white border-black/10 shadow-sm'}`}>
          <div className="flex items-center gap-2 flex-wrap">
            <span className={`flex items-center gap-1 text-[12px] font-medium px-2 py-1 rounded-full ${isDark ? 'bg-[#0B57D0]/30 text-[#A8C7FA]' : 'bg-[#0B57D0]/10 text-[#0B57D0]'}`}>
              🧭 {wf.activeSkillName}
              <button title="退出工作流" onClick={() => bridge.deactivateSkill()} className="ml-1 hover:text-[#F28B82]">✕</button>
            </span>
            <div className="flex items-center gap-1 flex-wrap">
              {wf.phases.map((p, i) => {
                const cur = p.id === wf.currentPhaseId;
                const done = reached.has(p.id) && !cur;
                const cls = cur
                  ? (isDark ? 'bg-[#A8C7FA] text-[#062E6F]' : 'bg-[#0B57D0] text-white')
                  : done
                    ? (isDark ? 'bg-[#1E3A2A] text-[#93D5A6]' : 'bg-[#E6F4EA] text-[#137333]')
                    : (isDark ? 'bg-[#282A2C] text-[#8E8E8E]' : 'bg-[#F0F4F9] text-[#9AA0A6]');
                return (
                  <React.Fragment key={p.id}>
                    {i > 0 && <span className={isDark ? 'text-[#5F6368]' : 'text-[#BDC1C6]'}>›</span>}
                    <button onClick={() => setPreviewId(previewId === p.id ? null : p.id)}
                      title={p.title + (p.loop ? ' (含 loop)' : '')}
                      className={`text-[12px] px-2 py-1 rounded-full font-mono transition-colors ${cls} ${previewId === p.id ? 'ring-2 ring-offset-1 ring-[#A8C7FA]' : ''}`}>
                      {cur ? '▶ ' : done ? '✓ ' : ''}{p.id}{p.loop ? ' ↻' : ''}
                    </button>
                  </React.Fragment>
                );
              })}
            </div>
          </div>
          {pp && (
            <div className={`mt-2 pt-2 border-t text-[12px] ${isDark ? 'border-white/10 text-[#C4C7C5]' : 'border-black/10 text-[#444746]'}`}>
              <span className="font-mono">{pp.id}</span> · <span className="font-medium">{pp.title}</span>
              <span className="mx-1">—</span>第 {pIdx + 1} 步 / 共 {total} 步{pp.loop ? ' · ↻ 含内部循环' : ''}
              <span className={`ml-2 px-1.5 py-0.5 rounded ${ppCurrent ? (isDark ? 'bg-[#A8C7FA]/20 text-[#A8C7FA]' : 'bg-[#0B57D0]/10 text-[#0B57D0]') : ppReached ? (isDark ? 'bg-[#1E3A2A] text-[#93D5A6]' : 'bg-[#E6F4EA] text-[#137333]') : (isDark ? 'bg-[#282A2C] text-[#8E8E8E]' : 'bg-[#F0F4F9] text-[#9AA0A6]')}`}>
                {ppCurrent ? '当前阶段' : ppReached ? '已到达' : '未到达'}
              </span>
              <span className={`ml-2 ${isDark ? 'text-[#5F6368]' : 'text-[#9AA0A6]'}`}>只读预览,不影响实际进度</span>
            </div>
          )}
        </div>
      );
    };

    const SkillCard = ({ s, theme, active, onActivate }) => {
      const isDark = theme === 'dark';
      const phasesCount = (s.phases && s.phases.length) || 0;
      const hasDemo = s.demo && (s.demo.has_file || s.demo.has_preview);
      return (
        <div className={`flex flex-col rounded-[16px] border p-4 ${isDark ? 'bg-[#1E1F20] border-white/10 hover:border-white/20' : 'bg-white border-black/10 hover:shadow-md'} transition-all`}>
          <div className="flex items-start justify-between gap-2 mb-1">
            <h3 className={`text-[14px] font-semibold ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{s.name}</h3>
            <span className={`text-[11px] px-1.5 py-0.5 rounded shrink-0 ${isDark ? 'bg-[#333537] text-[#C4C7C5]' : 'bg-[#F0F4F9] text-[#444746]'}`}>{s.source}</span>
          </div>
          <p className={`text-[12px] leading-relaxed mb-2 line-clamp-3 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{(s.description || '').slice(0, 220)}</p>
          {phasesCount > 0 ? (
            <div className={`text-[12px] font-mono mb-2 ${isDark ? 'text-[#8E8E8E]' : 'text-[#5F6368]'}`}>
              {phasesCount} 个 phase · {s.phases.slice(0, 8).map(p => p.id + (p.loop ? '↻' : '')).join(' → ')}{phasesCount > 8 ? ' → …' : ''}
            </div>
          ) : (
            <div className={`text-[12px] mb-2 ${isDark ? 'text-[#5F6368]' : 'text-[#9AA0A6]'}`}>普通 skill (未声明 phases)</div>
          )}
          {s.demo && s.demo.duration && <div className={`text-[12px] mb-2 ${isDark ? 'text-[#8E8E8E]' : 'text-[#5F6368]'}`}>⏱ {s.demo.duration}</div>}
          <div className="flex items-center gap-2 mt-auto pt-2">
            {phasesCount > 0 ? (
              <button onClick={() => onActivate(s.name)} className={cardBtnCls(isDark, 'primary')}>{active ? '✓ 使用中' : '启用'}</button>
            ) : (
              <button disabled className={cardBtnCls(isDark)}>仅查看</button>
            )}
            {hasDemo && <button onClick={() => bridge.openDemo(s.name)} className={cardBtnCls(isDark)}>看 demo</button>}
          </div>
        </div>
      );
    };

    const DemoModal = ({ demo, theme, onClose }) => {
      const isDark = theme === 'dark';
      if (!demo || !demo.open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" >
          <div className="absolute inset-0 bg-black/60" onClick={onClose}></div>
          <div className={`relative w-[1100px] max-w-[92vw] max-h-[82vh] flex flex-col rounded-[16px] overflow-hidden shadow-2xl ${isDark ? 'bg-[#1E1F20]' : 'bg-white'}`}>
            <div className={`flex items-center justify-between px-4 py-3 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <span className={`text-[14px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{demo.name} · demo 预览</span>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>
            <div className="flex-1 overflow-auto min-h-[300px] flex flex-col">
              {demo.loading ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载 demo …</div>
              ) : demo.error ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>读取失败: {demo.error}</div>
              ) : (demo.kind === 'none' || !demo.path) && demo.kind !== 'text' ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>该 skill 未声明 demo 文件。</div>
              ) : demo.kind === 'html' ? (
                <iframe className="w-full flex-1 min-h-[480px] border-0 bg-white" src={convertFileSrc(demo.path)} sandbox="allow-same-origin allow-scripts" />
              ) : demo.kind === 'image' ? (
                <img className="max-w-full max-h-[72vh] object-contain m-auto" src={convertFileSrc(demo.path)} alt={demo.name + ' demo'} />
              ) : demo.kind === 'text' ? (
                <pre className={`p-4 text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{demo.content || ''}</pre>
              ) : (
                <div className="m-auto text-center">
                  <p className={`text-[13px] mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>未识别的文件类型</p>
                  <button onClick={() => bridge.openInSystem(demo.path)} className={cardBtnCls(isDark, 'primary')}>用系统应用打开</button>
                </div>
              )}
            </div>
            {(demo.description || demo.duration) && (
              <div className={`px-4 py-2 border-t text-[12px] ${isDark ? 'border-white/10 text-[#C4C7C5]' : 'border-black/10 text-[#444746]'}`}>
                {demo.description ? '📝 ' + demo.description : ''}{demo.description && demo.duration ? ' · ' : ''}{demo.duration ? '⏱ ' + demo.duration : ''}
              </div>
            )}
          </div>
        </div>
      );
    };

    const WorkflowView = ({ bs, theme, t, onActivate }) => {
      const isDark = theme === 'dark';
      const wf = (bs && bs.workflow) || {};
      useEffect(() => { if (bridge.available) bridge.loadSkills(); }, []);
      const skills = wf.skills || [];
      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 overflow-hidden animate-in fade-in duration-300">
          <div className="flex items-center justify-between px-6 md:px-10 pt-8 pb-4">
            <div>
              <h1 className={`text-[28px] font-normal ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.workflow}</h1>
              <p className={`text-[13px] mt-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>任务拆解 · 进度可视化</p>
            </div>
            <button onClick={() => bridge.loadSkills()} title="重新扫描 skill"
              className={`w-10 h-10 rounded-full flex items-center justify-center ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}>
              <RefreshCw size={18} />
            </button>
          </div>
          <div className="flex-1 overflow-y-auto custom-scrollbar px-6 md:px-10 pb-10">
            {wf.loadState === 'loading' ? (
              <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载 skill 列表 …</div>
            ) : wf.loadState === 'error' ? (
