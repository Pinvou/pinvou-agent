          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || '已处理'}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.planFallbackAccept(item.id, item.text)}>✅ 直接采纳这段</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.planFallbackRetry(item.id)}>📋 让 AI 用工具重出</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.discardPlan(item.id)}>🚪 算了</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // CarefulBlockedCard — 🛑 破坏性命令拦截
    // ==========================================
    const CarefulBlockedCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const md = item.metadata || {};
      const cmd = (item.args && (item.args.command || item.args.cmd)) || '(命令未知)';
      const reasons = (md.reasons && md.reasons.length) ? md.reasons : ['命中破坏性 pattern'];
      const suggestions = md.suggestions || [];
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#F28B82]/40' : 'border-[#C5221F]/30')}>
          <div className={`text-[14px] font-semibold mb-2 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>🛑 Careful Hook 拦截了一条破坏性命令</div>
          <pre className={`text-[12px] font-mono rounded-lg p-2 mb-2 overflow-x-auto ${isDark ? 'bg-[#131314] text-[#F28B82]' : 'bg-white text-[#C5221F]'}`}>{cmd}</pre>
          <div className="mb-2">
            <div className={`text-[12px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>为什么拦?</div>
            <ul className={`list-disc pl-5 text-[13px] space-y-0.5 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{reasons.map((r, i) => <li key={i}>{r}</li>)}</ul>
          </div>
          {suggestions.length > 0 && (
            <div className="mb-2">
              <div className={`text-[12px] font-medium mb-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>建议</div>
              <ul className={`list-disc pl-5 text-[13px] space-y-0.5 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{suggestions.map((s, i) => <li key={i}>{s}</li>)}</ul>
            </div>
          )}
          <div className={`text-[12px] leading-relaxed ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>这个 hook 在所有模式默认开启,与 Plan/YOLO/品悟开关无关。如果你确认要跑,自己在终端执行 —— LLM 不会被允许跑破坏性命令。</div>
        </div>
      );
    };

    // ==========================================
    // UserInputCard — 🤔 AI 想问你几个问题
    // ==========================================
    const UserInputCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const questions = item.questions || [];
      const [answers, setAnswers] = useState(() => item.restoredAnswers || questions.map(() => null));
      const [otherOpen, setOtherOpen] = useState(() => questions.map(() => false));
      const [otherText, setOtherText] = useState(() => questions.map(() => ''));
      const locked = item.resolved || item.submitting;

      function pick(qi, opt) {
        if (locked) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: opt.label, value: opt.label };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function toggleOther(qi) {
        if (locked) return;
        const oo = otherOpen.slice(); oo[qi] = !oo[qi]; setOtherOpen(oo);
        if (oo[qi]) { const next = answers.slice(); next[qi] = null; setAnswers(next); }
      }
      function submitOther(qi) {
        const val = (otherText[qi] || '').trim();
        if (!val) return;
        const next = answers.slice();
        next[qi] = { id: questions[qi].id, label: '其他', value: val };
        const oo = otherOpen.slice(); oo[qi] = false; setOtherOpen(oo);
        commit(next);
      }
      function commit(next) {
        setAnswers(next);
        if (next.every(a => a != null)) {
          bridge.submitUserInput(item.id, item.toolCallId, next, questions);
        }
      }

      const statusText = item.cardState === 'submitted' ? '✓ 已提交'
        : item.cardState === 'cancelled' ? '✕ 已取消'
        : item.submitting ? '提交中…' : item.error ? ('⚠️ 提交失败: ' + item.error) : '';

      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className={`text-[14px] font-semibold mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>🤔 AI 想问你几个问题</div>
          <div className="space-y-4">
            {questions.map((q, qi) => (
              <div key={qi}>
                <div className={`text-[12px] font-semibold ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{q.header || ('Q' + (qi + 1))}</div>
                <div className={`text-[13px] mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{q.question || ''}</div>
                <div className="flex flex-col gap-1.5">
                  {(q.options || []).map((opt, oi) => {
                    const sel = answers[qi] && answers[qi].label === opt.label && answers[qi].value === opt.label;
                    return (
                      <button key={oi} disabled={locked}
                        onClick={() => pick(qi, opt)}
                        className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                          ${sel ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                                : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                        <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{opt.label}</div>
                        {opt.description && <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{opt.description}</div>}
                      </button>
                    );
                  })}
                  <button disabled={locked} onClick={() => toggleOther(qi)}
                    className={`text-left px-3 py-2 rounded-[12px] border transition-colors disabled:cursor-not-allowed
                      ${answers[qi] && answers[qi].label === '其他' ? (isDark ? 'border-[#A8C7FA] bg-[#A8C7FA]/10' : 'border-[#0B57D0] bg-[#0B57D0]/5')
                        : (isDark ? 'border-white/10 hover:bg-[#282A2C]' : 'border-black/10 hover:bg-[#E8EDF2]')}`}>
                    <div className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>💬 其他(自己写)</div>
                    <div className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>如果上面选项不合适,自己说一下</div>
                  </button>
                  {otherOpen[qi] && (
                    <div className="mt-1">
                      <textarea rows="2" value={otherText[qi]}
                        onChange={e => { const ot = otherText.slice(); ot[qi] = e.target.value; setOtherText(ot); }}
                        onKeyDown={e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitOther(qi); } }}
                        placeholder="写下你想说的..."
                        className={`w-full rounded-[10px] p-2 text-[13px] outline-none border ${isDark ? 'bg-[#131314] border-white/10 text-[#E3E3E3]' : 'bg-white border-black/10 text-[#1F1F1F]'}`} />
                      <div className="flex gap-2 mt-1 justify-end">
                        <button className={cardBtnCls(isDark)} onClick={() => toggleOther(qi)}>取消</button>
                        <button className={cardBtnCls(isDark, 'primary')} onClick={() => submitOther(qi)}>提交</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
          {statusText && <div className={`mt-3 text-[13px] ${item.error ? (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]') : (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')}`}>{statusText}</div>}
        </div>
      );
    };

    // ==========================================
    // ModeHeader — Plan/YOLO 模式指示 + 灯泡切换
    // ==========================================
    const PHASE_LABEL = { planning: '讨论方案', ready: '方案就绪', executing: '执行中' };
    const ModeHeader = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const ms = (bs && bs.modeState) || { mode: 'yolo', plan_phase: 'none' };
      const isPlan = ms.mode === 'plan';
      const phaseLabel = PHASE_LABEL[ms.plan_phase] || '';
      async function toggleMode() {
        if (!bridge.available) return;
        if (ms.mode === 'plan') {
          // 已在 Plan(任何 phase)→ 退出回 YOLO(busy 先停当前 turn)
          if (bs && bs.busy) await bridge.cancelGeneration();
          await bridge.exitPlanToYolo();
        } else {
          await bridge.setPlanModeNext(); // YOLO → 进入 Plan
        }
      }
      return (
        <button
          onClick={toggleMode}
          title={isPlan ? '点击退出 Plan 回 YOLO' : '点击进入 Plan 模式'}
          className={`pointer-events-auto px-3 py-2 rounded-full text-[13px] font-medium flex items-center gap-2 transition-colors
            ${isPlan
              ? (isDark ? 'bg-[#0B57D0]/30 text-[#A8C7FA]' : 'bg-[#0B57D0]/10 text-[#0B57D0]')
              : (isDark ? 'bg-[#1E1F20] text-[#C4C7C5] hover:bg-[#333537]' : 'bg-white text-[#444746] hover:bg-[#F0F4F9] shadow-sm')}`}
        >
          <Zap size={15} /> {isPlan ? ('Plan' + (phaseLabel ? ' · ' + phaseLabel : '')) : 'YOLO'}
        </button>
      );
    };

    // 品悟审批 toggle（与 Plan/YOLO 正交）
    const PinvouToggle = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const on = !!(bs && bs.modeState && bs.modeState.pinvou_review_enabled);
      return (
        <button onClick={() => bridge.available && bridge.togglePinvouReview()}
          title={on ? '品悟审核: 开（关键阶段让品悟把关）' : '品悟审核: 关（点击开启）'}
          className={`pointer-events-auto px-3 py-2 rounded-full text-[13px] font-medium flex items-center gap-1.5 transition-colors
            ${on ? (isDark ? 'bg-[#7C3AED]/40 text-[#D0BCFF]' : 'bg-[#7C3AED]/10 text-[#7C3AED]')
                 : (isDark ? 'bg-[#1E1F20] text-[#8E8E8E] hover:bg-[#333537]' : 'bg-white text-[#9AA0A6] hover:bg-[#F0F4F9] shadow-sm')}`}>
          🟣 品悟{on ? ' 开' : ''}
        </button>
      );
    };

    // 品悟审完后的 3 按钮卡
    // ⊕ 我加一句:展开行内 textarea,用户写完点「📋 发送 修订」走 pinvouRevisePlan(带 userComment)
    // —— 用户的意见真正进 AI 修订指令,而不是落进普通 chat 链路。
    const PinvouActionsCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const done = item.resolved;
      const [commenting, setCommenting] = useState(false);
      const [comment, setComment] = useState('');
      const canSend = comment.trim().length > 0;
      if (done) {
        return (
          <div className={cardBoxCls(isDark, isDark ? 'border-[#D0BCFF]/40' : 'border-[#7C3AED]/30')}>
            <div className={`text-[13px] font-medium mb-3 ${isDark ? 'text-[#D0BCFF]' : 'text-[#7C3AED]'}`}>🟣 品悟审完了 —— 你的决定：</div>
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || '已处理'}</div>
          </div>
        );
      }
      if (commenting) {
        return (
          <div className={cardBoxCls(isDark, isDark ? 'border-[#D0BCFF]/40' : 'border-[#7C3AED]/30')}>
            <div className={`text-[13px] font-medium mb-2 ${isDark ? 'text-[#D0BCFF]' : 'text-[#7C3AED]'}`}>⊕ 加一句意见 → 让 AI 按品悟+你的意见改方案：</div>
            <textarea
              value={comment} onChange={(e) => setComment(e.target.value)}
              placeholder="我也担心..." rows={3} autoFocus
              className={`w-full px-3 py-2 rounded-lg text-[13px] outline-none resize-y mb-2 ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3] border border-white/10' : 'bg-white text-[#1F1F1F] border border-black/10'}`}
            />
            <div className="flex items-center gap-2 flex-wrap">
              <button disabled={!canSend} onClick={() => bridge.pinvouRevisePlan(item.id, item.planMarkdown, item.report, comment.trim())}
                className={`${cardBtnCls(isDark, 'primary')} ${canSend ? '' : 'opacity-50 cursor-not-allowed'}`}>📋 发送 修订</button>
              <button onClick={() => { setCommenting(false); setComment(''); }} className={cardBtnCls(isDark)}>取消</button>
            </div>
          </div>
        );
      }
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#D0BCFF]/40' : 'border-[#7C3AED]/30')}>
          <div className={`text-[13px] font-medium mb-3 ${isDark ? 'text-[#D0BCFF]' : 'text-[#7C3AED]'}`}>🟣 品悟审完了 —— 你的决定：</div>
          <div className="flex items-center gap-2 flex-wrap">
            <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.pinvouAcceptOverride(item.id, item.planMarkdown, item.report)}>✅ 确认继续执行</button>
            <button className={cardBtnCls(isDark)} onClick={() => bridge.pinvouRevisePlan(item.id, item.planMarkdown, item.report)}>↻ 让 AI 改方案</button>
            <button className={cardBtnCls(isDark)} onClick={() => setCommenting(true)}>⊕ 我加一句</button>
          </div>
        </div>
      );
    };

    // ==========================================
    // ArtifactsPanel — 产物面板（右侧抽屉 + 预览）
    // ==========================================
    const ARTIFACT_ICONS = {
      md: '📄', markdown: '📄', html: '🌐', htm: '🌐',
      png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
      pdf: '📕', csv: '📊', xlsx: '📊', json: '🔢', yaml: '🔢', yml: '🔢', txt: '📝',
    };
    const artifactIcon = (name) => ARTIFACT_ICONS[(name.split('.').pop() || '').toLowerCase()] || '📎';

    const ArtifactsPanel = ({ bs, theme, t, onClose }) => {
      const isDark = theme === 'dark';
      const artifacts = (bs && bs.artifacts) || [];
      const [sel, setSel] = useState(null);
      const [pv, setPv] = useState({ loading: false });

      async function preview(a) {
        setSel(a.path);
        setPv({ loading: true });
        try {
          const info = await bridge.artifactInfo(a.path);
          if (!info || !info.exists) { setPv({ loading: false, missing: true }); return; }
          if (info.kind === 'md' || info.kind === 'html' || info.kind === 'text') {
            const text = await bridge.readArtifactText(a.path);
            setPv({ loading: false, kind: info.kind, text });
          } else {
            setPv({ loading: false, kind: info.kind || 'other' });
          }
        } catch (e) { setPv({ loading: false, error: String(e) }); }
      }

      return (
        <div className="absolute inset-0 z-30 flex justify-end pointer-events-auto">
          <div className="absolute inset-0 bg-black/40" onClick={onClose}></div>
          <div className={`relative w-[680px] max-w-[88vw] h-full flex flex-col shadow-2xl ${isDark ? 'bg-[#1E1F20]' : 'bg-white'} animate-in slide-in-from-right duration-200`}>
            <div className={`flex items-center justify-between px-4 py-3 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <span className={`text-[15px] font-medium flex items-center gap-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}><Package size={16} /> {t.artifacts}</span>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>
            <div className="flex-1 flex min-h-0">
              {/* list */}
              <div className={`w-[240px] shrink-0 overflow-y-auto custom-scrollbar border-r ${isDark ? 'border-white/10' : 'border-black/10'}`}>
                {artifacts.length === 0 ? (
                  <div className={`p-4 text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>暂无产物</div>
                ) : artifacts.map((a) => (
                  <div key={a.path} onClick={() => preview(a)}
                    className={`group flex items-center gap-2 px-3 py-2.5 cursor-pointer text-[13px]
                      ${sel === a.path ? (isDark ? 'bg-[#333537]' : 'bg-[#E8EDF2]') : (isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#F0F4F9]')}`}>
                    <span>{artifactIcon(a.basename)}</span>
                    <span className={`flex-1 truncate ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`} title={a.path}>{a.basename}</span>
                    <button title="打开所在目录" onClick={(e) => { e.stopPropagation(); bridge.openContainingFolder(a.path); }} className="opacity-0 group-hover:opacity-100 text-[13px]">📂</button>
                    <button title="外部打开" onClick={(e) => { e.stopPropagation(); bridge.openArtifactExternal(a.path); }} className="opacity-0 group-hover:opacity-100 text-[13px]">↗</button>
                  </div>
                ))}
              </div>
              {/* preview */}
              <div className="flex-1 overflow-y-auto custom-scrollbar p-4 min-w-0">
                {!sel ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>选择左侧产物预览</div>
                ) : pv.loading ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载中...</div>
                ) : pv.missing ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>文件不存在或已被删除</div>
                ) : pv.error ? (
                  <div className={`text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>读取失败: {pv.error}</div>
                ) : pv.kind === 'md' ? (
                  <div className={`msg-md text-[14px] leading-relaxed ${isDark ? 'dark-code text-[#E3E3E3]' : 'light-code text-[#1F1F1F]'}`} dangerouslySetInnerHTML={{ __html: bridge.renderMarkdown(pv.text || '') }} />
                ) : pv.kind === 'html' ? (
                  <iframe sandbox="allow-same-origin allow-scripts" className="w-full h-full min-h-[480px] rounded-lg bg-white"
                    srcDoc={"<script>document.addEventListener('contextmenu',function(e){e.preventDefault();})<\/script>" + (pv.text || '')} />
                ) : pv.kind === 'text' ? (
                  <pre className={`text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.text}</pre>
                ) : (
                  <div>
                    <p className={`text-[13px] mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{pv.kind === 'image' ? '图片预览暂不支持嵌入' : '此类型暂不支持预览'}</p>
                    <button onClick={() => bridge.openArtifactExternal(sel)} className={cardBtnCls(isDark, 'primary')}>↗ 外部打开</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 工作流：PhaseChips / WorkflowView / SkillCard / DemoModal
    // ==========================================
    const convertFileSrc = (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.convertFileSrc)
      ? window.__TAURI__.core.convertFileSrc
      : ((p) => p);

    // 聊天室顶部 phase pipeline（仅当前 session 绑定了 skill 时显示）
    const PhaseChips = ({ bs, theme }) => {
      const isDark = theme === 'dark';
      const wf = (bs && bs.workflow) || {};
      if (!wf.activeSkillName || !wf.phases || !wf.phases.length) return null;
      const reached = new Set(wf.reachedPhaseIds || []);
      const total = wf.phases.length;
      const curIdx = wf.phases.findIndex(p => p.id === wf.currentPhaseId);
      const cur = curIdx >= 0 ? wf.phases[curIdx] : null;
      return (
        <div className={`rounded-xl px-3 py-2 ${isDark ? 'bg-[#1E1F20]/90' : 'bg-[#F0F4F9]'}`}>
          {/* 头部：skill 名 + 当前阶段标题 */}
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <span className={`flex items-center gap-1 text-[12px] font-medium px-2 py-0.5 rounded-full ${isDark ? 'bg-[#0B57D0]/30 text-[#A8C7FA]' : 'bg-[#0B57D0]/10 text-[#0B57D0]'}`}>
              🧭 {wf.activeSkillName}
              <button title="退出工作流" onClick={() => bridge.deactivateSkill()} className="ml-1 hover:text-[#F28B82]">✕</button>
            </span>
            {cur && (
              <span className={`text-[12px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>
                当前 {curIdx + 1}/{total}：<span className="font-medium">{cur.title}</span>{cur.loop ? ' ↻' : ''}
              </span>
            )}
          </div>
          {/* 单行横向滚动：每个 phase 显示 编号 + 标题 */}
          <div className="flex items-center gap-1 overflow-x-auto custom-scrollbar pb-1">
            {wf.phases.map((p, i) => {
              const isCur = p.id === wf.currentPhaseId;
              const done = reached.has(p.id) && !isCur;
              const cls = isCur
                ? (isDark ? 'bg-[#A8C7FA] text-[#062E6F]' : 'bg-[#0B57D0] text-white')
                : done
                  ? (isDark ? 'bg-[#1E3A2A] text-[#93D5A6]' : 'bg-[#E6F4EA] text-[#137333]')
                  : (isDark ? 'bg-[#282A2C] text-[#9AA0A6]' : 'bg-white text-[#5F6368]');
              return (
                <div key={p.id} className="flex items-center shrink-0">
                  {i > 0 && <span className={`mx-0.5 ${isDark ? 'text-[#5F6368]' : 'text-[#BDC1C6]'}`}>›</span>}
                  <div title={p.id + ' · ' + p.title} className={`flex items-center gap-1 px-2 py-1 rounded-full ${cls}`}>
                    {isCur ? <span className="text-[10px]">▶</span> : done ? <span className="text-[10px]">✓</span> : null}
                    <span className="font-mono text-[10px] opacity-70">{p.id}</span>
                    <span className="text-[12px] whitespace-nowrap">{p.title}{p.loop ? ' ↻' : ''}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const SkillCard = ({ s, theme, active, onActivate }) => {
      const isDark = theme === 'dark';
      const phasesCount = (s.phases && s.phases.length) || 0;
      const hasDemo = s.demo && (s.demo.has_file || s.demo.has_preview);
      return (
        <div className={`flex flex-col rounded-[16px] border p-4 ${isDark ? 'bg-[#1E1F20] border-white/10 hover:border-white/20' : 'bg-white border-black/10 hover:shadow-md'} transition-all`}>
          <div className="flex items-start justify-between gap-2 mb-1">
            <h3 className={`text-[14px] font-semibold ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{s.name}</h3>
            <span className={`text-[11px] px-1.5 py-0.5 rounded shrink-0 ${isDark ? 'bg-[#333537] text-[#C4C7C5]' : 'bg-[#F0F4F9] text-[#444746]'}`}>{s.source}</span>
          </div>
          <p className={`text-[12px] leading-relaxed mb-2 line-clamp-3 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{(s.description || '').slice(0, 220)}</p>
          {phasesCount > 0 ? (
            <div className={`text-[12px] font-mono mb-2 ${isDark ? 'text-[#8E8E8E]' : 'text-[#5F6368]'}`}>
              {phasesCount} 个 phase · {s.phases.slice(0, 8).map(p => p.id + (p.loop ? '↻' : '')).join(' → ')}{phasesCount > 8 ? ' → …' : ''}
            </div>
          ) : (
            <div className={`text-[12px] mb-2 ${isDark ? 'text-[#5F6368]' : 'text-[#9AA0A6]'}`}>普通 skill (未声明 phases)</div>
          )}
          {s.demo && s.demo.duration && <div className={`text-[12px] mb-2 ${isDark ? 'text-[#8E8E8E]' : 'text-[#5F6368]'}`}>⏱ {s.demo.duration}</div>}
          <div className="flex items-center gap-2 mt-auto pt-2">
            {phasesCount > 0 ? (
              <button onClick={() => onActivate(s.name)} className={cardBtnCls(isDark, 'primary')}>{active ? '✓ 使用中' : '启用'}</button>
            ) : (
              <button disabled className={cardBtnCls(isDark)}>仅查看</button>
            )}
            {hasDemo && <button onClick={() => bridge.openDemo(s.name)} className={cardBtnCls(isDark)}>看 demo</button>}
          </div>
        </div>
      );
    };

    const DemoModal = ({ demo, theme, onClose }) => {
      const isDark = theme === 'dark';
      if (!demo || !demo.open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" >
          <div className="absolute inset-0 bg-black/60" onClick={onClose}></div>
          <div className={`relative w-[1100px] max-w-[92vw] max-h-[82vh] flex flex-col rounded-[16px] overflow-hidden shadow-2xl ${isDark ? 'bg-[#1E1F20]' : 'bg-white'}`}>
            <div className={`flex items-center justify-between px-4 py-3 border-b ${isDark ? 'border-white/10' : 'border-black/10'}`}>
              <span className={`text-[14px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{demo.name} · demo 预览</span>
              <button onClick={onClose} className={`w-8 h-8 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537] text-[#C4C7C5]' : 'hover:bg-[#F0F4F9] text-[#444746]'}`}><XCircle size={18} /></button>
            </div>
            <div className="flex-1 overflow-auto min-h-[300px] flex flex-col">
              {demo.loading ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载 demo …</div>
              ) : demo.error ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>读取失败: {demo.error}</div>
              ) : (demo.kind === 'none' || !demo.path) && demo.kind !== 'text' ? (
                <div className={`m-auto text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>该 skill 未声明 demo 文件。</div>
              ) : demo.kind === 'html' ? (
                <iframe className="w-full flex-1 min-h-[480px] border-0 bg-white" src={convertFileSrc(demo.path)} sandbox="allow-same-origin allow-scripts" />
              ) : demo.kind === 'image' ? (
                <img className="max-w-full max-h-[72vh] object-contain m-auto" src={convertFileSrc(demo.path)} alt={demo.name + ' demo'} />
              ) : demo.kind === 'text' ? (
                <pre className={`p-4 text-[12px] whitespace-pre-wrap break-words font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{demo.content || ''}</pre>
              ) : (
                <div className="m-auto text-center">
                  <p className={`text-[13px] mb-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>未识别的文件类型</p>
                  <button onClick={() => bridge.openInSystem(demo.path)} className={cardBtnCls(isDark, 'primary')}>用系统应用打开</button>
                </div>
              )}
            </div>
            {(demo.description || demo.duration) && (
              <div className={`px-4 py-2 border-t text-[12px] ${isDark ? 'border-white/10 text-[#C4C7C5]' : 'border-black/10 text-[#444746]'}`}>
                {demo.description ? '📝 ' + demo.description : ''}{demo.description && demo.duration ? ' · ' : ''}{demo.duration ? '⏱ ' + demo.duration : ''}
              </div>
            )}
          </div>
        </div>
      );
    };

    const WorkflowView = ({ bs, theme, t, onActivate }) => {
      const isDark = theme === 'dark';
      const wf = (bs && bs.workflow) || {};
      useEffect(() => { if (bridge.available) bridge.loadSkills(); }, []);
      const skills = wf.skills || [];
      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 overflow-hidden animate-in fade-in duration-300">
          <div className="flex items-center justify-between px-6 md:px-10 pt-8 pb-4">
            <div>
              <h1 className={`text-[28px] font-normal ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{t.workflow}</h1>
              <p className={`text-[13px] mt-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>任务拆解 · 进度可视化</p>
            </div>
            <button onClick={() => bridge.loadSkills()} title="重新扫描 skill"
              className={`w-10 h-10 rounded-full flex items-center justify-center ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}>
              <RefreshCw size={18} />
            </button>
          </div>
          <div className="flex-1 overflow-y-auto custom-scrollbar px-6 md:px-10 pb-10">
            {wf.loadState === 'loading' ? (
              <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>加载 skill 列表 …</div>
            ) : wf.loadState === 'error' ? (
              <div className={`text-[13px] ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>加载失败，点右上角重试</div>
            ) : skills.length === 0 ? (
              <div className={`text-[13px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>未发现 skill</div>
            ) : (
              <div className="grid gap-4" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))' }}>
                {skills.map((s) => (
                  <SkillCard key={s.name} s={s} theme={theme} active={wf.activeSkillName === s.name} onActivate={onActivate} />
                ))}
              </div>
            )}
          </div>
          <DemoModal demo={wf.demo} theme={theme} onClose={() => bridge.closeDemo()} />
        </div>
      );
    };

    // ==========================================
    // Tool Store
    // ==========================================

    const tsCategories = [
      { id: 'all', label: '全部工具' },
      { id: 'mcp', label: 'MCP 核心' },
      { id: 'comm', label: '协作办公' },
      { id: 'dev', label: '研发治理' },
      { id: 'finance', label: '金融数据' },
    ];

    const tsFeaturedCollections = [
      { id: 'f6', label: '即装即用', title: '实时天气随口问', subtitle: '接入高德天气 API，自然语言查全国城市实时天气与多日预报，零配置一键安装。', bg: 'bg-gradient-to-br from-sky-500 via-blue-500 to-indigo-600', featuredToolId: 1 },
      { id: 'f4', label: '数据引擎', title: '打造智能投研助理', subtitle: '集成同花顺问财 12 项金融工具，利用大模型快速输出深度个股诊断报告。', bg: 'bg-gradient-to-br from-red-600 via-rose-700 to-orange-600', featuredToolId: 2 },
      { id: 'f7', label: '企业数据', title: '一键查透企业全貌', subtitle: '接入企查查 182 个工具，工商/风控/知产/经营数据信手拈来，免配置即装即用。', bg: 'bg-gradient-to-br from-blue-700 via-cyan-600 to-teal-500', featuredToolId: 13 },
      { id: 'f1', label: '场景套件', title: '构建 AI 研发中枢', subtitle: '串联 TAPD 与 CNB，让 AI 帮你审查 PR、追踪缺陷并自动部署流水线。', bg: 'bg-gradient-to-br from-indigo-800 via-violet-700 to-fuchsia-600', featuredToolId: 12 },
      { id: 'f2', label: '核心 MCP', title: '激活企业沉淀知识', subtitle: '挂载 ima 知识库底层能力，解锁毫秒级的海量文档精准召回与分析。', bg: 'bg-gradient-to-br from-blue-700 via-indigo-600 to-cyan-600', featuredToolId: 4 },
      { id: 'f3', label: '效率编排', title: '跨平台消息中转', subtitle: '无缝打通企微、飞书与钉钉，实现重要告警与工作流消息的自动化流转。', bg: 'bg-gradient-to-br from-emerald-600 via-teal-700 to-cyan-800', featuredToolId: 9 },
      { id: 'f5', label: '通信治理', title: '下一代智能云会议', subtitle: '调用腾讯会议高级能力，实现自动发起、录制总结与待办任务自动分配。', bg: 'bg-gradient-to-br from-sky-600 via-blue-600 to-indigo-700', featuredToolId: 7 },
    ];

    // 工具市场按钮：安装 / 卸载 / 即将上线（三态）
    const TsActionBtn = ({ tool, busy, onAction, size = 'sm' }) => {
      const isLg = size === 'lg';
      if (!tool.backendId) {
        return (
          <button disabled className={`${isLg ? 'px-10 py-2.5 text-[15px]' : 'w-20 py-1.5 text-[14px]'} rounded-full font-bold bg-slate-100 dark:bg-[#1C1C1E] border border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 cursor-not-allowed`}>
            即将上线
          </button>
        );
      }
      if (busy) {
        return (
          <button disabled className={`${isLg ? 'px-10 py-2.5 text-[15px]' : 'w-20 py-1.5 text-[14px]'} rounded-full font-bold opacity-50 cursor-wait bg-slate-100 dark:bg-[#1C1C1E] border border-slate-200 dark:border-slate-700 text-slate-500`}>
            ...
          </button>
        );
      }
      if (tool.installed) {
        return (
          <button
            onClick={(e) => { e.stopPropagation(); onAction(tool.backendId, true); }}
            className={`${isLg ? 'px-10 py-2.5 text-[15px]' : 'w-20 py-1.5 text-[14px]'} rounded-full font-bold transition-all active:scale-95 bg-slate-100 dark:bg-[#2C2C2E] border border-slate-200 dark:border-slate-700 text-[#FF3B30] dark:text-[#FF453A] hover:bg-slate-200 dark:hover:bg-[#3A3A3C]`}
          >
            卸载
          </button>
        );
      }
      const hasConfig = tool.configFields && tool.configFields.length > 0;
      return (
        <button
          onClick={(e) => { e.stopPropagation(); onAction(tool.backendId, false); }}
          className={`${isLg ? 'px-10 py-2.5 text-[15px] shadow-md shadow-blue-500/20' : 'w-20 py-1.5 text-[14px]'} rounded-full font-bold transition-all active:scale-95 bg-blue-600 hover:bg-blue-700 text-white`}
        >
          {hasConfig ? '配置' : '安装'}
        </button>
      );
    };

    // iOS 风格弹窗（安装/卸载后提示需新建会话生效）
    const TsAlert = ({ alert, theme, onDismiss, onNewChat }) => {
      const isDark = theme === 'dark';
      if (!alert.visible && !alert.loading) return null;
      return (
        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/40 backdrop-blur-sm">
          <div
            className={`w-[280px] rounded-[20px] overflow-hidden shadow-2xl transition-transform duration-200 scale-100 ${
              isDark ? 'bg-[#2C2C2E]' : 'bg-white/95 backdrop-blur-xl'
            }`}
            style={{ animation: 'tsAlertIn .2s ease-out' }}
          >
            {alert.loading ? (
              <div className="px-6 py-8 text-center">
                <div className="flex justify-center mb-4">
                  <div className={`w-6 h-6 rounded-full border-[2.5px] border-t-transparent ${isDark ? 'border-[#0A84FF]' : 'border-[#007AFF]'}`}
                    style={{ animation: 'tsSpinner .8s linear infinite' }} />
                </div>
                <div className={`text-[17px] font-semibold mb-1.5 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                  {alert.title}
                </div>
                {alert.subtitle && (
                  <div className={`text-[13px] leading-relaxed ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                    {alert.subtitle}
                  </div>
                )}
              </div>
            ) : (
              <>
                <div className="px-6 pt-6 pb-5 text-center">
                  <div className={`text-[17px] font-semibold mb-1.5 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                    {alert.title}
                  </div>
                  {!alert.isError && (
                    <div className={`text-[13px] leading-relaxed ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                      {alert.isInstall ? '新工具需要在新会话中生效' : '已移除，新会话将不再加载该工具'}
                    </div>
                  )}
                </div>
                <div className={`border-t ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
                  <button
                    onClick={onDismiss}
                    className={`w-full py-3 text-[17px] font-normal text-center transition-colors ${
                      isDark ? 'text-[#0A84FF] active:bg-white/5' : 'text-[#007AFF] active:bg-slate-100'
                    }`}
                  >
                    知道了
                  </button>
                </div>
                {!alert.isError && (
                  <div className={`border-t ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
                    <button
                      onClick={onNewChat}
                      className={`w-full py-3 text-[17px] font-semibold text-center transition-colors ${
                        isDark ? 'text-[#0A84FF] active:bg-white/5' : 'text-[#007AFF] active:bg-slate-100'
                      }`}
                    >
                      新建会话
                    </button>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    };

    // API Key 配置弹窗（需要 config_fields 的工具安装前弹出）
    const TsConfigDialog = ({ config, theme, onConfirm, onCancel }) => {
      const isDark = theme === 'dark';
      if (!config) return null;
      const [values, setValues] = useState({});
      const field = config.fields[0]; // v1 只支持单个配置字段
      const canSubmit = field ? (values[field.key] || '').trim().length > 0 : false;
      return (
        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/40 backdrop-blur-sm">
          <div
            className={`w-[280px] rounded-[20px] overflow-hidden shadow-2xl ${isDark ? 'bg-[#2C2C2E]' : 'bg-white/95 backdrop-blur-xl'}`}
            style={{ animation: 'tsAlertIn .2s ease-out' }}
          >
            <div className="px-6 pt-6 pb-4 text-center">
              <div className={`text-[17px] font-semibold mb-4 ${isDark ? 'text-white' : 'text-slate-900'}`}>
                配置「{config.name}」
              </div>
              {field && (
                <div className="text-left mb-3">
                  <label className={`text-[13px] font-medium mb-1.5 block ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                    {field.label}
                  </label>
                  <input
                    type="text"
                    placeholder="sk-..."
                    value={values[field.key] || ''}
                    onChange={e => setValues(v => ({ ...v, [field.key]: e.target.value }))}
                    className={`w-full px-3 py-2 rounded-lg text-[14px] outline-none transition-colors ${
                      isDark
                        ? 'bg-[#1C1C1E] border border-[#3A3A3C] text-white placeholder-slate-500 focus:border-[#0A84FF]'
                        : 'bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:border-[#007AFF]'
                    }`}
                  />
                </div>
              )}
              {field && field.helpUrl && (
                <button
                  onClick={() => window.__TAURI__.core.invoke('open_external_url', { url: field.helpUrl })}
                  className={`text-[13px] ${isDark ? 'text-[#0A84FF]' : 'text-[#007AFF]'} hover:underline`}
                >
                  免费获取 →
                </button>
              )}
              {field && field.helpText && (
                <div className={`text-[12px] mt-1 leading-relaxed ${isDark ? 'text-slate-500' : 'text-slate-400'}`}>
                  {field.helpText}
                </div>
              )}
            </div>
            <div className={`border-t ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
              <button
                onClick={onCancel}
                className={`w-full py-3 text-[17px] font-normal text-center transition-colors ${isDark ? 'text-[#0A84FF] active:bg-white/5' : 'text-[#007AFF] active:bg-slate-100'}`}
              >
                取消
              </button>
            </div>
            <div className={`border-t ${isDark ? 'border-white/10' : 'border-slate-200'}`}>
              <button
                onClick={() => canSubmit && onConfirm(values)}
                disabled={!canSubmit}
                className={`w-full py-3 text-[17px] font-semibold text-center transition-colors ${
                  canSubmit
                    ? (isDark ? 'text-[#0A84FF] active:bg-white/5' : 'text-[#007AFF] active:bg-slate-100')
                    : (isDark ? 'text-slate-600' : 'text-slate-300')
                }`}
              >
                安装
              </button>
            </div>
          </div>
        </div>
      );
    };

    const ToolStoreView = ({ theme, onNewChat }) => {
      const isDark = theme === 'dark';
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('all');
      const [selectedTool, setSelectedTool] = useState(null);
      const featuredScrollRef = useRef(null);
      const [isFeaturedHovered, setIsFeaturedHovered] = useState(false);
      const [toolStates, setToolStates] = useState({});
      const [busyId, setBusyId] = useState(null);
      const [alert, setAlert] = useState({ visible: false, loading: false, title: '', subtitle: '', isInstall: false, isError: false });
      const [configDialog, setConfigDialog] = useState(null); // { backendId, name, fields }

      // 合并后端安装状态到 mock 数据
      const tools = tsToolsData.map(t => ({
        ...t,
        installed: t.backendId ? (toolStates[t.backendId] || false) : false,
      }));

      const filteredTools = tools.filter(tool => {
        const matchesSearch = tool.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              tool.desc.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCategory = activeCategory === 'all' || tool.category === activeCategory;
        return matchesSearch && matchesCategory;
      }).sort((a, b) => {
        if (a.backendId && !b.backendId) return -1;
        if (!a.backendId && b.backendId) return 1;
        if (a.installed && !b.installed) return -1;
        if (!a.installed && b.installed) return 1;
        return 0;
      });

      // 从后端加载已安装状态
      const loadBackendState = async () => {
        try {
          const list = await window.__TAURI__.core.invoke('list_marketplace_tools');
          const states = {};
          list.forEach(t => { states[t.id] = t.installed; });
          setToolStates(states);
        } catch (e) {
          console.error('list_marketplace_tools failed:', e);
        }
      };

      useEffect(() => { loadBackendState(); }, []);

      // 执行安装（已拿到 config 或无需 config）
      const doInstall = async (backendId, userConfig) => {
        const t = tsToolsData.find(x => x.backendId === backendId);
        const name = t ? t.title : backendId;
        const hasPipDeps = !t?.configFields || t.configFields.length === 0; // 无 config 的本地工具可能有 pip deps
        setBusyId(backendId);
        if (hasPipDeps) {
          setAlert({ loading: true, visible: false, title: `正在安装「${name}」`, subtitle: '首次安装需下载依赖，请耐心等待…', isInstall: true, isError: false });
        }
        try {
          const args = { toolId: backendId };
          if (userConfig && Object.keys(userConfig).length > 0) {
            args.config = userConfig;
          }
          await window.__TAURI__.core.invoke('install_marketplace_tool', args);
          await loadBackendState();
          setAlert({ visible: true, loading: false, title: `已安装「${name}」`, isInstall: true, isError: false, toolId: backendId });
          if (selectedTool && selectedTool.backendId === backendId) {
            setSelectedTool(prev => ({ ...prev, installed: true }));
          }
        } catch (e) {
          console.error('install failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isInstall: false, isError: true });
        } finally {
          setBusyId(null);
        }
      };

      // 安装/卸载入口
      const handleAction = async (backendId, isInstalled) => {
        const t = tsToolsData.find(x => x.backendId === backendId);
        const name = t ? t.title : backendId;

        // 安装：有 configFields 的工具先弹配置弹窗
        if (!isInstalled) {
          if (t?.configFields && t.configFields.length > 0) {
            setConfigDialog({ backendId, name, fields: t.configFields });
            return;
          }
          return doInstall(backendId, {});
        }

        // 卸载
        setBusyId(backendId);
        try {
          await window.__TAURI__.core.invoke('uninstall_marketplace_tool', { toolId: backendId });
          await loadBackendState();
          setAlert({ visible: true, loading: false, title: `已卸载「${name}」`, isInstall: false, isError: false });
          if (selectedTool && selectedTool.backendId === backendId) {
            setSelectedTool(prev => ({ ...prev, installed: false }));
          }
        } catch (e) {
          console.error('uninstall failed:', e);
          setAlert({ visible: true, loading: false, title: '操作失败，请重试', isInstall: false, isError: true });
        } finally {
          setBusyId(null);
        }
      };

      useEffect(() => {
        if (selectedTool) document.body.style.overflow = 'hidden';
        else document.body.style.overflow = 'unset';
        return () => { document.body.style.overflow = 'unset'; };
      }, [selectedTool]);

      useEffect(() => {
        if (isFeaturedHovered || searchQuery !== '' || activeCategory !== 'all') return;
        const interval = setInterval(() => {
          if (featuredScrollRef.current) {
            const { scrollLeft, scrollWidth, clientWidth } = featuredScrollRef.current;
            if (scrollLeft + clientWidth >= scrollWidth - 50) {
              featuredScrollRef.current.scrollTo({ left: 0, behavior: 'smooth' });
            } else {
              featuredScrollRef.current.scrollBy({ left: 424, behavior: 'smooth' });
            }
          }
        }, 4000);
        return () => clearInterval(interval);
      }, [isFeaturedHovered, searchQuery, activeCategory]);

      const handleScrollFeatured = (direction) => {
        if (featuredScrollRef.current) {
          featuredScrollRef.current.scrollBy({
            left: direction === 'left' ? -424 : 424,
            behavior: 'smooth'
          });
        }
      };

      return (
        <div className={`${isDark ? 'dark' : ''} flex-1 flex flex-col w-full h-full relative z-10 overflow-hidden antialiased selection:bg-blue-200 dark:selection:bg-blue-900`}>
          <TsAlert alert={alert} theme={theme} onDismiss={() => setAlert(a => ({ ...a, visible: false }))} onNewChat={() => { const tid = alert.toolId; setAlert(a => ({ ...a, visible: false })); if (onNewChat) onNewChat(tid); }} />
          <TsConfigDialog
            config={configDialog}
            theme={theme}
            onCancel={() => setConfigDialog(null)}
            onConfirm={(values) => { setConfigDialog(null); doInstall(configDialog.backendId, values); }}
          />
          <div className="flex-1 flex flex-col bg-white dark:bg-black text-slate-900 dark:text-white transition-colors duration-300 font-sans overflow-hidden">

            {/* Header */}
            <header className="shrink-0 bg-white/80 dark:bg-black/80 backdrop-blur-2xl border-b border-slate-200/50 dark:border-white/10 pt-6 pb-4 px-6 md:px-10 transition-colors">
              <div className="max-w-7xl mx-auto flex flex-col gap-5">
                <div className="flex items-center gap-3">
                  <Puzzle className="text-blue-600 dark:text-blue-500" size={32} strokeWidth={2.5} />
                  <h1 className="text-3xl font-extrabold tracking-tight">探索工具</h1>
                </div>
                <div className="relative group">
                  <Search className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors" size={20} />
                  <input
                    type="text"
                    placeholder="搜索 MCP、API 或工作流工具"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-11 pr-4 py-3 bg-slate-100 dark:bg-[#1C1C1E] border-none rounded-2xl text-[17px] focus:ring-2 focus:ring-blue-500/50 outline-none transition-all placeholder:text-slate-500 text-slate-900 dark:text-white"
                  />
                </div>
              </div>
            </header>

            {/* Main scrollable area */}
            <main className="flex-1 overflow-y-auto custom-scrollbar">
              <div className="max-w-7xl mx-auto px-6 md:px-10 py-8 space-y-12">

                {/* Featured carousel */}
                {searchQuery === '' && activeCategory === 'all' && (
                  <section
                    className="relative group/featured"
                    onMouseEnter={() => setIsFeaturedHovered(true)}
                    onMouseLeave={() => setIsFeaturedHovered(false)}
                  >
                    <div className="flex items-end justify-between mb-5">
                      <h2 className="text-2xl font-bold tracking-tight">精选能力推荐</h2>
                    </div>

                    <button
                      onClick={(e) => { e.stopPropagation(); handleScrollFeatured('left'); }}
                      className="absolute -left-5 top-[55%] -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md shadow-[0_4px_20px_rgba(0,0,0,0.15)] dark:shadow-[0_4px_20px_rgba(0,0,0,0.5)] flex items-center justify-center text-slate-800 dark:text-slate-200 opacity-0 group-hover/featured:opacity-100 hover:scale-110 transition-all border border-slate-200 dark:border-slate-700 hidden md:flex"
                    >
                      <ChevronLeft size={26} />
                    </button>
                    <button
                      onClick={(e) => { e.stopPropagation(); handleScrollFeatured('right'); }}
                      className="absolute -right-5 top-[55%] -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md shadow-[0_4px_20px_rgba(0,0,0,0.15)] dark:shadow-[0_4px_20px_rgba(0,0,0,0.5)] flex items-center justify-center text-slate-800 dark:text-slate-200 opacity-0 group-hover/featured:opacity-100 hover:scale-110 transition-all border border-slate-200 dark:border-slate-700 hidden md:flex"
                    >
                      <ChevronRight size={26} />
                    </button>

                    <div
                      ref={featuredScrollRef}
                      className="flex gap-6 overflow-x-auto snap-x snap-mandatory pb-6 no-scrollbar relative"
                      style={{ scrollbarWidth: 'none' }}
                    >
                      {tsFeaturedCollections.map((collection) => {
                        const featTool = tools.find(a => a.id === collection.featuredToolId);
                        return (
                          <div
                            key={collection.id}
                            onClick={() => setSelectedTool(featTool)}
                            className="relative min-w-[320px] md:min-w-[400px] h-[440px] rounded-[32px] snap-center shrink-0 overflow-hidden cursor-pointer group shadow-sm hover:shadow-xl dark:shadow-none border border-slate-200/50 dark:border-white/10 transition-all duration-500"
                          >
                            <div className={`absolute inset-0 ${collection.bg} transition-transform duration-700 group-hover:scale-105`} />
                            <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60" />

                            <div className="absolute top-0 left-0 w-full p-8 text-white z-10">
                              <span className="text-xs font-bold text-white/70 uppercase tracking-widest mb-1.5 block">{collection.label}</span>
                              <h3 className="text-[28px] font-bold tracking-tight leading-tight mb-3 text-white drop-shadow-sm">{collection.title}</h3>
                              <p className="text-white/80 text-[15px] font-medium leading-relaxed max-w-[90%] drop-shadow-sm">{collection.subtitle}</p>
                            </div>

                            {featTool && (
                              <div className="absolute bottom-6 left-6 right-6 z-10">
                                <div className="bg-white/20 dark:bg-black/40 backdrop-blur-3xl border border-white/20 dark:border-white/10 rounded-2xl p-4 flex items-center gap-4 transition-transform group-hover:-translate-y-1">
                                  <div className={`w-14 h-14 rounded-[14px] flex items-center justify-center flex-shrink-0 ${featTool.color} text-white shadow-inner`}>
                                    <featTool.icon size={26} strokeWidth={1.5} />
                                  </div>
                                  <div className="flex-1 min-w-0">
                                    <h4 className="text-base font-bold text-white truncate drop-shadow-sm">{featTool.title}</h4>
                                    <p className="text-xs text-white/70 truncate flex items-center gap-1.5">
                                      <Cpu size={12} /> {featTool.type}
                                    </p>
                                  </div>
                                  <TsActionBtn tool={featTool} busy={busyId === featTool.backendId} onAction={handleAction} />
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </section>
                )}

                {/* Category filter + tool list */}
                <section>
                  <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6 border-b border-slate-200 dark:border-white/10 pb-5">
                    <h2 className="text-2xl font-bold tracking-tight">
                      {searchQuery ? '检索结果' : '热门协议与接口'}
                    </h2>
                    <div className="flex p-1 bg-slate-100 dark:bg-[#1C1C1E] rounded-xl overflow-x-auto no-scrollbar border border-slate-200/50 dark:border-white/5">
                      {tsCategories.map((cat) => {
                        const isActive = activeCategory === cat.id;
                        return (
                          <button
                            key={cat.id}
                            onClick={() => setActiveCategory(cat.id)}
                            className={`px-5 py-1.5 rounded-lg text-[14px] font-semibold whitespace-nowrap transition-all duration-300 ${
                              isActive
                                ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm ring-1 ring-black/5 dark:ring-white/10'
                                : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
                            }`}
                          >
                            {cat.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {filteredTools.length > 0 ? (
                    <div className="grid gap-x-10 gap-y-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))' }}>
                      {filteredTools.map((tool) => (
                        <div
                          key={tool.id}
                          onClick={() => setSelectedTool(tool)}
                          className="group flex items-center gap-4 py-3 cursor-pointer hover:bg-slate-50 dark:hover:bg-[#1C1C1E]/50 rounded-2xl px-3 -mx-3 transition-colors border-b border-slate-100 dark:border-white/5 last:border-0"
                        >
                          <div className={`w-16 h-16 rounded-[16px] flex items-center justify-center flex-shrink-0 ${tool.color} text-white shadow-sm group-hover:shadow transition-shadow border border-black/5 dark:border-white/5`}>
                            <tool.icon size={30} strokeWidth={1.5} />
                          </div>
                          <div className="flex-1 min-w-0 flex flex-col justify-center py-1">
                            <h3 className="text-[17px] font-semibold text-slate-900 dark:text-white truncate tracking-tight">{tool.title}</h3>
                            <p className="text-[13px] text-slate-500 dark:text-slate-400 truncate mt-0.5 font-medium">{tool.subtitle}</p>
                            <div className="flex items-center gap-2 mt-1.5">
                              <span className="text-[10px] font-semibold text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded uppercase tracking-wide">{tool.type}</span>
                              {tool.authRequired && (
                                <span className="text-[10px] text-amber-500/80 dark:text-amber-400/80 flex items-center gap-0.5">
                                  <Zap size={10} /> 需密钥
                                </span>
                              )}
                            </div>
                          </div>
                          <div className="flex flex-col items-center justify-center gap-1 pl-2">
                            <TsActionBtn tool={tool} busy={busyId === tool.backendId} onAction={handleAction} />
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="py-24 text-center flex flex-col items-center">
                      <div className="w-16 h-16 mb-4 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400">
                        <Server size={28} />
                      </div>
                      <h3 className="text-xl font-semibold text-slate-800 dark:text-slate-200 mb-2">未检索到工具</h3>
                      <p className="text-slate-500 dark:text-slate-400">请尝试修改搜索词或查阅 API 开发文档。</p>
                    </div>
                  )}
                </section>

              </div>
            </main>
          </div>

          {/* Detail modal */}
          {selectedTool && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/40 dark:bg-black/60 backdrop-blur-md transition-all duration-300"
              onClick={() => setSelectedTool(null)}
            >
              <div
                className="ts-modal-in relative w-full max-w-2xl bg-white dark:bg-[#1C1C1E] rounded-[32px] shadow-2xl overflow-hidden flex flex-col max-h-[90vh] border border-slate-200/50 dark:border-white/10"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="absolute top-0 right-0 w-full px-6 py-5 flex items-center justify-end z-20 pointer-events-none">
                  <button
                    onClick={() => setSelectedTool(null)}
                    className="pointer-events-auto w-8 h-8 flex items-center justify-center rounded-full bg-slate-100/80 dark:bg-black/50 backdrop-blur text-slate-500 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-black transition-colors"
                  >
                    <XIcon size={18} />
                  </button>
                </div>

                <div className="overflow-y-auto p-6 sm:p-10 no-scrollbar pt-12">
                  <div className="flex flex-col sm:flex-row items-start gap-6 sm:gap-8 mb-8">
                    <div className={`w-28 h-28 sm:w-32 sm:h-32 rounded-[28px] sm:rounded-[32px] flex items-center justify-center flex-shrink-0 ${selectedTool.color} shadow-md border border-black/5 dark:border-white/5`}>
                      <selectedTool.icon size={56} strokeWidth={1.5} className="text-white" />
                    </div>
                    <div className="flex-1">
                      <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mb-2 tracking-tight">{selectedTool.title}</h2>
                      <p className="text-[17px] text-slate-500 dark:text-slate-400 mb-5 font-medium">{selectedTool.subtitle}</p>
                      <div className="flex items-center gap-4">
                        <TsActionBtn tool={selectedTool} busy={busyId === selectedTool.backendId} onAction={handleAction} size="lg" />
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between py-5 mb-8 border-y border-slate-100 dark:border-white/5 overflow-x-auto no-scrollbar gap-8">
                    <div className="flex flex-col flex-shrink-0">
                      <span className="text-[11px] text-slate-500 font-semibold uppercase tracking-wider mb-1">接口类型</span>
                      <span className="text-xl font-bold text-slate-800 dark:text-slate-200">{selectedTool.type}</span>
                      <span className="text-[12px] text-slate-400 mt-1 flex items-center gap-1"><Server size={12}/> 官方支持</span>
                    </div>
                    <div className="w-px h-12 bg-slate-200 dark:bg-slate-800 flex-shrink-0" />
                    <div className="flex flex-col flex-shrink-0">
                      <span className="text-[11px] text-slate-500 font-semibold uppercase tracking-wider mb-1">当前版本</span>
                      <span className="text-xl font-bold text-slate-800 dark:text-slate-200">{selectedTool.version}</span>
                      <span className="text-[12px] text-slate-400 mt-1">稳定版发布</span>
                    </div>
                    <div className="w-px h-12 bg-slate-200 dark:bg-slate-800 flex-shrink-0" />
                    <div className="flex flex-col flex-shrink-0 pr-4">
                      <span className="text-[11px] text-slate-500 font-semibold uppercase tracking-wider mb-1">平均延迟</span>
                      <span className="text-xl font-bold text-slate-800 dark:text-slate-200">{selectedTool.latency}</span>
                      <span className="text-[12px] text-slate-400 mt-1 flex items-center gap-1"><Globe size={12}/> 全球加速</span>
                    </div>
                  </div>

                  <div>
                    <h3 className="text-[19px] font-bold text-slate-900 dark:text-white mb-4">关于此能力</h3>
                    <div className="text-slate-600 dark:text-slate-300 leading-relaxed text-[15px] space-y-4 font-medium">
                      <p>{selectedTool.desc}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // Shared Components
    // ==========================================

    const NavItem = ({ icon, label, active, theme, isSidebarOpen = true, onClick }) => {
      const isDark = theme === 'dark';
      return (
        <div
          onClick={onClick}
          title={!isSidebarOpen ? label : ""}
          className={`flex items-center cursor-pointer text-[15px] font-medium transition-colors overflow-hidden
          ${isSidebarOpen ? 'px-4 py-3 rounded-full w-full' : 'w-10 h-10 justify-center rounded-full mx-auto shrink-0'}
          ${active
            ? (isDark ? 'bg-[#A8C7FA] text-[#041E49]' : 'bg-[#D3E3FD] text-[#041E49]')
            : (isDark ? 'text-[#E3E3E3] hover:bg-[#282A2C]' : 'text-[#1F1F1F] hover:bg-[#E1E5EA]')}`}
        >
          <div className={`${isSidebarOpen ? 'mr-4' : ''} shrink-0 ${active ? (isDark ? 'text-[#041E49]' : 'text-[#0B57D0]') : ''}`}>
            {icon}
          </div>
          {isSidebarOpen && <span className="whitespace-nowrap">{label}</span>}
        </div>
      );
    };

    // 近期会话项：支持重命名(内联编辑) + 删除(内联二次确认)
    const RecentItem = ({ chat, active, theme, onSelect, onRename, onDelete }) => {
      const isDark = theme === 'dark';
      const [editing, setEditing] = useState(false);
      const [confirming, setConfirming] = useState(false);
      const [val, setVal] = useState(chat.title);
      function save() { const tx = val.trim(); setEditing(false); if (tx && tx !== chat.title) onRename(chat.id, tx); }
      if (editing) {
        return (
          <div className="px-1.5 py-0.5">
            <input autoFocus value={val}
              onChange={e => setVal(e.target.value)}
              onClick={e => e.stopPropagation()}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); save(); } else if (e.key === 'Escape') { setEditing(false); setVal(chat.title); } }}
              onBlur={save}
              className={`w-full px-3 py-1 rounded-full text-[14px] outline-none ${isDark ? 'bg-[#131314] text-[#E3E3E3] ring-1 ring-[#A8C7FA]' : 'bg-white text-[#1F1F1F] ring-1 ring-[#0B57D0]'}`} />
          </div>
        );
      }
      return (
        <div onClick={() => onSelect(chat.id)}
          className={`group flex items-center px-4 py-1.5 rounded-full cursor-pointer text-[13px] transition-all
            ${active ? (isDark ? 'bg-[#333537] text-white' : 'bg-[#E1E5EA] text-[#1F1F1F]')
                     : (isDark ? 'text-[#BDC1C6] hover:bg-[#282A2C] hover:text-[#E3E3E3]' : 'text-[#5F6368] hover:bg-[#E1E5EA] hover:text-[#1F1F1F]')}`}>
          <span className="truncate pr-2 leading-relaxed whitespace-nowrap flex-1">{chat.title}</span>
          {chat.working && <span className="shrink-0 mr-1 inline-block w-2 h-2 rounded-full bg-current opacity-70 animate-pulse" title="正在生成中"></span>}
          {chat.skill && <span className="text-[11px] shrink-0 opacity-70 mr-1" title={chat.skill}>🧭</span>}
          {confirming ? (
            <div className="flex items-center gap-0.5 shrink-0" onClick={e => e.stopPropagation()}>
              <span className={`text-[11px] mr-0.5 ${isDark ? 'text-[#F28B82]' : 'text-[#C5221F]'}`}>删除?</span>
              <button title="确认删除" onClick={(e) => { e.stopPropagation(); onDelete(chat.id); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center text-[12px] ${isDark ? 'text-[#F28B82] hover:bg-[#5c2b29]' : 'text-[#C5221F] hover:bg-[#FAD2CF]'}`}>✓</button>
              <button title="取消" onClick={(e) => { e.stopPropagation(); setConfirming(false); }}
                className={`w-6 h-6 rounded-full flex items-center justify-center text-[12px] ${isDark ? 'hover:bg-[#444746]' : 'hover:bg-[#D3D7DB]'}`}>✗</button>
            </div>
          ) : (
            <>
              {/* 默认: 显示日期(辨识每条会话什么时候发生);hover/active 时换成编辑/删除按钮 */}
              {chat.date && (
                <span className={`text-[11px] shrink-0 opacity-60 whitespace-nowrap group-hover:hidden ${isDark ? 'text-[#9AA0A6]' : 'text-[#5F6368]'}`}>
                  {chat.date}
                </span>
              )}
              <div className="hidden group-hover:flex items-center gap-0.5 shrink-0">
                <button title="重命名" onClick={(e) => { e.stopPropagation(); setVal(chat.title); setEditing(true); }}
                  className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] ${isDark ? 'hover:bg-[#444746]' : 'hover:bg-[#D3D7DB]'}`}>✏️</button>
                <button title="删除" onClick={(e) => { e.stopPropagation(); setConfirming(true); }}
                  className={`w-6 h-6 rounded-full flex items-center justify-center text-[11px] ${isDark ? 'hover:bg-[#5c2b29]' : 'hover:bg-[#FAD2CF]'}`}>🗑</button>
              </div>
            </>
          )}
        </div>
      );
    };

    const WidgetCard = ({ title, children, theme }) => {
      const isDark = theme === 'dark';
      return (
        <div className={`rounded-[24px] p-8 flex flex-col transition-shadow hover:shadow-md ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
          <div className={`text-[14px] font-medium tracking-wide mb-6 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>
            {title}
          </div>
          <div className="flex-1 flex flex-col">
            {children}
          </div>
        </div>
      );
    };

    const ProgressBar = ({ label, value, subValue, percentage, theme, color = "#0B57D0" }) => {
      const isDark = theme === 'dark';
      return (
        <div>
          <div className="flex justify-between items-end mb-2">
            <span className={`text-[14px] ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{label}</span>
            <div className="text-right">
              <span className={`text-[16px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{value}</span>
              {subValue && <span className={`text-[13px] ml-2 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{subValue}</span>}
            </div>
          </div>
          <div className={`h-2 w-full rounded-full overflow-hidden ${isDark ? 'bg-[#333537]' : 'bg-[#E1E5EA]'}`}>
            <div
              className="h-full rounded-full transition-all duration-1000 ease-out"
              style={{ width: `${percentage > 0 ? percentage : 100}%`, backgroundColor: percentage > 0 ? color : (isDark ? '#444746' : '#C4C7C5') }}
            ></div>
          </div>
        </div>
      );
    };

    const ListRow = ({ label, value, border = true, theme }) => {
      const isDark = theme === 'dark';
      return (
        <div className="flex justify-between items-center px-4 py-3 relative">
          <span className={`text-[14px] ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{label}</span>
          <span className={`text-[14px] font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{value}</span>
          {border && <div className={`absolute bottom-0 right-4 left-4 h-[1px] ${isDark ? 'bg-white/5' : 'bg-black/5'}`}></div>}
        </div>
      );
    };

    // ==========================================
    // Render
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
