    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Chat message styles */
    .msg-md h1,.msg-md h2,.msg-md h3,.msg-md h4 { font-weight:600; margin:0.6em 0 0.3em; }
    .msg-md h1 { font-size:1.4em; } .msg-md h2 { font-size:1.2em; } .msg-md h3 { font-size:1.05em; }
    .msg-md p { margin:0.4em 0; line-height:1.7; }
    .msg-md ul,.msg-md ol { padding-left:1.5em; margin:0.4em 0; }
    .msg-md li { margin:0.2em 0; line-height:1.6; }
    .msg-md code { font-family:"JetBrains Mono","SF Mono",Consolas,monospace; font-size:0.88em; padding:0.15em 0.4em; border-radius:6px; }
    .msg-md pre { margin:0.6em 0; padding:1em; border-radius:12px; overflow-x:auto; font-size:0.88em; line-height:1.5; }

    .msg-md pre code { padding:0; background:none; }
    .msg-md blockquote { border-left:3px solid rgba(128,128,128,0.4); padding-left:1em; margin:0.5em 0; opacity:0.85; }
    .msg-md a { text-decoration:underline; }
    .msg-md table { border-collapse:collapse; margin:0.5em 0; font-size:0.92em; }
    .msg-md th,.msg-md td { border:1px solid rgba(128,128,128,0.3); padding:0.4em 0.8em; }

    /* Dark theme code blocks */
    .dark-code .msg-md code { background:rgba(255,255,255,0.08); color:#E3E3E3; }
    .dark-code .msg-md pre { background:rgba(0,0,0,0.3); color:#E3E3E3; }
    /* Light theme code blocks */
    .light-code .msg-md code { background:rgba(0,0,0,0.06); color:#1F1F1F; }
    .light-code .msg-md pre { background:rgba(0,0,0,0.04); color:#1F1F1F; }

    /* Tool card styles */
    .tool-card-output { max-height:200px; overflow-y:auto; font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-all; }

    /* Streaming cursor */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .streaming-cursor::after { content:"▊"; animation:blink 1s step-end infinite; margin-left:2px; }

    /* Thinking animation */
    @keyframes spin-braille { 0%{content:"⠋"} 10%{content:"⠙"} 20%{content:"⠹"} 30%{content:"⠸"} 40%{content:"⠼"} 50%{content:"⠴"} 60%{content:"⠦"} 70%{content:"⠧"} 80%{content:"⠇"} 90%{content:"⠏"} }

    /* Tool Store */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes tsModalIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
    .ts-modal-in { animation: tsModalIn 0.2s ease-out; }
    @keyframes tsAlertIn { from { opacity:0; transform:scale(1.05); } to { opacity:1; transform:scale(1); } }
    @keyframes tsSpinner { to { transform: rotate(360deg); } }
  </style>

        <div data-tauri-drag-region
          className={`h-9 shrink-0 flex items-center justify-between select-none ${isDark ? 'bg-[#131314] text-[#E3E3E3]' : 'bg-[#F0F4F9] text-[#1F1F1F]'}`}>
          <div data-tauri-drag-region className="flex items-center gap-2 px-3 text-[13px] font-medium pointer-events-none">
            <Sparkles size={15} className={isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'} />
            PINVOU 智能助手
          </div>
          <div className="flex items-center h-full">
            <button onClick={() => appWindow && appWindow.minimize()} title="最小化"
              className={`h-full w-12 flex items-center justify-center transition-colors ${hoverBg}`}>
              <svg width="11" height="11" viewBox="0 0 11 11"><rect x="1" y="5" width="9" height="1" fill="currentColor"/></svg>

              className={`h-full w-12 flex items-center justify-center transition-colors ${hoverBg}`}>
              <svg width="11" height="11" viewBox="0 0 11 11"><rect x="1.5" y="1.5" width="8" height="8" fill="none" stroke="currentColor" strokeWidth="1"/></svg>

            <button onClick={() => appWindow && appWindow.close()} title="关闭"
              className="h-full w-12 flex items-center justify-center transition-colors hover:bg-[#E81123] hover:text-white">
              <svg width="11" height="11" viewBox="0 0 11 11"><path d="M1 1 L10 10 M10 1 L1 10" stroke="currentColor" strokeWidth="1.1"/></svg>
            </button>

      );
    };

    /* ==========================================
       App — 1:1 matching 前端.html structure
       ========================================== */
    const App = () => {
      const bs = useBridge();
      const [activeChat, setActiveChat] = useState(null);
      const [currentView, setCurrentView] = useState('chat');
      const [activeTheme, setActiveTheme] = useState('dark');
      const [language, setLanguage] = useState('zh');
      const [superPerm, setSuperPerm] = useState(false);
      // search 后端配置:provider 默认 bing(对齐 bridge prefs::SearchProvider::default());
      // bs.settings 加载后 useEffect 同步进来。
      const [searchProvider, setSearchProvider] = useState('bing');
      const [searchApiKey, setSearchApiKey] = useState('');
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [chatPrefill, setChatPrefill] = useState('');

      const t = dict[language];

      function handleActivateSkill(name) {
        if (bridge.available) bridge.activateSkill(name);
        setChatPrefill('我要用 ' + name + ' 完成: ');
        setCurrentView('chat');
      }

      // Sync from bridge state
      useEffect(() => {
        if (!bs) return;
        if (bs.activeSessionId && bs.activeSessionId !== activeChat) {
          setActiveChat(bs.activeSessionId);
          if (currentView !== 'monitor' && currentView !== 'settings' && currentView !== 'search') {
            setCurrentView('chat');
          }
        }
        if (bs.superPermEnabled !== superPerm) setSuperPerm(bs.superPermEnabled);
        // 从 bs.settings 同步 search 配置。bs.settings 是后端 UserPrefs JSON。
        if (bs.settings && bs.settings.search) {
          const sp = bs.settings.search.provider || 'bing';
          if (sp !== searchProvider) setSearchProvider(sp);
          const k = bs.settings.search.api_key || '';
          if (k !== searchApiKey) setSearchApiKey(k);
        }
      }, [bs]);

      // Build chat history from sessions
      const skillBindings = (bs && bs.workflow && bs.workflow.bindings) || {};
      const sessionBusy = (bs && bs.sessionBusy) || {};
      const chatHistory = bs && bs.sessions ? bs.sessions.map(s => ({
        id: s.id,
        title: s.title || '新对话',
        date: formatSessionDate(s.updated_at || s.created_at, language),
        skill: skillBindings[s.id] || null,
        working: !!sessionBusy[s.id], // 多 session 并发:该 session 是否正在后台生成
      })) : [];

      const [justInstalledTool, setJustInstalledTool] = useState(null);

      function handleNewChat(installedToolId) {
        if (bridge.available) bridge.createNewSession();
        setCurrentView('chat');
        if (installedToolId) {
          setJustInstalledTool(installedToolId);
        }
      }

      function handleSwitchSession(id) {
        if (bridge.available) bridge.switchToSession(id);
        setActiveChat(id);
        setCurrentView('chat');
      }

      function handleDeleteSession(id) {
        if (bridge.available) bridge.deleteSession(id);
      }

      function handleRenameSession(id, title) {
        if (bridge.available) bridge.renameSession(id, title);
      }

      function handleToggleSuperPerm() {
        if (bridge.available) bridge.toggleSuperPerm();
        else setSuperPerm(!superPerm);
      }

      // 构造完整 UserPrefs 对象写盘。spread bs.settings 保留 search/advanced 等
      // 其他字段——之前漏 spread 会让后端 serde default 把它们重置(bug fix)。
      function buildFullSettings(overrides) {
        const base = (bs && bs.settings) ? bs.settings : {};
        return {
          ...base,
          theme: activeTheme === 'dark' ? 'genesis' : 'light',
          language: language === 'zh' ? 'zh-Hans' : 'en',
          search: {
            provider: searchProvider,
            api_key: searchApiKey ? searchApiKey : null,
          },
          ...overrides,
        };
      }

      function handleSetTheme(th) {
        setActiveTheme(th);
        if (bridge.available) {
          bridge.saveSettings(buildFullSettings({ theme: th === 'dark' ? 'genesis' : 'light' }));
        }
      }

      function handleSetSearchProvider(p) {
        setSearchProvider(p);
        if (bridge.available) {
          bridge.saveSettings(buildFullSettings({
            search: { provider: p, api_key: searchApiKey ? searchApiKey : null },
          }));
        }
      }

      function handleSetSearchApiKey(k) {
        setSearchApiKey(k);
        if (bridge.available) {
          bridge.saveSettings(buildFullSettings({
            search: { provider: searchProvider, api_key: k ? k : null },
          }));
        }
      }

      function handleSetLanguage(lang) {
        setLanguage(lang);
        if (bridge.available) {
          bridge.saveSettings(buildFullSettings({ language: lang === 'zh' ? 'zh-Hans' : 'en' }));
        }
      }

      return (
        <div className={`flex flex-col h-screen font-sans overflow-hidden antialiased transition-colors duration-300 ${activeTheme === 'dark' ? 'bg-[#131314] text-[#E3E3E3]' : 'bg-white text-[#1F1F1F]'}`}>

          <TitleBar theme={activeTheme} />

          <div className="flex flex-1 min-h-0">

          {/* ================= Sidebar (Gemini Style) ================= */}
          <div className={`${isSidebarOpen ? 'w-[280px] bg-[#1E1F20]' : 'w-[68px] bg-[#131314]'} shrink-0 flex flex-col z-40 transition-all duration-300 ${activeTheme === 'light' ? 'bg-[#F0F4F9]' : ''}`}>

            {/* Header / Logo */}
            <div className={`px-4 py-4 flex items-center ${isSidebarOpen ? 'gap-3' : 'justify-center'} overflow-hidden`}>
              <button
                onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                title={isSidebarOpen ? "收起侧边栏" : "展开侧边栏"}
                className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${activeTheme === 'dark' ? 'hover:bg-[#333537]' : 'hover:bg-[#E1E5EA]'}`}
              >
                <Menu size={20} className={activeTheme === 'dark' ? 'text-[#E3E3E3]' : 'text-[#444746]'} />
              </button>
              <span className={`text-[18px] font-medium tracking-wide flex items-center gap-2 whitespace-nowrap transition-opacity duration-200 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 w-0'}`}>
                <Sparkles size={20} className={activeTheme === 'dark' ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'} />
                PINVOU
              </span>
            </div>

            {/* Navigation — shrink-0 固定不滚动,list 再多也不挤压 nav */}
            <div className={`shrink-0 flex flex-col gap-1 mt-3 ${isSidebarOpen ? 'px-3' : 'px-2 items-center'}`}>
              <NavItem
                icon={<Edit2 size={18} />} label={t.newChat}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={handleNewChat}
              />
              <NavItem
                icon={<Search size={18} />} label={t.searchChats}
                active={currentView === 'search'}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={() => setCurrentView('search')}
              />
              <NavItem
                icon={<BarChart2 size={18} />} label={t.monitor}
                active={currentView === 'monitor'}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={() => setCurrentView('monitor')}
              />
              <NavItem
                icon={<ClipboardList size={18} />} label={t.workflow}
                active={currentView === 'workflow'}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={() => setCurrentView('workflow')}
              />
              <NavItem
                icon={<Puzzle size={18} />} label={t.toolStore}
                active={currentView === 'toolStore'}
                theme={activeTheme}
                isSidebarOpen={isSidebarOpen}
                onClick={() => setCurrentView('toolStore')}
              />
            </div>

            {/* Recents — 独立 flex-1 + overflow-y-auto,只在展开态显示。
                min-h-0 关键:flex 子项默认 min-height: auto 会阻止 overflow,
                显式压成 0 才允许内容溢出触发滚动条。
                nav / list 分隔:不用 hairline,「近期」label 上 padding 自然撑开。 */}
            {isSidebarOpen && (
              <div className="flex-1 min-h-0 overflow-y-auto custom-scrollbar px-3 flex flex-col">
                <div
                  className="text-[11px] font-medium px-4 pt-6 pb-1 whitespace-nowrap shrink-0"
                  style={{ color: activeTheme === 'dark' ? '#80868B' : '#5F6368', letterSpacing: '0.06em' }}
                >
                  {t.recent}
                </div>
                <div className="space-y-px">
                  {chatHistory.map((chat) => (
                    <RecentItem
                      key={chat.id}
                      chat={chat}
                      theme={activeTheme}
                      active={activeChat === chat.id && currentView === 'chat'}
                      onSelect={handleSwitchSession}
                      onRename={handleRenameSession}
                      onDelete={handleDeleteSession}
                    />
                  ))}
                </div>
              </div>
            )}

            {/* Footer Profile */}
            <div className={`p-3 mt-auto flex ${isSidebarOpen ? 'flex-row items-center justify-between' : 'flex-col items-center gap-3 pb-6'}`}>
              {!isSidebarOpen && (
                <button
                  onClick={() => setCurrentView('settings')}
                  title={t.settings}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${activeTheme === 'dark' ? 'text-[#E3E3E3] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#E1E5EA]'}`}
                >
                  <Settings size={18} />
                </button>
              )}
              <div className={`flex items-center ${isSidebarOpen ? 'px-2 gap-3' : 'justify-center'}`}>
                <div title={t.localEnv} className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-[12px] font-bold ${activeTheme === 'dark' ? 'bg-[#9580FF] text-white' : 'bg-[#7C3AED] text-white'}`}>
                  GB
                </div>
                {isSidebarOpen && (
                  <div className="flex flex-col whitespace-nowrap overflow-hidden">
                    <span className="text-[14px] font-medium leading-none mb-1">{t.localEnv}</span>
                    <span className={`text-[12px] ${activeTheme === 'dark' ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>GB10 Node</span>
                  </div>
                )}
              </div>
              {isSidebarOpen && (
                <button
                  onClick={() => setCurrentView('settings')}
                  title={t.settings}
                  className={`w-9 h-9 shrink-0 rounded-full flex items-center justify-center transition-colors ${activeTheme === 'dark' ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#E1E5EA]'}`}
                >
                  <Settings size={18} />
                </button>
              )}
            </div>
          </div>

          {/* ================= Main Content ================= */}
          <div className="flex-1 flex flex-col relative min-w-0 overflow-hidden">

            {/* Gemini Style Background Glow */}
            {currentView === 'chat' && (
              activeTheme === 'light' ? (
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[1200px] h-[800px] bg-[radial-gradient(ellipse_at_center,_rgba(232,240,254,0.8)_0%,_transparent_60%)] pointer-events-none z-0"></div>
              ) : (
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[40%] w-[1400px] h-[900px] bg-[radial-gradient(ellipse_at_center,_rgba(168,199,250,0.25)_0%,_transparent_60%)] pointer-events-none z-0"></div>
              )
            )}

            {currentView === 'monitor' && <MonitorView theme={activeTheme} t={t} bs={bs} />}
            {currentView === 'settings' && (
              <SettingsView
                activeTheme={activeTheme} setActiveTheme={handleSetTheme}
                language={language} setLanguage={handleSetLanguage}
                superPerm={superPerm} setSuperPerm={handleToggleSuperPerm}
                searchProvider={searchProvider} setSearchProvider={handleSetSearchProvider}
                searchApiKey={searchApiKey} setSearchApiKey={handleSetSearchApiKey}
                t={t}
              />
            )}
            {currentView === 'workflow' && <WorkflowView theme={activeTheme} t={t} bs={bs} onActivate={handleActivateSkill} />}
            {currentView === 'toolStore' && <ToolStoreView theme={activeTheme} onNewChat={handleNewChat} />}
            {currentView === 'chat' && <ChatView theme={activeTheme} t={t} bs={bs} prefill={chatPrefill} onPrefillConsumed={() => setChatPrefill('')} justInstalledTool={justInstalledTool} setJustInstalledTool={setJustInstalledTool} />}
            {currentView === 'search' && <SearchView theme={activeTheme} history={chatHistory} t={t} onSelect={handleSwitchSession} />}

          </div>
          </div>
        </div>
      );
    };

    /* ==========================================
       Helpers
       ========================================== */
    function formatSessionDate(ts, language) {
      if (!ts) return '';
      const d = new Date(typeof ts === 'number' ? ts : ts);
      const now = new Date();
      const diff = now - d;
      const zh = language === 'zh';
      if (diff < 86400000 && d.getDate() === now.getDate()) return zh ? '今天' : 'Today';
      if (diff < 172800000) return zh ? '昨天' : 'Yesterday';
      // 7 天内显示「X 天前」/「X days ago」,更早显示日期
      const days = Math.floor(diff / 86400000);
      if (days < 7) return zh ? `${days} 天前` : `${days}d ago`;
      return d.toLocaleDateString(zh ? 'zh-CN' : 'en-US', { month: 'short', day: 'numeric' });
    }

    // ==========================================
    // Search View (Gemini Style)
    // ==========================================
    const SearchView = ({ theme, history, t, onSelect }) => {
      const isDark = theme === 'dark';
      const [query, setQuery] = useState('');
      const filtered = query
        ? history.filter(h => h.title.toLowerCase().includes(query.toLowerCase()))
        : history;

      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">
          <div className="flex-1 overflow-y-auto custom-scrollbar px-6 pt-16 pb-20">
            <div className="max-w-[768px] mx-auto flex flex-col">

              {/* Centered Search Bar */}
              <div className={`flex items-center gap-3 px-6 py-4 rounded-full mb-10 transition-colors ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3]' : 'bg-[#F0F4F9] text-[#1F1F1F]'}`}>
                <Search size={22} className={isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'} />
                <input
                  type="text"
                  placeholder={t.searchPlaceholder}
                  value={query}
                  onChange={e => setQuery(e.target.value)}
                  className={`flex-1 bg-transparent border-none outline-none text-[16px] placeholder:text-[16px] ${isDark ? 'placeholder:text-[#C4C7C5]' : 'placeholder:text-[#444746]'}`}
                />
              </div>

              {/* List Section */}
              <div className={`text-[14px] font-medium mb-3 px-4 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>
                {t.recent}
              </div>

              <div className="flex flex-col">
                {filtered.map(chat => (
                  <div
                    key={chat.id}
                    onClick={() => onSelect && onSelect(chat.id)}
                    className={`flex justify-between items-center px-4 py-[14px] cursor-pointer rounded-[16px] transition-colors ${isDark ? 'hover:bg-[#1E1F20]' : 'hover:bg-[#F0F4F9]'}`}
                  >
                    <span className={`text-[15px] truncate pr-4 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                      {chat.title}
                    </span>
                    <span className={`text-[13px] shrink-0 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>
                      {chat.date}
                    </span>
                  </div>
                ))}
              </div>

            </div>
          </div>
        </div>
      );
    };


    // ==========================================
    // Monitor View (Material 3 Style)
    // ==========================================
    const MonitorView = ({ theme, t, bs }) => {
      const isDark = theme === 'dark';
      const fmt = bs && bs.monitor && bs.monitor._fmt;

      // Start/stop polling when view mounts/unmounts
      useEffect(() => {
        if (bridge.available) bridge.startMonitorPolling();
        return () => { if (bridge.available) bridge.stopMonitorPolling(); };
      }, []);

      const updatedAt = fmt ? fmt.updatedAt : '—';
      const gpuName = fmt ? fmt.gpuName : t.gpuUnavail;
      const gpuHasVram = fmt ? fmt.gpuHasVram : false;
      const gpuVram = fmt ? fmt.gpuVram : '—';
      const gpuVramPct = fmt ? fmt.gpuVramPct : 0;
      const gpuUtil = fmt ? fmt.gpuUtil : '—';
      const gpuUtilPct = fmt ? fmt.gpuUtilPct : 0;
      const ramUsedGiB = fmt ? fmt.ramUsedGiB : '—';
      const ramPct = fmt ? fmt.ramPct : 0;
      const ramTotal = fmt ? fmt.ramTotal : '—';
      const swapPct = fmt ? fmt.swapPct : 0;
      const swapTotal = fmt ? fmt.swapTotal : '—';
      const vllmModel = fmt ? fmt.vllmModel : '—';
      const vllmStatus = fmt ? fmt.vllmStatus : 'OFFLINE';
      const vllmOnline = fmt ? fmt.vllmOnline : false;
      const vllmUpstream = fmt ? fmt.vllmUpstream : '—';
      const vllmMaxLen = fmt ? fmt.vllmMaxLen : '—';
      const vllmQueue = fmt ? fmt.vllmQueue : '— / —';
      const vllmKv = fmt ? fmt.vllmKv : '—';
      const appVersion = fmt ? fmt.appVersion : '—';
      const dtVersion = fmt ? fmt.dtVersion : '—';
      const uptime = fmt ? fmt.uptime : '—';

      return (
        <div className="flex-1 flex flex-col w-full h-full relative z-10 animate-in fade-in duration-300">

          <div className="px-16 pt-12 pb-6 flex items-end justify-between">
            <div>
              <h1 className="text-[32px] font-normal tracking-tight mb-2">{t.sysStatus}</h1>
              <p className={`text-[15px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{t.sysDesc}</p>
            </div>
            <div className={`flex items-center gap-3 px-5 py-2.5 rounded-full ${isDark ? 'bg-[#1E1F20]' : 'bg-[#F0F4F9]'}`}>
              <div className={`w-2 h-2 rounded-full ${vllmOnline ? 'bg-[#188038] animate-pulse' : 'bg-[#EA4335]'}`}></div>
              <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>{updatedAt}</span>
              <div className="w-[1px] h-4 bg-gray-400/30 mx-2"></div>
              <button
                onClick={() => { if (bridge.available) bridge.startMonitorPolling(); }}
                className={`hover:rotate-180 transition-transform duration-500 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}
              >
                <RefreshCw size={16} />
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto px-16 py-8 custom-scrollbar">
            <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 max-w-[1200px]">

              <WidgetCard title={t.gpu} theme={theme}>
                <div className="mb-10">
                  <h3 className="text-[28px] font-medium">{gpuHasVram ? gpuName : t.gpuUnavail}</h3>
                  <p className={`text-[14px] mt-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{gpuHasVram ? '' : t.noSmi}</p>
                </div>
                <div className="space-y-6 mt-auto">
                  <ProgressBar label={t.vram} value={gpuHasVram ? gpuVram : '—'} percentage={gpuVramPct} theme={theme} />
                  <ProgressBar label={t.core} value={gpuHasVram ? gpuUtil : '—'} percentage={gpuUtilPct} theme={theme} />
                </div>
              </WidgetCard>

              <WidgetCard title={t.ram} theme={theme}>
                 <div className="mb-10 flex items-baseline gap-2">
                  <h3 className="text-[48px] font-normal leading-none tracking-tight">{ramUsedGiB}</h3>
                  <span className={`text-[16px] font-medium ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>GB {t.used}</span>
                </div>
                <div className="space-y-6 mt-auto">
                  <ProgressBar label={t.physical} value={ramPct + '%'} subValue={ramTotal + ' ' + t.total} percentage={ramPct} theme={theme} color="#0B57D0" />
                  <ProgressBar label={t.swap} value={swapPct + '%'} subValue={swapTotal} percentage={swapPct} theme={theme} color="#188038" />
                </div>
              </WidgetCard>

              <WidgetCard title={t.vllm} theme={theme}>
                 <div className="flex items-start justify-between mb-8">
                  <div>
                    <h3 className="text-[22px] font-medium mb-1">{vllmModel}</h3>
                    <p className={`text-[13px] font-mono ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{vllmUpstream}</p>

                  <div className={`px-3 py-1 rounded-full flex items-center gap-2 ${vllmOnline ? (isDark ? 'bg-[#0F5223] text-[#93D5A6]' : 'bg-[#E6F4EA] text-[#137333]') : (isDark ? 'bg-[#5C2020] text-[#F28B82]' : 'bg-[#FCE8E6] text-[#C5221F]')}`}>
                    <CheckCircle2 size={12} />

                  <ListRow label={t.ctx} value={String(vllmMaxLen)} theme={theme} />
                  <ListRow label={t.queue} value={vllmQueue} theme={theme} />

                </div>

              <WidgetCard title={t.app} theme={theme}>
                <div className="mb-8">
                  <h3 className="text-[22px] font-medium mb-1">pinvou3-app</h3>

                  <ListRow label={t.uiVer} value={dtVersion} theme={theme} />
                  <ListRow label={t.uptime} value={uptime} border={false} theme={theme} />
                </div>
              </WidgetCard>

            </div>
          </div>
        </div>
      );
    };

    // ==========================================

    const ChatView = ({ theme, t, bs, prefill, onPrefillConsumed, justInstalledTool, setJustInstalledTool }) => {
      const isDark = theme === 'dark';
      const [inputText, setInputText] = useState('');
      const [artifactsOpen, setArtifactsOpen] = useState(false);
      const scrollRef = useRef(null);
      const chatItems = bs ? bs.chatItems : [];
      const busy = bs ? bs.busy : false;
      const hasMessages = chatItems.length > 0;
      const attachments = (bs && bs.attachments) || [];
      const queued = (bs && bs.queued) || []; // 排队待发消息（当前 session 生成中时积压）
      const artifactCount = (bs && bs.artifacts) ? bs.artifacts.length : 0;
      const hasSkill = !!(bs && bs.workflow && bs.workflow.activeSkillName);
      let lastUserId = null;
      for (let i = chatItems.length - 1; i >= 0; i--) { if (chatItems[i].type === 'user') { lastUserId = chatItems[i].id; break; } }

      // 工作流启用时预填输入框
      useEffect(() => {
        if (prefill) { setInputText(prefill); if (onPrefillConsumed) onPrefillConsumed(); }
      }, [prefill]);

      // Auto-scroll：直接滚内部容器到底（绝不动外层窗口，避免内容被顶到看不见/拉不动）
      useEffect(() => {
        const el = scrollRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, [chatItems.length, chatItems[chatItems.length - 1]?.html]);

      // 安装工具后新建会话 → 本地显示欢迎卡片（不发 LLM query，不浪费 token）
      const [welcomeToolId, setWelcomeToolId] = useState(null);
      useEffect(() => {
        if (justInstalledTool) {
          setWelcomeToolId(justInstalledTool);
          setJustInstalledTool(null);
        }
      }, [justInstalledTool]);

      function handleSend() {
        // 不再因 busy 拦截:bridge.sendMessage 在生成中会把这句排队(本轮跑完自动发)。
        const hasReady = attachments.some(a => a.status === 'ready');
        if (!inputText.trim() && !hasReady) return;
        if (bridge.available) bridge.sendMessage(inputText.trim());
        setInputText('');
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      }

      function handleCancel() {
        if (bridge.available) bridge.cancelGeneration();
      }

      function handlePaste(e) {
        const items = (e.clipboardData && e.clipboardData.items) || [];
        for (const it of items) {
          if (it.type && it.type.indexOf('image/') === 0) {
            const file = it.getAsFile();
            if (!file) continue;
            e.preventDefault();
            const reader = new FileReader();
            reader.onload = () => {
              const bytes = Array.from(new Uint8Array(reader.result));
              const ext = (file.type.split('/')[1] || 'png');
              if (bridge.available) bridge.addPasteImage(`paste-${Date.now()}.${ext}`, bytes);
            };
            reader.readAsArrayBuffer(file);
          }
        }
      }

      return (
        <div className="flex-1 flex flex-col w-full h-full min-h-0 relative z-10 animate-in fade-in duration-300">

            </button>
          </div>

          {/* 工作流 phase pipeline —— 固定在顶部(清浮动顶栏)，绑定 skill 才显示 */}
          {hasSkill && (
            <div className="shrink-0 pt-16 px-4 md:px-20 lg:px-40">

          )}

          {/* Main Chat Area */}
          <div ref={scrollRef} className={`flex-1 min-h-0 overflow-y-auto px-4 md:px-20 lg:px-40 pb-40 custom-scrollbar flex flex-col ${hasSkill ? 'pt-3' : 'pt-20'} ${hasMessages ? 'justify-start' : 'items-center justify-center'}`}>

            {!hasMessages && !welcomeToolId && (
              /* Gemini Style Centered Empty State */
              <div className="text-center mb-12 animate-in slide-in-from-bottom-4 duration-500">
                <h1 className={`text-[44px] font-normal mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                  {t.chatGreeting}
                </h1>
              </div>
            )}

            {!hasMessages && welcomeToolId && (
              <div className="max-w-[800px] w-full mx-auto mt-8">
                <ToolWelcomeCard
                  toolId={welcomeToolId}
                  theme={theme}
                  onSend={(q) => {
                    setWelcomeToolId(null);
                    if (bridge.available) bridge.sendMessage(q);
                  }}
                />
              </div>
            )}

            {hasMessages && (
              <div className="max-w-[800px] w-full mx-auto space-y-4">
                {chatItems.map((item, idx) => (
                  <ChatBubble key={item.id} item={item} theme={theme} onPrefill={(txt) => setInputText(txt)} editable={!busy && item.id === lastUserId} />
                ))}
                {busy && <ThinkingBubble thinking={bs && bs.thinking} theme={theme} />}
              </div>
            )}

          </div>

          {/* Floating Input Area */}
          <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-full max-w-[800px] px-4 z-20">
            {/* 排队待发消息 chips（生成中继续输入会积压到这里，本轮跑完自动发） */}
            {queued.length > 0 && (
              <div className="flex flex-col gap-1 mb-2 px-2">
                {queued.map((q) => (
                  <div key={q.id} className={`flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full text-[12px] self-start max-w-full ${isDark ? 'bg-[#2A2B2D] text-[#C4C7C5]' : 'bg-[#EAEDF1] text-[#444746]'}`}>
                    <span className="opacity-60">排队中</span>
                    <span className="max-w-[480px] truncate">{q.displayText}</span>
                    <button onClick={() => bridge.removeQueued(q.id)} title="撤销" className={`w-5 h-5 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537]' : 'hover:bg-[#F0F4F9]'}`}>×</button>
                  </div>
                ))}
              </div>
            )}
            {/* 附件 chips */}
            {attachments.length > 0 && (
              <div className="flex flex-wrap gap-2 mb-2 px-2">
                {attachments.map((a) => (
                  <div key={a.id} className={`flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full text-[12px] ${isDark ? 'bg-[#1E1F20] text-[#E3E3E3]' : 'bg-white text-[#1F1F1F] shadow-sm'}`}>

                    <span className="max-w-[160px] truncate">{a.basename}</span>
                    <span className={a.status === 'error' ? 'text-[#F28B82]' : a.status === 'parsing' ? 'opacity-60' : 'text-[#93D5A6]'}>
                      {a.status === 'parsing' ? '解析中…' : a.status === 'error' ? '失败' : '✓'}
                    </span>
                    <button onClick={() => bridge.removeAttachment(a.id)} className={`w-5 h-5 rounded-full flex items-center justify-center ${isDark ? 'hover:bg-[#333537]' : 'hover:bg-[#F0F4F9]'}`}>×</button>
                  </div>
                ))}
              </div>
            )}
            <div className={`flex items-center gap-3 p-2 rounded-full shadow-lg ${isDark ? 'bg-[#1E1F20]' : 'bg-white'}`}>

              <button onClick={() => bridge.available && bridge.pickAndAttach()} title="添加附件"
                className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}>
                <Paperclip size={20} />
              </button>

              <input
                type="text"
                placeholder={t.placeholder}
                value={inputText}
                onChange={e => setInputText(e.target.value)}
                onKeyDown={handleKeyDown}
                onPaste={handlePaste}
                className={`flex-1 bg-transparent border-none outline-none text-[16px] py-3 ${isDark ? 'placeholder:text-[#C4C7C5]' : 'placeholder:text-gray-400'}`}
              />

              {busy ? (
                <button
                  onClick={handleCancel}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#F28B82] hover:bg-[#333537]' : 'text-[#C5221F] hover:bg-[#F0F4F9]'}`}
                >
                  <StopCircle size={20} />
                </button>
              ) : (
                <button
                  onClick={handleSend}
                  className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isDark ? 'text-[#C4C7C5] hover:bg-[#333537]' : 'text-[#444746] hover:bg-[#F0F4F9]'}`}
                >
                  {(inputText.trim() || attachments.some(a => a.status === 'ready')) ? <Send size={18} /> : <Mic size={20} />}
                </button>
              )}
            </div>
            <div className="flex items-center justify-center mt-3">
               <p className={`text-[12px] ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{t.disclaimer}</p>
            </div>
          </div>

        </div>
      );
    };

    // ==========================================
    // Chat Bubble (message rendering)
    // ==========================================
    const UserBubble = ({ item, theme, editable }) => {
      const isDark = theme === 'dark';
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(item.text);
      function commit() { const tx = val.trim(); setEditing(false); if (tx && bridge.available) bridge.editLastTurn(tx); }
      if (editing) {
        return (
          <div className="flex justify-end">
            <div className="max-w-[85%] w-full">
              <textarea autoFocus value={val} onChange={e => setVal(e.target.value)}
                rows={Math.min(6, Math.max(1, val.split('\n').length))}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); } else if (e.key === 'Escape') { setEditing(false); setVal(item.text); } }}
                className={`w-full rounded-[16px] px-4 py-2 text-[15px] outline-none ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`} />
              <div className="flex gap-2 justify-end mt-1">
                <button className={cardBtnCls(isDark)} onClick={() => { setEditing(false); setVal(item.text); }}>取消</button>
                <button className={cardBtnCls(isDark, 'primary')} onClick={commit}>重新发送</button>
              </div>
            </div>
          </div>
        );
      }
      return (
        <div className="flex justify-end group">
          <div className="flex items-center gap-2 max-w-[85%]">
            {editable && <button title="编辑并重发" onClick={() => { setVal(item.text); setEditing(true); }} className={`opacity-0 group-hover:opacity-100 text-[13px] shrink-0 ${isDark ? 'text-[#8E8E8E] hover:text-[#C4C7C5]' : 'text-[#9AA0A6] hover:text-[#444746]'}`}>✏️</button>}
            <div className={`px-5 py-3 rounded-[20px] text-[15px] leading-relaxed whitespace-pre-wrap ${isDark ? 'bg-[#004A77] text-[#E3E3E3]' : 'bg-[#D3E3FD] text-[#1F1F1F]'}`}>{item.text}</div>
          </div>
        </div>
      );
    };

    // 思考指示器：Braille 转圈 + 思考中/调用工具 + 计时（每阶段切换重置）
    const BRAILLE = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
    const ThinkingBubble = ({ thinking, theme }) => {
      const isDark = theme === 'dark';
      const [frame, setFrame] = useState(0);
      const [elapsed, setElapsed] = useState(0);
      const phase = thinking ? thinking.phase : 'thinking';
      const toolName = thinking ? thinking.toolName : '';
      const startedAt = (thinking && thinking.startedAt) || Date.now();
      useEffect(() => {
        setFrame(0); setElapsed(0);
        const id = setInterval(() => {
          setFrame(f => (f + 1) % BRAILLE.length);
          setElapsed(Math.floor((Date.now() - startedAt) / 1000));
        }, 100);
        return () => clearInterval(id);
      }, [startedAt, phase, toolName]);
      let text;
      if (phase === 'tool' && toolName) {
        text = `调用 ${toolName}... ${elapsed}s`;
      } else {
        const suffix = elapsed >= 120 ? ' · 本地模型在生成长内容,请耐心等' : elapsed >= 30 ? ' · 本地模型生成中' : '';
        text = `思考中... ${elapsed}s${suffix}`;
      }
      return (
        <div className="flex justify-start">
          <div className={`text-[13px] font-mono px-3 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#A8C7FA]' : 'bg-[#F0F4F9] text-[#0B57D0]'}`}>
            {BRAILLE[frame]} {text}
          </div>
        </div>
      );
    };

    // 品悟报告里的 CRITICAL/RAISED 等是 GATE/override 协议字段（前端正则放行 + 后端 GATE 依赖），
    // 不能改 skill 输出；只在显示层把它们翻译成人话，协议链路全程保持英文。
    const prettyPinvouReport = (html) => (html || '')
      .replace(/PINVOU REVIEW REPORT/g, '品悟审核报告')
      .replace(/PINVOU FINAL REPORT/g, '品悟验收报告')
      .replace(/\bBoss\b/g, '老板')
      .replace(/\bPinvou\b/g, '品悟')
      .replace(/>Finding</g, '>问题<')
      .replace(/>Severity</g, '>重要性<')
      .replace(/>Status</g, '>处理状态<')
      .replace(/>User Decision</g, '>你的决定<')
      .replace(/\bCRITICAL\b/g, '必须处理')
      .replace(/\bINFORMATIONAL\b/g, '可选建议')
      .replace(/\bCLEAR\b/g, '无硬伤')
      .replace(/\bDONE\b/g, '已完成')
      .replace(/\bPARTIAL\b/g, '部分完成')
      .replace(/\bMISSING\b/g, '未完成')
      .replace(/\bOVERRIDDEN_BY_USER\b/g, '用户确认继续')
      .replace(/\bRESOLVED\b/g, '已修复')
      .replace(/\bRAISED\b/g, '待处理')
      .replace(/\bNOTED\b/g, '已记录')
      .replace(/<strong>VERDICT<\/strong>:\s*/gi, '<strong>结论</strong>：')
      .replace(/\bVERDICT\b/g, '结论')
      .replace(/\bExitPlanMode\b/g, '继续执行')
      .replace(/\buser override\b/gi, '用户确认继续')
      .replace(/\bclear\b/gi, '可以继续')
      .replace(/\bcritical\b/gi, '必须处理');

    // 工具欢迎卡片 — 安装工具后新建会话时，在 assistant 回复中渲染
    const ToolWelcomeCard = ({ toolId, theme, onSend }) => {
      const isDark = theme === 'dark';
      const [hovered, setHovered] = useState(null);
      const tool = tsToolsData.find(t => t.backendId === toolId);
      if (!tool || !tool.welcomeQueries) return null;
      const ToolIcon = tool.icon || Sparkles;
      return (
        <div className="flex justify-start">
          <div className={`max-w-[800px] w-full rounded-[2rem] overflow-hidden border transition-all ${
            isDark ? 'bg-[#1E1F20] border-[#3A3A3C]/60' : 'bg-white border-slate-100 shadow-lg shadow-slate-200/30'
          }`}>
            <div className={`relative p-5 border-b flex items-center gap-3.5 ${
              isDark ? 'bg-[#1E1F20] border-[#3A3A3C]/60' : 'bg-gradient-to-b from-blue-50/80 to-white border-slate-100'
            }`}>
              <div className="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                <ToolIcon size={22} className="text-white" />
              </div>
              <div>
                <div className={`text-[1.05rem] font-bold tracking-tight ${isDark ? 'text-slate-100' : 'text-slate-800'}`}>{tool.title}</div>
                <div className={`flex items-center text-xs mt-0.5 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                  <span className="relative flex h-2 w-2 mr-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                  </span>
                  系统已就绪
                </div>
              </div>
            </div>
            <div className="p-5">
              <p className={`leading-relaxed text-[15px] ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                {tool.desc.split('。')[0]}。自然语言提问即可。
              </p>
              <div className="flex items-center my-5">
                <div className={`flex-grow h-px ${isDark ? 'bg-gradient-to-r from-transparent via-[#3A3A3C] to-transparent' : 'bg-gradient-to-r from-transparent via-slate-200 to-transparent'}`}></div>
                <span className={`px-4 text-[11px] uppercase tracking-wider font-semibold flex items-center gap-1.5 ${isDark ? 'text-slate-500' : 'text-slate-400'}`}>
                  <Sparkles size={13} />
                  <span>试试问我</span>
                </span>
                <div className={`flex-grow h-px ${isDark ? 'bg-gradient-to-r from-transparent via-[#3A3A3C] to-transparent' : 'bg-gradient-to-r from-transparent via-slate-200 to-transparent'}`}></div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                {tool.welcomeQueries.map((q, i) => (
                  <button
                    key={i}
                    onMouseEnter={() => setHovered(i)}
                    onMouseLeave={() => setHovered(null)}
                    onClick={() => onSend && onSend(q)}
                    className={`group relative flex items-center justify-between p-3 rounded-2xl border text-left transition-all duration-200 ${
                      hovered === i
                        ? (isDark ? 'border-blue-500/30 bg-blue-500/10 shadow-sm' : 'border-blue-200/80 bg-blue-50/50 shadow-sm')
                        : (isDark ? 'border-[#3A3A3C]/50 bg-[#2A2B2D]/30 hover:border-[#555]' : 'border-slate-200/60 bg-slate-50/30 hover:border-blue-200')
                    }`}
                  >
                    <span className={`text-sm font-medium transition-colors ${
                      hovered === i ? (isDark ? 'text-blue-300' : 'text-blue-700') : (isDark ? 'text-slate-300' : 'text-slate-700')
                    }`}>{q}</span>
                    <ChevronRight size={15} className={`transition-all duration-200 ${
                      hovered === i ? (isDark ? 'text-blue-400 opacity-100' : 'text-blue-500 opacity-100') : 'opacity-0 -translate-x-2'
                    }`} />
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const ChatBubble = ({ item, theme, onPrefill, editable }) => {
      const isDark = theme === 'dark';

      if (item.type === 'plan_card') return <PlanCard item={item} theme={theme} onPrefill={onPrefill} />;
      if (item.type === 'plan_stuck' || item.type === 'execution_stuck') return <PlanStuckCard item={item} theme={theme} />;
      if (item.type === 'plan_text_fallback') return <PlanFallbackCard item={item} theme={theme} />;
      if (item.type === 'careful_blocked') return <CarefulBlockedCard item={item} theme={theme} />;
      if (item.type === 'user_input') return <UserInputCard item={item} theme={theme} />;
      if (item.type === 'pinvou_actions') return <PinvouActionsCard item={item} theme={theme} onPrefill={onPrefill} />;
      if (item.type === 'user') return <UserBubble item={item} theme={theme} editable={editable} />;

      if (item.type === 'assistant') {
        if (item.streaming && !item.html) return null; // 空流式气泡交给 ThinkingBubble 表示
        // persona 兜底：品悟报告（FINAL/REVIEW）即使没带 persona（自发输出/重载/persona 丢失）
        // 也按内容标记识别，统一渲染成紫色品悟气泡
        const html = item.html || '';
        const persona = item.persona
          || (html.indexOf('PINVOU FINAL REPORT') >= 0 ? 'pinvou-final'
            : html.indexOf('PINVOU REVIEW REPORT') >= 0 ? 'pinvou-plan' : null);
        const isPinvou = persona === 'pinvou-plan' || persona === 'pinvou-final';
        if (isPinvou) {
          return (
            <div className="flex justify-start">
              <div className={`max-w-[95%] w-full rounded-[16px] border p-3 ${isDark ? 'bg-[#7C3AED]/10 border-[#D0BCFF]/30' : 'bg-[#7C3AED]/5 border-[#7C3AED]/20'} ${isDark ? 'dark-code' : 'light-code'}`}>
                <div className={`text-[12px] font-semibold mb-1.5 ${isDark ? 'text-[#D0BCFF]' : 'text-[#7C3AED]'}`}>🟣 品悟{persona === 'pinvou-final' ? '（验收）' : '（审方案）'}</div>
                <div className={`msg-md text-[15px] leading-relaxed ${item.streaming ? 'streaming-cursor' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}
                  dangerouslySetInnerHTML={{ __html: prettyPinvouReport(html) }} />
              </div>
            </div>
          );
        }
        return (
          <div className="flex justify-start">
            <div className={`max-w-[95%] ${isDark ? 'dark-code' : 'light-code'}`}>
              <div
                className={`msg-md text-[15px] leading-relaxed ${item.streaming ? 'streaming-cursor' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}
                dangerouslySetInnerHTML={{ __html: item.html || '' }}
              />
              {item.time && !item.streaming && (
                <div className={`text-[11px] mt-1 ${isDark ? 'text-[#8E8E8E]' : 'text-[#757575]'}`}>{item.time}</div>
              )}
            </div>
          </div>
        );
      }

      if (item.type === 'tool') {
        return <ToolCard item={item} theme={theme} />;
      }

      if (item.type === 'system') {
        return (
          <div className="flex justify-center">
            <div className={`text-[13px] px-4 py-1.5 rounded-full ${isDark ? 'bg-[#1E1F20] text-[#8E8E8E]' : 'bg-[#F0F4F9] text-[#757575]'}`}>
              {item.text}
            </div>
          </div>
        );
      }

      return null;
    };

    // ==========================================
    // Tool Card
    // ==========================================
    // 弱化类工具：渲染成单行灰条（看得见但不抢眼）；其余有产出类保留醒目卡片。
    // 含 ①只读探查 ②待办/清单的细碎进度操作（易刷屏、对用户价值低）。
    // 批量出方案的 checklist_write/todo_write/update_plan 不在此列（它们走方案卡）。
    const QUIET_TOOLS = new Set([
      'read_file', 'list_dir', 'grep_files', 'file_search', 'glob',
      'checklist_update', 'todo_update', 'checklist_add', 'todo_add', 'checklist_list', 'todo_list',
    ]);

    const toolBasename = (p) => {
      if (typeof p !== 'string' || !p) return '';
      const parts = p.replace(/\/+$/, '').split('/');
      return parts[parts.length - 1] || p;
    };

    // A 档摘要：只从结构化 args 提“动作对象”（文件名/命令/模式），稳且免费，不 parse output。
    const toolSummary = (name, args) => {
      if (!args || typeof args !== 'object') return '';
      switch (name) {
        case 'read_file': {
          const base = toolBasename(args.path);
          if (args.start_line || args.max_lines) {
            const s = args.start_line || 1;
            return base + ' · 行 ' + s + (args.max_lines ? '-' + (s + args.max_lines - 1) : '+');
          }
          return base;
        }
        case 'write_file':
        case 'append_file':
        case 'edit_file':
          return toolBasename(args.path);
        case 'list_dir':
          return toolBasename(args.path || '.') || '.';
        case 'grep_files':
          return args.pattern ? '"' + args.pattern + '"' : '';
        case 'file_search':
          return args.query ? '"' + args.query + '"' : '';
        case 'exec_shell':
          return typeof args.command === 'string' ? args.command.replace(/\s+/g, ' ').trim() : '';
        case 'checklist_update':
        case 'todo_update':
          return args.status === 'completed' ? '已完成'
            : args.status === 'in_progress' ? '进行中'
            : args.status === 'pending' ? '待办' : '';
        default:
          return '';
      }
    };

    // 底座对超 12K 的工具输出会压成 [TOOL_OUTPUT_RECEIPT]（content-addressed 溢出），
    // 直接展示一堆 sha/handle 是噪音 —— 翻译成人话 + 保留 preview 摘要。
    const isReceipt = (text) => typeof text === 'string' && text.trim().startsWith('[TOOL_OUTPUT_RECEIPT]');
    const parseReceipt = (text) => {
      const fields = {};
      String(text).split('\n').forEach((line) => {
        const m = line.match(/^\s*([a-z_]+):\s*(.*)$/);
        if (m) fields[m[1]] = m[2];
      });
      return fields;
    };
    const ReceiptBlock = ({ text, isDark }) => {
      const f = parseReceipt(text);
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const body = isDark ? 'text-[#C4C7C5]' : 'text-[#444746]';
      // 输出超大被底座存档、只回传 preview。存档/压缩机制对用户无意义 ——
      // 只展示内容开头 + 一句不带术语的诚实提示（避免误以为是完整输出）。
      const pv = (f.preview && f.preview !== '(none)') ? f.preview.replace(/\\n/g, '\n') : '';
      const pvIsDiff = pv && (/(^|\n)@@/.test(pv) || (pv.indexOf('@@') >= 0 && /(^|\n)[+-]/.test(pv)));
      const note = <div className={`mt-0.5 text-[11px] ${muted}`}>⋯ 输出较长，仅显示开头</div>;
      if (pvIsDiff) return (<div><DiffView text={pv} isDark={isDark} />{note}</div>);
      return (
        <div>
          <div className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap' }}>{pv || '（输出较长，未展开）'}</div>
          {pv ? note : null}
        </div>
      );
    };

    // ── 天气卡片（移植自 MegaClaw）──
    const weatherIconSvg = (code) => {
      const svgs = {
        sunny: '<svg viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-yellow-300"><circle cx="12" cy="12" r="5"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>',
        partly_cloudy: '<svg viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-white"><path d="M6.5 19a4.5 4.5 0 0 1-.343-8.987 7.5 7.5 0 0 1 14.28 2.226A4 4 0 0 1 18 20H6.5z"></path><circle cx="7" cy="7" r="2.5" fill="currentColor" opacity="0.8"></circle></svg>',
        cloudy: '<svg viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-white opacity-90"><path d="M6.5 17.5A4.5 4.5 0 0 1 6.5 8.5h.342a7.5 7.5 0 0 1 14.316 2.625A4.002 4.002 0 0 1 18 19H6.5v-1.5z"></path></svg>',
        thunderstorm: '<svg viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-yellow-200"><path d="M6.5 17A4.5 4.5 0 0 1 6.5 8h.342a7.5 7.5 0 0 1 14.316 2.625A4 4 0 0 1 18 18H6.5z" opacity="0.7"></path><path d="M13 12l-2 5h3l-2 5" stroke="currentColor" stroke-width="1.5" fill="none"></path></svg>',
        heavy_rain: '<svg viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-blue-300"><path d="M6.5 15A4.5 4.5 0 0 1 6.5 6h.342a7.5 7.5 0 0 1 14.316 2.625A4 4 0 0 1 18 16H6.5z" opacity="0.7"></path><path d="M9 18v3m4-4v3m4-2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>',
        rainy: '<svg viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-blue-200"><path d="M6.5 15A4.5 4.5 0 0 1 6.5 6h.342a7.5 7.5 0 0 1 14.316 2.625A4 4 0 0 1 18 16H6.5z" opacity="0.7"></path><path d="M10 18v2m5-3v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>',
        snowy: '<svg viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-blue-100"><path d="M6.5 15A4.5 4.5 0 0 1 6.5 6h.342a7.5 7.5 0 0 1 14.316 2.625A4 4 0 0 1 18 16H6.5z" opacity="0.7"></path><circle cx="9" cy="19" r="1"></circle><circle cx="14" cy="18" r="1"></circle><circle cx="11" cy="21" r="1"></circle></svg>',
        foggy: '<svg viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10 text-gray-300"><path d="M3 14h18M5 18h14M7 10h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"></path></svg>',
      };
      return svgs[code] || svgs.partly_cloudy;
    };
    const WeatherCard = ({ data }) => {
      const mode = data.queryMode || 'today';
      const daily = Array.isArray(data.daily) ? data.daily : [];
      if (mode === 'multi' && daily.length > 1) {
        return (
          <div style={{ background: 'linear-gradient(135deg,#325a86 0%,#25466a 100%)', boxShadow: '0 10px 30px rgba(37,70,106,.15)' }}
            className="w-full rounded-[24px] p-8 text-white flex flex-col justify-center min-h-[220px]">
            <div className="grid gap-4 w-full h-full items-center" style={{ gridTemplateColumns: `repeat(${daily.length},minmax(0,1fr))` }}>
              {daily.map((item, i) => {
                const label = i === 0 ? '今天' : i === 1 ? '明天' : i === 2 ? '后天' : (item.week || `第${i+1}天`);
                const dateText = (item.date || '').length >= 10 ? item.date.slice(5).replace(/-/g, '/') : (item.date || '--/--');
                return (
                  <div key={i} className="flex flex-col items-center justify-center gap-3 px-2" style={i > 0 ? { borderLeft: '1px solid rgba(255,255,255,0.1)' } : {}}>
                    <span className={`text-[15px] ${i === 0 ? 'font-medium' : 'text-white/90'}`}>{label} ({dateText})</span>
                    <span dangerouslySetInnerHTML={{ __html: weatherIconSvg(item.iconCode || 'partly_cloudy') }} />
                    <span className="text-[14px] text-white/80">{item.dayWeather || item.nightWeather || '天气'}</span>
                    <span className="text-[16px] font-semibold mt-1">{item.dayTemp || '--'}° <span className="text-white/50 font-normal">{item.nightTemp || '--'}°</span></span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }
      // today / single_day
      const forecastLabel = mode === 'single_day' ? '明日预测' : '今日预测';
      const windText = [data.windDirection || '', data.windPower ? data.windPower + '级' : ''].join(' ').trim();
      return (
        <div style={{ background: 'linear-gradient(135deg,#325a86 0%,#25466a 100%)', boxShadow: '0 10px 30px rgba(37,70,106,.15)' }}
          className="w-full rounded-[24px] p-8 text-white flex flex-col justify-between relative overflow-hidden min-h-[220px]">
          <div className="flex justify-between items-start w-full">
            <div className="flex flex-col gap-1">
              <h2 className="text-3xl font-medium tracking-wide">{data.city || '当前城市'}</h2>
              <p className="text-[15px] text-white/80">{data.weather || '天气'}</p>
            </div>
            <div className="mt-[-10px]" style={{ fontSize: '5.5rem', lineHeight: 1, fontWeight: 300, letterSpacing: '-2px' }}>{data.temperature || '--'}°</div>
          </div>
          <div className="flex justify-between items-end w-full mt-4">
            <div className="flex items-center">
              <span dangerouslySetInnerHTML={{ __html: weatherIconSvg(data.iconCode || (daily[0] && daily[0].iconCode) || 'partly_cloudy') }} />
              {(data.humidity || windText) && <div style={{ width: 1, height: 32, backgroundColor: 'rgba(255,255,255,0.2)', margin: '0 16px' }} />}
              <div className="flex gap-6 text-[13px] text-white/80 leading-relaxed">
                {data.humidity && <div className="flex flex-col"><span className="text-[12px] opacity-70">湿度</span><span className="text-[15px] font-medium text-white">{data.humidity}%</span></div>}
                {windText && <div className="flex flex-col"><span className="text-[12px] opacity-70">风向</span><span className="text-[15px] font-medium text-white">{windText}</span></div>}
              </div>
            </div>
            <div className="flex flex-col items-end text-right">
              <span className="text-[12px] text-white/70 mb-1">{forecastLabel}</span>
              <span className="text-[16px] font-medium tracking-wide">最高 {data.highTemp || '--'}° <span className="opacity-50 mx-1">/</span> 最低 {data.lowTemp || '--'}°</span>
            </div>
          </div>
        </div>
      );
    };
    const isWeatherTool = (name) => name === 'mcp_weather_get_weather';
    const isStockQuoteTool = (name) => name === 'mcp_iwencai_hithink_market_query';

    // 股票报价卡片内联图标
    const TrendingUp = (p) => <I {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></I>;
    const TrendingDown = (p) => <I {...p}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></I>;
    const ClockIcon = (p) => <I {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></I>;

    const StockQuoteCard = ({ data, isDark }) => {
      const price = typeof data.price === 'string' ? parseFloat(data.price) : data.price;
      const changePercent = typeof data.changePercent === 'string' ? parseFloat(data.changePercent) : data.changePercent;
      const open = typeof data.open === 'string' ? parseFloat(data.open) : data.open;
      const high = typeof data.high === 'string' ? parseFloat(data.high) : data.high;
      const low = typeof data.low === 'string' ? parseFloat(data.low) : data.low;
      const isPositive = changePercent >= 0;
      const mainColor = isPositive ? 'text-[#eb4335]' : 'text-[#34a853]';
      const bgGradient = isPositive
        ? (isDark ? 'bg-gradient-to-br from-red-950/30 to-[#1C1C1E]' : 'bg-gradient-to-br from-red-50 to-white')
        : (isDark ? 'bg-gradient-to-br from-green-950/30 to-[#1C1C1E]' : 'bg-gradient-to-br from-green-50 to-white');
      const badgeColor = isPositive
        ? (isDark ? 'bg-red-900/40 text-red-400' : 'bg-red-100 text-red-600')
        : (isDark ? 'bg-green-900/40 text-green-400' : 'bg-green-100 text-green-600');
      const TrendIcon = isPositive ? TrendingUp : TrendingDown;
      const fmt = (v) => isNaN(v) ? '--' : v.toFixed(2);
      return (
        <div className={`w-full max-w-md rounded-[24px] shadow-xl overflow-hidden border transition-all ${
          isDark ? 'bg-[#1C1C1E] border-white/10 shadow-none' : 'bg-white border-slate-100 shadow-slate-200/50'
        }`}>
          <div className={`p-6 pb-5 ${bgGradient}`}>
            <div className="flex justify-between items-start mb-4">
              <div>
                <h2 className={`text-2xl font-extrabold tracking-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>{data.name}</h2>
                <span className={`text-sm font-mono tracking-wider mt-1 block ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>{data.code}</span>
              </div>
            </div>
            <div className="flex items-end justify-between mt-6">
              <div className="flex items-baseline space-x-4">
                <span className={`text-[3.5rem] leading-none font-black tracking-tighter font-mono ${mainColor}`} style={{ fontVariantNumeric: 'tabular-nums' }}>{fmt(price)}</span>
                <div className="flex flex-col justify-end pb-1 space-y-0.5">
                  <span className={`text-sm font-bold font-mono px-1.5 py-0.5 rounded ${badgeColor}`}>{isPositive ? '+' : ''}{isNaN(changePercent) ? '--' : changePercent.toFixed(2)}%</span>
                </div>
              </div>
              <TrendIcon className={`w-12 h-12 mb-2 opacity-15 ${mainColor}`} />
            </div>
          </div>
          <div className={`h-px bg-gradient-to-r from-transparent via-current to-transparent ${isDark ? 'text-white/10' : 'text-slate-200'}`}></div>
          <div className={`p-6 ${isDark ? 'bg-[#1C1C1E]' : 'bg-white'}`}>
            <div className="grid grid-cols-3 gap-y-4 gap-x-4">
              {[
                { label: '今开', value: fmt(open) },
                { label: '最高', value: fmt(high) },
                { label: '最低', value: fmt(low) },
              ].map((item, i) => (
                <div key={i} className="flex flex-col space-y-1">
                  <span className={`text-xs font-medium ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>{item.label}</span>
                  <span className={`text-sm font-mono ${isDark ? 'text-slate-200 font-medium' : 'text-slate-800 font-medium'}`}>{item.value}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ── 每工具定制结果视图（仿 Claude Code）：解析失败一律 fallback 纯文本，永不崩 ──
    const tryParseJson = (text) => { try { return JSON.parse(text); } catch (_) { return null; } };
    // checklist/plan 输出是「摘要行\n{json}」，切首个换行后 parse
    const tryTailJson = (text) => {
      if (typeof text !== 'string') return null;
      const i = text.indexOf('\n');
      if (i < 0) return null;
      try { return JSON.parse(text.slice(i + 1)); } catch (_) { return null; }
    };
    const looksDiff = (text) => typeof text === 'string'
      && /(^|\n)--- /.test(text) && /(^|\n)\+\+\+ /.test(text);
    const outBox = (isDark) => `tool-card-output custom-scrollbar rounded-lg p-2 text-[12px] ${isDark ? 'bg-[#131314] text-[#C4C7C5]' : 'bg-white text-[#444746]'}`;
    const TODO_SYM = { completed: '☑', in_progress: '◐', pending: '☐' };
    const TODO_TOOLS = ['checklist_write', 'checklist_update', 'checklist_add', 'checklist_list', 'todo_write', 'todo_update', 'todo_add', 'todo_list', 'update_plan'];

    const OutputPre = ({ text, isDark }) => (
      <pre className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap' }}>
        {typeof text === 'string' ? text : JSON.stringify(text, null, 2)}
      </pre>
    );
    const OutputError = ({ text, isDark }) => (
      <pre className={`tool-card-output custom-scrollbar rounded-lg p-2 text-[12px] ${isDark ? 'bg-[#131314] text-[#F28B82]' : 'bg-white text-[#C5221F]'}`} style={{ whiteSpace: 'pre-wrap' }}>
        {typeof text === 'string' ? text : JSON.stringify(text, null, 2)}
      </pre>
    );
    const ListDirView = ({ items, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const sorted = items.slice().sort((a, b) => ((b.is_dir ? 1 : 0) - (a.is_dir ? 1 : 0)) || String(a.name).localeCompare(String(b.name)));
      return (
        <div className={outBox(isDark)} style={{ fontFamily: 'monospace' }}>
          <div className={`mb-1 ${muted}`} style={{ fontFamily: 'inherit' }}>{items.length} 个条目</div>
          {sorted.map((it, i) => <div key={i}>{it.is_dir ? '📁' : '📄'} {it.name}{it.is_dir ? '/' : ''}</div>)}
        </div>
      );
    };
    const GrepView = ({ data, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const matches = Array.isArray(data.matches) ? data.matches : [];
      return (
        <div className={outBox(isDark)}>
          <div className={`mb-1 ${muted}`}>
            命中 {data.total_matches != null ? data.total_matches : matches.length} 处
            {data.files_searched != null ? ` · 搜索 ${data.files_searched} 文件` : ''}
            {data.truncated ? ' · 已截断' : ''}
          </div>
          {matches.map((m, i) => (
            <div key={i} className="mt-1">
              <span className={muted}>{m.file}:{m.line_number}</span>
              <pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'monospace' }}>{m.line}</pre>
            </div>
          ))}
        </div>
      );
    };
    const DiffView = ({ text, isDark }) => {
      const lines = String(text).split('\n');
      const add = isDark ? 'text-[#93D5A6]' : 'text-[#137333]';
      const del = isDark ? 'text-[#F28B82]' : 'text-[#C5221F]';
      const hunk = isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]';
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const color = (l) => /^(\+\+\+|---)/.test(l) ? muted : l.startsWith('+') ? add : l.startsWith('-') ? del : l.startsWith('@@') ? hunk : '';
      return (
        <pre className={outBox(isDark)} style={{ whiteSpace: 'pre-wrap', fontFamily: 'monospace' }}>
          {lines.map((l, i) => <div key={i} className={color(l)}>{l || ' '}</div>)}
        </pre>
      );
    };
    const ShellView = ({ data, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const del = isDark ? 'text-[#F28B82]' : 'text-[#C5221F]';
      return (
        <div className={outBox(isDark)}>
          <div className={`mb-1 ${muted}`}>
            {data.status || ''}{data.exit_code != null ? ` · exit ${data.exit_code}` : ''}
            {data.duration_ms != null ? ` · ${data.duration_ms}ms` : ''}
            {data.stdout_truncated ? ' · stdout 截断' : ''}
          </div>
          {data.stdout != null && data.stdout !== '' && <pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'monospace' }}>{data.stdout}</pre>}
          {data.stderr ? <pre className={del} style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'monospace' }}>{data.stderr}</pre> : null}
        </div>
      );
    };
    // exec_shell 的 content 其实是纯 stdout 文本（结构化字段在 metadata，前端没拿）→ 给终端样式
    const ShellTextView = ({ cmd, text, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      return (
        <div className={outBox(isDark)} style={{ fontFamily: 'monospace' }}>
          {cmd && <div className={muted} style={{ whiteSpace: 'pre-wrap' }}>$ {cmd}</div>}
          <pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'inherit' }}>{typeof text === 'string' ? text : JSON.stringify(text)}</pre>
        </div>
      );
    };
    const TodoView = ({ snap, isDark }) => {
      const muted = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';
      const items = Array.isArray(snap.items) ? snap.items : [];
      return (
        <div className={outBox(isDark)}>
          {snap.completion_pct != null && <div className={`mb-1 ${muted}`}>进度 {snap.completion_pct}%</div>}
          {snap.explanation && <div className="mb-1">{snap.explanation}</div>}
          {items.map((it, i) => (
            <div key={i} className={it.status === 'completed' ? muted : ''}>
              <span className={it.status === 'in_progress' ? (isDark ? 'text-[#FDD663]' : 'text-[#E37400]') : ''}>{TODO_SYM[it.status] || '☐'}</span> {it.content || it.step || ''}
            </div>
          ))}
        </div>
      );
    };
    // 输出渲染分发：失败→红字；大输出→receipt；高频工具→定制视图；其余→纯文本
    const ToolOutput = ({ item, isDark }) => {
      const out = item.output;
      if (item.success === false) return <OutputError text={out} isDark={isDark} />;
      // 天气卡片：MCP 工具返回 type=weather 的 JSON → 渲染蓝色天气卡
      // MCP 协议包裹: { content: [{ type:"text", text:"..." }] } → 先解包取 text
      if (isWeatherTool(item.name)) {
        let raw = out;
        const envelope = tryParseJson(out);
        if (envelope && Array.isArray(envelope.content)) {
          const t = envelope.content.find(c => c.type === 'text');
          if (t && t.text) raw = t.text;
        }
        const w = tryParseJson(raw);
        if (w && w.type === 'weather' && !w.error) return <WeatherCard data={w} />;
      }
      // 股票报价卡片：iwencai 返回表格数据 → 映射为卡片
      if (isStockQuoteTool(item.name)) {
        let raw = out;
        const envelope = tryParseJson(out);
        if (envelope && Array.isArray(envelope.content)) {
          const t = envelope.content.find(c => c.type === 'text');
          if (t && t.text) raw = t.text;
        }
        const w = tryParseJson(raw);
        if (w && Array.isArray(w.datas) && w.datas.length > 0) {
          const d = w.datas[0];
          const findVal = (obj, keyword) => {
            for (const k of Object.keys(obj)) {
              if (k.includes(keyword)) return parseFloat(obj[k]);
            }
            return undefined;
          };
          const mapped = {
            name: d['股票简称'] || '--',
            code: (d['股票代码'] || '').replace(/\.\w+$/, ''),
            price: parseFloat(d['最新价']),
            changePercent: findVal(d, '涨跌幅'),
            open: findVal(d, '开盘价'),
            high: findVal(d, '最高价'),
            low: findVal(d, '最低价'),
          };
          return <StockQuoteCard data={mapped} isDark={isDark} />;
        }
        if (w && w.type === 'stock_quote' && !w.error) return <StockQuoteCard data={w} isDark={isDark} />;
      }
      if (isReceipt(out)) return <ReceiptBlock text={out} isDark={isDark} />;
      if (item.name === 'list_dir') { const v = tryParseJson(out); if (Array.isArray(v)) return <ListDirView items={v} isDark={isDark} />; }
      else if (item.name === 'grep_files') { const v = tryParseJson(out); if (v && Array.isArray(v.matches)) return <GrepView data={v} isDark={isDark} />; }
      else if (item.name === 'exec_shell') {
        const v = tryParseJson(out);
        if (v && (v.stdout != null || v.exit_code != null || v.status)) return <ShellView data={v} isDark={isDark} />;
        return <ShellTextView cmd={item.args && item.args.command} text={out} isDark={isDark} />;
      }
      else if (item.name === 'edit_file' || item.name === 'write_file') { if (looksDiff(out)) return <DiffView text={out} isDark={isDark} />; }
      else if (item.name === 'append_file') {
        const m = String(out).match(/appended (\d+) bytes[\s\S]*?\((\d+) -> (\d+) bytes\)/i);
        if (m) return <div className={outBox(isDark)}>{/^Created/i.test(out) ? '新建并追加 ' : '追加 '}{m[1]} 字节 · {m[2]} → {m[3]} 字节</div>;
      }
      else if (TODO_TOOLS.indexOf(item.name) >= 0) { const v = tryTailJson(out); if (v && Array.isArray(v.items)) return <TodoView snap={v} isDark={isDark} />; }
      return <OutputPre text={out} isDark={isDark} />;
    };

    const ToolCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      // 有可视化卡片的工具完成后直接展开，不折叠
      const hasCard = (isWeatherTool(item.name) || isStockQuoteTool(item.name)) && item.state === 'done';
      const [expanded, setExpanded] = useState(hasCard);
      useEffect(() => { if (hasCard) setExpanded(true); }, [hasCard]);
      const isRunning = item.state === 'running';
      const isDone = item.state === 'done';
      const isFailed = item.state === 'failed';
      const quiet = QUIET_TOOLS.has(item.name);
      const summary = toolSummary(item.name, item.args);

      const statusColor = isRunning
        ? (isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]')
        : isDone
          ? (isDark ? 'text-[#93D5A6]' : 'text-[#137333]')
          : (isDark ? 'text-[#F28B82]' : 'text-[#C5221F]');

      const statusText = isRunning ? '运行中...' : isDone ? '完成' : '失败';
      const mutedColor = isDark ? 'text-[#8E8E8E]' : 'text-[#757575]';

      const detail = expanded ? (
        <div className={`px-4 pb-3 border-t ${isDark ? 'border-white/5' : 'border-black/5'}`}>
          {item.output != null
            ? <div className="mt-2"><ToolOutput item={item} isDark={isDark} /></div>
            : null}
        </div>
      ) : null;

      // 弱化类：单行灰条。完成态低调（图标灰），运行/失败态保留状态色以便察觉。
      if (quiet) {
        const iconColor = isDone ? mutedColor : statusColor;
        return (
          <div className={expanded ? `rounded-[12px] overflow-hidden border ${isDark ? 'border-white/5' : 'border-black/5'}` : ''}>
            <div
              className={`flex items-center gap-2 px-2 py-1 rounded-[8px] cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
              onClick={() => setExpanded(!expanded)}
            >
              <Wrench size={12} className={iconColor} />
              <span className={`text-[12px] ${mutedColor}`}>{item.name}</span>
              {summary
                ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
                : <span className="flex-1" />}
              {isRunning && <span className={`text-[12px] ${statusColor}`}>运行中...</span>}
              {isFailed && <span className={`text-[12px] ${statusColor}`}>失败</span>}
              <ChevronDown size={12} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${mutedColor}`} />
            </div>
            {detail}
          </div>
        );
      }

      // 有产出类：保留醒目卡片，标题行带摘要。
      return (
        <div className={`rounded-[16px] overflow-hidden border ${isDark ? 'bg-[#1E1F20] border-white/5' : 'bg-[#F0F4F9] border-black/5'}`}>
          <div
            className={`flex items-center gap-3 px-4 py-3 cursor-pointer ${isDark ? 'hover:bg-[#282A2C]' : 'hover:bg-[#E8EDF2]'}`}
            onClick={() => setExpanded(!expanded)}
          >
            <Wrench size={14} className={statusColor} />
            <span className={`text-[13px] font-medium ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
              {item.name}
            </span>
            {summary
              ? <span className={`text-[12px] flex-1 truncate ${mutedColor}`}>{summary}</span>
              : <span className="flex-1" />}
            <span className={`text-[12px] ${statusColor}`}>{statusText}</span>
            <ChevronDown size={14} className={`transition-transform ${expanded ? 'rotate-180' : ''} ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`} />
          </div>
          {detail}
        </div>
      );
    };

    // ==========================================
    // Plan / 待办 步骤渲染
    // ==========================================
    const STEP_SYM = { completed: '●', in_progress: '◎', pending: '○' };
    const PlanLayer = ({ label, explanation, items, field, isDark }) => {
      if (!items || items.length === 0) return null;
      return (
        <section className="mb-2">
          <div className={`text-[12px] font-semibold mb-1 ${isDark ? 'text-[#A8C7FA]' : 'text-[#0B57D0]'}`}>{label}</div>
          {explanation && <p className={`text-[13px] mb-1.5 leading-relaxed ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{explanation}</p>}
          <ol className="space-y-1">
            {items.map((it, i) => (
              <li key={i} className={`text-[13px] flex gap-2 leading-relaxed ${it.status === 'completed' ? 'opacity-60' : ''} ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
                <span className={it.status === 'in_progress' ? (isDark ? 'text-[#FDD663]' : 'text-[#E37400]') : ''}>{STEP_SYM[it.status] || '○'}</span>
                <span>{it[field] || ''}</span>
              </li>
            ))}
          </ol>
        </section>
      );
    };

    const cardBoxCls = (isDark, accent) =>
      `rounded-[16px] border p-4 my-1 ${isDark ? 'bg-[#1E1F20] border-white/10' : 'bg-[#F0F4F9] border-black/5'} ${accent || ''}`;
    const cardBtnCls = (isDark, variant) => {
      const base = 'px-3 py-1.5 rounded-full text-[13px] font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
      if (variant === 'primary') return `${base} ${isDark ? 'bg-[#A8C7FA] text-[#062E6F] hover:bg-[#C2DBFF]' : 'bg-[#0B57D0] text-white hover:bg-[#0A4BB8]'}`;
      return `${base} ${isDark ? 'bg-[#333537] text-[#E3E3E3] hover:bg-[#444746]' : 'bg-white text-[#1F1F1F] hover:bg-[#E1E5EA] border border-black/10'}`;
    };

    // ==========================================
    // PlanCard — ✨ 方案准备好
    // ==========================================
    const PlanCard = ({ item, theme, onPrefill }) => {
      const isDark = theme === 'dark';
      const active = item.cardState === 'active' && !item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#A8C7FA]/30' : 'border-[#0B57D0]/20')}>
          <div className={`text-[14px] font-semibold mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>✨ 方案准备好</div>
          {(!item.plan && !item.todos)
            ? <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>（plan 为空）</div>
            : <>
                <PlanLayer label="📋 方案" explanation={item.plan && item.plan.explanation} items={item.plan && item.plan.items} field="step" isDark={isDark} />
                <PlanLayer label="✅ 细分待办" items={item.todos && item.todos.items} field="content" isDark={isDark} />
              </>}
          <div className={`h-px my-3 ${isDark ? 'bg-white/10' : 'bg-black/10'}`}></div>
          {active ? (
            <div className="flex items-center gap-2 flex-wrap">
              <span className={`text-[13px] mr-1 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>下一步：</span>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => bridge.acceptPlan(item.id, item.planMarkdown)}>✅ 就这么干</button>
              <button className={cardBtnCls(isDark)} onClick={() => onPrefill && onPrefill('修订方案:')}>✏️ 改改</button>
              <button className={cardBtnCls(isDark)} onClick={() => bridge.discardPlan(item.id)}>🚪 算了</button>
            </div>
          ) : (
            <div className={`text-[13px] font-medium ${isDark ? 'text-[#93D5A6]' : 'text-[#137333]'}`}>{item.statusLabel}</div>
          )}
        </div>
      );
    };

    // ==========================================
    // PlanStuckCard — Plan 死锁 / 执行卡住 兜底
    // ==========================================
    const PlanStuckCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const isExec = item.type === 'execution_stuck';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#FDD663]/30' : 'border-[#E37400]/20')}>
          <div className={`text-[13px] leading-relaxed mb-3 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>
            {isExec
              ? <>🛑 AI 执行卡住了 (已自动尝试 {item.tries} 次仍未真正产出文件)。你可以:</>
              : <>⚠️ AI 在 Plan 模式调用了 <code className="px-1 rounded bg-black/20">{item.toolName || '(unknown)'}</code> 但被白名单挡掉。Plan 模式只能讨论方案,不能动手。给你两个出路:</>}
          </div>
          {done ? (
            <div className={`text-[13px] ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>{item.statusLabel || '已处理'}</div>
          ) : (
            <div className="flex items-center gap-2 flex-wrap">
              <button className={cardBtnCls(isDark)} onClick={() => isExec ? bridge.executionStuckReplan(item.id) : bridge.planStuckReplan(item.id)}>📋 让 AI 重出方案</button>
              <button className={cardBtnCls(isDark, 'primary')} onClick={() => isExec ? bridge.discardPlan(item.id) : bridge.planStuckGo(item.id)}>⚡ {isExec ? '我自己来' : '直接动手(跳过方案)'}</button>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // PlanFallbackCard — AI 给了方案但没用 plan 工具
    // ==========================================
    const PlanFallbackCard = ({ item, theme }) => {
      const isDark = theme === 'dark';
      const done = item.resolved;
      return (
        <div className={cardBoxCls(isDark, isDark ? 'border-[#FDD663]/30' : 'border-[#E37400]/20')}>
          <div className={`text-[14px] font-semibold mb-2 ${isDark ? 'text-[#E3E3E3]' : 'text-[#1F1F1F]'}`}>📝 AI 给了方案但没用 plan 工具</div>
          <div className={`text-[13px] leading-relaxed mb-3 ${isDark ? 'text-[#C4C7C5]' : 'text-[#444746]'}`}>AI 在文本里描述了方案,但没调 update_plan 工具,所以没出方案卡片。你想怎么处理?</div>
