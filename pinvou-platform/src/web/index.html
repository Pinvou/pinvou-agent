<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pinvou3</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-w: 224px;
    --panel-w: 280px;
    --bg-root: #f5f3f0;
    --bg-sidebar: #1a1a1c;
    --bg-main: #fafaf8;
    --bg-panel: #f0eeea;
    --text-primary: #1a1a1c;
    --text-secondary: #6b6b6b;
    --text-sidebar: #b0b0b0;
    --text-sidebar-active: #ffffff;
    --accent: #d4731b;
    --accent-soft: #fef3e7;
    --border: #e6e4e0;
    --radius: 10px;
    --radius-sm: 6px;
    --font-display: 'Georgia', 'Noto Serif SC', serif;
    --font-body: 'Charter', 'Noto Serif SC', serif;
    --font-mono: 'Berkeley Mono', 'Fira Code', monospace;
  }

  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    font-size: 15px; line-height: 1.6;
    color: var(--text-primary);
    background: var(--bg-root);
    display: flex; overflow: hidden;
  }

  .sidebar {
    width: var(--sidebar-w); background: var(--bg-sidebar);
    color: var(--text-sidebar); display: flex;
    flex-direction: column; flex-shrink: 0; user-select: none;
  }
  .sidebar-brand { padding: 22px 20px 18px; display: flex; align-items: center; gap: 10px; }
  .sidebar-logo {
    width: 34px; height: 34px; background: var(--accent);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 18px; font-weight: 700; color: #fff;
  }
  .sidebar-brand-text h1 {
    font-family: var(--font-display); font-size: 17px; font-weight: 600;
    color: var(--text-sidebar-active); letter-spacing: 0.5px;
  }
  .sidebar-brand-text span { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.8px; color: var(--text-sidebar); }

  .sidebar-nav { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-nav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 12px; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-sidebar);
    font-family: var(--font-body); font-size: 13.5px; cursor: pointer;
    transition: all 0.15s; text-align: left;
  }
  .sidebar-nav button:hover { background: rgba(255,255,255,0.06); color: #ddd; }
  .sidebar-nav button.active { background: rgba(255,255,255,0.10); color: #fff; font-weight: 500; }
  .sidebar-nav .nav-icon { width: 18px; text-align: center; opacity: 0.7; font-size: 14px; }
  .sidebar-nav button.active .nav-icon { opacity: 1; }
  .sidebar-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #555; padding: 18px 12px 6px; }

  .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 56px; background: var(--bg-main); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px; gap: 16px; flex-shrink: 0;
  }
  .topbar-app-select {
    font-family: var(--font-display); font-size: 15px; font-weight: 600;
    border: none; background: transparent; cursor: pointer; color: var(--text-primary);
    padding: 4px 8px; border-radius: 4px;
  }
  .topbar-app-select:hover { background: #eee; }
  .topbar-divider { flex: 1; }
  .topbar-model-badge {
    font-size: 11px; color: var(--text-secondary); background: #f0eeea;
    padding: 4px 10px; border-radius: 12px; font-family: var(--font-mono); letter-spacing: 0.3px;
  }
  .topbar-status { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 6px rgba(76,175,80,0.4); transition: background 0.3s; }
  .topbar-status.loading { background: #ff9800; box-shadow: 0 0 8px rgba(255,152,0,0.5); }

  .content-grid { flex: 1; display: flex; overflow: hidden; }

  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); min-width: 0; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; }
  .chat-messages:empty::after {
    content: '选择应用，开始对话'; display: flex; align-items: center; justify-content: center;
    height: 100%; color: #ccc; font-family: var(--font-display); font-size: 18px; font-style: italic;
  }

  .msg { display: flex; gap: 12px; max-width: 85%; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .msg.assistant .msg-avatar { background: #1a1a1c; color: #fff; }
  .msg.user .msg-avatar { background: var(--accent); color: #fff; }
  .msg-bubble { padding: 12px 16px; border-radius: var(--radius); line-height: 1.65; font-size: 14.5px; overflow-x: auto; }
  .msg.assistant .msg-bubble { background: #fff; border: 1px solid var(--border); border-top-left-radius: 2px; }
  .msg.user .msg-bubble { background: #1a1a1c; color: #fff; border-top-right-radius: 2px; }
  .msg-error .msg-bubble { background: #fff0f0; border-color: #ffcdd2; color: #c62828; }
  .msg.streaming .msg-bubble::after { content: ''; }

  /* Markdown */
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 { margin: 0.6em 0 0.3em; font-family: var(--font-display); }
  .msg-bubble h3 { font-size: 1.05em; }
  .msg-bubble p { margin: 0.4em 0; }
  .msg-bubble ul, .msg-bubble ol { margin: 0.3em 0; padding-left: 1.5em; }
  .msg-bubble li { margin: 0.15em 0; }
  .msg-bubble code { font-family: var(--font-mono); font-size: 0.88em; background: #f5f3f0; padding: 1px 5px; border-radius: 3px; }
  .msg-bubble pre { background: #1a1a1c; color: #e8e8e8; padding: 14px 18px; border-radius: var(--radius-sm); overflow-x: auto; margin: 0.5em 0; font-size: 0.88em; }
  .msg-bubble pre code { background: transparent; padding: 0; color: inherit; }
  .msg-bubble strong { font-weight: 600; }
  .msg-bubble table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 0.9em; }
  .msg-bubble th, .msg-bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .msg-bubble th { background: #f5f3f0; font-weight: 600; }
  .msg-bubble blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-secondary); margin: 0.4em 0; }
  .msg-bubble hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }

  .stream-cursor { display: inline-block; width: 6px; height: 14px; background: var(--accent); animation: blink 0.8s infinite; vertical-align: middle; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  .chat-input-area { padding: 14px 24px 18px; background: var(--bg-main); border-top: 1px solid var(--border); flex-shrink: 0; }
  .chat-input-wrap { display: flex; gap: 10px; align-items: flex-end; }
  .chat-input-wrap textarea {
    flex: 1; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; font-family: var(--font-body); font-size: 14px;
    resize: none; min-height: 44px; max-height: 120px;
    outline: none; background: #fff; transition: border-color 0.2s; line-height: 1.5;
  }
  .chat-input-wrap textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chat-input-wrap button {
    height: 44px; padding: 0 20px; border: none; border-radius: var(--radius);
    background: var(--accent); color: #fff; font-family: var(--font-display);
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .chat-input-wrap button:hover { filter: brightness(1.1); }
  .chat-input-wrap button:disabled { opacity: 0.5; cursor: not-allowed; }

  .right-panel { width: var(--panel-w); background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .panel-header { padding: 16px 20px; font-family: var(--font-display); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
  .panel-steps { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .step { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm); transition: background 0.15s; cursor: default; }
  .step:hover { background: rgba(0,0,0,0.03); }
  .step-indicator { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; border: 2px solid #ccc; background: #fff; color: #999; }
  .step.active .step-indicator { border-color: var(--accent); background: var(--accent); color: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
  .step.done .step-indicator { border-color: #4caf50; background: #4caf50; color: #fff; }
  .step-body { min-width: 0; }
  .step-label { font-size: 13.5px; font-weight: 500; color: var(--text-primary); }
  .step.active .step-label { color: var(--accent); font-weight: 600; }
  .step.done .step-label { color: #999; }
  .step-hint { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; display: none; }
  .step.active .step-hint { display: block; }
  .panel-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 13px; font-style: italic; }

	  /* Choice Card Modal */
	  .choice-overlay {
	    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
	    display: flex; align-items: center; justify-content: center; z-index: 1000;
	    animation: fadeIn 0.2s ease;
	  }
	  .choice-card {
	    background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
	    max-width: 720px; width: 92%; max-height: 86vh; overflow-y: auto; padding: 28px 32px;
	  }
	  .choice-card-header {
	    font-size: 13px; font-weight: 600; color: var(--accent); text-transform: uppercase;
	    letter-spacing: 1px; margin-bottom: 8px;
	  }
	  .choice-card-question {
	    font-family: var(--font-display); font-size: 19px; font-weight: 600;
	    color: var(--text-primary); margin-bottom: 12px; line-height: 1.4;
	  }
	  .choice-card-context {
	    font-size: 14px; color: var(--text-primary); line-height: 1.65;
	    background: var(--accent-soft); border-left: 3px solid var(--accent);
	    padding: 14px 18px; border-radius: 6px; margin-bottom: 22px;
	    max-height: 360px; overflow-y: auto;
	  }
	  .choice-card-context p { margin-bottom: 8px; }
	  .choice-card-context p:last-child { margin-bottom: 0; }
	  .choice-card-context table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
	  .choice-card-context th, .choice-card-context td {
	    border: 1px solid var(--border); padding: 6px 10px; text-align: left;
	  }
	  .choice-card-context th { background: #fff; font-weight: 600; }
	  .choice-card-context strong { color: var(--accent); }
	  .choice-card-context code {
	    font-family: var(--font-mono); font-size: 12.5px;
	    background: #fff; padding: 1px 5px; border-radius: 3px;
	  }
	  .choice-card-context ul, .choice-card-context ol { margin: 6px 0 6px 22px; }
	  .choice-option {
	    display: block; width: 100%; text-align: left; padding: 16px 20px;
	    margin-bottom: 10px; border: 2px solid var(--border); border-radius: 10px;
	    background: #fafaf8; cursor: pointer; transition: all 0.15s;
	    font-family: var(--font-body); font-size: 14px; color: var(--text-primary);
	    line-height: 1.55;
	  }
	  .choice-option:hover {
	    border-color: var(--accent); background: var(--accent-soft);
	    transform: translateX(2px);
	  }
	  .choice-option .opt-label { font-weight: 700; font-size: 15px; display: block; margin-bottom: 6px; }
	  .choice-option .opt-desc { font-size: 13.5px; color: var(--text-primary); }
	  .choice-option .opt-desc p { margin: 0 0 4px 0; }
	  .choice-option .opt-desc p:last-child { margin-bottom: 0; }
	  .choice-option .opt-desc strong { color: var(--text-primary); }
	  .choice-option .opt-desc code {
	    font-family: var(--font-mono); font-size: 12.5px;
	    background: #fff; padding: 1px 5px; border-radius: 3px;
	  }
	  .choice-option .opt-desc ul, .choice-option .opt-desc ol {
	    margin: 4px 0 4px 20px;
	  }
	  .choice-option.recommended { border-color: var(--accent); }
	  .choice-option.recommended .opt-label::after {
	    content: '推荐'; font-size: 11px; font-weight: 600; color: #fff;
	    background: var(--accent); padding: 1px 8px; border-radius: 10px; margin-left: 8px;
	    vertical-align: middle;
	  }
	  .choice-other {
	    display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
	  }
	  .choice-other input {
	    flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px;
	    font-family: var(--font-body); font-size: 13px; outline: none;
	  }
	  .choice-other input:focus { border-color: var(--accent); }
	  .choice-other button {
	    padding: 8px 16px; border: none; border-radius: 6px; background: var(--accent);
	    color: #fff; font-weight: 600; cursor: pointer; font-size: 13px;
	  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-logo">品</div>
    <div class="sidebar-brand-text"><h1>pinvou3</h1><span>AI Workspace</span></div>
  </div>
  <nav class="sidebar-nav">
    <button class="active" data-view="chat"><span class="nav-icon">💬</span><span>聊天室</span></button>
    <div class="sidebar-section-label">应用</div>
    <button data-app="data_analysis"><span class="nav-icon">📊</span><span>数据分析</span></button>
    <button data-app="doc_generation"><span class="nav-icon">📝</span><span>文档生成</span></button>
    <button data-app="planning"><span class="nav-icon">🎯</span><span>计划制定</span></button>
    <button data-app="qa"><span class="nav-icon">💬</span><span>简单问答</span></button>
    <button data-app="generic"><span class="nav-icon">🔧</span><span>通用任务</span></button>
  </nav>
</aside>

<div class="main-area">
  <div class="topbar">
    <span class="topbar-hint">直接输入需求，AI 自动选择 agent 并拆解任务</span>
    <span class="topbar-divider"></span>
    <span class="topbar-model-badge" id="modelBadge">deepseek-v3</span>
    <span class="topbar-status" id="statusDot" title="已连接"></span>
  </div>

  <div class="content-grid">
    <div class="chat-area">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <div class="chat-input-wrap">
          <textarea id="chatInput" placeholder="输入消息... Shift+Enter 换行, Esc 中断" rows="1" disabled></textarea>
          <button id="sendBtn" disabled>发送</button>
        </div>
      </div>
    </div>

    <aside class="right-panel" id="milestonePanel">
      <div class="panel-header">步骤引导</div>
      <div class="panel-steps" id="stepList"><div class="panel-empty">选择应用后显示步骤</div></div>
    </aside>
  </div>
</div>


<!-- Choice Card Overlay -->
<div id="choiceOverlay" class="choice-overlay" style="display:none">
  <div class="choice-card" id="choiceCard"></div>
</div>
<script>
marked.setOptions({ breaks: true, gfm: true });

const state = {
  milestones: [], streaming: false, abortController: null, pendingChoice: null
};

// 流式渲染节流器：每个流式消息一个 renderer，每帧最多 marked.parse 一次。
// 修复 Problem 1：之前每个 SSE delta 都触发 marked.parse(fullText) +
// innerHTML 替换 + scroll reflow，O(N²) 复杂度让前端跟不上 LLM 输出速度。
function createStreamRenderer(streamDiv, getFullText) {
  let pending = null;
  const doRender = () => {
    streamDiv.querySelector('.msg-bubble').innerHTML = marked.parse(getFullText());
    chatMessages.scrollTop = chatMessages.scrollHeight;
    pending = null;
  };
  return {
    schedule() {
      // 已经排了一帧，丢弃本次（合并多个 delta 到下一帧）
      if (pending != null) return;
      pending = requestAnimationFrame(doRender);
    },
    flush() {
      // 流结束 / choice 切换前立即同步渲染最新文本
      if (pending != null) { cancelAnimationFrame(pending); pending = null; }
      doRender();
    },
  };
}

const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const stepList = document.getElementById('stepList');
const statusDot = document.getElementById('statusDot');

// 启动即可用：不需要选择 App
chatInput.disabled = false;
sendBtn.disabled = false;
fetchMilestones();

// 侧边栏快捷入口：把 agent id 作为 /use 命令直接发出去
document.querySelectorAll('[data-app]').forEach(btn => {
  btn.addEventListener('click', () => {
    chatInput.value = `/use ${btn.dataset.app}`;
    sendMessage();
  });
});

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || state.streaming) return;

  chatInput.value = ''; chatInput.style.height = 'auto';
  chatInput.disabled = true; sendBtn.disabled = true; sendBtn.textContent = '…';
  state.streaming = true; statusDot.classList.add('loading');
  addMsg('user', text);
  const streamDiv = addStreamingMsg();

  try {
    state.abortController = new AbortController();
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
      signal: state.abortController.signal,
    });
    if (!resp.ok) { const err = await resp.json().catch(() => ({ error: resp.statusText })); throw new Error(err.error || `HTTP ${resp.status}`); }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', fullText = '';
    const renderer = createStreamRenderer(streamDiv, () => fullText);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n'); buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        try { const p = JSON.parse(data); if (p.error) throw new Error(p.error);
          if (p.milestone) { fetchMilestones(); }
          if (p.done) continue;
          if (p.choice_request) {
            streamDiv.classList.remove('streaming');
            renderer.flush();
            showChoiceCard(p.choice_request);
          } else if (p.delta) { fullText += p.delta; renderer.schedule(); }
        } catch(e) { if (!e.message.includes('JSON')) throw e; }
      }
    }
    streamDiv.classList.remove('streaming');
    renderer.flush();
  } catch (e) {
    streamDiv.classList.remove('streaming');
    if (e.name === 'AbortError') {
      streamDiv.querySelector('.msg-bubble').innerHTML += ' <em style="color:#999">[已中断]</em>';
    } else {
      streamDiv.classList.add('msg-error');
      streamDiv.querySelector('.msg-bubble').innerHTML = `引擎错误: ${escapeHtml(e.message)}`;
    }
  } finally {
    state.streaming = false; state.abortController = null;
    if (!state.pendingChoice) { chatInput.disabled = false; sendBtn.disabled = false; sendBtn.textContent = '发送'; chatInput.focus(); }
    statusDot.classList.remove('loading');
    // 刷新里程碑状态
    setTimeout(fetchMilestones, 500);
  }
}

function addStreamingMsg() {
  const div = document.createElement('div'); div.className = 'msg assistant streaming';
  div.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-bubble"></div>';
  chatMessages.appendChild(div); return div;
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  if (e.key === 'Escape' && state.streaming && state.abortController) { state.abortController.abort(); }
});
chatInput.addEventListener('input', () => { chatInput.style.height = 'auto'; chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px'; });

function addMsg(role, content, isError) {
  const div = document.createElement('div'); div.className = `msg ${role}` + (isError ? ' msg-error' : '');
  div.innerHTML = `<div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div><div class="msg-bubble">${role === 'user' ? escapeHtml(content) : marked.parse(content)}</div>`;
  chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight;
}

function addSystemMsg(content) {
  const div = document.createElement('div'); div.style.cssText = 'text-align:center;color:#aaa;font-size:12.5px;padding:8px 0;font-style:italic';
  div.textContent = content; chatMessages.appendChild(div);
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function fetchMilestones() {
  try {
    const resp = await fetch('/api/milestones');
    const data = await resp.json();
    if (data.milestones && data.milestones.length > 0) {
      state.milestones = data.milestones;
    }
  } catch(e) { /* 忽略 */ }
  renderMilestones();
}

function renderMilestones() {
  if (state.milestones.length === 0) { stepList.innerHTML = '<div class="panel-empty">输入需求后将显示步骤</div>'; return; }
  stepList.innerHTML = state.milestones.map(m => `
    <div class="step ${m.status}">
      <div class="step-indicator">${m.status === 'done' ? '✓' : m.status === 'active' ? '●' : '○'}</div>
      <div class="step-body"><div class="step-label">${m.label}</div><div class="step-hint">${m.hint || ''}</div></div>
    </div>`).join('');
}

// === Choice Card ===
function showChoiceCard(data) {
  const questions = data.questions || [];
  if (!questions || questions.length === 0) return;
  state.pendingChoice = {
    callId: data.call_id,
    questions,
    // 选项卡上方的 LLM 论证段（backend strip_tool_banners 清洗过）。
    // 多个 question 时所有 question 共享同一段 context（来自同一次 LLM 调用之前的文字）。
    context: data.context || '',
    currentIndex: 0,
    answers: [],
  };
  renderChoiceQuestion();
  document.getElementById('choiceOverlay').style.display = 'flex';
  chatInput.disabled = true; sendBtn.disabled = true;
}

function renderChoiceQuestion() {
  const pc = state.pendingChoice;
  if (!pc) return;
  const q = pc.questions[pc.currentIndex];
  const total = pc.questions.length;
  const card = document.getElementById('choiceCard');

  // context 仅在第一题渲染，避免多 question 时重复刷屏。
  const contextHtml = (pc.currentIndex === 0 && pc.context && pc.context.trim().length > 0)
    ? `<div class="choice-card-context">${marked.parse(pc.context)}</div>`
    : '';

  const optionsHtml = q.options.map((opt, i) => {
    const safeId = q.id.replace(/'/g, "\\'");
    const safeLabel = (opt.label || '').replace(/'/g, "\\'");
    const isRecommended = opt.recommended === true ? ' recommended' : '';
    const desc = opt.description || '';
    return `<button class="choice-option${isRecommended}" onclick="selectChoice('${safeId}', '${safeLabel}', '${safeLabel}')" data-key="${i+1}">
      <span class="opt-label">${i+1}. ${escapeHtml(opt.label || '')}</span>
      <span class="opt-desc">${marked.parse(desc)}</span>
    </button>`;
  }).join('');

  card.innerHTML = `
    <div class="choice-card-header">${escapeHtml(q.header)}${total > 1 ? ` (${pc.currentIndex + 1}/${total})` : ''}</div>
    <div class="choice-card-question">${escapeHtml(q.question)}</div>
    ${contextHtml}
    ${optionsHtml}
    <div class="choice-other">
      <input type="text" id="choiceOtherInput" placeholder="或输入自定义内容…" onkeydown="if(event.key==='Enter')submitOtherChoice('${q.id.replace(/'/g, "\\'")}')">
      <button onclick="submitOtherChoice('${q.id.replace(/'/g, "\\'")}')">发送</button>
    </div>
    <div style="text-align:center;margin-top:12px">
      <button onclick="skipChoice()" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:12px;text-decoration:underline">跳过 · 让 AI 自己决定</button>
    </div>
  `;

  setTimeout(() => { const f = card.querySelector('.choice-option'); if (f) f.focus(); }, 100);
}

function selectChoice(id, label, value) {
  const pc = state.pendingChoice;
  if (!pc) return;
  pc.answers.push({ id, label, value });
  if (pc.currentIndex + 1 < pc.questions.length) {
    pc.currentIndex++;
    renderChoiceQuestion();
  } else {
    submitChoice(pc.answers);
  }
}

function submitOtherChoice(id) {
  const input = document.getElementById('choiceOtherInput');
  const val = input.value.trim();
  if (!val) return;
  const pc = state.pendingChoice;
  if (!pc) return;
  pc.answers.push({ id: id, label: 'Other', value: val });
  if (pc.currentIndex + 1 < pc.questions.length) {
    pc.currentIndex++;
    renderChoiceQuestion();
  } else {
    submitChoice(pc.answers);
  }
}

async function submitChoice(answers) {
  document.getElementById('choiceOverlay').style.display = 'none';
  const pc = state.pendingChoice;
  if (!pc) return;
  state.pendingChoice = null;

  const choiceText = answers.map(a => `${a.label}: ${a.value}`).join(', ');
  addSystemMsg(`选择: ${choiceText}`);

  state.streaming = true; statusDot.classList.add('loading');
  const streamDiv = addStreamingMsg();
  state.abortController = new AbortController();

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: '',
        tool_result: { call_id: pc.callId, answers: answers },
      }),
      signal: state.abortController.signal,
    });
    if (!resp.ok) { const err = await resp.json().catch(() => ({ error: resp.statusText })); throw new Error(err.error || `HTTP ${resp.status}`); }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', fullText = '';
    const renderer = createStreamRenderer(streamDiv, () => fullText);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n'); buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        try { const p = JSON.parse(data); if (p.error) throw new Error(p.error);
          if (p.milestone) { fetchMilestones(); }
          if (p.done) continue;
          if (p.choice_request) {
            streamDiv.classList.remove('streaming');
            renderer.flush();
            showChoiceCard(p.choice_request);
          } else if (p.delta) { fullText += p.delta; renderer.schedule(); }
        } catch(e) { if (!e.message.includes('JSON')) throw e; }
      }
    }
    streamDiv.classList.remove('streaming');
    renderer.flush();
  } catch (e) {
    streamDiv.classList.remove('streaming');
    if (e.name === 'AbortError') {
      streamDiv.querySelector('.msg-bubble').innerHTML += ' <em style="color:#999">[已中断]</em>';
    } else {
      streamDiv.classList.add('msg-error');
      streamDiv.querySelector('.msg-bubble').innerHTML = `错误: ${escapeHtml(e.message)}`;
    }
  } finally {
    state.streaming = false; state.abortController = null;
    if (!state.pendingChoice) { chatInput.disabled = false; sendBtn.disabled = false; sendBtn.textContent = "发送"; chatInput.focus(); }
    statusDot.classList.remove('loading');
    setTimeout(fetchMilestones, 500);
  }
}

async function skipChoice() {
  const pc = state.pendingChoice;
  if (!pc) return;
  const callId = pc.callId;
  document.getElementById('choiceOverlay').style.display = 'none';
  state.pendingChoice = null;

        } catch(e) { if (!e.message.includes('JSON')) throw e; }
      }
    }

  } catch (e) {
    streamDiv.classList.remove('streaming');
    if (e.name === 'AbortError') {
      streamDiv.querySelector('.msg-bubble').innerHTML += ' <em style="color:#999">[已中断]</em>';
    } else {
      streamDiv.classList.add('msg-error');
      streamDiv.querySelector('.msg-bubble').innerHTML = `错误: ${escapeHtml(e.message)}`;
    }
  } finally {
    state.streaming = false; state.abortController = null;
    if (!state.pendingChoice) { chatInput.disabled = false; sendBtn.disabled = false; sendBtn.textContent = '发送'; chatInput.focus(); }
    statusDot.classList.remove('loading');
    setTimeout(fetchMilestones, 500);
  }
}

// Overlay background click: no-op (must explicitly choose or skip)
document.getElementById('choiceOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) { /* blocked — use "跳过" button instead */ }
});

// Esc key dismisses card with skip
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.pendingChoice) {
    skipChoice();
  }
});
</script>
