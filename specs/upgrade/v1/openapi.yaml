  "components": {
    "securitySchemes": {
      "managementIdentity": {
        "type": "apiKey",
        "in": "header",
        "name": "Authorization",
        "description": "Opaque identity from the later T05 provider; scopes, MFA and approvals are rechecked on the server."
      }
    },
    "schemas": {
      "common": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$defs": {
          "identifier": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
          },
          "hash": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "version": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
          },
          "integer": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991
          },
          "positive": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "text": {
            "type": "string",
            "minLength": 1,
            "maxLength": 65536
          },
          "channel": {
            "enum": [
              "stable",
              "beta",
              "internal"
            ]
          },
          "targetKey": {
            "enum": [
              "windows-x86_64-nsis-perMachine",
              "linux-x86_64-deb-perMachine",
              "linux-arm64-deb-perMachine",
              "macos-universal-dmg-perMachine"
            ]
          },
          "byteIdentity": {
            "type": "object",
            "properties": {
              "size": {
                "type": "integer",
                "minimum": 1,
                "maximum": 9007199254740991
              },
              "sha256": {
                "type": "string",
                "pattern": "^[0-9a-f]{64}$"
              }
            },
            "required": [
              "size",
              "sha256"
            ],
            "additionalProperties": false
          },
          "metadataReference": {
            "type": "object",
            "properties": {
              "role": {
                "enum": [
                  "root",
                  "timestamp",
                  "snapshot",
                  "target",
                  "release",
                  "package"
                ]
              },
              "scope": {
                "type": "object",
                "maxProperties": 4,
                "additionalProperties": {
                  "type": "string",
                  "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
                }
              },
              "version": {
                "anyOf": [
                  {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 9007199254740991
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "expiresAt": {
                "anyOf": [
                  {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 9007199254740991
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "size": {
                "type": "integer",
                "minimum": 1,
                "maximum": 1048576
              },
              "envelopeSha256": {
                "type": "string",
                "pattern": "^[0-9a-f]{64}$"
              }
            },
            "required": [
              "role",
              "scope",
              "version",
              "expiresAt",
              "size",
              "envelopeSha256"
            ],
            "additionalProperties": false
          },
          "nativeIdentity": {
            "type": "object",
            "properties": {
              "size": {
                "type": "integer",
                "minimum": 1,
                "maximum": 9007199254740991
              },
              "sha256": {
                "type": "string",
                "pattern": "^[0-9a-f]{64}$"
              },
              "identity": {
                "type": "string",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
              },
              "publisher": {
                "type": "string",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
              },
              "format": {
                "enum": [
                  "nsis",
                  "deb",
                  "dmg",
                  "helper",
                  "launcher"
                ]
              }
            },
            "required": [
              "size",
              "sha256",
              "identity",
              "publisher",
              "format"
            ],
            "additionalProperties": false
          },
          "supplyChain": {
            "type": "object",
            "properties": {
              "approvalId": {
                "type": "string",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
              },
              "revision": {
                "type": "integer",
                "minimum": 1,
                "maximum": 9007199254740991
              },
              "effectiveExpiresAt": {
                "anyOf": [
                  {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 9007199254740991
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": [
              "approvalId",
              "revision",
              "effectiveExpiresAt"
            ],
            "additionalProperties": false
          },
          "planReference": {
            "type": "object",
            "properties": {
              "planId": {
                "type": "string",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
              },
              "revision": {
                "type": "integer",
                "minimum": 1,
                "maximum": 9007199254740991
              },
              "sha256": {
                "type": "string",
                "pattern": "^[0-9a-f]{64}$"
              }
            },
            "required": [
              "planId",
              "revision",
              "sha256"
            ],
            "additionalProperties": false
          },
          "plans": {
            "type": "object",
            "properties": {
              "installation": {
                "$ref": "#/components/schemas/common/$defs/planReference"
              },
              "migration": {
                "anyOf": [
                  {
                    "$ref": "#/components/schemas/common/$defs/planReference"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "backup": {
                "anyOf": [
                  {
                    "$ref": "#/components/schemas/common/$defs/planReference"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "helperMigration": {
